<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OX 플래시카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080d;
  --bg2:#0d0d15;
  --surface:#15151f;
  --surface2:#1c1c28;
  --border:#2a2a3a;
  --text:#f2f2f8;
  --text-dim:#8d8da3;
  --cyan:#00e6f6;
  --violet:#9d6bff;
  --green:#33ffab;
  --red:#ff3d68;
  --green-glow: radial-gradient(circle at 50% 20%, rgba(51,255,171,0.35), rgba(8,8,13,0.97) 65%);
  --red-glow: radial-gradient(circle at 50% 20%, rgba(255,61,104,0.35), rgba(8,8,13,0.97) 65%);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:'Noto Sans KR',sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.display{font-family:'Black Han Sans','Noto Sans KR',sans-serif; letter-spacing:0.5px;}
#app{min-height:100vh; display:flex; flex-direction:column;}
::selection{background:var(--violet); color:#fff;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* ---------- shared ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:14px 16px;
  background:rgba(8,8,13,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.iconbtn{
  width:38px; height:38px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  display:flex; align-items:center; justify-content:center; font-size:18px;
  transition:.15s;
}
.iconbtn:active{transform:scale(0.92);}
.iconbtn.on{color:#08080d; background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 14px rgba(0,230,246,0.6);}

.pill{
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.pill:active{transform:scale(0.96);}
.pill.cyan{border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 rgba(0,230,246,0); }
.pill.violet{border-color:var(--violet); color:var(--violet);}
.pill.red{border-color:var(--red); color:var(--red);}

/* ---------- HOME ---------- */
.home-wrap{flex:1; padding:28px 18px 96px; max-width:880px; margin:0 auto; width:100%;}
.hero{text-align:center; padding:18px 0 22px;}
.hero h1{
  font-size:34px; margin:0 0 6px; font-family:'Noto Sans KR',sans-serif; font-weight:900; letter-spacing:0.3px;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 30px rgba(0,230,246,0.25);
}
.hero p{color:var(--text-dim); font-size:13.5px; margin:0; letter-spacing:0.5px;}
.divider{height:2px; width:64px; margin:14px auto 0; background:linear-gradient(90deg,var(--cyan),var(--violet)); border-radius:2px;}

.quick-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:22px 0 26px;}
.quick-btn{
  flex:1; min-width:104px; padding:14px 10px; border-radius:16px;
  background:var(--surface); border:1px solid var(--border); color:var(--text);
  font-weight:700; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px;
  transition:.15s;
}
.quick-btn .n{font-size:20px;}
.quick-btn:active{transform:scale(0.96);}
.quick-btn.primary{border-color:var(--cyan); box-shadow:0 0 18px rgba(0,230,246,0.18); color:var(--cyan);}
.quick-btn.wrong{border-color:var(--red); color:var(--red);}
.quick-btn.bookmark{border-color:var(--violet); color:var(--violet);}

.section-label{font-size:12px; color:var(--text-dim); font-weight:700; letter-spacing:1.5px; margin:6px 4px 10px; text-transform:uppercase;}

.part-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.part-card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:14px 14px 12px; text-align:left; color:var(--text); position:relative; overflow:hidden;
  transition:.15s;
}
.part-card:active{transform:scale(0.97);}
.part-card.done{border-color:var(--green);}
.part-num{
  font-family:'Black Han Sans',sans-serif; font-size:12px; color:var(--bg); background:var(--cyan);
  display:inline-flex; padding:3px 8px; border-radius:8px; margin-bottom:8px;
}
.part-name{font-size:13.5px; font-weight:700; line-height:1.3; margin-bottom:10px; min-height:34px;}
.part-progress-track{height:5px; background:var(--surface2); border-radius:4px; overflow:hidden;}
.part-progress-fill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet)); border-radius:4px;}
.part-progress-txt{font-size:10.5px; color:var(--text-dim); margin-top:6px;}
.check{position:absolute; top:10px; right:10px; color:var(--green); font-size:15px;}

/* ---------- STUDY ---------- */
.study-wrap{flex:1; display:flex; flex-direction:column; max-width:640px; margin:0 auto; width:100%; padding:0 16px 92px;}
.progress-line{height:4px; background:var(--surface2); border-radius:0;}
.progress-line-fill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .25s;}

.quizbar{display:flex; justify-content:center; padding:12px 16px 0;}
.quiz-toggle-btn{
  display:flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim);
  font-weight:700; font-size:13px; letter-spacing:0.2px; transition:.15s;
}
.quiz-toggle-btn .dot{width:7px; height:7px; border-radius:50%; background:var(--text-dim);}
.quiz-toggle-btn.mode-study{border-color:var(--green); color:var(--green); box-shadow:0 0 16px rgba(51,255,171,0.25); background:rgba(51,255,171,0.08);}
.quiz-toggle-btn.mode-study .dot{background:var(--green); box-shadow:0 0 8px var(--green);}
.quiz-toggle-btn.mode-quiz{border-color:var(--red); color:var(--red); box-shadow:0 0 16px rgba(255,61,104,0.25); background:rgba(255,61,104,0.08);}
.quiz-toggle-btn.mode-quiz .dot{background:var(--red); box-shadow:0 0 8px var(--red);}
.quiz-toggle-btn:active{transform:scale(0.96);}

.study-top-info{display:flex; align-items:center; justify-content:space-between; padding:14px 2px 4px; font-size:12.5px; color:var(--text-dim);}
.study-top-info b{color:var(--text); font-weight:700;}

.card-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:14px 0;}
.card{
  width:100%; max-width:560px; min-height:420px; border-radius:26px; position:relative;
  background:var(--surface); border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
  display:flex; flex-direction:column; padding:26px 24px 22px; overflow:hidden;
  transition:box-shadow .25s;
  touch-action:pan-y;
}
.card.flipped.o{background:var(--green-glow); border-color:var(--green); box-shadow:0 0 60px rgba(51,255,171,0.25), 0 20px 60px rgba(0,0,0,0.5);}
.card.flipped.x{background:var(--red-glow); border-color:var(--red); box-shadow:0 0 60px rgba(255,61,104,0.25), 0 20px 60px rgba(0,0,0,0.5);}

.card-eyebrow{font-size:11.5px; color:var(--violet); font-weight:700; letter-spacing:1px; margin-bottom:14px; text-transform:uppercase; display:flex; align-items:center; gap:8px;}
.bookmark-star{margin-left:auto; font-size:18px; color:var(--text-dim); background:none; border:none;}
.bookmark-star.on{color:var(--violet);}

.card-question{
  font-size:19px; line-height:1.55; font-weight:700; flex:1; display:flex; align-items:center;
  color:var(--text);
}
.card-hint{text-align:center; font-size:12px; color:var(--text-dim); margin-top:10px;}

.quiz-choice-row{display:flex; gap:12px; margin-top:16px;}
.quiz-choice{
  flex:1; padding:16px; border-radius:16px; font-family:'Black Han Sans',sans-serif; font-size:22px;
  background:var(--surface2); border:2px solid var(--border); color:var(--text);
}
.quiz-choice.o{color:var(--green); border-color:rgba(51,255,171,0.3);}
.quiz-choice.x{color:var(--red); border-color:rgba(255,61,104,0.3);}
.quiz-choice:active{transform:scale(0.95);}
.mic-btn{
  flex:none; width:54px; border-radius:16px; background:var(--surface2); border:2px solid var(--border);
  color:var(--cyan); font-size:20px; display:flex; align-items:center; justify-content:center;
}
.mic-btn:active{transform:scale(0.95);}
.mic-btn.listening{border-color:var(--cyan); background:rgba(0,230,246,0.15); animation:mic-pulse 1s infinite;}
@keyframes mic-pulse{
  0%{box-shadow:0 0 0 0 rgba(0,230,246,0.5);}
  70%{box-shadow:0 0 0 12px rgba(0,230,246,0);}
  100%{box-shadow:0 0 0 0 rgba(0,230,246,0);}
}
.voice-debug{margin-top:8px; font-size:11.5px; color:var(--text-dim); text-align:center; min-height:14px; word-break:break-all;}

.reveal-watermark{
  position:absolute; top:-10px; right:-6px; font-family:'Black Han Sans',sans-serif; font-size:170px;
  opacity:0.10; line-height:1; pointer-events:none; user-select:none;
}
.card.flipped.o .reveal-watermark{color:var(--green);}
.card.flipped.x .reveal-watermark{color:var(--red);}

.reveal-badge{
  display:inline-flex; align-items:center; gap:8px; font-family:'Black Han Sans',sans-serif; font-size:15px;
  padding:6px 16px; border-radius:999px; margin-bottom:14px; align-self:flex-start;
}
.card.flipped.o .reveal-badge{background:rgba(51,255,171,0.15); color:var(--green); border:1px solid var(--green);}
.card.flipped.x .reveal-badge{background:rgba(255,61,104,0.15); color:var(--red); border:1px solid var(--red);}

.my-pick{font-size:12px; color:var(--text-dim); margin-bottom:10px;}
.my-pick b{color:var(--text);}

.result-banner{
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:16px;
  font-family:'Black Han Sans',sans-serif; font-size:19px; margin-bottom:16px;
  animation:pop .25s ease;
}
.result-banner.correct{background:rgba(51,255,171,0.16); border:2px solid var(--green); color:var(--green);}
.result-banner.incorrect{background:rgba(255,61,104,0.16); border:2px solid var(--red); color:var(--red);}
.result-banner .icon{font-size:24px;}
.result-sub{font-size:12px; font-family:'Noto Sans KR',sans-serif; font-weight:500; opacity:0.85; margin-top:2px;}
@keyframes pop{ from{ transform:scale(0.85); opacity:0; } to{ transform:scale(1); opacity:1; } }

.reveal-q{font-size:15px; color:var(--text-dim); margin-bottom:14px; line-height:1.5; font-weight:500;}
.reveal-exp{font-size:18px; line-height:1.65; font-weight:500; color:#fff; overflow-y:auto; max-height:100%;}
.reveal-exp-label{font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:1px; margin-bottom:6px; text-transform:uppercase;}

.nav-row{display:flex; align-items:center; gap:10px; margin-top:4px;}
.nav-btn{
  flex:1; padding:15px; border-radius:16px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); font-weight:700; font-size:14.5px;
}
.nav-btn:active{transform:scale(0.97);}
.nav-btn:disabled{opacity:0.35;}
.nav-btn.remove{flex:none; width:52px; color:var(--red); border-color:rgba(255,61,104,0.4);}

.empty{flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--text-dim); text-align:center; padding:40px 20px;}
.empty .big{font-size:40px;}

@media (min-width:640px){
  .card{min-height:460px;}
  .card-question{font-size:21px;}
}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:45; display:flex; background:rgba(8,8,13,0.94); backdrop-filter:blur(10px); border-top:1px solid var(--border); padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; color:var(--text-dim); background:none; border:none; font-size:10px; font-weight:700;}
.nav-item .ic{font-size:18px;}
.nav-item.active{color:var(--cyan);}
.nav-item:active{transform:scale(0.94);}

/* ---------- LIST ---------- */
.list-filter, .list-search{width:100%; background:var(--surface2); border:1.5px solid var(--border); color:var(--text); padding:11px 14px; border-radius:12px; font-size:13.5px; margin-bottom:10px;}
.list-search{margin-bottom:16px;}
.list-group-label{font-size:11.5px; color:var(--violet); font-weight:700; letter-spacing:0.5px; margin:18px 2px 8px; text-transform:uppercase;}
.list-row{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; margin-bottom:8px;}
.list-row-main{display:flex; align-items:center; gap:8px;}
.list-idx{font-family:'Black Han Sans',sans-serif; font-size:11px; color:var(--text-dim); flex:none; width:20px;}
.list-q{flex:1; font-size:13px; line-height:1.4; font-weight:500;}
.list-badge{font-family:'Black Han Sans',sans-serif; font-size:12px; padding:2px 9px; border-radius:999px; flex:none;}
.list-badge.o{background:rgba(51,255,171,0.15); color:var(--green); border:1px solid var(--green);}
.list-badge.x{background:rgba(255,61,104,0.15); color:var(--red); border:1px solid var(--red);}
.list-exp{margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; line-height:1.6; color:var(--text-dim);}
.list-exp .no-exp{font-style:italic;}

/* ---------- DATA MANAGE ---------- */
.dm-card{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; font-size:13px; color:var(--text-dim);}
.dm-card b{color:var(--text); font-size:14px;}
.dm-action{width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:14px 16px; border-radius:14px; margin-bottom:10px; font-weight:700; font-size:13.5px;}
.dm-action.danger{color:var(--red); border-color:rgba(255,61,104,0.35);}
.dm-action:active{transform:scale(0.98);}
.datatools-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:10px;}
.datatools-btn{flex:1; min-width:96px; padding:11px 8px; border-radius:14px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); font-size:11.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:5px;}
.datatools-btn .n{font-size:17px;}
.datatools-btn:active{transform:scale(0.96);}
.datatools-btn.accent{color:var(--cyan); border-color:rgba(0,230,246,0.35);}
.toast{position:fixed; left:50%; bottom:78px; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); color:var(--text); padding:12px 20px; border-radius:14px; font-size:13px; font-weight:600; z-index:80; box-shadow:0 10px 30px rgba(0,0,0,0.5); max-width:88vw; text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW = {"parts":["민법서론·법원·효력","신의칙·권리남용","권리와의무·능력","주소·부재와실종","법인","물건","법률행위목적·사회적타당성","법률행위해석·무효행위전환","기간과 기간의 계산","소멸시효","의사표시","대리","무효와취소","조건과기한","물권법 총론","부동산 물권변동과 등기","동산물권변동과 선의취득","점유권","소유권·취득시효·첨부","공동소유","용익물권","담보물권","채권총론 핵심","책임재산 보전","다수당사자 채권관계","계약총론 핵심","매매 핵심","임대차 핵심","기타계약 핵심","부당이득·불법행위"],"items":[{"p":1,"q":"민법은 개인 상호 간의 사법상 생활관계를 규율하는 사법이다.","a":"O","e":"민법은 국가와 국민의 권력관계를 직접 규율하는 공법이 아니라, 사인 사이의 생활관계를 규율하는 사법이다."},{"p":1,"q":"민법은 사법 중 일반법이므로, 상법과 충돌하면 원칙적으로 민법이 상법에 우선한다.","a":"X","e":"민법은 일반법이고 상법은 상인 거래에 관한 특별법이다. 특별법인 상법이 민법보다 우선한다."},{"p":1,"q":"상관습법은 상거래 영역에서는 성문민법보다 특별법적 지위를 가질 수 있다.","a":"O","e":"상관습법은 상법 영역의 특별법적 관습으로서 성문민법과 충돌하면 우선할 수 있다."},{"p":1,"q":"민법은 권리와 의무의 발생·변경·소멸을 정하는 실체법이다.","a":"O","e":"민법은 분쟁 절차를 정하는 절차법이 아니라 사법상 권리·의무의 실체를 정하는 법이다."},{"p":1,"q":"민법은 행위규범일 뿐이고, 법원이 재판할 때 기준이 되는 재판규범은 아니다.","a":"X","e":"민법은 사인의 행위 기준이면서 동시에 법원의 재판 기준이 되는 재판규범이다."},{"p":1,"q":"형식적 의미의 민법은 민법전 자체를 말하고, 실질적 의미의 민법은 민사생활관계를 규율하는 모든 법규범을 말한다.","a":"O","e":"형식적 민법은 민법전이고, 실질적 민법은 민법전뿐 아니라 민사에 관한 성문·불문 규범까지 포함한다."},{"p":1,"q":"형식적 의미의 민법과 실질적 의미의 민법의 범위는 언제나 일치한다.","a":"X","e":"민사관계를 규율하는 특별법·관습법 등도 실질적 민법에 포함될 수 있어 양자는 반드시 일치하지 않는다."},{"p":1,"q":"민법 제1조는 실질적 의미의 민법의 법원과 그 적용 순서를 정한 규정이다.","a":"O","e":"제1조는 민사에 관하여 법률, 관습법, 조리 순서로 적용한다고 정한다."},{"p":1,"q":"민사에 관하여 법률이 없으면 조리에 의하고, 조리도 없을 때 관습법에 의한다.","a":"X","e":"순서가 틀렸다. 민법 제1조는 법률 → 관습법 → 조리의 순서다."},{"p":1,"q":"판례는 민법 제1조의 법원에 포함되지 않는다는 것이 원칙적 입장이다.","a":"O","e":"판례의 법원성은 부정된다. 판례는 사실상 영향력이 크지만 제1조의 법원은 아니다."},{"p":1,"q":"대법원 판례는 유사한 다른 사건에 관하여 모든 하급심을 법률상 기속한다.","a":"X","e":"상급법원 판단은 당해 사건에 관하여 하급심을 기속할 뿐, 유사 사건 전반에 일반적 법규범처럼 기속하는 것은 아니다."},{"p":1,"q":"관습법은 사회의 반복된 관행에 법적 확신이 더해져 법원으로 인정되는 규범이다.","a":"O","e":"단순 관행이 아니라 법적 구속력에 대한 확신과 법원의 확인이 문제되는 규범이다."},{"p":1,"q":"사실인 관습은 법적 확신이 인정되어 민법 제1조의 법원으로 작용한다.","a":"X","e":"사실인 관습은 관습법과 달리 법원이 아니라, 주로 법률행위 해석이나 계약 내용 보충의 자료가 된다."},{"p":1,"q":"관습법은 원칙적으로 법원이 직권으로 판단하고, 사실인 관습은 원칙적으로 당사자가 주장·입증한다.","a":"O","e":"관습법은 법규범이므로 직권 판단 대상이고, 사실인 관습은 사실 문제로서 주장·입증 대상이 원칙이다."},{"p":1,"q":"사실인 관습도 강행규정이 위임한 경우에는 법적인 효력을 가질 수 있다.","a":"O","e":"강행규정 자체가 사실인 관습에 따르도록 위임했다면 그 범위에서 법적 효력이 부여될 수 있다."},{"p":1,"q":"관습법은 헌법에 합치될 필요가 없고, 헌법재판소 심판대상도 될 수 없다.","a":"X","e":"관습법도 실질적으로 법률로서 기능하므로 헌법에 합치해야 하고 위헌심판의 대상이 될 수 있다."},{"p":1,"q":"종중 구성원 자격을 성년 남자로만 제한한 종래의 관습법은 현재도 유효하다.","a":"X","e":"성년 남자로만 제한하는 종래 관습법은 헌법적 가치에 맞지 않아 더 이상 효력을 인정받기 어렵다."},{"p":1,"q":"국가 입법기능이 강화되면서 관습법의 범위나 역할은 상대적으로 축소되는 경향이 있다.","a":"O","e":"성문법 중심의 법체계가 강화되면 관습법은 보충적 역할로 축소되는 경향이 있다."},{"p":1,"q":"민법 제185조의 물권법정주의는 물권을 법률 또는 관습법에 의해서만 창설할 수 있음을 전제로 한다.","a":"O","e":"물권은 법률 또는 관습법에 의하지 않고는 임의로 창설할 수 없다."},{"p":1,"q":"관습법은 성문법에 대하여 언제나 보충적 효력만 가지며, 우선적 효력이나 대등한 효력을 가질 수 없다.","a":"X","e":"원칙은 보충적 효력이지만, 상관습법처럼 우선하거나 물권법정주의처럼 법률과 대등하게 작용하는 경우가 있다."},{"p":1,"q":"민법의 근대 기본원리는 소유권 절대, 계약 자유, 과실책임의 원칙으로 정리된다.","a":"O","e":"근대 민법의 3대 원칙은 소유권 절대, 계약 자유, 과실책임이다."},{"p":1,"q":"현대 민법은 공공복리를 바탕으로 소유권 상대, 계약 공정, 무과실책임의 방향으로 근대 원리를 수정한다.","a":"O","e":"자본주의의 병리현상을 수정하면서 공공복리 중심의 현대 민법 원리가 등장하였다."},{"p":1,"q":"우리 민법은 개인의 절대적 자유를 최고 원리로 하고, 공공복리는 예외적 제한 원리에 불과하다는 견해가 다수설이다.","a":"X","e":"자료는 우리 민법이 공공복리를 최고의 원리로 한다는 견해가 다수설이라고 정리한다."},{"p":1,"q":"문리해석은 법 문언의 사전적·문자적 의미를 기초로 하는 해석방법이다.","a":"O","e":"문리해석은 조문의 문언 자체를 출발점으로 삼는 해석이다."},{"p":1,"q":"반대해석은 어떤 경우를 포함한다는 규정에서 그와 유사한 다른 경우도 포함한다고 넓히는 해석이다.","a":"X","e":"그 설명은 유추해석 또는 확장해석에 가깝다. 반대해석은 규정된 경우의 반대 경우에는 적용하지 않는 방식이다."},{"p":1,"q":"민법 해석에서 법적 안정성과 구체적 타당성이 충돌하면, 법적 안정성을 해치지 않는 범위에서 구체적 타당성을 추구한다.","a":"O","e":"자료는 법적 안정성을 더 앞에 두고, 이를 해치지 않는 범위에서 구체적 타당성을 발견해야 한다고 정리한다."},{"p":1,"q":"민법 해석에서는 구체적 타당성을 위해 법적 안정성을 희생하는 것이 원칙이다.","a":"X","e":"방향이 반대다. 법적 안정성을 해치지 않는 범위에서 구체적 타당성을 추구한다."},{"p":1,"q":"민법의 시간적 효력과 관련하여 소급효가 인정될 수 있으나, 구법에 의하여 이미 생긴 효력에는 영향을 미치지 않는다.","a":"O","e":"민법은 소급효가 인정될 수 있지만 기득권 보호 때문에 구법에 의해 이미 생긴 효력은 존중된다."},{"p":1,"q":"민법은 법률불소급 원칙이 엄격히 적용되어 신법의 소급효가 언제나 부정된다.","a":"X","e":"자료는 민법에 법률불소급 원칙이 그대로 적용되는 것이 아니며 소급효가 인정될 수 있다고 정리한다."},{"p":1,"q":"대한민국 국민이 해외에 거주하더라도 민법의 인적 효력과 관련하여 속인주의가 문제될 수 있다.","a":"O","e":"속인주의는 대한민국 국민에 대한 효력을 의미하므로 해외거주 국민도 논의 대상이 된다."},{"p":1,"q":"대한민국 영토 내 외국인에게는 원칙적으로 우리 민법이 적용되지 않는다.","a":"X","e":"속지주의에 따라 대한민국 영토 내 모든 사람에게 민법이 적용될 수 있다."},{"p":1,"q":"외교특권자에게는 형법·세법상 특권이 문제될 수 있으나, 민법은 원칙적으로 적용될 수 있다.","a":"O","e":"자료는 외교특권자에게도 민법은 적용된다고 정리한다."},{"p":1,"q":"속인주의와 속지주의가 충돌하는 경우에는 국제사법에 의해 해결된다.","a":"O","e":"국제적 요소가 있는 법률관계에서 어느 나라 법을 적용할지 국제사법으로 해결한다."},{"p":1,"q":"대한민국 민법은 대한민국 영토 내의 사물과 사건에 대하여 장소적 효력을 가진다.","a":"O","e":"장소에 관한 효력은 대한민국 영토 내 사물과 사건에 대한 효력을 의미한다."},{"p":1,"q":"미수복지역은 우리 헌법상 영토가 아니므로 그 지역 주민에게 우리 민법 적용은 전혀 문제되지 않는다.","a":"X","e":"자료는 미수복지역, 즉 북한 지역 주민에게도 우리 민법이 적용된다고 정리한다."},{"p":1,"q":"공해상의 선박이나 항공기는 그 게양된 국기가 표시하는 국가의 법이 적용된다는 원칙이 있다.","a":"O","e":"이는 기국주의의 설명이다."},{"p":1,"q":"민법 제1조의 조리는 법률과 관습법이 모두 없는 경우 보충적으로 적용된다.","a":"O","e":"제1조는 법률이 없으면 관습법, 관습법도 없으면 조리에 의한다고 한다."},{"p":1,"q":"조리는 성문법과 관습법보다 우선하여 민사관계를 규율한다.","a":"X","e":"조리는 법률과 관습법이 모두 없을 때 보충적으로 적용된다."},{"p":1,"q":"민법전은 형식적 의미의 민법이지만, 실질적 의미의 민법에는 민법전 외 민사관계 규범도 포함될 수 있다.","a":"O","e":"형식적 민법은 민법전, 실질적 민법은 민사생활관계를 규율하는 모든 규범이다."},{"p":1,"q":"명령·규칙·조례 중에도 민사관계에 관한 규정은 실질적 의미의 민법에 포함될 수 있다.","a":"O","e":"자료는 명령, 규칙, 조례, 공법, 조약 등 중 민사에 관한 규정이 실질적 의미의 민법에 포함될 수 있음을 도식화한다."},{"p":1,"q":"공법 중의 규정은 언제나 실질적 의미의 민법에 포함될 수 없다.","a":"X","e":"공법 규정 중에서도 민사생활관계를 규율하는 내용은 실질적 의미의 민법에 포함될 수 있다."},{"p":1,"q":"상법은 상인과의 거래에 관한 사법으로서 민법의 특별법 지위에 있다.","a":"O","e":"상법은 민법의 특별법으로 이해된다."},{"p":1,"q":"민법은 특별법이므로 사법 일반에 대하여 우선 적용된다.","a":"X","e":"민법은 사법 중 일반법이고 특별법이 아니다."},{"p":1,"q":"법률행위에서 법률규정이 존재하더라도 당사자의 자유의사는 항상 그 법률규정을 배제한다.","a":"X","e":"사적자치가 원칙이지만 강행규정, 선량한 풍속 기타 사회질서 등 한계가 있다."},{"p":1,"q":"민법은 재산법뿐만 아니라 가족법 영역도 포함한다.","a":"O","e":"민법 체계는 총칙, 물권, 채권, 친족, 상속으로 구성된다."},{"p":1,"q":"민법총칙의 내용은 권리의 주체, 객체, 변동에 관한 일반규정을 포함한다.","a":"O","e":"총칙은 자연인·법인, 물건, 법률행위 등 권리 일반의 기본구조를 다룬다."},{"p":1,"q":"민사관계에 관하여 법률과 관습법이 없으면 법원은 재판을 거부할 수 있다.","a":"X","e":"법률과 관습법이 없으면 조리에 의해 판단해야 하며, 단순히 재판을 거부할 수 없다."},{"p":1,"q":"판례가 민법 제1조의 법원은 아니더라도, 실제 분쟁 해결에서 중요한 해석자료가 될 수 있다.","a":"O","e":"판례의 법원성은 부정되지만 실무상 해석과 적용에 강한 영향력이 있다."},{"p":1,"q":"관습법이 성문법에 대한 변경적 효력을 갖는 경우는 전혀 인정될 수 없다.","a":"X","e":"자료는 제106조 및 신법 우선 원칙 등과 관련하여 변경적 효력도 언급한다."},{"p":1,"q":"사실인 관습은 당사자의 의사나 법률행위 해석 기준으로 기능할 수 있다.","a":"O","e":"사실인 관습은 법원은 아니지만 계약 해석의 기준이나 보충자료가 될 수 있다."},{"p":1,"q":"관습법은 당사자가 주장하지 않으면 법원이 절대 고려할 수 없다.","a":"X","e":"관습법은 법규범이므로 원칙적으로 법원이 직권으로 판단한다."},{"p":1,"q":"사실인 관습은 언제나 법원이 직권으로 판단해야 한다.","a":"X","e":"사실인 관습은 원칙적으로 당사자가 주장·입증해야 하며, 예외적으로 직권 판단될 수 있다."},{"p":1,"q":"근대 민법의 소유권 절대 원칙은 현대 민법에서 공공복리에 의해 상대화된다.","a":"O","e":"현대 민법은 소유권 상대의 원칙으로 근대 원리를 수정한다."},{"p":1,"q":"계약 자유의 원칙은 현대 민법에서 계약 공정의 원칙으로 수정된다.","a":"O","e":"계약 자유는 불공정 문제를 통제하기 위해 계약 공정으로 수정된다."},{"p":1,"q":"과실책임의 원칙은 현대 민법에서 무과실책임의 확대라는 방향으로 수정된다.","a":"O","e":"위험책임·공작물책임 등에서 과실책임 원칙이 수정된다."},{"p":1,"q":"유권해석에는 입법해석, 사법해석, 행정해석이 포함될 수 있다.","a":"O","e":"자료는 유권해석의 유형으로 입법·사법·행정해석을 정리한다."},{"p":1,"q":"학리해석은 권한 있는 국가기관의 구속력 있는 해석만을 의미한다.","a":"X","e":"학리해석은 학설상의 해석으로 무권해석이다."},{"p":1,"q":"확장해석은 조문 문언의 가능한 의미를 넓혀 해석하는 방식이다.","a":"O","e":"확장해석은 문언의 의미를 넓게 해석하는 방식이다."},{"p":1,"q":"축소해석은 조문의 적용범위를 좁혀 해석하는 방식이다.","a":"O","e":"축소해석은 문언의 범위를 좁게 보아 일부를 제외하는 해석이다."},{"p":1,"q":"신법 우선의 원칙은 관습법의 변경적 효력과 관련하여 설명될 수 있다.","a":"O","e":"자료는 관습법의 성문법에 대한 효력 중 변경적 효력으로 제106조와 신법 우선 원칙을 언급한다."},{"p":1,"q":"상관습법이 성문민법보다 우선하는 것은 관습법의 대등적 효력의 예이다.","a":"X","e":"상관습법이 성문민법보다 우선하는 것은 특별법 우선에 따른 우선적 효력의 예이다."},{"p":2,"q":"민법 제2조 제1항은 권리의 행사와 의무의 이행은 신의에 좇아 성실히 하여야 한다고 규정한다.","a":"O","e":"민법 제2조 제1항의 기본 내용이다. 권리행사와 의무이행 모두 신의칙의 통제를 받는다."},{"p":2,"q":"민법 제2조 제2항은 권리는 남용하지 못한다고 규정한다.","a":"O","e":"제2조 제2항은 권리남용금지의 원칙이다. 신의칙과 권리남용은 같은 조문 안에서 권리행사의 한계를 이룬다."},{"p":2,"q":"신의성실의 원칙에 관한 민법 제2조는 일반적 강행규정이다.","a":"O","e":"신의칙은 사적 자치의 한계를 이루는 일반적 강행규정으로 이해된다."},{"p":2,"q":"신의칙을 적용한 결과 개별적 강행규정을 위반하는 결과가 되더라도 구체적 타당성을 위해 신의칙을 우선 적용한다.","a":"X","e":"개별적 강행규정이 일반적 강행규정인 신의칙보다 우선한다. 신의칙으로 개별 강행규정을 무력화할 수 없다."},{"p":2,"q":"법정대리인의 동의 없이 신용구매계약을 체결한 미성년자가 그 계약을 취소하는 것은 원칙적으로 신의칙 위반이 아니다.","a":"O","e":"제한능력자 제도는 보호제도이므로, 단순히 취소권을 행사했다는 이유만으로 신의칙 위반이 되지는 않는다."},{"p":2,"q":"제한능력자 보호에서는 신의칙이 원칙적으로 적용되지 않으므로 미성년자의 모든 기망행위가 언제나 취소권 행사에 영향을 주지 않는다.","a":"X","e":"원칙은 제한능력자 보호지만, 제한능력자가 능력자로 믿게 하기 위해 적극적 속임수를 쓴 경우에는 별도 규정에 따라 취소가 제한될 수 있다."},{"p":2,"q":"강행법규를 위반한 법률행위를 한 자가 스스로 무효를 주장하는 것은 원칙적으로 신의칙에 반하지 않는다.","a":"O","e":"강행법규 위반 무효는 법질서 보호가 목적이므로, 당사자가 스스로 무효를 주장해도 원칙적으로 신의칙 위반이 아니다."},{"p":2,"q":"강행규정 위반 무효임을 알고 법률행위를 한 자는 자기모순이므로 언제나 무효를 주장할 수 없다.","a":"X","e":"강행규정 위반 무효 주장은 신의칙ㆍ금반언ㆍ권리남용으로 쉽게 제한되지 않는다."},{"p":2,"q":"신의칙은 법률규정이나 법률행위 해석기준이 모호한 경우 해석기준으로 기능할 수 있다.","a":"O","e":"신의칙은 법률행위 해석과 법률규정 해석의 보충기준으로 작용한다."},{"p":2,"q":"신의칙은 고지의무 위반 시 손해배상청구권을 발생시키는 등 권리의 창설적 기능을 할 수 있다.","a":"O","e":"신의칙은 단순 제한 원칙이 아니라 권리 창설, 변경ㆍ소멸, 해석기준 기능을 한다."},{"p":2,"q":"신의칙은 권리의 변경ㆍ소멸 기능을 할 수 있으며 사정변경의 원칙과 실효의 원칙이 이에 해당한다.","a":"O","e":"사정변경과 실효는 신의칙의 파생원칙으로 권리관계를 변경하거나 권리행사를 제한할 수 있다."},{"p":2,"q":"신의칙 위반은 의무이행 영역에서는 채무불이행 문제가 될 수 있다.","a":"O","e":"의무자가 신의칙에 반해 의무를 이행하면 채무불이행 책임으로 연결될 수 있다."},{"p":2,"q":"권리남용은 청구권이나 형성권 행사에 대해 법률효과 발생을 제한할 수 있다.","a":"O","e":"권리남용이 인정되면 법은 그 권리행사를 조력하지 않고 의도한 법률효과가 발생하지 않는다."},{"p":2,"q":"신의칙은 제정법의 흠결을 보완하고 구체적 타당성을 확보하는 기능을 한다.","a":"O","e":"신의칙은 법규정만으로 해결하기 어려운 사안에서 보충ㆍ수정 기능을 한다."},{"p":2,"q":"신의칙은 사법관계에만 적용되고 공법관계에는 절대 적용될 수 없다.","a":"X","e":"특히 실효의 원칙은 사법관계뿐 아니라 공법관계의 소송법상 권리에도 적용될 수 있다고 정리된다."},{"p":2,"q":"금반언의 원칙은 선행행위와 모순되는 후행행위를 신뢰보호 관점에서 제한하는 신의칙상 원칙이다.","a":"O","e":"상대방에게 일정한 신뢰를 형성시킨 뒤 이를 뒤집는 행위는 금반언에 의해 제한될 수 있다."},{"p":2,"q":"무권대리인이 본인을 상속한 경우 본인의 지위에서 자기 무권대리행위에 대한 추인을 거절할 수 있다.","a":"X","e":"무권대리인이 본인을 상속한 뒤 자기 무권대리행위의 추인을 거절하는 것은 금반언상 허용되지 않는다."},{"p":2,"q":"취득시효 완성 사실을 모르고 토지에 대해 아무 권리도 주장하지 않기로 한 뒤 나중에 시효완성을 주장하는 것은 신의칙상 허용되지 않을 수 있다.","a":"O","e":"권리주장하지 않겠다는 신뢰를 준 뒤 이를 뒤집어 시효를 주장하는 것은 금반언 위반으로 볼 수 있다."},{"p":2,"q":"대항력 있는 임차인이 보증금에 관한 권리주장을 하지 않겠다는 확인서를 저당권자에게 작성해 준 뒤 경락인에게 다시 대항력을 주장하는 것은 신의칙에 반할 수 있다.","a":"O","e":"확인서로 신뢰를 형성시킨 뒤 이를 뒤집는 행위는 금반언에 반한다."},{"p":2,"q":"자기가 연대보증을 해야 할 것을 타인에게 부탁해 그 타인이 대신 보증인이 된 경우, 자기가 변제한 후 그 타인에게 구상권을 행사하는 것은 신의칙에 반할 수 있다.","a":"O","e":"스스로 보증 부담을 타인에게 전가시킨 사람이 다시 구상권을 행사하는 것은 자기모순으로 평가될 수 있다."},{"p":2,"q":"근저당권설정계약의 무효를 주장하면서도 그 경매절차의 배당금을 수령한 뒤 다시 경매절차 무효를 주장하는 것은 신의칙에 반할 수 있다.","a":"O","e":"배당금 수령 등으로 경매 유효에 대한 신뢰를 형성했다면 나중의 무효 주장은 제한될 수 있다."},{"p":2,"q":"근로자가 퇴직 후 장기간이 지나 사직서 작성ㆍ제출이 형에 의해 이루어졌다는 이유로 퇴직무효를 주장하는 것은 신의칙상 제한될 수 있다.","a":"O","e":"장기간의 외관과 신뢰를 뒤늦게 뒤집는 경우 신의칙상 허용되지 않을 수 있다."},{"p":2,"q":"사정변경의 원칙은 계약준수 원칙의 예외로서 예견할 수 없었던 중대한 객관적 사정변경이 있을 때 문제된다.","a":"O","e":"요건은 예견불가, 중대성, 객관성, 무책성, 그대로 유지하면 신의칙 위반이 되는 정도이다."},{"p":2,"q":"사정변경의 원칙은 당사자의 주관적ㆍ개인적 사정변경에도 널리 적용된다.","a":"X","e":"사정변경은 개인적 사정이 아니라 객관적 사정의 중대한 변경이어야 한다."},{"p":2,"q":"사정변경을 주장하는 자에게 책임 있는 사유로 사정이 변경된 경우에도 계약해제ㆍ해지를 주장할 수 있다.","a":"X","e":"사정변경은 해제ㆍ해지를 주장하는 자에게 책임 없는 사유로 발생해야 한다."},{"p":2,"q":"사정변경을 이유로 한 계약 해제는 판례상 이미 다수 인정되어 있다.","a":"X","e":"자료 흐름상 사정변경을 이유로 계약 해제를 인정한 판례는 아직 없고, 해지는 제한적으로 인정된다."},{"p":2,"q":"사정변경을 이유로 한 해지는 불확정 채무에 대한 계속적 보증계약에서 제한적으로 인정될 수 있다.","a":"O","e":"계속적 보증계약에서 이사의 퇴직 등 사정변경이 있으면 불확정 채무에 대해 해지가 인정될 수 있다."},{"p":2,"q":"확정채무에 대한 보증계약도 이사의 퇴직이라는 사정변경을 이유로 해지할 수 있다.","a":"X","e":"확정채무에 대해서는 사정변경을 이유로 한 계약해지가 인정되지 않는다."},{"p":2,"q":"매매계약 체결 후 시간이 오래 지나고 시가가 상승했다는 사정만으로 사정변경에 의한 해제가 인정되는 것은 아니다.","a":"O","e":"단순한 시가 상승이나 시간 경과만으로 계약을 해제할 정도의 사정변경이 있다고 보기 어렵다."},{"p":2,"q":"지방자치단체로부터 매수한 토지가 공공공지에 편입되어 의도한 건축이 불가능해졌다는 사정은 언제나 사정변경 해제 사유가 된다.","a":"X","e":"그 사정만으로 매매계약을 해제할 만한 사정변경이라고 단정하지 않는다."},{"p":2,"q":"실효의 원칙은 권리자가 권리를 행사할 수 있었음에도 장기간 행사하지 않아 상대방에게 더 이상 행사하지 않을 것이라는 신뢰를 준 경우 문제된다.","a":"O","e":"단순 기간 경과만이 아니라 상대방의 정당한 신뢰 형성이 핵심이다."},{"p":2,"q":"실효의 원칙은 단순히 권리를 오래 행사하지 않았다는 사정만으로 곧바로 적용된다.","a":"X","e":"장기간 불행사만으로 부족하고, 상대방에게 권리불행사에 대한 신뢰가 형성되어야 한다."},{"p":2,"q":"실효의 원칙은 권리 위에 잠자는 자는 보호하지 않는다는 취지로 설명된다.","a":"O","e":"다만 모든 권리에 쉽게 적용되는 것은 아니다."},{"p":2,"q":"소유권은 장기간 행사하지 않으면 원칙적으로 실효의 원칙에 의해 소멸한다.","a":"X","e":"소유권은 장기간 미행사만으로 상대방에게 권리불행사의 신뢰가 생기기 어려운 권리이므로 실효가 쉽게 적용되지 않는다."},{"p":2,"q":"가족권은 장기간 행사하지 않았다는 이유만으로 실효의 원칙을 쉽게 적용할 수 없다.","a":"O","e":"인지청구권 등 가족권은 장기 미행사만으로 실효되지 않는다고 정리된다."},{"p":2,"q":"인지청구권은 e":"권리남용으로 평가되면 법은 그 행사를 조력하지 않는다."},{"p":2,"q":"강행규정 위반 무효를 스스로 주장하는 것은 신의칙 또는 권리남용에 해당한다고 보아야 한다.","a":"X","e":"강행규정 위반 무효 주장은 원칙적으로 신의칙ㆍ권리남용에 해당하지 않는다."},{"p":2,"q":"채권자의 권리행사가 신의칙상 용납될 수 없는 성질의 것인 경우 보증인의 책임을 제한하는 것이 허용될 수 있다.","a":"O","e":"다만 이는 신중하게 극히 예외적으로 적용해야 한다."},{"p":2,"q":"보증인의 책임 제한은 신의칙상 언제나 폭넓게 인정되어야 한다.","a":"X","e":"보증책임 제한은 채권자의 권리행사가 용납될 수 없는 경우에 극히 예외적으로 인정된다."},{"p":2,"q":"나대지에 설정된 저당권 실행 경매에서 신축 중인 건물이 있음을 알고 부지를 경락받은 자가, 경락 후 완공된 건물 철거를 구하는 것은 당연히 권리남용이다.","a":"X","e":"그러한 사정만으로 당연히 권리남용이 되지는 않는다고 정리된다."},{"p":2,"q":"이미 건물이 서 있는 토지를 매수한 뒤 건물 시가의 7배가 넘는 철거를 요구하면서 토지를 시가의 2배에 사라고 요구한 경우 권리남용이 될 수 있다.","a":"O","e":"소유권을 빙자해 폭리를 도모하는 것으로 볼 수 있어 철거청구가 권리남용이 될 수 있다."},{"p":2,"q":"토지소유자의 건물철거청구가 권리남용으로 부정되면 임료 상당 부당이득반환청구도 함께 부정된다.","a":"X","e":"철거청구가 권리남용으로 제한되어도 토지사용료 상당의 부당이득반환청구까지 부정되는 것은 아니다."},{"p":2,"q":"토지소유자의 철거청구가 권리남용으로 제한되어도 건물소유자에게 토지 사용료 상당을 청구할 수 있다.","a":"O","e":"소유권 행사 중 철거만 제한될 뿐, 사용이익 반환청구는 별개로 인정될 수 있다."},{"p":2,"q":"피상속인 생존 중 상속을 포기하기로 약정했더라도 상속개시 후 법정방식으로 포기하지 않으면 상속권 주장은 정당한 권리행사일 수 있다.","a":"O","e":"생전 상속포기 약정만으로 상속개시 후 법률상 상속포기의 효력이 생기지는 않는다."},{"p":2,"q":"피상속인 생존 중 상속포기 약정을 한 사람은 상속개시 후 상속권을 주장하면 언제나 신의칙 위반이다.","a":"X","e":"상속포기는 상속개시 후 법정방식에 따라 해야 하므로, 생전 약정만으로 신의칙 위반이라고 단정할 수 없다."},{"p":2,"q":"권리남용 판단에서 가해의 고의 같은 주관적 사정은 객관적 사정에 의해 추단될 수 있다.","a":"O","e":"주관적 목적은 직접 증명하기 어려워 객관적 정황으로 추단된다."},{"p":2,"q":"권리의 불행사도 일정한 경우 권리남용의 객관적 요건 중 하나가 될 수 있다.","a":"O","e":"자료는 권리의 행사 또는 불행사를 권리남용의 객관적 요건으로 든다."},{"p":2,"q":"권리남용은 권리자가 실제 권리를 가지고 있지 않은 경우에만 문제된다.","a":"X","e":"권리남용은 권리가 외형상 존재하거나 행사되는 경우 그 행사가 한계를 넘는지 문제되는 것이다."},{"p":2,"q":"신의칙과 권리남용금지는 사적 자치와 권리행사의 한계를 이루는 원칙이다.","a":"O","e":"민법 제2조는 권리행사와 의무이행의 일반적 한계로 기능한다."},{"p":2,"q":"금반언, 사정변경, 실효의 원칙은 모두 신의칙의 파생원칙으로 정리할 수 있다.","a":"O","e":"세 원칙은 신의칙의 구체화로 시험에서 묶어 비교된다."},{"p":2,"q":"사정변경의 원칙은 계약준수 원칙을 완전히 배제하는 일반원칙이므로 요건을 엄격히 보지 않는다.","a":"X","e":"사정변경은 계약준수 원칙의 예외이므로 요건을 엄격히 본다."},{"p":2,"q":"실효의 원칙 적용 여부는 권리의 종류와 상대방의 신뢰 형성 여부를 고려하여 판단한다.","a":"O","e":"소유권ㆍ가족권처럼 실효가 어려운 권리가 있으므로 권리성질이 중요하다."},{"p":2,"q":"상대방이 더 이상 권리행사가 없을 것이라고 믿었다는 사정이 있으면 인지청구권도 당연히 실효된다.","a":"X","e":"인지청구권은 가족권적 성격으로 장기 미행사와 신뢰만으로 쉽게 실효되지 않는다."},{"p":2,"q":"권리남용이 인정되면 해당 권리행사에 대한 청구가 기각되거나 법률효과 발생이 부정될 수 있다.","a":"O","e":"권리남용의 효과는 법의 조력을 부정하는 것이다."},{"p":2,"q":"신의칙은 권리행사에만 적용되고 의무이행에는 적용되지 않는다.","a":"X","e":"민법 제2조 제1항은 권리행사와 의무이행 모두를 대상으로 한다."},{"p":2,"q":"권리남용금지는 청구권 행사뿐 아니라 형성권 행사에도 적용될 수 있다.","a":"O","e":"해제권ㆍ상계권 등 형성권 행사도 남용되면 법률효과가 제한될 수 있다."},{"p":2,"q":"상계권은 일방적 의사표시에 의해 효과가 발생하는 형성권이므로 남용될 여지가 없다.","a":"X","e":"형성권도 권리행사이므로 상계권 남용이 문제될 수 있다."},{"p":2,"q":"신의칙을 통해 법률행위의 의미를 해석할 수는 있지만, 법률행위의 내용을 수정하거나 권리를 소멸시키는 기능은 없다.","a":"X","e":"신의칙은 해석기준뿐 아니라 권리의 변경ㆍ소멸 기능도 한다."},{"p":2,"q":"고지의무는 명문규정이 없더라도 신의칙상 인정될 수 있고, 위반 시 손해배상책임이 문제될 수 있다.","a":"O","e":"신의칙의 권리 창설적 기능의 대표 예시로 정리된다."},{"p":2,"q":"신의칙 위반은 항상 불법행위책임만 문제되고 채무불이행책임과는 무관하다.","a":"X","e":"의무이행 과정의 신의칙 위반은 채무불이행 문제로 연결될 수 있다."},{"p":2,"q":"권리자가 장기간 권리를 행사하지 않은 상태에서 상대방이 그 상태를 신뢰하고 새로운 법률관계를 형성한 경우 실효의 원칙이 문제될 수 있다.","a":"O","e":"상대방 신뢰와 그 신뢰에 기초한 법률상태 형성이 중요하다."},{"p":2,"q":"실효의 원칙은 소멸시효와 동일한 제도이므로 법정 기간이 지나야만 적용된다.","a":"X","e":"실효는 신의칙상 원칙이고 소멸시효와 다르다. 법정기간 경과가 아니라 신뢰 형성이 핵심이다."},{"p":2,"q":"소멸시효가 완성되지 않았더라도 특별한 사정이 있으면 신의칙상 권리행사가 제한될 수 있다.","a":"O","e":"실효의 원칙은 소멸시효와 별개로 권리행사를 제한할 수 있다. 다만 엄격히 판단한다."},{"p":2,"q":"법률에 명문규정이 없으면 신의칙은 적용될 수 없다.","a":"X","e":"신의칙은 민법 제2조의 일반조항으로 명문 개별규정이 없는 경우에도 보충적으로 작용한다."},{"p":2,"q":"권리남용 여부를 판단할 때 권리자의 이익, 상대방 손해, 권리행사 경위, 사회질서 위반 여부 등을 종합적으로 본다.","a":"O","e":"단일 요소만으로 판단하지 않고 객관적ㆍ주관적 사정을 종합한다."},{"p":2,"q":"권리자가 권리행사로 얻는 이익이 조금이라도 있으면 권리남용은 절대 성립하지 않는다.","a":"X","e":"이익이 있는 경우에도 권리행사 경위와 사회질서 위반 정도에 따라 권리남용이 문제될 수 있다."},{"p":2,"q":"신의칙은 강행규정이므로 당사자가 특약으로 그 적용을 배제할 수 없다.","a":"O","e":"신의칙은 일반적 강행규정으로 권리행사의 기본 한계가 된다."},{"p":2,"q":"채권자가 제3자로 하여금 채무자에게 명의신탁을 하도록 한 다음 그 부동산에 강제집행을 하는 행위는 신의칙에 반할 수 있다.","a":"O","e":"채권 확보를 위한 인위적 외관 형성 뒤 강제집행하는 것은 신의칙 위반으로 정리된다."},{"p":2,"q":"미지급 공사대금보다 하자보수비가 매우 적은 경우 도급인이 동시이행항변권으로 공사대금 전부 지급을 거절하는 것은 제한될 수 있다.","a":"O","e":"하자보수비와 이에 상응하는 손해배상액 범위로 동시이행항변권의 범위가 제한될 수 있다."},{"p":2,"q":"미지급 공사대금에 비해 하자보수비가 적더라도 도급인은 언제나 공사대금 전부에 대해 동시이행항변권을 행사할 수 있다.","a":"X","e":"신의칙상 하자보수비 및 상응 손해배상액 범위로 제한될 수 있다."},{"p":2,"q":"권리남용은 권리행사의 공공성ㆍ사회성을 강조하는 현대 민법의 원리와 관련된다.","a":"O","e":"권리도 사회적 한계 내에서 행사되어야 한다는 사고와 연결된다."},{"p":2,"q":"사정변경의 원칙에서 계약 내용대로 이행하게 하는 것이 신의칙에 현저히 반해야 한다는 요건은 중요하지 않다.","a":"X","e":"단순한 불리함이 아니라 계약유지가 신의칙에 반할 정도여야 한다."},{"p":2,"q":"불확정 계속보증계약에서 보증인이 이사의 지위를 상실한 경우 사정변경에 의한 해지가 문제될 수 있다.","a":"O","e":"자료는 이사의 퇴직을 불확정 계속보증계약 해지 사유로 정리한다."},{"p":2,"q":"확정채무 보증계약은 보증인이 후에 지위를 상실했다는 사정만으로 사정변경 해지가 인정되지 않는다.","a":"O","e":"확정채무는 이미 부담 범위가 정해진 것이므로 불확정 계속보증과 다르다."},{"p":2,"q":"권리남용으로 건물철거청구가 배척되면 토지소유자는 소유권을 상실한다.","a":"X","e":"철거청구 행사만 제한될 뿐 소유권 자체가 박탈되는 것은 아니다."},{"p":2,"q":"권리남용금지는 권리행사의 결과가 상대방에게 불리하면 언제나 적용된다.","a":"X","e":"상대방에게 불리하다는 사정은 권리행사의 통상적 결과일 수 있으므로 남용 판단에는 더 엄격한 요건이 필요하다."},{"p":2,"q":"신의칙은 법률행위의 해석기준이 될 수 있으므로, 계약의 문언이 불명확한 경우 당사자의 신뢰와 거래관계를 고려할 수 있다.","a":"O","e":"신의칙은 계약 해석에서 당사자 신뢰와 거래상 정의를 고려하게 하는 기준이 된다."},{"p":2,"q":"금반언은 앞선 행위로 상대방에게 신뢰를 주었는지, 그 신뢰를 뒤집는 후행행위가 있는지가 핵심이다.","a":"O","e":"금반언 지문은 “신뢰 형성 → 모순행위” 구조를 찾으면 된다."},{"p":2,"q":"권리남용이 인정되려면 반드시 권리행사자의 가해 의사가 직접 증명되어야 한다.","a":"X","e":"가해의사는 객관적 사정으로 추단될 수 있고, 사안에 따라 객관적 요건만으로도 권리남용을 인정할 수 있다."},{"p":2,"q":"신의칙은 제한능력자, 강행규정, 소멸시효, 실효 등과 결합해 자주 함정 지문으로 출제된다.","a":"O","e":"시험에서는 “원칙 보호/무효 주장 가능/장기 불행사만으로 부족” 같은 비교가 중요하다."},{"p":2,"q":"실효의 원칙은 신의칙상 파생원칙이므로 법원이 구체적 사정에 따라 신중하게 적용해야 한다.","a":"O","e":"권리행사를 제한하는 강한 효과가 있으므로 남용적으로 적용해서는 안 된다."},{"p":2,"q":"사정변경의 원칙은 계약이 체결된 후 당사자가 예견하지 못한 사정이 발생했다는 점만으로 충분하다.","a":"X","e":"예견불가 외에도 중대성, 객관성, 무책성, 계약유지가 신의칙 위반일 것 등이 필요하다."},{"p":2,"q":"권리남용금지와 신의칙은 모두 민법 제2조에 근거하지만, 신의칙은 의무이행까지 포함하고 권리남용은 권리행사의 한계를 주로 다룬다.","a":"O","e":"제2조 제1항은 신의성실, 제2항은 권리남용금지로 구별해 정리하면 된다."},{"p":2,"q":"신의칙ㆍ권리남용 지문은 결론 암기보다 “선행신뢰, 예견불가, 장기불행사+신뢰, 권리행사의 사회성 위반”이라는 판단구조를 잡아야 한다.","a":"O","e":"이 파트는 사례형 판례가 많아 구조로 판단해야 한다."},{"p":3,"q":"호의관계는 원칙적으로 권리·의무 관계가 아니므로, 호의제공자의 부주의로 사고가 발생하더라도 손해배상책임이 문제될 수 없다.","a":"X","e":"호의관계는 원칙적으로 인간관계이나, 부주의로 사고와 손해가 발생하면 법률관계로 전환되어 손해배상책임이 문제될 수 있다."},{"p":3,"q":"법적 구속의사가 없는 애정관계·우정관계·예의관계는 원칙적으로 법률관계가 아니다.","a":"O","e":"법률관계는 권리·의무 관계를 전제로 한다. 법적 구속의사가 없는 사회생활관계는 원칙적으로 인간관계에 그친다."},{"p":3,"q":"재산권에는 물권·채권·지식재산권 등이 포함된다.","a":"O","e":"권리 내용에 따른 분류에서 재산권은 경제적 가치를 가지는 권리로 물권·채권·무체재산권 등이 포함된다."},{"p":3,"q":"가족권은 일신전속성이 강하므로 친족권·상속권 등이 이에 속한다.","a":"O","e":"가족권은 신분관계를 기초로 하는 권리이고, 친족권·상속권 등이 대표적이다."},{"p":3,"q":"인격권은 생명·신체·자유·명예 등에 관한 권리로서, 침해 전이라도 금지청구 등 예방적 구제가 가능하다.","a":"O","e":"인격권은 사전적·예방적 구제수단이 인정될 수 있다."},{"p":3,"q":"사원권은 법인의 사원이 가지는 권리로, 공익권과 자익권으로 나눌 수 있다.","a":"O","e":"사원권은 단체 구성원 지위에서 발생하는 권리이고, 공익권·자익권으로 분류된다."},{"p":3,"q":"형성권은 권리자의 일방적 의사표시 또는 재판상 판결에 의하여 법률효과를 발생시키는 권리이다.","a":"O","e":"취소권·해제권·해지권·상계권 등이 일방적 의사표시로 효과를 발생시키는 형성권이다. 채권자취소권처럼 재판상 행사되는 것도 있다."},{"p":3,"q":"명칭이 청구권이면 그 실질도 언제나 청구권이므로 형성권이 될 수 없다.","a":"X","e":"부속물매수청구권, 지상물매수청구권, 공유물분할청구권, 차임증감청구권 등은 명칭은 청구권이나 실질은 형성권으로 정리된다."},{"p":3,"q":"채권자취소권은 재판상 행사되어 법률효과가 발생하는 형성권이다.","a":"O","e":"형성권 중에는 일방적 의사표시로 행사되는 것뿐 아니라 재판상 판결로 효력이 발생하는 것도 있다."},{"p":3,"q":"지배권은 권리 객체를 직접 지배하는 권리이고, 물권과 인격권이 대표적이다.","a":"O","e":"지배권은 객체에 대한 직접적 지배를 내용으로 하는 권리이다."},{"p":3,"q":"항변권은 상대방의 청구권 존재 자체를 소멸시키는 권리이다.","a":"X","e":"항변권은 청구권의 존재는 인정하면서 그 효력 발생을 저지하는 권리이다. 소멸시키는 것이 아니다."},{"p":3,"q":"동시이행의 항변권은 연기적 항변권이다.","a":"O","e":"동시이행항변권은 상대방이 이행제공을 할 때까지 자기 이행을 거절할 수 있는 연기적 항변권이다."},{"p":3,"q":"소멸시효 완성의 항변권은 영구적 항변권으로 분류된다.","a":"O","e":"소멸시효가 완성되면 채무자는 영구적으로 이행을 거절할 수 있는 항변을 할 수 있다."},{"p":3,"q":"청구권은 그 기초가 되는 권리와 분리하여 독립적으로 양도하거나 독립적으로 다른 권리의 목적으로 할 수 있다.","a":"X","e":"청구권은 기초 권리와 분리하여 독립적으로 양도하거나 권리의 목적으로 삼을 수 없다는 점이 자료의 핵심 포인트다."},{"p":3,"q":"일신전속권은 양도·상속 또는 대리·대위행사가 제한되는 권리이다.","a":"O","e":"일신전속권은 권리자 개인과 밀접하게 결합된 권리로 이전·대리행사가 제한된다."},{"p":3,"q":"임대인의 임대차계약 해지권은 형성권이므로 언제나 일신전속권이다.","a":"X","e":"임대인의 임대차계약 해지권은 형성권이지만 일신전속권은 아니다."},{"p":3,"q":"주된 권리가 변제·시효·상계·공탁 등으로 소멸하면 종된 권리도 원칙적으로 소멸한다.","a":"O","e":"부종성의 내용이다. 피담보채권이 소멸하면 담보물권도 소멸하는 구조와 연결된다."},{"p":3,"q":"이자채권은 원본채권에 대한 종된 권리로 볼 수 있다.","a":"O","e":"원본채권이 주된 권리이고 이자채권은 종된 권리의 예이다."},{"p":3,"q":"기대권은 이미 현실적으로 완성된 권리이므로 기성권과 구별되지 않는다.","a":"X","e":"기대권은 조건부권리·기한부권리처럼 장래 권리취득을 기대할 수 있는 지위이고, 기성권과 구별된다."},{"p":3,"q":"조건부권리와 기한부권리는 기대권의 예로 볼 수 있다.","a":"O","e":"조건의 성취 또는 기한의 도래로 권리가 현실화될 수 있으므로 기대권의 예가 된다."},{"p":3,"q":"사람은 생존한 동안 권리와 의무의 주체가 된다.","a":"O","e":"민법 제3조의 내용이다. 자연인은 생존한 동안 권리능력을 가진다."},{"p":3,"q":"민법상 권리의 주체는 자연인과 법인이고, 물건은 권리의 객체이다.","a":"O","e":"민법상 권리의 주체는 인이고, 인은 자연인과 법인으로 나뉜다. 물건은 권리의 객체이다."},{"p":3,"q":"권리능력은 권리와 의무의 주체가 될 수 있는 지위 또는 자격이다.","a":"O","e":"권리능력은 권리·의무 귀속의 전제가 되는 지위이다."},{"p":3,"q":"권리능력에 관한 규정은 임의규정이므로 당사자 합의로 특정인의 권리능력을 제한할 수 있다.","a":"X","e":"권리능력에 관한 규정은 강행규정이다. 사적 합의로 권리능력의 존부나 범위를 달리 정할 수 없다."},{"p":3,"q":"권리능력 없는 자 명의의 법률행위는 상대방이 선의이면 유효가 될 수 있다.","a":"X","e":"권리능력 없는 자 명의의 행위는 절대적으로 무효로 정리한다. 선의의 상대방 보호 문제가 아니다."},{"p":3,"q":"자연인은 출생과 동시에 당연히 권리능력을 취득한다.","a":"O","e":"출생하면 가족관계등록부 기록 여부와 무관하게 권리능력을 취득한다."},{"p":3,"q":"가족관계등록부에 출생기록이 있어야 자연인의 권리능력이 발생한다.","a":"X","e":"가족관계등록부의 출생기록은 추정적 효력일 뿐이다. 권리능력은 출생으로 당연히 발생한다."},{"p":3,"q":"민법상 출생 시기는 태아가 모체로부터 전부 노출된 때로 보는 것이 일반적이다.","a":"O","e":"민법상 출생 시기는 전부노출설로 정리한다."},{"p":3,"q":"형법상 사람의 시기는 민법과 동일하게 전부노출설에 따른다.","a":"X","e":"자료는 민법은 전부노출설, 형법은 진통시설로 구별한다."},{"p":3,"q":"사망 시기는 심장정지설이 기준이고, 뇌사만으로 민법상 사망으로 보는 것은 아니다.","a":"O","e":"자료는 사망 시기를 심장정지, 맥박종지, 심장사로 정리하고 뇌사는 부정한다."},{"p":3,"q":"의사능력은 자기 행위의 의미와 결과를 정상적으로 판단할 수 있는 정신능력이다.","a":"O","e":"의사능력은 유효한 법률행위를 하기 위한 최소한의 판단능력이다."},{"p":3,"q":"의사무능력자의 법률행위는 취소할 수 있는 행위이다.","a":"X","e":"의사무능력자의 법률행위는 취소가 아니라 무효이다. 제한능력자의 행위와 구별해야 한다."},{"p":3,"q":"의사무능력자의 법률행위가 이미 이행된 경우, 의사무능력자의 부당이득 반환범위는 현존이익에 한정된다.","a":"O","e":"의사무능력자는 보호 필요성이 크므로 반환범위가 현존이익으로 제한된다."},{"p":3,"q":"행위능력자는 권리능력자이면서 의사능력자이다.","a":"O","e":"행위능력은 단독으로 완전 유효한 법률행위를 할 수 있는 능력이므로 권리능력과 의사능력을 전제로 한다."},{"p":3,"q":"행위능력이 없는 자는 권리능력도 없다.","a":"X","e":"미성년자 등 제한능력자도 권리능력은 있다. 행위능력 제한은 권리능력 제한이 아니다."},{"p":3,"q":"책임능력은 불법행위책임을 부담하기 위한 판단능력 문제이다.","a":"O","e":"의사능력은 법률행위, 책임능력은 불법행위책임과 관련된다."},{"p":3,"q":"우리 민법은 태아에 관하여 일반적 보호주의를 취하므로 모든 권리관계에서 태아를 출생한 것으로 본다.","a":"X","e":"우리 민법은 개별적 보호주의이다. 법률에 특별한 보호규정이 있는 경우에 한하여 태아를 출생한 것으로 본다."},{"p":3,"q":"태아는 불법행위로 인한 손해배상청구권에 관하여 이미 출생한 것으로 본다.","a":"O","e":"민법은 태아에게 불법행위 손해배상청구권을 인정한다."},{"p":3,"q":"태아는 재산상속에 관하여 이미 출생한 것으로 본다.","a":"O","e":"태아 보호 규정 중 재산상속이 포함된다."},{"p":3,"q":"태아는 유증에 관하여 이미 출생한 것으로 본다.","a":"O","e":"유증은 태아 보호 대상이다."},{"p":3,"q":"태아는 유류분과 대습상속에 관하여 출생한 것으로 본다.","a":"O","e":"태아 보호 암기코드 “손상유유대”에 유류분과 대습상속이 포함된다."},{"p":3,"q":"태아의 권리능력 보호대상에는 채무불이행에 기한 손해배상청구권도 포함된다.","a":"X","e":"태아 보호의 손해배상청구권은 불법행위에 기한 손해배상청구권이다. 채무불이행은 포함되지 않는다."},{"p":3,"q":"판례는 사인증여가 계약이라는 이유로 태아의 권리능력을 인정하지 않는다.","a":"O","e":"다수설과 달리 판례는 사인증여·증여는 계약이므로 태아에게 권리능력을 인정하지 않는다."},{"p":3,"q":"태아는 부로부터 인지를 받을 수 있다.","a":"O","e":"태아는 부로부터 인지를 받을 수 있으나, 태아가 인지청구권이나 부양청구권을 행사하는 것은 인정되지 않는다."},{"p":3,"q":"태아는 부에 대하여 인지청구권과 부양청구권을 행사할 수 있다.","a":"X","e":"태아는 인지를 받을 수는 있으나 인지청구권·부양청구권은 태아의 권리능력으로 인정되지 않는다."},{"p":3,"q":"태아가 사산된 경우에도 태아 보호규정에 따라 이미 취득한 권리는 그대로 확정된다.","a":"X","e":"정지조건설·해제조건설 어느 입장에서도 살아서 출생해야 보호된다. 사산이면 보호가 확정되지 않는다."},{"p":3,"q":"정지조건설에 따르면 태아는 살아서 출생한 때에 비로소 권리능력을 취득한다.","a":"O","e":"정지조건설은 출생을 조건으로 권리능력 취득을 인정하는 입장이다."},{"p":3,"q":"해제조건설에 따르면 태아인 동안에도 일단 권리능력이 인정되나, 사산하면 소급하여 소멸한다.","a":"O","e":"해제조건설은 태아 중 권리능력을 일단 인정하고 사산을 해제조건으로 본다."},{"p":3,"q":"만 19세가 되면 성년이 된다.","a":"O","e":"민법상 성년 연령은 만 19세이다."},{"p":3,"q":"미성년자가 법률행위를 하려면 원칙적으로 법정대리인의 동의를 얻어야 한다.","a":"O","e":"미성년자는 제한능력자이므로 원칙적으로 법정대리인의 동의가 필요하다."},{"p":3,"q":"미성년자가 법정대리인의 동의 없이 한 법률행위는 원칙적으로 무효이다.","a":"X","e":"제한능력자의 법률행위는 무효가 아니라 취소할 수 있는 행위이다."},{"p":3,"q":"미성년자가 단순히 권리만을 얻거나 의무만을 면하는 행위는 법정대리인의 동의 없이도 단독으로 할 수 있다.","a":"O","e":"제한능력자 보호의 필요가 없으므로 단독으로 유효하게 할 수 있다."},{"p":3,"q":"부담 없는 증여를 받는 행위는 미성년자가 단독으로 할 수 있다.","a":"O","e":"부담 없는 수증은 단순히 권리만 얻는 행위에 해당한다."},{"p":3,"q":"부담부 증여를 받는 행위는 미성년자가 언제나 단독으로 할 수 있다.","a":"X","e":"부담이 붙은 증여는 의무 부담이 있으므로 단순히 권리만 얻는 행위가 아니다. 법정대리인 동의가 필요하다."},{"p":3,"q":"법정대리인이 범위를 정하여 처분을 허락한 재산은 미성년자가 임의로 처분할 수 있다.","a":"O","e":"처분을 허락한 재산의 처분은 미성년자가 단독으로 할 수 있는 예외이다."},{"p":3,"q":"법정대리인이 범위를 정하지 않고 처분을 허락한 재산도 미성년자가 제한 없이 처분할 수 있다.","a":"X","e":"처분허락은 범위가 정해져야 한다. 무제한 일반 허락으로 보아서는 안 된다."},{"p":3,"q":"법정대리인이 허락한 특정 영업에 관하여 미성년자는 성년자와 동일한 행위능력을 가진다.","a":"O","e":"허락된 특정 영업 범위 내에서는 미성년자가 성년자와 동일한 행위능력을 가진다."},{"p":3,"q":"미성년자가 혼인하면 성년의제에 따라 민법상 행위능력자가 된다.","a":"O","e":"혼인한 미성년자는 민법상 성년자로 의제된다."},{"p":3,"q":"미성년자의 혼인에 의한 성년의제는 공법상 선거권 등 모든 법률관계에 당연히 확장된다.","a":"X","e":"혼인에 의한 성년의제는 민법상 효과가 중심이며 모든 공법관계에 당연히 확장되는 것은 아니다."},{"p":3,"q":"법정대리인은 미성년자의 법률행위에 동의할 수 있고, 동의 없이 한 행위를 취소할 수 있다.","a":"O","e":"법정대리인은 동의권·취소권·대리권을 가진다."},{"p":3,"q":"미성년자가 법정대리인의 동의를 얻어 법률행위를 한 경우에도 미성년자라는 이유로 취소할 수 있다.","a":"X","e":"적법한 동의가 있으면 제한능력을 이유로 취소할 수 없다."},{"p":3,"q":"제한능력자의 취소권은 제한능력자 본인뿐 아니라 법정대리인 등도 행사할 수 있다.","a":"O","e":"취소권자는 제한능력자 본인, 법정대리인, 승계인 등으로 확장된다."},{"p":3,"q":"성년후견개시 심판은 질병·장애·노령 등으로 사무처리능력이 지속적으로 결여된 사람에 대하여 할 수 있다.","a":"O","e":"피성년후견인은 정신적 제약으로 사무처리능력이 지속적으로 결여된 사람이다."},{"p":3,"q":"한정후견개시 심판은 사무처리능력이 부족한 사람에 대하여 할 수 있다.","a":"O","e":"피한정후견인은 사무처리능력이 부족한 사람이다."},{"p":3,"q":"특정후견은 일시적 후원 또는 특정 사무에 관한 후원이 필요한 사람을 위한 제도이다.","a":"O","e":"특정후견은 일시적·특정사무 후원 필요성을 중심으로 한다."},{"p":3,"q":"성년후견개시·한정후견개시·특정후견 심판은 본인, 배우자, 4촌 이내의 친족, 검사, 지방자치단체장 등이 청구할 수 있다.","a":"O","e":"자료의 암기코드 “본배사지검”이다."},{"p":3,"q":"성년후견개시 심판에는 본인의 의사를 고려할 필요가 없다.","a":"X","e":"성년후견·한정후견·특정후견 모두 본인의 의사를 고려해야 한다."},{"p":3,"q":"특정후견의 심판은 본인의 의사에 반하여 할 수 없다.","a":"O","e":"특정후견은 본인의 의사에 반하여 심판할 수 없다."},{"p":3,"q":"피성년후견인의 법률행위는 원칙적으로 취소할 수 있다.","a":"O","e":"피성년후견인의 법률행위는 원칙적으로 취소 가능하다. 다만 일용품 구입 등 예외가 있다."},{"p":3,"q":"피성년후견인이 일용품 구입 등 일상생활에 필요하고 대가가 과도하지 않은 법률행위를 한 경우에도 언제나 취소할 수 있다.","a":"X","e":"일용품 구입 등 일상생활에 필요하고 대가가 과도하지 않은 행위는 취소할 수 없다."},{"p":3,"q":"가정법원은 피성년후견인이 단독으로 할 수 있는 법률행위의 범위를 정할 수 있다.","a":"O","e":"후견제도는 본인의 잔존능력 존중을 위해 법원이 범위를 정할 수 있다."},{"p":3,"q":"피한정후견인의 행위는 원칙적으로 유효하고, 가정법원이 정한 동의가 필요한 행위에 한하여 동의 없는 경우 취소할 수 있다.","a":"O","e":"피한정후견인은 모든 행위가 당연히 취소대상이 아니라 동의유보 범위가 핵심이다."},{"p":3,"q":"피한정후견인은 모든 법률행위를 한정후견인의 동의 없이 할 수 없고, 동의 없는 행위는 언제나 취소할 수 있다.","a":"X","e":"피한정후견인은 가정법원이 정한 범위에서만 동의가 필요하다. 전면적 제한으로 보면 안 된다."},{"p":3,"q":"특정후견인이 선임되면 당연히 피특정후견인의 법정대리인이 된다.","a":"X","e":"특정후견인은 법원의 대리권 수여심판이 있는 경우에 한하여 법정대리인이 된다."},{"p":3,"q":"특정후견심판이 있었고 특정후견인이 선임된 경우에도 피특정후견인은 원칙적으로 스스로 법률행위를 할 수 있다.","a":"O","e":"피특정후견인은 제한능력자가 아니므로 단독 행위가 취소되는 구조가 아니다."},{"p":3,"q":"피특정후견인의 법률행위는 특정후견심판이 있었다는 이유만으로 취소할 수 있다.","a":"X","e":"피특정후견인은 특정후견심판만으로 제한능력자가 되는 것이 아니므로 그 행위는 취소할 수 없다."},{"p":3,"q":"피성년후견인에게 한정후견개시 심판을 할 때에는 종전의 성년후견 종료 심판을 한다.","a":"O","e":"후견 심판 사이에는 중첩을 피하기 위해 종전 후견 종료 심판을 한다."},{"p":3,"q":"피한정후견인에게 성년후견개시 심판을 할 때에도 종전의 한정후견 종료 심판을 한다.","a":"O","e":"성년후견과 한정후견 사이의 관계에서도 종전 심판 종료가 필요하다."},{"p":3,"q":"제한능력자의 상대방 보호제도에는 추인, 법정추인, 취소권의 단기소멸, 확답촉구권, 계약철회권, 단독행위거절권, 속임수에 의한 취소권 배제가 있다.","a":"O","e":"일반적 보호제도와 제한능력자 특유의 보호제도를 함께 정리해야 한다."},{"p":3,"q":"취소할 수 있는 행위의 추인은 취소권의 포기이다.","a":"O","e":"추인하면 취소할 수 있는 행위가 확정적으로 유효가 된다."},{"p":3,"q":"법정추인 사유에는 전부 또는 일부 이행, 이행청구, 담보제공, 취득한 권리의 양도, 강제집행, 경개 등이 포함된다.","a":"O","e":"자료의 법정추인 사유를 그대로 묻는 빈출 포인트다."},{"p":3,"q":"취소권은 추인할 수 있는 날부터 3년, 법률행위를 한 날부터 10년 내에 행사하여야 한다.","a":"O","e":"취소권의 단기소멸 기간은 3년/10년이다."},{"p":3,"q":"제한능력자의 상대방은 제한능력자에게 직접 확답을 촉구할 수 있고, 제한능력자가 확답하지 않으면 추인한 것으로 본다.","a":"X","e":"최고는 원칙적으로 능력자가 된 후 본인 또는 법정대리인에게 해야 한다. 제한능력자에게 직접 최고해 추인간주되는 구조가 아니다."},{"p":3,"q":"제한능력자의 상대방이 계약 당시 선의이면, 추인이 있기 전까지 계약을 철회할 수 있다.","a":"O","e":"계약철회권은 제한능력자 상대방이 선의인 경우에 인정된다."},{"p":3,"q":"제한능력자의 상대방이 계약 당시 악의라도 계약철회권을 행사할 수 있다.","a":"X","e":"계약철회권은 선의의 상대방에게만 인정된다."},{"p":3,"q":"제한능력자의 상대방은 단독행위에 관하여 선의·악의를 불문하고 거절할 수 있다.","a":"O","e":"단독행위 거절권은 선악 불문으로 정리한다."},{"p":3,"q":"제한능력자의 상대방 보호제도 중 계약철회권은 선의의 상대방에게만 인정되지만, 단독행위거절권은 선악을 불문한다.","a":"O","e":"자료 암기코드 “계선철, 단거” 그대로다."},{"p":3,"q":"제한능력자가 속임수로 자기를 능력자로 믿게 한 경우에는 그 행위를 취소할 수 없다.","a":"O","e":"제한능력자 보호를 악용한 경우에는 취소권이 배제된다."},{"p":3,"q":"판례는 제한능력자의 단순한 침묵이나 허언장담만으로도 언제나 속임수에 해당한다고 본다.","a":"X","e":"자료는 판례가 적극적 속임수, 즉 동의서·가족관계등록부 위변조 등 적극행위를 요구한다고 정리한다."},{"p":3,"q":"미성년자 또는 피한정후견인이 동의서 위조 등 적극적 방법으로 법정대리인의 동의가 있는 것으로 믿게 하면 취소권이 배제될 수 있다.","a":"O","e":"적극적 속임수로 법정대리인 동의가 있다고 믿게 한 경우 취소권 배제 문제가 된다."},{"p":3,"q":"피성년후견인이 속임수로 동의서를 위조한 경우에도 취소권이 배제된다.","a":"X","e":"자료는 피성년후견인이 속임수를 쓴 경우에는 동의서 위조 등 방법이 있어도 취소권이 배제되지 않는다고 정리한다."},{"p":3,"q":"제한능력자 제도는 제한능력자 보호가 목적이므로, 제한능력자가 신의칙에 반한다는 이유만으로 취소권 행사가 쉽게 제한되지는 않는다.","a":"O","e":"제한능력자 보호에서는 신의칙 적용이 제한된다. 미성년자가 동의 없는 신용구매계약을 취소해도 신의칙 위반이 아니다."},{"p":3,"q":"미성년자가 법정대리인의 동의 없이 신용구매계약을 체결한 뒤 이를 취소하는 것은 원칙적으로 신의칙 위반이다.","a":"X","e":"제한능력자 보호가 우선하므로 신의칙 위반으로 보지 않는다."},{"p":3,"q":"제한능력자 상대방 보호제도는 제한능력자 보호와 거래안전의 조화를 위한 제도이다.","a":"O","e":"제한능력자 제도는 본인 보호가 원칙이나 상대방을 보호하기 위한 장치도 마련되어 있다."},{"p":3,"q":"권리능력은 모든 자연인에게 인정되지만, 의사능력과 행위능력은 구체적 판단능력 또는 법정 연령·상태에 따라 달라질 수 있다.","a":"O","e":"권리능력은 출생으로 당연히 인정되지만, 의사능력은 실제 판단능력, 행위능력은 법률상 완전한 행위 가능성 문제이다."},{"p":3,"q":"제한능력자의 행위는 무효이므로 추인이나 법정추인의 대상이 될 수 없다.","a":"X","e":"제한능력자의 행위는 취소할 수 있는 행위이므로 추인·법정추인의 대상이 된다."},{"p":3,"q":"의사무능력자의 행위는 무효이므로 추인에 의하여 취소할 수 있는 행위가 확정 유효로 되는 구조와 다르다.","a":"O","e":"의사무능력자의 행위는 무효, 제한능력자의 행위는 취소 가능으로 구별한다."},{"p":3,"q":"태아 보호규정에서 태아를 출생한 것으로 본다는 말은 모든 경우 태아가 현실적으로 완전한 행위능력을 가진다는 뜻이다.","a":"X","e":"태아 보호는 특정 권리능력 인정 문제이지 행위능력 인정 문제가 아니다."},{"p":3,"q":"피특정후견인은 특정후견인이 선임되었다는 사정만으로 제한능력자가 되지 않는다.","a":"O","e":"특정후견은 행위능력 제한제도가 아니라 필요한 범위의 후원제도이다."},{"p":3,"q":"성년후견·한정후견·특정후견은 모두 가정법원의 심판을 통해 개시된다.","a":"O","e":"각 후견은 성년후견개시, 한정후견개시, 특정후견의 심판을 통해 개시된다."},{"p":3,"q":"제한능력자가 능력자로 된 후 그 행위를 추인하면, 그 행위는 확정적으로 유효가 된다.","a":"O","e":"취소할 수 있는 행위는 추인으로 확정 유효가 된다."},{"p":3,"q":"제한능력자의 법정대리인이 추인한 경우에도 제한능력자 본인은 다시 취소할 수 있다.","a":"X","e":"적법한 추인이 있으면 취소권은 소멸하고 행위는 확정적으로 유효가 된다."},{"p":3,"q":"제한능력자의 상대방이 철회권을 행사하면 계약은 처음부터 없었던 것으로 된다.","a":"O","e":"철회는 추인 전 계약관계를 해소하는 상대방 보호수단이다."},{"p":3,"q":"단독행위의 상대방이 거절권을 행사하면 그 단독행위는 효력이 발생하지 않는다.","a":"O","e":"제한능력자의 단독행위에 대하여 상대방은 거절하여 법률효과 발생을 막을 수 있다."},{"p":3,"q":"미성년자의 법률행위라도 법정대리인의 사전 동의가 있거나 사후 추인이 있으면 제한능력을 이유로 취소할 수 없다.","a":"O","e":"동의나 추인은 제한능력으로 인한 불완전성을 제거한다."},{"p":3,"q":"권리능력 없는 자 명의의 행위는 무효이지만, 의사무능력자의 행위는 취소할 수 있는 행위에 불과하다.","a":"X","e":"둘 다 무효로 정리한다. 취소할 수 있는 행위는 제한능력자의 행위이다."},{"p":3,"q":"행위능력 제한은 본인을 보호하기 위한 것이므로 상대방이 제한능력자임을 알았는지와 관계없이 취소할 수 있는 것이 원칙이다.","a":"O","e":"제한능력자 취소권은 상대방의 선의·악의와 무관하게 인정되는 것이 원칙이다. 다만 상대방 보호제도와 사술 예외가 있다."},{"p":3,"q":"제한능력자의 상대방이 악의라면 단독행위 거절권도 행사할 수 없다.","a":"X","e":"단독행위거절권은 선악을 불문한다."},{"p":3,"q":"법정대리인의 동의권·대리권·취소권은 미성년자 보호를 위한 핵심 권한이다.","a":"O","e":"법정대리인은 미성년자의 행위를 보충하거나 대신하고, 동의 없는 행위를 취소할 수 있다."},{"p":3,"q":"미성년자가 단순히 의무만을 부담하는 행위는 법정대리인의 동의 없이도 단독으로 할 수 있다.","a":"X","e":"단독으로 가능한 것은 단순히 권리만 얻거나 의무만 면하는 행위이다. 의무만 부담하는 행위는 보호 필요가 크다."},{"p":3,"q":"미성년자가 채무를 면제받는 행위는 단순히 의무만을 면하는 행위로서 단독으로 할 수 있다.","a":"O","e":"채무면제 수익은 의무만을 면하는 행위이므로 단독으로 할 수 있다."},{"p":3,"q":"성년후견개시 심판을 받은 사람은 권리능력을 상실한다.","a":"X","e":"성년후견은 행위능력 제한 문제이지 권리능력 상실이 아니다."},{"p":3,"q":"제한능력자가 한 법률행위의 취소는 제한능력자 보호를 위한 것이므로, 취소 후에는 원상회복 문제가 생긴다.","a":"O","e":"취소하면 소급적으로 무효가 되어 원상회복 문제가 발생한다. 반환범위 등은 별도 취소 파트와 연결된다."},{"p":3,"q":"제한능력자 제도와 의사무능력 제도는 모두 보호제도이나, 전자는 취소, 후자는 무효로 효과가 다르다.","a":"O","e":"시험에서 가장 자주 나오는 비교 포인트다."},{"p":4,"q":"주소는 사람의 생활의 근거가 되는 곳으로 정해지며, 우리 민법은 실질주의·객관주의를 취한다.","a":"O","e":"민법 제18조 제1항은 생활의 근거가 되는 곳을 주소로 한다. 등록지나 본적 같은 형식보다 실제 생활근거가 핵심이다."},{"p":4,"q":"주소는 반드시 한 곳이어야 하므로, 동시에 두 곳 이상의 주소를 둘 수 없다.","a":"X","e":"민법은 복수주의를 취한다. 주소는 동시에 두 곳 이상 있을 수 있다."},{"p":4,"q":"민법상 주소는 당사자의 주관적 의사만으로 정해지며, 객관적 생활관계는 고려하지 않는다.","a":"X","e":"주소는 생활의 근거라는 객관적 생활관계에 따라 판단한다. 주관적 의사만으로 정해지는 것이 아니다."},{"p":4,"q":"국내에 주소가 없는 경우에는 거소를 주소로 본다.","a":"O","e":"민법 제19조 취지. 국내에 주소가 없으면 거소를 주소로 본다."},{"p":4,"q":"주소를 알 수 없는 경우에는 거소를 주소로 본다.","a":"O","e":"민법 제20조 취지. 주소를 알 수 없는 때에도 거소를 주소로 본다."},{"p":4,"q":"거소는 주소보다 사람과의 밀접도가 강한 곳이다.","a":"X","e":"거소는 주소보다 밀접도가 약한 생활관계의 장소다."},{"p":4,"q":"주소와 거소는 같은 장소에 동시에 존재할 수 있다.","a":"X","e":"자료는 주소와 거소가 한 곳에 동시에 있을 수 없다고 정리한다. 같은 장소가 생활근거이면 주소이지 거소로 따로 볼 실익이 없다."},{"p":4,"q":"어느 행위에 관하여 가주소를 정한 때에는 그 행위에 관하여 이를 주소로 본다.","a":"O","e":"민법 제21조. 가주소는 특정 행위와 관련해서만 주소로 취급된다."},{"p":4,"q":"가주소를 정하면 모든 법률관계에서 일반 주소가 변경된다.","a":"X","e":"가주소는 특정 행위에 관하여만 주소로 본다. 일반 주소가 전면적으로 바뀌는 것이 아니다."},{"p":4,"q":"주소는 부재와 실종 판단의 표준이 될 수 있다.","a":"O","e":"주소는 부재 및 실종의 표준으로 기능한다."},{"p":4,"q":"주소는 법인의 소재지, 변제장소, 상속개시지와 관련된다.","a":"O","e":"자료는 주소의 민법상 효과를 부재·실종의 표준, 법인의 소재지, 변제장소, 상속개시지로 정리한다."},{"p":4,"q":"상속은 피상속인의 주소지에서 개시된다.","a":"O","e":"민법상 상속개시지는 피상속인의 주소지를 기준으로 한다."},{"p":4,"q":"채무의 변제장소를 정할 때 주소는 아무 의미가 없다.","a":"X","e":"주소는 변제장소와 관련되는 민법상 효과가 있다."},{"p":4,"q":"법인의 주소는 법인의 주된 사무소 소재지와 관련된다.","a":"O","e":"법인의 소재지는 주소 개념의 민법상 효과 중 하나로 정리된다."},{"p":4,"q":"주소는 단순히 주민등록지만을 의미하므로 실제 생활근거와 다르더라도 주민등록지가 항상 주소가 된다.","a":"X","e":"주소는 생활의 근거가 되는 곳이다. 주민등록지는 판단자료가 될 수 있으나 언제나 결정적 기준은 아니다."},{"p":4,"q":"주소가 여러 개인 경우에도 민법상 주소가 인정될 수 있다.","a":"O","e":"복수주의에 따라 두 곳 이상의 주소가 가능하다."},{"p":4,"q":"거소는 국내에 주소가 없거나 주소를 알 수 없는 경우에 보충적으로 주소로 취급될 수 있다.","a":"O","e":"거소는 주소가 없거나 불명인 때 주소로 보충된다."},{"p":4,"q":"가주소는 일정한 행위에 관해서만 주소로 보는 것이므로, 그 범위를 넘는 사건에는 당연히 적용되지 않는다.","a":"O","e":"가주소의 효력은 그 행위에 한정된다."},{"p":4,"q":"부재자는 종전 주소지를 떠나 당분간 돌아올 가망이 없고, 재산이 관리되지 않고 방치되어 있는 자를 말한다.","a":"O","e":"자료는 부재자를 종전 주소지를 떠나 돌아올 가망이 없는 자 + 재산이 관리되지 않는 자로 정리한다."},{"p":4,"q":"종전 주소지를 떠나 당분간 돌아올 가망이 없더라도 국내 대리인이 재산을 관리하고 있으면 민법상 부재자로 보지 않을 수 있다.","a":"O","e":"부재자제도는 재산관리 필요성이 핵심이다. 대리인 등이 재산을 관리하고 있으면 부재자 재산관리제도의 개입 필요가 없다."},{"p":4,"q":"부재자 여부는 오직 생사가 불분명한지 여부로만 판단한다.","a":"X","e":"부재자제도는 생사불명만이 아니라 재산관리 필요성을 중심으로 한다. 생사불명은 실종선고와 연결되는 요소다."},{"p":4,"q":"부재자의 재산관리인이 이미 있으면 원칙적으로 국가가 개입하지 않는다.","a":"O","e":"법정대리인 또는 임의대리인 등 재산관리인이 있으면 원칙적으로 국가 개입이 없다."},{"p":4,"q":"부재자에게 재산관리인이 없는 경우에는 이해관계인이나 검사의 청구로 법원이 재산관리인을 선임할 수 있다.","a":"O","e":"재산관리인이 없으면 이해관계인·검사의 청구에 의해 법원이 재산관리인을 선임할 수 있다."},{"p":4,"q":"부재자 재산관리인은 언제나 검사만이 선임을 청구할 수 있다.","a":"X","e":"검사뿐 아니라 이해관계인도 청구할 수 있다."},{"p":4,"q":"부재자 재산관리인은 보존행위를 할 수 있다.","a":"O","e":"재산관리인은 보존행위를 할 수 있다. 보존은 재산의 현상유지·권리보전을 위한 행위다."},{"p":4,"q":"부재자 재산관리인은 물건이나 권리의 성질을 변화시키지 않는 범위에서 이용·개량행위를 할 수 있다.","a":"O","e":"자료는 이용·개량행위는 물건·권리의 성질이 변하지 않는 범위에서 가능하다고 정리한다."},{"p":4,"q":"부재자 재산관리인은 보존행위도 법원의 허가가 있어야만 할 수 있다.","a":"X","e":"보존행위는 재산관리인의 기본 권한에 속한다. 법원의 허가가 필요한 것은 권한을 넘는 처분행위 등이다."},{"p":4,"q":"부재자 재산관리인이 부재자의 부동산을 매각하는 등 처분행위를 하려면 원칙적으로 법원의 허가가 필요하다.","a":"O","e":"처분행위는 보존·이용·개량의 범위를 넘으므로 법원의 허가가 필요하다."},{"p":4,"q":"부재자 재산관리인의 권한초과 처분행위는 법원의 사전허가뿐 아니라 사후 추인 형식의 허가도 문제될 수 있다.","a":"O","e":"자료는 기타 처분행위는 허가/추인을 받아 가능하다고 정리한다."},{"p":4,"q":"부재자 재산관리인은 법원의 허가 없이도 언제든지 부재자의 재산을 자유롭게 매각할 수 있다.","a":"X","e":"재산관리인은 관리권한을 가질 뿐 자유로운 처분권자는 아니다. 권한초과 처분에는 법원 허가가 필요하다."},{"p":4,"q":"법원이 부재자 재산관리인에게 필요한 처분명령을 한 경우에는 그 명령에 따른 처분이 가능하다.","a":"O","e":"법원은 재산관리에 필요한 처분을 명할 수 있고, 그 범위의 처분은 가능하다."},{"p":4,"q":"부재자 재산관리제도는 주로 부재자 본인의 재산 보전과 이해관계인의 이익 보호를 목적으로 한다.","a":"O","e":"부재로 인한 재산 방치를 막는 제도이므로 본인 및 이해관계인의 보호 기능이 있다."},{"p":4,"q":"부재자 재산관리인은 부재자의 사망이 확정된 뒤에도 상속재산관리인과 무관하게 계속 같은 지위에서 재산을 관리한다.","a":"X","e":"부재자 재산관리제도는 부재자의 생존을 전제로 한 재산관리제도다. 사망이 확정되면 상속관계 등 별도 법리가 문제된다."},{"p":4,"q":"부재자 재산관리인은 부재자의 재산을 관리하는 자이지, 부재자를 사망한 것으로 간주하게 하는 제도는 아니다.","a":"O","e":"사망간주는 실종선고의 효과다. 부재자 재산관리는 사망간주와 구별된다."},{"p":4,"q":"부재자의 생사가 불분명하게 된 경우에는 이미 재산관리인이 있더라도 법원이 개입할 수 있는 경우가 있다.","a":"O","e":"자료는 본인의 부재 중 재산관리인의 권한이 소멸하거나 부재자의 생사가 불분명해진 경우 예외적으로 개입을 정리한다."},{"p":4,"q":"부재자의 재산관리인이 법원 허가 없이 권한초과행위를 하면, 언제나 절대적으로 유효하다.","a":"X","e":"권한초과행위에는 허가가 필요하므로 허가 없는 처분을 언제나 유효라고 할 수 없다."},{"p":4,"q":"부재자에게 임의대리인이 있더라도 그 대리권이 부재 중 소멸한 때에는 법원이 재산관리에 관여할 수 있다.","a":"O","e":"본인의 부재 중 재산관리인의 권한이 소멸한 경우 법원의 개입이 가능하다."},{"p":4,"q":"부재자 재산관리제도는 주소를 떠난 모든 사람에게 예외 없이 적용된다.","a":"X","e":"종전 주소지를 떠났다는 사정만으로 부족하고 재산관리 필요성이 있어야 한다."},{"p":4,"q":"부재자 재산관리인은 이용·개량행위라는 이름으로 물건의 성질을 바꾸는 처분행위를 허가 없이 할 수 있다.","a":"X","e":"이용·개량행위는 물건·권리의 성질을 변화시키지 않는 범위에서만 가능하다. 성질 변경은 처분행위가 될 수 있다."},{"p":4,"q":"부재자 재산관리인의 선임은 법률행위의 유효·무효를 정하는 제도라기보다 부재자의 재산 방치를 막기 위한 관리제도이다.","a":"O","e":"부재자제도는 재산관리 필요성을 중심으로 한 보호제도다."},{"p":4,"q":"부재자의 재산관리인이 존재하는 경우에도 그 관리가 불가능하거나 권한이 소멸하면 법원의 보충적 개입이 가능하다.","a":"O","e":"관리인이 있으면 원칙 불개입이나 권한소멸·생사불명 등 예외가 있다."},{"p":4,"q":"부재자 재산관리와 실종선고는 모두 재산관계를 정리한다는 점에서 같지만, 실종선고는 사망간주 효과가 있다는 점에서 구별된다.","a":"O","e":"부재자 관리는 생존 전제의 관리이고, 실종선고는 일정 시점 사망간주 효과를 발생시킨다."},{"p":4,"q":"실종선고가 없으면 실종기간이 아무리 오래 지나도 실종자는 실종선고 전까지 생존하는 것으로 추정된다.","a":"O","e":"자료는 실종선고가 없는 경우 기간이 오래되어도 실종선고 전까지 생존 추정이라고 정리한다."},{"p":4,"q":"실종선고를 받으면 실종자는 실종선고가 확정된 때 사망한 것으로 본다.","a":"X","e":"사망간주 시점은 선고확정시가 아니라 실종기간 만료시다."},{"p":4,"q":"보통실종은 일정 기간 생사가 분명하지 않은 경우 문제되며, 기간은 원칙적으로 5년이다.","a":"O","e":"보통실종의 실종기간은 5년으로 정리한다."},{"p":4,"q":"특별실종은 전쟁, 선박침몰, 항공기 추락, 기타 사망의 원인이 될 위난과 관련되며, 기간은 원칙적으로 1년이다.","a":"O","e":"특별실종은 위난 종료 후 1년의 기간이 핵심이다."},{"p":4,"q":"특별실종의 경우 전쟁이 시작된 때나 선박이 출발한 때부터 1년이 지나면 사망한 것으로 본다.","a":"X","e":"특별실종은 전쟁종지, 선박침몰, 항공기 추락, 기타 위난 종료 후 1년을 기준으로 한다."},{"p":4,"q":"보통실종의 경우 최후 소식이 있은 때부터 5년의 실종기간이 만료되면 그 만료시에 사망한 것으로 간주된다.","a":"O","e":"보통실종은 최후 소식 후 5년 기간 만료시가 사망간주시점이다."},{"p":4,"q":"특별실종의 경우 위난이 종료된 때에 사망한 것으로 간주되는 것이 아니라, 위난 종료 후 1년이 지난 때 사망한 것으로 간주된다.","a":"X","e":"민법 제28조는 특별실종에서 전쟁종지·선박침몰·항공기추락 기타 위난이 종료한 때 사망한 것으로 본다. 1년은 선고 청구를 위한 기간이고, 사망간주시점은 위난 종료시다."},{"p":4,"q":"실종선고는 이해관계인이나 검사의 청구에 의하여 법원이 할 수 있다.","a":"O","e":"실종선고는 이해관계인 또는 검사의 청구에 의해 이루어진다."},{"p":4,"q":"실종선고는 실종자의 권리능력을 일반적으로 박탈하는 제도이다.","a":"X","e":"자료는 실종선고가 권리능력을 박탈하는 제도가 아니라고 정리한다. 종전 주소 중심의 법률관계를 정리하기 위한 사망간주다."},{"p":4,"q":"실종선고의 효과는 실종자의 종전 주소를 중심으로 한 법률관계에 미친다.","a":"O","e":"실종선고는 종전 주소 중심의 상속·혼인 등 법률관계를 정리하는 효과가 있다."},{"p":4,"q":"실종선고를 받은 자가 실제로 살아 돌아온 경우, 새로운 법률행위를 하기 위해 반드시 먼저 실종선고를 취소하여야 한다.","a":"X","e":"자료는 실종선고를 받은 자가 돌아온 후 새로운 법률행위를 하기 위해 실종선고를 취소해야 한다는 지문을 X로 정리한다."},{"p":4,"q":"실종선고를 받은 자라도 실제 생존하고 있는 동안 새로운 주소에서 한 법률행위가 당연히 무효가 되는 것은 아니다.","a":"O","e":"실종선고는 권리능력 박탈제도가 아니므로 생존자의 새로운 법률관계가 당연히 무효가 되는 것은 아니다."},{"p":4,"q":"실종자를 당사자로 한 판결이 확정된 뒤 실종선고가 확정되어 사망간주시점이 소 제기 전으로 소급하더라도, 그 판결이 당연히 무효가 되는 것은 아니다.","a":"O","e":"자료는 이러한 판결은 소급하여 당사자능력 없는 자를 상대로 한 판결로서 무효가 되는 것은 아니고 유효인 판결로 효력을 유지한다고 정리한다."},{"p":4,"q":"실종선고가 확정되면 실종자는 실종기간 만료 이전부터 사망했던 것으로 추정된다.","a":"X","e":"자료는 실종선고를 받은 자도 실종기간 만료시를 기준으로 그 이전까지는 생존으로 간주한다고 정리한다."},{"p":4,"q":"실종선고를 받은 자는 실종기간 만료시에 사망한 것으로 본다.","a":"O","e":"일반 원칙. 보통실종에서는 실종기간 만료시가 사망간주시점이다. 특별실종은 위난 종료시 사망간주라는 점은 별도 체크."},{"p":4,"q":"실종선고는 사실상 사망의 추정에 불과하므로 반대증거가 있어도 취소절차 없이 당연히 효력이 사라진다.","a":"X","e":"실종선고는 법원의 선고로 사망간주 효과를 발생시키므로, 생존 등 반대사실이 있으면 취소절차가 필요하다."},{"p":4,"q":"실종선고 후 실종자가 생존한 사실이 증명되면 실종선고 취소가 문제된다.","a":"O","e":"생존 사실, 사망간주시점과 다른 사망시점 등이 증명되면 실종선고 취소 사유가 된다."},{"p":4,"q":"실종선고가 취소되면 원칙적으로 실종선고로 발생한 사망간주 효과는 소급하여 소멸한다.","a":"O","e":"취소되면 사망간주에 기초한 법률관계는 원칙적으로 소급해 회복된다. 다만 선의로 한 행위 보호와 반환범위 제한이 중요하다."},{"p":4,"q":"실종선고 취소 전에 선의로 한 행위의 효력은 실종선고 취소로 영향을 받지 않는다.","a":"O","e":"민법 제29조의 핵심. 취소 전 선의 행위는 보호된다."},{"p":4,"q":"실종선고 취소 전의 매매처럼 쌍방행위에서는 당사자 일방만 선의이면 언제나 그 행위가 보호된다.","a":"X","e":"쌍방행위에서는 당사자 쌍방이 선의이어야 보호된다고 정리하는 것이 안전하다."},{"p":4,"q":"실종선고를 직접 원인으로 재산을 취득한 자가 선의이면 그 받은 이익이 현존하는 한도에서 반환하면 된다.","a":"O","e":"실종선고 취소 시 직접수익자가 선의이면 현존이익 반환으로 제한된다."},{"p":4,"q":"실종선고를 직접 원인으로 재산을 취득한 자가 악의이면 받은 이익 전부를 반환하고 손해가 있으면 배상책임도 문제될 수 있다.","a":"O","e":"악의 수익자는 선의처럼 현존이익으로 제한되지 않는다."},{"p":4,"q":"실종선고 취소 시 선의의 직접수익자는 받은 이익이 전혀 남아 있지 않더라도 전액 반환하여야 한다.","a":"X","e":"선의 직접수익자는 현존이익 한도 반환이다."},{"p":4,"q":"실종선고 취소의 효과는 선고 후 취소 전 선의로 한 법률행위까지 무조건 무효로 만든다.","a":"X","e":"취소 전 선의 행위의 효력은 보호된다."},{"p":4,"q":"실종선고는 부재자의 재산관리제도와 달리 사망간주를 통하여 상속 등 법률관계를 정리하는 기능을 한다.","a":"O","e":"부재자 관리는 재산 방지, 실종선고는 사망간주에 의한 법률관계 정리라는 점이 핵심 차이다."},{"p":4,"q":"실종기간이 만료되면 별도의 실종선고가 없어도 당연히 사망간주 효과가 발생한다.","a":"X","e":"실종선고가 있어야 사망간주 효과가 발생한다. 기간 만료만으로 당연 사망간주가 되는 것은 아니다."},{"p":4,"q":"실종선고의 사망간주 효과는 실종자의 실제 사망을 확정하는 것이 아니라 법률관계 정리를 위한 법률상 효과이다.","a":"O","e":"실종선고는 실제 사망확정이 아니라 사망으로 간주하는 법률효과다."},{"p":4,"q":"보통실종과 특별실종은 모두 실종선고가 있어야 사망간주 효과가 발생한다.","a":"O","e":"기간이 달라도 선고가 필요하다는 점은 같다."},{"p":4,"q":"실종선고 전에는 실종자가 생존한 것으로 추정되므로, 상속은 원칙적으로 개시되지 않는다.","a":"O","e":"실종선고 전에는 생존추정이므로 사망을 전제로 한 상속개시는 원칙적으로 문제되지 않는다."},{"p":5,"q":"법인은 자연인처럼 생명권ㆍ신체권ㆍ정조권ㆍ상속권을 가진다.","a":"X","e":"법인은 자연인 고유의 권리는 가질 수 없다. 성명권ㆍ명예권ㆍ신용권ㆍ재산권ㆍ유증을 받을 권리는 인정될 수 있다."},{"p":5,"q":"법인은 정관으로 정한 목적의 범위 내에서 권리와 의무의 주체가 된다.","a":"O","e":"민법상 법인의 권리능력은 법률규정과 정관 목적에 의해 제한된다."},{"p":5,"q":"법인의 목적범위는 정관에 명시된 목적 자체에 한정되고, 그 목적 달성에 필요한 행위는 포함되지 않는다.","a":"X","e":"목적범위에는 목적 자체뿐 아니라 목적 달성에 직접ㆍ간접으로 필요한 행위도 포함된다."},{"p":5,"q":"법인의 권리능력의 범위와 행위능력의 범위는 원칙적으로 일치한다.","a":"O","e":"법인실재설의 입장에서 권리능력 범위 내에서 행위능력도 인정된다."},{"p":5,"q":"해산한 법인은 청산의 목적범위 내에서만 권리와 의무의 주체가 된다.","a":"O","e":"해산 후에도 청산절차 종결 전까지 청산 목적 범위 내에서 법인격이 존속한다."},{"p":5,"q":"법인의 권리능력은 명령이나 규칙으로도 제한할 수 있다.","a":"X","e":"법인의 권리능력 제한은 법률에 의하여야 한다. 법률 이외의 명령ㆍ규칙만으로 제한할 수 없다."},{"p":5,"q":"비영리법인은 주무관청의 허가와 설립등기를 거쳐 성립한다.","a":"O","e":"비영리 사단법인ㆍ재단법인은 허가주의이며, 설립등기가 성립요건이다."},{"p":5,"q":"비영리법인의 설립허가는 법인의 설립행위 자체의 효력요건이므로, 허가가 없으면 정관작성행위 자체가 무효가 된다.","a":"X","e":"허가는 법인 성립절차상 요건이지 정관작성행위 자체의 효력요건은 아니다."},{"p":5,"q":"민법상 비영리법인의 설립허가는 주무관청의 자유재량행위로 본다.","a":"O","e":"비영리법인 설립허가 여부는 주무관청의 자유재량 영역으로 정리된다."},{"p":5,"q":"법인의 설립등기는 제3자에 대한 대항요건에 불과하고 성립요건은 아니다.","a":"X","e":"설립등기는 법인 성립요건이다. 등기를 해야 법인격을 취득한다."},{"p":5,"q":"사단법인의 정관에는 목적, 명칭, 사무소 소재지, 자산에 관한 규정, 이사의 임면에 관한 규정 등이 필요하다.","a":"O","e":"사단법인의 정관에는 법정 기재사항이 필요하고, 목적ㆍ명칭ㆍ사무소ㆍ자산ㆍ이사 임면 등이 핵심이다."},{"p":5,"q":"사단법인의 정관은 반드시 공증을 받아야만 효력이 발생한다.","a":"X","e":"민법상 비영리 사단법인의 정관에 공증이 일반적 효력요건으로 요구되는 것은 아니다."},{"p":5,"q":"사단법인의 설립행위는 2인 이상의 설립자가 정관을 작성하고 기명날인함으로써 이루어진다.","a":"O","e":"사단법인은 단체 설립이므로 2인 이상의 설립자가 필요하다."},{"p":5,"q":"재단법인은 1인의 설립자도 설립할 수 있다.","a":"O","e":"재단법인은 일정 재산을 출연하는 행위가 중심이므로 1인 설립도 가능하다."},{"p":5,"q":"재단법인의 설립행위는 상대방 없는 단독행위이다.","a":"O","e":"재단법인 설립은 재산출연을 포함하는 단독행위로 본다."},{"p":5,"q":"재단법인 설립자가 생전처분으로 재산을 출연하면 출연재산은 법인이 성립한 때부터 법인에 귀속된다.","a":"O","e":"생전출연은 법인 성립 시 귀속된다. 다만 제3자 대항에는 부동산 등기, 동산 인도가 필요하다."},{"p":5,"q":"재단법인 설립자가 유언으로 재산을 출연한 경우 출연재산은 법인 성립 시부터 귀속된다.","a":"X","e":"유언출연은 유언자의 사망 시로 소급하여 법인에 귀속된다."},{"p":5,"q":"재단법인 설립을 위한 부동산 출연은 법인 성립 외에 등기를 갖추어야 제3자에게 대항할 수 있다.","a":"O","e":"부동산 출연은 등기가 제3자 대항요건이다."},{"p":5,"q":"재단법인 설립을 위한 동산 출연은 법인 성립 외에 인도까지 있어야 제3자에게 대항할 수 있다.","a":"O","e":"동산 출연은 인도가 제3자 대항요건이다."},{"p":5,"q":"재단법인의 출연재산이 부동산인 경우 제3자 대항요건은 인도이다.","a":"X","e":"부동산은 등기가 대항요건이다."},{"p":5,"q":"재단법인의 출연재산이 동산인 경우 제3자 대항요건은 등기이다.","a":"X","e":"동산은 인도가 대항요건이다."},{"p":5,"q":"재단법인의 설립자가 정관에 목적과 자산만 정하고 명칭 등을 정하지 않은 채 사망하면 법원이 이를 보충할 수 있다.","a":"O","e":"재단법인은 목적과 자산이 정해져 있으면 명칭ㆍ사무소ㆍ이사 임면방법 등은 법원이 보충할 수 있다."},{"p":5,"q":"재단법인의 설립자가 이사 임면방법을 정하지 않고 사망한 경우 법원은 이를 보충할 수 없다.","a":"X","e":"목적과 자산이 정해져 있으면 법원이 이사 임면방법 등 누락사항을 보충할 수 있다."},{"p":5,"q":"법인의 대표기관이 대외적으로 직무관련 행위를 할 때에는 대리에 관한 규정이 준용된다.","a":"O","e":"법인 행위는 대표기관을 통해 이루어지고, 대외적 직무행위에는 대리규정과 현명주의가 준용된다."},{"p":5,"q":"법인의 대표기관이 직무에 관하여 타인에게 손해를 가하면 법인은 불법행위책임을 질 수 있다.","a":"O","e":"대표기관의 직무관련 불법행위는 법인 자신의 불법행위로 평가된다."},{"p":5,"q":"법인의 불법행위책임이 성립하려면 대표기관이 반드시 등기부상 이사로 등재되어 있어야 한다.","a":"X","e":"실질적으로 법인을 지배ㆍ운영하는 대표기관도 포함될 수 있다."},{"p":5,"q":"감사나 임의대리인의 불법행위는 원칙적으로 민법 제35조의 법인 불법행위책임의 대표기관 범위에 당연히 포함된다.","a":"X","e":"감사ㆍ임의대리인ㆍ대표권 없는 이사는 일반적으로 제35조 대표기관에 해당하지 않는다."},{"p":5,"q":"법인의 불법행위가 성립하면 대표기관 개인은 손해배상책임을 지지 않는다.","a":"X","e":"법인과 대표기관 개인은 피해자에 대해 부진정연대책임 관계가 될 수 있다."},{"p":5,"q":"대표기관의 행위가 직무에 해당하지 않음을 피해자가 알았거나 중대한 과실로 알지 못한 경우에는 법인의 불법행위책임을 물을 수 없다.","a":"O","e":"외형상 직무관련 행위라도 상대방의 악의 또는 중과실이 있으면 법인 책임을 제한한다."},{"p":5,"q":"대표기관의 직무관련 불법행위에서 피해자에게 경과실이 있으면 과실상계가 문제될 수 있다.","a":"O","e":"피해자의 경과실은 법인 책임 성립 자체를 부정하지 않고 과실상계 문제로 처리될 수 있다."},{"p":5,"q":"법인이 대표기관의 불법행위로 손해배상한 경우 대표기관에게 구상할 수 없다.","a":"X","e":"법인은 손해배상 후 선관주의의무 위반 등으로 대표기관에게 구상할 수 있다."},{"p":5,"q":"법인의 대표권 제한은 정관에 기재되어 있어도 등기하지 않으면 선의의 제3자에게 대항할 수 없다.","a":"O","e":"이사의 대표권 제한은 등기해야 제3자에게 대항할 수 있다."},{"p":5,"q":"법인의 대표권 제한은 선의ㆍ악의를 불문하고 제3자에게 대항할 수 없다.","a":"X","e":"등기 여부와 상대방의 선의ㆍ악의가 문제된다. 등기된 제한은 대항 가능성이 있다."},{"p":5,"q":"이사가 수인인 경우 정관에 다른 규정이 없으면 법인의 사무집행은 이사의 과반수로 결정한다.","a":"O","e":"정관에 다른 정함이 없으면 이사 과반수의 결의로 사무집행을 결정한다."},{"p":5,"q":"이사는 법인을 대표하는 기관이지만, 정관이나 총회결의로 대표권을 제한할 수 있다.","a":"O","e":"대표권 제한 자체는 가능하나 제3자 대항에는 등기 등 공시가 문제된다."},{"p":5,"q":"이사가 없거나 결원이 생긴 경우 법원은 이해관계인이나 검사의 청구에 의해 임시이사를 선임할 수 있다.","a":"O","e":"법인의 사무 처리 공백을 막기 위해 임시이사 제도가 인정된다."},{"p":5,"q":"임시이사는 법원이 선임하므로 정식 이사가 아니어서 법인을 대표할 수 없다.","a":"X","e":"임시이사는 법인의 사무를 처리하고 필요한 범위에서 대표권을 행사할 수 있다."},{"p":5,"q":"법인과 이사의 이익이 상반되는 사항에 관하여는 특별대리인을 선임하여야 한다.","a":"O","e":"이사의 자기거래 등 이해상반 상황에서는 특별대리인이 필요하다."},{"p":5,"q":"특별대리인은 언제나 주무관청이 선임한다.","a":"X","e":"특별대리인은 법원이 선임하는 구조로 정리한다."},{"p":5,"q":"이사의 직무집행정지 가처분이 있는 경우 직무대행자가 선임될 수 있다.","a":"O","e":"직무대행자는 가처분 등으로 이사의 직무집행이 정지된 경우 법인 사무 공백을 막기 위한 기관이다."},{"p":5,"q":"직무대행자는 원칙적으로 법인의 통상사무에 속하지 않는 행위를 마음대로 할 수 있다.","a":"X","e":"직무대행자의 권한은 통상사무 중심이고, 통상사무 외 행위는 법원의 허가 등이 필요하다."},{"p":5,"q":"법인의 감사는 법인의 재산상황과 이사의 업무집행을 감사할 수 있다.","a":"O","e":"감사는 법인의 사무와 재산상황을 감독하는 기관이다."},{"p":5,"q":"감사는 법인을 대표하는 상설 대표기관이다.","a":"X","e":"감사는 감독기관이지 상설 대표기관이 아니다."},{"p":5,"q":"사단법인의 사원총회는 사단법인의 최고 의사결정기관이다.","a":"O","e":"사원총회는 사단법인의 의사결정기관으로 중요한 사항을 결의한다."},{"p":5,"q":"재단법인에도 사원이 있으므로 사원총회를 필수기관으로 둔다.","a":"X","e":"재단법인은 재산의 집합체이므로 사원이 없고 사원총회도 없다."},{"p":5,"q":"사단법인의 사원은 정관에 따라 의결권을 행사할 수 있고, 정관에 특별한 정함이 없으면 각 사원의 의결권은 평등하다.","a":"O","e":"사원평등 원칙이 적용되며 정관으로 달리 정할 수 있다."},{"p":5,"q":"사단법인의 총회결의는 언제나 전 사원의 동의를 요한다.","a":"X","e":"일반 결의는 정관 및 민법상 정족수에 따른다. 정관변경 등 일부는 특별정족수가 문제된다."},{"p":5,"q":"사단법인의 정관변경은 총사원 3분의 2 이상의 동의가 원칙이지만 정관으로 정족수를 달리 정할 수 있다.","a":"O","e":"민법상 원칙은 총사원 3분의 2 이상 동의이며 정관으로 달리 정할 수 있다. 주무관청 허가도 필요하다."},{"p":5,"q":"사단법인의 정관변경은 총회결의만 있으면 되고 주무관청의 허가는 필요 없다.","a":"X","e":"사단법인의 정관변경은 총회결의 외에 주무관청 허가가 있어야 효력이 생긴다."},{"p":5,"q":"재단법인의 정관은 원칙적으로 변경할 수 없지만, 정관에 변경방법을 정한 경우에는 그 방법에 따라 변경할 수 있다.","a":"O","e":"재단법인은 설립자의 의사를 존중하므로 정관변경이 제한되나 예외가 있다."},{"p":5,"q":"재단법인의 목적을 달성할 수 없는 경우에는 설립자의 설립취지를 참작하여 목적 기타 정관 규정을 변경할 수 있다.","a":"O","e":"목적달성이 불가능한 경우에는 설립취지를 참작하여 정관변경이 가능하다."},{"p":5,"q":"재단법인은 사단법인과 달리 정관변경에 주무관청 허가가 전혀 필요 없다.","a":"X","e":"재단법인 정관변경도 허가가 문제된다."},{"p":5,"q":"재단법인의 기본재산 처분이 정관변경에 해당하는 경우 주무관청의 허가가 필요하다.","a":"O","e":"기본재산 처분은 재단 목적 수행의 기초를 변경할 수 있어 정관변경으로 취급될 수 있다."},{"p":5,"q":"법인의 사무는 주무관청이 검사ㆍ감독할 수 있다.","a":"O","e":"비영리법인은 주무관청의 감독을 받는다."},{"p":5,"q":"주무관청은 법인의 목적 외 사업, 설립허가 조건 위반, 공익침해 등이 있으면 설립허가를 취소할 수 있다.","a":"O","e":"설립허가 취소는 해산사유가 될 수 있다."},{"p":5,"q":"법인의 설립허가가 취소되어도 법인은 해산하지 않는다.","a":"X","e":"설립허가의 취소는 법인의 해산사유이다."},{"p":5,"q":"법인의 해산사유에는 존립기간 만료, 목적 달성 또는 달성불능, 파산, 설립허가 취소 등이 포함된다.","a":"O","e":"민법상 일반 해산사유의 핵심이다."},{"p":5,"q":"사단법인은 사원이 없게 된 경우에도 존속한다.","a":"X","e":"사단법인은 사람의 결합체이므로 사원이 없게 되면 해산한다."},{"p":5,"q":"사단법인은 총회의 결의로 해산할 수 있다.","a":"O","e":"사단법인은 총회 결의에 의한 해산이 가능하다."},{"p":5,"q":"법인이 해산하면 곧바로 청산절차 없이 법인격이 완전히 소멸한다.","a":"X","e":"해산 후 청산절차가 진행되고, 청산 목적 범위 내에서 법인격이 존속한다."},{"p":5,"q":"법인이 해산하면 이사는 원칙적으로 청산인이 된다. 다만 정관이나 총회결의로 달리 정할 수 있다.","a":"O","e":"청산인은 정관ㆍ총회결의ㆍ법원선임 등으로 정해지며, 원칙적으로 이사가 청산인이 된다."},{"p":5,"q":"청산인은 해산한 법인의 청산사무를 처리하고 법인을 대표한다.","a":"O","e":"청산인은 현존사무의 종결, 채권추심, 채무변제, 잔여재산 인도 등을 담당한다."},{"p":5,"q":"청산사무에는 현존사무의 종결, 채권의 추심, 채무의 변제, 잔여재산의 인도가 포함된다.","a":"O","e":"청산사무 암기 포인트는 현추변잔이다."},{"p":5,"q":"청산인은 해산등기 후 채권자에게 채권신고를 최고할 필요가 없다.","a":"X","e":"청산인은 채권자에게 일정 기간 내 채권신고를 최고해야 한다."},{"p":5,"q":"청산인이 알고 있는 채권자는 채권신고를 하지 않으면 당연히 청산에서 제외된다.","a":"X","e":"청산인이 알고 있는 채권자는 신고하지 않아도 청산에서 제외할 수 없다."},{"p":5,"q":"신고기간 내에 신고하지 않은 알려지지 않은 채권자는 일정한 범위에서 청산에서 제외될 수 있다.","a":"O","e":"제외된 채권자는 법인의 채무 완제 후 귀속권리자에게 인도되지 않은 잔여재산에 대해서만 변제를 청구할 수 있다."},{"p":5,"q":"청산에서 제외된 채권자는 법인의 채무가 완제된 후 귀속권리자에게 인도되지 않은 잔여재산에 대해서만 변제를 청구할 수 있다.","a":"O","e":"제외채권자의 권리행사 범위는 제한된다."},{"p":5,"q":"청산인은 청산사무가 종결되면 이를 등기하고 주무관청에 신고하여야 한다.","a":"O","e":"청산종결 등기와 신고가 필요하다."},{"p":5,"q":"청산종결등기가 완료되면 항상 모든 법률관계가 확정되어 다시는 법인격이 문제되지 않는다.","a":"X","e":"청산종결등기는 원칙적 소멸 효과가 있으나 잔존사무가 있으면 그 범위에서 법인격이 문제될 수 있다."},{"p":5,"q":"법인의 잔여재산은 정관으로 지정한 자에게 귀속시키는 것이 원칙이다.","a":"O","e":"정관 지정, 총회결의 또는 주무관청 허가, 국고귀속 순서로 정리한다."},{"p":5,"q":"잔여재산의 귀속권리자를 정하지 못한 경우에는 언제나 사원에게 균등하게 분배된다.","a":"X","e":"민법상 절차에 따라 귀속권리자가 정해지고, 최종적으로 국고귀속될 수 있다."},{"p":5,"q":"사단법인의 사원권은 공익권과 자익권으로 나눌 수 있다.","a":"O","e":"의결권 등 공익권, 이익배당청구 등 자익권으로 구분한다."},{"p":5,"q":"사단법인의 사원권은 원칙적으로 양도ㆍ상속의 대상이 된다.","a":"X","e":"사원권은 단체 구성원 지위와 결합되어 원칙적으로 일신전속적 성격이 강하다."},{"p":5,"q":"법인의 기관은 자연인인 개인이 담당하지만, 기관의 행위는 일정 범위에서 법인의 행위로 평가된다.","a":"O","e":"법인은 기관을 통해 행위하고 대표기관의 직무행위가 법인에게 귀속된다."},{"p":5,"q":"법인의 대표자는 법인의 기관이므로 현명 없이 행위해도 언제나 법인에게 효과가 귀속된다.","a":"X","e":"대외적 행위에는 대리규정이 준용되어 현명주의가 문제된다."},{"p":5,"q":"법인 아닌 사단도 일정한 실체를 갖추면 소송상 당사자능력이 인정될 수 있다.","a":"O","e":"비법인사단은 대표자ㆍ규약ㆍ총회 등 단체성을 갖추면 당사자능력이 인정된다."},{"p":5,"q":"권리능력 없는 사단은 그 명의로 부동산 등기를 할 수 없다.","a":"X","e":"권리능력 없는 사단도 부동산 등기명의자가 될 수 있다."},{"p":5,"q":"권리능력 없는 사단의 재산은 사원들의 총유에 속한다.","a":"O","e":"비법인사단의 재산은 총유로 정리한다."},{"p":5,"q":"권리능력 없는 재단의 재산은 구성원들의 총유에 속한다.","a":"X","e":"권리능력 없는 재단은 구성원이 없으므로 재단 자체의 단독소유처럼 취급된다."},{"p":5,"q":"권리능력 없는 사단의 대표권 제한은 등기할 방법이 없으므로, 상대방이 알았거나 알 수 있었던 경우가 아니면 거래행위는 유효로 본다.","a":"O","e":"비법인사단의 대표권 제한은 공시방법이 없어 상대방 보호가 강하다."},{"p":5,"q":"권리능력 없는 사단의 대표권 제한은 등기하지 않았다는 이유만으로 언제나 제3자에게 대항할 수 없다.","a":"X","e":"등기방법이 없으므로 상대방이 알았거나 알 수 있었는지가 문제된다."},{"p":5,"q":"민법 제35조의 법인 불법행위책임 규정은 법인 아닌 사단에도 유추적용될 수 있다.","a":"O","e":"비법인사단ㆍ재단에도 대표자의 직무관련 불법행위에 관해 유추적용된다."},{"p":5,"q":"권리능력 없는 사단의 대표자 행위가 직무에 해당하지 않음을 피해자가 알았거나 중대한 과실로 알지 못한 경우에는 손해배상을 청구할 수 없다.","a":"O","e":"법인 불법행위책임 법리가 비법인사단에도 유추적용된다."},{"p":5,"q":"종중은 자연발생적 종족단체로서 원칙적으로 공동선조와 성과 본을 같이 하는 후손 중 성년 남자만 구성원이 된다.","a":"X","e":"종중 구성원 자격을 성년 남자로만 제한하는 관습법은 효력을 상실했다. 여성도 구성원이 될 수 있다."},{"p":5,"q":"법인격 없는 종중도 대표자를 정하고 조직을 갖추면 소송상 당사자가 될 수 있다.","a":"O","e":"종중은 비법인사단으로서 단체성을 갖추면 당사자능력이 인정된다."},{"p":5,"q":"비법인사단의 총유물에 관한 관리ㆍ처분은 사원총회의 결의에 따른다.","a":"O","e":"총유물 관리ㆍ처분은 총회결의가 원칙이다."},{"p":5,"q":"비법인사단의 총유물 보존행위는 각 사원이 단독으로 할 수 있다.","a":"X","e":"총유는 공유ㆍ합유와 달리 보존행위도 원칙적으로 총회결의가 필요하다고 정리한다."},{"p":5,"q":"각 사원은 정관 기타 규약에 좇아 총유물을 사용ㆍ수익할 수 있다.","a":"O","e":"총유에서는 지분은 없지만 규약에 따른 사용ㆍ수익이 가능하다."},{"p":5,"q":"총유에는 각 사원의 지분이 인정되므로 사원은 자기 지분을 양도할 수 있다.","a":"X","e":"총유에는 지분이 없다. 지분처분과 분할청구가 인정되지 않는다."},{"p":5,"q":"비법인사단의 채무는 원칙적으로 사원 전원의 총유재산으로 책임지고, 사원이 당연히 개인책임을 지는 것은 아니다.","a":"O","e":"단체채무와 사원 개인책임은 구별된다. 특별한 사정 없이 사원이 당연히 개인책임을 지지는 않는다."},{"p":5,"q":"사단법인은 영리를 목적으로 하여도 민법상 비영리법인으로 설립할 수 있다.","a":"X","e":"민법상 비영리법인은 영리 아닌 사업을 목적으로 한다. 영리법인은 상법 회사 등 별도 법률에 따른다."},{"p":5,"q":"비영리법인은 반드시 공익을 목적으로 하여야 하며, 구성원 공동이익을 목적으로 하는 법인은 허용되지 않는다.","a":"X","e":"비영리는 영리분배를 목적으로 하지 않는다는 뜻이지 반드시 공익만을 의미하지 않는다."},{"p":5,"q":"사단법인은 사람의 결합체이고, 재단법인은 재산의 결합체이다.","a":"O","e":"사단은 구성원, 재단은 출연재산이 중심이다."},{"p":5,"q":"사단법인은 사원이 없게 되면 해산하지만, 재단법인은 사원이 없다는 사유로 해산하지 않는다.","a":"O","e":"재단법인에는 사원이 없으므로 사원 부존재는 해산사유가 아니다."},{"p":5,"q":"재단법인 설립행위에는 반드시 목적과 자산에 관한 규정이 있어야 한다.","a":"O","e":"재단법인은 재산이 중심이므로 목적과 자산이 핵심적ㆍ필수적 요소이다."},{"p":5,"q":"사단법인과 재단법인은 모두 정관으로 주된 사무소의 소재지를 정하여야 한다.","a":"O","e":"사무소 소재지는 법인 정관의 중요 기재사항이다."},{"p":5,"q":"법인은 본점 또는 주된 사무소 소재지에서 설립등기를 함으로써 성립한다.","a":"O","e":"설립등기의 장소와 성립요건 포인트이다."},{"p":5,"q":"법인이 사무소를 이전하면 언제나 법인격을 상실한다.","a":"X","e":"사무소 이전은 변경등기 사항이지 법인격 상실 사유가 아니다."},{"p":5,"q":"법인의 등기사항이 변경되면 일정 기간 내에 변경등기를 하여야 한다.","a":"O","e":"등기사항 변경은 변경등기의 대상이다. 기존 OX에서는 3주 내 변경등기 포인트로 정리했다."},{"p":5,"q":"법인의 등기사항 변경을 등기하지 않으면 그 변경을 제3자에게 대항하지 못하는 경우가 있다.","a":"O","e":"법인 등기는 공시기능을 하므로 미등기 변경사항은 제3자 대항이 제한된다."},{"p":5,"q":"법인 이사의 대표권 제한을 등기하지 않은 경우 선의의 제3자에게 대항할 수 없다.","a":"O","e":"대표권 제한은 공시되어야 제3자에게 대항할 수 있다."},{"p":5,"q":"대표권 제한을 위반한 법률행위라도 상대방이 그 제한을 알았거나 알 수 있었던 경우에는 법인에게 효력이 귀속되지 않을 수 있다.","a":"O","e":"상대방 보호는 선의ㆍ무중과실일 때 강하다."},{"p":5,"q":"법인의 목적범위 외 행위도 대표기관이 하면 언제나 법인에게 유효하게 귀속된다.","a":"X","e":"목적범위 밖 행위는 권리능력 밖이므로 원칙적으로 무효이다."},{"p":5,"q":"법인의 대표기관이 목적범위 내에서 한 직무관련 행위는 법인의 행위로 평가된다.","a":"O","e":"대표기관의 행위는 법인의 행위로 귀속된다."},{"p":5,"q":"법인 아닌 사단은 법인격이 없으므로 대표자가 한 계약의 효과가 언제나 대표자 개인에게만 귀속된다.","a":"X","e":"비법인사단 자체가 등기ㆍ소송상 주체가 될 수 있고 단체로서 거래효과가 귀속될 수 있다."},{"p":5,"q":"비법인재단에는 사원이 없으므로 총유관계가 성립하기 어렵다.","a":"O","e":"비법인재단은 구성원이 아니라 목적재산이 중심이므로 총유가 아니라 재단 자체 소유처럼 취급한다."},{"p":5,"q":"권리능력 없는 사단이 취득한 부동산은 사원 각자의 공유로 등기하여야만 한다.","a":"X","e":"비법인사단 자체 명의 등기가 가능하다."},{"p":5,"q":"사단법인의 총회결의가 절차상 하자가 있으면 언제나 당연무효이고 추인도 불가능하다.","a":"X","e":"하자 유형과 정도에 따라 무효ㆍ취소 등 판단이 달라진다. '언제나'는 과하다."},{"p":5,"q":"사단법인의 이사는 선량한 관리자의 주의로 직무를 수행하여야 한다.","a":"O","e":"이사는 위임 유사의 지위로 선관주의의무를 부담한다."},{"p":5,"q":"이사가 법령 또는 정관에 위반하여 법인에 손해를 입히면 법인에 대해 책임을 질 수 있다.","a":"O","e":"기관 내부책임의 기본 구조이다."},{"p":5,"q":"법인의 대표기관의 불법행위책임은 대표기관이 개인적으로 얻은 이익이 없으면 성립할 수 없다.","a":"X","e":"대표기관의 이익 취득 여부가 필수요건은 아니다. 직무관련성과 손해 발생이 핵심이다."},{"p":5,"q":"대표기관의 행위가 외형상 직무행위로 보이면 실제 직무집행행위가 아니어도 일정한 경우 법인책임이 인정될 수 있다.","a":"O","e":"외형이론에 따라 상대방이 보호될 수 있다. 단 상대방 악의ㆍ중과실은 제한된다."},{"p":5,"q":"이사가 개인 채무를 변제하기 위해 법인 명의로 행위한 경우에도 상대방이 그 사정을 알았으면 법인은 언제나 책임진다.","a":"X","e":"상대방이 직무관련성이 없음을 알았거나 중과실로 몰랐다면 법인책임이 부정될 수 있다."},{"p":5,"q":"법인의 기관에는 이사, 임시이사, 특별대리인, 청산인, 직무대행자가 포함될 수 있다.","a":"O","e":"대표기관 범위로 자주 정리되는 항목이다."},{"p":5,"q":"법인의 대표기관 범위에는 감사와 임의대리인이 당연히 포함된다.","a":"X","e":"감사와 임의대리인은 일반적으로 대표기관 범위에 포함되지 않는다."},{"p":5,"q":"비영리법인은 수익사업을 전혀 할 수 없다.","a":"X","e":"비영리 목적에 반하지 않고 목적 달성에 필요한 범위에서는 수익사업이 가능할 수 있다. 다만 이익분배 목적은 안 된다."},{"p":5,"q":"비영리법인이 구성원에게 이익을 분배할 목적으로 사업을 하면 민법상 비영리법인 목적에 반한다.","a":"O","e":"영리성은 이익의 분배 목적과 관련된다."},{"p":5,"q":"법인의 정관은 법인의 근본규칙이므로 법인 내부관계와 대외적 권리능력 판단에 중요한 기준이 된다.","a":"O","e":"정관은 목적범위, 기관, 사무소, 자산 등 법인의 기본 구조를 정한다."},{"p":5,"q":"재단법인은 설립자의 의사보다 현재 이사의 의사를 우선하므로 정관변경이 자유롭다.","a":"X","e":"재단법인은 설립자의 의사를 존중하므로 정관변경이 제한된다."},{"p":5,"q":"사단법인은 구성원 의사에 기초하므로 재단법인보다 정관변경이 상대적으로 쉽다.","a":"O","e":"사단법인은 총회결의를 통한 정관변경이 가능하나 허가가 필요하다."},{"p":5,"q":"청산 중인 법인은 새로운 적극적 영업활동을 자유롭게 할 수 있다.","a":"X","e":"청산법인은 청산 목적 범위 내에서만 존속하므로 청산 외 새로운 활동은 제한된다."},{"p":5,"q":"청산인이 채무를 변제하기 전 잔여재산을 인도하면 채권자 보호 문제가 발생한다.","a":"O","e":"청산절차는 채권자 보호 후 잔여재산 귀속으로 진행된다."},{"p":5,"q":"법인의 파산은 해산사유가 될 수 있다.","a":"O","e":"파산은 법인의 일반 해산사유 중 하나이다."},{"p":5,"q":"법인의 목적달성 불능은 해산사유가 되지 않는다.","a":"X","e":"목적 달성 또는 달성불능은 해산사유이다."},{"p":5,"q":"법인의 존립기간이 만료되면 해산사유가 발생한다.","a":"O","e":"정관상 존립기간 만료는 해산사유이다."},{"p":5,"q":"사단법인의 사원은 법인의 채무에 대해 원칙적으로 직접 무한책임을 진다.","a":"X","e":"사원은 원칙적으로 법인 채무에 직접 책임지지 않는다."},{"p":5,"q":"사단법인의 재산은 법인 자체의 단독소유이지 사원들의 공유나 총유가 아니다.","a":"O","e":"법인격 있는 사단법인의 재산은 법인 자체에 귀속된다."},{"p":5,"q":"재단법인의 재산은 설립자 개인의 소유로 남는다.","a":"X","e":"법인이 성립하면 출연재산은 법인에 귀속되고 설립자 개인 소유가 아니다."},{"p":5,"q":"권리능력 없는 사단의 사원이 탈퇴해도 총유재산에 대한 지분반환청구는 원칙적으로 인정되지 않는다.","a":"O","e":"총유에는 지분이 없으므로 탈퇴자가 지분반환을 당연히 청구할 수 없다."},{"p":5,"q":"총유물의 처분은 사원 각자가 자기 지분 범위에서 자유롭게 할 수 있다.","a":"X","e":"총유에는 지분이 없고 처분은 총회결의에 따른다."},{"p":5,"q":"비법인사단의 대표자가 총회결의 없이 총유물을 처분하면 원칙적으로 적법한 처분으로 보기 어렵다.","a":"O","e":"총유물 관리ㆍ처분에는 사원총회 결의가 필요하다."},{"p":5,"q":"법인 아닌 사단의 대표자는 언제나 총유물 보존행위를 단독으로 할 수 없다.","a":"X","e":"대표자의 권한, 규약, 총회결의 여부 등 구체적 구조를 보아야 한다. 다만 사원 각자 단독 보존행위는 부정된다."},{"p":5,"q":"법인 파트에서는 법인격 있는 단체와 권리능력 없는 사단ㆍ재단의 재산귀속을 구별하는 것이 중요하다.","a":"O","e":"사단법인ㆍ재단법인=법인 단독소유, 비법인사단=총유, 비법인재단=단독소유처럼 압축한다."},{"p":6,"q":"민법상 물건은 유체물뿐 아니라 전기 기타 관리할 수 있는 자연력도 포함한다.","a":"O","e":"민법상 물건은 유체물과 전기 기타 관리할 수 있는 자연력을 말한다. 전기는 관리 가능성이 있으므로 물건에 포함된다."},{"p":6,"q":"권리 자체도 재산적 가치가 있으면 소유권의 객체가 될 수 있다.","a":"X","e":"소유권의 객체는 원칙적으로 물건이다. 아파트분양권, 채권 자체에는 소유권이 성립하지 않는다."},{"p":6,"q":"민법상 물건은 반드시 독립성이 있어야 하므로, 물건의 일부나 구성부분은 원칙적으로 독립한 물건으로 취급되지 않는다.","a":"O","e":"거래상 독립성이 없는 구성부분은 독립한 물건이 아니다. 구성부분이 되면 부합물 문제로 넘어간다."},{"p":6,"q":"부동산은 토지와 그 정착물이고, 동산은 부동산 이외의 물건이다.","a":"O","e":"부동산은 토지 및 그 정착물이고, 그 외의 물건은 동산이다."},{"p":6,"q":"토지소유권은 정당한 이익이 있는 범위 내에서 토지의 상하에 미친다.","a":"O","e":"토지소유권은 무한히 공중과 지하에 미치는 것이 아니라 정당한 이익 범위 안에서 상하에 미친다."},{"p":6,"q":"토지 지하의 암석, 토사, 지하수, 온천수는 원칙적으로 토지의 구성부분이다.","a":"O","e":"토지 지하의 암석, 토사, 지하수, 온천수 등은 토지의 구성부분으로 본다."},{"p":6,"q":"미채굴 광물은 토지의 구성부분으로서 토지소유자에게 당연히 귀속된다.","a":"X","e":"미채굴 광물은 광업법상 국유로 취급되는 포인트다. 토지소유자의 당연한 소유물이 아니다."},{"p":6,"q":"건물은 지붕, 주벽, 기둥을 갖추면 독립한 부동산으로 인정될 수 있다.","a":"O","e":"건물이 사회통념상 독립성을 갖추면 토지와 별개의 독립 부동산이 된다. 핵심 요소는 지붕, 주벽, 기둥이다."},{"p":6,"q":"건물은 토지의 정착물이므로 언제나 토지의 부합물 또는 종물이 된다.","a":"X","e":"건물은 토지와 별개의 독립한 부동산이다. 건물은 토지의 부합물이나 종물이 될 수 없다."},{"p":6,"q":"사회통념상 독립한 건물이 아닌 정착물은 토지의 일부가 될 수 있다.","a":"O","e":"건축공사가 중단되어 독립한 건물로 볼 수 없는 정착물은 토지의 일부 또는 부합물로 평가될 수 있다."},{"p":6,"q":"미완성 건물을 인도받아 완공한 경우에는 완공한 자가 언제나 건물소유권을 원시취득한다.","a":"X","e":"미완성 건물이 이미 사회통념상 독립한 건물의 형태와 구조를 갖추었다면 원래 건축주가 원시취득할 수 있다. '언제나'가 함정이다."},{"p":6,"q":"무허가건물을 신축한 경우에도 신축자는 등기 없이 소유권을 원시취득할 수 있다.","a":"O","e":"건물 신축에 의한 소유권 취득은 법률행위에 의한 물권변동이 아니므로 등기 없이 원시취득한다."},{"p":6,"q":"건축허가서에 건축주로 기재되어 있으면 특별한 사정이 없는 한 건물소유권의 추정력이 인정된다.","a":"X","e":"건축허가 명의는 실체적 권리관계를 공시하거나 소유권을 추정하게 하는 제도가 아니다."},{"p":6,"q":"도급계약에서 수급인이 자기 재료와 노력으로 건물을 완성한 경우에도 도급인에게 소유권을 귀속시키기로 합의하면 도급인이 원시취득할 수 있다.","a":"O","e":"도급에서는 재료 공급과 당사자 합의가 중요하다. 완성 건물의 소유권 귀속 합의가 있으면 도급인에게 원시적으로 귀속할 수 있다."},{"p":6,"q":"타인의 토지에 권원 없이 농작물을 경작하여 수확기에 이른 경우, 농작물의 소유권은 언제나 토지소유자에게 있다.","a":"X","e":"권원 없이 타인 토지에 경작한 농작물도 수확기에 이르면 원칙적으로 경작자 소유로 본다."},{"p":6,"q":"타인의 토지에 권원 없이 경작된 농작물이 수확기에 이른 경우, 경작자는 명인방법을 갖추어야만 소유권을 취득한다.","a":"X","e":"수확기에 이른 농작물은 경작자 소유이고 명인방법을 갖출 필요가 없다. 다만 미분리 농작물을 양도받은 자는 명인방법 문제가 생긴다."},{"p":6,"q":"수확되지 않은 농작물이 양도된 경우, 매수인이 그 소유권을 취득하려면 명인방법을 갖추어야 한다.","a":"O","e":"미분리 농작물의 양도에서는 명인방법이 소유권 공시방법으로 기능한다."},{"p":6,"q":"길이 4~5cm의 못자리도 농작물로 볼 수 있다.","a":"O","e":"자료는 길이 4~5cm의 못자리도 농작물에 해당할 수 있다고 정리한다."},{"p":6,"q":"수목은 입목등기를 하면 토지와 독립하여 소유권과 저당권의 객체가 될 수 있다.","a":"O","e":"입목등기를 한 수목은 토지와 독립한 부동산으로 취급되어 소유권과 저당권의 객체가 될 수 있다."},{"p":6,"q":"수목의 명인방법은 소유권을 공시하는 관습법상 방법이다.","a":"O","e":"수목이나 미분리과실의 명인방법은 관습법상 소유권 공시방법으로 이해한다."},{"p":6,"q":"무기명채권인 승차권, 입장권, 상품권은 동산으로 취급된다.","a":"X","e":"자료는 무기명채권을 동산이 아니라 채권으로 취급한다고 정리한다."},{"p":6,"q":"동산에는 소유권과 질권, 유치권이 성립할 수 있으나 용익물권의 객체로는 할 수 없다.","a":"O","e":"동산에는 소유권과 담보물권인 질권, 유치권이 문제될 수 있으나 지상권, 지역권, 전세권 같은 용익물권의 객체가 아니다."},{"p":6,"q":"동산에는 저당권이 성립하는 것이 원칙이고, 부동산에는 질권이 성립하는 것이 원칙이다.","a":"X","e":"원칙적으로 부동산에는 저당권, 동산에는 질권이 성립한다."},{"p":6,"q":"유치권은 부동산과 동산 모두에 성립할 수 있다.","a":"O","e":"유치권은 타인의 물건 또는 유가증권을 대상으로 하므로 부동산과 동산 모두 문제될 수 있다."},{"p":6,"q":"타인의 점유에 들어간 금전은 언제나 특정물로서 물권적 반환청구권의 대상이 된다.","a":"X","e":"금전은 고도의 대체성과 유통성 때문에 원칙적으로 소유와 점유가 일치한다. 타인의 점유에 들어가면 물권적 반환청구보다 가치반환청구가 문제된다."},{"p":6,"q":"금전채무의 불이행은 원칙적으로 이행불능이 아니라 이행지체 문제로 처리된다.","a":"O","e":"금전은 대체 가능하므로 금전채무는 언제나 이행불능이 아니라 이행지체가 문제된다."},{"p":6,"q":"금전채무 불이행에서 채권자는 손해의 존재와 손해액을 증명하여야 하고, 채무자는 무과실을 항변할 수 있다.","a":"X","e":"금전채무 불이행에서는 손해의 존재와 액수를 증명할 필요가 없고, 채무자는 무과실 항변을 할 수 없다."},{"p":6,"q":"금전채무 불이행의 손해배상액은 법정이율에 따르나, 법령 제한에 위반되지 않는 약정이율이 있으면 그 약정이율에 따른다.","a":"O","e":"금전채무 불이행 손해배상은 법정이율이 원칙이고, 유효한 약정이율이 있으면 약정이율을 따른다."},{"p":6,"q":"강제통용력을 상실한 주화는 금전이 아니라 동산으로 취급될 수 있다.","a":"O","e":"상평통보, 당백전처럼 통용력을 잃은 주화는 금전이 아니라 동산으로 취급된다."},{"p":6,"q":"주물과 종물의 구분은 물건 상호의 관계에 관한 것이므로 부동산과 동산 모두 주물 또는 종물이 될 수 있다.","a":"O","e":"주물-종물 관계는 물건 상호작용에 따른 구분이다. 부동산과 동산 모두 주물 또는 종물이 될 수 있다."},{"p":6,"q":"종물은 주물의 소유자가 그 물건의 상용에 공하기 위하여 자기 소유의 다른 물건을 부속하게 한 것이다.","a":"O","e":"종물은 주물의 경제적 효용을 계속적으로 돕기 위해 부속된 독립한 물건이다."},{"p":6,"q":"종물이 되려면 주물과 종물이 반드시 물리적으로 결합하여 하나의 구성부분이 되어야 한다.","a":"X","e":"종물은 독립한 물건이어야 한다. 구성부분이 되면 부합물이지 종물이 아니다."},{"p":6,"q":"주택의 정화조는 주택의 구성부분이지 주택의 종물이 아니다.","a":"O","e":"정화조처럼 주택 기능상 구성부분으로 결합된 것은 종물이 아니라 구성부분으로 본다."},{"p":6,"q":"주택과 창고용 부속건물은 주물과 종물 관계가 성립할 수 있다.","a":"O","e":"주택의 경제적 효용을 계속적으로 돕는 창고용 부속건물은 종물 예시로 자주 나온다."},{"p":6,"q":"주유소와 주유기는 주물과 종물 관계가 성립할 수 있다.","a":"O","e":"주유기는 주유소 영업의 경제적 효용을 직접 계속적으로 돕는 독립물로 종물이 될 수 있다."},{"p":6,"q":"백화점 건물에 임차인이 설치한 전화교환설비는 백화점 건물의 종물이 된다.","a":"X","e":"종물은 주물 소유자의 소유에 속해야 한다. 임차인이 설치한 설비는 소유자 동일성이 없어 종물이 아니다."},{"p":6,"q":"횟집과 그 부속건물인 수족관은 주물과 종물 관계가 성립할 수 있다.","a":"O","e":"수족관이 횟집 영업의 효용을 계속 돕는 독립물이라면 종물로 볼 수 있다."},{"p":6,"q":"침구, 책상, 식탁, 전화기처럼 이용자의 편의에 제공되지만 주물 자체의 효용과 직접 관련 없는 물건은 종물이 아니다.","a":"O","e":"주물 자체의 경제적 효용을 직접 돕는 관계가 필요하다. 단순히 이용자 편의에 제공되는 물건은 종물이 아니다."},{"p":6,"q":"종물이 되려면 주물과 장소적으로 밀접한 관계가 있어야 하며, 일시적 분리도 항상 종물성을 상실시킨다.","a":"X","e":"장소적 밀접성은 필요하지만 일시적 분리만으로 곧바로 종물성이 없어지는 것은 아니다."},{"p":6,"q":"주물의 효용에 일시적으로 제공된 물건도 종물이 된다.","a":"X","e":"종물은 주물의 상용에 공해야 하므로 일시적 제공은 부족하다."},{"p":6,"q":"주물과 다른 사람 소유의 물건도 주물의 효용을 돕기만 하면 종물이 될 수 있다.","a":"X","e":"종물은 원칙적으로 주물 소유자의 소유에 속해야 한다. 소유자 동일성이 필요하다."},{"p":6,"q":"종물은 주물의 처분에 따른다는 규정은 임의규정이다.","a":"O","e":"당사자는 특약으로 주물과 종물을 분리하여 처분할 수 있다."},{"p":6,"q":"주물을 처분하면서 특약으로 종물을 제외하는 것은 불가능하다.","a":"X","e":"제100조 제2항은 임의규정이므로 특약으로 종물을 제외할 수 있다."},{"p":6,"q":"주물에 설정된 저당권의 효력은 특별한 사정이 없는 한 설정 당시의 종물뿐 아니라 설정 후 부속된 종물에도 미친다.","a":"O","e":"저당권 효력은 설정 전후를 불문하고 종물과 부합물에 미친다. 다만 특별규정이나 특약이 있으면 달라질 수 있다."},{"p":6,"q":"주물에 설정된 저당권의 효력은 저당권 설정 당시 존재한 부합물에만 미치고 설정 후 부합물에는 미치지 않는다.","a":"X","e":"저당권 효력은 설정 전후를 불문하고 부합물과 종물에 미친다."},{"p":6,"q":"토지에 대한 경매절차에서 지상건물을 토지의 종물로 보아 함께 경락허가를 하였더라도 그 건물 소유권은 당연히 이전되지 않는다.","a":"O","e":"건물은 토지의 종물이나 부합물이 아니므로 토지 경매에 포함되었다고 하여 건물 소유권이 당연히 변동하지 않는다."},{"p":6,"q":"종물은 주물의 처분에 따른다는 규정은 법률행위에 의한 처분뿐 아니라 법률규정에 의한 권리변동에도 당연히 적용된다.","a":"X","e":"제100조 제2항의 '처분'은 법률행위에 의한 처분을 전제로 하며, 법률규정에 의한 권리변동에는 그대로 적용되지 않는다."},{"p":6,"q":"주물을 시효취득한 경우, 종물을 점유하거나 인도받지 않았더라도 종물도 당연히 시효취득한다.","a":"X","e":"주물의 시효취득 효과가 점유하지 않은 종물에 당연히 미치는 것은 아니다."},{"p":6,"q":"주물과 종물에 관한 법리는 권리 상호 간에도 확대 적용될 수 있다.","a":"O","e":"민법 제100조 제2항은 물건뿐 아니라 권리 상호 간에도 유추 또는 확대 적용될 수 있다."},{"p":6,"q":"타인 토지 위 건물에 저당권이 설정된 경우, 특별한 사정이 없으면 그 저당권의 효력은 건물 소유를 목적으로 하는 지상권 또는 임차권에도 미친다.","a":"O","e":"건물 소유를 위한 토지이용권은 건물의 이용에 필수적인 종된 권리로 보아 저당권 효력이 미칠 수 있다."},{"p":6,"q":"타인 토지 위 건물에 설정된 저당권은 건물 소유를 목적으로 하는 지상권 또는 임차권에는 절대 미치지 않는다.","a":"X","e":"주물·종물 법리가 권리에도 확대되어 건물 저당권은 토지이용권에도 미칠 수 있다."},{"p":6,"q":"저당권의 효력은 종물과 부합물에는 미치지만 과실에는 언제나 미치지 않는다.","a":"X","e":"과실에는 원칙적으로 미치지 않지만, 저당부동산 압류 후 발생하거나 수취할 수 있는 과실에는 미칠 수 있다."},{"p":6,"q":"저당권의 효력은 저당부동산에 대한 압류 후 저당권설정자가 수취한 과실 또는 수취할 수 있는 과실에 미친다.","a":"O","e":"저당권자는 원칙적으로 과실수취권이 없지만, 압류 후에는 저당권의 효력이 과실에 미친다."},{"p":6,"q":"저당권자가 압류 후 과실에 대한 효력을 제3취득자에게 대항하려면 압류 사실을 통지하여야 한다.","a":"O","e":"소유권, 지상권, 전세권을 취득한 제3자에게는 압류 사실을 통지한 후가 아니면 과실에 대한 저당권 효력을 대항하지 못한다."},{"p":6,"q":"기존 건물에 대한 근저당권은 부합된 증축부분에도 효력이 미치므로, 경매에서 그 부분이 평가되지 않았더라도 경락인이 증축부분 소유권을 취득할 수 있다.","a":"O","e":"증축부분이 기존 건물에 부합된 경우 기존 건물 저당권의 효력이 미치고, 경락인은 부합부분의 소유권도 취득할 수 있다."},{"p":6,"q":"증축부분이 기존 건물에 부합되었는지는 물리적 구조만으로 판단하고 거래상·이용상 독립성은 고려하지 않는다.","a":"X","e":"증축부분의 독립성은 구조뿐 아니라 거래상·이용상 독립성까지 종합하여 판단한다."},{"p":6,"q":"원본채권의 변제기가 도래하기 전에 원본채권이 양도되면, 반대특약이 없는 한 종된 권리인 이자채권도 이전한다.","a":"O","e":"원본 변제기 전에는 이자채권이 원본채권에 종속되므로 반대특약이 없으면 함께 이전한다."},{"p":6,"q":"원본채권의 변제기가 도래한 후에는 이미 발생한 이자채권도 원본채권 양도 시 언제나 당연히 이전한다.","a":"X","e":"변제기 도래 후의 이자채권은 원본채권과 분리하여 양도 또는 변제될 수 있다. 양도 의사표시가 없으면 당연히 이전하지 않는다."},{"p":6,"q":"원물의 용법에 의하여 산출되는 산출물은 천연과실이다.","a":"O","e":"과수의 열매, 가축의 새끼처럼 원물의 용법에 의해 산출되는 산출물이 천연과실이다."},{"p":6,"q":"원물의 사용대가로 받는 금전 기타 물건은 법정과실이다.","a":"O","e":"차임, 지료, 이자, 사용료, 소작료는 법정과실이다."},{"p":6,"q":"천연과실은 원물로부터 분리하는 때에 이를 수취할 권리자에게 속한다.","a":"O","e":"천연과실은 분리 시 수취권자에게 귀속한다."},{"p":6,"q":"법정과실은 권리의 존속기간 일수의 비율로 취득한다.","a":"O","e":"법정과실은 권리의 존속기간에 따라 일수 비율로 계산하여 취득한다."},{"p":6,"q":"천연과실의 수취권자는 언제나 원물의 소유자뿐이다.","a":"X","e":"원칙은 소유자지만 지상권자, 전세권자, 임차인, 선의의 점유자 등 정당한 사용수익권자가 과실을 취득할 수 있다."},{"p":6,"q":"과실취득권이 있는 선의의 점유자란 소유권, 지상권, 전세권, 임차권 등 과실취득권 있는 본권이 있다고 오신한 점유자이다.","a":"O","e":"선의점유자의 과실취득에서 선의는 과실취득권 있는 본권이 있다고 믿은 것을 뜻한다."},{"p":6,"q":"선의의 점유자가 과실을 취득하려면 그 오신에 정당한 근거가 있어야 한다.","a":"X","e":"과실취득권 있는 본권이 있다고 오신하면 충분하고, 정당한 근거까지 요구하지 않는다."},{"p":6,"q":"악의의 점유자는 수취한 과실을 반환하여야 한다.","a":"O","e":"악의점유자는 수취한 과실을 반환하고, 소비·훼손 또는 수취하지 못한 경우 대가를 보상하여야 한다."},{"p":6,"q":"폭력 또는 은비에 의한 점유자는 악의의 점유자와 같은 범위에서 과실반환의무를 진다.","a":"O","e":"폭력·은비 점유자는 악의점유자와 동일한 책임을 진다."},{"p":6,"q":"양도담보설정자는 목적물의 천연과실을 취득할 수 없고, 항상 양도담보권자가 천연과실을 취득한다.","a":"X","e":"집합물 양도담보에서 돈사 돼지의 새끼 등 천연과실 수취권은 양도담보설정자에게 있다고 정리한다."},{"p":6,"q":"돈사에서 대량 사육되는 돼지를 집합물 양도담보의 목적으로 삼은 경우, 새끼돼지의 수취권은 양도담보설정자에게 있다.","a":"O","e":"자료의 판례형 포인트다. 천연과실인 새끼돼지는 양도담보설정자가 취득한다."},{"p":6,"q":"매매목적물에서 발생한 천연과실은 목적물 인도 전이라도 대금이 완납되면 매수인에게 귀속될 수 있다.","a":"O","e":"매매목적물의 과실은 대금완납 여부가 핵심 기준으로 정리된다. 대금완납 후에는 인도나 등기 전이라도 매수인에게 귀속될 수 있다."},{"p":6,"q":"매매계약 후 대금완납 전에는 매수인이 아직 소유권이전등기를 받지 않았더라도 과실을 취득한다.","a":"X","e":"대금완납 전 목적물 인도 전에는 매도인이 과실을 취득하는 구조로 정리한다."},{"p":6,"q":"대금은 완납하였으나 목적물 인도와 소유권이전등기를 받지 못한 상태에서 생긴 과실은 매수인에게 귀속될 수 있다.","a":"O","e":"자료는 대금완납을 기준으로 매수인 귀속을 설명한다."},{"p":6,"q":"대금완납 전의 매수인은 천연과실 취득권이 없는 자에 해당한다.","a":"O","e":"자료는 천연과실 취득권 없는 자로 대금완납 전 매수인, 악의점유자, 양도담보권자·저당권자를 든다."},{"p":6,"q":"저당권자와 양도담보권자는 그 권리만으로 천연과실 취득권자가 된다.","a":"X","e":"저당권자와 양도담보권자는 천연과실 수취권자가 아니다. 점유와 사용수익권이 핵심이다."},{"p":6,"q":"양도담보권이나 저당권이 있다고 오신한 선의의 점유자는 과실취득권 있는 선의의 점유자에 해당한다.","a":"X","e":"양도담보권이나 저당권은 과실취득권 있는 본권이 아니므로 그 권리가 있다고 믿은 점유자는 과실취득권자가 아니다."},{"p":6,"q":"차임, 지료, 이자, 사용료, 소작료는 법정과실에 해당한다.","a":"O","e":"원물 사용대가로 받는 금전 기타 물건은 법정과실이다."},{"p":6,"q":"사용이익은 과실에 준하여 법정과실과 동일하게 취급될 수 있다.","a":"O","e":"자료는 사용이익을 과실에 준하는 것으로 법정과실과 동일하게 취급한다고 정리한다."},{"p":6,"q":"노동의 대가인 임금은 법정과실이다.","a":"X","e":"임금은 노동의 대가이지 원물 사용대가가 아니므로 법정과실이 아니다."},{"p":6,"q
