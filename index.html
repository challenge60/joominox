};

const app = document.getElementById('app');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function partItems(p){ return ITEMS.filter(it=>it.p===p+1).map(it=>it.id); }
function studiedSet(p){ return new Set(ustate.studied[p]||[]); }
function markStudied(p, id){
  if(!ustate.studied[p]) ustate.studied[p]=[];
  if(!ustate.studied[p].includes(id)){ ustate.studied[p].push(id); saveState(); }
}
function isBookmarked(id){ return ustate.bookmarks.includes(id); }
function toggleBookmark(id){
  const i = ustate.bookmarks.indexOf(id);
  if(i>=0) ustate.bookmarks.splice(i,1); else ustate.bookmarks.push(id);
  saveState();
}
function addWrong(id){ ustate.wrong[id]=true; saveState(); }
function removeWrong(id){ delete ustate.wrong[id]; saveState(); render(); }

/* ---------------- resume sessions ---------------- */
function sessionKeyFor(source, partIndex){ return source==='part' ? ('part:'+partIndex) : source; }
function currentSessionKey(){ return state.source ? sessionKeyFor(state.source, state.partIndex) : null; }
function getSession(key){ return ustate.sessions ? ustate.sessions[key] : null; }
function saveCurrentSession(){
  const key = currentSessionKey();
  if(!key) return;
  ustate.sessions[key] = { set: state.set, idx: state.idx, order: state.order, quiz: state.quiz };
  saveState();
}
function clearSession(key){ if(ustate.sessions && ustate.sessions[key]){ delete ustate.sessions[key]; saveState(); } }

/* ---------------- CSV progress backup / restore ---------------- */
function csvField(s){
  s = (s==null?'':String(s));
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(rows){ return rows.map(r=>r.map(csvField).join(',')).join('\r\n'); }
function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===',') { row.push(field); field=''; }
      else if(c==='\r'){ /* ignore */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}
function downloadText(filename, content, mime){
  try{
    const blob = new Blob(["\uFEFF"+content], {type: mime||'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ /* fall through to the copy-paste fallback below regardless */ }
  showCopyFallback(filename, content);
}
function showCopyFallback(filename, content){
  const overlay = openOverlay(`
    <div style="font-weight:700;font-size:15px;margin-bottom:6px;">${filename}</div>
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:14px;">다운로드가 정상적으로 시작됐는지 확인해보세요. 파일이 안 받아졌다면, 아래 내용을 전체 선택해서 복사한 뒤 메모장 등에 붙여넣고 .csv로 저장하세요.</div>
    <textarea readonly style="width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:10px 12px;border-radius:12px;font-size:12px;" rows="8" id="fallbackTa">${content.replace(/</g,'&lt;')}</textarea>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="pill" style="flex:1;justify-content:center;padding:12px;" id="fbClose">닫기</button>
      <button class="pill cyan" style="flex:1;justify-content:center;padding:12px;" id="fbCopy">복사하기</button>
    </div>
  `);
  overlay.querySelector('#fbClose').addEventListener('click', ()=>overlay.remove());
  overlay.querySelector('#fbCopy').addEventListener('click', async ()=>{
    const ta = overlay.querySelector('#fallbackTa');
    let copied=false;
    try{ await navigator.clipboard.writeText(content); copied=true; }
    catch(e){ try{ ta.removeAttribute('readonly'); ta.focus(); ta.select(); copied=document.execCommand('copy'); ta.setAttribute('readonly',''); }catch(e2){ copied=false; } }
    showToast(copied ? '복사했어요. 메모장 등에 붙여넣고 .csv로 저장하세요.' : '복사에 실패했어요. 직접 드래그해서 복사해주세요.');
  });
}
function showToast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2600);
}
function exportProgressCsv(){
  const rows = [['유형','파트번호','문항ID']];
  Object.keys(ustate.studied).forEach(p=>{
    (ustate.studied[p]||[]).forEach(id=> rows.push(['STUDIED', String(Number(p)+1), String(id)]));
  });
  ustate.bookmarks.forEach(id=> rows.push(['BOOKMARK','',String(id)]));
  Object.keys(ustate.wrong).forEach(id=> rows.push(['WRONG','',String(id)]));
  if(rows.length===1){ showToast('백업할 학습 기록이 없어요.'); return; }
  const ts = new Date().toISOString().slice(0,10);
  downloadText(`OX플래시카드_학습기록_백업_${ts}.csv`, toCSV(rows));
}
function handleProgressCsvFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let text = reader.result;
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
    const rows = parseCSV(text).filter(r=>r.some(c=>(c||'').trim()!==''));
    if(rows.length===0){ showToast('CSV에서 읽을 내용이 없어요.'); return; }
    let dataRows = rows;
    const firstType = (rows[0][0]||'').trim().toUpperCase();
    if(!['STUDIED','BOOKMARK','WRONG'].includes(firstType)) dataRows = rows.slice(1);
    const newStudied = {}; const newBookmarks=[]; const newWrong={};
    let validCount=0;
    dataRows.forEach(r=>{
      const type=(r[0]||'').trim().toUpperCase();
      const partNum=(r[1]||'').trim();
      const id=Number((r[2]||'').trim());
      if(!Number.isInteger(id) || id<0 || id>=ITEMS.length) return;
      if(type==='STUDIED'){
        const p=Number(partNum)-1; if(!Number.isInteger(p)||p<0) return;
        if(!newStudied[p]) newStudied[p]=[];
        if(!newStudied[p].includes(id)) newStudied[p].push(id);
        validCount++;
      } else if(type==='BOOKMARK'){ if(!newBookmarks.includes(id)) newBookmarks.push(id); validCount++; }
      else if(type==='WRONG'){ newWrong[id]=true; validCount++; }
    });
    confirmDialog('학습 기록을 복구할까요?', `현재 기기에 저장된 학습 기록(진행률·즐겨찾기·오답노트)을 덮어써요. 유효한 기록 ${validCount}건을 불러올게요.`, '복구', ()=>{
      ustate.studied = newStudied; ustate.bookmarks = newBookmarks; ustate.wrong = newWrong;
      saveState(); render(); showToast('학습 기록을 복구했어요.');
    });
  };
  reader.onerror = ()=> showToast('파일을 읽지 못했어요.');
  reader.readAsText(file, 'UTF-8');
}

/* ---------------- navigation ---------------- */
function goHome(){ state.screen='home'; state.flipped=false; state.quizPick=null; render(); }

function startPart(p, order){
  let ids = partItems(p);
  if(order==='random') ids = shuffle(ids);
  state.screen='study'; state.source='part'; state.partIndex=p; state.order=order;
  state.set=ids; state.idx=0; state.flipped=false; state.quizPick=null; state.quiz=false;
  saveCurrentSession();
  render();
}
function startRandomAll(){
  state.screen='study'; state.source='random'; state.partIndex=null; state.order='random';
  state.set=shuffle(ITEMS.map(it=>it.id)); state.idx=0; state.flipped=false; state.quizPick=null; state.quiz=false;
  saveCurrentSession();
  render();
}
function startWrong(){
  const ids = Object.keys(ustate.wrong).map(Number);
  state.screen='study'; state.source='wrong'; state.partIndex=null;
  state.set=ids; state.idx=0; state.flipped=false; state.quizPick=null; state.quiz=false;
  saveCurrentSession();
  render();
}
function startBookmark(){
  state.screen='study'; state.source='bookmark'; state.partIndex=null;
  state.set=ustate.bookmarks.slice(); state.idx=0; state.flipped=false; state.quizPick=null; state.quiz=false;
  saveCurrentSession();
  render();
}
function resumeSession(source, partIndex, session){
  let validIds;
  if(source==='part') validIds = session.set.filter(id=>partItems(partIndex).includes(id));
  else if(source==='random') validIds = session.set.filter(id=>id>=0 && id<ITEMS.length);
  else if(source==='wrong') validIds = session.set.filter(id=>ustate.wrong[id]);
  else validIds = session.set.filter(id=>ustate.bookmarks.includes(id));
  if(validIds.length===0){
    if(source==='part') startPart(partIndex,'sequential');
    else if(source==='random') startRandomAll();
    else if(source==='wrong') startWrong();
    else startBookmark();
    return;
  }
  const idx = Math.min(session.idx, validIds.length-1);
  state.screen='study'; state.source=source; state.partIndex = source==='part'?partIndex:null;
  state.order = session.order||'sequential'; state.set=validIds; state.idx=idx;
  state.flipped=false; state.quizPick=null; state.quiz=!!session.quiz;
  saveCurrentSession();
  render();
}

function currentItem(){ return ITEMS[state.set[state.idx]]; }

function flip(){
  if(state.quiz && state.quizPick===null) return; // must pick in quiz mode
  state.flipped = !state.flipped;
  if(state.flipped && state.partIndex!==null){
    markStudied(state.partIndex, currentItem().id);
  }
  if(state.flipped && state.idx===state.set.length-1){ clearSession(currentSessionKey()); }
  else { saveCurrentSession(); }
  render();
}
function pickQuiz(choice){
  if(state.quizPick!==null) return;
  const it = currentItem();
  state.quizPick = choice;
  if(choice!==it.a) addWrong(it.id);
  state.flipped = true;
  if(state.partIndex!==null) markStudied(state.partIndex, it.id);
  if(state.idx===state.set.length-1){ clearSession(currentSessionKey()); }
  else { saveCurrentSession(); }
  render();
}

/* ---------------- voice answer (STT) ---------------- */
// 음성 인식 결과를 O/X로 정규화. 한글 "오"는 흔히 숫자 "5"로, "엑스"는 "x"로 인식되므로
// 발음/표기 변형을 폭넓게 허용한다.
const VOICE_O_WORDS = ['o','오','5','맞아','맞다','정답','오케이','동그라미'];
const VOICE_X_WORDS = ['x','엑스','틀려','틀렸','가위표','엑스표'];
function normalizeVoiceChoice(raw){
  const norm = String(raw||'').toLowerCase().replace(/[\s.,!?~]/g,'');
  if(!norm) return null;
  if(VOICE_O_WORDS.some(w=>norm.includes(w))) return 'O';
  if(VOICE_X_WORDS.some(w=>norm.includes(w))) return 'X';
  return null;
}
function startVoiceAnswer(btn){
  if(state.quizPick!==null) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast('이 브라우저는 음성 인식을 지원하지 않아요.'); return; }
  let rec;
  try{ rec = new SR(); } catch(err){ showToast('음성 인식을 시작할 수 없어요.'); return; }
  rec.lang = 'ko-KR';
  rec.interimResults = true; // TEMP DEBUG: 중간 인식 결과도 화면에 표시
  rec.continuous = false;
  rec.maxAlternatives = 4;
  btn.classList.add('listening');
  const dbg = document.getElementById('voiceDebug');
  if(dbg) dbg.textContent = '🎙️ 듣는 중...';
  rec.onresult = (e)=>{
    const res = e.results[e.results.length-1];
    const alts = [];
    for(let i=0; i<res.length; i++){
      const pct = res[i].confidence ? Math.round(res[i].confidence*100)+'%' : '';
      alts.push(`"${res[i].transcript}"${pct?' ('+pct+')':''}`);
    }
    if(dbg) dbg.textContent = (res.isFinal ? '✅ 인식됨: ' : '… 인식 중: ') + alts.join(' / ');
    if(res.isFinal){
      let matched = null;
      for(let i=0; i<res.length && !matched; i++){ matched = normalizeVoiceChoice(res[i].transcript); }
      if(matched) pickQuiz(matched);
      else showToast('"O" 또는 "X"로 다시 말씀해주세요.');
    }
  };
  rec.onerror = (e)=>{ if(dbg) dbg.textContent = '⚠️ 오류: '+e.error; showToast('음성을 인식하지 못했어요.'); };
  rec.onend = ()=>{ btn.classList.remove('listening'); };
  try{ rec.start(); } catch(err){ btn.classList.remove('listening'); }
}
function next(){
  if(state.idx < state.set.length-1){ state.idx++; state.flipped=false; state.quizPick=null; saveCurrentSession(); render(); }
}
function prev(){
  if(state.idx>0){ state.idx--; state.flipped=false; state.quizPick=null; saveCurrentSession(); render(); }
}
function removeCurrentFromList(){
  const id = state.set[state.idx];
  if(state.source==='wrong') removeWrong(id);
  if(state.source==='bookmark'){ toggleBookmark(id); }
  state.set.splice(state.idx,1);
  if(state.idx>=state.set.length) state.idx=Math.max(0,state.set.length-1);
  state.flipped=false; state.quizPick=null;
  saveCurrentSession();
  render();
}

function offerResumeOrFresh(source, freshFn){
  const session = getSession(sessionKeyFor(source));
  let validIds = [];
  if(session){
    if(source==='random') validIds = session.set.filter(id=>id>=0 && id<ITEMS.length);
    else if(source==='wrong') validIds = session.set.filter(id=>ustate.wrong[id]);
    else validIds = session.set.filter(id=>ustate.bookmarks.includes(id));
  }
  if(!session || validIds.length===0){ freshFn(); return; }
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:340px;width:100%;">
      <div style="font-weight:700;font-size:15px;margin-bottom:18px;">이어서 진행할까요?</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="pill cyan" style="justify-content:center;padding:13px;" data-c="resume">이어서 학습하기 (${Math.min(session.idx+1,validIds.length)}/${validIds.length})</button>
        <button class="pill" style="justify-content:center;padding:13px;" data-c="fresh">처음부터 다시</button>
      </div>
    </div>`;
  overlay.addEventListener('click',(e)=>{
    if(e.target===overlay){ overlay.remove(); return; }
    const c = e.target.dataset.c;
    if(c==='resume'){ overlay.remove(); resumeSession(source, null, session); }
    else if(c==='fresh'){ overlay.remove(); freshFn(); }
  });
  document.body.appendChild(overlay);
}

function openPartMenu(p){
  const name = PARTS[p];
  const session = getSession(sessionKeyFor('part', p));
  const validResumeIds = session ? session.set.filter(id=>partItems(p).includes(id)) : [];
  const canResume = session && validResumeIds.length>0 && session.idx < validResumeIds.length;
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;';

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:340px;width:100%;">

        <button class="pill violet" style="justify-content:center;padding:13px;" data-order="random">처음부터 랜덤</button>
        <button class="pill" style="justify-content:center;padding:13px;" data-order="cancel">취소</button>
      </div>

  });
  document.body.appendChild(overlay);
}

/* ---------------- shared overlay helpers ---------------- */
function openOverlay(innerHtml, onMount){
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;max-width:360px;width:100%;">${innerHtml}</div>`;
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  if(onMount) onMount(overlay);
  return overlay;
}
function confirmDialog(title, msg, label, onConfirm){
  const ov = openOverlay(`
    <div style="font-weight:700;font-size:15px;margin-bottom:6px;">${title}</div>
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:18px;">${msg}</div>

    </div>
  `);
  ov.querySelector('#cdCancel').addEventListener('click', ()=>ov.remove());
  ov.querySelector('#cdOk').addEventListener('click', ()=>{ ov.remove(); onConfirm(); });
}

      <button class="nav-item ${state.screen==='study'&&state.source==='bookmark'?'active':''}" data-nav="bookmark"><span class="ic">⭐</span>즐겨찾기</button>
      <button class="nav-item ${state.screen==='study'&&state.source==='wrong'?'active':''}" data-nav="wrong"><span class="ic">❌</span>오답노트</button>
      <button class="nav-item ${state.screen==='list'?'active':''}" data-nav="list"><span class="ic">📋</span>전체리스트</button>
      <button class="nav-item ${state.screen==='datamanage'?'active':''}" data-nav="datamanage"><span class="ic">⚙️</span>데이터관리</button>
    </div>`;
  app.insertAdjacentHTML('beforeend', navHtml);
  app.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const n = b.dataset.nav;
      if(n==='home') goHome();
      else if(n==='bookmark') offerResumeOrFresh('bookmark', startBookmark);
      else if(n==='wrong') offerResumeOrFresh('wrong', startWrong);
      else if(n==='list') goList();
      else if(n==='datamanage') goDataManage();
    });
  });
}

/* ---------------- render: LIST ---------------- */
function buildGroupedList(){
  const search = (state.listSearch||'').trim().toLowerCase();
  const groups = [];
  let curP = null, curGroup = null;
  ITEMS.forEach(it=>{
    if(state.listPart!==null && it.p !== state.listPart+1) return;
    if(search && !it.q.toLowerCase().includes(search)) return;
    if(curP!==it.p){ curP=it.p; curGroup = {p:it.p, name:PARTS[it.p-1], items:[]}; groups.push(curGroup); }
    curGroup.items.push(it);
  });
  return groups;
}
function renderList(){
  const groups = buildGroupedList();
  const totalShown = groups.reduce((s,g)=>s+g.items.length,0);
  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="back">‹</button>
      <div style="font-weight:700;font-size:13.5px; flex:1;">전체리스트 (${totalShown.toLocaleString()})</div>
    </div>
    <div class="home-wrap" style="padding-top:14px;">
      <select class="list-filter" id="listPartSel">
        <option value="all">전체 파트</option>
        ${PARTS.map((n,i)=>`<option value="${i}" ${state.listPart===i?'selected':''}>PART ${i+1} · ${escapeHtml(n)}</option>`).join('')}
      </select>
      <input class="list-search" id="listSearchInput" placeholder="문제 검색..." value="${escapeHtml(state.listSearch||'')}">
      ${groups.length===0 ? `<div class="empty"><div class="big">🔍</div><div>검색 결과가 없어요.</div></div>` : groups.map(g=>`
        <div class="list-group-label">PART ${g.p} · ${escapeHtml(g.name)}</div>
        ${g.items.map((it,i)=>`
          <div class="list-row" data-id="${it.id}">
            <div class="list-row-main">
              <span class="list-idx">${i+1}</span>
              <span class="list-q">${escapeHtml(it.q)}</span>
              <span class="list-badge ${it.a==='O'?'o':'x'}">${it.a}</span>
            </div>
            ${state.listExpanded.has(it.id) ? `<div class="list-exp">${it.e?escapeHtml(it.e):'<span class="no-exp">등록된 해설이 없어요.</span>'}</div>` : ''}
          </div>
        `).join('')}
      `).join('')}
    </div>
  `;
  document.getElementById('back').addEventListener('click', goHome);
  const sel = document.getElementById('listPartSel');
  sel.addEventListener('change', ()=>{ state.listPart = sel.value==='all'?null:Number(sel.value); render(); });
  const inp = document.getElementById('listSearchInput');
  inp.addEventListener('input', (e)=>{
    const pos = e.target.selectionStart;
    state.listSearch = e.target.value; render();
    const el = document.getElementById('listSearchInput');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){ } }
  });
  app.querySelectorAll('.list-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = Number(row.dataset.id);
      if(state.listExpanded.has(id)) state.listExpanded.delete(id); else state.listExpanded.add(id);
      render();
    });
  });
}

    </div>
    <div class="home-wrap" style="padding-top:14px;">
      <div class="section-label">앱 정보</div>
      <div class="dm-card"><span>전체 문항수</span><b>${ITEMS.length.toLocaleString()}개</b></div>
      <div class="dm-card"><span>파트 수</span><b>${PARTS.length}개</b></div>

  });
  document.getElementById('resetWrong').addEventListener('click', ()=>{

function screenTitle(){
  if(state.source==='part') return `PART ${state.partIndex+1} · ${PARTS[state.partIndex]}`;
  if(state.source==='random') return '전체 랜덤 학습';
  if(state.source==='wrong') return '오답노트';
  if(state.source==='bookmark') return '즐겨찾기';
  return '';
}

function renderStudy(){
  const total = state.set.length;
  if(total===0){
    app.innerHTML = `
      <div class="topbar">
        <button class="iconbtn" id="back">‹</button>
        <div style="font-weight:700;font-size:14px;">${screenTitle()}</div>
      </div>
      <div class="empty">
        <div class="big">${state.source==='wrong'?'🎉':'☆'}</div>
        <div>${state.source==='wrong' ? '오답노트가 비어있어요. 잘하고 있어요!' : '저장된 카드가 없어요.'}</div>
      </div>`;
    document.getElementById('back').addEventListener('click', goHome);
    return;
  }
  const it = currentItem();
  const pct = ((state.idx)/(total))*100;
  const flippedCls = state.flipped ? ('flipped ' + (it.a==='O'?'o':'x')) : '';
  const bookmarked = isBookmarked(it.id);

  let bodyHtml;
  if(!state.flipped){
    // FRONT
    bodyHtml = `
      <div class="card-eyebrow">
        <span>PART ${it.p} · ${PARTS[it.p-1]}</span>
        <button class="bookmark-star ${bookmarked?'on':''}" id="bmk">${bookmarked?'★':'☆'}</button>
      </div>
      <div class="card-question">${escapeHtml(it.q)}</div>
      ${state.quiz ? `
        <div class="quiz-choice-row">
          <button class="quiz-choice o" data-pick="O">O</button>
          <button class="quiz-choice x" data-pick="X">X</button>
          <button class="mic-btn" id="voiceBtn" type="button" title="음성으로 답하기">🎤</button>
        </div>
        <div class="voice-debug" id="voiceDebug"></div>
      ` : `<div class="card-hint">탭하여 정답 보기</div>`}
    `;
  } else {
    const correct = it.a;
    const myPick = state.quizPick;
    let resultBannerHtml = '';
    if(state.quiz && myPick!==null){
      const isCorrect = myPick===correct;
      resultBannerHtml = `
        <div class="result-banner ${isCorrect?'correct':'incorrect'}">
          <span class="icon">${isCorrect?'✅':'❌'}</span>
          <div>
            <div>${isCorrect?'정답입니다!':'오답입니다'}</div>
            <div class="result-sub">내 선택 ${myPick} · 정답 ${correct}${!isCorrect?' · 오답노트에 저장됨':''}</div>
          </div>
        </div>`;
    }
    bodyHtml = `
      <div class="reveal-watermark">${correct}</div>
      <div class="card-eyebrow">
        <span>PART ${it.p} · ${PARTS[it.p-1]}</span>
        <button class="bookmark-star ${bookmarked?'on':''}" id="bmk" style="position:relative;z-index:2;">${bookmarked?'★':'☆'}</button>
      </div>
      ${resultBannerHtml}
      <div class="reveal-badge">정답 ${correct}</div>
      <div class="reveal-q">${escapeHtml(it.q)}</div>
      <div class="reveal-exp-label">해설</div>
      <div class="reveal-exp">${escapeHtml(it.e)}</div>
    `;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" id="back">‹</button>
      <div style="font-weight:700;font-size:13.5px; flex:1;">${screenTitle()}</div>
    </div>
    <div class="progress-line"><div class="progress-line-fill" style="width:${pct}%"></div></div>
    <div class="quizbar">
      <button class="quiz-toggle-btn ${state.quiz?'mode-quiz':'mode-study'}" id="quiztoggle">
        <span class="dot"></span>${state.quiz ? 'Quiz Mode' : 'Study Mode'}
      </button>
    </div>
    <div class="study-wrap">
      <div class="study-top-info"><span>${state.idx+1} / ${total}</span><span>${state.order==='random'?'🔀 랜덤':'📖 순서'}</span></div>
      <div class="card-stage">
        <div class="card ${flippedCls}" id="card">${bodyHtml}</div>
      </div>
      <div class="nav-row">
        ${ (state.source==='wrong'||state.source==='bookmark') ? '<button class="nav-btn remove" id="removeBtn">🗑</button>' : ''}
        <button class="nav-btn" id="prevBtn" ${state.idx===0?'disabled':''}>‹ 이전</button>
        <button class="nav-btn" id="nextBtn" ${state.idx===total-1?'disabled':''}>다음 ›</button>
      </div>
    </div>
  `;

  document.getElementById('back').addEventListener('click', goHome);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtn').addEventListener('click', next);
  const rm = document.getElementById('removeBtn');
  if(rm) rm.addEventListener('click', removeCurrentFromList);
  const qt = document.getElementById('quiztoggle');
  if(qt) qt.addEventListener('click', ()=>{ state.quiz=!state.quiz; state.flipped=false; state.quizPick=null; saveCurrentSession(); render(); });

  const bmk = document.getElementById('bmk');
  if(bmk) bmk.addEventListener('click', (e)=>{ e.stopPropagation(); toggleBookmark(it.id); render(); });

  const cardEl = document.getElementById('card');
  cardEl.addEventListener('click', (e)=>{
    if(e.target.closest('[data-pick]')) return;
    if(e.target.closest('#bmk')) return;
    if(e.target.closest('#voiceBtn')) return;
    flip();
  });
  cardEl.querySelectorAll('[data-pick]').forEach(b=>{
    b.addEventListener('click', ()=> pickQuiz(b.dataset.pick));
  });
  const voiceBtn = cardEl.querySelector('#voiceBtn');
  if(voiceBtn) voiceBtn.addEventListener('click', (e)=>{ e.stopPropagation(); startVoiceAnswer(voiceBtn); });
  attachSwipe(cardEl);
}

function attachSwipe(cardEl){
  let startX=0, startY=0, dx=0, dy=0, dragging=false, active=false;
  const threshold = 70;
  cardEl.addEventListener('touchstart', (e)=>{
    if(e.target.closest('[data-pick]') || e.target.closest('#bmk') || e.target.closest('#voiceBtn') || e.target.closest('.reveal-exp')){ active=false; return; }
    const t = e.touches[0];
    startX=t.clientX; startY=t.clientY; dx=0; dy=0; dragging=false; active=true;
    cardEl.style.transition='none';
  }, {passive:true});
  cardEl.addEventListener('touchmove', (e)=>{
    if(!active) return;
    const t = e.touches[0];
    dx = t.clientX-startX; dy = t.clientY-startY;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8){
      dragging = true;
      e.preventDefault();
      const rot = dx/20;
      cardEl.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
      cardEl.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx)/380));
    }
  }, {passive:false});
  cardEl.addEventListener('touchend', ()=>{
    if(!active){ return; }
    active=false;
    cardEl.style.transition='transform .22s ease, opacity .22s ease';
    if(dragging && Math.abs(dx) > threshold){
      const goNext = dx < 0;
      if(goNext && state.idx < state.set.length-1){
        cardEl.style.transform = `translateX(-460px) rotate(${dx/20}deg)`;
        cardEl.style.opacity='0';
        setTimeout(next, 140);
        return;
      } else if(!goNext && state.idx>0){
        cardEl.style.transform = `translateX(460px) rotate(${dx/20}deg)`;
        cardEl.style.opacity='0';
        setTimeout(prev, 140);
        return;
      }
    }
    cardEl.style.transform='translateX(0) rotate(0)';
    cardEl.style.opacity='1';
  }, {passive:true});
  cardEl.addEventListener('touchcancel', ()=>{
    active=false;
    cardEl.style.transition='transform .22s ease, opacity .22s ease';
    cardEl.style.transform='translateX(0) rotate(0)';
    cardEl.style.opacity='1';
  }, {passive:true});
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------- keyboard ---------------- */
document.addEventListener('keydown',(e)=>{
  if(state.screen!=='study') return;
  if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); }
  else if((e.key==='o'||e.key==='O') && state.quiz) pickQuiz('O');
  else if((e.key==='x'||e.key==='X') && state.quiz) pickQuiz('X');
  else if(e.key==='b'||e.key==='B'){ const it=currentItem(); if(it) { toggleBookmark(it.id); render(); } }
});

/* ---------------- boot ---------------- */
(async ()=>{
  await loadState();
  render();
})();
</script>
