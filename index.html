"},{"p":10,"q":"소멸시효 완성 전 상계적상에 있었던 자동채권은 그 후 시효가 완성되어도 상계에 사용할 수 있다.","a":"O","e":"민법은 시효완성 전 상계할 수 있었던 채권으로는 상계를 허용한다."},{"p":10,"q":"시효완성 후 비로소 상계적상이 생긴 경우에도 그 채권으로 언제나 상계할 수 있다.","a":"X","e":"시효완성 전 상계할 수 있었던 경우에 한하여 예외적으로 상계를 허용한다."},{"p":10,"q":"소멸시효는 권리자의 권리행사 태만, 입증곤란 구제, 법률관계 안정 등을 이유로 인정된다.","a":"O","e":"시효제도는 장기간 계속된 사실상태를 존중하고 법률관계 안정 및 입증곤란 방지를 위해 인정된다."},{"p":10,"q":"소멸시효 제도는 오로지 채무자를 벌하기 위한 제도이다.","a":"X","e":"소멸시효는 채무자 처벌이 아니라 법률관계 안정과 권리 불행사 상태의 정리를 위한 제도이다."},{"p":10,"q":"시효완성으로 직접 이익을 받지 않는 일반 채권자는 다른 채권자의 채권 시효를 원용할 수 없다.","a":"O","e":"원용권자는 직접 이익을 받는 자에 한정된다."},{"p":10,"q":"시효완성으로 직접 이익을 받는 제3자는 채무자가 아니더라도 시효를 원용할 수 있다.","a":"O","e":"담보부동산 매수인, 물상보증인, 채권자취소소송 수익자 등은 직접 이익이 있으면 원용할 수 있다."},{"p":10,"q":"소멸시효는 공익적 제도이므로 당사자가 이를 주장하지 않아도 법원이 언제나 직권으로 적용해야 한다.","a":"X","e":"소멸시효는 원용이 필요하다. 법원은 당사자의 주장 없이 직권으로 적용하지 않는다."},{"p":10,"q":"시효완성의 항변은 영구적 항변권의 성격으로 이해할 수 있다.","a":"O","e":"소멸시효 완성의 항변은 상대방의 청구를 영구적으로 저지하는 항변으로 정리된다."},{"p":10,"q":"소멸시효 완성의 효과는 권리의 행사만 일시적으로 연기시키는 것이다.","a":"X","e":"시효완성은 권리 소멸 또는 시효항변으로 청구를 영구적으로 배척하는 효과를 가진다."},{"p":10,"q":"채권자가 소송에서 청구원인 사실을 주장하면 법원은 채무자의 시효항변이 없어도 시효완성 여부를 판단해야 한다.","a":"X","e":"소멸시효는 항변사항으로서 채무자 등 원용권자의 주장이 있어야 한다."},{"p":10,"q":"소멸시효의 중단사유가 발생하면 그때까지 경과한 기간은 원칙적으로 산입하지 않는다.","a":"O","e":"중단은 종전 기간을 소멸시키고 새로 시효를 진행시키는 리셋 효과가 있다."},{"p":10,"q":"시효정지 사유가 있으면 그 사유가 종료된 뒤 일정기간 완성이 유예되는 방식으로 권리자를 보호한다.","a":"O","e":"정지는 완성 직전 권리행사가 곤란한 경우 일정기간 완성을 늦추는 방식이다."},{"p":10,"q":"제한능력자에게 법정대리인이 있는 경우에도 언제나 제한능력자라는 이유만으로 시효완성이 정지된다.","a":"X","e":"법정대리인이 있으면 권리행사가 가능하므로 제한능력자라는 사정만으로 언제나 정지되는 것은 아니다."},{"p":10,"q":"부부 사이 권리의 시효정지는 혼인 중 권리행사가 곤란할 수 있다는 점을 고려한 것이다.","a":"O","e":"혼인관계가 계속되는 동안 상대방에게 권리를 행사하기 어려운 사정을 고려하여 정지 규정이 인정된다."},{"p":10,"q":"소멸시효는 권리자가 권리를 행사하지 않는 상태가 계속되어야 하므로, 권리자가 권리행사의 뜻을 명확히 하면 중단될 수 있다.","a":"O","e":"청구, 압류·가압류·가처분, 승인 등은 권리 불행사 상태를 깨는 사유로 시효를 중단시킨다."},{"p":10,"q":"채무자의 승인은 명시적으로만 가능하고 묵시적 승인은 인정되지 않는다.","a":"X","e":"승인은 명시적으로도 묵시적으로도 가능하다. 일부변제, 이자지급, 담보제공 등이 승인으로 평가될 수 있다."},{"p":10,"q":"이자 지급은 채무의 존재를 전제로 하므로 소멸시효 중단사유인 승인으로 평가될 수 있다.","a":"O","e":"이자 지급은 원본채무 존재를 인정하는 행위로 볼 수 있어 승인에 해당할 수 있다."},{"p":10,"q":"담보제공은 채무 존재를 인정하는 행위가 아니므로 승인으로 평가될 수 없다.","a":"X","e":"채무에 대한 담보제공은 채무 존재를 인정하는 행위로 보아 승인으로 평가될 수 있다."},{"p":10,"q":"재판상 청구로 중단된 시효는 재판이 확정된 때부터 새로 진행한다.","a":"O","e":"재판상 청구의 경우 중단 후 새 시효는 재판 확정 등 중단사유 종료 시점부터 진행한다."},{"p":10,"q":"압류로 중단된 시효는 압류절차가 종료한 때부터 새로 진행할 수 있다.","a":"O","e":"압류·가압류·가처분의 경우에도 중단사유가 종료한 때부터 새로 진행한다."},{"p":10,"q":"소멸시효가 완성되면 채권자는 이미 발생한 담보권을 실행할 수 없게 되는 경우가 있다.","a":"O","e":"피담보채권이 시효로 소멸하면 담보물권도 부종성에 따라 소멸하므로 담보권 실행이 제한될 수 있다."},{"p":10,"q":"시효완성 후 채무자가 시효항변을 하겠다고 명확히 표시한 뒤 일부변제를 한 경우에도 언제나 포기가 추정된다.","a":"X","e":"일부변제의 포기 추정은 특별한 사정이 없을 때의 문제이다. 시효항변 유지 의사가 명확하면 포기 추정이 깨질 수 있다."},{"p":10,"q":"소멸시효 완성 후 채무자의 포기는 그 포기 의사표시가 채권자에게 도달해야 효력이 문제된다.","a":"O","e":"시효이익 포기는 상대방 있는 단독행위이므로 상대방에게 의사표시가 도달해야 한다."},{"p":10,"q":"소멸시효 완성 후 포기는 법률행위이므로 의사능력 등 일반 법률행위 요건이 문제될 수 있다.","a":"O","e":"시효이익 포기는 의사표시를 요소로 하는 단독행위이므로 법률행위 일반요건이 문제될 수 있다."},{"p":10,"q":"소멸시효가 완성된 채권이라도 채무자가 임의로 변제하면 그 변제는 원칙적으로 유효한 급부로 취급된다.","a":"O","e":"시효완성채무의 임의변제는 통상 반환청구가 제한된다. 채무자는 완성된 시효를 알고도 이익을 포기할 수 있다."},{"p":10,"q":"소멸시효 완성 전 채무자가 시효완성 후에도 항변하지 않겠다고 약정한 것은 유효하다.","a":"X","e":"시효이익은 미리 포기하지 못하므로, 완성 전 포기약정은 효력이 없다."},{"p":10,"q":"소멸시효 완성 후 채무자가 항변하지 않겠다고 약정하는 것은 가능하다.","a":"O","e":"완성 후에는 시효이익의 포기가 가능하다."},{"p":10,"q":"소멸시효 완성으로 채무자가 얻는 이익은 채무자 개인에게만 절대적으로 귀속되어 어떠한 제3자도 원용할 수 없다.","a":"X","e":"직접 이익을 받는 제3자는 원용할 수 있다. 물상보증인, 담보부동산 매수인 등이 예이다."},{"p":10,"q":"소멸시효의 기산점은 원칙적으로 권리행사를 할 수 있는 법률상 장애가 없어진 때이다.","a":"O","e":"법률상 권리행사가 가능해야 시효가 진행한다. 사실상 곤란만으로는 원칙적으로 기산을 막지 않는다."},{"p":10,"q":"채권자가 경제적으로 가난하여 소송을 제기하기 어려웠다면 그 기간 동안 소멸시효는 당연히 진행하지 않는다.","a":"X","e":"경제적 곤란은 사실상 장애일 뿐 원칙적으로 시효 진행을 막지 않는다."},{"p":10,"q":"채무자가 소재불명이라는 사정만으로는 원칙적으로 권리행사가 법률상 불가능하다고 볼 수 없다.","a":"O","e":"소재불명은 사실상 장애에 가까우며, 공시송달 등 권리행사 방법이 있을 수 있다."},{"p":10,"q":"소멸시효 완성으로 인한 이익은 당사자가 법률행위로 가중할 수 있다.","a":"X","e":"시효를 가중하는 약정은 허용되지 않는다. 배제·연장·가중은 금지, 단축·경감은 가능하다."},{"p":10,"q":"소멸시효기간을 단축하는 약정은 채무자에게 유리할 수 있으므로 허용될 수 있다.","a":"O","e":"법률행위로 시효를 단축 또는 경감하는 것은 허용된다."},{"p":10,"q":"소멸시효가 완성되면 그 효과는 채권 발생 시가 아니라 시효 기산일에 소급한다.","a":"O","e":"시효완성의 소급효는 기산일에 소급하는 것으로 정리된다."},{"p":10,"q":"시효중단 후 새로 진행하는 시효기간은 원칙적으로 종전의 시효기간과 같다.","a":"O","e":"중단으로 새로 진행하더라도 원칙적으로 해당 권리의 법정 시효기간이 다시 진행한다. 다만 판결확정 등은 10년 규정이 문제된다."},{"p":10,"q":"재판상 청구로 확정판결을 받으면 그 채권의 원래 시효기간이 1년이어도 10년으로 된다.","a":"O","e":"판결로 확정된 채권은 단기시효라도 10년으로 된다."},{"p":10,"q":"재판상 청구를 하였으나 청구가 전부 기각되어 확정된 경우에도 그 청구권에 관한 시효중단효는 유지된다.","a":"X","e":"청구기각 확정은 권리 없음을 판단한 것이므로 해당 청구권의 중단효를 인정하기 어렵다."},{"p":10,"q":"소멸시효 완성 후 채무자가 채무를 승인하였더라도 채권자는 보증인에게 그 승인효과를 당연히 주장할 수 없다.","a":"O","e":"주채무자의 시효이익 포기는 보증인에게 당연히 불리한 효력을 미치지 않는다."},{"p":10,"q":"보증채무의 시효기간은 주채무자에 대한 판결 확정만으로 항상 10년이 된다.","a":"X","e":"주채무자에 대한 판결은 보증인과의 관계에서 보증채무 시효기간을 당연히 10년으로 만들지 않는다."},{"p":10,"q":"시효완성 후 채무자가 일부를 변제하면 특별한 사정이 없는 한 나머지 채무에 대해서도 시효항변을 하기 어렵다.","a":"O","e":"일부변제는 채무 전부를 승인하고 시효이익을 포기한 것으로 추정될 수 있으므로 나머지에 대한 항변도 제한될 수 있다."},{"p":10,"q":"소멸시효의 정지는 권리자가 완성 직전 권리행사를 할 수 없는 특별한 사정을 고려한 제도이다.","a":"O","e":"정지는 제한능력자, 부부, 상속재산, 천재사변 등 완성 직전 권리행사가 곤란한 경우 완성을 늦추는 제도이다."},{"p":10,"q":"소멸시효의 중단은 권리자가 권리를 행사하거나 채무자가 권리를 인정하여 기존의 불행사 상태를 깨뜨리는 제도이다.","a":"O","e":"청구·압류·가압류·가처분·승인은 권리 불행사 상태를 깨는 중단사유이다."},{"p":10,"q":"시효기간이 거의 다 지난 상태에서 천재지변으로 소송제기가 불가능했다면 시효정지가 문제될 수 있다.","a":"O","e":"천재 기타 사변으로 중단조치를 할 수 없으면 일정기간 시효완성이 정지될 수 있다."},{"p":10,"q":"권리자가 시효기간이 지난 뒤 곧바로 소송을 제기하면 시효중단으로 이미 완성된 시효가 당연히 소멸한다.","a":"X","e":"시효가 이미 완성된 뒤의 소송제기는 중단이 아니라 시효항변·포기 여부 문제이다."},{"p":10,"q":"소멸시효 완성 전에는 최고, 재판상 청구, 압류 등 중단조치를 통해 시효 진행을 막을 수 있다.","a":"O","e":"시효완성 전에 중단사유가 발생하면 종전 기간이 효력을 잃고 새로 진행한다."},{"p":10,"q":"채권자가 시효완성 후 채무자를 상대로 소를 제기하면 채무자는 시효항변으로 이를 저지할 수 있다.","a":"O","e":"시효가 완성된 뒤에도 채권자가 소송을 제기할 수는 있으나, 채무자가 시효항변을 하면 청구가 배척될 수 있다."},{"p":10,"q":"소멸시효 완성 후 채무자가 항변하지 않으면 법원은 채권자의 청구를 인용할 수 있다.","a":"O","e":"시효항변이 없으면 법원은 직권으로 시효완성을 고려하지 않으므로 청구가 인용될 수 있다."},{"p":11,"q":"의사표시는 일정한 법률효과의 발생을 원하는 효과의사와 이를 외부에 표시하는 표시행위가 결합된 것이다.","a":"O","e":"의사표시는 내심의 효과의사를 외부로 표시하는 행위이다. 법률행위의 핵심 요소다."},{"p":11,"q":"비정상적 의사표시는 의사와 표시가 불일치하는 경우만 의미하고, 사기ㆍ강박과 같은 하자 있는 의사표시는 포함하지 않는다.","a":"X","e":"비정상적 의사표시는 의사의 흠결인 비진의ㆍ통정허위ㆍ착오뿐 아니라 하자 있는 의사표시인 사기ㆍ강박까지 포함해 정리한다."},{"p":11,"q":"비진의표시, 통정허위표시, 착오는 모두 의사와 표시가 불일치하는 경우이다.","a":"O","e":"비진의는 불일치를 알고, 통정허위는 서로 짜고, 착오는 모르고 표시한다."},{"p":11,"q":"사기ㆍ강박에 의한 의사표시는 의사와 표시가 일치하지 않으므로 의사의 흠결에 해당한다.","a":"X","e":"사기ㆍ강박은 의사와 표시는 일치하지만 자유로운 의사결정이 방해된 경우다. 따라서 하자 있는 의사표시다."},{"p":11,"q":"제107조부터 제110조까지의 비정상적 의사표시 규정은 신분행위에는 원칙적으로 적용되지 않는다.","a":"O","e":"혼인ㆍ입양 등 신분행위에는 표시주의적 거래안전 법리를 그대로 적용하기 어렵다."},{"p":11,"q":"비정상적 의사표시 규정은 공법상 행위나 소송행위에도 원칙적으로 그대로 적용된다.","a":"X","e":"행정행위ㆍ소송행위 등 공법상 행위에는 민법상 비정상적 의사표시 규정이 원칙적으로 적용되지 않는다."},{"p":11,"q":"주식인수청약과 같이 단체적ㆍ정형적 거래에는 비정상적 의사표시 규정이 제한적으로 적용되거나 배제될 수 있다.","a":"O","e":"단체적ㆍ정형적 거래에서는 거래안전과 획일처리가 중요하므로 민법상 의사표시 하자 규정의 적용이 제한된다."},{"p":11,"q":"비정상적 의사표시에서 선의의 제3자 보호가 문제될 때, 제3자의 선의는 원칙적으로 추정되고 무과실까지 요구되지 않는다.","a":"O","e":"민법 제107조 제2항, 제108조 제2항, 제109조 제2항, 제110조 제3항의 제3자 보호는 선의를 중심으로 한다."},{"p":11,"q":"비진의표시는 표의자가 진의와 표시가 일치하지 않음을 알면서 하는 의사표시이다.","a":"O","e":"표의자가 의사와 표시의 불일치를 알고 있다는 점이 착오와 구별된다."},{"p":11,"q":"비진의표시는 표의자의 내심의 의사가 아니므로 언제나 무효이다.","a":"X","e":"비진의표시는 원칙적으로 표시한 대로 유효하다. 상대방이 진의 아님을 알았거나 알 수 있었을 때에만 무효다."},{"p":11,"q":"비진의표시에서 상대방이 표의자의 진의 아님을 알았거나 알 수 있었던 경우 그 의사표시는 무효이다.","a":"O","e":"민법 제107조 단서. 상대방이 악의 또는 과실이면 표시대로 보호할 필요가 없으므로 무효다."},{"p":11,"q":"비진의표시가 무효인 경우에도 그 무효는 선의의 제3자에게 대항하지 못한다.","a":"O","e":"제107조 제2항. 외관을 신뢰한 선의 제3자는 보호된다."},{"p":11,"q":"비진의표시에서 상대방이 표의자의 진의 아님을 몰랐지만 과실로 알지 못한 경우에도 그 의사표시는 유효이다.","a":"X","e":"상대방이 알았거나 알 수 있었던 경우에는 무효다. 과실로 알지 못한 경우는 '알 수 있었던 때'에 해당한다."},{"p":11,"q":"비진의표시에서 말하는 진의란 표의자가 마음속으로 바라는 희망이 아니라 특정한 법률효과를 발생시키려는 표시상의 의사를 말한다.","a":"O","e":"진의는 법률효과 의사를 의미한다. 마음속 희망이나 후회와 구별해야 한다."},{"p":11,"q":"강박에 못 이겨 증여의 의사표시를 한 경우, 표의자의 본심은 재산을 빼앗기기 싫었다는 것이므로 언제나 비진의표시이다.","a":"X","e":"강박 때문에라도 증여하기로 결정해 표시했다면 내심의 효과의사가 결여된 비진의표시라고 볼 수 없다. 사기ㆍ강박 문제로 간다."},{"p":11,"q":"당시 상황에서 그것이 최선이라고 판단하여 의사표시를 한 경우, 마음속으로 원하지 않았다는 이유만으로 비진의표시가 되는 것은 아니다.","a":"O","e":"마음속 희망과 법률효과 의사를 구별해야 한다. 최선이라고 판단해 표시했다면 비진의로 보기 어렵다."},{"p":11,"q":"비진의표시의 무효를 주장하는 자는 상대방이 진의 아님을 알았거나 알 수 있었음을 주장ㆍ입증하여야 한다.","a":"O","e":"비진의표시는 원칙적으로 유효이므로 단서의 무효사유는 주장자가 입증한다."},{"p":11,"q":"비진의표시가 상대방의 악의 또는 과실로 무효가 되면, 그 무효는 악의의 제3자에게도 대항할 수 없다.","a":"X","e":"보호되는 것은 선의의 제3자다. 악의의 제3자는 보호되지 않으므로 무효를 대항할 수 있다."},{"p":11,"q":"비진의표시 규정은 상대방 없는 단독행위에는 적용될 여지가 없다.","a":"X","e":"상대방 없는 단독행위에서도 비진의표시가 문제될 수 있다."},{"p":11,"q":"통정허위표시는 상대방과 통정하여 진의 아닌 의사표시를 하는 경우이다.","a":"O","e":"의사와 표시의 불일치를 당사자가 서로 짜고 만든 경우다."},{"p":11,"q":"통정허위표시는 당사자 사이에서는 무효이다.","a":"O","e":"민법 제108조 제1항. 가장행위는 당사자 사이에서 효력이 없다."},{"p":11,"q":"통정허위표시의 무효는 선의의 제3자에게 대항하지 못한다.","a":"O","e":"민법 제108조 제2항. 가장외관을 신뢰하여 새로운 이해관계를 가진 선의 제3자를 보호한다."},{"p":11,"q":"통정허위표시의 제3자는 선의뿐 아니라 무과실이어야 보호된다.","a":"X","e":"제108조 제2항의 제3자는 선의이면 충분하고 무과실까지 요구하지 않는다."},{"p":11,"q":"가장매매, 가장임대차, 가장저당권설정, 채권의 가장양도는 통정허위표시의 형태가 될 수 있다.","a":"O","e":"통정허위표시는 다양한 가장행위 형태로 나타난다."},{"p":11,"q":"강제집행 면탈 목적으로 허위의 근저당권을 설정한 경우, 원칙적으로 통정허위표시 문제가 된다.","a":"O","e":"강제집행 면탈 목적의 허위 근저당권 설정은 당사자가 짜고 외관을 만든 것이므로 제108조 구조다."},{"p":11,"q":"통정허위표시가 있으면 은닉행위도 언제나 함께 무효이다.","a":"X","e":"가장행위는 무효지만, 그 뒤에 숨은 은닉행위는 요건을 갖추면 유효할 수 있다."},{"p":11,"q":"허위표시로 가장된 증여가 무효라도 실제로 매매의 합의가 은닉되어 있고 매매요건을 갖추면 은닉된 매매는 유효할 수 있다.","a":"O","e":"은닉행위는 그 자체의 요건에 따라 효력을 판단한다."},{"p":11,"q":"통정허위표시의 무효는 누구에게나 주장할 수 있으므로 선의의 전득자도 보호되지 않는다.","a":"X","e":"통정허위표시는 상대적 무효 구조다. 선의의 제3자에게 무효를 대항하지 못한다."},{"p":11,"q":"통정허위표시의 제3자란 허위표시 당사자와 포괄승계인을 포함하는 개념이다.","a":"X","e":"제3자는 당사자 및 포괄승계인 이외의 자로서 허위표시 외관을 기초로 새로운 법률상 이해관계를 맺은 자를 말한다."},{"p":11,"q":"허위표시에 기초하여 부동산을 취득한 가장양수인으로부터 다시 그 부동산을 매수한 선의의 전득자는 제108조 제2항의 제3자로 보호될 수 있다.","a":"O","e":"가장양수인으로부터 새로운 법률상 이해관계를 취득한 선의의 전득자는 보호될 수 있다."},{"p":11,"q":"가장양수인의 일반채권자는 허위표시 부동산에 관하여 새로운 이해관계를 취득한 것이 아니므로 원칙적으로 제108조 제2항의 제3자가 아니다.","a":"O","e":"단순 일반채권자는 특정 목적물에 대한 새로운 법률상 이해관계를 취득한 자가 아니다."},{"p":11,"q":"가장양수인의 채권자가 가장양수인 소유로 보이는 부동산을 압류한 경우에는 제108조 제2항의 제3자로 보호될 수 있다.","a":"O","e":"압류채권자는 허위표시 외관을 기초로 특정재산에 관하여 법률상 이해관계를 취득하므로 보호될 수 있다."},{"p":11,"q":"통정허위표시에서 제3자의 선의 여부는 허위표시의 무효를 대항받을 때를 기준으로 판단한다.","a":"X","e":"원칙적으로 제3자가 법률상 이해관계를 취득할 당시의 선의 여부가 문제된다."},{"p":11,"q":"통정허위표시로 무효인 법률행위라도 채권자취소권의 대상이 될 수 없다.","a":"X","e":"허위표시와 사해행위취소는 요건과 취지가 다르므로, 통정허위표시가 동시에 사해행위로 문제될 수 있다."},{"p":11,"q":"착오에 의한 의사표시는 표의자가 의사와 표시의 불일치를 알면서 하는 의사표시이다.","a":"X","e":"착오는 의사와 표시의 불일치를 표의자가 모르는 경우다. 알고 하면 비진의표시다."},{"p":11,"q":"착오로 인한 의사표시는 법률행위 내용의 중요부분에 착오가 있을 때 취소할 수 있다.","a":"O","e":"민법 제109조 제1항 본문. 중요부분 착오가 핵심 요건이다."},{"p":11,"q":"착오가 법률행위 내용의 중요부분에 관한 것이 아니면 원칙적으로 취소할 수 없다.","a":"O","e":"사소한 착오는 거래안정을 위해 취소사유가 되지 않는다."},{"p":11,"q":"표의자의 중대한 과실로 착오가 발생한 경우에도 언제나 착오취소가 가능하다.","a":"X","e":"중대한 과실이 있으면 원칙적으로 착오취소를 할 수 없다."},{"p":11,"q":"착오취소에서 중대한 과실이란 보통 요구되는 주의를 현저히 결여한 것을 말한다.","a":"O","e":"일반 과실보다 훨씬 큰 부주의를 말한다. 단순한 경과실과 구별한다."},{"p":11,"q":"착오취소에서 표의자에게 중대한 과실이 있더라도 상대방이 그 착오를 알고 이용한 경우에는 취소가 허용될 수 있다.","a":"O","e":"상대방이 착오를 알면서 이용한 경우까지 표의자의 중과실을 이유로 보호할 필요는 없다."},{"p":11,"q":"상대방이 표의자의 착오를 유발한 경우에는 표의자에게 중대한 과실이 있어도 착오취소가 제한되지 않을 수 있다.","a":"O","e":"상대방의 유발ㆍ이용이 있으면 중과실 항변이 제한될 수 있다."},{"p":11,"q":"동기의 착오는 언제나 법률행위 내용의 착오에 해당하므로 별도 표시가 없어도 취소할 수 있다.","a":"X","e":"동기의 착오는 원칙적으로 취소사유가 아니나, 동기가 표시되어 법률행위 내용으로 된 경우 중요부분 착오가 될 수 있다."},{"p":11,"q":"동기의 착오가 표시되어 법률행위의 내용으로 된 경우에는 중요부분 착오로 취소할 수 있다.","a":"O","e":"동기가 상대방에게 표시되고 법률행위 내용으로 편입되면 착오취소가 문제된다."},{"p":11,"q":"법률행위 내용의 중요부분 착오인지 여부는 표의자의 주관적 사정만을 기준으로 판단한다.","a":"X","e":"표의자에게 중요하고, 일반인 관점에서도 그러한 착오가 없었더라면 의사표시를 하지 않았을 것이라고 볼 수 있어야 한다."},{"p":11,"q":"매매목적물의 현황ㆍ권리관계에 관한 착오가 중요부분 착오에 해당하면 매수인은 착오를 이유로 취소할 수 있다.","a":"O","e":"목적물의 동일성ㆍ중요한 성상ㆍ권리관계는 중요부분 착오가 될 수 있다."},{"p":11,"q":"토지의 시가나 수익성에 관한 단순한 판단 착오는 언제나 중요부분 착오이다.","a":"X","e":"단순한 동기ㆍ장래 예상ㆍ시가판단 착오는 원칙적으로 취소사유가 아니다."},{"p":11,"q":"착오취소는 선의의 제3자에게 대항하지 못한다.","a":"O","e":"민법 제109조 제2항. 착오취소로 인한 거래안전 침해를 제한한다."},{"p":11,"q":"착오취소에서 보호되는 제3자는 선의뿐 아니라 무과실이어야 한다.","a":"X","e":"제109조 제2항의 제3자는 선의이면 충분하고 무과실은 요구되지 않는다."},{"p":11,"q":"착오로 의사표시를 취소한 표의자는 중대한 과실이 없더라도 상대방에게 당연히 손해배상책임을 진다.","a":"X","e":"중과실 없는 착오자의 취소는 법이 허용하는 것이므로 그 자체가 위법하다고 볼 수 없어 당연한 손해배상책임은 없다."},{"p":11,"q":"매도인의 하자담보책임이 성립할 수 있는 경우에도 매수인은 요건을 갖추면 착오취소를 주장할 수 있다.","a":"O","e":"하자담보책임과 착오취소는 제도 취지가 다르므로 선택적 주장이 가능하다."},{"p":11,"q":"착오가 타인의 기망행위로 발생한 경우 표의자는 요건을 갖추어 사기취소와 착오취소를 선택적으로 주장할 수 있다.","a":"O","e":"사기와 착오는 선택적으로 경합할 수 있다."},{"p":11,"q":"계약이 이미 적법하게 해제된 경우에는 그 후 착오를 이유로 취소할 수 없다.","a":"X","e":"해제 후에도 착오취소의 이익이 있으면 취소를 주장할 수 있다. 해제와 취소는 효과와 요건이 다르다."},{"p":11,"q":"착오취소권은 형성권이므로 취소의 의사표시에 의하여 법률행위를 소급적으로 무효로 만든다.","a":"O","e":"취소권은 형성권이고, 취소되면 처음부터 무효인 것으로 본다."},{"p":11,"q":"사기에 의한 의사표시는 의사와 표시가 일치하지 않는 의사의 흠결이다.","a":"X","e":"사기는 기망으로 자유로운 의사결정이 침해된 경우로서 하자 있는 의사표시이다. 의사와 표시는 일치한다."},{"p":11,"q":"사기에 의한 의사표시가 성립하려면 기망행위, 착오, 의사표시 사이의 인과관계가 필요하다.","a":"O","e":"상대방 또는 제3자의 기망으로 착오에 빠지고 그 착오에 기해 의사표시를 해야 한다."},{"p":11,"q":"사기에 의한 의사표시에서 기망행위자는 표의자를 속이려는 고의와 그로 하여금 의사표시를 하게 하려는 고의를 가져야 한다.","a":"O","e":"이른바 2단의 고의가 요구된다."},{"p":11,"q":"단순한 침묵은 언제나 사기에 의한 기망행위가 될 수 없다.","a":"X","e":"신의칙상 고지의무가 인정되는 경우에는 침묵도 기망행위가 될 수 있다."},{"p":11,"q":"강박에 의한 의사표시는 해악의 고지로 공포심을 일으켜 의사표시를 하게 하는 경우이다.","a":"O","e":"강박은 위법한 해악의 고지와 공포심 및 의사표시 사이의 인과관계를 필요로 한다."},{"p":11,"q":"강박에 의한 의사표시에서 해악의 고지는 반드시 생명ㆍ신체에 대한 것에 한정된다.","a":"X","e":"해악은 재산ㆍ명예ㆍ자유 등에 대한 것도 가능하다."},{"p":11,"q":"사기나 강박에 의한 의사표시는 취소할 수 있다.","a":"O","e":"민법 제110조 제1항. 무효가 아니라 취소할 수 있는 행위다."},{"p":11,"q":"사기ㆍ강박에 의한 의사표시는 처음부터 당연무효이다.","a":"X","e":"원칙적으로 취소할 수 있는 법률행위이다. 취소 전까지는 유효하다."},{"p":11,"q":"상대방이 직접 사기ㆍ강박을 한 경우에는 상대방의 선의ㆍ무과실 여부를 따지지 않고 표의자는 취소할 수 있다.","a":"O","e":"제110조 제1항의 경우다. 상대방이 가해자이면 제3자 사기ㆍ강박의 제한이 문제되지 않는다."},{"p":11,"q":"상대방 있는 의사표시에서 제3자가 사기ㆍ강박을 한 경우, 상대방이 그 사실을 알았거나 알 수 있었을 때에 한하여 취소할 수 있다.","a":"O","e":"민법 제110조 제2항. 상대방의 악의 또는 과실이 필요하다."},{"p":11,"q":"제3자의 사기ㆍ강박에서 상대방이 선의ㆍ무과실이면 표의자는 언제나 취소할 수 있다.","a":"X","e":"상대방 있는 의사표시에서는 상대방이 알았거나 알 수 있었을 경우에만 취소할 수 있다."},{"p":11,"q":"상대방 없는 의사표시에 관하여 제3자가 사기ㆍ강박을 한 경우에는 상대방의 악의ㆍ과실을 요구할 수 없으므로 제110조 제2항이 그대로 적용되지 않는다.","a":"O","e":"제110조 제2항은 상대방 있는 의사표시를 전제로 한다."},{"p":11,"q":"사기ㆍ강박에 의한 의사표시의 취소는 선의의 제3자에게 대항하지 못한다.","a":"O","e":"민법 제110조 제3항. 취소의 소급효보다 거래안전을 보호한다."},{"p":11,"q":"사기ㆍ강박 취소에서 제3자가 보호되려면 선의와 무과실이 모두 필요하다.","a":"X","e":"제110조 제3항도 선의이면 충분하고 무과실까지 요구하지 않는다."},{"p":11,"q":"제3자의 사기에 의한 의사표시에서 상대방이 악의라서 취소되는 경우에도, 다시 선의의 제3자가 있으면 그 제3자에게 취소로 대항하지 못할 수 있다.","a":"O","e":"제110조 제2항의 취소요건과 제3항의 제3자 보호는 별개로 작동한다."},{"p":11,"q":"사기와 착오가 경합하는 경우 표의자는 사기취소만 주장할 수 있고 착오취소는 주장할 수 없다.","a":"X","e":"요건을 갖추면 사기취소와 착오취소를 선택적으로 주장할 수 있다."},{"p":11,"q":"강박의 정도가 극심하여 표의자의 의사결정 자유가 완전히 박탈된 경우에는 의사표시의 존재 자체가 부정될 여지가 있다.","a":"O","e":"일반적 강박은 취소사유이나, 의사결정 자유가 완전히 억압된 경우는 의사표시 자체가 문제될 수 있다."},{"p":11,"q":"불법행위로서의 사기ㆍ강박이 성립하면 민법 제110조의 취소권 행사와 별도로 손해배상청구가 문제될 수 있다.","a":"O","e":"사기ㆍ강박은 취소사유인 동시에 불법행위 요건을 갖추면 손해배상책임도 문제된다."},{"p":11,"q":"상대방 있는 의사표시는 원칙적으로 상대방에게 도달한 때 효력이 발생한다.","a":"O","e":"민법은 상대방 있는 의사표시에 관해 도달주의를 원칙으로 한다."},{"p":11,"q":"상대방 있는 의사표시는 표의자가 발신한 때 원칙적으로 효력이 발생한다.","a":"X","e":"원칙은 도달주의다. 발신주의는 예외적으로만 인정된다."},{"p":11,"q":"도달이란 상대방이 현실적으로 내용을 읽어야만 인정된다.","a":"X","e":"상대방의 지배권 내에 들어가 사회통념상 내용을 알 수 있는 상태가 되면 도달이다. 실제 열람까지 필요하지 않다."},{"p":11,"q":"우편물이 상대방의 우편함에 투입되어 통상 확인할 수 있는 상태가 되면 실제로 읽지 않았더라도 도달로 볼 수 있다.","a":"O","e":"사회통념상 상대방이 내용을 알 수 있는 객관적 상태가 되면 도달이다."},{"p":11,"q":"상대방이 정당한 사유 없이 수령을 거절한 경우에는 의사표시가 도달한 것으로 평가될 수 있다.","a":"O","e":"수령거절로 도달을 방해한 경우 표의자에게 불이익을 주지 않는다."},{"p":11,"q":"의사표시가 도달하기 전에는 표의자가 이를 철회할 수 있다.","a":"O","e":"도달 전에는 아직 효력이 발생하지 않았으므로 철회 가능하다."},{"p":11,"q":"철회의 의사표시는 원래 의사표시보다 늦게 도달하여도 항상 효력이 있다.","a":"X","e":"철회는 원래 의사표시보다 먼저 도달하거나 적어도 동시에 도달해야 효력이 있다."},{"p":11,"q":"표의자가 의사표시를 발신한 후 사망하거나 제한능력자가 되어도 의사표시의 효력에 영향을 미치지 않는다.","a":"O","e":"발신 후 사정변경은 도달에 의한 효력발생을 방해하지 않는다."},{"p":11,"q":"의사표시를 발신한 후 표의자가 사망하면 그 의사표시는 도달하더라도 효력이 발생하지 않는다.","a":"X","e":"발신 후 사망은 효력발생에 영향을 미치지 않는다."},{"p":11,"q":"상대방이 제한능력자인 경우 표의자는 원칙적으로 그 의사표시로써 제한능력자에게 대항하지 못한다.","a":"O","e":"의사표시의 수령능력 문제다. 제한능력자는 수령능력이 제한된다."},{"p":11,"q":"상대방이 제한능력자라도 법정대리인이 그 의사표시가 도달한 사실을 안 후에는 표의자가 그 의사표시로 대항할 수 있다.","a":"O","e":"법정대리인이 알게 되면 보호 필요성이 사라진다."},{"p":11,"q":"제한능력자가 의사표시의 수령자가 된 경우에도 언제나 도달 즉시 표의자는 그 의사표시로 대항할 수 있다.","a":"X","e":"제한능력자 보호를 위해 원칙적으로 대항하지 못한다. 법정대리인이 안 후 등 예외가 필요하다."},{"p":11,"q":"표의자가 과실 없이 상대방을 알지 못하거나 상대방의 소재를 알지 못하는 경우에는 공시송달에 의하여 의사표시를 할 수 있다.","a":"O","e":"상대방을 알 수 없거나 소재를 알 수 없는 경우 공시송달 제도가 기능한다."},{"p":11,"q":"공시송달에 의한 의사표시는 상대방이 실제 내용을 알 때까지 효력이 발생하지 않는다.","a":"X","e":"공시송달은 법정 절차에 따라 효력발생시기가 정해진다. 실제 인식까지 요구하지 않는다."},{"p":11,"q":"의사표시의 도달 여부와 효력발생시기에 관한 민법 규정은 원칙적으로 임의규정이다.","a":"O","e":"의사표시 효력발생 시기 규정은 임의규정으로 정리된다. 당사자 약정이나 특별규정이 우선할 수 있다."},{"p":11,"q":"비진의표시와 통정허위표시는 모두 의사와 표시의 불일치를 표의자가 알고 있다는 점에서 착오와 구별된다.","a":"O","e":"착오는 불일치를 모르는 경우다."},{"p":11,"q":"통정허위표시는 상대방과 짜고 한 것이므로 비진의표시와 달리 선의의 제3자를 보호하지 않는다.","a":"X","e":"통정허위표시도 선의의 제3자에게 무효를 대항하지 못한다."},{"p":11,"q":"비진의표시와 통정허위표시의 효과가 무효인 경우에도, 그 무효는 모두 선의의 제3자에게 대항하지 못할 수 있다.","a":"O","e":"제107조 제2항, 제108조 제2항의 공통점이다."},{"p":11,"q":"착오와 사기는 모두 표의자가 속거나 잘못 안 상태에서 의사표시를 한다는 점에서 경합할 수 있다.","a":"O","e":"타인의 기망으로 착오가 생기면 제109조와 제110조가 선택적으로 경합할 수 있다."},{"p":11,"q":"비진의표시, 통정허위표시, 착오, 사기ㆍ강박은 모두 선의의 제3자에게 대항하지 못한다는 공통점이 있다.","a":"O","e":"제107조~제110조의 중요한 공통 함정이다."},{"p":11,"q":"제107조부터 제110조까지에서 보호되는 제3자는 언제나 선의ㆍ무과실이어야 한다.","a":"X","e":"선의는 요구되지만 무과실은 원칙적으로 요구되지 않는다."},{"p":11,"q":"비진의표시는 원칙 유효, 통정허위표시는 원칙 무효, 착오는 취소 가능, 사기ㆍ강박도 취소 가능으로 정리된다.","a":"O","e":"효과 구별의 핵심이다."},{"p":11,"q":"착오취소와 사기취소는 모두 취소 전까지는 유효하고, 취소되면 소급하여 무효가 된다.","a":"O","e":"취소할 수 있는 법률행위의 일반효과다."},{"p":11,"q":"통정허위표시의 무효와 착오취소는 모두 절대적 무효이므로 선의의 제3자에게도 대항할 수 있다.","a":"X","e":"둘 다 선의의 제3자에게 대항하지 못한다. 절대적 무효가 아니다."},{"p":11,"q":"반사회질서 법률행위의 무효와 통정허위표시의 무효는 모두 선의의 제3자에게 대항하지 못한다.","a":"X","e":"반사회질서 법률행위는 절대적 무효라 선의의 제3자에게도 대항 가능하다. 통정허위표시는 상대적 무효다."},{"p":11,"q":"상대방의 기망행위로 착오에 빠진 경우 표의자는 사기취소 요건만 충족하면 되고 착오취소 요건은 별도로 문제되지 않는다.","a":"X","e":"사기취소를 주장하려면 사기 요건, 착오취소를 주장하려면 착오 요건을 각각 충족해야 한다."},{"p":11,"q":"상대방이 표의자의 착오를 알고 있었던 경우라도 표의자에게 중대한 과실이 있으면 예외 없이 취소할 수 없다.","a":"X","e":"상대방이 착오를 알고 이용하거나 유발한 경우에는 중과실 항변이 제한될 수 있다."},{"p":11,"q":"제3자 사기에서 상대방이 알았거나 알 수 있었는지는 취소 가능 여부의 문제이고, 취소 후 선의 제3자 보호와는 별개의 문제이다.","a":"O","e":"제110조 제2항과 제3항을 구별해야 한다."},{"p":11,"q":"강박에 의한 의사표시는 표의자가 겁에 질려 한 것이므로 법률행위가 언제나 부존재이다.","a":"X","e":"일반적인 강박은 취소사유다. 의사결정 자유가 완전히 박탈된 극단적 경우에만 존재 자체가 문제될 수 있다."},{"p":11,"q":"기망행위로 착오가 발생했지만 그 착오와 의사표시 사이에 인과관계가 없다면 사기취소는 어렵다.","a":"O","e":"기망-착오-의사표시 사이의 인과관계가 필요하다."},{"p":11,"q":"사기ㆍ강박에 의한 의사표시에서 표의자는 취소권을 행사하지 않고 불법행위 손해배상만 청구하는 것도 가능할 수 있다.","a":"O","e":"취소권과 손해배상청구권은 요건과 효과가 다르므로 별도로 문제될 수 있다."},{"p":11,"q":"의사표시가 상대방에게 도달한 후라도 상대방이 아직 읽지 않았다면 표의자는 자유롭게 철회할 수 있다.","a":"X","e":"도달로 효력이 발생한다. 실제 열람 전이라도 도달 후에는 임의 철회가 제한된다."},{"p":11,"q":"의사표시가 상대방에게 도달하지 못한 경우 그 불착ㆍ연착의 위험은 원칙적으로 표의자가 부담한다.","a":"O","e":"도달주의에서는 표의자가 도달 위험을 부담하는 구조다."},{"p":11,"q":"상대방 없는 의사표시는 도달주의가 적용될 수 없으므로 표시행위가 완료되면 효력이 발생하는 것이 원칙이다.","a":"O","e":"도달주의는 상대방 있는 의사표시에 관한 원칙이다."},{"p":11,"q":"제107조부터 제110조까지의 제3자 보호 규정은 제3자의 선의를 추정하지 않으므로 제3자가 선의를 입증하여야 한다.","a":"X","e":"제3자의 선의가 추정된다고 정리한다. 무과실도 요구하지 않는다."},{"p":12,"q":"대리는 대리인이 본인의 이름으로 의사표시를 하거나 수령하고, 그 법률효과가 직접 본인에게 귀속되는 제도이다.","a":"O","e":"대리는 행위자는 대리인이지만 효과귀속 주체는 본인이라는 점이 핵심이다."},{"p":12,"q":"대리인은 본인의 경제적 이익을 위하여 행위하여야 하므로, 본인에게 불리한 계약은 대리행위가 될 수 없다.","a":"X","e":"현명에서 \"본인을 위한 것\"은 경제적 이익이 아니라 법률효과 귀속주체가 본인이라는 뜻이다."},{"p":12,"q":"대리는 원칙적으로 법률행위에 인정되고, 사실행위에는 인정되지 않는다.","a":"O","e":"대리는 의사표시를 전제로 하는 제도라서 사실행위에는 원칙적으로 성립하지 않는다."},{"p":12,"q":"점유의 취득과 같은 사실행위도 언제나 대리의 방식으로 할 수 있다.","a":"X","e":"사실행위에는 원칙적으로 대리가 인정되지 않는다. 점유보조자 등 다른 법리와 구별한다."},{"p":12,"q":"불법행위는 법률효과의 발생을 의욕하는 행위가 아니므로 대리의 대상이 될 수 없다.","a":"O","e":"불법행위는 대리에 의한 효과귀속 구조가 아니라 사용자책임 등 별도 법리로 처리된다."},{"p":12,"q":"혼인, 이혼, 인지와 같은 신분행위는 원칙적으로 대리가 허용되지 않는다.","a":"O","e":"신분행위는 본인의 의사와 인격적 결단이 중요하므로 원칙적으로 대리가 허용되지 않는다."},{"p":12,"q":"재산상 법률행위라도 성질상 본인이 직접 하여야 하는 경우에는 대리가 허용되지 않을 수 있다.","a":"O","e":"대리는 원칙적으로 재산상 법률행위에서 허용되지만 성질상 직접성이 필요한 경우는 예외가 가능하다."},{"p":12,"q":"최고나 채무승인 같은 준법률행위 중 표현행위는 대리가 가능하다.","a":"O","e":"표현행위는 의사표시와 유사하게 표시가 문제되므로 대리가 가능하다."},{"p":12,"q":"준법률행위는 모두 사실행위이므로 대리가 절대 불가능하다.","a":"X","e":"최고, 채무승인 등 표현행위는 대리가 가능하고, 순수 사실행위와 구별한다."},{"p":12,"q":"대리의 효과가 본인에게 귀속하려면 대리권, 현명, 권한 내 행위가 필요하다.","a":"O","e":"유권대리의 기본요건은 대리권 존재, 현명, 권한 범위 내 대리행위이다."},{"p":12,"q":"대리권은 법률규정 또는 수권행위에 의하여 발생할 수 있다.","a":"O","e":"법정대리는 법률규정, 임의대리는 본인의 수권행위에 의해 대리권이 생긴다."},{"p":12,"q":"수권행위는 대리인에게 대리권을 주는 단독행위로 볼 수 있으며, 원인관계와 구별된다.","a":"O","e":"위임계약 등 원인관계와 대리권 수여행위는 구별된다. 원인관계가 무효라도 별도로 판단한다."},{"p":12,"q":"임의대리권은 언제나 위임계약에 의해서만 발생한다.","a":"X","e":"위임이 대표적이지만 수권행위의 원인관계는 고용, 도급 등 다양할 수 있다."},{"p":12,"q":"대리권의 범위가 불명확한 경우, 대리인은 보존행위와 그 물건 또는 권리의 성질을 변하지 않는 범위의 이용·개량행위를 할 수 있다.","a":"O","e":"민법 제118조의 기본 포인트다. 처분행위까지 당연히 허용되는 것은 아니다."},{"p":12,"q":"대리권의 범위가 불명확하면 대리인은 본인을 위하여 필요하다고 판단되는 모든 처분행위를 할 수 있다.","a":"X","e":"권한 불명시 대리인은 보존행위 및 성질불변 범위의 이용·개량행위만 가능하다."},{"p":12,"q":"사용하지 않는 물건을 임대하는 것은 권한 불명 대리인의 이용행위로 허용될 수 있다.","a":"O","e":"물건의 성질을 변하지 않는 이용행위의 예이다."},{"p":12,"q":"금전을 이자부로 대여하는 것은 권한 불명 대리인의 이용행위로 허용될 수 있다.","a":"O","e":"금전을 수익적으로 운용하는 이용행위로 볼 수 있다."},{"p":12,"q":"예금을 찾아 타인에게 대여하는 것은 권한 불명 대리인의 권한 범위 내 이용행위로 항상 허용된다.","a":"X","e":"예금을 찾아 타인에게 대여하는 것은 단순 이용행위로 보기 어렵고 허용되지 않는 예시다."},{"p":12,"q":"농지를 대지로 용도변경하는 것은 권한 불명 대리인의 개량행위로 허용된다.","a":"X","e":"물건의 성질을 변경하는 행위는 허용되지 않는다."},{"p":12,"q":"대리인은 본인의 허락이 없으면 원칙적으로 자기계약이나 쌍방대리를 하지 못한다.","a":"O","e":"자기계약·쌍방대리 금지는 대리권 남용과 이익충돌 방지를 위한 규정이다."},{"p":12,"q":"자기계약과 쌍방대리는 본인의 허락이 있으면 허용될 수 있다.","a":"O","e":"본인의 명시 또는 묵시적 허락이 있으면 이익충돌 위험을 본인이 감수한 것이므로 허용된다."},{"p":12,"q":"채무의 이행은 본인의 허락이 없어도 자기계약·쌍방대리 제한의 예외로 허용될 수 있다.","a":"O","e":"다툼 없는 채무변제, 주식 명의개서, 등기신청대리 등은 예외로 정리된다."},{"p":12,"q":"대물변제는 채무의 이행이므로 자기계약·쌍방대리 제한의 예외로 당연히 허용된다.","a":"X","e":"대물변제는 새로운 급부에 관한 이해충돌 가능성이 있어 단순한 채무이행 예외로 보지 않는다."},{"p":12,"q":"자기계약·쌍방대리 금지에 위반한 행위는 무권대리행위가 된다.","a":"O","e":"금지 위반은 대리권 제한 위반이므로 본인에게 당연히 효력이 귀속되지 않는다."},{"p":12,"q":"부동산 입찰절차에서 동일건물에 관해 이해관계가 다른 2인 이상의 대리인이 된 경우 그 입찰은 무효가 될 수 있다.","a":"O","e":"이해관계가 충돌하는 쌍방대리 유형으로 무효 판단 포인트다."},{"p":12,"q":"수인의 대리인이 있는 경우에는 법률 또는 수권행위에 다른 정함이 없는 한 각자가 단독으로 대리할 수 있다.","a":"O","e":"민법의 원칙은 각자대리이고, 공동대리는 예외다."},{"p":12,"q":"수인의 대리인은 언제나 공동으로만 대리할 수 있다.","a":"X","e":"법률 또는 수권행위에 공동대리 제한이 있는 경우에만 공동대리한다."},{"p":12,"q":"공동대리에서 공동이란 의사결정의 공동을 의미하므로, 공동으로 결정하였다면 표시는 대리인 중 1인이 할 수 있다.","a":"O","e":"공동대리는 의사결정의 공동이 핵심이고 표시행위까지 항상 공동으로 할 필요는 없다."},{"p":12,"q":"공동대리 제한이 있으면 상대방의 의사표시를 수령하는 수동대리도 반드시 공동으로만 해야 한다.","a":"X","e":"수동대리는 공동대리 제한이 있어도 각자가 단독으로 수령할 수 있다."},{"p":12,"q":"공동대리 제한을 위반하여 1인이 단독으로 대리한 경우 무권대리가 되며, 권한을 넘은 표현대리가 문제될 수 있다.","a":"O","e":"공동대리 위반은 무권대리이고, 요건을 갖추면 제126조 표현대리가 문제된다."},{"p":12,"q":"대리인이 자기 또는 제3자의 이익을 위하여 대리권을 남용한 경우에도 원칙적으로 본인에게 효과가 귀속한다.","a":"O","e":"대리권 남용은 원칙적으로 유권대리 효과가 발생한다. 상대방 악의·과실이면 예외적으로 무효다."},{"p":12,"q":"대리권 남용을 상대방이 알았거나 알 수 있었던 경우, 본인은 대리행위의 효과를 부담하지 않는다.","a":"O","e":"민법 제107조 제1항 단서 유추적용으로 본인에게 효력이 귀속되지 않는다."},{"p":12,"q":"대리권 남용은 상대방의 선의·무과실 여부와 관계없이 언제나 본인에게 효력이 귀속되지 않는다.","a":"X","e":"상대방이 알았거나 알 수 있었던 경우에만 본인 책임을 부정한다."},{"p":12,"q":"임의대리권은 원인된 법률관계의 종료에 의하여 소멸할 수 있다.","a":"O","e":"임의대리권은 수권행위 철회, 원인관계 종료 등 특유 소멸사유가 있다."},{"p":12,"q":"대리인의 사망은 대리권의 일반적 소멸사유이다.","a":"O","e":"대리인의 사망, 성년후견개시, 파산은 대리권 소멸사유로 정리한다."},{"p":12,"q":"본인의 사망은 임의대리에서 언제나 대리권 소멸사유가 아니며, 법률관계 성질에 따라 달라질 수 있다.","a":"O","e":"자료 흐름상 본인의 사망과 임의대리권 소멸은 원인관계 등과 함께 구별 포인트로 다룬다."},{"p":12,"q":"대리인의 성년후견개시는 대리권 소멸사유가 될 수 있다.","a":"O","e":"대리인의 성년후견개시는 일반적 대리권 소멸사유로 정리한다."},{"p":12,"q":"대리행위의 효력이 본인에게 귀속하려면 대리인이 본인을 위한 것임을 표시하여야 한다.","a":"O","e":"민법 제114조의 현명주의다."},{"p":12,"q":"현명은 요식행위이므로 반드시 \"갑 대리인 을\"이라는 문구를 사용하여야 한다.","a":"X","e":"현명은 불요식이다. 본인을 위한 것임을 알 수 있으면 된다."},{"p":12,"q":"현명은 본인의 경제적 이익을 위한다는 표시가 아니라 법률효과 귀속주체가 본인이라는 표시이다.","a":"O","e":"\"본인을 위한 것\"의 의미를 경제적 이익과 혼동하면 안 된다."},{"p":12,"q":"대리인이 본인의 이름을 전혀 표시하지 않았더라도 상대방이 대리행위임을 알았거나 알 수 있었으면 본인에게 효력이 귀속될 수 있다.","a":"O","e":"현명이 없더라도 상대방이 알았거나 알 수 있었으면 예외적으로 대리효과가 인정된다."},{"p":12,"q":"대리인이 본인을 위한 것임을 표시하지 않은 경우, 상대방이 알았더라도 언제나 대리인 자신을 위한 행위로 본다.","a":"X","e":"상대방이 대리행위임을 알았거나 알 수 있었으면 본인에게 효과가 귀속될 수 있다."},{"p":12,"q":"대리인이 본인인 것처럼 행위한 경우에는 원칙적으로 대리행위가 아니지만, 상대방이 알았거나 알 수 있었으면 본인에게 효과가 귀속될 수 있다.","a":"O","e":"명의모용식 행위도 상대방의 인식에 따라 예외가 가능하다."},{"p":12,"q":"수동대리에서는 상대방이 대리인에게 하는 의사표시가 본인에 대한 것임을 표시하여야 한다.","a":"O","e":"민법 제114조 제2항은 상대방의 대리인에 대한 의사표시에 준용된다."},{"p":12,"q":"상행위의 대리에도 민법상 현명주의가 그대로 적용되어 현명 없는 행위는 본인에게 효력이 전혀 없다.","a":"X","e":"상행위 대리에는 상법상 현명주의가 완화된다."},{"p":12,"q":"대리행위의 하자는 원칙적으로 대리인을 기준으로 판단한다.","a":"O","e":"의사표시를 하는 자가 대리인이므로 착오·사기·강박·선악 등은 원칙적으로 대리인을 기준으로 본다."},{"p":12,"q":"대리행위의 하자는 언제나 본인을 기준으로 판단한다.","a":"X","e":"원칙은 대리인 기준이다. 다만 본인이 특정 지시를 한 경우 등 예외가 있다."},{"p":12,"q":"본인이 특정한 법률행위를 지시한 경우, 대리인이 본인의 지시에 따라 행위하였다면 본인은 자기가 안 사정을 대리인이 몰랐다고 주장하지 못한다.","a":"O","e":"본인의 지시가 있으면 본인의 악의·과실을 고려하는 예외가 있다."},{"p":12,"q":"대리인은 행위능력자임을 요하지 않는다.","a":"O","e":"대리행위의 효과는 본인에게 귀속하므로 대리인은 제한능력자라도 될 수 있다."},{"p":12,"q":"제한능력자가 대리인으로 한 행위는 제한능력을 이유로 취소할 수 있다.","a":"X","e":"대리인은 행위능력자일 필요가 없으므로 제한능력을 이유로 대리행위를 취소할 수 없다."},{"p":12,"q":"의사능력이 없는 자가 대리인으로 한 대리행위는 유효하다.","a":"X","e":"행위능력은 필요 없지만 의사능력은 필요하다. 의사무능력자의 행위는 무효다."},{"p":12,"q":"대리인이 미성년자라도 의사능력이 있으면 유효하게 대리행위를 할 수 있다.","a":"O","e":"행위능력은 요구되지 않지만 의사능력은 요구된다."},{"p":12,"q":"대리권은 권리라기보다 권한으로 이해된다.","a":"O","e":"대리권은 타인의 법률관계에 효과를 발생시키는 지위 또는 권한으로 본다."},{"p":12,"q":"복대리인은 대리인이 선임하지만 대리인의 대리인이 아니라 본인의 대리인이다.","a":"O","e":"복대리인은 본인을 직접 대리하고 법률효과도 본인에게 귀속된다."},{"p":12,"q":"복대리인은 대리인의 이름으로 대리행위를 하여야 한다.","a":"X","e":"복대리인은 본인의 대리인이므로 본인의 이름으로 현명하여야 한다."},{"p":12,"q":"대리인이 복대리인을 선임하는 행위는 대리행위가 아니라 수권행위이다.","a":"O","e":"대리인은 자기 이름으로 복대리인을 선임하며 이는 복대리권을 주는 행위다."},{"p":12,"q":"복대리인을 선임하면 원대리인의 대리권은 당연히 소멸한다.","a":"X","e":"복대리인 선임은 병존적 설정이므로 원대리인의 대리권은 존속한다."},{"p":12,"q":"복대리권은 원대리인의 대리권의 존재와 범위에 의존한다.","a":"O","e":"복대리권은 원대리권을 초과할 수 없고 원대리권이 소멸하면 복대리권도 소멸한다."},{"p":12,"q":"복대리인은 법정대리인이 선임하였든 임의대리인이 선임하였든 언제나 임의대리인이다.","a":"O","e":"복대리권은 선임행위에 의한 것이므로 복대리인은 임의대리인으로 정리한다."},{"p":12,"q":"복대리인은 상대방에 대하여 대리인과 동일한 권리·의무가 있다.","a":"O","e":"복대리인은 권한 범위 내에서 본인을 직접 대리하고 대리 일반원칙이 적용된다."},{"p":12,"q":"복대리인의 대리행위에는 현명주의가 적용되지 않는다.","a":"X","e":"복대리인의 행위에도 대리 일반원칙, 즉 현명주의가 적용된다."},{"p":12,"q":"복대리인의 대리행위에도 표현대리 규정이 적용될 수 있다.","a":"O","e":"복대리인의 행위에도 대리 일반원칙이 적용되므로 표현대리가 문제될 수 있다."},{"p":12,"q":"임의대리인은 원칙적으로 본인의 승낙이나 부득이한 사유가 있어야 복대리인을 선임할 수 있다.","a":"O","e":"임의대리인의 복임권은 제한된다. 본인 신뢰를 중시하기 때문이다."},{"p":12,"q":"임의대리인은 언제나 자유롭게 복대리인을 선임할 수 있다.","a":"X","e":"임의대리인은 본인의 승낙 또는 부득이한 사유가 있어야 한다."},{"p":12,"q":"법정대리인은 원칙적으로 자기 책임으로 복대리인을 선임할 수 있다.","a":"O","e":"법정대리인은 본인의 직접 신뢰로 선임된 자가 아니므로 복임권이 넓다."},{"p":12,"q":"법정대리인이 부득이한 사유로 복대리인을 선임한 경우 책임이 경감될 수 있다.","a":"O","e":"법정대리인의 복임책임은 선임·감독상 책임 등으로 정리된다. 부득이한 사유는 책임범위에 영향이 있다."},{"p":12,"q":"복대리인의 사망, 성년후견개시, 파산은 복대리권 소멸사유가 될 수 있다.","a":"O","e":"복대리인에 관해서도 대리권 일반 소멸사유가 적용된다."},{"p":12,"q":"대리인의 대리권이 소멸하여도 복대리권은 독립하여 계속 존속한다.","a":"X","e":"복대리권은 원대리권에 의존하므로 원대리권이 소멸하면 함께 소멸한다."},{"p":12,"q":"무권대리행위는 본인이 추인하지 않으면 원칙적으로 본인에게 효력이 없다.","a":"O","e":"무권대리는 본인의 추인으로 소급하여 유효가 될 수 있다."},{"p":12,"q":"무권대리행위는 본인의 추인이 없어도 무권대리인과 상대방 사이에서는 당연히 유효한 계약이 된다.","a":"X","e":"무권대리행위의 효과귀속은 본인과의 관계에서 문제되며, 무권대리인의 책임은 별도 요건에 따른다."},{"p":12,"q":"무권대리행위에 대한 본인의 추인은 다른 의사표시가 없으면 계약 시에 소급하여 효력이 생긴다.","a":"O","e":"추인은 원칙적으로 소급효가 있다. 다만 제3자의 권리를 해하지 못한다."},{"p":12,"q":"본인의 추인은 원칙적으로 상대방 또는 무권대리인 어느 쪽에 대하여도 할 수 있다.","a":"O","e":"추인은 상대방에게 할 수도 있고 무권대리인에게 할 수도 있으나, 상대방이 알지 못하면 대항 제한이 문제된다."},{"p":12,"q":"본인이 무권대리행위를 추인하면 제3자의 권리를 해하면서도 언제나 계약 시로 소급한다.","a":"X","e":"추인의 소급효는 제3자의 권리를 해하지 못한다."},{"p":12,"q":"상대방은 상당한 기간을 정하여 본인에게 추인 여부의 확답을 최고할 수 있다.","a":"O","e":"상대방의 최고권은 무권대리에서 상대방을 보호하는 제도다."},{"p":12,"q":"본인이 상대방의 최고에 대하여 기간 내 확답하지 않으면 추인을 거절한 것으로 본다.","a":"O","e":"최고 후 무응답은 추인거절로 간주된다."},{"p":12,"q":"상대방은 본인의 추인이 있기 전에는 선의인 경우 무권대리행위를 철회할 수 있다.","a":"O","e":"상대방이 대리권 없음을 알지 못한 경우, 본인의 추인 전 철회가 가능하다."},{"p":12,"q":"상대방이 무권대리임을 알았던 경우에도 본인의 추인 전이면 언제나 철회할 수 있다.","a":"X","e":"철회권은 선의의 상대방 보호제도다. 악의 상대방은 철회할 수 없다."},{"p":12,"q":"무권대리인의 상대방에 대한 책임은 상대방의 선택에 따라 이행 또는 손해배상 책임으로 나타날 수 있다.","a":"O","e":"민법 제135조의 무권대리인 책임이다. 상대방 보호를 위한 무과실책임 성격으로 정리한다."},{"p":12,"q":"무권대리인은 대리권이 없음을 몰랐고 과실이 없어도 제135조 책임을 질 수 있다.","a":"O","e":"무권대리인 책임은 원칙적으로 무과실책임으로 이해한다."},{"p":12,"q":"상대방이 대리권 없음을 알았거나 알 수 있었던 때에는 무권대리인의 책임을 물을 수 없다.","a":"O","e":"제135조 단서 포인트다. 상대방 악의·과실이면 보호 필요성이 없다."},{"p":12,"q":"무권대리인이 제한능력자인 경우에도 언제나 제135조 책임을 진다.","a":"X","e":"무권대리인이 제한능력자인 경우 제135조 책임이 제한된다."},{"p":12,"q":"무권대리인의 책임은 계약의 유효를 전제로 하므로 본인이 추인한 뒤에도 상대방은 제135조 책임을 선택할 수 있다.","a":"X","e":"본인이 추인하면 본인에게 효과가 귀속되므로 무권대리인 책임 문제는 원칙적으로 사라진다."},{"p":12,"q":"상대방이 표현대리를 주장하지 않고 무권대리로서 철회도 하지 않으면서 곧바로 제135조 책임을 물을 수 없는 경우가 있다.","a":"O","e":"표현대리가 성립하는 경우 상대방 보호는 표현대리로 충분하므로 제135조 책임 주장은 제한된다고 정리한다."},{"p":12,"q":"무권대리인의 계약은 본인의 추인 여부가 확정될 때까지 유동적 무효 상태라고 설명할 수 있다.","a":"O","e":"추인하면 유효, 거절하면 무효로 확정되는 구조다."},{"p":12,"q":"단독행위의 무권대리는 상대방 없는 단독행위와 상대방 있는 단독행위를 구별한다.","a":"O","e":"상대방 있는 단독행위는 상대방의 동의 등 특별한 경우 추인 여지가 있지만, 원칙적으로 제한된다."},{"p":12,"q":"상대방 없는 단독행위의 무권대리는 본인의 추인으로 당연히 유효하게 된다.","a":"X","e":"상대방 없는 단독행위의 무권대리는 원칙적으로 무효이고 추인으로 유효하게 하기 어렵다."},{"p":12,"q":"계약의 무권대리에서는 본인의 추인권과 상대방의 최고권·철회권이 인정된다.","a":"O","e":"무권대리의 3대 장치: 본인 추인권, 상대방 최고권, 상대방 철회권."},{"p":12,"q":"본인이 무권대리행위의 추인을 거절하면 그 행위는 본인에게 효력이 없다.","a":"O","e":"추인거절로 무권대리행위는 본인에 대하여 무효로 확정된다."},{"p":12,"q":"표현대리는 무권대리의 일종이다.","a":"O","e":"겉모습상 대리권이 있는 것처럼 보이는 경우 상대방을 보호하는 무권대리 특수형이다."},{"p":12,"q":"표현대리는 상대방 보호규정이므로 상대방만 주장할 수 있다.","a":"O","e":"본인이나 무권대리인이 상대방에게 표현대리를 강요하는 구조가 아니다."},{"p":12,"q":"표현대리는 본인 보호제도이므로 본인이 주장하여 상대방에게 계약효력을 강제할 수 있다.","a":"X","e":"표현대리는 선의·무과실 상대방 보호제도다."},{"p":12,"q":"상대방이 표현대리를 주장하지 않으면 표현대리도 무권대리로서의 성질을 가진다.","a":"O","e":"표현대리는 무권대리의 일종이므로 협의의 무권대리 규정이 함께 문제된다."},{"p":12,"q":"유권대리에 관한 주장 속에는 당연히 표현대리 주장이 포함된다.","a":"X","e":"판례는 유권대리 주장에 표현대리 주장이 당연히 포함되지 않는다고 본다."},{"p":12,"q":"표현대리가 성립할 수 있는 경우에도 본인의 추인권, 상대방의 최고권·철회권이 인정될 수 있다.","a":"O","e":"표현대리도 무권대리의 일종이므로 무권대리 규정이 적용될 수 있다."},{"p":12,"q":"강행법규 위반으로 무효인 행위에는 표현대리 법리를 적용하여 본인에게 책임을 물을 수 없다.","a":"O","e":"행위 자체가 무효이면 외관보호로 유효화할 수 없다."},{"p":12,"q":"표현대리가 성립하면 상대방에게 과실이 있어도 과실상계로 본인의 책임을 줄이는 것이 원칙이다.","a":"X","e":"표현대리는 선의·무과실을 요건으로 하므로 과실상계 방식과 구별한다."},{"p":12,"q":"표현대리의 상대방은 원칙적으로 선의·무과실이어야 한다.","a":"O","e":"대리권 없음에 대한 선의·무과실이 상대방 보호의 기본요건이다."},{"p":12,"q":"표현대리에서 상대방의 선의·무과실은 항상 본인이 입증할 필요가 없고 상대방이 주장·입증해야 한다.","a":"X","e":"자료 흐름상 상대방 보호규정이므로 본인이 상대방의 악의·과실을 입증하는 구조로 정리된다."},{"p":12,"q":"표현대리는 불법행위나 부당이득 문제와 달리 과실상계를 적용하는 방식으로 조정하지 않는다.","a":"O","e":"표현대리는 성립 여부 자체에서 상대방 무과실을 요구한다."},{"p":12,"q":"제125조 대리권 수여표시에 의한 표현대리는 성질상 임의대리에만 적용된다.","a":"O","e":"본인의 수여표시가 전제이므로 임의대리에 관한 표현대리로 정리한다."},{"p":12,"q":"제125조 표현대리는 본인이 제3자에게 타인에게 대리권을 수여하였음을 표시한 경우 문제된다.","a":"O","e":"본인의 표시로 외관이 형성된 경우 그 범위 내 행위에 책임을 진다."},{"p":12,"q":"제125조 표현대리는 표시된 대리권의 범위를 초과한 행위에도 당연히 적용된다.","a":"X","e":"표시된 범위 내 행위가 제125조이고, 범위 초과는 제126조가 문제된다."},{"p":12,"q":"대리권 수여표시는 반드시 상대방에게 직접 서면으로 하여야 한다.","a":"X","e":"대리권 수여표시는 불요식이고 신문광고 등 불특정 다수에 대한 표시도 가능하다."},{"p":12,"q":"대리권 또는 대리인이라는 말을 사용하지 않았더라도 사회통념상 대리권 존재를 추단할 직함 사용을 승낙·묵인하면 대리권 수여표시가 될 수 있다.","a":"O","e":"직함·명칭 사용 승낙 또는 묵인도 외관 형성으로 볼 수 있다."},{"p":12,"q":"제125조 표현대리는 상대방이 대리권 없음을 알았거나 알 수 있었을 때에는 성립하지 않는다.","a":"O","e":"선의·무과실 상대방만 보호된다."},{"p":12,"q":"제126조 권한을 넘은 표현대리는 기본대리권의 존재를 전제로 한다.","a":"O","e":"기본대리권이 있고 그 권한을 넘은 행위에 관하여 정당한 이유가 있어야 한다."},{"p":12,"q":"기본대리권이 전혀 없는 경우에도 제126조 권한을 넘은 표현대리는 항상 성립한다.","a":"X","e":"제126조는 기본대리권을 전제로 한다. 기본대리권이 없으면 제125조 또는 다른 법리를 검토한다."},{"p":12,"q":"제126조의 기본대리권은 문제된 법률행위와 동일한 종류의 행위에 관한 것이어야만 한다.","a":"X","e":"기본대리권과 월권행위의 관련성은 문제되지만 반드시 동일 종류일 필요는 없다는 식으로 함정이 나온다."},{"p":12,"q":"공법상 행위나 사실행위에 관한 권한은 원칙적으로 제126조의 기본대리권이 되기 어렵다.","a":"O","e":"대리권은 법률행위 대리권이 기본이다. 사실행위 권한과 구별한다."},{"p":12,"q":"상대방에게 대리권이 있다고 믿을 만한 정당한 이유가 있어야 제126조 표현대리가 성립한다.","a":"O","e":"정당한 이유는 선의·무과실과 연결되는 핵심요건이다."},{"p":12,"q":"제126조 표현대리에서 정당한 이유는 대리행위 당시를 기준으로 판단한다.","a":"O","e":"상대방이 거래 당시 외관을 신뢰할 만했는지가 기준이다."},{"p":12,"q":"공동대리 제한을 위반한 단독대리행위도 요건을 갖추면 제126조 표현대리가 될 수 있다.","a":"O","e":"공동대리 위반은 무권대리이고 권한초과 표현대리가 문제될 수 있다."},{"p":12,"q":"대리인이 권한을 넘은 행위를 한 경우 상대방에게 과실이 있어도 본인은 항상 책임을 진다.","a":"X","e":"상대방에게 정당한 이유, 즉 선의·무과실이 있어야 한다."},{"p":12,"q":"제129조 대리권 소멸 후의 표현대리는 과거에 존재하던 대리권이 소멸한 뒤 행위한 경우 문제된다.","a":"O","e":"대리권 소멸을 알지 못한 상대방 보호규정이다."},{"p":12,"q":"제129조 표현대리는 대리권이 처음부터 존재하지 않았던 경우에도 적용된다.","a":"X","e":"제129조는 존재하던 대리권이 소멸한 경우의 외관보호다."},{"p":12,"q":"대리권 소멸 후 표현대리는 상대방이 대리권 소멸을 알았거나 알 수 있었으면 성립하지 않는다.","a":"O","e":"선의·무과실 상대방 보호가 기본이다."},{"p":12,"q":"제129조 표현대리의 효과는 소멸 전 대리권의 범위 내 행위에 한정되고, 범위 초과분은 제126조와 결합하여 문제될 수 있다.","a":"O","e":"소멸 후 범위 내는 129, 소멸 후 범위 초과는 129와 126의 중첩 문제가 된다."},{"p":12,"q":"대리권 소멸 후의 표현대리는 법정대리에는 절대 적용될 수 없다.","a":"X","e":"표현대리 적용 범위는 조문별로 다르게 정리해야 한다. 125는 임의대리에 한정된다."},{"p":12,"q":"본인이 대리권 소멸 사실을 통지하지 않은 사정은 제129조 표현대리 성립 판단에서 외관 신뢰의 근거가 될 수 있다.","a":"O","e":"소멸 전 대리권 존재와 소멸 통지 부재는 상대방 신뢰 판단에 중요하다."},{"p":12,"q":"무권대리인이 본인을 단독상속하면, 본인의 지위에서 자신의 무권대리행위에 대한 추인을 거절하는 것은 신의칙상 허용되지 않는다.","a":"O","e":"금반언 법리가 적용되는 대표 판례다."},{"p":12,"q":"무권대리인이 본인을 상속한 경우에는 언제나 무권대리행위가 당연히 유효로 확정된다.","a":"X","e":"추인거절이 제한될 수 있지만 사안별로 공동상속 등 효과를 구별한다."},{"p":12,"q":"본인이 무권대리인을 상속한 경우에는 본인의 지위에서 추인거절을 할 수 있다.","a":"O","e":"본인이 무권대리인을 상속한 경우와 무권대리인이 본인을 상속한 경우를 구별한다."},{"p":12,"q":"무권대리인이 본인을 공동상속한 경우, 다른 공동상속인 전원의 추인이 없으면 전체 행위가 당연히 유효로 되는 것은 아니다.","a":"O","e":"무권대리인 1인의 신의칙 제한만으로 다른 공동상속인 지분까지 당연 유효화하지 않는다."},{"p":12,"q":"표현대리가 성립하더라도 상대방이 이를 주장하지 않으면 법원이 언제나 직권으로 표현대리를 인정하여야 한다.","a":"X","e":"표현대리는 상대방이 주장해야 한다. 유권대리 주장에 당연 포함되지도 않는다."},{"p":12,"q":"대리권 남용과 표현대리는 모두 외관상 대리행위가 존재한다는 점에서 유사하지만, 대리권 남용은 원칙적으로 유권대리라는 점이 다르다.","a":"O","e":"남용은 대리권은 있으나 배임적으로 행사한 경우, 표현대리는 무권대리의 일종이다."},{"p":12,"q":"대리권 남용에서는 상대방이 남용을 알았거나 알 수 있었을 때 본인 책임이 부정된다.","a":"O","e":"제107조 단서 유추적용 포인트다."},{"p":12,"q":"표현대리에서는 상대방이 대리권 없음을 알았거나 알 수 있었더라도 거래안전을 위해 본인이 책임진다.","a":"X","e":"표현대리는 선의·무과실 상대방만 보호한다."},{"p":12,"q":"대리인이 권한 내에서 행위하였으나 본인의 이익이 아니라 자기 이익을 위하여 행위했다는 사정만으로 당연히 무권대리가 되는 것은 아니다.","a":"O","e":"대리권 남용은 원칙적으로 본인에게 효과가 귀속한다. 상대방 악의·과실이면 예외."},{"p":12,"q":"상대방이 대리인의 배임적 의도를 알 수 있었는지는 의사표시 형성과정, 내용, 효과 등 객관적 사정을 종합하여 판단한다.","a":"O","e":"판례는 객관적 사정에 의한 합리적 판단을 요구한다."},{"p":12,"q":"대리인이 본인을 표시하지 않고 자기 이름으로 계약한 경우, 원칙적으로 대리인 자신에게 효력이 귀속한다.","a":"O","e":"현명 없는 행위는 원칙적으로 대리인 자신을 위한 행위로 본다. 예외는 상대방의 인식."},{"p":12,"q":"대리인이 본인을 표시하고 권한 내에서 행위하면, 계약상 권리·의무는 원칙적으로 대리인이 아니라 본인에게 귀속한다.","a":"O","e":"대리제도의 핵심은 직접효과다."},{"p":12,"q":"대리인이 계약서에 자신의 이름만 서명하였다면 상대방이 대리관계를 알고 있었더라도 언제나 대리인 개인이 당사자다.","a":"X","e":"서명 형식만으로 단정하지 않고 표시 전체와 상대방 인식을 종합한다."},{"p":12,"q":"보증행위와 같이 요식성이 요구되는 행위에서도 대리 자체는 가능할 수 있다.","a":"O","e":"요식행위도 대리가 불가능한 것은 아니며, 방식 준수와 서명대리 문제가 중요하다."},{"p":12,"q":"대리권의 존재는 대리행위 당시를 기준으로 판단한다.","a":"O","e":"행위 당시 권한이 있어야 유권대리다. 사후 추인은 무권대리의 문제다."},{"p":12,"q":"대리인이 권한 없이 행위했더라도 본인이 사후에 추인하면 처음부터 유권대리였던 것처럼 소급효가 생긴다.","a":"O","e":"추인의 소급효로 계약 시에 효력이 발생한 것처럼 된다. 제3자 권리 제한은 주의."},{"p":12,"q":"대리권이 소멸한 후에는 어떠한 경우에도 본인이 책임지는 외관책임이 성립할 수 없다.","a":"X","e":"제129조 대리권 소멸 후 표현대리가 가능하다."},{"p":12,"q":"대리권 수여표시가 있고 그 범위 내에서 행위했더라도 상대방이 대리권 없음을 알 수 있었다면 제125조 표현대리는 성립하지 않는다.","a":"O","e":"표현대리 공통의 선의·무과실 요건이다."},{"p":12,"q":"권한을 넘은 표현대리에서 상대방의 정당한 이유는 단순한 믿음만으로 충분하고 과실 유무는 문제되지 않는다.","a":"X","e":"정당한 이유는 선의·무과실을 포함하는 객관적 신뢰가능성을 요구한다."},{"p":12,"q":"무권대리행위가 본인의 추인으로 유효하게 되면 상대방은 원칙적으로 더 이상 철회할 수 없다.","a":"O","e":"철회권은 본인의 추인 전 상대방 보호를 위한 권리다."},{"p":12,"q":"상대방의 철회권 행사는 본인의 추인 전에만 가능하다.","a":"O","e":"본인의 추인으로 효력이 확정되기 전까지만 철회할 수 있다."},{"p":12,"q":"본인의 추인거절 후에는 상대방이 다시 최고하여 추인을 강제할 수 있다.","a":"X","e":"추인거절로 무권대리행위는 본인에게 무효로 확정된다."},{"p":12,"q":"표현대리의 성립은 본인의 실제 수권의사를 요하지 않는다.","a":"O","e":"실제 대리권은 없지만 본인에게 외관형성 책임이 있어 효과를 인정하는 제도다."},{"p":12,"q":"제125조 표현대리에서 본인의 대리권 수여표시는 반드시 특정 상대방에게 개별적으로 이루어져야 한다.","a":"X","e":"신문광고 등 불특정 다수에 대한 표시도 가능하다."},{"p":12,"q":"직함 사용을 본인이 승낙·묵인한 경우 대리권 수여표시가 인정될 수 있다.","a":"O","e":"사회통념상 대리권 존재를 추단할 외관을 본인이 허용한 경우다."},{"p":12,"q":"복대리인을 선임한 뒤에도 원대리인은 직접 대리행위를 할 수 있다.","a":"O","e":"복대리인 선임은 원대리권을 소멸시키지 않는다."},{"p":12,"q":"복대리인이 권한을 넘은 행위를 한 경우에도 표현대리 법리가 문제될 수 있다.","a":"O","e":"복대리행위에도 대리 일반원칙이 적용된다."},{"p":12,"q":"복대리인은 대리인의 감독을 받지만 본인의 대리인으로서 직접 본인에게 효과를 귀속시킨다.","a":"O","e":"선임자는 대리인이지만 효과귀속은 본인에게 직접 된다."},{"p":12,"q":"임의대리인이 본인의 승낙 없이 부득이한 사유도 없이 복대리인을 선임한 경우, 복대리인의 행위는 언제나 본인에게 당연히 유효하다.","a":"X","e":"복임권 없는 선임은 문제되고 무권대리 또는 책임 문제가 발생할 수 있다."},{"p":12,"q":"법정대리인은 복대리인을 선임할 수 있으나 그 선임·감독에 관하여 책임을 질 수 있다.","a":"O","e":"법정대리인의 복임권은 넓지만 책임 문제가 별도로 따른다."},{"p":12,"q":"대리에서 본인의 효과귀속은 대리인이 권한 내에서 현명하여 의사표시를 한 경우에 인정된다.","a":"O","e":"유권대리의 핵심 3요소다."},{"p":12,"q":"무권대리와 표현대리는 모두 실제 대리권이 없다는 점에서 연결된다.","a":"O","e":"표현대리는 무권대리의 일종이다. 다만 상대방 보호를 위해 본인에게 효과가 귀속된다."},{"p":12,"q":"대리권 남용은 실제 대리권이 없다는 점에서 표현대리와 같다.","a":"X","e":"대리권 남용은 대리권은 있으나 배임적으로 행사한 경우다."},{"p":12,"q":"자기계약·쌍방대리 금지 위반은 본인의 허락이나 채무이행 예외가 없으면 무권대리로 처리된다.","a":"O","e":"시험에서 자기계약·쌍방대리와 무권대리 효과를 연결한다."},{"p":12,"q":"수인의 대리인은 원칙적으로 각자대리이고 공동대리는 예외이다.","a":"O","e":"각자대리 원칙을 먼저 잡아야 한다."},{"p":12,"q":"공동대리 제한이 있으면 대리인 중 1인은 상대방의 청약을 수령하는 것도 단독으로 할 수 없다.","a":"X","e":"수동대리는 각자가 단독으로 가능하다."},{"p":12,"q":"현명주의는 능동대리뿐 아니라 수동대리에도 준용된다.","a":"O","e":"상대방도 본인에 대한 의사표시임을 표시해야 한다."},{"p":12,"q":"대리인이 제한능력자라는 이유만으로 대리행위의 효력을 부정할 수 없다.","a":"O","e":"대리인은 행위능력자일 필요가 없다."},{"p":12,"q":"대리인의 의사능력 흠결은 대리행위 효력에 영향을 미칠 수 있다.","a":"O","e":"행위능력은 불요하지만 의사능력은 필요하다."},{"p":12,"q":"무권대리인의 책임은 상대방이 대리권 없음을 알았거나 알 수 있었더라도 상대방 보호를 위하여 인정된다.","a":"X","e":"상대방 악의·과실이면 제135조 책임을 물을 수 없다."},{"p":12,"q":"표현대리와 무권대리인의 책임은 모두 상대방 보호제도이지만, 표현대리가 성립하면 상대방은 원칙적으로 본인에게 효과귀속을 주장한다.","a":"O","e":"표현대리는 본인에 대한 책임, 제135조는 무권대리인에 대한 책임으로 구별한다."},{"p":12,"q":"본인의 추인은 무권대리행위의 효력을 확정시키는 형성권적 성격을 가진다.","a":"O","e":"추인으로 본인에게 효과가 귀속되며 원칙적으로 소급한다."},{"p":12,"q":"상대방의 최고권과 철회권은 본인을 보호하기 위한 권리이다.","a":"X","e":"최고권과 철회권은 무권대리 상대방 보호제도다."},{"p":12,"q":"표현대리는 강행법규 위반 무효행위를 유효로 만드는 제도가 아니다.","a":"O","e":"외관보호 법리로 강행규정 위반 자체를 치유할 수 없다."},{"p":12,"q":"대리 파트의 핵심은 현명, 대리권 범위, 자기계약·쌍방대리, 복대리, 무권대리, 표현대리의 비교이다.","a":"O","e":"실전에서는 비슷한 제도를 비교하는 지문이 많이 나온다."},{"p":13,"q":"무효인 법률행위는 처음부터 법률효과가 발생하지 않으므로, 원칙적으로 누구든지 언제나 그 무효를 주장할 수 있다.","a":"O","e":"무효는 법률행위의 성립을 전제로 하지만, 효력은 처음부터 발생하지 않는다. 취소와 달리 취소권자, 제척기간이라는 제한이 원칙적으로 붙지 않는다."},{"p":13,"q":"취소할 수 있는 법률행위는 취소되기 전까지는 일단 유효하다.","a":"O","e":"취소할 수 있는 행위는 일단 유효하게 효력이 발생하지만, 취소권자가 취소하면 소급하여 무효가 된다."},{"p":13,"q":"취소권은 아무나 행사할 수 있고, 취소권 행사기간의 제한도 없다.","a":"X","e":"취소권은 법률상 취소권자만 행사할 수 있고, 추인할 수 있는 날부터 3년, 법률행위한 날부터 10년의 제척기간 제한을 받는다."},{"p":13,"q":"미성년자가 의사무능력 상태에서 법률행위를 한 경우, 제한능력을 이유로 취소할 수도 있고 의사무능력을 이유로 무효를 주장할 수도 있다.","a":"O","e":"하나의 법률행위에 무효사유와 취소사유가 함께 존재할 수 있다. 이를 무효와 취소의 이중효라고 한다."},{"p":13,"q":"허위표시로 무효인 법률행위라도 채권자취소권의 요건을 갖추면 채권자취소권의 대상이 될 수 있다.","a":"O","e":"허위표시로 무효인 때에도 사해행위취소 요건이 충족되면 채권자취소권 적용을 긍정한다."},{"p":13,"q":"토지거래허가를 받지 않아 유동적 무효 상태에 있는 계약에 관하여는 사기 또는 강박에 의한 취소를 인정할 수 없다.","a":"X","e":"토지거래허가 전 유동적 무효 상태의 계약이라도 사기·강박에 의한 취소를 인정할 수 있다."},{"p":13,"q":"법률행위의 무효는 법률행위의 성립을 전제로 하므로, 법률행위 자체가 성립하지 않은 부존재와 구별된다.","a":"O","e":"무효는 성립은 했지만 효력이 부정되는 경우이고, 불성립·부존재는 애초에 법률행위가 성립하지 않은 경우다."},{"p":13,"q":"법률행위가 부존재인 경우에도 무효행위의 추인이나 전환이 문제된다.","a":"X","e":"부존재는 법률행위 자체가 성립하지 않은 것이므로 무효·유효의 문제가 발생하지 않는다."},{"p":13,"q":"무효와 취소는 모두 처음부터 효력이 없는 것으로 되므로, 취소 전에도 취소할 수 있는 법률행위는 당연히 무효이다.","a":"X","e":"취소할 수 있는 행위는 취소되기 전까지는 유효하다. 취소권이 행사되어야 비로소 처음부터 무효인 것으로 본다."},{"p":13,"q":"취소는 법률규정에 의해서만 인정되지만, 해제는 약정 또는 법률규정에 의해 발생할 수 있다.","a":"O","e":"취소권은 제한능력·착오·사기·강박 등 법정 사유에 의해 발생한다. 해제는 법정해제뿐 아니라 약정해제도 가능하다."},{"p":13,"q":"절대적 무효는 선의의 제3자에게도 대항할 수 있는 무효이다.","a":"O","e":"절대적 무효는 누구에게나 효력이 없으므로 선의의 제3자도 보호되지 않는다."},{"p":13,"q":"상대적 무효는 당사자 사이에서는 무효이지만 선의의 제3자에게 대항하지 못하는 무효이다.","a":"O","e":"비진의표시의 예외적 무효, 통정허위표시의 무효는 선의의 제3자에게 대항하지 못하는 상대적 무효 구조다."},{"p":13,"q":"강행규정 위반, 의사무능력, 원시적 불능, 확정성 결여, 반사회질서, 불공정행위는 절대적 무효로 정리된다.","a":"O","e":"자료의 암기 흐름상 강·의·원·확·103·104는 절대적 무효로 잡는다."},{"p":13,"q":"비진의표시가 예외적으로 무효인 경우와 통정허위표시의 무효는 선의의 제3자에게 대항하지 못한다.","a":"O","e":"비진의표시에서 상대방이 알았거나 알 수 있었던 경우 무효이나 선의의 제3자에게 대항하지 못하고, 통정허위표시도 같은 제3자 보호 구조다."},{"p":13,"q":"반사회질서 법률행위와 불공정한 법률행위는 상대적 무효이므로 선의의 제3자에게 대항할 수 없다.","a":"X","e":"제103조와 제104조 위반은 절대적 무효로 정리한다. 선의의 제3자에게도 대항할 수 있다."},{"p":13,"q":"무효인 법률행위가 이행 전이면 당사자는 그 이행을 할 필요가 없다.","a":"O","e":"무효이면 의도한 법률효과가 발생하지 않으므로 이행 전이라면 이행의무가 없다."},{"p":13,"q":"무효인 법률행위가 이미 이행된 경우 원칙적으로 부당이득 반환 문제가 발생한다.","a":"O","e":"무효인데 급부가 이행되었다면 법률상 원인 없는 이득이므로 부당이득 반환이 원칙이다. 단, 반사회질서 등 불법원인급여는 반환이 제한될 수 있다."},{"p":13,"q":"무효행위에 따른 급부를 수령한 자가 선의이면 현존이익만 반환하면 된다.","a":"O","e":"부당이득에서 선의 수익자는 현존이익 한도에서 반환한다."},{"p":13,"q":"무효행위에 따른 급부를 수령한 자가 악의이면 받은 이익에 이자를 붙이고 손해가 있으면 손해도 배상하여야 한다.","a":"O","e":"악의 수익자는 이익 반환뿐 아니라 이자 및 손해배상 책임까지 부담한다."},{"p":13,"q":"반사회질서 법률행위로 무효인 경우에는 이미 급부한 물건의 반환청구가 항상 부당이득으로 허용된다.","a":"X","e":"반사회질서 법률행위에서는 불법원인급여가 문제되어 부당이득반환청구나 소유권에 기한 반환청구가 부정될 수 있다."},{"p":13,"q":"무효로 인한 부당이득 반환에서 양 당사자의 반환의무는 원칙적으로 동시이행관계에 있다.","a":"O","e":"쌍무계약이 무효가 되어 서로 반환할 것이 있으면 공평상 동시이행관계로 본다."},{"p":13,"q":"무효인 법률행위의 법률효과가 침해되었다는 이유로 그 법률효과의 침해에 따른 손해배상을 청구할 수 있다.","a":"X","e":"무효이면 의욕한 법률효과가 애초에 발생하지 않는다. 따라서 그 법률효과의 침해에 따른 손해배상은 원칙적으로 문제되지 않는다."},{"p":13,"q":"토지거래허가구역 내 토지거래계약은 허가를 받기 전에는 유동적 무효 상태에 있다.","a":"O","e":"허가 전에는 확정적으로 유효도 무효도 아니고, 허가를 받으면 소급하여 유효가 된다."},{"p":13,"q":"토지거래허가를 받으면 그 계약은 허가받은 때부터 장래에 향하여만 유효가 된다.","a":"X","e":"허가를 받으면 계약 체결 시로 소급하여 유효가 된다."},{"p":13,"q":"토지거래허가구역 지정기간이 만료되고 재지정되지 않거나 지정이 해제되면 더 이상 허가를 받을 필요가 없어 계약은 유효로 확정될 수 있다.","a":"O","e":"더 이상 허가구역이 아니게 되면 허가를 받을 필요가 없어 유효 확정 사유가 된다."},{"p":13,"q":"토지거래허가 전 유동적 무효 상태에서는 계약의 효력이 발생하지 않으므로 소유권이전등기청구권이 발생하지 않는다.","a":"O","e":"허가 전에는 이행의무가 발생하지 않으므로 소유권이전등기청구권도 행사할 수 없다."},{"p":13,"q":"토지거래허가 전에도 당사자에게 허가신청절차에 협력할 의무는 인정될 수 있다.","a":"O","e":"허가 전 계약상 본래의 이행의무는 없지만, 유효로 완성하기 위한 허가절차협력의무는 인정된다."},{"p":13,"q":"토지거래허가 전 허가절차협력의무 불이행이 있으면 채무불이행을 이유로 계약을 해제할 수 있다.","a":"X","e":"허가 전에는 계약의 효력이 발생하지 않아 본래의 채무불이행 해제는 인정되지 않는다. 다만 협력의무 불이행에 대한 손해배상 예정 등은 문제될 수 있다."},{"p":13,"q":"토지거래허가 전에는 허가신청협력청구권을 피보전권리로 하여 처분금지가처분을 신청할 수 있다.","a":"O","e":"소유권이전등기청구권을 피보전권리로는 어렵지만, 허가신청협력청구권을 피보전권리로 한 가처분은 가능하다고 정리한다."},{"p":13,"q":"토지거래허가 전에도 소유권이전등기청구권을 피보전권리로 하여 처분금지가처분을 신청할 수 있다.","a":"X","e":"허가 전에는 소유권이전등기청구권이 발생하지 않으므로 이를 피보전권리로 한 처분금지가처분은 허용되지 않는다."},{"p":13,"q":"토지거래허가 전 계약금이 교부된 경우, 계약금계약은 독립된 종된 계약이므로 해약금에 의한 해제는 가능할 수 있다.","a":"O","e":"본계약은 유동적 무효라도 계약금계약은 독립된 종된 계약으로 보아 이행착수 전 해약금 해제가 가능하다."},{"p":13,"q":"토지거래허가 전 계약금이 교부된 경우 본계약이 무효이므로 계약금반환청구는 언제나 허용된다.","a":"X","e":"허가 전 유동적 무효 상태에서는 확정무효가 아니므로 곧바로 계약금반환청구가 당연히 인정되는 구조가 아니다. 해약금 해제 등 별도 구조로 접근해야 한다."},{"p":13,"q":"토지거래허가를 배제하거나 잠탈할 목적으로 체결한 계약은 무효로 확정된다.","a":"O","e":"허가제도를 회피하려는 잠탈 목적 계약은 유동적 무효가 아니라 확정적으로 무효가 된다."},{"p":13,"q":"토지거래허가구역 내에서 허가를 잠탈할 목적의 중간생략등기는 3자 합의가 있으면 유효하다.","a":"X","e":"일반 중간생략등기는 실체관계 부합 시 유효 가능하지만, 토지거래허가 잠탈 목적이면 3자 합의가 있어도 무효다."},{"p":13,"q":"토지거래허가 신청에 대한 불허가처분이 있으면 원칙적으로 계약은 무효로 확정된다.","a":"O","e":"불허가처분이 있으면 허가를 받을 가능성이 사라져 무효로 확정된다. 다만 서류 보완 목적 불허가 등은 예외적으로 유동적 무효가 계속될 수 있다."},{"p":13,"q":"당사자 일방 또는 쌍방이 토지거래허가신청을 거절할 의사를 명백히 한 경우에도 계약은 계속 유동적 무효 상태로 남는다.","a":"X","e":"허가신청을 거절할 의사를 명백히 한 경우에는 계약은 무효로 확정된다."},{"p":13,"q":"토지거래허가 전 유동적 무효 상태가 무효로 확정되면, 당사자는 허가절차협력을 거절할 수 있다.","a":"O","e":"무효가 확정되면 더 이상 유효로 완성할 여지가 없으므로 허가절차협력의무도 문제되지 않는다."},{"p":13,"q":"토지거래허가구역 내 토지와 건물을 일괄매매한 경우, 토지 허가가 없더라도 건물 부분은 언제나 별도로 유효하다.","a":"X","e":"토지와 건물을 일괄거래한 경우 일반적으로 법률적 운명을 같이하는 것이 당사자 의사와 거래관념에 맞는다. 특별한 사정이 있어야 건물만 분리하여 유효로 볼 수 있다."},{"p":13,"q":"법률행위의 일부분이 무효인 때에는 원칙적으로 그 전부가 무효이다.","a":"O","e":"민법 제137조 본문. 일부무효는 전부무효가 원칙이다."},{"p":13,"q":"법률행위 일부가 무효라도 그 무효부분이 없더라도 법률행위를 하였을 것이라고 인정되면 나머지 부분은 유효할 수 있다.","a":"O","e":"분할가능성과 가상적 의사가 인정되면 나머지 부분의 유효가 인정된다."},{"p":13,"q":"일부무효에서 나머지 부분이 유효하려면 법률행위의 분할가능성과 당사자의 가상적 의사가 필요하다.","a":"O","e":"객관적 요건은 분할가능성, 주관적 요건은 무효부분이 없더라도 하였을 것이라는 가상적 의사다."},{"p":13,"q":"분할가능성이 없는 법률행위에서 일부만 무효라면 나머지는 당연히 유효하다.","a":"X","e":"분할가능성이 없으면 일부무효는 전부무효가 된다."},{"p":13,"q":"법률행위의 일부무효에 관한 민법 제137조는 임의규정이므로 당사자 특약으로 달리 정할 수 있다.","a":"O","e":"제137조는 임의규정으로 이해하므로 당사자 사이의 특약이 우선될 수 있다."},{"p":13,"q":"일부무효의 법리는 일부취소 및 일부불능에도 확장 적용될 수 있다.","a":"O","e":"일부무효의 법리는 일부취소와 일부불능에도 확장 적용된다."},{"p":13,"q":"법률행위의 일부에만 취소사유가 있는 경우에도 언제나 전부취소만 가능하고 일부취소는 불가능하다.","a":"X","e":"전부취소가 원칙이지만, 가분성·특정 가능성과 나머지를 유지하려는 가정적 의사가 있으면 일부취소도 가능하다."},{"p":13,"q":"매매대상에서 특정 부분을 제외하기로 한 특약은 그 부분에 관하여 법률행위가 성립한 것이 아니므로 그 특약만을 기망에 의한 법률행위로 취소할 수는 없다.","a":"O","e":"처음부터 매매대상에서 제외된 부분은 그 부분에 관한 법률행위가 이루어진 것이 아니므로 그 특약만을 독립적으로 취소하는 구조가 아니다."},{"p":13,"q":"기망을 이유로 근저당권설정계약을 취소한 경우, 소비대차계약을 포함한 전체에 대하여 취소의 효력이 미칠 수 있다.","a":"O","e":"근저당권설정계약이 소비대차계약과 밀접하게 결합되어 있는 경우 전체 취소 효력이 인정될 수 있다."},{"p":13,"q":"토지거래허가구역 내 토지와 건물을 일괄매매한 경우, 특별한 사정이 없으면 토지 허가 전 건물만의 이전등기를 명할 수 없다.","a":"O","e":"토지와 건물이 일괄거래된 경우 일반적으로 일체로 보아야 하므로, 건물만이라도 매매하였을 것이라는 특별한 사정이 필요하다."},{"p":13,"q":"무효행위의 전환은 무효인 법률행위가 다른 법률행위의 요건을 갖추고, 당사자의 가상적 의사가 인정될 때 가능하다.","a":"O","e":"제138조. 무효인 법률행위가 다른 법률행위의 요건을 갖추고 무효를 알았더라면 다른 행위를 의욕했을 것이라고 인정되어야 한다."},{"p":13,"q":"무효행위의 전환은 법률행위가 애초에 성립하지 않은 경우에도 적용된다.","a":"X","e":"전환은 일단 성립한 무효 법률행위를 전제로 한다. 부존재에는 전환이 문제되지 않는다."},{"p":13,"q":"연착된 승낙이나 조건을 붙인 승낙·변경을 가한 승낙은 새로운 청약으로 볼 수 있다.","a":"O","e":"계약 성립에서 연착된 승낙 등은 무효행위 전환과 유사하게 새로운 청약으로 취급될 수 있다."},{"p":13,"q":"등기를 하지 않아 물권으로서 무효인 전세권설정계약이나 지상권설정계약은 임대차계약으로서 유효할 수 있다.","a":"O","e":"물권 설정요건을 갖추지 못해 물권으로는 무효라도 임대차의 요건을 갖추고 가상적 의사가 인정되면 임대차로 전환될 수 있다."},{"p":13,"q":"비밀증서에 의한 유언이 무효이더라도 자필증서 유언의 요건을 갖추면 자필증서 유언으로 인정될 수 있다.","a":"O","e":"요식행위라도 다른 요식행위의 요건을 갖추면 전환이 인정될 수 있다."},{"p":13,"q":"불공정한 법률행위는 절대적 무효이므로 어떤 경우에도 무효행위의 전환이 불가능하다.","a":"X","e":"불공정한 법률행위로 무효인 경우에도 전환 요건을 갖추면 전환이 가능할 수 있다."},{"p":13,"q":"혼인 외의 출생자를 혼인 중의 출생자로 신고한 경우 그 출생신고는 무효이나, 인지신고로서 효력이 인정될 수 있다.","a":"O","e":"신분행위에서도 실질 요건을 갖추면 전환적 효력을 인정하는 판례가 있다."},{"p":13,"q":"타인의 자를 자신의 친생자로 출생신고한 경우 입양의 실질적 요건을 갖추더라도 입양신고로서 효력이 인정될 수 없다.","a":"X","e":"입양의 실질적 요건이 모두 갖추어진 경우 입양신고로서 효력이 인정될 수 있다."},{"p":13,"q":"무효인 법률행위는 원칙적으로 추인하여도 그 효력이 생기지 않는다.","a":"O","e":"제139조 본문. 무효행위는 추인으로 처음부터 유효가 되는 것이 원칙적으로 불가능하다."},{"p":13,"q":"무효인 법률행위를 당사자가 그 무효임을 알고 추인한 때에는 원칙적으로 그때부터 새로운 법률행위로 본다.","a":"O","e":"제139조 단서. 무효임을 알고 추인하면 소급효가 아니라 그때부터 새로운 법률행위로 볼 수 있다."},{"p":13,"q":"무효행위의 추인은 원칙적으로 행위 시로 소급하여 물권적으로 유효하게 만든다.","a":"X","e":"무효행위 추인은 원칙적으로 소급효가 없고, 그때부터 새로운 법률행위로 본다. 물권적·소급적 효력은 법률규정이나 특별한 판례 법리에 따른 예외다."},{"p":13,"q":"무효행위의 추인이 유효하려면 무효임을 알고 추인해야 한다.","a":"O","e":"무효행위의 추인은 당사자가 그 법률행위가 무효임을 알고 해야 한다."},{"p":13,"q":"무효행위의 추인은 무효원인이 종료되기 전에도 언제나 가능하다.","a":"X","e":"무효원인이 소멸한 후에 무효임을 알고 추인해야 한다. 강행법규 위반이나 반사회질서 행위처럼 무효원인이 소멸하지 않는 경우 추인으로 새로운 행위가 되기 어렵다."},{"p":13,"q":"강행법규 위반으로 무효인 행위나 반사회질서 법률행위는 원칙적으로 추인에 의해 새로운 법률행위로 될 수 없다.","a":"O","e":"무효원인이 소멸하지 않는 유형이므로 무효행위 추인으로 유효화되지 않는다."},{"p":13,"q":"허위표시에 기한 매매계약을 당사자가 추인하면 그때부터 새로운 매매계약을 체결한 것으로 볼 수 있다.","a":"O","e":"통정허위표시 무효를 알면서 추인하면 원칙적으로 그때부터 새로운 법률행위가 된다."},{"p":13,"q":"무효인 가등기를 유효한 등기로 유용하기로 한 약정은 그 가등기를 처음부터 유효한 등기로 소급 전환시킨다.","a":"X","e":"무효인 가등기 유용 약정은 그때부터 유효할 수 있을 뿐, 소급하여 유효한 등기로 전환되지는 않는다."},{"p":13,"q":"집합채권양도가 양도금지특약 위반으로 무효인 경우, 채무자가 일부 개별채권을 특정하여 추인하는 것이 가능하다.","a":"O","e":"채무자의 사후승낙에 의해 무효인 채권양도행위가 유효하게 될 수 있으나, 특별한 약정이 없으면 효과는 승낙시부터 발생한다."},{"p":13,"q":"무권대리의 추인은 원칙적으로 계약 시에 소급하여 효력이 생긴다.","a":"O","e":"무권대리 추인은 법률 규정상 소급효가 인정되는 대표적 예외다."},{"p":13,"q":"무권리자의 처분행위에 대한 권리자의 추인은 무권대리 추인과 유사하므로 원칙적으로 계약 체결 시에 소급하여 권리자에게 효력이 귀속될 수 있다.","a":"O","e":"무권리자 처분의 추인에는 무권대리 추인 법리를 유추 적용하여 소급효를 인정할 수 있다."},{"p":13,"q":"당사자 약정으로 무효행위를 당사자 사이에서만 소급하여 유효한 것으로 취급할 수 있는 경우가 있다.","a":"O","e":"채권적·소급적 추인은 당사자 사이의 내부관계에서 과실 취득·공조공과 부담 등을 행위 시부터 이전한 것으로 다루는 약정이 가능하다."},{"p":13,"q":"취소는 취소권자의 일방적 의사표시에 의해 법률행위의 효력을 소급적으로 소멸시키는 제도이다.","a":"O","e":"취소는 형성권 행사로서 일방적 의사표시에 의해 효과가 발생한다."},{"p":13,"q":"취소권은 상대방 있는 단독행위이자 형성권이다.","a":"O","e":"취소권 행사는 상대방에 대한 단독행위이며 법률관계를 일방적으로 변동시키는 형성권이다."},{"p":13,"q":"취소권은 모든 법률행위에 인정될 수 있으나, 해제는 원칙적으로 계약에 관한 제도이다.","a":"O","e":"취소는 단독행위·계약 등 모든 법률행위에 문제될 수 있고, 해제는 계약관계 소멸 제도다."},{"p":13,"q":"취소의 발생원인은 제한능력, 착오, 사기, 강박 등 법률규정에 의하여 정해진다.","a":"O","e":"취소권은 법률규정에 의해 발생한다. 당사자가 마음대로 취소권을 창설하는 구조와 구별한다."},{"p":13,"q":"취소와 해제는 모두 손해배상청구가 항상 당연히 수반된다.","a":"X","e":"해제에서는 채무불이행과 결합해 손해배상 문제가 생길 수 있으나, 취소 자체가 언제나 손해배상청구를 수반하는 것은 아니다."},{"p":13,"q":"취소할 수 있는 법률행위는 제한능력자, 착오·사기·강박에 의해 의사표시한 자, 그의 대리인 또는 승계인만 취소할 수 있다.","a":"O","e":"민법 제140조. 취소권자는 한 자·대리인·승계인으로 압축한다."},{"p":13,"q":"제한능력자는 스스로 자신이 한 법률행위를 취소할 수 있다.","a":"O","e":"제한능력자 본인도 취소권자이다."},{"p":13,"q":"제한능력자의 법정대리인은 제한능력자의 취소권을 대리행사하는 것일 뿐, 법정대리인 고유의 취소권은 없다.","a":"X","e":"법정대리인은 제140조상 취소권자로서 스스로 취소권을 행사한다. 단순 대리행사로만 보지 않는다."},{"p":13,"q":"임의대리인은 언제나 별도 수권 없이 취소권을 행사할 수 있다.","a":"X","e":"임의대리인이 취소권을 행사하려면 취소에 관한 특별수권이 필요하다."},{"p":13,"q":"포괄승계인은 취소권을 승계할 수 있다.","a":"O","e":"상속인 같은 포괄승계인은 취소권을 승계한다."},{"p":13,"q":"취소권만을 독립적으로 특정승계하는 것은 가능하다.","a":"X","e":"취소권만의 특정승계는 인정되지 않는다. 권리 자체의 특정승계와 함께 취소권 문제가 생기는지 구별한다."},{"p":13,"q":"취소할 수 있는 법률행위의 상대방이 확정되어 있으면 취소는 그 상대방에 대한 의사표시로 하여야 한다.","a":"O","e":"민법 제142조. 상대방 있는 법률행위의 취소는 직접 상대방에게 해야 한다."},{"p":13,"q":"사기로 토지를 매도한 뒤 상대방이 제3자에게 전매한 경우, 매도인의 취소 의사표시는 원래의 상대방에게 하여야 한다.","a":"O","e":"취소의 상대방은 법률행위의 직접 상대방이다. 전득자에게 한 취소는 원칙적으로 효력이 없다."},{"p":13,"q":"사기로 토지를 매도한 뒤 상대방이 제3자에게 전매한 경우, 취소의 의사표시는 전득자에게 하여야만 효력이 있다.","a":"X","e":"취소는 원래의 상대방에게 해야 한다. 전득자는 취소의 상대방이 아니라 취소효과의 대항 여부 문제에서 등장한다."},{"p":13,"q":"상대방 없는 단독행위의 취소는 특정인에게 할 필요 없이 취소의 의사표시를 적당한 방법으로 외부에 객관화하면 족하다.","a":"O","e":"상대방 없는 단독행위에는 취소의 상대방이 없으므로 외부 객관화로 충분하다고 본다."},{"p":13,"q":"취소의 의사표시는 반드시 서면으로 해야 한다.","a":"X","e":"취소는 불요식행위이므로 특별한 방식을 요하지 않는다. 구두 또는 묵시적 의사표시도 가능하다."},{"p":13,"q":"취소의 의사표시는 반드시 명시적이어야 하며, 취소원인을 구체적으로 진술하지 않으면 무효이다.","a":"X","e":"취소자가 법률행위의 효력을 처음부터 배제하려는 의사가 드러나면 족하고, 취소원인의 진술이 없어도 가능하다."},{"p":13,"q":"법률행위의 취소를 당연한 전제로 한 소송상 이행청구나 이행거절의 의사표시 안에 취소의 의사표시가 포함될 수 있다.","a":"O","e":"취소 의사가 묵시적으로 드러나면 취소의 의사표시가 인정될 수 있다."},{"p":13,"q":"취소에는 원칙적으로 조건이나 기한을 붙일 수 없다.","a":"O","e":"취소는 형성권 행사로 법률관계를 일방적으로 확정시키므로 원칙적으로 조건·기한을 붙일 수 없다."},{"p":13,"q":"취소된 법률행위는 처음부터 무효인 것으로 본다.","a":"O","e":"민법 제141조 본문. 취소권 행사의 효과는 소급적 무효이다."},{"p":13,"q":"제한능력을 이유로 취소한 경우 그 취소는 선의의 제3자에게도 대항할 수 있다.","a":"O","e":"제한능력자 보호가 우선되므로 취소의 효과를 모든 제3자에게 주장할 수 있다."},{"p":13,"q":"착오·사기·강박을 이유로 취소한 경우 선의의 제3자에게 대항하지 못한다.","a":"O","e":"민법 제109조 제2항, 제110조 제3항 구조. 거래안전상 선의의 제3자를 보호한다."},{"p":13,"q":"사기·강박으로 취소한 경우 악의의 제3자에게도 대항하지 못한다.","a":"X","e":"보호되는 것은 선의의 제3자이다. 악의의 제3자에게는 취소로 대항할 수 있다."},{"p":13,"q":"착오를 이유로 취소한 경우에도 선의의 제3자는 보호된다.","a":"O","e":"착오취소도 제109조 제2항에 따라 선의의 제3자에게 대항하지 못한다."},{"p":13,"q":"취소 전에 이미 이행된 부분은 취소 후 부당이득 반환 문제가 된다.","a":"O","e":"취소로 소급무효가 되므로 이미 이행된 급부는 부당이득 반환 대상이 된다."},{"p":13,"q":"제한능력자는 법률행위를 취소한 경우 선의·악의를 불문하고 현존이익 한도에서 반환하면 된다.","a":"O","e":"민법 제141조 단서. 제한능력자 보호를 위해 현존이익 반환으로 제한된다."},{"p":13,"q":"제한능력자가 취소 후 반환할 때 악의이면 받은 이익에 이자를 붙이고 손해까지 배상해야 한다.","a":"X","e":"제한능력자 반환은 선의·악의 불문하고 현존이익 한도다."},{"p":13,"q":"제한능력자가 법률행위로 취득한 이익은 현존하는 것으로 추정되므로, 현존이익이 없다는 점은 제한능력자가 입증하여야 한다.","a":"O","e":"판례는 제한능력자가 취득한 이익은 현존하는 것으로 추정하고, 없음을 제한능력자가 입증해야 한다고 본다."},{"p":13,"q":"제한능력자 취소의 경우 현존이익 한도 반환이므로, 제한능력자가 받은 돈을 생활비로 소비한 경우에도 언제나 현존이익은 없다.","a":"X","e":"생활비 등 필요한 지출에 사용하여 다른 재산 지출을 면한 경우 현존이익이 인정될 수 있다. 단순 소비 여부만으로 판단하지 않는다."},{"p":13,"q":"취소로 인한 부당이득반환청구권은 취소권을 행사한 때부터 따로 소멸시효가 진행한다.","a":"O","e":"취소권 행사로 부당이득반환청구권이 발생하므로 그때부터 별도로 시효가 진행한다."},{"p":13,"q":"취소할 수 있는 법률행위의 추인은 그 행위를 취소하지 않고 유효로 확정시키겠다는 취소권자의 의사표시이다.","a":"O","e":"추인은 취소권의 포기이며, 추인 후에는 다시 취소하지 못한다."},{"p":13,"q":"취소할 수 있는 법률행위는 제140조의 취소권자가 추인할 수 있다.","a":"O","e":"추인권자는 취소권자와 대응한다. 한 자, 대리인, 승계인을 기준으로 본다."},{"p":13,"q":"취소할 수 있는 법률행위의 추인은 원칙적으로 취소의 원인이 소멸된 후에 하여야 효력이 있다.","a":"O","e":"민법 제144조. 취소원인이 남아 있으면 진정한 취소권 포기라고 보기 어렵다."},{"p":13,"q":"미성년자는 성년이 되기 전에는 법정대리인의 동의를 얻더라도 추인할 수 없다.","a":"X","e":"원칙적으로 능력자가 된 후 추인하지만, 미성년자는 법정대리인의 동의를 얻어 추인할 수 있다."},{"p":13,"q":"피성년후견인은 성년후견 종료심판 전에는 단독으로 추인할 수 없다.","a":"O","e":"피성년후견인은 원칙적으로 성년후견 종료심판 후 단독 추인이 가능하다."},{"p":13,"q":"착오·사기·강박에 의한 의사표시를 한 자는 그 상태를 벗어난 후에 추인할 수 있다.","a":"O","e":"착오·사기·강박 상태가 종료되어야 추인이 유효하다."},{"p":13,"q":"제한능력자의 법정대리인 또는 후견인이 추인하는 경우에는 취소의 원인이 소멸되기 전이라도 추인할 수 있다.","a":"O","e":"제144조 제2항. 법정대리인·후견인이 추인하는 경우 원인소멸 후 요건이 적용되지 않는다."},{"p":13,"q":"취소권자가 여러 명인 경우 그중 1인이 추인하면 다른 취소권자의 취소권도 소멸한다.","a":"O","e":"제한능력자와 법정대리인처럼 취소권자가 수인인 경우 1인의 추인으로 취소할 수 있는 행위가 유효 확정된다."},{"p":13,"q":"추인은 반드시 서면으로 해야 하고, 묵시적으로는 할 수 없다.","a":"X","e":"추인은 불요식행위로서 구두·묵시적 의사표시도 가능하다."},{"p":13,"q":"취소할 수 있는 법률행위를 추인하면 그 법률행위는 유효로 확정되고 다시 취소할 수 없다.","a":"O","e":"추인은 취소권 포기이므로 추인 후에는 취소권이 소멸한다."},{"p":13,"q":"취소한 법률행위는 더 이상 취소할 수 있는 법률행위가 아니므로 취소할 수 있는 행위로서 다시 추인할 수 없다.","a":"O","e":"일단 취소되면 소급무효가 되므로 취소할 수 있는 행위의 추인이 아니라 무효행위 추인의 문제로 전환된다."},{"p":13,"q":"강박에 의한 증여를 강박을 이유로 취소한 후 다시 추인하는 경우, 취소할 수 있는 법률행위의 추인으로서 처음부터 유효가 된다.","a":"X","e":"이미 취소되어 무효가 되었으므로 무효행위 추인의 요건과 효력으로 보아 그때부터 새로운 법률행위가 될 수 있다."},{"p":13,"q":"법정추인은 취소권자가 취소하지 않을 것 같은 일정한 행위를 한 경우 법률상 추인한 것으로 보는 제도이다.","a":"O","e":"제145조. 취소권자의 행위 태도에 기초하여 취소권 소멸 효과를 인정한다."},{"p":13,"q":"법정추인이 성립하려면 원칙적으로 취소의 원인이 소멸한 후 법정추인 사유가 있어야 한다.","a":"O","e":"법정추인도 원칙적으로 추인할 수 있는 상태가 된 후에 인정된다."},{"p":13,"q":"법정대리인이 스스로 법정추인 사유에 해당하는 행위를 한 경우에는 취소원인이 소멸하기 전이라도 법정추인이 인정될 수 있다.","a":"O","e":"법정대리인이나 후견인의 행위, 미성년자·피한정후견인이 법정대리인 동의를 얻은 행위는 원인소멸 전에도 법정추인 가능성이 있다."},{"p":13,"q":"법정추인은 취소권자가 취소할 수 있는 행위임을 인식하고 추인의 의사를 가져야만 성립한다.","a":"X","e":"법정추인은 법률규정에 의한 효과이므로 취소할 수 있음을 인식하거나 추인의사가 있을 필요가 없다."},{"p":13,"q":"법정추인 사유가 있더라도 이의를 보류한 때에는 법정추인이 되지 않는다.","a":"O","e":"제145조 단서. 이의보류가 있으면 취소권 포기로 볼 수 없다."},{"p":13,"q":"취소할 수 있는 행위의 전부나 일부의 이행은 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제1호. 전부나 일부의 이행은 법정추인 사유다."},{"p":13,"q":"이행의 청구는 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제2호. 취소권자가 이행을 청구하면 유효를 전제로 행동한 것이므로 법정추인이 된다."},{"p":13,"q":"경개는 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제3호. 경개는 기존채무를 소멸시키고 새 채무를 성립시키므로 법정추인 사유다."},{"p":13,"q":"담보의 제공은 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제4호. 담보제공은 법정추인 사유다."},{"p":13,"q":"취소할 수 있는 행위로 취득한 권리의 전부나 일부 양도는 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제5호. 권리를 양도했다면 그 법률행위의 유효를 전제로 한 행동이다."},{"p":13,"q":"강제집행은 법정추인 사유가 될 수 있다.","a":"O","e":"제145조 제6호. 강제집행은 법정추인 사유다."},{"p":13,"q":"전부나 일부의 이행은 취소권자가 이행한 경우뿐 아니라 취소권자가 상대방의 이행을 받은 경우에도 법정추인이 될 수 있다.","a":"O","e":"이행은 취소권자가 한 경우와 받은 경우 모두 법정추인 사유가 될 수 있다."},{"p":13,"q":"이행의 청구, 권리의 양도, 강제집행은 취소권자가 한 경우에 법정추인 사유가 된다.","a":"O","e":"이행의 청구·권리양도·강제집행은 취소권자가 한 경우를 기준으로 법정추인을 판단한다."},{"p":13,"q":"취소권자가 취소할 수 있는 행위로 취득한 물건에 용익물권을 설정한 경우에는 법정추인이 될 수 있다.","a":"O","e":"취득한 권리를 처분한 것으로 보아 법정추인 사유에 해당한다."},{"p":13,"q":"취소권자가 취소 후 발생할 부당이득반환청구권을 양도한 경우에는 취소할 수 있는 행위로 취득한 권리의 양도로 보아 법정추인이 된다.","a":"X","e":"취소 후 발생하는 부당이득반환청구권은 취소할 수 있는 행위로 취득한 권리가 아니므로 법정추인에 해당하지 않는다."},{"p":13,"q":"사기·강박으로 발생한 손해배상청구권을 양도한 경우에는 취소할 수 있는 행위로 취득한 권리의 양도로 볼 수 없다.","a":"O","e":"손해배상청구권은 취소할 수 있는 행위로 취득한 권리 자체가 아니므로 법정추인이 아니다."},{"p":13,"q":"취소권은 추인할 수 있는 날부터 3년 내에, 법률행위를 한 날부터 10년 내에 행사하여야 한다.","a":"O","e":"민법 제146조. 암기: 추3 한10."},{"p":13,"q":"취소권은 추인할 수 있는 날부터 3년과 법률행위를 한 날부터 10년 중 어느 하나라도 먼저 도래하면 소멸한다.","a":"O","e":"두 기간은 병렬로 작용하므로 어느 하나가 지나면 취소권은 소멸한다."},{"p":13,"q":"추인할 수 있는 날이란 취소의 원인이 종료되어 취소권자가 추인도 취소도 할 수 있는 상태가 된 때를 의미한다.","a":"O","e":"취소권 행사에 관한 장애가 없어져 추인 가능 상태가 된 때를 말한다."},{"p":13,"q":"취소권 행사기간은 소멸시효기간이다.","a":"X","e":"취소권 행사기간은 제척기간이다."},{"p":13,"q":"취소권 행사기간이 도과하였는지는 당사자의 주장이 없어도 법원이 직권으로 조사·적용하여야 한다.","a":"O","e":"제척기간 도과 여부는 법원이 직권으로 판단할 수 있다."},{"p":13,"q":"제척기간에 관한 민법 규정은 강행규정이다.","a":"O","e":"제척기간은 권리관계 조속 확정을 위한 강행적 성격을 가진다."},{"p":13,"q":"취소권을 행사하여 발생한 부당이득반환청구권도 취소권과 같은 추인할 수 있는 날부터 3년, 행위한 날부터 10년의 기간 제한을 받는다.","a":"X","e":"부당이득반환청구권은 취소권 행사 후 별도로 발생하고 그때부터 별도로 소멸시효가 진행한다."},{"p":13,"q":"취소할 수 있는 법률행위를 취소한 후 제한능력을 이유로 한 취소라면 다시 취소할 수 없다.","a":"O","e":"이미 취소로 소급무효가 되었으므로 제한능력 취소로 다시 취소할 수 없다."},{"p":13,"q":"착오·사기·강박을 이유로 취소한 경우에는 다시 다른 취소사유로 취소할 수 있는 문제가 생길 수 있다.","a":"O","e":"자료는 취소의 원인에 따라 제한능력은 다시 취소 불가, 착오·사기·강박은 다시 취소 가능으로 정리한다. 다만 실전에서는 구체적 법률관계를 전제로 판단한다."},{"p":13,"q":"취소할 수 있는 법률행위를 추인한 후에는 다시 취소할 수 없다.","a":"O","e":"추인은 취소권 포기이므로 취소권이 소멸한다."},{"p":13,"q":"취소의 상대방은 언제나 현재 권리를 보유한 자이다.","a":"X","e":"상대방이 권리를 제3자에게 양도했더라도 취소의 상대방은 원래의 직접 상대방이다."},{"p":13,"q":"취소권자의 상대방이 확정되어 있는 경우, 취소의 의사표시가 상대방에게 도달해야 효력이 발생한다.","a":"O","e":"취소는 상대방 있는 의사표시이므로 상대방에게 도달해야 효력이 발생한다."},{"p":13,"q":"무효행위의 추인과 취소할 수 있는 행위의 추인은 모두 그 행위를 처음부터 유효로 확정시키는 효과가 있다.","a":"X","e":"취소할 수 있는 행위의 추인은 유효 확정 효과가 있지만, 무효행위의 추인은 원칙적으로 그때부터 새로운 법률행위가 될 뿐이다."},{"p":13,"q":"무효행위의 전환은 당사자가 실제로 다른 법률행위를 하겠다고 명시했을 때에만 인정된다.","a":"X","e":"실제 명시 의사까지 필요한 것은 아니고, 무효를 알았더라면 다른 행위를 의욕했을 것이라는 가상적 의사가 인정되면 된다."},{"p":13,"q":"일부무효의 법리는 당사자의 가상적 의사와 법률행위의 분할가능성을 통해 거래를 가능한 한 유지하려는 기능을 한다.","a":"O","e":"일부무효 법리는 전부무효 원칙에 대한 예외로서 거래유지 기능을 한다."},{"p":13,"q":"유동적 무효는 장래 일정한 사유에 따라 유효로 확정되거나 무효로 확정될 수 있는 불확정적 무효이다.","a":"O","e":"토지거래허가 전 계약, 무권대리 행위 등은 유동적 무효로 설명된다."},{"p":13,"q":"무권대리 행위와 토지거래허가 전 계약은 모두 처음부터 확정적으로 무효이므로 추인이나 허가로 유효가 될 수 없다.","a":"X","e":"둘 다 유동적 무효로 설명된다. 무권대리는 본인의 추인으로, 토지거래허가는 허가로 유효 확정될 수 있다."},{"p":14,"q":"법률행위의 부관이란 법률효과의 발생 또는 소멸을 장래의 일정 사정에 의존하게 하려고 법률행위에 덧붙이는 약관적 요소를 말한다.","a":"O","e":"조건과 기한은 법률행위의 효과를 장래의 사정에 연결하는 부관이다. 부담은 주로 채권법에서 다루고, 총칙에서는 조건과 기한이 중심이다."},{"p":14,"q":"조건은 장래 도래가 확실한 사실에 법률효과를 의존하게 하는 부관이다.","a":"X","e":"조건은 장래 도래가 불확실한 사실에 효과를 의존하게 하는 부관이다. 장래 도래가 확실한 사실이면 기한이다."},{"p":14,"q":"기한은 장래 도래가 확실한 사실에 법률효과의 발생 또는 소멸을 의존하게 하는 부관이다.","a":"O","e":"도래 시기만 불확실하더라도 도래 자체가 확실하면 불확정기한이다."},{"p":14,"q":"조건부 법률행위가 되기 위해서는 조건을 붙이려는 의사와 그 외부표시가 필요하다.","a":"O","e":"조건의사가 있어도 외부에 표시되지 않으면 법률행위의 부관이 아니라 동기에 불과하다."},{"p":14,"q":"조건의사가 마음속에만 존재하더라도 상대방이 알 수 있었다면 언제나 법률행위의 조건이 된다.","a":"X","e":"조건은 법률행위의 내용으로 표시되어야 한다. 표시되지 않은 사정은 원칙적으로 동기 문제다."},{"p":14,"q":"장래의 불확실한 사실에 법률효과의 발생을 의존시키면 정지조건, 소멸을 의존시키면 해제조건이다.","a":"O","e":"정지조건은 성취 때 효력 발생, 해제조건은 성취 때 효력 소멸이다."},{"p":14,"q":"장래 사실이 발생하지 않으면 변제하지 않아도 된다는 취지라면 조건으로 해석될 수 있다.","a":"O","e":"부관이 붙은 사실이 발생하지 않으면 의무가 없다는 해석이 가능하면 조건으로 볼 수 있다."},{"p":14,"q":"장래 사실이 발생한 때뿐 아니라 발생 불가능으로 확정된 때에도 반드시 변제해야 한다는 취지라면 불확정기한으로 볼 수 있다.","a":"O","e":"도래 자체가 확실하거나 불가능 확정 시에도 이행해야 한다면 조건이 아니라 불확정기한으로 해석된다."},{"p":14,"q":"어음·수표행위에는 거래안전상 원칙적으로 조건을 붙일 수 없다.","a":"O","e":"어음·수표행위는 조건과 친하지 않은 행위의 대표이다."},{"p":14,"q":"어음보증에는 어떠한 경우에도 조건을 붙일 수 없다.","a":"X","e":"어음보증에 조건을 붙이는 것은 어음거래의 안전성을 해치지 않아 허용될 수 있다."},{"p":14,"q":"철회·상계·추인·취소·해제·해지와 같은 단독행위에는 원칙적으로 조건을 붙일 수 없다.","a":"O","e":"상대방의 법률관계를 일방적으로 불안정하게 만들 수 있으므로 원칙적으로 조건과 친하지 않다."},{"p":14,"q":"단독행위에는 예외 없이 조건을 붙일 수 없다.","a":"X","e":"상대방 동의가 있거나 상대방에게 이익만 주거나 상대방이 결정할 수 있는 사실을 조건으로 하는 경우 등에는 가능하다."},{"p":14,"q":"채무면제나 유증처럼 상대방에게 이익만 주는 단독행위에는 조건을 붙일 수 있다.","a":"O","e":"상대방에게 불이익한 불안정성을 주지 않으므로 예외적으로 조건을 붙일 수 있다."},{"p":14,"q":"이행지체 상대방에게 일정 기간 내 이행이 없으면 계약을 해제하겠다는 의사표시는 정지조건부 해제로 해석될 수 있다.","a":"O","e":"상대방이 결정할 수 있는 사실을 조건으로 하는 경우로서 허용되는 단독행위 조건의 예외다."},{"p":14,"q":"혼인·이혼·인지·입양 같은 신분행위에는 원칙적으로 조건을 붙일 수 없다.","a":"O","e":"신분관계는 명확성과 안정성이 요구되므로 조건과 친하지 않다."},{"p":14,"q":"유언은 신분행위이므로 절대 조건을 붙일 수 없다.","a":"X","e":"유언에는 예외적으로 조건을 붙일 수 있다."},{"p":14,"q":"조건과 친하지 않은 법률행위에 조건을 붙인 경우, 특별한 규정이 없으면 조건만 무효이고 법률행위는 유효하다.","a":"X","e":"원칙적으로 조건뿐 아니라 법률행위 전부가 무효가 된다."},{"p":14,"q":"조건과 친하지 않은 법률행위에 조건을 붙인 경우에도 법률에 특별 규정이 있으면 그 규정에 따른다.","a":"O","e":"특별 규정이 있으면 그에 따르고, 없으면 법률행위 전부 무효가 원칙이다."},{"p":14,"q":"소유권유보부 동산매매에서 대금 완납 전까지 소유권을 매도인에게 유보하는 특약은 정지조건의 예로 볼 수 있다.","a":"O","e":"대금 완납이라는 장래 불확실한 사실의 성취에 소유권 이전 효과를 연결한다."},{"p":14,"q":"약혼예물의 수수는 혼인불성립을 정지조건으로 하는 증여와 유사하다.","a":"X","e":"약혼예물은 혼인불성립을 해제조건으로 하는 증여와 유사하게 본다."},{"p":14,"q":"내 마음이 내키면 물건을 주겠다는 순수수의조건은 원칙적으로 무효이다.","a":"O","e":"조건성취가 일방의 의사결정에 전적으로 의존하면 법률관계가 지나치게 불확정해진다."},{"p":14,"q":"내가 이번에 미국여행을 가면 물건을 주겠다는 조건은 반드시 무효인 순수수의조건이다.","a":"X","e":"여행 여부는 의사결정 요소가 있지만 외부 사정도 결합된 단순수의조건으로 볼 수 있다."},{"p":14,"q":"내일 비가 오면 물건을 주겠다는 조건은 우성조건의 예이다.","a":"O","e":"조건성취가 당사자 의사와 무관한 우연한 사실에 좌우된다."},{"p":14,"q":"네가 을과 결혼하면 물건을 주겠다는 조건은 혼성조건의 예이다.","a":"O","e":"당사자의 의사와 제3자 등의 의사가 함께 관련되는 조건이다."},{"p":14,"q":"적극조건은 일정한 사실이 발생하지 않을 것을 내용으로 하는 조건이다.","a":"X","e":"적극조건은 일정 사실이 발생할 것을 내용으로 하고, 소극조건은 발생하지 않을 것을 내용으로 한다."},{"p":14,"q":"정지조건부 법률행위는 조건이 성취되면 효력이 발생하고, 조건이 불성취되면 무효로 확정된다.","a":"O","e":"정지조건은 효력 발생을 조건성취에 의존시킨다."},{"p":14,"q":"해제조건부 법률행위는 조건이 성취되면 효력이 소멸하고, 조건이 불성취되면 유효로 확정된다.","a":"O","e":"해제조건은 효력 소멸을 조건성취에 의존시킨다."},{"p":14,"q":"조건의 존재 여부는 법률문제이므로 조건의 존재를 주장하지 않아도 법원이 언제나 직권으로 판단한다.","a":"X","e":"어떤 조건이 붙었는지는 사실인정 문제로, 조건의 존재를 주장하는 자가 입증해야 한다."},{"p":14,"q":"정지조건의 성취 사실은 권리를 취득하려는 자가 입증하여야 한다.","a":"O","e":"정지조건 성취로 권리를 취득한다고 주장하는 자에게 입증책임이 있다."},{"p":14,"q":"조건부 법률행위는 조건이 성취한 때부터 효력이 발생하거나 소멸하는 것이 원칙이다.","a":"O","e":"조건성취의 효력은 원칙적으로 비소급이다."},{"p":14,"q":"조건성취의 효과는 강행규정상 언제나 비소급이므로 당사자는 소급효를 약정할 수 없다.","a":"X","e":"조건성취의 효력은 임의규정이다. 당사자는 소급효를 약정할 수 있다. 다만 제3자의 권리를 해하지 못한다."},{"p":14,"q":"당사자가 조건성취의 효력을 소급시키기로 약정하면 그 소급효는 제3자의 권리까지 해칠 수 있다.","a":"X","e":"소급효 약정은 당사자 사이에서만 유효하고 제3자의 권리를 해하지 못한다."},{"p":14,"q":"조건성취의 소급 시기는 반드시 법률행위 당시로만 정해야 한다.","a":"X","e":"법률행위 이후 어느 시점으로 소급할지는 당사자가 정할 수 있다."},{"p":14,"q":"조건부 권리는 조건성취 전에는 아무 보호도 받지 못하는 단순한 기대에 불과하다.","a":"X","e":"조건부 권리는 기대권·희망권으로서 침해금지, 처분·상속·보존·담보 제공이 인정된다."},{"p":14,"q":"조건부 권리도 처분·상속·보존 또는 담보로 할 수 있다.","a":"O","e":"민법 제149조의 내용이다."},{"p":14,"q":"조건의 성부가 미정인 동안 당사자는 조건성취로 생길 상대방의 이익을 해하지 못한다.","a":"O","e":"조건부 권리 침해금지 원칙이다."},{"p":14,"q":"조건부 권리를 침해하는 처분이 있고 나중에 조건이 성취되면, 그 처분은 조건부 권리자의 권리취득을 방해하는 한도에서 무효가 될 수 있다.","a":"O","e":"조건부 권리 보호의 효과다. 다만 제3자에게 대항하려면 대항요건이 필요하다."},{"p":14,"q":"부동산에 관한 조건부 권리는 가등기할 수 없으므로 제3자에게 대항할 방법이 없다.","a":"X","e":"부동산을 목적으로 하는 조건부 권리는 가등기할 수 있고, 가등기하면 제3자에게 대항할 수 있다."},{"p":14,"q":"조건부 권리자는 조건성취 전이라도 그 권리를 담보로 제공할 수 있다.","a":"O","e":"조건성취가 미정인 권리·의무는 일반규정에 따라 담보로 할 수 있다."},{"p":14,"q":"조건성취로 불이익을 받을 자가 신의칙에 반하여 조건성취를 방해하면 상대방은 조건이 성취된 것으로 주장할 수 있다.","a":"O","e":"민법 제150조 제1항의 조건성취 방해 효과다."},{"p":14,"q":"조건성취로 이익을 받을 자가 신의칙에 반하여 조건을 성취시킨 경우 상대방은 조건이 성취되지 않은 것으로 주장할 수 있다.","a":"O","e":"민법 제150조 제2항의 반신의행위 효과다."},{"p":14,"q":"조건성취 방해가 있으면 방해행위 즉시 조건이 성취된 것으로 확정된다.","a":"X","e":"방해행위가 없었더라면 조건이 성취되었을 것으로 추산되는 시점에 성취된 것으로 주장할 수 있다."},{"p":14,"q":"조건성취 방해 또는 부정성취의 효과는 법률상 당연히 발생하므로 상대방의 주장이 필요 없다.","a":"X","e":"상대방이 조건성취 또는 불성취를 주장할 수 있는 구조다."},{"p":14,"q":"조건의 내용 자체가 선량한 풍속 기타 사회질서에 위반하면 그 법률행위는 무효이다.","a":"O","e":"불법조건이 붙은 법률행위는 조건만 무효가 아니라 법률행위 전부가 무효가 된다."},{"p":14,"q":"불법조건이 붙은 법률행위에서는 조건만 분리하여 무효로 하고 법률행위 자체는 언제나 유효로 유지한다.","a":"X","e":"조건 내용이 불법이면 법률행위 전부가 무효다."},{"p":14,"q":"부첩관계인 부부생활의 종료를 해제조건으로 하는 증여계약은 조건만 무효이고 증여계약은 유효하다.","a":"X","e":"불법조건의 사례로서 조건만이 아니라 증여계약 자체가 무효이다."},{"p":14,"q":"법률행위 당시 이미 성취한 조건이 정지조건이면 조건 없는 법률행위가 된다.","a":"O","e":"기성조건 + 정지조건 = 조건 없는 법률행위."},{"p":14,"q":"법률행위 당시 이미 성취한 조건이 해제조건이면 조건 없는 법률행위가 된다.","a":"X","e":"기성조건 + 해제조건 = 법률행위 무효."},{"p":14,"q":"법률행위 당시 이미 성취할 수 없는 조건이 정지조건이면 법률행위는 무효이다.","a":"O","e":"불능조건 + 정지조건 = 무효."},{"p":14,"q":"법률행위 당시 이미 성취할 수 없는 조건이 해제조건이면 조건 없는 법률행위가 된다.","a":"O","e":"불능조건 + 해제조건 = 조건 없는 법률행위."},{"p":14,"q":"법정조건은 당사자가 임의로 붙인 부관으로서의 조건에 해당한다.","a":"X","e":"법정조건은 법률상 당연한 요건이므로 민법상 조건 그 자체는 아니다."},{"p":14,"q":"법정조건에도 성질에 반하지 않는 범위에서 조건 규정을 유추 적용할 수 있다.","a":"O","e":"법정조건은 조건 그 자체는 아니나 성질상 맞는 범위에서 조건 규정이 유추 적용될 수 있다."},{"p":14,"q":"시기는 법률행위의 효력 발생을 장래의 확실한 사실에 의존시키는 기한이다.","a":"O","e":"시기는 효력발생, 종기는 효력소멸에 관한 기한이다."},{"p":14,"q":"종기는 법률행위의 효력 발생을 장래의 확실한 사실에 의존시키는 기한이다.","a":"X","e":"종기는 효력 소멸을 장래의 확실한 사실에 의존시키는 기한이다."},{"p":14,"q":"확정기한은 도래 사실과 도래 시기가 모두 확정된 기한이다.","a":"O","e":"예: 2026년 6월 1일에 지급한다."},{"p":14,"q":"불확정기한은 도래 여부 자체가 불확실한 사실을 말한다.","a":"X","e":"불확정기한은 도래 자체는 확실하지만 도래 시기가 불확실한 기한이다."},{"p":14,"q":"부관으로 정한 사실이 발생한 때뿐 아니라 발생이 불가능한 것으로 확정된 때에도 반드시 이행해야 한다면 불확정기한으로 해석될 수 있다.","a":"O","e":"발생하지 않으면 의무가 없어지는 조건과 구별된다."},{"p":14,"q":"임대차에서 임대기한을 본건 토지를 임대인이 임차인에게 매도할 때까지로 정한 경우, 당연히 확정기한 있는 임대차가 된다.","a":"X","e":"그와 같은 약정은 기한을 정한 것으로 보기 어려워 기간의 약정이 없는 임대차로 해석될 수 있다."},{"p":14,"q":"기한을 붙일 수 없는 법률행위는 대체로 조건을 붙일 수 없는 법률행위와 유사하다.","a":"O","e":"특히 소급효 있는 행위나 성립 즉시 효력이 발생해야 하는 행위에는 시기를 붙일 수 없다."},{"p":14,"q":"취소·추인·상계와 같이 소급효가 있는 법률행위에는 시기를 붙일 수 없다.","a":"O","e":"소급효 있는 법률행위에 시기를 붙이면 효과 발생 시점 구조와 충돌한다."},{"p":14,"q":"신분행위처럼 법률행위 성립과 동시에 효력이 발생해야 하는 행위에는 원칙적으로 시기를 붙일 수 없다.","a":"O","e":"신분관계의 명확성과 안정성 때문이다."},{"p":14,"q":"어음·수표행위에는 시기인 지급일을 붙이는 것도 허용되지 않는다.","a":"X","e":"어음·수표행위에는 조건은 원칙적으로 붙일 수 없지만 시기인 지급일은 가능하다."},{"p":14,"q":"기한 도래의 효과는 절대적으로 비소급이다.","a":"O","e":"기한은 도래 시점부터 효력이 발생·소멸하고 당사자 합의로도 소급효를 정할 수 없다."},{"p":14,"q":"기한 도래의 효과도 조건성취와 마찬가지로 당사자 약정에 의해 소급시킬 수 있다.","a":"X","e":"조건은 소급약정 가능, 기한은 절대적 비소급이다."},{"p":14,"q":"기한부 권리에도 조건부 권리의 침해금지와 처분 등에 관한 규정이 준용된다.","a":"O","e":"민법 제154조는 제148조·제149조를 기한부 권리에 준용한다."},{"p":14,"q":"기한의 이익이 누구를 위한 것인지 분명하지 않은 때에는 채무자를 위한 것으로 추정한다.","a":"O","e":"민법 제153조 제1항."},{"p":14,"q":"기한의 이익은 절대 포기할 수 없다.","a":"X","e":"기한의 이익은 포기할 수 있다. 다만 상대방의 이익을 해하지 못한다."},{"p":14,"q":"기한의 이익이 상대방을 위해서도 존재하는 경우 포기는 가능하지만 상대방 손해를 배상해야 한다.","a":"O","e":"예를 들어 이자부 소비대차에서 차주가 조기변제하면 대주의 이자 이익을 해할 수 있다."},{"p":14,"q":"기한이익의 포기에는 소급효가 없다.","a":"O","e":"포기는 그 기한이 도래한 것과 같은 효과를 장래적으로 발생시킬 뿐이다."},{"p":14,"q":"주채무자가 기한의 이익을 포기하면 그 효력은 보증인에게도 당연히 미친다.","a":"X","e":"주채무자의 기한이익 포기는 보증인에게 효력이 미치지 않는다."},{"p":14,"q":"무상임치에서는 원칙적으로 임치인에게 기한의 이익이 있다.","a":"O","e":"수치인이 보수를 받지 않는 무상임치에서는 임치인의 편익이 중심이다."},{"p":14,"q":"유상임치에서는 임치인과 수치인 쌍방에게 기한의 이익이 있다.","a":"O","e":"보관 기간 유지가 양쪽의 이익과 관련된다."},{"p":14,"q":"무이자 금전소비대차에서는 소비대주에게만 기한의 이익이 있다.","a":"X","e":"무이자 소비대차에서는 원칙적으로 소비차주에게 기한의 이익이 있다."},{"p":14,"q":"이자부 금전소비대차에서는 소비차주와 소비대주 쌍방에게 기한의 이익이 있다.","a":"O","e":"차주는 늦게 갚을 이익, 대주는 이자를 받을 이익이 있다."},{"p":14,"q":"사용대차에서는 사용차주에게 기한의 이익이 있다.","a":"O","e":"무상으로 사용·수익하는 차주의 이익이 중심이다."},{"p":14,"q":"임대차에서는 임대인과 임차인 쌍방에게 기한의 이익이 있다.","a":"O","e":"임차인은 사용수익, 임대인은 차임수령의 이익이 있다."},{"p":14,"q":"채무자가 담보제공의무를 이행하지 아니하면 기한이익 상실사유가 된다.","a":"O","e":"민법상 기한이익 상실사유 중 하나다."},{"p":14,"q":"채무자가 담보를 손상·감소·멸실하게 한 때에도 기한이익 상실사유가 된다.","a":"O","e":"인적담보와 물적담보 모두 포함된다."},{"p":14,"q":"채무자가 파산한 경우에도 기한이익 상실사유가 된다.","a":"O","e":"채권자 보호를 위해 즉시 이행청구가 가능해진다."},{"p":14,"q":"기한이익 상실사유가 발생하면 언제나 자동으로 기한이 도래한 것으로 간주된다.","a":"X","e":"상실사유 발생만으로 곧바로 기한 도래가 간주되는 것이 아니라 채권자에게 즉시 이행청구권이 생긴다."},{"p":14,"q":"기한이익 상실사유가 발생한 경우 채권자는 즉시 청구할 수도 있고 본래 기한까지 기다릴 수도 있다.","a":"O","e":"청구 시기는 채권자가 선택할 수 있다."},{"p":14,"q":"기한이익 상실사유 발생 후 채권자가 즉시 이행을 청구하면 채무자는 기한이 남아 있음을 들어 거절할 수 없다.","a":"O","e":"채무자는 기한의 이익을 주장하지 못하고 이행할 의무가 발생한다."},{"p":14,"q":"기한이익 상실특약은 특별히 정지조건부 상실특약으로 정하지 않은 한 형성권부 상실특약으로 추정하는 것이 타당하다.","a":"O","e":"자료는 기한이익 상실사유가 채권자를 위한 것이므로 형성권부 상실특약으로 추정한다고 정리한다."},{"p":14,"q":"조건과 기한은 모두 장래 사실에 관한 부관이라는 점에서는 같지만, 조건은 도래 불확실, 기한은 도래 확실이라는 점에서 다르다.","a":"O","e":"가장 기본 비교 포인트다."},{"p":14,"q":"조건성취의 효력과 기한도래의 효력은 모두 강행적으로 비소급이다.","a":"X","e":"조건성취는 임의규정으로 소급약정 가능, 기한도래는 절대적 비소급이다."},{"p":14,"q":"조건부 권리와 기한부 권리는 모두 성취·도래 전에도 일정한 보호를 받는다.","a":"O","e":"조건부 권리 보호 규정이 기한부 권리에도 준용된다."},{"p":14,"q":"조건은 이미 성취했거나 이미 불능인 경우에도 언제나 조건 없는 법률행위로 된다.","a":"X","e":"기성정지와 불능해제는 조건 없는 법률행위가 되지만, 기성해제와 불능정지는 무효다."},{"p":14,"q":"조건성취의 효과를 당사자가 소급시키기로 약정하더라도 그 소급효는 제3자의 권리를 해하지 못한다.","a":"O","e":"조건의 소급약정 한계다."},{"p":14,"q":"기한이익 상실사유의 발생은 채권자에게 즉시 이행청구권을 줄 뿐, 반드시 채권자가 즉시 청구해야 하는 것은 아니다.","a":"O","e":"채권자는 즉시 청구하거나 기한까지 기다릴 수 있다."},{"p":14,"q":"기한이익의 포기는 상대방의 이익을 해하지 않는 범위에서 가능하고, 상대방에게 손해가 있으면 배상 문제가 생길 수 있다.","a":"O","e":"포기 가능성과 상대방 이익 보호를 함께 잡아야 한다."},{"p":14,"q":"상대방이 결정할 수 있는 사실을 조건으로 하는 단독행위는 예외적으로 조건을 붙일 수 있다.","a":"O","e":"정지조건부 계약해제 예시가 대표적이다."},{"p":14,"q":"조건부 권리 침해 후 조건이 성취되면 조건부 권리자는 대항요건 없이 언제나 제3자에게 대항할 수 있다.","a":"X","e":"제3자에게 대항하려면 조건부 권리를 보호할 대항요건을 갖추어야 한다."},{"p":14,"q":"법정조건은 당사자의 의사에 의한 부관은 아니지만 성질에 반하지 않는 범위에서 조건 규정의 유추 적용이 가능하다.","a":"O","e":"법정조건의 이중 포인트다."},{"p":15,"q":"물권은 특정한 물건을 직접 지배하여 이익을 얻는 배타적 권리이다.","a":"O","e":"물권은 물건에 대한 직접적·배타적 지배권이고, 대세권·절대권으로 설명된다."},{"p":15,"q":"물권은 특정 상대방에게 일정한 행위를 청구하는 권리라는 점에서 채권과 본질적으로 같다.","a":"X","e":"채권은 특정인에 대한 급부청구권이고, 물권은 물건에 대한 직접·배타적 지배권이다."},{"p":15,"q":"물권은 대세권이므로 누구에게나 주장할 수 있고, 채권은 원칙적으로 특정 상대방에게만 주장할 수 있다.","a":"O","e":"물권의 절대성·대세성과 채권의 상대성을 구별해야 한다."},{"p":15,"q":"물권의 객체는 원칙적으로 물건이어야 하며, 독립성·특정성·현존성을 갖추어야 한다.","a":"O","e":"물권의 객체는 독립한 특정 현존 물건이 원칙이다."},{"p":15,"q":"물권의 객체는 장래 생길 물건이어도 언제나 가능하므로 현존성이 필요하지 않다.","a":"X","e":"물권의 객체는 원칙적으로 현존해야 한다. 장래물은 채권계약의 대상은 될 수 있어도 현재 물권의 객체가 되기는 어렵다."},{"p":15,"q":"권리는 원칙적으로 물권의 객체가 아니지만, 지상권·전세권은 저당권의 객체가 될 수 있다.","a":"O","e":"권리가 예외적으로 물권의 객체가 되는 사례가 있다. 지상권·전세권은 저당권의 객체가 된다."},{"p":15,"q":"채권은 재산적 가치가 있으므로 소유권의 객체가 될 수 있다.","a":"X","e":"소유권의 객체는 물건이다. 채권은 재산권이지만 소유권의 객체가 아니다."},{"p":15,"q":"물권법은 물권법정주의와 배타적 지배관계 때문에 대부분 강행규정으로 구성된다.","a":"O","e":"물권법은 원칙적으로 강행규정이 많다."},{"p":15,"q":"물권법 규정은 예외 없이 모두 강행규정이다.","a":"X","e":"모든 물권법 규정이 강행규정은 아니다. 상린관계규정이나 유치권규정은 대표적 임의규정으로 설명된다."},{"p":15,"q":"상린관계규정과 유치권규정은 물권법 규정 중 대표적인 임의규정으로 볼 수 있다.","a":"O","e":"물권법이라고 전부 강행규정은 아니다."},{"p":15,"q":"물권은 양도성이 있는 것이 원칙이나, 권리의 성질상 양도성이 제한되는 경우도 있다.","a":"O","e":"물권은 재산권이므로 양도성이 원칙이나 법률상·성질상 제한이 가능하다."},{"p":15,"q":"물권은 제한물권이 소멸하면 소유권이 원래의 완전한 모습으로 회복되는 탄력성을 가진다.","a":"O","e":"소유권의 탄력성은 제한물권 소멸 시 원만한 지배권으로 회복되는 성질이다."},{"p":15,"q":"일물일권주의란 독립성을 갖춘 하나의 물건에는 하나의 물권만이 성립할 수 있다는 원칙이다.","a":"O","e":"물권의 배타성에서 나오는 원칙이다."},{"p":15,"q":"일물일권주의에 따라 하나의 물건 위에는 내용이 서로 다른 물권도 동시에 성립할 수 없다.","a":"X","e":"하나의 물건 위에 소유권과 저당권, 지상권 등 내용이 다른 물권은 동시에 성립할 수 있다. 금지되는 것은 동일 내용의 양립이다."},{"p":15,"q":"하나의 토지 위에 소유권과 저당권이 동시에 성립하는 것은 일물일권주의에 반하지 않는다.","a":"O","e":"소유권과 저당권은 내용이 서로 다르므로 병존 가능하다."},{"p":15,"q":"동일한 하나의 물건 위에 동일한 내용의 소유권이 2개 독립하여 동시에 성립할 수 있다.","a":"X","e":"동일물 위에 같은 내용의 물권이 독립적으로 중복 성립하는 것은 물권의 배타성에 반한다."},{"p":15,"q":"하나의 물건 중 일부에 대하여 분할절차 없이 독립한 물권이 성립하는 것이 원칙이다.","a":"X","e":"물건의 일부나 구성부분은 독립성이 없으면 독립한 물권의 객체가 되지 못한다."},{"p":15,"q":"토지의 일부라도 분필등기 등으로 독립성을 갖추면 독립한 물권의 객체가 될 수 있다.","a":"O","e":"분할절차로 독립성이 확보되면 별개의 물권 객체가 된다."},{"p":15,"q":"건물의 일부는 언제나 독립한 물권의 객체가 될 수 없다.","a":"X","e":"구분소유 요건을 갖춘 전유부분은 독립한 물권의 객체가 될 수 있다."},{"p":15,"q":"여러 개의 물건이나 집합물은 특별한 경우를 제외하고 그 전체를 하나의 물권 객체로 삼을 수 없다.","a":"O","e":"원칙적으로 물건 수만큼 물권이 성립한다."},{"p":15,"q":"공장재단·광업재단은 여러 물건의 집합체라도 법률상 하나의 부동산으로 취급될 수 있는 예외이다.","a":"O","e":"일물일권주의의 예외적 완화 사례다."},{"p":15,"q":"일물일권주의는 물권의 객체가 특정되고 공시될 수 있어야 한다는 요청과 관련된다.","a":"O","e":"객체 특정성과 공시 가능성이 핵심 배경이다."},{"p":15,"q":"일물일권주의 때문에 공유는 허용되지 않는다.","a":"X","e":"공유는 하나의 소유권을 여러 사람이 지분으로 공동귀속하는 것이므로 일물일권주의에 반하지 않는다."},{"p":15,"q":"동산의 일부는 원칙적으로 독립한 물권의 객체가 되지 못한다.","a":"O","e":"분리되어 독립성을 갖기 전에는 구성부분이다."},{"p":15,"q":"민법 제185조는 물권은 법률 또는 관습법에 의하는 외에는 임의로 창설하지 못한다고 규정한다.","a":"O","e":"물권법정주의의 조문이다."},{"p":15,"q":"물권법정주의에서 법률은 명령·규칙도 포함하는 넓은 의미의 법규명령을 말한다.","a":"X","e":"제185조의 법률은 형식적 의미의 법률을 의미한다."},{"p":15,"q":"관습법도 물권을 창설할 수 있는 근거가 될 수 있다.","a":"O","e":"제185조는 법률뿐 아니라 관습법도 물권의 근거로 인정한다."},{"p":15,"q":"당사자는 법률상 인정되는 물권의 종류 안에서 그 내용을 법률과 다르게 자유롭게 정할 수 있다.","a":"X","e":"물권법정주의는 종류강제뿐 아니라 내용강제도 포함한다."},{"p":15,"q":"물권법정주의는 새로운 종류의 물권을 임의로 만들 수 없다는 종류강제를 포함한다.","a":"O","e":"법률 또는 관습법이 인정하지 않는 물권을 당사자가 창설할 수 없다."},{"p":15,"q":"물권법정주의는 법률상 인정된 물권이라도 그 내용을 법률과 관습법이 정한 내용과 다르게 할 수 없다는 내용강제를 포함한다.","a":"O","e":"내용강제도 시험 함정이다."},{"p":15,"q":"물권법정주의 위반 법률행위는 원칙적으로 유효이고, 당사자 사이에서만 효력이 없다.","a":"X","e":"제185조는 강행규정이므로 위반 법률행위는 무효이다."},{"p":15,"q":"법률 또는 관습법에 없는 새로운 물권을 설정하는 계약은 원칙적으로 무효이다.","a":"O","e":"종류강제 위반이다."},{"p":15,"q":"법률상 인정되는 물권의 내용 일부만 법정 내용과 다르게 정한 경우에는 그 위반부분만 무효로 볼 여지가 있다.","a":"O","e":"종류강제 위반은 전부 무효, 내용강제 위반은 위반부분 무효로 설명된다."},{"p":15,"q":"물권법정주의는 거래안전과 공시제도의 명확성을 확보하려는 기능을 가진다.","a":"O","e":"물권은 제3자에게 영향을 미치므로 종류·내용이 명확해야 한다."},{"p":15,"q":"양도담보는 민법전에 명문 규정이 없으므로 판례상 물권법정주의에 반하여 전면 무효이다.","a":"X","e":"양도담보는 판례상 담보목적의 소유권이전 형식으로 유효성이 인정된다."},{"p":15,"q":"분묘기지권은 관습법상 인정되는 물권의 예로 설명된다.","a":"O","e":"관습법에 의한 물권의 대표 예시다."},{"p":15,"q":"관습법상 법정지상권은 관습법에 의한 물권 또는 물권적 지위의 예로 설명된다.","a":"O","e":"법률상 법정지상권과 구별되는 관습법상 법정지상권을 기억한다."},{"p":15,"q":"온천권은 관습법상 독립한 물권으로 일반적으로 인정된다.","a":"X","e":"온천수 이용 관련 권리는 독립한 관습법상 물권으로 쉽게 인정되지 않는다."},{"p":15,"q":"사도통행권은 소유권에 대한 제한이나 채권적 이용관계로 설명될 수 있을 뿐, 언제나 독립한 물권으로 인정되는 것은 아니다.","a":"O","e":"독립한 물권인지 여부를 함부로 인정하면 안 된다."},{"p":15,"q":"물권법정주의에 반하는 약정은 채권적 약정으로도 절대 아무런 의미가 없다.","a":"X","e":"물권으로서 효력은 부정되어도 당사자 사이 채권적 효력으로 평가될 여지는 사안에 따라 있다."},{"p":15,"q":"민법상 물권은 점유권·소유권·용익물권·담보물권으로 나눌 수 있다.","a":"O","e":"물권의 큰 분류다."},{"p":15,"q":"점유권은 물건을 사실상 지배하는 상태를 보호하는 물권이다.","a":"O","e":"점유권은 본권과 별도로 사실상 지배상태를 보호한다."},{"p":15,"q":"점유권은 본권이 없으면 성립하지 않는다.","a":"X","e":"점유권은 본권이 없어도 사실상 지배가 있으면 인정된다."},{"p":15,"q":"소유권은 물건을 사용·수익·처분할 수 있는 포괄적 지배권이다.","a":"O","e":"소유권은 전면적·포괄적 물권이다."},{"p":15,"q":"소유권은 제한물권의 부담을 받을 수 없으므로 제한물권이 설정되면 소유권은 소멸한다.","a":"X","e":"제한물권은 소유권의 일부 권능을 제한할 뿐 소유권을 소멸시키지 않는다."},{"p":15,"q":"용익물권에는 지상권·지역권·전세권이 포함된다.","a":"O","e":"타인의 물건을 사용·수익하는 물권이다."},{"p":15,"q":"담보물권에는 유치권·질권·저당권이 포함된다.","a":"O","e":"채권담보를 목적으로 하는 물권이다."},{"p":15,"q":"전세권은 용익물권적 성격만 있고 담보물권적 성격은 전혀 없다.","a":"X","e":"전세권은 사용·수익권이면서 전세금반환채권 확보를 위한 담보물권적 성격도 가진다."},{"p":15,"q":"유치권은 법정담보물권이다.","a":"O","e":"유치권은 당사자 설정계약이 아니라 법률상 요건 충족으로 성립한다."},{"p":15,"q":"질권과 저당권은 약정담보물권이다.","a":"O","e":"질권·저당권은 설정계약에 의해 성립하는 약정담보물권이다."},{"p":15,"q":"지역권과 저당권은 목적물의 배타적 점유를 내용으로 하는 물권이다.","a":"X","e":"지역권과 저당권은 배타적 점유를 내용으로 하지 않는다."},{"p":15,"q":"지상권자는 타인의 토지에 건물 기타 공작물이나 수목을 소유하기 위하여 그 토지를 사용할 수 있다.","a":"O","e":"지상권의 기본 내용이다."},{"p":15,"q":"지역권은 요역지의 편익을 위하여 승역지를 일정하게 이용하는 물권이다.","a":"O","e":"두 토지 관계를 전제로 하는 용익물권이다."},{"p":15,"q":"전세권은 전세금을 지급하고 타인의 부동산을 사용·수익하는 물권이다.","a":"O","e":"
