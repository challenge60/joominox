":"주식배당금과 특허권사용료는 권리의 사용대가이므로 민법상 법정과실에 해당한다.","a":"X","e":"자료는 주식배당금, 특허권사용료 등을 법정과실이 아닌 것으로 정리한다."},{"p":6,"q":"지연이자는 금전 사용대가이므로 법정과실에 해당한다.","a":"X","e":"지연이자는 채무불이행에 대한 손해배상 성격이므로 법정과실이 아니다."},{"p":6,"q":"국립공원 입장료는 원물의 사용대가로서 법정과실이다.","a":"X","e":"자료는 국립공원의 입장료를 법정과실이 아닌 예로 정리한다."},{"p":6,"q":"유치권자와 질권자는 수취한 과실을 채무변제에 충당할 수 있다.","a":"O","e":"유치권자와 질권자는 과실을 수취한 경우 이를 채무변제에 충당할 수 있다."},{"p":6,"q":"저당권자는 저당권 설정만으로 저당물의 과실수취권을 취득한다.","a":"X","e":"저당권자는 저당물에 대한 과실수취권이 없다. 압류 후 과실에 저당권 효력이 미치는 것과 구별해야 한다."},{"p":6,"q":"저당권자가 저당부동산에서 발생한 과실을 압류 후에도 제3취득자에게 언제나 통지 없이 대항할 수 있다.","a":"X","e":"제3취득자에게 대항하려면 압류 사실을 통지해야 한다."},{"p":6,"q":"부합물은 한 물건이 다른 물건과 결합하여 독립성을 잃은 것이고, 종물은 독립성을 유지하면서 주물의 효용을 돕는 물건이다.","a":"O","e":"부합과 종물의 핵심 차이는 독립성이다. 부속은 떼어낼 수 있고, 부합은 한 덩어리가 된다는 이미지로 기억한다."},{"p":6,"q":"부속물과 부합물은 항상 같은 개념이므로 구별할 실익이 없다.","a":"X","e":"부속물 중 독립한 물건이면 종물이 될 수 있고, 독립성을 잃으면 부합물이 된다. 효과가 달라진다."},{"p":6,"q":"건물은 토지와 별개의 독립 부동산이므로 토지소유권의 객체와 건물소유권의 객체는 분리될 수 있다.","a":"O","e":"우리 민법은 토지와 건물을 별개의 부동산으로 본다."},{"p":6,"q":"동산에는 임차권 같은 채권적 이용관계도 절대 성립할 수 없다.","a":"X","e":"동산은 용익물권의 객체는 아니지만 임차권 같은 채권적 이용관계는 가능하다."},{"p":6,"q":"물건 파트에서 '언제나', '당연히', '절대'라는 표현은 건물 독립성, 종물 요건, 과실 귀속에서 함정으로 자주 쓰인다.","a":"O","e":"주택관리사 OX에서는 단정 표현을 통해 예외와 기준을 묻는다. '언제나'가 나오면 기준을 확인해야 한다."},{"p":6,"q":"종물은 주물의 처분에 따른다는 법리는 과실 귀속 문제에도 그대로 적용된다.","a":"X","e":"주물·종물 법리와 원물·과실 법리는 구별해야 한다. 과실은 분리시기, 존속기간, 수취권자 기준이 따로 있다."},{"p":6,"q":"저당권 효력에서 종물·부합물은 설정 전후를 불문하고 문제되지만, 과실은 압류 후라는 별도 기준이 중요하다.","a":"O","e":"저당권 효력의 대표 비교다. 부합물·종물은 전후 불문, 과실은 압류 후."},{"p":6,"q":"선의의 점유자가 취득할 수 있는 과실에는 천연과실뿐 아니라 법정과실과 사용이익도 포함될 수 있다.","a":"O","e":"점유자의 과실취득에서 과실은 천연과실, 법정과실, 사용이익까지 포함해서 정리한다."},{"p":6,"q":"원물과 과실 관계에서는 과실이 원물로부터 분리된 뒤에도 언제나 원물 소유자에게만 귀속된다.","a":"X","e":"천연과실은 분리 시 수취권자에게 귀속한다. 수취권자는 소유자만이 아니라 사용수익권자, 선의점유자 등이 될 수 있다."},{"p":7,"q":"법률행위의 목적은 확정성, 가능성, 적법성, 사회적 타당성을 갖추어야 한다.","a":"O","e":"법률행위 목적의 유효요건은 확정성·가능성·적법성·사회적 타당성이다."},{"p":7,"q":"법률행위의 목적과 목적물은 같은 개념이므로, 목적물이 없으면 언제나 법률행위는 불성립한다.","a":"X","e":"목적과 목적물은 구별된다. 목적이 없으면 불성립·부존재가 되지만, 목적물이 없더라도 목적이 특정 가능하면 효력 문제가 별도로 판단된다."},{"p":7,"q":"법률행위의 목적은 계약 체결 당시 반드시 구체적으로 확정되어 있어야 한다.","a":"X","e":"체결 당시 구체적 확정까지는 필요 없고, 사후 확정할 기준·방법이 있으면 충분하다."},{"p":7,"q":"매매계약에서 목적물과 대금은 사후에라도 특정할 수 있는 방법과 기준이 정해져 있으면 족하다.","a":"O","e":"매매 목적물·대금은 체결 당시 세부 특정이 없더라도 사후 특정 가능성이 있으면 확정성이 인정된다."},{"p":7,"q":"법률행위의 목적이 확정 불가능한 경우 그 법률행위는 무효가 된다.","a":"O","e":"목적의 확정 가능성이 없으면 법률효과를 부여할 수 없어 무효가 된다."},{"p":7,"q":"목적이 없는 법률행위는 무효가 아니라 불성립 또는 부존재로 보는 것이 원칙이다.","a":"O","e":"목적 자체가 없으면 법률행위의 성립요소가 빠진 것이므로 불성립·부존재 문제다."},{"p":7,"q":"법률행위의 목적이 불명확하더라도 당사자의 의사, 거래관행, 보충해석으로 특정 가능하면 곧바로 무효는 아니다.","a":"O","e":"확정성은 구체적 특정 그 자체보다 특정 가능성이 핵심이다."},{"p":7,"q":"목적의 확정성은 법률행위 성립 시점이 아니라 효력 발생 시점까지 갖추면 충분한 경우가 있다.","a":"O","e":"장래 확정될 수 있는 기준과 방법이 있으면 효력 발생 단계에서 확정되어도 된다."},{"p":7,"q":"법률행위의 목적이 가능한지 여부는 사회통념에 따라 판단한다.","a":"O","e":"가능성은 물리적·법률적 실현 가능성을 사회통념에 따라 판단한다."},{"p":7,"q":"법률행위 목적이 일부만 불가능한 경우에도 언제나 법률행위 전부가 무효이다.","a":"X","e":"일부 불능의 효과는 그 부분이 본질적인지, 나머지만으로 법률행위를 유지할 수 있는지에 따라 달라질 수 있다. '언제나 전부 무효'는 위험 표현이다."},{"p":7,"q":"법률행위의 목적이 원시적 불능이면 그 법률행위는 무효이다.","a":"O","e":"계약 체결 당시부터 이행이 불가능하면 원시적 불능으로 무효가 된다."},{"p":7,"q":"후발적 불능은 법률행위의 성립 당시부터 불가능한 경우를 말한다.","a":"X","e":"후발적 불능은 성립 후에 이행이 불가능하게 된 경우다. 성립 당시부터 불가능하면 원시적 불능이다."},{"p":7,"q":"후발적 불능은 원칙적으로 법률행위의 무효 문제가 아니라 채무불이행 또는 위험부담 문제가 된다.","a":"O","e":"계약은 일단 유효하게 성립하고, 이후 불능이 생기면 귀책사유 유무에 따라 채무불이행·위험부담으로 처리한다."},{"p":7,"q":"원시적 불능인 계약이라도 언제나 손해배상책임은 발생하지 않는다.","a":"X","e":"원시적 불능으로 계약은 무효이나, 불능을 알았거나 알 수 있었던 자에게 계약체결상 과실책임이 문제될 수 있다."},{"p":7,"q":"계약체결상의 과실책임은 원시적 불능을 알았거나 알 수 있었던 자에게 인정될 수 있다.","a":"O","e":"상대방이 선의·무과실로 계약의 유효를 믿은 경우 신뢰이익 배상이 문제된다."},{"p":7,"q":"계약체결상의 과실책임에서 상대방은 불능에 관하여 선의·무과실이어야 한다.","a":"O","e":"상대방도 불능을 알았거나 과실로 몰랐다면 보호할 필요가 줄어든다."},{"p":7,"q":"계약체결상의 과실책임의 배상범위는 이행이익이다.","a":"X","e":"배상범위는 신뢰이익이 원칙이며, 신뢰이익은 이행이익을 초과하지 못한다."},{"p":7,"q":"계약체결상의 과실책임에서 신뢰이익은 이행이익을 초과할 수 없다.","a":"O","e":"유효하다고 믿어 지출한 비용 등을 배상하지만, 계약이 이행되었을 때의 이익을 넘어설 수는 없다."},{"p":7,"q":"이미 멸실한 건물을 매매목적물로 한 계약은 원칙적으로 원시적 불능으로 무효가 될 수 있다.","a":"O","e":"계약 당시 목적물이 존재하지 않아 이행할 수 없으면 원시적 불능이다."},{"p":7,"q":"매매 후 목적물이 제3자에게 이전되어 매도인이 이전등기를 할 수 없게 되면 원칙적으로 후발적 불능 문제가 된다.","a":"O","e":"계약 당시 가능했으나 이후 이행불능이 된 경우이므로 후발적 불능이다."},{"p":7,"q":"제2매수인이 적극가담하지 않은 이중매매에서 제2매수인이 소유권을 취득하면 제1매매는 매도인의 후발적 불능 문제가 될 수 있다.","a":"O","e":"제2매매가 유효라면 제1매수인에게는 매도인의 귀책 있는 후발적 불능에 따른 해제·손해배상이 문제된다."},{"p":7,"q":"법률행위의 목적이 적법하다는 것은 강행법규에 위반하지 않는다는 의미이다.","a":"O","e":"목적의 적법성은 강행법규 위반 여부로 판단한다."},{"p":7,"q":"강행법규를 위반한 법률행위는 원칙적으로 무효이다.","a":"O","e":"강행법규 위반의 효과는 원칙적으로 사법상 무효다."},{"p":7,"q":"민법상 강행규정은 원칙적으로 효력규정이다.","a":"O","e":"민법의 강행규정은 위반 시 사법상 효력이 부정되는 효력규정으로 이해한다."},{"p":7,"q":"강행법규를 위반한 자가 스스로 무효를 주장하는 것은 언제나 신의칙 위반이다.","a":"X","e":"강행법규 위반 무효를 스스로 주장해도 원칙적으로 신의칙 위반이 아니다."},{"p":7,"q":"신의칙을 적용한 결과 개별 강행규정을 위반하게 된다면 신의칙은 적용되지 않는다.","a":"O","e":"개별 강행규정이 일반 강행규정인 신의칙보다 우선한다."},{"p":7,"q":"효력규정을 위반한 법률행위는 무효이다.","a":"O","e":"효력규정은 사법상 효력 자체를 부정하기 위한 규정이다."},{"p":7,"q":"단속규정을 위반한 법률행위는 원칙적으로 처벌될 뿐 사법상 효력은 유효이다.","a":"O","e":"단속규정은 행정상·형사상 제재를 목적으로 하므로 원칙적으로 사법상 효력은 유지된다."},{"p":7,"q":"단속규정 위반은 언제나 처벌도 없고 사법상 효력도 없다.","a":"X","e":"단속규정은 위반자에게 제재가 있을 수 있으나 법률행위 효력은 원칙적으로 유효다."},{"p":7,"q":"효력규정과 단속규정의 구별은 조문의 문언뿐 아니라 입법취지와 보호법익을 고려한다.","a":"O","e":"위반행위의 사법상 효력을 부정하려는 취지인지가 핵심이다."},{"p":7,"q":"토지거래허가구역 내 토지거래허가규정은 효력규정으로 본다.","a":"O","e":"허가를 요하는 거래는 허가 없이는 확정적으로 효력이 발생하지 않는 구조다."},{"p":7,"q":"공인중개사법상 중개수수료 제한규정을 초과한 수수료 약정은 유효이다.","a":"X","e":"제한 한도를 초과하는 중개수수료 약정은 효력규정 위반으로 무효로 정리한다."},{"p":7,"q":"임대주택법상 임대주택의 임대의무기간에 관한 규정은 효력규정으로 정리된다.","a":"O","e":"자료상 효력규정 예시로 정리된다."},{"p":7,"q":"부동산등기특별조치법상 중간생략등기 금지규정은 단속규정이다.","a":"O","e":"그 위반만으로 이미 마쳐진 등기의 사법상 효력이 당연히 부정되지는 않는다."},{"p":7,"q":"중간생략등기 금지규정 위반으로 이미 경료된 등기는 언제나 무효이다.","a":"X","e":"일반 중간생략등기는 단속규정 위반에 그치므로 이미 등기가 경료되고 실체관계에 부합하면 유효할 수 있다."},{"p":7,"q":"토지거래허가구역에서 허가규정을 잠탈할 목적으로 한 중간생략등기는 무효이다.","a":"O","e":"이는 단순 중간생략 문제가 아니라 효력규정인 토지거래허가규정을 잠탈하는 행위다."},{"p":7,"q":"국유재산 담당공무원이 타인 명의로 국유재산을 취득하는 행위는 탈법행위로 무효가 될 수 있다.","a":"O","e":"강행규정을 우회적으로 위반한 탈법행위는 무효가 된다."},{"p":7,"q":"강행규정을 정면으로 위반하지 않고 우회적으로 위반한 경우에는 언제나 유효이다.","a":"X","e":"우회적·간접적으로 강행규정을 잠탈하는 탈법행위는 무효다."},{"p":7,"q":"공무원연금법상 연금수급권의 사적 담보 금지규정을 위반한 담보제공행위는 무효로 볼 수 있다.","a":"O","e":"자료상 탈법·강행규정 위반 예시로 정리된다."},{"p":7,"q":"주택법상 국민주택 전매제한규정은 단속규정 예시로 정리된다.","a":"O","e":"자료상 단속규정 예시로 정리된다. 다만 개별 특별법의 변화는 별도 확인이 필요하나 시험자료 기준으로는 단속규정 포인트다."},{"p":7,"q":"법률행위 목적의 사회적 타당성은 민법 제103조와 제104조에서 주로 문제된다.","a":"O","e":"제103조 반사회질서 법률행위, 제104조 불공정한 법률행위가 핵심이다."},{"p":7,"q":"반사회질서 법률행위는 선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위이다.","a":"O","e":"민법 제103조의 정의 그대로다."},{"p":7,"q":"반사회질서 법률행위는 취소할 수 있는 법률행위이다.","a":"X","e":"제103조 위반은 무효이지 취소가 아니다."},{"p":7,"q":"반사회질서 법률행위의 무효는 절대적 무효로서 선의의 제3자에게도 대항할 수 있다.","a":"O","e":"제103조 무효는 절대적 무효로 정리된다."},{"p":7,"q":"반사회질서 법률행위는 당사자가 추인하면 유효가 된다.","a":"X","e":"반사회질서 행위는 추인으로 유효하게 할 수 없다."},{"p":7,"q":"반사회질서 법률행위는 무효행위의 전환도 원칙적으로 인정되지 않는다.","a":"O","e":"사회질서 위반이라는 중대한 하자 때문에 전환도 제한된다."},{"p":7,"q":"범죄를 하지 않을 조건으로 급부하기로 한 약정은 반사회질서 법률행위가 될 수 있다.","a":"O","e":"범죄 억지라는 외형이 있어도 금전적 대가가 결부되면 사회질서 위반으로 평가될 수 있다."},{"p":7,"q":"직업선택의 자유를 과도하게 제한하는 계약은 무효가 될 수 있다.","a":"O","e":"개인의 자유를 심하게 제한하는 행위는 제103조 위반이 될 수 있다."},{"p":7,"q":"정당한 범위 내의 경업금지 약정은 언제나 반사회질서 법률행위로 무효이다.","a":"X","e":"과도한 제한은 무효이나, 정당한 범위 내 경업제한은 유효할 수 있다."},{"p":7,"q":"해외파견 근로자가 귀국 후 일정 기간 근무하도록 하는 사규나 근로계약은 언제나 무효이다.","a":"X","e":"일정한 합리성이 있으면 유효할 수 있다. '언제나'가 틀림."},{"p":7,"q":"부정행위를 용서받는 대가로 배우자에게 부동산을 증여하고 부부관계 유지 중 처분을 제한한 약정은 유효할 수 있다.","a":"O","e":"가정 유지·손해배상 취지의 약정으로 사회질서 위반이 아니라고 본다."},{"p":7,"q":"반사회적 조건이 붙은 경우에는 조건만 무효이고 법률행위 본체는 언제나 유효이다.","a":"X","e":"불법조건은 조건만 분리하지 않고 법률행위 전부를 무효로 하는 경우가 원칙적이다."},{"p":7,"q":"동기의 불법은 원칙적으로 법률행위의 효력에 영향을 미치지 않는다.","a":"O","e":"동기 자체는 법률행위의 내용이 아니므로 원칙적으로 무효 원인이 아니다."},{"p":7,"q":"반사회적 동기가 표시되거나 상대방에게 알려지고 상대방도 그 동기에 좇아 법률행위를 한 경우 무효가 될 수 있다.","a":"O","e":"동기가 법률행위 내용화되거나 상대방이 알고 동조하면 제103조 위반이 문제된다."},{"p":7,"q":"반사회적 동기가 마음속에만 머문 경우에도 언제나 제103조 무효이다.","a":"X","e":"내심의 불법 동기만으로는 원칙적으로 법률행위가 무효가 되지 않는다."},{"p":7,"q":"보험사고를 가장하여 보험금을 탈 목적으로 생명보험계약을 체결한 경우 무효이다.","a":"O","e":"처음부터 보험금을 편취할 목적이면 반사회질서 행위로 무효다."},{"p":7,"q":"성행위의 대가로 금품을 지급하기로 하는 약정은 반사회질서 법률행위로 무효가 될 수 있다.","a":"O","e":"자료상 반사회질서 행위로서 무효인 판례 예시다."},{"p":7,"q":"사용자가 노조간부에게 임금인상요구를 무마해 달라는 대가로 금전을 지급하기로 한 약정은 유효이다.","a":"X","e":"노동조합 활동의 공정성을 해치는 금전대가 약정으로 반사회질서 법률행위에 해당한다."},{"p":7,"q":"민사사건에서 변호사의 성공보수약정은 언제나 무효이다.","a":"X","e":"민사사건 성공보수약정은 원칙적으로 무효라고 할 수 없다. 다만 형사사건 성공보수약정은 반사회성으로 무효로 본다."},{"p":7,"q":"형사사건 변호에 관한 성공보수약정은 금전적 대가가 결부되어 반사회질서 법률행위로 무효이다.","a":"O","e":"형사사법 절차의 공정성·염결성을 해칠 위험 때문에 무효로 정리한다."},{"p":7,"q":"허위 진술을 하고 그 대가로 급부를 받기로 한 약정은 반사회질서 법률행위로 무효이다.","a":"O","e":"수사기관 등에서 허위 진술을 대가로 하는 약정은 사회질서에 반한다."},{"p":7,"q":"첩계약 및 부첩관계 유지를 목적으로 한 급부약정은 무효이다.","a":"O","e":"인륜에 반하는 행위로 제103조 위반이다."},{"p":7,"q":"첩관계를 단절하는 조건으로 위자료를 지급하기로 한 약정은 유효할 수 있다.","a":"O","e":"부첩관계 유지가 아니라 종료를 목적으로 하므로 유효로 본다."},{"p":7,"q":"첩관계 유지를 목적으로 한 증여가 이미 이행된 경우, 증여자는 원칙적으로 반환을 청구할 수 있다.","a":"X","e":"불법원인급여에 해당하여 원칙적으로 반환청구가 제한된다."},{"p":7,"q":"도박채무 부담행위와 그 변제약정은 반사회질서 법률행위로 무효이다.","a":"O","e":"도박채무 및 변제약정은 제103조 위반으로 무효다."},{"p":7,"q":"도박채무를 담보하기 위한 담보제공행위는 유효이다.","a":"X","e":"도박채무 변제를 확보하기 위한 담보제공도 반사회질서 법률행위로 무효다."},{"p":7,"q":"도박채무 변제를 위하여 도박채권자에게 부동산 처분대리권을 수여한 행위는 당연히 무효이다.","a":"X","e":"도박채무·담보는 무효이나, 부동산 처분에 관한 대리권 수여행위 자체는 유효로 정리한다."},{"p":7,"q":"공무원의 직무에 관하여 특별한 청탁을 하고 그 대가로 금전을 지급하기로 한 약정은 무효이다.","a":"O","e":"공무집행의 공정성을 해치는 행위로 제103조 위반이다."},{"p":7,"q":"공무원 청탁 대가로 이미 지급한 금전은 원칙적으로 불법원인급여로 반환청구할 수 없다.","a":"O","e":"급여자에게도 불법원인이 있으므로 제746조 본문에 따라 반환청구가 제한된다."},{"p":7,"q":"강제집행을 면탈할 목적으로 한 허위양도는 언제나 제103조 반사회질서 무효로만 처리된다.","a":"X","e":"보통 통정허위표시(제108조) 문제가 중심이다. '언제나 제103조'는 틀림."},{"p":7,"q":"제2매수인이 매도인의 배임행위에 적극가담한 이중매매는 반사회질서 법률행위로 무효이다.","a":"O","e":"제2매수인의 적극가담이 있으면 제2매매는 제103조 위반으로 무효다."},{"p":7,"q":"단순히 제2매수인이 먼저 등기했다는 사정만으로 제2매매가 반사회질서 법률행위가 되는 것은 아니다.","a":"O","e":"적극가담이 필요하다. 단순 악의 또는 선등기만으로 부족할 수 있다."},{"p":7,"q":"제2매매가 제103조 위반으로 무효인 경우, 제1매수인은 매도인을 대위하여 제2매수인 명의의 등기말소를 구할 수 있다.","a":"O","e":"제2매매가 무효이면 매도인의 말소청구권을 대위 행사하고, 자기에게 이전등기를 청구하는 구조가 가능하다."},{"p":7,"q":"제2매매가 유효한 경우 제1매수인은 언제나 제2매수인에게 직접 소유권이전등기를 청구할 수 있다.","a":"X","e":"제2매매가 유효하면 제2매수인이 소유권을 취득하고, 제1매수인은 매도인에게 채무불이행 책임을 묻는 것이 원칙이다."},{"p":7,"q":"불공정한 법률행위는 민법 제104조의 문제이다.","a":"O","e":"당사자의 궁박·경솔·무경험으로 인해 현저하게 공정을 잃은 법률행위가 무효다."},{"p":7,"q":"불공정한 법률행위가 성립하려면 급부와 반대급부 사이에 현저한 불균형이 있어야 한다.","a":"O","e":"객관적 요건으로 현저한 불균형이 필요하다."},{"p":7,"q":"불공정한 법률행위는 궁박·경솔·무경험이 모두 갖추어져야 성립한다.","a":"X","e":"셋 중 하나면 족하다."},{"p":7,"q":"불공정한 법률행위에서 무경험은 특정 분야 전문지식 부족이 아니라 거래 일반에 대한 경험 부족을 말한다.","a":"O","e":"판례상 무경험은 일반적인 사회경험·거래경험 부족이다."},{"p":7,"q":"현저한 불균형만 있으면 상대방의 폭리의 악의가 없어도 불공정한 법률행위가 성립한다.","a":"X","e":"상대방이 궁박·경솔·무경험을 알고 이용하려는 폭리의 악의가 필요하다."},{"p":7,"q":"불공정한 법률행위에서 폭리의 악의는 피해자의 궁박·경솔·무경험을 알고 이를 이용하려는 의사이다.","a":"O","e":"상대방의 주관적 요건이다."},{"p":7,"q":"불공정한 법률행위는 무상행위에도 적용된다.","a":"X","e":"급부와 반대급부 사이의 현저한 불균형을 전제로 하므로 무상행위에는 적용되지 않는다."},{"p":7,"q":"불공정한 법률행위는 단독행위에도 적용될 수 있다.","a":"O","e":"채권포기 등 단독행위에도 적용 가능하다."},{"p":7,"q":"불공정한 법률행위는 경매에도 적용된다.","a":"X","e":"경매는 절차에 따른 가격형성이라 제104조가 적용되지 않는다."},{"p":7,"q":"불공정한 법률행위는 무효이고, 그 무효는 절대적 무효로 정리된다.","a":"O","e":"선의의 제3자에게도 대항 가능하다."},{"p":7,"q":"불공정한 법률행위는 무효이지만 추인하면 유효가 된다.","a":"X","e":"불공정한 법률행위는 추인이나 법정추인으로 유효화되지 않는다."},{"p":7,"q":"불공정한 법률행위는 일정한 경우 무효행위의 전환이 가능하다.","a":"O","e":"불공정한 대물변제 약정이 정산약정 등으로 전환될 수 있는 경우가 있다."},{"p":7,"q":"불공정한 법률행위로 이미 급부가 이행된 경우 피해자는 반환청구할 수 없다.","a":"X","e":"불법원인이 수익자에게만 있는 구조로 보아 피해자의 반환청구는 가능하다."},{"p":7,"q":"불공정한 법률행위에서 폭리자인 수익자는 자기가 급부한 것의 반환을 청구할 수 없다.","a":"O","e":"수익자에게 불법성이 있으므로 반환청구가 제한된다."},{"p":7,"q":"불공정한 법률행위의 전득자는 선의이면 언제나 권리를 취득한다.","a":"X","e":"불공정행위는 절대적 무효로 정리되므로 전득자 선의 보호가 당연히 인정되지 않는다."},{"p":7,"q":"제746조 불법원인급여에서 불법의 원인으로 재산을 급여한 자는 원칙적으로 반환청구를 하지 못한다.","a":"O","e":"불법원인급여의 기본 효과다."},{"p":7,"q":"불법원인급여에서 불법원인이 수익자에게만 있는 때에는 급여자가 반환청구할 수 있다.","a":"O","e":"제746조 단서의 내용이다."},{"p":7,"q":"불법원인급여에서 반환청구 제한은 부당이득반환청구에만 적용되고 소유권에 기한 물권적 반환청구에는 적용되지 않는다.","a":"X","e":"급여자가 소유권을 근거로 물권적 청구권을 행사하여 반환을 구하는 것도 허용되지 않는다."},{"p":7,"q":"불법원인급여가 성립하면 급여자는 이행 전에도 반드시 이행해야 한다.","a":"X","e":"이행 전이라면 이행할 필요가 없다. 이행한 경우 반환청구가 제한되는 구조다."},{"p":7,"q":"반사회질서 법률행위가 이행되기 전이라면 당사자는 그 이행을 거절할 수 있다.","a":"O","e":"무효이므로 이행할 필요가 없다."},{"p":7,"q":"불법원인급여의 불법성은 급여자와 수익자 중 누구에게 있는지에 따라 반환 가능성이 달라질 수 있다.","a":"O","e":"수익자에게만 불법원인이 있으면 반환청구가 가능하다."},{"p":8,"q":"법률행위의 해석은 당사자의 의사표시 의미를 확정하는 작업으로서, 단순한 사실인정이 아니라 법률문제에 대한 가치판단이다.","a":"O","e":"법률행위 해석은 의사표시의 의미내용을 법적으로 확정하는 작업이다. 잘못된 해석은 상고이유가 될 수 있다."},{"p":8,"q":"법률행위의 해석은 사실문제이므로 법원의 직권조사 사항이 될 수 없고, 당사자의 주장에만 구속된다.","a":"X","e":"의사표시 의미내용의 해석은 법률문제에 대한 가치판단이다. 법원이 직권으로 판단할 수 있고 상고심 판단 대상이 된다."},{"p":8,"q":"법률행위 해석의 목표는 당사자가 표시행위에 부여한 객관적 의미를 명확하게 확정하는 데 있다.","a":"O","e":"문언에만 구애되지는 않지만 표시행위의 객관적 의미를 합리적으로 확정하는 것이 핵심이다."},{"p":8,"q":"법률행위의 해석에서는 언제나 당사자의 내심의 의사를 우선하여 그 내심 그대로 효력을 인정하여야 한다.","a":"X","e":"신분행위, 상대방 없는 단독행위, 상대방이 불일치를 알았거나 알 수 있었던 경우에는 자연적 해석이 중요하지만, 모든 경우 내심 우선은 아니다."},{"p":8,"q":"법률행위 해석은 사용된 문언에만 구애되는 것은 아니지만, 문언은 해석의 중요한 출발점이다.","a":"O","e":"문언, 동기와 경위, 목적, 진정한 의사, 거래관행 등을 종합하여 객관적 의미를 확정한다."},{"p":8,"q":"당사자가 표시한 문언의 객관적 의미가 명확한 경우에도 법원은 언제나 문언과 달리 당사자의 내심을 탐구하여야 한다.","a":"X","e":"객관적 의미가 명확하면 그 문언을 중심으로 해석한다. 문언이 불명확할 때 동기·경위·목적·거래관행 등을 종합한다."},{"p":8,"q":"문언의 객관적 의미가 명확하지 않은 경우에는 동기, 경위, 목적, 진정한 의사, 거래관행 등을 종합하여 해석한다.","a":"O","e":"사회정의와 형평, 논리와 경험칙, 사회일반의 상식과 거래통념에 따라 합리적으로 해석한다."},{"p":8,"q":"법률행위의 해석에서 신의칙과 거래관행은 전혀 고려될 수 없다.","a":"X","e":"특히 보충적 해석에서는 해석 당시 사정, 신의칙, 거래관행 등을 고려하여 공백을 보충한다."},{"p":8,"q":"자연적 해석은 표시행위의 객관적 의미보다 표의자의 실제 의사를 탐구하는 해석방법이다.","a":"O","e":"의사주의적 해석이다. 신분행위, 상대방 없는 단독행위, 상대방이 불일치를 알았거나 알 수 있었던 경우에 중요하다."},{"p":8,"q":"자연적 해석은 주로 상대방 있는 재산상 법률행위에서 상대방 보호를 위하여 적용되는 표시주의 해석이다.","a":"X","e":"그 설명은 규범적 해석이다. 자연적 해석은 실제 의사를 탐구하는 의사주의적 해석이다."},{"p":8,"q":"신분행위는 표의자의 진정한 의사가 특히 중시되므로 자연적 해석이 적용되는 대표 영역이다.","a":"O","e":"혼인·입양 등 신분행위는 형식적 표시보다 당사자의 진정한 의사가 중시된다."},{"p":8,"q":"상대방 없는 단독행위는 상대방의 신뢰를 보호할 필요가 없으므로 자연적 해석이 적용될 수 있다.","a":"O","e":"상대방 없는 단독행위에서는 상대방 신뢰 보호 문제가 약하므로 표의자의 진의를 탐구한다."},{"p":8,"q":"상대방 있는 의사표시에서 의사와 표시의 불일치를 상대방이 알았거나 알 수 있었던 경우에도 언제나 규범적 해석만 적용된다.","a":"X","e":"상대방이 불일치를 알았거나 알 수 있었으면 상대방 신뢰보호 필요가 약하므로 자연적 해석이 적용될 수 있다."},{"p":8,"q":"자연적 해석이 적용되는 대표 경우는 신분행위, 상대방 없는 단독행위, 상대방이 의사와 표시의 불일치를 알았거나 알 수 있었던 경우이다.","a":"O","e":"암기코드: 신·상·알·오."},{"p":8,"q":"오표시 무해의 원칙은 당사자 쌍방의 진의가 일치하면 표시가 다소 잘못되어도 그 진의대로 효력이 인정된다는 취지이다.","a":"O","e":"당사자의 의사가 실제로 합치하면 잘못된 표시 자체보다 합치된 의사가 우선한다."},{"p":8,"q":"토지를 A번지로 표시했으나 당사자 쌍방이 실제로 B번지를 매매하려는 의사로 일치한 경우, 원칙적으로 A번지 매매로 해석하여야 한다.","a":"X","e":"쌍방의 진의가 B번지로 일치하면 오표시는 해롭지 않으므로 B번지 매매로 해석될 수 있다."},{"p":8,"q":"계약당사자 사이에 실제 의사가 일치하는 경우에는 그 의사와 다른 표시가 있어도 원칙적으로 그 일치한 의사에 따라 해석한다.","a":"O","e":"자연적 해석의 대표적 모습이다."},{"p":8,"q":"규범적 해석은 표의자의 내심을 탐구하는 해석으로서 상대방의 관점은 고려하지 않는다.","a":"X","e":"규범적 해석은 상대방 관점에서 표시행위의 객관적 의미를 탐구하는 표시주의 해석이다."},{"p":8,"q":"규범적 해석은 주로 대부분의 재산상 법률행위 중 상대방 있는 의사표시에 적용된다.","a":"O","e":"상대방 있는 재산상 거래에서는 상대방의 신뢰와 거래안전 보호가 중요하다."},{"p":8,"q":"규범적 해석은 내심의 효과의사와 표시행위가 일치하지 않는 경우에 상대방 시각에서 표시행위에 따라 의미를 확정하는 해석이다.","a":"O","e":"표시행위로부터 추단되는 표시상의 효과의사를 밝히는 방식이다."},{"p":8,"q":"법률행위 해석에서는 처음부터 규범적 해석만 하고, 자연적 해석은 보충적으로만 한다.","a":"X","e":"먼저 자연적 해석으로 내심의 효과의사를 확정하고, 불가능할 때 규범적 해석으로 표시상의 효과의사를 확정한다."},{"p":8,"q":"자연적 해석으로 당사자의 실제 의사가 확정되면, 원칙적으로 다시 규범적 해석으로 그와 다른 의미를 확정할 필요는 없다.","a":"O","e":"당사자의 실제 합치의사가 확정되면 그 의사대로 해석한다."},{"p":8,"q":"규범적 해석은 표시행위로부터 추단되는 효과의사를 밝히는 것이므로, 상대방의 신뢰보호와 거래안전 기능을 가진다.","a":"O","e":"재산상 거래의 객관적 표시를 기준으로 법률관계를 안정시킨다."},{"p":8,"q":"상대방 있는 재산상 의사표시에서도 상대방이 표의자의 진의를 알고 있었다면 표시와 다른 진의가 고려될 수 없다.","a":"X","e":"상대방이 진의를 알았거나 알 수 있었으면 자연적 해석 영역으로 들어갈 수 있다."},{"p":8,"q":"임대차계약서에 “모든 권리금을 인정함”이라고 기재되어 있다는 사정만으로 임대인이 임차인에게 권리금 반환을 약정했다고 단정할 수 없다.","a":"O","e":"그 문구는 권리금 회수기회 보장 취지로 해석될 수 있고, 임대인이 직접 반환하겠다는 의미로 곧바로 단정하지 않는다."},{"p":8,"q":"임대차계약서의 “모든 권리금을 인정함”이라는 문구는 언제나 임대차 종료 시 임대인이 임차인에게 권리금을 반환하겠다는 약정이다.","a":"X","e":"문언만으로 직접 반환약정이라고 단정할 수 없다. 거래 경위와 문맥에 따라 해석한다."},{"p":8,"q":"보충적 해석은 법률행위의 성립이 인정된 후 그 내용에 공백 또는 흠결이 있을 때 이를 보충하는 해석이다.","a":"O","e":"자연적·규범적 해석으로 법률행위 성립을 인정한 뒤 내용상 빈틈을 보충한다."},{"p":8,"q":"보충적 해석은 법률행위가 성립하지 않은 경우에도 그 성립 자체를 만들어 내는 해석이다.","a":"X","e":"보충적 해석은 법률행위 성립 인정 후 내용의 공백을 보충하는 것이다. 성립 자체를 창설하는 것이 아니다."},{"p":8,"q":"보충적 해석에서 고려되는 당사자의 의사는 실제 의사가 아니라 가상적 의사이다.","a":"O","e":"해석 당시 사정, 신의칙, 거래관행 등을 고려하여 가상적 의사를 추단한다."},{"p":8,"q":"보충적 해석에서는 해석 당시의 사정, 신의칙, 거래관행 등을 고려할 수 있다.","a":"O","e":"자료도 보충적 해석에서 가상적 의사를 기준으로 신의칙과 거래관행을 고려한다고 정리한다."},{"p":8,"q":"보충적 해석은 계약에만 적용되고 단독행위에는 절대 적용될 수 없다.","a":"X","e":"주로 계약해석에서 큰 기능을 하지만, 원칙적으로 모든 법률행위에 적용될 수 있다."},{"p":8,"q":"보충적 해석은 주로 계약의 해석에서 큰 기능을 발휘한다.","a":"O","e":"계약은 장래의 다양한 사정을 모두 정하지 못하는 경우가 많아 공백보충 기능이 크다."},{"p":8,"q":"무효행위의 전환과 일부무효의 법리는 보충적 해석과 관련될 수 있다.","a":"O","e":"무효인 법률행위를 다른 법률행위로 살리거나 일부만 무효로 처리할 때 가상적 의사 판단이 중요하다."},{"p":8,"q":"교통사고 합의 시 “향후 민·형사상 일체의 청구권을 포기한다”고 약정하면, 당시 예상하지 못한 중대한 후유증 손해까지 언제나 포기한 것으로 해석된다.","a":"X","e":"예상하지 못한 후유증으로 영구불구가 된 경우 그 손해는 포기각서에 의해 포기된 것으로 보지 않을 수 있다."},{"p":8,"q":"교통사고 합의서의 포기문언도 합의 당시 예상 가능한 손해범위, 합의 경위와 목적 등을 고려하여 해석할 수 있다.","a":"O","e":"문언만 기계적으로 보지 않고 합의 당시 전제와 예상 범위를 고려한다."},{"p":8,"q":"계약서 문언이 불명확할 때에는 사회정의와 형평의 이념, 논리와 경험칙, 거래통념에 따라 합리적으로 해석할 수 있다.","a":"O","e":"자료의 판례 취지 그대로이다."},{"p":8,"q":"법률행위 해석에서 거래관행은 항상 법률보다 우선하므로 강행규정에 반하는 해석도 가능하다.","a":"X","e":"거래관행은 해석자료일 뿐 강행규정을 위반하는 결과를 정당화하지 못한다."},{"p":8,"q":"법률행위의 해석은 표시행위의 객관적 의미를 합리적으로 확정하는 것이므로, 명칭이나 형식만으로 결론을 내리는 것은 위험하다.","a":"O","e":"계약명, 조항명, 형식보다 실질적 내용과 객관적 의미를 본다."},{"p":8,"q":"당사자가 “매매”라고 표시하면 실제 내용이 담보목적 양도라도 언제나 매매로만 해석된다.","a":"X","e":"명칭보다 실제 내용과 당사자가 부여한 객관적 의미가 중요하다."},{"p":8,"q":"법률행위의 해석에서 일부 문구가 애매한 경우 전체 계약의 목적과 체계 속에서 의미를 확정해야 한다.","a":"O","e":"문언의 형식과 내용, 법률행위 전체의 목적, 거래관행을 종합한다."},{"p":8,"q":"무효행위의 전환은 무효인 법률행위가 다른 법률행위의 요건을 갖춘 경우 일정한 요건 아래 다른 법률행위로서 효력을 인정하는 제도이다.","a":"O","e":"민법 제138조의 내용이다."},{"p":8,"q":"무효행위의 전환은 취소할 수 있는 법률행위를 취소하기 전까지 다른 법률행위로 바꾸는 제도이다.","a":"X","e":"전환은 무효인 법률행위가 대상이다. 취소할 수 있는 행위는 취소 전까지 유효하다."},{"p":8,"q":"무효행위의 전환이 인정되려면 일단 성립한 법률행위가 무효이어야 한다.","a":"O","e":"성립조차 하지 않은 경우와 구별된다."},{"p":8,"q":"법률행위가 처음부터 성립하지 않은 경우에도 무효행위의 전환이 당연히 적용된다.","a":"X","e":"전환은 일단 성립한 무효행위를 전제로 한다."},{"p":8,"q":"무효행위의 전환이 인정되려면 다른 법률행위의 요건을 구비하여야 한다.","a":"O","e":"B 법률행위의 유효요건을 갖추어야 B로 전환될 수 있다."},{"p":8,"q":"무효행위의 전환은 다른 법률행위의 요건을 갖추지 않아도 당사자를 보호하기 위해 법원이 임의로 인정할 수 있다.","a":"X","e":"다른 법률행위의 요건이 있어야 한다."},{"p":8,"q":"무효행위의 전환에는 당사자가 무효를 알았더라면 다른 법률행위를 하였으리라는 가상적 의사가 필요하다.","a":"O","e":"제138조의 핵심 요건이다."},{"p":8,"q":"무효행위의 전환에서 가상적 의사는 법원이 고려할 필요가 없고, 오직 형식적 요건 충족만 보면 된다.","a":"X","e":"다른 법률행위 요건 + 가상적 의사가 모두 필요하다."},{"p":8,"q":"무효행위의 전환은 당사자 일방의 의사만 있으면 언제나 인정된다.","a":"X","e":"당사자가 무효를 알았더라면 다른 행위를 의욕했을 것이라는 객관적·가상적 의사 판단이 필요하다. 일방 의사만으로는 부족하다."},{"p":8,"q":"무효행위의 전환은 법률행위 해석의 일종으로서 당사자의 가상적 의사를 탐구한다.","a":"O","e":"보충적 해석과 연결된다."},{"p":8,"q":"요식행위가 방식 위반으로 무효인 경우에도 다른 불요식행위의 요건을 갖추고 가상적 의사가 인정되면 전환이 가능할 수 있다.","a":"O","e":"예컨대 등기 없는 전세권·지상권 설정계약이 임대차계약으로 전환될 수 있다."},{"p":8,"q":"무효인 요식행위는 어떤 경우에도 불요식행위로 전환될 수 없다.","a":"X","e":"다른 요건과 가상적 의사가 있으면 가능하다."},{"p":8,"q":"불요식행위가 무효인 경우 그 행위를 요식행위로 전환하려면 요식행위의 방식을 갖추어야 한다.","a":"O","e":"전환될 다른 행위의 요건을 구비해야 하므로 요식행위로 전환하려면 방식도 필요하다."},{"p":8,"q":"방식을 갖추지 못한 불요식행위도 언제나 요식행위로 전환될 수 있다.","a":"X","e":"요식행위의 방식을 갖추지 못하면 그 요식행위 요건을 구비하지 못하므로 전환이 어렵다."},{"p":8,"q":"연착된 승낙은 경우에 따라 새로운 청약으로 볼 수 있다.","a":"O","e":"민법 제530조 취지. 전환적 처리의 대표 예시로 정리된다."},{"p":8,"q":"조건을 붙인 승낙이나 변경을 가한 승낙은 원래 청약에 대한 승낙으로서 항상 계약을 성립시킨다.","a":"X","e":"조건부 승낙 또는 변경 승낙은 원청약에 대한 승낙이 아니라 새로운 청약으로 볼 수 있다."},{"p":8,"q":"등기를 하지 않아 무효인 전세권 설정계약은 임대차계약의 요건을 갖추면 임대차계약으로서 효력이 인정될 수 있다.","a":"O","e":"전세권은 물권이므로 등기가 필요하지만, 채권적 임대차 요건을 갖추면 임대차로 전환 가능하다."},{"p":8,"q":"등기를 하지 않은 지상권 설정계약은 언제나 아무 효력도 가질 수 없고 임대차로 전환될 수 없다.","a":"X","e":"지상권 설정계약이 물권으로는 등기 없으면 무효이나, 임대차 요건과 가상적 의사가 인정되면 임대차로 볼 수 있다."},{"p":8,"q":"비밀증서에 의한 유언이 방식 흠결로 무효라도 자필증서 유언의 요건을 갖추면 자필증서 유언으로 인정될 수 있다.","a":"O","e":"무효행위 전환의 대표 예이다."},{"p":8,"q":"비밀증서 유언이 무효인 경우 자필증서 유언의 요건을 갖추었더라도 유언은 절대적으로 효력을 가질 수 없다.","a":"X","e":"자필증서 유언 요건을 갖추면 전환 가능하다."},{"p":8,"q":"무효행위의 전환은 무효인 법률행위 전부를 그대로 유효하게 만드는 제도가 아니라 다른 법률행위로서 효력을 인정하는 제도이다.","a":"O","e":"A가 그대로 유효해지는 것이 아니라 B로서 효력이 인정된다."},{"p":8,"q":"무효행위의 전환이 인정되면 원래 무효행위가 추인되어 처음부터 유효하게 되는 것과 같다.","a":"X","e":"추인과 전환은 다르다. 전환은 다른 법률행위로서 효력을 인정하는 것이다."},{"p":8,"q":"반사회질서 법률행위처럼 절대적 무효인 행위도 언제나 무효행위의 전환으로 유효하게 만들 수 있다.","a":"X","e":"반사회질서 행위는 추인·전환이 제한된다. 위법성을 우회하여 살리는 것은 허용되지 않는다."},{"p":8,"q":"불공정한 법률행위가 무효인 경우에도 일정한 경우 무효행위의 전환이 문제될 수 있다.","a":"O","e":"예컨대 불공정한 대물변제 약정이 정산약정 등으로 전환될 여지가 문제될 수 있다."},{"p":8,"q":"무효행위의 전환은 당사자에게 예상하지 못한 새로운 의무를 강제로 부과하기 위한 제도이다.","a":"X","e":"당사자가 무효를 알았더라면 다른 행위를 의욕했을 것이라는 가상적 의사를 전제로 한다."},{"p":8,"q":"일부무효 법리는 법률행위의 일부분이 무효인 경우 나머지 부분을 유효하게 유지할 수 있는지 판단하는 문제이다.","a":"O","e":"전부무효가 원칙이지만 가상적 의사와 법률행위의 성질에 따라 나머지 부분을 유효로 볼 수 있다."},{"p":8,"q":"법률행위의 일부가 무효이면 나머지 부분은 언제나 당연히 유효하다.","a":"X","e":"일부무효는 전부무효가 원칙이고, 예외적으로 나머지 부분의 유효를 인정할 수 있다."},{"p":8,"q":"일부무효에서 나머지 부분을 유효로 볼 수 있는지는 당사자가 무효 부분이 없었더라도 나머지 행위를 하였을 것인지와 관련된다.","a":"O","e":"가상적 의사 판단이 중요하다."},{"p":8,"q":"무효행위의 전환과 일부무효의 법리는 모두 당사자의 가상적 의사를 고려한다는 점에서 보충적 해석과 연결된다.","a":"O","e":"자료도 보충적 해석의 예로 무효행위 전환과 일부무효 법리를 연결한다."},{"p":8,"q":"법률행위의 해석에서 “표시행위의 객관적 의미”란 언제나 표의자의 속마음과 동일한 것을 의미한다.","a":"X","e":"객관적 의미는 상대방과 거래통념을 기준으로 표시행위가 가지는 의미이다. 내심과 다를 수 있다."},{"p":8,"q":"상대방 있는 법률행위에서 상대방이 선의·무과실이면 표시행위의 객관적 의미에 따라 해석될 가능성이 커진다.","a":"O","e":"상대방 신뢰보호가 필요하므로 규범적 해석이 작동한다."},{"p":8,"q":"상대방 있는 법률행위에서 상대방이 표의자의 진의를 알았는데도 표시만을 내세우는 경우, 그 표시대로만 해석하여야 한다.","a":"X","e":"상대방이 진의를 알았거나 알 수 있었으면 자연적 해석으로 진의를 고려할 수 있다."},{"p":8,"q":"법률행위의 해석은 사적자치의 실현과 거래안전의 조화를 도모한다.","a":"O","e":"자연적 해석은 사적 의사 존중, 규범적 해석은 거래안전 보호 기능을 가진다."},{"p":8,"q":"해석상 당사자의 의사가 확정되지 않을 때에도 법률행위를 무조건 무효로만 보아야 하고 보충적 해석은 허용되지 않는다.","a":"X","e":"법률행위의 성립이 인정되고 내용에 공백이 있다면 보충적 해석으로 의미를 보충할 수 있다."},{"p":8,"q":"약정의 문언이 강하게 포괄적인 표현을 쓰고 있어도, 합의 당시 예상하지 못한 특별한 손해까지 당연히 포함된다고 볼 수 없는 경우가 있다.","a":"O","e":"교통사고 포기각서와 예상 못한 후유증 판례가 대표적이다."},{"p":8,"q":"법률행위 해석에서 “당사자의 진정한 의사”는 문언이 불명확한 경우 고려요소 중 하나가 될 수 있다.","a":"O","e":"객관적 의미가 명확하지 않을 때 진정한 의사도 종합 고려한다."},{"p":8,"q":"계약서에 기재된 문언이 있으면 그 법률행위의 동기와 경위는 해석에서 전혀 고려할 수 없다.","a":"X","e":"문언의 객관적 의미가 불명확할 때 동기와 경위를 고려한다."},{"p":8,"q":"무효행위의 전환은 법률행위가 무효라는 결론을 전제로 하므로, 원래 행위가 유효하다면 전환을 논할 필요가 없다.","a":"O","e":"유효한 법률행위는 전환 대상이 아니다."},{"p":8,"q":"무효행위 전환으로 인정되는 다른 법률행위의 효과는 원칙적으로 그 다른 법률행위의 요건과 내용에 따른다.","a":"O","e":"A가 아니라 B로서 효력을 갖는다."},{"p":8,"q":"무효행위 전환을 인정할 때에는 당사자의 실제 의사가 언제나 명시적으로 존재해야 하며 묵시적·가상적 의사는 고려할 수 없다.","a":"X","e":"제138조는 무효를 알았더라면 다른 법률행위를 의욕했을 것이라는 가상적 의사를 요구한다."},{"p":8,"q":"법률행위 해석에서 “상대방 없는 단독행위”가 자연적 해석 대상이 되는 이유는 상대방 신뢰보호 문제가 상대적으로 약하기 때문이다.","a":"O","e":"상대방이 없는 의사표시는 거래안전보다 표의자의 진의가 중시된다."},{"p":8,"q":"보충적 해석은 당사자의 실제 합치의사가 명확히 존재하는 경우 그 의사와 반대되는 내용을 추가하는 방식으로 할 수 있다.","a":"X","e":"보충적 해석은 공백 보충이지 명확한 합치의사에 반하는 내용 삽입이 아니다."},{"p":8,"q":"규범적 해석에서 기준이 되는 것은 평균적·합리적 상대방이 표시행위에 부여할 객관적 의미이다.","a":"O","e":"상대방 관점과 거래통념이 기준이 된다."},{"p":8,"q":"무효행위의 전환은 당사자가 그 무효를 알았더라면 아예 아무 법률행위도 하지 않았을 것으로 보이는 경우에도 인정된다.","a":"X","e":"그 경우 다른 법률행위를 의욕했을 가상적 의사가 없으므로 전환이 어렵다."},{"p":8,"q":"법률행위 해석과 무효행위 전환을 공부할 때 핵심은 “문언만 볼 것인지, 객관적 의미와 가상적 의사까지 볼 것인지”를 구별하는 것이다.","a":"O","e":"자연·규범·보충 해석, 전환의 가상적 의사를 비교해 잡는 것이 실전 포인트다."},{"p":9,"q":"기간이란 일정 시점에서 다른 시점까지 계속되는 시간의 연속을 말한다.","a":"O","e":"기간은 기산점에서 만료점까지 계속되는 시간이다. 성년, 최고기간, 실종기간, 기한, 시효 등과 결합하여 법률요건을 이룬다."},{"p":9,"q":"법률사실로서의 기간은 그 자체만으로 언제나 독립한 법률요건이 된다.","a":"X","e":"기간만이 독립하여 법률요건이 되는 경우는 드물고, 보통 다른 법률사실과 결합하여 법률요건을 이룬다."},{"p":9,"q":"성년, 최고기간, 실종기간, 기한, 시효는 기간과 관련된 대표적 법률요건이다.","a":"O","e":"기간이 다른 법률사실과 결합하는 예로 성년, 최고기간, 실종기간, 기한, 시효를 들 수 있다."},{"p":9,"q":"민법상 기간 계산 규정은 법령, 재판상 처분 또는 법률행위에 다른 정함이 없을 때 적용된다.","a":"O","e":"민법 제155조의 적용범위로, 기간 계산 규정은 보충규정이다."},{"p":9,"q":"기간 계산에 관한 민법 규정은 강행규정이므로 당사자가 법률행위로 달리 정할 수 없다.","a":"X","e":"기간 계산 규정은 보충규정·임의규정이다. 법률행위로 달리 정하면 그 정함에 따른다."},{"p":9,"q":"기간 계산에 관하여 법률행위로 다른 정함이 있으면 민법의 기간 계산 규정보다 그 정함이 우선한다.","a":"O","e":"제155조상 법령·재판상 처분·법률행위에 다른 정함이 있으면 그에 따른다."},{"p":9,"q":"민법의 기간 계산 규정은 사법관계에만 적용되고 공법관계에는 적용될 수 없다.","a":"X","e":"기간에 관한 민법 규정은 사법관계뿐 아니라 공법관계에도 적용된다."},{"p":9,"q":"기간을 시·분·초로 정한 때에는 즉시부터 기산한다.","a":"O","e":"시·분·초 단위 기간은 자연적 계산, 즉 즉시부터 기산한다."},{"p":9,"q":"기간을 시·분·초로 정한 경우에도 원칙적으로 초일은 산입하지 않는다.","a":"X","e":"초일불산입은 일·주·월·연 단위 기간의 원칙이다. 시·분·초는 즉시부터 기산한다."},{"p":9,"q":"기간을 시간으로 정한 경우에는 해당 시간이 종료함으로써 기간이 만료한다.","a":"O","e":"시·분·초로 정한 기간은 즉시부터 기산하여 해당 시·분·초가 종료할 때 만료한다."},{"p":9,"q":"기간을 일·주·월·연으로 정한 때에는 원칙적으로 초일을 산입한다.","a":"X","e":"일·주·월·연 단위 기간은 원칙적으로 초일불산입이다."},{"p":9,"q":"일·주·월·연으로 정한 기간은 원칙적으로 초일을 산입하지 않는다.","a":"O","e":"민법상 기간 계산의 기본 원칙이다. 다만 오전 0시부터 시작하는 경우와 연령계산은 예외가 있다."},{"p":9,"q":"기간이 오전 0시부터 시작하는 경우에는 초일을 산입한다.","a":"O","e":"초일불산입의 예외로, 당일이 완전한 하루로 계산되므로 초일 산입이다."},{"p":9,"q":"기간이 오전 0시부터 시작하더라도 일·주·월·연 기간이면 언제나 초일을 산입하지 않는다.","a":"X","e":"오전 0시부터 기산하는 경우에는 초일을 산입한다."},{"p":9,"q":"연령계산에서는 출생일을 산입한다.","a":"O","e":"초일산입 예외로 연령계산 시 출생일을 산입한다."},{"p":9,"q":"연령계산에서도 민법상 초일불산입 원칙에 따라 출생일을 산입하지 않는다.","a":"X","e":"연령계산은 출생일을 산입한다."},{"p":9,"q":"기간을 일로 정한 경우 말일이 종료함으로써 기간이 만료한다.","a":"O","e":"일·주·월·연 단위 기간은 해당 기간의 말일 종료 시 만료한다."},{"p":9,"q":"기간을 일로 정한 경우 말일의 시작과 동시에 기간이 만료한다.","a":"X","e":"말일의 종료로 만료한다. 말일의 시작이 아니다."},{"p":9,"q":"기간을 주·월·연으로 정한 때에는 이를 일수로 환산하지 않고 역에 의하여 계산한다.","a":"O","e":"주·월·연은 달력에 따라 계산한다. 월을 30일, 연을 365일로 기계적으로 환산하지 않는다."},{"p":9,"q":"1개월은 언제나 30일로 환산하여 계산한다.","a":"X","e":"월로 정한 기간은 역에 의하여 계산한다. 월마다 일수가 다르므로 30일 환산이 아니다."},{"p":9,"q":"1년은 언제나 365일로 환산하여 계산한다.","a":"X","e":"연 단위 기간도 역에 의하여 계산한다. 윤년 등도 달력에 따른다."},{"p":9,"q":"기간을 주·월·연으로 정한 경우 해당 주·월·연의 처음부터 기산하지 않으면 최후의 주·월·연에서 기산일의 전일로 만료한다.","a":"O","e":"예를 들어 7월 30일부터 6월은 다음 해 1월 30일 24시에 만료하고, 효력발생은 1월 31일 0시가 된다."},{"p":9,"q":"월 또는 연으로 정한 기간에서 최종월에 해당일이 없으면 그 전달 말일에 만료한다.","a":"X","e":"최종월에 해당일이 없으면 그 최종월의 말일로써 만료한다. '전달 말일'이 아니다."},{"p":9,"q":"월 또는 연으로 정한 기간에서 최종월에 해당일이 없으면 그 최종월의 말일로써 기간이 만료한다.","a":"O","e":"예컨대 1월 31일부터 1개월이면 2월에 31일이 없으므로 2월 말일에 만료한다."},{"p":9,"q":"윤년의 2월 29일도 달력에 따라 기간 계산에서 고려될 수 있다.","a":"O","e":"윤년 예시를 통해 주·월·연 기간은 역법적 계산임을 확인할 수 있다."},{"p":9,"q":"기간을 12월 9일 12시부터 3일간으로 정하면 자연적 계산에 따라 12월 12일 12시에 만료한다.","a":"X","e":"'일부터 3일간'처럼 일 단위라면 원칙적으로 다음 날 0시부터 완전한 날짜를 세어 말일 종료 시 만료한다. 12시부터 72시간 계산이 아니다."},{"p":9,"q":"기간을 12월 9일부터 3일간으로 정하면 원칙적으로 12월 10일, 11일, 12일을 세어 12월 12일 24시에 만료한다.","a":"O","e":"초일불산입 원칙 때문에 12월 9일은 빼고 10일부터 3일을 센다."},{"p":9,"q":"기간의 초일이 공휴일이면 그 다음 날부터 기산한다.","a":"X","e":"기간의 초일이 공휴일이라도 초일부터 기산한다. 말일이 토요일 또는 공휴일인 경우와 구별해야 한다."},{"p":9,"q":"기간의 말일이 토요일 또는 공휴일이면 원칙적으로 그 익일로 기간이 만료한다.","a":"O","e":"말일이 토요일 또는 공휴일이면 익일 만료가 원칙이다."},{"p":9,"q":"기간의 말일이 공휴일이면 항상 예외 없이 그 익일로 연장된다.","a":"X","e":"절대적인 것은 아니며, 당사자 합의 또는 관행으로 토요일·공휴일을 말일로 할 수도 있다."},{"p":9,"q":"당사자의 합의나 관행이 있으면 토요일 또는 공휴일도 기간의 말일이 될 수 있다.","a":"O","e":"말일 토요일·공휴일 익일만료 규칙은 절대적 강행규정이 아니다."},{"p":9,"q":"공휴일에는 일요일과 임시공휴일이 포함된다.","a":"O","e":"공휴일에는 일요일 및 임시공휴일이 포함된다."},{"p":9,"q":"기간의 초일이 공휴일인 경우에는 기간 계산에서 그 날을 제외한다.","a":"X","e":"초일이 공휴일이라도 초일부터 기산한다. 말일 공휴일 규칙과 혼동하면 안 된다."},{"p":9,"q":"정년이 60세라는 것은 60세가 종료되는 날을 의미한다.","a":"X","e":"판례상 정년 60세는 60세에 도달하는 날을 의미한다. 60세가 종료되는 날이 아니다."},{"p":9,"q":"정년이 60세라는 것은 60세에 도달하는 날을 의미한다.","a":"O","e":"정년 60세는 60세 종료일이 아니라 60세 도달일이다."},{"p":9,"q":"정년 산정은 실제 생년월일을 기준으로 한다.","a":"O","e":"정년은 실제 생년월일을 기준으로 산정해야 한다."},{"p":9,"q":"근로자의 정년을 60세 미만으로 정한 근로계약이나 취업규칙은 그 범위에서 무효이다.","a":"O","e":"60세 미만 정년은 규정 위반 범위 내에서 무효로 정리된다."},{"p":9,"q":"기간의 역산에서도 기산점과 만료점의 개념을 반대로 생각해야 하며, '일주일 전'과 같은 표현은 역으로 날짜를 세어야 한다.","a":"O","e":"총회 소집통지 등에서 '일주일 전'은 행사일로부터 역산하여 계산한다."},{"p":9,"q":"사원총회가 7월 19일 19시에 예정되어 있고 일주일 전 발송이 요구되면 7월 12일 발송이면 충분하다.","a":"X","e":"일주일 전은 행사일을 기준으로 역산하여 안전하게 전날까지 확보해야 하므로 7월 11일 발송이 예시가 된다."},{"p":9,"q":"7월 30일 공포 법령이 공포일부터 6월이 경과한 날부터 효력을 발생한다면, 일반 계산상 만료일은 다음 해 1월 30일 24시이다.","a":"O","e":"공포일 7/30, 기산일 7/31, 만료일은 다음 해 1월 30일 24시가 된다."},{"p":9,"q":"7월 30일 공포 법령이 공포일부터 6월이 경과한 날부터 효력을 발생한다면, 효력발생일은 다음 해 1월 30일 0시이다.","a":"X","e":"효력발생일은 다음 해 1월 31일 0시이다. 만료일 다음 순간부터 효력이 발생한다."},{"p":9,"q":"공포일부터 6월이 경과한 날부터 효력이 발생한다는 경우, 공포일 다음 날을 기산일로 볼 수 있다.","a":"O","e":"일·월 단위 기간은 초일불산입이 원칙이므로 공포일 자체는 빼고 다음 날부터 계산한다."},{"p":9,"q":"공포일부터 6월이 경과한 날부터 효력이 발생하는 경우, 만료일 24시와 효력발생일 0시는 구별된다.","a":"O","e":"기간은 말일 종료로 만료하고, '경과한 날부터 효력'은 그 다음 날 0시가 된다."},{"p":9,"q":"기간 계산에서 자연적 계산은 주로 시·분·초 단위에, 역법적 계산은 일·주·월·연 단위에 연결된다.","a":"O","e":"시계로 재는 시간과 달력으로 세는 기간을 구별하는 것이 핵심이다."},{"p":9,"q":"기간을 '월'로 정한 경우에는 반드시 그 기간을 일수로 환산하여 자연적 계산을 한다.","a":"X","e":"월 단위는 역법적 계산이다. 일수 환산이 아니다."},{"p":9,"q":"오전 0시부터 시작하지 않는 일 단위 기간에서는 초일불산입이 원칙이다.","a":"O","e":"초일을 완전한 하루로 볼 수 없기 때문이다."},{"p":9,"q":"오전 0시부터 시작하는 일 단위 기간에서는 초일산입이 가능하다.","a":"O","e":"초일산입 예외 중 하나로, 0시 시작은 완전한 하루로 취급된다."},{"p":9,"q":"초일불산입 원칙은 기간의 말일이 토요일 또는 공휴일인 경우의 익일만료 규칙과 같은 내용이다.","a":"X","e":"초일불산입은 시작점 계산, 익일만료는 끝나는 날 계산으로 서로 다른 규칙이다."},{"p":9,"q":"기간 계산 규정은 당사자 합의로 바꿀 수 있으므로 시험에서는 '항상', '언제나'라는 표현을 조심해야 한다.","a":"O","e":"민법 기간 규정은 원칙적으로 보충규정·임의규정이라는 점이 함정이다."},{"p":9,"q":"법령 또는 재판상 처분이 기간 계산에 관하여 달리 정하면 민법의 일반 기간 계산 규정보다 우선한다.","a":"O","e":"제155조상 법령, 재판상 처분, 법률행위의 다른 정함이 우선한다."},{"p":9,"q":"기간 말일이 토요일이면 공휴일이 아니므로 민법상 익일만료 규칙이 적용될 수 없다.","a":"X","e":"토요일 또는 공휴일이면 익일로 만료한다."},{"p":9,"q":"기간의 말일이 임시공휴일이면 공휴일에 해당하므로 익일만료가 문제될 수 있다.","a":"O","e":"공휴일에는 임시공휴일도 포함된다."},{"p":9,"q":"기간 계산에서 '말일 종료'란 원칙적으로 그 날의 24시를 의미한다.","a":"O","e":"일 단위 기간은 말일 종료, 즉 24시 만료로 이해하면 된다."},{"p":9,"q":"기간의 만료와 권리 또는 법령의 효력발생 시점은 언제나 동일하다.","a":"X","e":"만료일 24시와 효력발생일 다음 날 0시는 구별된다."},{"p":9,"q":"기간을 월로 정한 경우 기산일에 대응하는 날이 최종월에 있으면 그 전날이 아니라 그 대응일 자체의 종료로 만료한다.","a":"X","e":"처음부터 기산하지 않는 경우에는 최후의 월에서 기산일에 해당하는 날의 전일로 만료한다."},{"p":9,"q":"기간을 월로 정하고 초일불산입이 적용되면, 실제 기산일을 먼저 잡은 뒤 최종월의 만료일을 판단해야 한다.","a":"O","e":"공포일 7/30 예시에서 먼저 기산일 7/31을 잡고, 6월 후 만료일을 1/30으로 판단한다."},{"p":9,"q":"최종월에 해당일이 없는 경우에는 기간이 무효가 되거나 계산할 수 없게 된다.","a":"X","e":"해당일이 없으면 최종월의 말일로 만료한다."},{"p":9,"q":"민법상 기간 계산은 소멸시효나 취득시효 계산과 연결될 수 있다.","a":"O","e":"기간의 예로 시효를 들 수 있고, 기간 파트 바로 다음에 소멸시효로 이어진다."},{"p":9,"q":"기간 계산에서 '기산점'은 기간이 시작되는 지점이고, '만료점'은 기간이 끝나는 지점이다.","a":"O","e":"기간 구조의 기본으로, 날짜를 풀 때 기산점과 만료점을 먼저 잡아야 한다."},{"p":9,"q":"민법 기간 파트에서는 초일불산입보다 말일 토요일·공휴일 익일만료가 우선하므로 초일 계산은 할 필요가 없다.","a":"X","e":"초일 계산과 말일 계산을 모두 해야 한다. 먼저 기산점을 정하고, 마지막에 말일 토요일·공휴일 여부를 본다."},{"p":9,"q":"기간 계산 문제는 '언제부터 세는가'와 '언제 끝나는가'를 나누어 풀어야 한다.","a":"O","e":"실전에서는 초일산입 여부와 말일 종료/익일만료 여부를 분리하면 함정을 피할 수 있다."},{"p":10,"q":"소멸시효는 권리자가 권리를 행사할 수 있음에도 일정기간 행사하지 않은 경우 그 권리를 소멸시키는 제도이다.","a":"O","e":"소멸시효는 권리 불행사 상태가 일정기간 계속될 때 권리를 소멸시키는 제도이다."},{"p":10,"q":"소멸시효가 완성되면 권리는 장래를 향하여만 소멸한다.","a":"X","e":"소멸시효 완성의 효과는 기산일에 소급한다. 장래효가 아니라 소급효이다."},{"p":10,"q":"소멸시효와 제척기간은 언제나 양립할 수 없으므로, 제척기간이 적용되는 권리에는 소멸시효가 적용되지 않는다.","a":"X","e":"권리의 내용과 성질에 따라 제척기간과 소멸시효가 함께 문제될 수 있다. 하자담보 손해배상청구권처럼 제척기간과 채권 소멸시효가 함께 적용될 수 있는 경우가 있다."},{"p":10,"q":"소멸시효의 대상은 권리이고, 모든 권리가 예외 없이 소멸시효에 걸린다.","a":"X","e":"소멸시효는 권리를 대상으로 하지만 모든 권리가 대상은 아니다. 소유권, 점유권, 유치권 등은 소멸시효에 걸리지 않는다."},{"p":10,"q":"채권은 원칙적으로 소멸시효의 대상이 된다.","a":"O","e":"민법상 채권은 원칙적으로 소멸시효에 걸린다. 특별한 단기시효 규정이 없으면 일반채권 10년이 기준이다."},{"p":10,"q":"소유권은 장기간 행사하지 않으면 소멸시효로 소멸한다.","a":"X","e":"소유권은 소멸시효에 걸리지 않는다."},{"p":10,"q":"점유권은 사실상 지배를 기초로 하므로 소멸시효의 대상이 아니다.","a":"O","e":"점유권은 점유라는 사실상태를 기초로 하므로 일반적인 소멸시효 대상이 아니다."},{"p":10,"q":"유치권은 담보물권이므로 소멸시효로 소멸한다.","a":"X","e":"유치권 자체는 소멸시효의 대상이 아니다. 다만 유치권이 담보하는 채권이 시효로 소멸하면 부종성에 따라 유치권도 소멸할 수 있다."},{"p":10,"q":"저당권은 피담보채권과 별도로 독립하여 소멸시효에 걸린다.","a":"X","e":"저당권 자체는 소멸시효에 걸리는 권리가 아니다. 피담보채권이 시효로 소멸하면 저당권도 부종성에 따라 소멸한다."},{"p":10,"q":"형성권은 권리자의 일방적 의사표시로 법률관계를 변동시키는 권리이므로 원칙적으로 소멸시효의 대상이 아니다.","a":"O","e":"취소권·해제권 등 형성권은 일반적으로 소멸시효가 아니라 제척기간 문제로 다루어진다."},{"p":10,"q":"소멸시효는 권리를 행사할 수 있는 때부터 진행한다.","a":"O","e":"시효의 기산점은 권리를 행사할 수 있는 때이다. 법률상 장애가 없어 권리행사가 가능해야 한다."},{"p":10,"q":"권리자가 권리의 존재를 알지 못한 때에는 언제나 소멸시효가 진행하지 않는다.","a":"X","e":"소멸시효는 원칙적으로 권리를 행사할 수 있는 객관적 상태가 기준이다. 단순히 권리자가 몰랐다는 사정만으로 진행이 막히지 않는다."},{"p":10,"q":"기한이 있는 채권은 원칙적으로 기한이 도래한 때부터 소멸시효가 진행한다.","a":"O","e":"기한이 도래해야 채권자가 이행청구를 할 수 있으므로, 그때부터 소멸시효가 진행한다."},{"p":10,"q":"정지조건부 권리는 조건성취 전에도 장래 권리이므로 소멸시효가 진행한다.","a":"X","e":"정지조건부 권리는 조건이 성취되어야 행사할 수 있으므로 조건 성취 전에는 소멸시효가 진행하지 않는다."},{"p":10,"q":"불확정기한부 채권은 기한이 도래하고 채권자가 이를 안 때부터만 시효가 진행한다.","a":"X","e":"불확정기한부 채권은 기한이 객관적으로 도래하면 행사 가능성이 생긴다. 채권자의 인식이 항상 기산점은 아니다."},{"p":10,"q":"동시이행관계에 있는 채권도 이행기가 도래하면 소멸시효가 진행할 수 있다.","a":"O","e":"동시이행항변권이 존재한다는 사정만으로 권리행사 자체가 법률상 불가능한 것은 아니다. 이행기가 도래하면 시효가 진행할 수 있다."},{"p":10,"q":"채권자가 최고를 하면 그 자체로 영구적인 시효중단효가 발생한다.","a":"X","e":"최고는 잠정적 중단효만 있다. 6개월 내 재판상 청구 등 강한 조치를 해야 시효중단의 효력이 유지된다."},{"p":10,"q":"재판상 청구는 소멸시효의 중단사유이다.","a":"O","e":"재판상 청구는 대표적인 시효중단사유이다. 소를 제기하여 권리행사의 의사를 명확히 하는 경우이다."},{"p":10,"q":"소를 제기하였다가 각하되거나 취하된 경우에도 언제나 재판상 청구로서 시효중단의 효력이 유지된다.","a":"X","e":"소의 각하·취하 등으로 재판상 청구가 효력을 잃는 경우에는 일정기간 내 다시 재판상 청구 등 조치를 해야 중단효가 유지된다."},{"p":10,"q":"청구가 기각판결로 확정된 뒤 재심의 소를 제기한 경우, 원칙적으로 시효중단효 있는 재판상 청구로 보지 않는다.","a":"O","e":"기각판결 확정 후 재심의 소는 일반적인 시효중단효 있는 재판상 청구로 보기 어렵다."},{"p":10,"q":"형사소송의 제기는 원칙적으로 민사상 손해배상청구권의 소멸시효 중단사유인 재판상 청구에 해당한다.","a":"X","e":"형사소송의 제기 자체는 원칙적으로 민사채권의 재판상 청구가 아니다. 다만 형사재판부에 배상명령을 신청한 경우 등은 별도로 본다."},{"p":10,"q":"행정소송의 제기는 언제나 민사상 부당이득반환청구권의 소멸시효 중단사유가 아니다.","a":"X","e":"행정소송 일반은 원칙적으로 재판상 청구가 아니지만, 과오납 조세 반환과 직접 관련된 처분무효·취소확인소송 등은 부당이득반환청구권의 시효중단효가 인정될 수 있다."},{"p":10,"q":"지급명령의 신청은 소멸시효 중단사유가 될 수 있다.","a":"O","e":"지급명령 신청은 권리행사의 한 방식으로 시효중단이 문제된다. 다만 정해진 기간 내 필요한 조치를 하지 않아 효력을 잃으면 중단효가 없다."},{"p":10,"q":"압류·가압류·가처분은 소멸시효 중단사유이다.","a":"O","e":"압류·가압류·가처분은 시효중단사유이다. 다만 시효이익을 받는 자에게 하지 않은 경우에는 통지해야 중단효가 생긴다."},{"p":10,"q":"압류·가압류·가처분이 시효이익을 받을 자에 대하여 이루어지지 않은 경우에도 통지 없이 당연히 그 자에게 시효중단효가 미친다.","a":"X","e":"그 경우에는 시효이익을 받을 자에게 통지한 때가 아니면 시효중단의 효력이 없다."},{"p":10,"q":"압류·가압류·가처분 등기가 말소되면 그 시효중단효도 소멸할 수 있다.","a":"O","e":"압류·가압류·가처분의 등기가 말소되면 그에 기한 시효중단효가 소멸하는 문제가 생긴다."},{"p":10,"q":"승인은 소멸시효 중단사유이다.","a":"O","e":"채무자가 권리 존재를 인정하는 승인은 시효중단사유이다."},{"p":10,"q":"승인은 상대방의 권리에 관한 처분능력이나 권한을 요하지 않는다.","a":"O","e":"승인은 권리 존재를 인정하는 관념의 통지로 보므로, 특별한 처분능력까지 요구하지 않는 것으로 정리된다."},{"p":10,"q":"소멸시효 완성 전의 채무 일부변제는 특별한 사정이 없는 한 채무승인으로 보아 시효중단 사유가 될 수 있다.","a":"O","e":"완성 전 일부변제는 채무의 존재를 인정하는 행위로서 승인에 해당할 수 있다."},{"p":10,"q":"소멸시효 완성 후 일부변제는 언제나 시효이익 포기로 볼 수 없다.","a":"X","e":"완성 후 일부변제는 특별한 사정이 없는 한 채무 전부를 승인하고 시효이익을 포기한 것으로 추정될 수 있다."},{"p":10,"q":"일반 민사채권은 원칙적으로 10년간 행사하지 않으면 소멸시효가 완성한다.","a":"O","e":"민법상 일반채권의 소멸시효기간은 10년이다. 단기소멸시효가 있으면 그 규정이 우선한다."},{"p":10,"q":"소유권 이외의 재산권은 원칙적으로 20년의 소멸시효에 걸릴 수 있다.","a":"O","e":"채권과 소유권을 제외한 재산권은 일반적으로 20년의 소멸시효가 문제된다."},{"p":10,"q":"지상권·지역권·전세권 같은 용익물권은 소유권과 마찬가지로 소멸시효에 걸리지 않는다.","a":"X","e":"용익물권은 소유권이 아니므로 20년 소멸시효가 문제될 수 있다."},{"p":10,"q":"상사채권은 특별한 규정이 없으면 일반적으로 5년의 소멸시효에 걸린다.","a":"O","e":"상행위로 인한 채권은 상법상 단기소멸시효가 적용되어 원칙적으로 5년이다."},{"p":10,"q":"판결에 의하여 확정된 채권은 단기의 소멸시효에 해당하더라도 그 소멸시효기간이 10년으로 된다.","a":"O","e":"확정판결, 재판상 화해·조정 등 판결과 같은 효력이 있는 경우에는 단기채권도 10년 시효가 된다."},{"p":10,"q":"판결확정 당시 아직 변제기가 도래하지 않은 채권도 확정판결이 있으면 언제나 10년 시효가 적용된다.","a":"X","e":"판결 등에 의하여 확정된 채권의 10년 규정은 판결확정 당시 변제기가 도래하지 않은 채권에는 적용되지 않는다."},{"p":10,"q":"채권자와 주채무자 사이의 확정판결로 주채무의 시효가 10년으로 연장되면, 보증채무도 당연히 10년으로 연장된다.","a":"X","e":"주채무자에 대한 판결의 효력으로 주채무 시효가 10년이 되어도, 보증인에 대한 보증채무 시효가 당연히 10년으로 되는 것은 아니다."},{"p":10,"q":"물상보증인의 채무자에 대한 구상권은 일반채권으로서 10년의 소멸시효가 적용될 수 있다.","a":"O","e":"물상보증인의 구상권은 민법상 별개의 독립한 권리로 보아 일반채권 10년 시효가 문제된다."},{"p":10,"q":"변제기 이후의 지연이자는 금전 사용의 대가인 이자이므로 언제나 단기소멸시효가 적용된다.","a":"X","e":"지연이자는 금전채무 이행지체에 따른 손해배상금 성격이다. 일반 이자와 동일하게 무조건 단기시효로 처리하지 않는다."},{"p":10,"q":"채무불이행으로 원채권이 손해배상청구권으로 바뀐 경우 그 손해배상청구권의 시효기간은 원채권의 시효기간과 연결된다.","a":"O","e":"원채권이 채무불이행으로 손해배상채권이 된 경우, 그 시효기간은 원채권의 성질을 따른다."},{"p":10,"q":"이자채권은 원본채권과 독립성이 있으므로 원본채권의 소멸 여부와 무관하게 언제나 존속한다.","a":"X","e":"이자채권은 종된 권리로서 원본채권이 소멸하면 원칙적으로 함께 소멸한다."},{"p":10,"q":"소멸시효가 완성된 채권이 그 완성 전에 상계할 수 있었던 것이면 채권자는 그 채권으로 상계할 수 있다.","a":"O","e":"민법은 시효소멸한 채권이라도 그 완성 전에 상계할 수 있었던 경우 상계를 허용한다."},{"p":10,"q":"소멸시효 완성으로 채무가 당연히 소멸한다는 견해에 따르면 법원은 당사자의 원용 없이도 항상 직권으로 시효완성을 판단해야 한다.","a":"X","e":"판례는 절대적 소멸설의 표현을 쓰지만, 소송에서는 변론주의상 당사자가 원용해야 법원이 고려한다."},{"p":10,"q":"소멸시효의 완성은 법원이 직권으로 판단할 수 없고, 원칙적으로 당사자의 원용이 필요하다.","a":"O","e":"소멸시효는 소송상 당사자가 원용해야 법원이 판단한다. 변론주의 때문이다."},{"p":10,"q":"소멸시효 완성의 원용권자는 시효완성으로 직접 이익을 받는 자이다.","a":"O","e":"원용권자는 직접 이익을 받는 자이다. 채무자뿐 아니라 일정한 제3자도 포함될 수 있다."},{"p":10,"q":"담보가등기가 경료된 부동산을 매수한 자는 피담보채권의 소멸시효를 원용할 수 있다.","a":"O","e":"담보가등기 부담이 있는 부동산 매수인은 피담보채권 소멸로 직접 이익을 받으므로 소멸시효를 원용할 수 있다."},{"p":10,"q":"물상보증인은 피담보채권의 소멸시효를 원용할 수 없다.","a":"X","e":"물상보증인은 담보부담에서 벗어나는 직접 이익을 가지므로 피담보채권의 소멸시효를 원용할 수 있다."},{"p":10,"q":"채권자취소소송의 수익자는 채권자의 피보전채권이 시효로 소멸했음을 원용할 수 있다.","a":"O","e":"수익자는 취소소송에서 채권자의 권리행사 여부로 직접 영향을 받으므로 채권자의 채권 소멸시효를 원용할 수 있다."},{"p":10,"q":"소멸시효의 이익은 시효완성 전에도 미리 포기할 수 있다.","a":"X","e":"소멸시효의 이익은 미리 포기하지 못한다. 완성 후 포기는 가능하다."},{"p":10,"q":"소멸시효 완성 후 시효이익의 포기는 상대방 있는 단독행위이다.","a":"O","e":"시효이익 포기는 소멸시효 완성으로 생긴 이익을 받지 않겠다는 상대방 있는 단독행위이다."},{"p":10,"q":"소멸시효는 법률행위로 이를 배제하거나 연장할 수 있다.","a":"X","e":"소멸시효는 법률행위로 배제·연장·가중할 수 없다. 다만 단축 또는 경감은 가능하다."},{"p":10,"q":"소멸시효는 법률행위로 단축하거나 경감할 수 있다.","a":"O","e":"민법 제184조 제2항은 시효를 배제·연장·가중할 수는 없지만 단축·경감은 가능하다고 한다."},{"p":10,"q":"주채무자가 시효이익을 포기하면 보증인에게도 그 효력이 당연히 미친다.","a":"X","e":"시효이익의 포기는 상대적 효력이 원칙이다. 주채무자의 포기가 보증인에게 당연히 불리하게 미치지는 않는다."},{"p":10,"q":"보증인은 주채무의 소멸시효 완성을 원용할 수 있다.","a":"O","e":"보증채무는 주채무에 부종하므로 보증인은 주채무의 소멸시효 완성을 주장할 수 있다."},{"p":10,"q":"시효중단의 효력은 중단사유가 종료한 때부터 새로 진행한다.","a":"O","e":"시효가 중단되면 그때까지 진행한 기간은 효력을 잃고, 중단사유가 종료한 때부터 새로 진행한다."},{"p":10,"q":"시효정지는 이미 진행한 기간을 모두 없애고 처음부터 새로 진행시키는 제도이다.","a":"X","e":"그것은 중단의 효과이다. 정지는 일정한 장애사유가 있는 경우 완성시점을 늦추는 제도이다."},{"p":10,"q":"제한능력자에게 법정대리인이 없는 경우에는 일정기간 동안 시효완성이 정지될 수 있다.","a":"O","e":"제한능력자가 법정대리인이 없어 권리행사가 곤란한 경우에는 시효정지 규정이 문제된다."},{"p":10,"q":"부부 사이의 권리는 혼인관계가 계속되는 동안에도 일반적으로 시효가 완성될 수 있고, 혼인 해소와 무관하다.","a":"X","e":"부부 사이의 권리는 혼인관계 중 권리행사가 곤란한 특성을 고려하여 혼인 해소 후 일정기간까지 시효완성이 정지될 수 있다."},{"p":10,"q":"상속재산에 관한 권리는 상속인 확정이나 관리인 선임 전후에 시효정지가 문제될 수 있다.","a":"O","e":"상속재산 관계에서는 권리행사의 주체나 관리가 불명확한 기간이 있어 시효정지 규정이 문제될 수 있다."},{"p":10,"q":"천재 기타 사변으로 시효중단조치를 할 수 없는 경우에도 시효는 예외 없이 완성한다.","a":"X","e":"천재 기타 사변으로 중단조치를 할 수 없으면 일정기간 시효완성이 정지될 수 있다."},{"p":10,"q":"소멸시효 완성 후 채무자가 채무를 승인하면 시효이익을 포기한 것으로 볼 수 있다.","a":"O","e":"완성 후 승인·일부변제 등은 시효이익의 포기로 추정될 수 있다."},{"p":10,"q":"시효이익을 포기한 채무자는 다시 그 완성된 소멸시효를 원용할 수 있다.","a":"X","e":"시효이익을 유효하게 포기하면 그 완성된 시효를 다시 원용할 수 없다."},{"p":10,"q":"시효완성 후 채무자가 일부를 변제한 경우에는 특별한 사정이 없는 한 채무 전체에 대한 시효이익 포기로 추정될 수 있다.","a":"O","e":"일부변제는 통상 채무 전체의 존재를 인정하는 취지로 볼 수 있어 전체에 대한 시효이익 포기로 추정될 수 있다."},{"p":10,"q":"소멸시효 완성 후 채무승인이 있으면 항상 주채무자뿐 아니라 보증인도 시효이익을 상실한다.","a":"X","e":"시효이익 포기는 원칙적으로 상대효이다. 주채무자
