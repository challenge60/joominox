그 토지를 타인에게 양도한 경우의 분묘기지권은 지료가 무상인 것이 원칙이다.","a":"X","e":"양도형 분묘기지권은 유상으로 보며, 성립한 때부터 지료 지급의무가 있다."},{"p":21,"q":"타인의 토지에 분묘를 설치하여 20년간 평온·공연하게 분묘기지를 점유하여 시효취득한 경우, 지료는 토지소유자가 청구한 날부터 지급하면 된다.","a":"O","e":"전원합의체 판례는 시효취득형 분묘기지권의 지료 지급의무를 토지소유자가 청구한 날부터 인정한다."},{"p":21,"q":"분묘기지권자는 분묘기지권을 포기하려면 포기의 의사표시 외에 점유까지 포기하여야 한다.","a":"X","e":"분묘기지권의 포기는 포기의 의사표시만으로 충분하고 점유까지 포기할 필요는 없다."},{"p":21,"q":"지역권은 요역지의 편익을 위하여 승역지를 일정한 방법으로 이용하는 권리이다.","a":"O","e":"지역권은 사람을 위한 권리인 인역권이 아니라 토지의 편익을 위한 권리이다."},{"p":21,"q":"지역권은 특정인의 편익을 위하여 설정되는 인역권이다.","a":"X","e":"민법상 지역권은 요역지의 편익을 위한 물권이다. 특정인의 편익만을 위한 인역권은 아니다."},{"p":21,"q":"지역권에는 통행지역권, 용수지역권, 관망지역권 등이 있을 수 있다.","a":"O","e":"승역지 이용의 내용에 따라 여러 유형의 지역권이 인정된다."},{"p":21,"q":"지역권은 요역지와 분리하여 독립적으로 양도할 수 있다.","a":"X","e":"지역권은 요역지의 소유권에 부종하므로 요역지와 분리하여 양도하거나 다른 권리의 목적으로 하지 못한다."},{"p":21,"q":"요역지 소유권이 이전되면 특별한 사정이 없는 한 지역권도 함께 이전된다.","a":"O","e":"지역권은 요역지 소유권에 부종한다. 요역지 이전 시 지역권도 이전된다."},{"p":21,"q":"지역권은 승역지 소유자에게 적극적으로 어떤 행위를 할 의무를 부담시키는 것이 본질이다.","a":"X","e":"지역권은 원칙적으로 승역지를 일정하게 사용하거나 승역지 소유자의 이용을 제한하는 권리이다. 적극적 급부의무가 본질은 아니다."},{"p":21,"q":"지역권은 설정계약과 등기에 의하여 성립할 수 있다.","a":"O","e":"법률행위에 의한 지역권 설정은 등기가 필요하다."},{"p":21,"q":"계속되고 표현된 지역권은 시효취득의 대상이 될 수 있다.","a":"O","e":"민법 제294조는 계속되고 표현된 지역권에 한하여 취득시효 규정을 준용한다."},{"p":21,"q":"지역권은 계속되고 표현된 것이 아니더라도 20년간 행사하면 언제나 시효취득된다.","a":"X","e":"지역권 시효취득은 계속성과 표현성이 필요하다."},{"p":21,"q":"통행지역권의 시효취득은 단순히 오랜 기간 일정 장소를 통행했다는 사실만으로 충분하다.","a":"X","e":"통로의 개설 없이 오래 통행한 사실만으로는 부족하다. 요역지 소유자가 승역지상에 통로를 개설하여 항시 사용하는 객관적 상태가 20년간 계속되어야 한다."},{"p":21,"q":"통행지역권의 시효취득에는 요역지 소유자 기타 사용권자가 통로를 개설하여 사용한 상태가 필요하다.","a":"O","e":"판례는 통로 개설과 계속적·표현적 사용상태를 요구한다."},{"p":21,"q":"요역지의 불법점유자도 통행지역권을 시효취득할 수 있다.","a":"X","e":"요역지 소유자 기타 사용권자만 시효취득할 수 있고, 불법점유자는 취득할 수 없다."},{"p":21,"q":"통행지역권을 시효취득한 자는 승역지 소유자가 입은 손해를 배상하여야 할 수 있다.","a":"O","e":"도로 설치 및 사용으로 승역지 소유자에게 손해가 있으면 배상해야 한다고 본다."},{"p":21,"q":"지역권은 유상으로만 설정할 수 있고 무상 또는 영구 지역권은 허용되지 않는다.","a":"X","e":"지역권은 유상·무상 모두 가능하고, 영구·무한의 지역권도 가능하다고 본다."},{"p":21,"q":"지역권의 존속기간과 지료는 반드시 등기하여야 지역권이 성립한다.","a":"X","e":"존속기간이나 지료는 지역권의 성립요건이 아니다. 설정등기는 필요하지만 존속기간·지료 등기는 별개이다."},{"p":21,"q":"지역권자는 승역지 소유자의 사용을 지역권 목적 범위 내에서 제한할 수 있다.","a":"O","e":"지역권은 승역지 이용을 제한하거나 일정 방법으로 사용하는 물권이다."},{"p":21,"q":"승역지 소유자는 지역권의 행사를 방해하지 않을 의무를 부담한다.","a":"O","e":"지역권의 내용 실현을 방해하지 않아야 한다. 침해 시 물권적 청구권이 문제된다."},{"p":21,"q":"지역권에도 물권적 청구권이 인정될 수 있다.","a":"O","e":"지역권 침해 시 방해제거청구나 방해예방청구가 가능하다."},{"p":21,"q":"지역권은 요역지 전부를 위하여 존재하므로 요역지 공유자 1인의 지분만을 위하여 설정할 수 없다.","a":"O","e":"지역권은 요역지의 편익을 위한 권리로서 요역지와 결합한다. 지분만을 위한 독립 설정은 원칙적으로 부정된다."},{"p":21,"q":"요역지가 분할되면 지역권은 원칙적으로 각 부분을 위하여 존속하지만, 그 성질상 일부에만 관한 경우에는 그 일부에 대해서만 존속한다.","a":"O","e":"요역지와 지역권의 부종성에서 나오는 효과이다."},{"p":21,"q":"전세권자는 전세금을 지급하고 타인의 부동산을 점유하여 그 부동산의 용도에 좇아 사용·수익할 수 있다.","a":"O","e":"민법 제303조의 전세권 내용이다. 전세금 지급과 사용·수익권이 핵심이다."},{"p":21,"q":"전세권은 용익물권적 성격만 있고 담보물권적 성격은 없다.","a":"X","e":"전세권은 사용·수익권뿐 아니라 전세금 반환 확보를 위한 경매권과 우선변제권도 가지므로 담보물권적 성격도 있다."},{"p":21,"q":"전세권은 1필 토지의 일부 또는 1동 건물의 일부에도 성립할 수 있다.","a":"O","e":"용익물권은 부동산 일부에도 설정될 수 있다. 전세권도 마찬가지이다."},{"p":21,"q":"전세금 지급은 전세권의 요소이므로 전세금이 없는 전세권은 성립할 수 없다.","a":"O","e":"전세권은 전세금 지급을 전제로 한다. 지상권의 지료와 비교해야 한다."},{"p":21,"q":"전세권 설정에는 전세권 설정계약과 등기가 필요하다.","a":"O","e":"법률행위에 의한 전세권 설정은 물권변동이므로 등기가 필요하다."},{"p":21,"q":"타인의 토지 위 건물에 전세권을 설정한 때에는 그 전세권의 효력은 특별한 사정이 없는 한 건물 소유를 목적으로 한 지상권 또는 임차권에 미친다.","a":"O","e":"민법 제304조는 건물전세권의 효력이 그 건물 소유를 목적으로 한 지상권 또는 임차권에 미친다고 정한다."},{"p":21,"q":"건물전세권이 설정된 경우 전세권설정자는 전세권자의 동의 없이 건물 소유 목적의 지상권 또는 임차권을 소멸하게 하는 행위를 할 수 있다.","a":"X","e":"제304조 제2항에 따라 전세권자의 동의 없이 그 지상권 또는 임차권을 소멸하게 하는 행위를 하지 못한다."},{"p":21,"q":"전세권자에게도 전세권에 기한 물권적 청구권이 인정될 수 있다.","a":"O","e":"전세권 침해 시 전세권자는 점유보호청구권과 별도로 전세권에 기한 물권적 청구권을 행사할 수 있다."},{"p":21,"q":"전세권에는 상린관계 규정이 준용될 수 없다.","a":"X","e":"전세권은 부동산 이용권이므로 전세권자 사이 또는 전세권자와 인지소유자·지상권자 사이에 상린관계 규정이 준용될 수 있다."},{"p":21,"q":"전세권의 존속기간은 10년을 넘지 못하고, 10년을 넘는 약정은 10년으로 단축된다.","a":"O","e":"민법 제312조 제1항이다. 지상권과 달리 전세권에는 최장기간 제한이 있다."},{"p":21,"q":"토지 전세권의 최단존속기간은 1년이다.","a":"X","e":"건물 전세권을 1년 미만으로 정한 때 1년으로 본다. 토지 전세권에는 이러한 최단기간 규정이 없다."},{"p":21,"q":"건물 전세권의 존속기간을 1년 미만으로 정한 때에는 이를 1년으로 한다.","a":"O","e":"건물 전세권에는 최단기간 1년의 보호규정이 있다."},{"p":21,"q":"전세권의 존속기간을 약정하지 않아도 전세권은 유효하게 성립할 수 있다.","a":"O","e":"존속기간 약정은 전세권의 성립요건이 아니다. 기간 약정이 없으면 소멸통고가 문제된다."},{"p":21,"q":"전세권의 존속기간은 반드시 등기하여야 전세권이 성립한다.","a":"X","e":"존속기간 등기는 임의적 등기사항이다. 존속기간 등기가 없어도 전세권은 성립할 수 있다."},{"p":21,"q":"전세권 존속기간에 대한 등기가 없으면 제3자에 대하여 존속기간 약정이 없는 전세권으로 취급될 수 있다.","a":"O","e":"존속기간을 등기해야 제3자에게 대항할 수 있다. 등기가 없으면 기간 약정 없는 전세권처럼 취급된다."},{"p":21,"q":"전세권의 합의갱신은 언제나 20년까지 가능하다.","a":"X","e":"전세권은 최장기간 10년 제한이 있으므로 합의갱신도 10년 이내로 약정해야 한다."},{"p":21,"q":"건물 전세권의 법정갱신은 전세권설정자가 만료 전 6개월부터 1개월 사이에 갱신거절 또는 조건변경 통지를 하지 않은 경우에 문제된다.","a":"O","e":"건물 전세권만 법정갱신이 인정되고, 이 기간 내 통지가 없으면 동일 조건으로 갱신된 것으로 본다."},{"p":21,"q":"토지 전세권도 건물 전세권과 마찬가지로 법정갱신된다.","a":"X","e":"법정갱신은 건물 전세권에 한하여 인정된다."},{"p":21,"q":"건물 전세권이 법정갱신되면 존속기간의 정함이 없는 전세권으로 본다.","a":"O","e":"동일 조건으로 갱신되지만 존속기간은 정함이 없는 것으로 본다."},{"p":21,"q":"건물 전세권의 법정갱신은 등기를 하여야만 전세권설정자나 제3자에게 주장할 수 있다.","a":"X","e":"법정갱신은 법률규정에 의한 물권변동이므로 갱신등기 없이도 전세권설정자나 제3자에게 주장할 수 있다."},{"p":21,"q":"존속기간을 약정하지 않은 전세권은 각 당사자가 언제든지 소멸을 통고할 수 있고, 상대방이 통고를 받은 날부터 6개월이 지나면 소멸한다.","a":"O","e":"민법 제313조의 소멸통고이다."},{"p":21,"q":"존속기간을 약정하지 않은 전세권은 소멸통고 즉시 소멸한다.","a":"X","e":"통고 즉시가 아니라 상대방이 통고를 받은 날부터 6개월이 경과해야 소멸한다."},{"p":21,"q":"전세권자는 전세권설정자의 동의 없이 전세권을 양도하거나 담보로 제공할 수 있는 것이 원칙이다.","a":"O","e":"전세권도 재산권으로서 양도·담보제공 가능하다. 다만 설정행위로 제한할 수 있는 점에서 지상권과 차이가 있다."},{"p":21,"q":"전세권의 양도금지특약은 지상권의 양도금지특약과 마찬가지로 언제나 무효이다.","a":"X","e":"지상권 양도금지특약은 무효이나, 전세권은 민법 제306조에 따라 설정행위로 양도·임대 등을 금지할 수 있다."},{"p":21,"q":"전세권자는 전세목적물을 그 용도에 좇아 사용·수익하여야 한다.","a":"O","e":"전세권자는 목적물의 성질과 용도에 맞게 사용해야 한다. 용법위반은 전세권설정자의 소멸청구 사유가 될 수 있다."},{"p":21,"q":"전세권자가 목적물의 용도에 위반하여 사용하면 전세권설정자는 전세권의 소멸을 청구할 수 있다.","a":"O","e":"전세권자의 용법위반은 전세권소멸청구 사유가 된다."},{"p":21,"q":"전세권이 소멸하면 전세권자는 목적물을 인도하고 전세권설정등기의 말소등기에 필요한 서류를 교부하여야 한다.","a":"O","e":"전세권 소멸 시 전세권자는 목적물 반환 및 말소등기 협력의무를 부담한다."},{"p":21,"q":"전세권설정자는 전세금 반환의무가 있고, 전세권자의 목적물 인도 및 말소등기 의무와 동시이행관계가 문제될 수 있다.","a":"O","e":"임대차보증금을 전세금으로 하여 전세권설정등기를 한 경우 등에서 전세금 반환의무와 말소의무는 동시이행관계로 본다."},{"p":21,"q":"전세권 존속 중 전세목적물이 양도되면 신소유자는 전세권이 소멸할 때 전세금 반환의무를 부담하지 않는다.","a":"X","e":"신소유자는 전세권설정자의 지위를 승계하여 전세권이 소멸하는 때 전세금 반환의무를 부담한다."},{"p":21,"q":"전세권자의 경매청구권은 전세권설정자가 전세금 반환을 지체한 경우 행사할 수 있다.","a":"O","e":"전세권은 전세금 반환 확보를 위해 경매청구권을 가진다. 다만 전세권자는 먼저 목적물 인도와 말소등기서류 제공 등 자기 의무 이행제공을 해야 한다."},{"p":21,"q":"전세권자가 경매를 청구하려면 전세목적물 인도의무 및 전세권설정등기 말소등기서류의 이행제공을 완료하여 전세권설정자를 이행지체에 빠뜨려야 한다.","a":"O","e":"전세권설정자의 전세금 반환의무와 전세권자의 인도·말소협력의무가 서로 관련되기 때문이다."},{"p":21,"q":"전세권자는 전세목적물의 매각대금에서 후순위권리자나 일반채권자보다 전세금의 우선변제를 받을 수 있다.","a":"O","e":"전세권의 담보물권적 효력이다. 전세권과 저당권 상호 간은 등기 선후로 우선순위가 정해진다."},{"p":21,"q":"전세권과 저당권이 충돌하면 언제나 전세권이 저당권보다 우선한다.","a":"X","e":"전세권과 저당권의 우선순위는 등기의 선후에 따른다."},{"p":21,"q":"전세금 반환시기가 도래한 후 경매가 아닌 임의의 방법으로 전세목적물을 처분하여 정산하기로 하는 특약은 무효이다.","a":"X","e":"전세금 반환시기 도래 후 임의처분·정산 특약은 유효할 수 있다."},{"p":21,"q":"전세권은 저당권의 목적이 될 수 있다.","a":"O","e":"전세권은 재산권이므로 저당권의 목적이 될 수 있다."},{"p":21,"q":"전세권에 저당권이 설정된 후 전세권 존속기간이 만료되면 저당권자는 여전히 전세권 자체에 대하여 저당권을 실행하면 된다.","a":"X","e":"전세권 존속기간 만료로 용익물권적 권능이 소멸하면 전세권 자체에 대한 저당권 실행은 곤란하고, 전세금반환채권에 물상대위해야 한다."},{"p":21,"q":"전세권저당권자는 전세권의 존속기간이 만료된 경우 전세금반환채권에 대하여 압류·추심명령 또는 전부명령 등을 받아 물상대위권을 행사할 수 있다.","a":"O","e":"전세권에 갈음하여 존속하는 전세금반환채권에 물상대위권을 행사해야 한다."},{"p":21,"q":"전세권저당권자가 전세금반환채권에 물상대위권을 행사한 경우, 전세권설정자는 전세권자에 대한 반대채권으로 언제나 전세권저당권자에게 상계로 대항할 수 있다.","a":"X","e":"전세금반환채권에 압류 등으로 물상대위권이 행사되면 전세권설정자는 단순히 상계적상이라는 사정만으로 전세권저당권자에게 대항할 수 없다."},{"p":21,"q":"전세권자는 일반채권자에 대해서는 원칙적으로 전세금 우선변제를 받을 수 있다.","a":"O","e":"전세권의 담보물권적 효력이다. 일반채권자보다 우선한다."},{"p":21,"q":"전세권은 부동산의 사용·수익을 목적으로 하므로 동산에는 설정할 수 없다.","a":"O","e":"전세권의 목적물은 부동산이다."},{"p":21,"q":"전세권이 소멸하였음에도 전세권설정자가 전세금을 반환하지 않으면 전세권자는 경매청구와 우선변제권으로 전세금 회수를 도모할 수 있다.","a":"O","e":"전세권의 담보적 기능이다."},{"p":21,"q":"지상권에는 법정갱신이 인정되지 않지만, 건물 전세권에는 법정갱신이 인정될 수 있다.","a":"O","e":"지상권에는 민법상 전세권과 같은 법정갱신 제도가 없다. 건물 전세권만 법정갱신이 문제된다."},{"p":21,"q":"지상권의 양도금지특약은 무효인 반면, 전세권의 양도금지특약은 유효할 수 있다.","a":"O","e":"지상권은 편면적 강행규정으로 양도금지특약이 무효이고, 전세권은 설정행위로 처분제한을 둘 수 있다."},{"p":21,"q":"지상권은 지료 2년 연체가 소멸청구 사유이고, 전세권은 용법위반 등이 소멸청구 사유가 될 수 있다.","a":"O","e":"양자의 소멸청구 사유를 구별해야 한다. 전세권은 전세금 반환 확보 구조가 핵심이다."},{"p":21,"q":"지상권에서는 지상물매수청구권이, 건물 전세권에서는 부속물매수청구권이 문제될 수 있다.","a":"O","e":"지상권 소멸 시 지상물 매수청구권, 건물 전세권 소멸 시 부속물 매수청구권을 비교해야 한다."},{"p":21,"q":"지상권과 전세권의 매수청구권 포기특약은 모두 유효하다.","a":"X","e":"지상권자의 지상물매수청구권 포기특약은 무효이고, 전세권의 부속물매수청구권 포기특약도 강행규정성 때문에 무효로 정리한다."},{"p":22,"q":"담보물권은 피담보채권을 담보하기 위한 권리이므로 원칙적으로 부종성을 가진다.","a":"O","e":"담보물권은 피담보채권의 존재를 전제로 한다. 피담보채권이 무효·불성립이면 담보물권도 원칙적으로 성립하지 않는다."},{"p":22,"q":"피담보채권이 변제·상계·공탁 등으로 소멸하면 담보물권도 원칙적으로 소멸한다.","a":"O","e":"담보물권의 부종성 때문이다. 주된 권리가 소멸하면 종된 담보권도 소멸한다."},{"p":22,"q":"담보물권은 피담보채권과 분리하여 독립적으로 양도할 수 있다.","a":"X","e":"담보물권은 수반성이 있어 피담보채권과 함께 이전한다. 피담보채권과 분리된 담보권 양도는 원칙적으로 허용되지 않는다."},{"p":22,"q":"피담보채권이 양도되면 특별한 사정이 없는 한 그 담보물권도 함께 이전한다.","a":"O","e":"담보물권의 수반성이다. 채권양도에 부수하여 질권·저당권 등도 함께 이전하는 것이 원칙이다."},{"p":22,"q":"담보물권자는 피담보채권 전부를 변제받을 때까지 담보물 전부에 대해 권리를 행사할 수 있다.","a":"O","e":"불가분성이다. 담보목적물의 일부 또는 채권 일부가 변제되더라도 전부 변제 전에는 담보권이 남는다."},{"p":22,"q":"담보목적물 일부가 멸실되면 담보물권은 잔존 부분에는 미치지 않는다.","a":"X","e":"담보물권의 불가분성상 담보목적물 일부 멸실 후에도 잔존 부분 전부가 피담보채권 전부를 담보한다."},{"p":22,"q":"유치권·질권·저당권은 모두 법정담보물권이다.","a":"X","e":"유치권은 법정담보물권이지만, 질권과 저당권은 원칙적으로 약정담보물권이다."},{"p":22,"q":"유치권은 점유를 전제로 하는 담보물권이다.","a":"O","e":"유치권자는 타인의 물건 또는 유가증권을 점유해야 하고, 점유 상실은 유치권 소멸사유가 된다."},{"p":22,"q":"저당권은 목적물의 점유를 이전하지 않는 담보물권이다.","a":"O","e":"저당권은 비점유담보이다. 채무자나 설정자가 목적물을 계속 사용·수익할 수 있다."},{"p":22,"q":"질권은 원칙적으로 목적물의 점유를 이전하는 담보물권이다.","a":"O","e":"동산질권은 질권자가 질물을 점유해야 효력이 유지된다. 다만 권리질권은 성격에 따라 대항요건이 문제된다."},{"p":22,"q":"담보물권의 부종성은 근저당권에서도 언제나 완전하게 관철되어, 피담보채권이 일시적으로 0원이 되면 근저당권은 당연히 소멸한다.","a":"X","e":"근저당권은 계속적 거래관계에서 장래 증감하는 불특정 채권을 담보하므로 확정 전에는 부종성이 완화된다. 일시적으로 채권액이 0이 되어도 당연 소멸하지 않는다."},{"p":22,"q":"담보물권도 원칙적으로 물권이므로 우선변제적 효력을 가진다.","a":"O","e":"질권·저당권은 우선변제권이 핵심이고, 전세권도 담보적 성격이 있다. 유치권은 경매신청권·우선변제권은 없지만 사실상 변제를 강제하는 효력이 있다."},{"p":22,"q":"유치권은 타인의 물건 또는 유가증권에 관하여 생긴 채권이 변제기에 있는 경우 그 물건 또는 유가증권을 유치할 수 있는 권리이다.","a":"O","e":"민법 제320조의 기본 내용이다. 목적물, 견련성, 변제기, 점유가 핵심요건이다."},{"p":22,"q":"자기 소유의 물건에 관하여도 유치권이 성립할 수 있다.","a":"X","e":"유치권의 목적물은 타인의 물건 또는 유가증권이어야 한다. 자기 물건에는 유치권이 성립하지 않는다."},{"p":22,"q":"부동산도 유치권의 목적물이 될 수 있다.","a":"O","e":"유치권의 목적물은 동산·부동산·유가증권이 가능하다. 채권 자체는 유치권 목적물이 아니다."},{"p":22,"q":"채권 자체도 유치권의 목적물이 될 수 있다.","a":"X","e":"유치권의 목적물은 물건 또는 유가증권이다. 채권은 목적물이 될 수 없다."},{"p":22,"q":"유치권이 성립하려면 피담보채권과 목적물 사이에 견련관계가 있어야 한다.","a":"O","e":"채권이 목적물 자체로부터 발생했거나 목적물의 반환청구권과 동일한 법률관계 또는 사실관계에서 발생해야 한다."},{"p":22,"q":"유치권의 피담보채권은 반드시 목적물을 점유한 후에 발생하여야 한다.","a":"X","e":"채권이 점유 전에 발생했더라도 목적물과 견련관계가 있고 이후 적법하게 점유를 취득하면 유치권이 성립할 수 있다."},{"p":22,"q":"목적물에 관하여 생긴 필요비·유익비 상환청구권은 유치권의 피담보채권이 될 수 있다.","a":"O","e":"점유자의 비용상환청구권은 그 물건에 관하여 생긴 채권으로서 유치권의 피담보채권이 될 수 있다."},{"p":22,"q":"공사대금채권은 공사목적물에 관하여 생긴 채권이므로 유치권의 피담보채권이 될 수 있다.","a":"O","e":"건물 신축·수리 공사대금 등은 목적물과 견련성이 인정되는 대표 사례이다."},{"p":22,"q":"임차보증금반환채권은 임차목적물에 관하여 생긴 채권이므로 항상 유치권의 피담보채권이 된다.","a":"X","e":"임차보증금반환채권은 임대차계약에서 발생한 채권이지만 물건 자체에 관하여 생긴 채권으로 보지 않아 유치권 성립이 부정된다."},{"p":22,"q":"임대인이 건물시설을 약정대로 하지 않아 임차인이 입은 손해배상청구권은 유치권의 피담보채권이 될 수 없다.","a":"O","e":"목적물 자체에 관하여 생긴 채권으로 보기 어렵다는 판례 포인트다."},{"p":22,"q":"매매대금채권은 매매목적물에 관하여 생긴 채권이므로 매도인은 언제나 유치권을 주장할 수 있다.","a":"X","e":"매매대금채권에 대해서는 동시이행항변권이 문제될 수 있을 뿐, 유치권의 견련성이 당연히 인정되는 것은 아니다."},{"p":22,"q":"유치권의 피담보채권은 변제기에 있어야 한다.","a":"O","e":"변제기가 도래하지 않은 채권으로는 유치권을 행사할 수 없다."},{"p":22,"q":"유익비상환청구권에 관하여 법원이 상당한 상환기간을 허여한 경우 그 기간 중에는 유치권을 주장할 수 없다.","a":"O","e":"상환기간이 허여되면 아직 변제기가 도래하지 않은 것이므로 유치권 성립이 부정된다."},{"p":22,"q":"유치권자는 목적물을 점유해야 한다.","a":"O","e":"점유는 유치권의 성립 및 존속요건이다. 직접점유뿐 아니라 간접점유도 가능하다."},{"p":22,"q":"유치권자의 점유는 직접점유에 한정되고 간접점유로는 부족하다.","a":"X","e":"유치권의 점유는 직접점유뿐 아니라 간접점유도 가능하다. 단, 점유보조자의 점유는 독립한 점유가 아니다."},{"p":22,"q":"유치권자의 점유는 불법행위로 인한 점유여서는 안 된다.","a":"O","e":"불법행위로 점유를 취득한 경우에는 유치권이 성립하지 않는다."},{"p":22,"q":"절도한 물건을 수리한 자는 수리비 채권을 이유로 유치권을 주장할 수 있다.","a":"X","e":"점유 취득이 불법행위에 기초하면 유치권이 성립하지 않는다."},{"p":22,"q":"유치권 배제 특약은 언제나 무효이다.","a":"X","e":"유치권에 관한 민법 규정은 임의규정으로 보아 유치권 배제 특약이 가능하다."},{"p":22,"q":"임차인이 임대차 종료 시 원상복구 후 명도하기로 약정한 경우, 유익비상환청구권 포기 및 유치권 배제 취지로 볼 수 있다.","a":"O","e":"판례상 원상복구 약정은 유익비상환청구권을 미리 포기한 취지로 보아 유치권 주장을 배척할 수 있다."},{"p":22,"q":"유치권은 등기해야 부동산에 관하여 성립한다.","a":"X","e":"유치권은 법정담보물권으로 점유가 공시방법이고 등기를 요하지 않는다."},{"p":22,"q":"부동산 유치권은 등기 없이도 경매절차의 매수인에게 대항할 수 있다.","a":"O","e":"유치권은 등기 없이 점유를 통해 공시된다. 다만 경매개시결정 기입등기 후 점유취득 등은 별도 문제가 된다."},{"p":22,"q":"유치권자는 피담보채권 전부를 변제받을 때까지 목적물 전부를 유치할 수 있다.","a":"O","e":"유치권의 불가분성이다. 일부 변제 또는 일부 목적물에 대해서도 전부 변제 전에는 유치 가능하다."},{"p":22,"q":"유치권자는 유치물의 과실을 수취하여 다른 채권자보다 먼저 자기 채권의 변제에 충당할 수 있다.","a":"O","e":"유치권자는 과실을 수취하여 우선적으로 변제에 충당할 수 있고, 잔액은 반환해야 한다."},{"p":22,"q":"유치권자는 채무자의 승낙 없이 유치물을 사용·대여·담보제공할 수 있다.","a":"X","e":"유치권자는 보존에 필요한 사용을 제외하고 채무자의 승낙 없이 사용·대여·담보제공하지 못한다."},{"p":22,"q":"유치권자는 유치물 보존에 필요한 범위에서는 채무자의 승낙 없이 사용할 수 있다.","a":"O","e":"보존에 필요한 사용은 허용된다. 그러나 수익적 사용은 소멸청구 사유가 될 수 있다."},{"p":22,"q":"유치권자가 선량한 관리자의 주의의무를 위반하면 채무자는 유치권의 소멸을 청구할 수 있다.","a":"O","e":"선관주의 의무 위반은 유치권 특유의 소멸청구 사유이다."},{"p":22,"q":"유치권자의 무단사용 사실만 있으면 유치권은 채무자의 소멸청구 없이도 당연히 소멸한다.","a":"X","e":"위반사실만으로 당연소멸하지 않고 채무자의 유치권소멸청구권 행사가 있어야 소멸한다."},{"p":22,"q":"채무자는 상당한 담보를 제공하고 유치권의 소멸을 청구할 수 있다.","a":"O","e":"민법 제327조이다. 담보에는 물적담보뿐 아니라 인적담보도 포함될 수 있다."},{"p":22,"q":"유치권 소멸을 위한 상당한 담보는 반드시 물적담보에 한정된다.","a":"X","e":"연대보증 등 인적담보도 상당한 담보가 될 수 있다."},{"p":22,"q":"상당한 담보 제공으로 유치권이 소멸하려면 유치권자의 동의 또는 법원의 판결이 필요하다.","a":"O","e":"채무자가 일방적으로 담보를 제공했다고 하여 곧바로 소멸하는 것이 아니라 소멸청구 절차가 필요하다."},{"p":22,"q":"유치권은 점유의 상실로 소멸한다.","a":"O","e":"점유는 유치권의 존속요건이다. 목적물 점유를 상실하면 원칙적으로 유치권도 소멸한다."},{"p":22,"q":"유치권자가 점유를 침탈당한 경우에도 점유를 상실한 이상 유치권은 언제나 확정적으로 소멸한다.","a":"X","e":"점유침탈의 경우 1년 내 점유물반환청구로 점유를 회수하면 처음부터 유치권이 소멸하지 않은 것으로 본다."},{"p":22,"q":"유치권의 행사는 피담보채권의 소멸시효 진행을 중단시킨다.","a":"X","e":"유치권 행사는 피담보채권의 소멸시효 중단사유가 아니다. 유치 중에도 공사대금 등 피담보채권의 시효는 진행한다."},{"p":22,"q":"유치권 자체는 소멸시효의 대상이 아니지만, 피담보채권은 소멸시효에 걸릴 수 있다.","a":"O","e":"담보물권 자체와 피담보채권을 구별해야 한다. 유치권 행사는 피담보채권의 시효 진행에 영향을 미치지 않는다."},{"p":22,"q":"피담보채권이 소멸시효 완성으로 소멸하면 유치권도 부종성에 따라 소멸한다.","a":"O","e":"담보물권은 피담보채권에 부종한다. 피담보채권이 시효로 소멸하면 유치권도 존속할 수 없다."},{"p":22,"q":"유치권자는 원칙적으로 유치물에 대한 경매를 신청할 수 있다.","a":"O","e":"유치권자에게도 일정한 경매신청권은 인정된다. 다만 질권·저당권과 같은 우선변제권과는 구별된다."},{"p":22,"q":"유치권자는 경매대금에서 당연히 다른 채권자보다 우선변제를 받는다.","a":"X","e":"유치권은 사실상 변제 강제력은 있지만 민법상 당연한 우선변제권은 없다. 과실충당 등과 구별한다."},{"p":22,"q":"유치권자는 유치물의 인도를 거절할 수 있으므로 사실상 강력한 담보적 기능을 가진다.","a":"O","e":"유치권의 핵심은 목적물 반환을 거절하여 변제를 압박하는 데 있다."},{"p":22,"q":"동산질권은 채권자가 채권의 담보로 채무자 또는 제3자로부터 받은 동산을 점유하고 변제를 받을 때까지 유치할 수 있는 권리이다.","a":"O","e":"질권은 점유를 이전받는 약정담보물권이다. 동산질권은 인도가 성립요건이다."},{"p":22,"q":"동산질권 설정에는 질권설정계약만 있으면 되고 목적물 인도는 필요 없다.","a":"X","e":"동산질권은 설정계약과 목적물 인도가 필요하다. 점유 없는 질권은 원칙적으로 성립하지 않는다."},{"p":22,"q":"동산질권자는 질물을 계속 점유하여야 한다.","a":"O","e":"질권의 점유는 성립요건이자 존속요건이다. 질권자가 임의로 질물을 반환하면 질권으로 대항하기 어렵다."},{"p":22,"q":"질권자는 질권설정자에게 질물을 점유시킬 수 있다.","a":"X","e":"질권자는 채무자나 설정자로 하여금 질물을 점유하게 하지 못한다. 점유개정에 의한 질권 설정도 허용되지 않는다."},{"p":22,"q":"점유개정에 의한 동산질권 설정은 유효하다.","a":"X","e":"질권은 질권자가 목적물을 점유하여 공시해야 하므로 점유개정으로는 설정할 수 없다."},{"p":22,"q":"간이인도나 목적물반환청구권 양도에 의한 동산질권 설정은 경우에 따라 가능하다.","a":"O","e":"질권자가 이미 목적물을 점유 중이면 간이인도가 가능하고, 제3자가 점유 중이면 반환청구권 양도 방식도 가능하다."},{"p":22,"q":"질권자는 질물의 과실을 수취하여 다른 채권자보다 먼저 자기 채권의 변제에 충당할 수 있다.","a":"O","e":"질권도 담보권이므로 과실수취 및 충당이 인정된다."},{"p":22,"q":"질권자는 채무자의 승낙 없이 질물을 사용·대여 또는 담보로 제공할 수 있다.","a":"X","e":"보존에 필요한 사용을 제외하고는 채무자의 승낙 없이 사용·대여·담보제공할 수 없다."},{"p":22,"q":"질권자가 질권설정자의 승낙 없이 질물을 사용하면 질권설정자는 질권의 소멸을 청구할 수 있다.","a":"O","e":"질권자도 선관주의의무 및 무단사용금지의무를 부담한다. 위반 시 소멸청구가 가능하다."},{"p":22,"q":"동산질권자는 유치권자와 달리 우선변제권을 가진다.","a":"O","e":"질권은 경매대금에서 우선변제를 받을 수 있는 담보물권이다. 유치권의 단순 유치효와 구별한다."},{"p":22,"q":"질권자는 원칙적으로 질물을 경매하여 우선변제를 받을 수 있다.","a":"O","e":"질권의 실행은 원칙적으로 경매에 의한다. 정당한 이유가 있으면 간이변제충당 허가가 문제될 수 있다."},{"p":22,"q":"유질계약은 원칙적으로 금지된다.","a":"O","e":"변제기 전 질권자가 질물의 소유권을 취득하거나 임의로 처분하기로 하는 약정은 원칙적으로 금지된다."},{"p":22,"q":"변제기 전에 질권자가 변제에 갈음하여 질물의 소유권을 취득하기로 하는 약정은 원칙적으로 유효하다.","a":"X","e":"유질계약 금지에 반한다. 채무자 보호를 위한 규정이다."},{"p":22,"q":"질권자는 피담보채권의 전부 변제를 받을 때까지 질물 전부를 유치할 수 있다.","a":"O","e":"질권의 불가분성이다. 일부 변제가 있어도 전부 변제 전에는 질물 전부를 유치한다."},{"p":22,"q":"질권도 피담보채권과 분리하여 양도할 수 없다.","a":"O","e":"질권은 수반성을 가진다. 피담보채권과 함께 이전한다."},{"p":22,"q":"채권질권 설정은 원칙적으로 질권설정계약과 채권증서 교부만으로 언제나 제3자에게 대항할 수 있다.","a":"X","e":"지명채권 질권은 제3채무자에 대한 통지 또는 승낙 등 대항요건이 필요하다. 채권증서 교부만으로 충분하지 않다."},{"p":22,"q":"지명채권을 목적으로 한 질권은 제3채무자에게 통지하거나 제3채무자가 승낙하여야 제3채무자 기타 제3자에게 대항할 수 있다.","a":"O","e":"채권양도의 대항요건과 유사한 구조다. 확정일자 있는 증서가 필요한 경우도 함께 정리한다."},{"p":22,"q":"채권질권자가 직접 추심하려면 자기 이름으로 할 수 있다.","a":"O","e":"채권질권자는 피담보채권의 변제를 받기 위해 질권의 목적채권을 직접 청구할 수 있다."},{"p":22,"q":"권리질권은 반드시 동산질권 규정만 적용되고 저당권에 관한 규정은 절대 준용될 수 없다.","a":"X","e":"권리질권은 그 성질에 따라 동산질권 규정이 준용되고, 등기·등록 가능한 권리에는 저당권 규정이 준용되는 경우가 있다."},{"p":22,"q":"질권도 목적물의 멸실·훼손·공용징수로 받을 금전 기타 물건에 물상대위할 수 있다.","a":"O","e":"담보물권의 교환가치 파악 기능상 질권자도 물상대위가 가능하다. 지급 또는 인도 전 압류가 필요하다."},{"p":22,"q":"저당권은 채무자 또는 제3자가 점유를 이전하지 않고 채무의 담보로 제공한 부동산 등에서 우선변제를 받는 권리이다.","a":"O","e":"저당권은 비점유담보물권이고 부동산 등이 목적이다."},{"p":22,"q":"저당권자는 저당목적물을 직접 점유·사용할 수 있다.","a":"X","e":"저당권은 비점유담보물권이다. 설정자나 제3취득자가 목적물을 계속 사용·수익할 수 있다."},{"p":22,"q":"저당권 설정에는 원칙적으로 저당권설정계약과 등기가 필요하다.","a":"O","e":"법률행위에 의한 부동산저당권 설정은 물권변동이므로 등기가 성립요건이다."},{"p":22,"q":"장래 발생할 특정 채권도 저당권의 피담보채권이 될 수 있다.","a":"O","e":"피담보채권은 설정 당시 반드시 이미 발생해 있을 필요는 없다. 특정 가능하면 장래채권도 담보 가능하다."},{"p":22,"q":"조건부 채권은 저당권의 피담보채권이 될 수 없다.","a":"X","e":"조건부·기한부 채권도 특정 가능하면 피담보채권이 될 수 있다."},{"p":22,"q":"저당권의 피담보채권은 등기사항으로 특정되어야 한다.","a":"O","e":"저당권은 공시되는 담보권이므로 채권액, 채무자 등 피담보채권의 특정이 중요하다."},{"p":22,"q":"저당권의 효력은 원칙적으로 저당부동산의 부합물과 종물에 미친다.","a":"O","e":"민법 제358조. 특별한 약정이나 법률규정이 없으면 부합물과 종물에 저당권 효력이 미친다."},{"p":22,"q":"저당권 설정 후에 부합된 물건에는 저당권의 효력이 미치지 않는다.","a":"X","e":"저당권 효력은 설정 전후를 불문하고 부합물과 종물에 미친다."},{"p":22,"q":"저당권의 효력은 원칙적으로 저당부동산의 과실에도 압류 전부터 당연히 미친다.","a":"X","e":"과실에는 원칙적으로 미치지 않고 압류 후의 과실에 미친다. 부합물·종물과 구별한다."},{"p":22,"q":"저당권의 효력은 저당부동산에 대한 압류가 있은 후 발생한 과실에 미친다.","a":"O","e":"민법 제359조의 포인트다. 과실은 압류 후부터 저당권 효력이 미친다."},{"p":22,"q":"저당권의 효력이 부합물과 종물에 미친다는 규정은 강행규정이므로 설정행위로 달리 정할 수 없다.","a":"X","e":"저당권 효력 범위 규정은 임의규정적 성격이 있어 설정행위로 달리 정할 수 있다."},{"p":22,"q":"타인 토지 위 건물에 저당권이 설정되면 특별한 사정이 없는 한 건물 소유를 목적으로 한 지상권·전세권·임차권에도 효력이 미친다.","a":"O","e":"주물·종물 법리의 권리 상호 간 확장 적용이다. 건물 이용권에 저당권 효력이 미칠 수 있다."},{"p":22,"q":"저당권의 피담보채권 범위에는 원본, 이자, 위약금, 채무불이행으로 인한 손해배상 및 저당권 실행비용이 포함될 수 있다.","a":"O","e":"민법 제360조. 다만 지연배상은 원칙적으로 1년분 한도가 있다."},{"p":22,"q":"저당권의 피담보채권 중 지연배상은 기간 제한 없이 전부 담보된다.","a":"X","e":"저당권은 원본, 이자 등과 함께 지연배상도 담보하지만, 지연배상은 원칙적으로 이행기 후 1년분에 한한다."},{"p":22,"q":"근저당권의 경우 확정 전까지는 지연배상 1년분 제한이 그대로 적용되어 채권최고액과 관계없이 1년분만 담보된다.","a":"X","e":"근저당권은 채권최고액 범위 안에서 지연손해금도 담보되므로 일반 저당권의 1년분 제한과 구별된다."},{"p":22,"q":"저당권자는 저당물의 멸실·훼손·공용징수로 설정자가 받을 금전 기타 물건에 물상대위할 수 있다.","a":"O","e":"민법 제370조, 제342조 준용. 다만 지급 또는 인도 전에 압류해야 한다."},{"p":22,"q":"저당권자의 물상대위권 행사를 위해서는 보상금 등이 지급 또는 인도된 후에도 언제든지 압류하면 충분하다.","a":"X","e":"물상대위는 목적물의 교환가치가 금전 등으로 바뀐 것에 미치는 것이므로 지급 또는 인도 전에 압류해야 한다."},{"p":22,"q":"화재보험금청구권도 저당권자의 물상대위 대상이 될 수 있다.","a":"O","e":"저당목적물 멸실로 인한 보험금청구권은 목적물의 가치변형물로 보아 물상대위 대상이 된다."},{"p":22,"q":"저당권자는 저당목적물의 소유자가 목적물을 멸실·훼손하게 할 우려가 있는 경우 보전처분을 청구할 수 있다.","a":"O","e":"저당권 침해 예방을 위한 물권적 청구권적 기능이 인정된다."},{"p":22,"q":"저당권자는 저당목적물을 점유하지 않으므로 어떤 경우에도 방해배제청구를 할 수 없다.","a":"X","e":"저당권 자체의 침해 또는 담보가치 침해에 대해서는 방해제거·예방청구가 인정될 수 있다. 단, 반환청구권은 없다."},{"p":22,"q":"저당권자에게는 저당목적물 반환청구권이 인정된다.","a":"X","e":"저당권은 점유를 수반하지 않으므로 반환청구권은 인정되지 않는다. 방해제거·예방청구와 구별한다."},{"p":22,"q":"저당권의 실행은 원칙적으로 경매에 의한다.","a":"O","e":"저당권자는 담보권 실행경매로 우선변제를 받는다."},{"p":22,"q":"저당권은 채무자 소유 부동산에만 설정할 수 있고 제3자 소유 부동산에는 설정할 수 없다.","a":"X","e":"물상보증인이 자기 부동산을 타인의 채무 담보로 제공할 수 있다."},{"p":22,"q":"물상보증인은 채무자가 아니지만 자기 재산으로 타인의 채무를 담보하는 자이다.","a":"O","e":"물상보증인은 채무를 부담하지 않고 담보물로만 책임진다. 보증인과 구별한다."},{"p":22,"q":"제3취득자는 저당권 설정 후 저당목적물의 소유권·지상권·전세권 등을 취득한 자로서 경매로 권리를 상실할 우려가 있는 자이다.","a":"O","e":"제3취득자는 변제·경매 참여·비용상환 등 특별한 지위가 있다."},{"p":22,"q":"저당물의 제3취득자는 피담보채권 변제기 전이라도 언제든지 채무를 변제하고 저당권 말소를 청구할 수 있다.","a":"X","e":"변제기 전 변제는 채권자의 기한이익을 침해할 수 있으므로 제3취득자는 변제기 도래 전에는 말소청구를 할 수 없다."},{"p":22,"q":"저당물의 제3취득자는 제360조 범위의 금액을 변제하고 저당권 소멸을 청구할 수 있다.","a":"O","e":"제3취득자의 대위변제권이다. 지연배상은 일반 저당권에서 원칙적으로 1년분 범위가 문제된다."},{"p":22,"q":"저당물의 소유권을 취득한 제3자는 담보권 실행 경매에서 경락인이 될 수 있다.","a":"O","e":"제3취득자도 경매절차에서 매수인이 될 수 있다."},{"p":22,"q":"저당물의 제3취득자는 필요비·유익비에 대해 매각대금에서 우선상환을 받을 수 있다.","a":"O","e":"저당물 보존·개량을 위한 필요비·유익비에 대해 일정한 우선상환이 인정된다."},{"p":22,"q":"토지와 그 지상건물이 동일인 소유였다가 토지 또는 건물에 설정된 저당권 실행으로 소유자가 달라지면 일정한 경우 법정지상권이 성립한다.","a":"O","e":"민법 제366조 법정지상권이다. 토지와 건물의 동일소유, 저당권 설정, 경매로 소유자 분리 등이 핵심이다."},{"p":22,"q":"법정지상권이 성립하려면 저당권 설정 당시 토지 위에 건물이 존재해야 한다.","a":"O","e":"저당권 설정 당시 건물이 존재하고 토지와 건물이 동일인 소유여야 한다."},{"p":22,"q":"저당권 설정 당시 나대지였으나 이후 건물이 신축된 경우, 저당권 실행으로 토지와 건물 소유자가 달라지면 민법 제366조 법정지상권이 당연히 성립한다.","a":"X","e":"제366조 법정지상권은 저당권 설정 당시 건물이 존재해야 한다. 나대지 설정 후 신축건물에는 원칙적으로 성립하지 않는다."},{"p":22,"q":"토지에 저당권이 설정될 당시 토지와 건물의 소유자가 동일해야 법정지상권 성립이 문제된다.","a":"O","e":"동일소유 요건이 핵심이다. 처음부터 소유자가 다르면 제366조 법정지상권은 성립하지 않는다."},{"p":22,"q":"건물에만 저당권이 설정된 경우에는 법정지상권이 성립할 수 없다.","a":"X","e":"건물 저당권 실행으로 건물과 토지 소유자가 달라져도 제366조 법정지상권이 문제될 수 있다."},{"p":22,"q":"법정지상권은 등기하여야만 성립한다.","a":"X","e":"법정지상권은 법률규정에 의해 성립하므로 등기 없이 성립한다. 다만 처분하려면 등기가 필요하다."},{"p":22,"q":"법정지상권자는 지료를 지급하여야 하는 것이 원칙이다.","a":"O","e":"법정지상권은 무상권리가 아니다. 지료는 당사자 협의 또는 법원 결정으로 정한다."},{"p":22,"q":"법정지상권의 지료가 확정되지 않았더라도 법정지상권은 성립할 수 있다.","a":"O","e":"지료 확정은 성립요건이 아니다. 법정지상권 성립 후 지료가 정해질 수 있다."},{"p":22,"q":"법정지상권 성립 후 지료를 2년 이상 지급하지 않으면 토지소유자는 지상권소멸청구를 할 수 있다.","a":"O","e":"법정지상권에도 지료 2년 연체에 따른 소멸청구가 문제될 수 있다."},{"p":22,"q":"같은 채권의 담보로 수개의 부동산 위에 저당권을 설정할 수 있다.","a":"O","e":"공동저당이다. 하나의 채권을 여러 부동산이 담보한다."},{"p":22,"q":"공동저당에서 각 부동산은 피담보채권 전부를 담보한다.","a":"O","e":"담보물권의 불가분성 및 공동저당의 구조상 각 부동산은 채권 전부를 담보한다."},{"p":22,"q":"공동저당 목적물이 동시에 배당되는 경우 각 부동산의 매각대금에 비례하여 채권을 분담시킨다.","a":"O","e":"동시배당에서는 각 부동산 가액에 비례해 부담부분을 정한다. 후순위권자 보호와 연결된다."},{"p":22,"q":"공동저당 목적물 중 일부가 먼저 경매된 경우, 저당권자는 그 매각대금에서 피담보채권 전액을 변제받을 수 없다.","a":"X","e":"이시배당에서는 선경매 부동산 매각대금에서 전액 변제받을 수 있다. 다만 후순위저당권자의 대위가 문제된다."},{"p":22,"q":"공동저당 목적물 중 일부가 먼저 경매되어 저당권자가 전액 변제를 받은 경우, 그 부동산의 후순위저당권자는 다른 공동저당 목적물에 대해 선순위저당권자를 대위할 수 있다.","a":"O","e":"민법 제368조 제2항의 후순위저당권자 대위이다. 후순위자의 기대를 보호한다."},{"p":22,"q":"공동저당에서 후순위저당권자의 대위는 채무자 소유 부동산 사이에서만 문제되고 물상보증인 소유 부동산이 있으면 언제나 배제된다.","a":"X","e":"물상보증인 소유 부동산이 공동저당에 포함된 경우에는 변제자대위, 후순위자 보호가 복잡하게 조정된다. 언제나 배제되는 것은 아니다."},{"p":22,"q":"공동저당에서 후순위저당권자 대위권은 선순위저당권자의 채권이 전액 변제된 경우에 문제된다.","a":"O","e":"선순위저당권자가 한 부동산에서 전액 변제받음으로써 다른 부동산의 부담이 없어지는 경우 후순위자가 대위한다."},{"p":22,"q":"공동저당 목적물 중 일부의 후순위저당권자는 선순위자가 동시에 배당을 받았다면 자신이 배당받을 수 있었던 한도에서 대위한다.","a":"O","e":"대위 범위는 동시배당이었다면 보호받을 수 있었던 범위로 제한된다."},{"p":22,"q":"근저당권은 계속적인 거래관계에서 발생·소멸하는 불특정 채권을 일정한 최고액 한도에서 담보하는 저당권이다.","a":"O","e":"근저당권은 채권최고액과 결산기까지의 불특정채권 담보가 핵심이다."},{"p":22,"q":"근저당권의 피담보채권은 설정 당시 반드시 확정되어 있어야 한다.","a":"X","e":"근저당권은 장래 증감·변동하는 불특정 채권을 담보하므로 설정 당시 확정되어 있을 필요가 없다."},{"p":22,"q":"근저당권은 채권최고액 범위 내에서 원본·이자·지연손해금 등을 담보한다.","a":"O","e":"근저당은 채권최고액이 책임한도다. 채권최고액 범위 안에서 부대채권도 담보된다."},{"p":22,"q":"근저당권의 채권최고액은 원본만의 한도이고 이자와 지연손해금은 최고액을 초과하여 담보된다.","a":"X","e":"채권최고액은 원본뿐 아니라 이자·지연손해금 등을 포함한 책임한도이다."},{"p":22,"q":"근저당권은 피담보채권 확정 전에는 부종성이 완화된다.","a":"O","e":"확정 전 일시적으로 채권이 없어도 근저당권은 장래 발생 채권을 위해 존속할 수 있다."},{"p":22,"q":"근저당권 피담보채권 확정 후에는 일반 저당권과 유사하게 부종성이 강하게 작용한다.","a":"O","e":"확정 후에는 특정된 피담보채권의 존재·소멸에 따라 근저당권도 좌우된다."},{"p":22,"q":"근저당권의 피담보채권이 확정되기 전에도 채무자는 언제나 확정청구 없이 일부 채무만 변제하고 근저당권 일부 말소를 청구할 수 있다.","a":"X","e":"근저당권은 최고액 범위에서 계속거래 채권을 담보하므로 확정 전 단순 일부변제만으로 일부 말소를 청구할 수 있는 것은 아니다."},{"p":22,"q":"근저당권의 확정은 채무자 또는 근저당권설정자의 파산, 경매신청 등 일정한 사유로 발생할 수 있다.","a":"O","e":"거래종료, 확정기 도래, 경매신청 등으로 근저당권의 피담보채권은 확정될 수 있다."},{"p":22,"q":"근저당권이 확정되면 그 후에 발생한 채권은 원칙적으로 그 근저당권에 의해 담보되지 않는다.","a":"O","e":"확정시점에 피담보채권이 특정되기 때문이다. 확정 후 새로 발생한 채권은 원칙적으로 포함되지 않는다."},{"p":22,"q":"근저당권 양도에는 피담보채권 이전과 함께 근저당권 이전등기가 필요하다.","a":"O","e":"근저당권도 물권이므로 이전등기가 필요하고, 채권과 담보권의 수반관계도 고려한다."},{"p":22,"q":"유치권은 법정담보물권이고, 질권·저당권은 원칙적으로 약정담보물권이다.","a":"O","e":"담보물권의 발생원인을 비교하는 기본 지문이다."},{"p":22,"q":"유치권과 질권은 모두 점유를 전제로 하지만, 저당권은 점유를 전제로 하지 않는다.","a":"O","e":"유치권·동산질권은 점유가 핵심이고, 저당권은 비점유담보이다."},{"p":22,"q":"유치권과 질권은 모두 우선변제권을 가진다.","a":"X","e":"질권은 우선변제권이 있으나 유치권은 당연한 우선변제권이 없다. 유치권은 인도거절로 사실상 담보한다."},{"p":22,"q":"질권과 저당권은 모두 물상대위가 가능하다.","a":"O","e":"담보물의 가치가 금전 등으로 바뀐 경우 지급·인도 전 압류를 통해 물상대위할 수 있다."},{"p":22,"q":"유치권자의 유치권 행사는 피담보채권의 시효를 중단시키지만, 저당권 실행은 피담보채권 시효와 무관하다.","a":"X","e":"유치권 행사는 피담보채권 시효를 중단시키지 않는다. 저당권도 피담보채권의 소멸에 부종한다."},{"p":22,"q":"담보물권은 피담보채권의 소멸로 소멸한다는 점에서 부종성을 가진다.","a":"O","e":"유치권·질권·저당권 공통 원칙이다. 근저당권은 확정 전 부종성이 완화되는 점을 함께 기억한다."},{"p":22,"q":"저당권은 점유를 수반하지 않으므로, 목적물의 교환가치만 지배하고 사용가치는 설정자에게 남겨둔다.","a":"O","e":"저당권의 사회적 기능이다. 설정자는 저당목적물을 계속 사용·수익할 수 있다."},{"p":22,"q":"유치권은 등기 없이 점유로 공시되고, 저당권은 등기로 공시된다.","a":"O","e":"공시방법 비교다. 부동산 유치권은 등기 없이 점유가 공시기능을 한다."},{"p":22,"q":"점유개정은 동산 소유권 양도와 동산질권 설정 모두에서 허용된다.","a":"X","e":"동산 소유권 양도에서는 점유개정이 가능하나, 동산질권 설정에서는 점유개정이 허용되지 않는다."},{"p":22,"q":"저당권의 효력은 부합물·종물에는 전후 불문 미치지만, 과실에는 압류 후부터 미친다.","a":"O","e":"저당권 효력 범위에서 가장 빈출되는 비교 지문이다."},{"p":23,"q":"채권의 목적은 반드시 금전적 가치가 있는 급부에 한정된다.","a":"X","e":"채권의 목적은 작위·부작위 등 급부이면 충분하고, 타인을 위해 기도하거나 아이를 돌보는 약정처럼 금전적 가액으로 산정하기 어려운 급부도 채권의 목적이 될 수 있다."},{"p":23,"q":"채권은 특정인에게 일정한 급부를 청구할 수 있는 권리이므로 대인권·상대권의 성질을 가진다.","a":"O","e":"채권은 특정 채무자에 대한 급부청구권이다. 물권처럼 누구에게나 주장하는 대세권이 아니라 원칙적으로 특정 상대방에게 주장하는 권리다."},{"p":23,"q":"채권의 목적도 확정성, 가능성, 적법성, 사회적 타당성을 갖추어야 한다.","a":"O","e":"채권의 목적도 법률행위 목적 일반 요건과 연결된다. 불확정·불능·위법·반사회적 급부를 목적으로 하면 효력이 제한된다."},{"p":23,"q":"채권의 목적은 반드시 물건의 인도에 한정되고, 부작위는 채권의 목적이 될 수 없다.","a":"X","e":"채권의 목적은 물건 인도뿐 아니라 행위, 부작위, 금전 지급 등 다양한 급부가 가능하다."},{"p":23,"q":"특정물채권이란 특정물의 인도를 목적으로 하는 채권을 말한다.","a":"O","e":"예컨대 특정 아파트 101동 102호 인도를 목적으로 하는 채권은 특정물채권이다."},{"p":23,"q":"특정물과 종류물의 구별은 언제나 물건의 객관적 성질만으로 결정된다.","a":"X","e":"특정물·종류물 구별은 당사자의 주관적 의사에 따른다. 같은 물건도 당사자가 개별적으로 지정했는지, 종류와 수량만 지정했는지에 따라 달라진다."},{"p":23,"q":"종류채권도 채무자가 이행에 필요한 준비를 완료하거나 채권자의 동의를 얻어 목적물을 지정하면 특정된다.","a":"O","e":"종류채권은 특정 전에는 불특정물이지만, 이행준비 완료 또는 채권자 동의에 의한 지정으로 특정물이 된다."},{"p":23,"q":"특정물채무자는 목적물을 인도할 때까지 선량한 관리자의 주의로 보존하여야 한다.","a":"O","e":"특정물채무자의 선관주의의무는 이행기까지만이 아니라 실제 인도할 때까지 계속된다."},{"p":23,"q":"특정물채무자의 선관주의의무는 이행기가 도래하면 당연히 종료한다.","a":"X","e":"주의의무는 이행기가 아니라 인도시까지 계속된다. 이행기 후에도 물건을 보관하고 있다면 선관주의가 요구된다."},{"p":23,"q":"특정물 인도의무자는 이행기의 현상대로 그 물건을 인도하면 된다.","a":"O","e":"특정물채권에서는 목적물을 이행기의 현상대로 인도하는 것이 원칙이다."},{"p":23,"q":"특정물채권에서 이행기 이후에 발생한 과실은 채무자가 취득한다.","a":"X","e":"특정물채권에서 이행기 이후의 과실은 채권자에게 인도하여야 한다."},{"p":23,"q":"특정물채무자가 선관주의의무를 다하였음에도 목적물이 멸실된 경우, 원칙적으로 채무불이행책임을 지지 않는다.","a":"O","e":"채무불이행책임은 고의·과실 등 귀책사유가 필요하다. 선관주의를 다했음을 입증하면 손해배상의무를 면할 수 있다."},{"p":23,"q":"특정물채무에서 변제장소는 특별한 사정이 없으면 채권성립 당시 그 물건이 있던 장소이다.","a":"O","e":"특정물의 인도는 채권성립 당시 물건 소재지가 원칙적 변제장소가 된다."},{"p":23,"q":"종류채권은 인도할 물건의 종류와 수량은 정해져 있으나, 그 종류 중 어느 물건을 인도할지는 아직 특정되지 않은 채권이다.","a":"O","e":"시멘트 10포대, 경유 20리터처럼 종류와 수량으로 정한 채권이 대표적이다."},{"p":23,"q":"종류채권에서 품질에 관한 특약이 없고 법률행위 성질이나 당사자 의사로 품질을 정할 수 없으면 채무자는 최상등품으로 이행하여야 한다.","a":"X","e":"이 경우 채무자는 중등품질의 물건으로 이행하면 된다."},{"p":23,"q":"소비대차로 발생한 종류채권에서는 처음 받은 물건과 동일한 품질의 물건을 반환하는 것이 원칙이다.","a":"O","e":"소비대차·소비임치의 반환채무는 처음 받은 물건과 같은 종류·품질·수량의 반환이 문제된다."},{"p":23,"q":"종류채권은 특정 전이라도 그 종류 전체가 사회적으로 존재하는 한 이행불능이 쉽게 인정되지 않는다.","a":"O","e":"종류물은 원칙적으로 조달 가능성이 남아 있으므로 단순히 채무자가 가진 물건이 멸실되었다고 곧바로 불능이 되는 것은 아니다."},{"p":23,"q":"종류채권이 특정되면 그 이후에는 특정물채권과 유사하게 취급될 수 있다.","a":"O","e":"특정 후에는 인도대상이 개별화되므로 목적물 위험, 보존의무, 과실 귀속 등에서 특정물채권 법리가 문제된다."},{"p":23,"q":"금전채권은 일정한 수량으로 표시된 화폐가치를 목적으로 하는 채권이다.","a":"O","e":"금전채권의 목적은 특정 지폐 그 자체가 아니라 일정한 화폐가치다."},{"p":23,"q":"금전은 원칙적으로 점유와 소유가 일치하므로 금전을 점유한 자는 그 금전의 소유권을 취득한다.","a":"O","e":"금전은 유통성이 강하므로 통상 점유와 소유를 일치시킨다."},{"p":23,"q":"금전채권자는 특정 지폐에 대한 소유권에 기하여 물권적 반환청구권을 행사하는 것이 원칙이다.","a":"X","e":"금전채권자는 화폐가치의 반환을 청구할 뿐, 원칙적으로 특정 지폐 자체의 물권적 반환을 청구하지 않는다."},{"p":23,"q":"금전채무는 이행불능이 성립하지 않고, 불이행은 이행지체 문제로 처리된다.","a":"O","e":"금전은 조달가능성이 전제되므로 금전채무의 불이행은 원칙적으로 지체만 문제된다."},{"p":23,"q":"금전채무 불이행으로 인한 손해배상에서 채권자는 손해를 증명하여야 하고, 채무자는 과실 없음을 항변할 수 있다.","a":"X","e":"금전채무 불이행 손해배상에서는 채권자가 손해를 증명할 필요가 없고, 채무자는 과실 없음을 항변하지 못한다."},{"p":23,"q":"금전채무 불이행의 손해배상액은 법정이율에 의하되, 법령 제한에 위반하지 않는 약정이율이 있으면 그 약정이율에 의한다.","a":"O","e":"금전채무 지체손해금은 법정이율이 원칙이나 유효한 약정이율이 있으면 그 이율을 따른다."},{"p":23,"q":"외화채권의 목적이 다른 나라 통화인 경우 채무자는 특별한 약정이 없으면 그 나라의 각 종류의 통화 중 선택하여 변제할 수 있다.","a":"O","e":"외화채권에서는 그 외국 통화로 지급하되, 같은 나라 통화의 종류 선택은 채무자에게 인정된다."},{"p":23,"q":"어느 통화로 지급할 채권에서 그 통화가 변제기에 강제통용력을 잃은 때에는 채무자는 언제나 변제의무를 면한다.","a":"X","e":"강제통용력을 잃으면 다른 통화 등으로 변제해야 하는 문제가 생길 뿐, 곧바로 채무가 소멸하는 것은 아니다."},{"p":23,"q":"이자채권은 원본채권에 종속하는 종된 권리의 성질을 가진다.","a":"O","e":"원본채권이 소멸하면 이자채권도 원칙적으로 함께 문제된다. 다만 이미 발생한 이자 등은 별도 검토가 필요하다."},{"p":23,"q":"선택채권에서 선택권자는 특별한 약정이 없으면 채권자이다.","a":"X","e":"선택채권의 선택권은 원칙적으로 채무자에게 있다. 약정이나 법률로 달리 정할 수 있다."},{"p":23,"q":"선택채권에서 선택이 이루어지면 급부는 선택된 것으로 특정된다.","a":"O","e":"선택권 행사로 여러 급부 중 하나가 확정되어 그 급부를 이행할 채무가 된다."},{"p":23,"q":"확정기한부 채무는 기한이 도래한 때부터 지체책임이 발생한다.","a":"O","e":"확정한 기한이 있으면 별도 최고 없이 그 기한 도래시부터 지체책임을 진다."},{"p":23,"q":"불확정기한부 채무는 기한이 객관적으로 도래하면 채무자가 알지 못해도 바로 지체책임을 진다.","a":"X","e":"불확정기한의 경우 채무자는 기한이 도래함을 안 때부터 지체책임을 진다."},{"p":23,"q":"이행기의 정함이 없는 채무는 채권자의 이행청구를 받은 때부터 지체책임이 발생한다.","a":"O","e":"기한이 없는 채무는 이행청구를 받은 때부터 지체가 된다."},{"p":23,"q":"채무자가 이행기에 이행하지 않았더라도 이행이 불가능하지 않고 이행 가능성이 있으면 이행지체가 문제될 수 있다.","a":"O","e":"이행지체는 이행이 가능함에도 기한에 이행하지 않는 경우다."},{"p":23,"q":"이행불능은 이행이 가능함에도 채무자가 이행을 지체하는 경우를 말한다.","a":"X","e":"이행불능은 채무의 이행이 사회통념상 불가능하게 된 경우다. 이행 가능성이 남아 있으면 지체가 문제된다."},{"p":23,"q":"채무불이행책임은 채무자의 고의 또는 과실이 없으면 원칙적으로 성립하지 않는다.","a":"O","e":"민법 제390조는 채무자의 고의·과실 없이 이행할 수 없게 된 때에는 손해배상책임을 지지 않는다고 한다."},{"p":23,"q":"채무자는 자기에게 과실이 없었다는 점을 주장·입증하여 채무불이행책임을 면할 수 있는 경우가 있다.","a":"O","e":"채무불이행에서는 채무자의 귀책사유가 문제되고, 채무자는 면책사유를 주장할 수 있다. 단 금전채무 지체는 무과실 항변이 제한된다."},{"p":23,"q":"채무불이행에 따른 손해배상청구는 계약해제와 양립할 수 없으므로, 해제를 하면 손해배상청구는 할 수 없다.","a":"X","e":"계약해제는 손해배상청구에 영향을 미치지 않는다. 해제와 손해배상은 병존 가능하다."},{"p":23,"q":"이행지체를 이유로 계약을 해제하려면 원칙적으로 상당한 기간을 정하여 최고하고 그 기간 내 이행이 없어야 한다.","a":"O","e":"이행지체 해제는 원칙적으로 최고 후 상당기간 내 불이행이 필요하다. 예외적 무최고 해제는 별도 사유가 있어야 한다."},{"p":23,"q":"채무자가 미리 이행하지 않을 의사를 명백히 표시한 경우에도 채권자는 반드시 최고를 해야만 해제할 수 있다.","a":"X","e":"이행거절 등 최고가 무의미한 경우에는 최고 없이 해제가 인정될 수 있다."},{"p":23,"q":"이행불능이 채무자의 책임 있는 사유로 발생하면 채권자는 손해배상을 청구할 수 있다.","a":"O","e":"후발적 불능이 채무자 귀책사유로 발생하면 이행불능에 따른 손해배상책임이 성립한다."},{"p":23,"q":"이행불능이 채무자의 책임 없는 사유로 발생하면 채무자는 원칙적으로 손해배상책임을 지지 않는다.","a":"O","e":"고의·과실 없이 이행할 수 없게 된 때에는 손해배상책임을 지지 않는다."},{"p":23,"q":"불완전이행은 채무자가 이행을 하였으나 채무내용에 좇은 완전한 이행이 아닌 경우에 문제된다.","a":"O","e":"불완전이행은 하자 있는 이행, 부수의무 위반 등 완전하지 않은 이행에 관한 채무불이행 유형이다."},{"p":23,"q":"손해배상은 원칙적으로 금전배상을 기준으로 한다.","a":"O","e":"민법상 손해배상은 원상회복이 아니라 금전배상이 원칙이다."},{"p":23,"q":"채무불이행으로 인한 손해배상은 통상손해뿐 아니라 특별손해도 언제나 전부 배상하여야 한다.","a":"X","e":"통상손해는 원칙적으로 배상되지만 특별손해는 채무자가 그 사정을 알았거나 알 수 있었을 때에 한해 배상된다."},{"p":23,"q":"특별한 사정으로 인한 손해는 채무자가 그 사정을 알았거나 알 수 있었을 때에 한하여 배상책임이 인정된다.","a":"O","e":"특별손해 배상에는 예견가능성이 요구된다."},{"p":23,"q":"채무불이행 손해배상에서 상당인과관계 없는 손해도 채무불이행이 있었으면 모두 배상된다.","a":"X","e":"손해배상 범위는 채무불이행과 상당인과관계 있는 손해로 한정된다."},{"p":23,"q":"채무불이행에 관하여 채권자에게 과실이 있으면 법원은 손해배상의 책임 및 금액을 정함에 이를 참작하여야 한다.","a":"O","e":"과실상계는 채권자의 과실을 손해배상 책임·금액 산정에 반영하는 제도다."},{"p":23,"q":"과실상계는 채무불이행이나 불법행위 손해배상뿐 아니라 본래의 급부청구에도 그대로 적용된다.","a":"X","e":"과실상계는 손해배상에서 문제되는 제도이지, 채무의 내용에 따른 본래 급부청구에는 적용될 성질이 아니다."},{"p":23,"q":"손해배상액의 예정이 있는 경우에도 법원은 과실상계를 적용하여 당연히 예정액을 감액하여야 한다.","a":"X","e":"손해배상액 예정에는 과실상계가 그대로 적용되지 않는다. 다만 예정액이 부당히 과다하면 법원이 감액할 수 있다."},{"p":23,"q":"채무불이행으로 채권자에게 손해와 동시에 이익이 발생하고 그 이익이 채무불이행과 상당인과관계가 있으면 손익상계가 문제된다.","a":"O","e":"손익상계는 손해 발생과 동시에 생긴 이익을 손해배상범위에서 공제하는 제도다."},{"p":23,"q":"위약금 약정은 특별한 사정이 없으면 손해배상액의 예정으로 추정된다.","a":"O","e":"민법은 위약금을 손해배상액의 예정으로 추정한다. 위약벌로 보려면 별도 사정이 필요하다."},{"p":23,"q":"손해배상액의 예정이 부당히 과다한 경우 법원은 적당히 감액할 수 있다.","a":"O","e":"예정액이 과도하면 법원이 감액할 수 있다. 이는 손해배상액 예정의 대표적 통제장치다."},{"p":23,"q":"손해배상액의 예정이 있으면 실제 손해가 전혀 없어도 언제나 전액을 청구할 수 있고 법원도 감액할 수 없다.","a":"X","e":"예정액이 부당히 과다하면 법원이 감액할 수 있다."},{"p":23,"q":"근로계약에서는 손해배상액의 예정을 정할 수 없다.","a":"O","e":"근로자 보호를 위해 근로계약에서 손해배상 예정은 금지된다."},{"p":23,"q":"물품 제조·납품계약의 지체상금 약정은 특별한 사정이 없으면 손해배상액의 예정으로 추정된다.","a":"O","e":"지체상금은 통상 지체손해에 대한 손해배상액 예정으로 본다."},{"p":23,"q":"계약상 채무불이행에 관한 손해배상액 예정은 그 계약과 관련된 불법행위 손해까지 당연히 예정한 것으로 본다.","a":"X","e":"계약 당시 손해배상액 예정은 원칙적으로 계약상 채무불이행 손해에 관한 것이지 관련 불법행위 손해까지 당연히 포함하지 않는다."},{"p":23,"q":"채권자가 채권의 목적인 물건 또는 권리의 가액 전부를 손해배상으로 받으면 채무자는 그 물건 또는 권리에 관하여 당연히 채권자를 대위한다.","a":"O","e":"손해배상자의 대위는 전부배상 후 목적물 또는 권리에 대한 이해관계를 조정하는 제도다."},{"p":23,"q":"손해배상자의 대위는 채무자가 목적물 가액의 일부만 배상한 경우에도 항상 전부에 대하여 발생한다.","a":"X","e":"자료상 포인트는 채권자가 물건 또는 권리의 가액 전부를 손해배상으로 받은 때 당연히 대위한다는 것이다."},{"p":23,"q":"변제는 채무의 내용에 좇은 급부를 실현하여 채권을 소멸시키는 행위이다.","a":"O","e":"변제는 채무의 이행을 의미하고, 적법한 변제가 있으면 채권은 소멸한다."},{"p":23,"q":"변제는 반드시 채무자 본인만 할 수 있고 제3자는 변제할 수 없다.","a":"X","e":"원칙적으로 제3자도 변제할 수 있다. 다만 채무의 성질상 제3자 변제가 허용되지 않거나 당사자 의사에 반하는 경우 등은 제한된다."},{"p":23,"q":"채무의 성질상 제3자의 변제가 허용되지 않는 경우에는 제3자 변제가 제한된다.","a":"O","e":"가수의 공연, 특정인의 노무처럼 채무자 본인의 급부가 중요한 경우 제3자 변제가 허용되지 않을 수 있다."},{"p":23,"q":"이해관계 없는 제3자는 채무자의 의사에 반하여 변제할 수 없는 경우가 있다.","a":"O","e":"이해관계 없는 제3자의 변제는 채무자의 의사에 반하면 제한된다. 반면 이해관계 있는 제3자는 보호 필요성이 크다."},{"p":23,"q":"변제수령권한 없는 자에게 한 변제는 언제나 절대적으로 무효이고 채권자에게 아무 효과도 생길 수 없다.","a":"X","e":"수령권 없는 자에 대한 변제도 채권자가 이익을 받은 한도 등 일정한 경우 효과가 문제될 수 있다. '언제나 아무 효과 없음'은 과장된 지문이다."},{"p":23,"q":"채권의 준점유자에 대한 변제는 변제자가 선의이며 과실이 없는 경우 유효할 수 있다.","a":"O","e":"채권자처럼 보이는 자에게 변제한 경우 거래안전 보호를 위해 선의·무과실이면 변제효가 인정될 수 있다."},{"p":23,"q":"영수증을 소지한 자는 언제나 적법한 변제수령권자이므로 변제자는 악의라도 보호된다.","a":"X","e":"영수증 소지 등은 수령권 외관을 만들 수 있으나 변제자 보호에는 선의·무과실 등 요건이 문제된다. 악의자는 보호되지 않는다."},{"p":23,"q":"채권자가 변제를 받지 않거나 받을 수 없는 때에는 채무자는 변제공탁으로 채무를 면할 수 있는 경우가 있다.","a":"O","e":"채권자의 수령거절·수령불능 등에서는 변제공탁이 채무면책수단이 될 수 있다."},{"p":23,"q":"변제공탁을 하면 언제나 채무 전부가 소멸하고, 공탁요건의 흠은 문제되지 않는다.","a":"X","e":"공탁은 요건을 갖추어야 변제효가 인정된다. 요건 없는 공탁은 채무소멸효가 부정될 수 있다."},{"p":23,"q":"채무의 일부 변제만으로는 원칙적으로 채권자가 전부 변제를 거절할 수 있는 경우가 있다.","a":"O","e":"채권자는 채무내용에 좇은 완전한 이행을 받을 권리가 있으므로 일부이행을 거절할 수 있는 경우가 있다."},{"p":23,"q":"채무자가 원본, 이자, 비용을 모두 부담하는 경우 변제충당 문제가 생길 수 있다.","a":"O","e":"변제액이 전부를 충족하지 못하면 비용·이자·원본 등 충당 순서가 문제된다."},{"p":23,"q":"변제충당에서 비용·이자·원본이 있는 경우 특별한 사정이 없으면 원본부터 먼저 충당한다.","a":"X","e":"일반적으로 비용, 이자, 원본 순서로 충당하는 구조를 기억한다."},{"p":23,"q":"채권양도는 채권의 동일성을 유지하면서 채권을 이전하는 것이다.","a":"O","e":"채권양도는 채권 자체가 동일성을 유지한 채 양도인에서 양수인에게 이전하는 제도다."},{"p":23,"q":"채권은 원칙적으로 양도할 수 있으나, 성질상 양도가 허용되지 않는 채권은 양도할 수 없다.","a":"O","e":"일신전속적 채권 등은 채권 성질상 양도가 제한될 수 있다."},{"p":23,"q":"당사자가 반대의 의사를 표시한 경우 채권양도는 제한될 수 있으나, 그 특약은 선의의 제3자에게 대항하지 못하는 경우가 있다.","a":"O","e":"양도금지특약은 당사자 사이에서 효력이 문제되지만, 거래안전을 위해 선의의 제3자 보호가 문제된다."},{"p":23,"q":"지명채권양도는 채무자에게 통지하거나 채무자가 승낙하지 않으면 채무자 기타 제3자에게 대항하지 못한다.","a":"O","e":"통지 또는 승낙이 대항요건이다."},{"p":23,"q":"지명채권양도에서 채무자의 승낙은 반드시 확정일자 있는 증서로 해야만 채무자에게 대항할 수 있다.","a":"X","e":"채무자에 대한 대항은 통지 또는 승낙으로 가능하다. 확정일자는 채무자 이외의 제3자에 대한 대항에서 중요하다."},{"p":23,"q":"채무자 이외의 제3자에게 지명채권양도를 대항하려면 확정일자 있는 증서에 의한 통지 또는 승낙이 필요하다.","a":"O","e":"복수 양도 등 제3자 관계에서는 확정일자 있는 통지·승낙이 중요하다."},{"p":23,"q":"채무인수는 채무가 동일성을 유지하면서 채무자가 변경되는 제도이다.","a":"O","e":"채무인수에서는 채무 내용은 유지되고 채무자 지위가 이전 또는 추가된다."},{"p":23,"q":"면책적 채무인수가 유효하게 되면 원채무자는 채무를 면한다.","a":"O","e":"면책적 인수는 신채무자가 채무를 부담하고 원채무자는 면책되는 구조다."},{"p":23,"q":"병존적 채무인수에서는 인수인이 채무를 부담하더라도 원채무자는 당연히 면책된다.","a":"X","e":"병존적 인수는 원채무자와 인수인이 함께 부담하는 구조이므로 원채무자는 면책되지 않는다."},{"p":23,"q":"채무불이행 책임에서 채권자에게 손해가 없다면 손해배상청구는 원칙적으로 문제되지 않는다.","a":"O","e":"손해배상은 손해 발생을 전제로 한다. 다만 금전채무 지체처럼 손해증명 특칙이 있는 경우와 구별한다."},{"p":23,"q":"채무자의 귀책사유와 손해 사이에는 상당인과관계가 필요하다.","a":"O","e":"손해배상책임은 귀책 있는 불이행과 손해 사이의 상당인과관계를 요구한다."},{"p":23,"q":"채무자가 이행보조자를 사용한 경우, 이행보조자의 고의·과실은 채무자의 책임으로 귀속될 수 있다.","a":"O","e":"채무자는 이행보조자를 통해 이행하는 위험을 부담하므로 이행보조자의 과실에 대해 책임질 수 있다."},{"p":23,"q":"채무자가 법정대리인을 통해 채무를 이행하는 경우 법정대리인의 과실은 채무자에게 귀속될 수 없다.","a":"X","e":"법정대리인·이행보조자의 고의·과실은 채무자 책임과 연결될 수 있다."},{"p":23,"q":"채권자가 수령을 지체하면 채무자의 책임이 완화되거나 위험부담 문제가 달라질 수 있다.","a":"O","e":"채권자지체는 수령거절·수령불능 등으로 채무이행이 방해되는 경우이며, 채무자 책임·위험부담에 영향을 준다."},{"p":23,"q":"채권자지체가 성립하려면 채무자의 적법한 이행제공이 문제된다.","a":"O","e":"채권자가 수령을 거절하려면 채무자가 채무내용에 맞는 이행제공을 해야 채권자지체가 성립할 수 있다."},{"p":23,"q":"채권자가 수령을 거절하면 채무자는 아무 조치 없이 언제나 채무를 면한다.","a":"X","e":"수령거절만으로 채무가 곧바로 소멸하는 것은 아니다. 공탁 등 면책수단이 필요할 수 있다."},{"p":23,"q":"이행제공은 현실제공이 원칙이나, 채권자가 미리 수령을 거절하거나 협력이 필요한 경우 구두제공으로 충분한 경우가 있다.","a":"O","e":"현실제공이 원칙이지만, 채권자 협력 필요나 명백한 수령거절 등에서는 구두제공이 문제된다."},{"p":23,"q":"채무자가 이행제공을 하면 그때부터 지체책임을 면할 수 있다.","a":"O","e":"적법한 이행제공은 채무자의 지체책임을 차단하는 효과가 있다."},{"p":23,"q":"쌍무계약에서 상대방이 동시이행항변권을 가지는 경우, 자신의 이행제공 없이 상대방의 이행지체를 주장하기 어렵다.","a":"O","e":"동시이행관계에서는 자기 채무의 이행제공이 있어야 상대방 지체를 문제 삼을 수 있다."},{"p":23,"q":"채무불이행으로 인한 손해배상청구권은 채권의 본래적 효력과 별개로 채무불이행의 효과로 발생한다.","a":"O","e":"채무불이행이 있으면 본래 급부청구와 별도로 손해배상청구권이 발생할 수 있다."},{"p":23,"q":"이행지체 중에 목적물이 불가항력으로 멸실된 경우에도 지체와 관계없이 채무자는 언제나 면책된다.","a":"X","e":"이행지체 중에는 지체책임으로 인해 위험이 가중될 수 있다. '언제나 면책'은 틀린 표현이다."},{"p":23,"q":"채무자가 지체 중이더라도 불능이 채권자의 귀책사유로 발생한 경우에는 채무자의 책임이 제한될 수 있다.","a":"O","e":"불능 발생 원인과 귀책관계에 따라 책임이 조정된다."},{"p":23,"q":"채무불이행에 따른 손해배상은 이행이익 배상을 기본으로 한다.","a":"O","e":"계약이 제대로 이행되었더라면 얻었을 이익을 배상시키는 것이 채무불이행 손해배상의 기본 구조다."},{"p":23,"q":"계약체결상의 과실책임은 채무불이행책임과 달리 신뢰이익 배상이 문제된다.","a":"O","e":"원시적 불능 등 계약체결상 과실은 신뢰이익 배상으로 정리하고, 채무불이행은 이행이익 배상과 비교된다."},{"p":23,"q":"채무불이행으로 인한 손해배상에서는 채권자가 입은 모든 정신적 손해가 언제나 당연히 배상된다.","a":"X","e":"정신적 손해도 요건과 상당인과관계가 필요하다. '언제나 당연히'는 틀린 함정 표현이다."},{"p":23,"q":"채무불이행이 있더라도 채권자가 손해 확대를 방지할 수 있었는데 방치한 사정은 손해배상액 산정에서 고려될 수 있다.","a":"O","e":"손해의 공평한 분담 관점에서 채권자의 과실, 손해확대 방지 가능성 등이 참작될 수 있다."},{"p":23,"q":"손해배상액 예정은 채무불이행 발생 전 미리 손해액을 정해 분쟁을 줄이는 기능을 한다.","a":"O","e":"예정액 제도는 손해액 입증곤란과 분쟁을 줄이기 위한 장치다."},{"p":23,"q":"손해배상액 예정이 있으면 채권자는 실제 손해액을 입증하지 않아도 예정액을 청구할 수 있는 것이 원칙이다.","a":"O","e":"예정액이 있으면 실제 손해액 증명 부담이 완화된다. 단 과다한 경우 감액될 수 있다."},{"p":23,"q":"위약벌은 손해배상액의 예정과 달리 제재벌 성격을 가지므로, 위약금 약정이 위약벌로 인정되는지는 별도 판단이 필요하다.","a":"O","e":"민법은 위약금을 손해배상액 예정으로 추정하므로 위약벌로 보려면 문언·경위 등 별도 사정이 필요하다."},{"p":23,"q":"채무자가 일부 이행을 하였다는 사정은 손해배상범위 산정에서 전혀 고려될 수 없다.","a":"X","e":"일부 이행, 손익, 채권자 과실 등은 손해액 산정에서 고려될 수 있다."},{"p":23,"q":"채권의 목적이 특정물인 경우 채무자는 선관주의를 다했음을 입증하면 이행불능 손해배상책임을 면할 수 있다.","a":"O","e":"특정물 채무자의 선관주의의무 위반이 없으면 귀책 없는 불능으로 볼 수 있다."},{"p":23,"q":"채권의 목적이 종류물인 경우 채무자가 보유하던 물건이 멸실되면 곧바로 이행불능이 된다.","a":"X","e":"종류채권은 특정 전에는 동일 종류 물건을 조달해 이행할 수 있으므로 보유물 멸실만으로 곧바로 불능이 아니다."},{"p":23,"q":"제한종류채권은 일정 범위 안의 종류물만 목적이 되므로 그 범위 전체가 멸실하면 이행불능이 문제될 수 있다.","a":"O","e":"일정 창고의 쌀처럼 범위가 제한된 경우 그 한정된 범위 전체 멸실 시 불능이 문제된다."},{"p":23,"q":"채권자지체가 있으면 채무자는 고의 또는 중대한 과실이 없는 한 책임이 제한될 수 있다.","a":"O","e":"채권자 수령지체는 채무자 책임을 완화하는 효과가 있다."},{"p":23,"q":"채권자지체 중에는 채무자가 목적물 보존을 위해 지출한 비용상환 문제가 생길 수 있다.","a":"O","e":"채권자의 수령지체로 보존비가 증가하면 비용상환 문제가 생긴다."},{"p":23,"q":"채무불이행책임과 불법행위책임은 언제나 서로 배척되어 하나만 성립한다.","a":"X","e":"하나의 사실관계에서 요건을 갖추면 채무불이행책임과 불법행위책임이 경합할 수 있다."},{"p":23,"q":"채무불이행 손해배상청구권이 성립하면 채권자는 별도 요건 없이 언제나 계약을 해제할 수 있다.","a":"X","e":"손해배상과 해제는 별개다. 해제에는 이행지체 최고 등 해제 요건이 필요하다."},{"p":23,"q":"채무불이행으로 인한 계약해제는 원칙적으로 소급효가 있으나, 손해배상청구에는 영향을 미치지 않는다.","a":"O","e":"해제는 계약관계를 소급적으로 해소하지만 손해배상청구는 별도로 유지될 수 있다."},{"p":23,"q":"계속적 계약의 해지는 장래효가 원칙이다.","a":"O","e":"해지는 계속적 법률관계를 장래를 향해 소멸시키는 것이 원칙이다."},{"p":23,"q":"이행불능이 채권자 책임 있는 사유로 발생한 때에는 채무자의 반대급부청구권 등 위험부담 문제가 생긴다.","a":"O","e":"불능 원인이 채권자에게 있으면 위험부담상 채무자의 반대급부청구가 문제될 수 있다."},{"p":23,"q":"금전채권의 경우 채무자가 가난해져 지급할 수 없게 되면 법률상 이행불능이 성립한다.","a":"X","e":"금전채무는 조달가능성을 전제로 하므로 지급능력 부족은 법률상 이행불능이 아니라 지체 문제다."},{"p":23,"q":"채권자에게 과실이 있으면 법원은 직권으로 과실상계를 참작할 수 있다.","a":"O","e":"과실상계는 손해의 공평한 분담을 위한 제도라 법원이 참작한다."},{"p":23,"q":"손익상계에서 공제되는 이익은 채무불이행과 상당인과관계가 있는 이익이어야 한다.","a":"O","e":"우연히 생긴 이익이 아니라 손해 발생 원인과 상당인과관계 있는 이익을 공제한다."},{"p":23,"q":"채무불이행 손해배상에서 통상손해와 특별손해의 구별은 손해배상범위 판단에 중요하다.","a":"O","e":"통상손해는 일반적으로 발생하는 손해이고, 특별손해는 특별사정 및 예견가능성이 필요하다."},{"p":23,"q":"채무자가 채무 내용에 좇은 이행을 하지 아니한 때에는 귀책사유 유무와 무관하게 항상 손해배상책임을 진다.","a":"X","e":"민법 제390조는 고의·과실 없이 이행할 수 없게 된 때에는 책임지지 않는다고 한다."},{"p":23,"q":"이행보조자의 고의·과실을 채무자의 고의·과실로 보는 것은 채무자가 이행과정을 지배·이용한다는 점과 관련된다.","a":"O","e":"채무자는 자신이 선택·사용한 이행보조자를 통해 이행상 이익을 얻으므로 그 위험도 부담한다."},{"p":23,"q":"채권총론에서 금전채권, 종류채권, 특정물채권은 채무불이행 판단에서 서로 다른 함정을 만든다.","a":"O","e":"금전채권은 지체만, 종류채권은 특정 전 불능 제한, 특정물채권은 선관주의·현상인도·과실귀속이 핵심 함정이다."},{"p":24,"q":"채권자대위권은 채권자가 자기의 채권을 보전하기 위하여 채무자의 제3자에 대한 권리를 채무자를 갈음하여 행사하는 권리이다.","a":"O","e":"채권자대위권은 책임재산 보전을 위한 제도다. 채권자가 채무자의 권리를 대신 행사하여 채무자의 재산을 보전한다."},{"p":24,"q":"채권자대위권은 채권자가 채무자의 권리를 자기의 권리로 취득하는 제도이다.","a":"X","e":"대위행사로 권리 자체가 채권자에게 이전되는 것은 아니다. 행사효과는 원칙적으로 채무자에게 귀속된다."},{"p":24,"q":"채권자대위권의 피보전채권 존재 여부는 법원의 직권조사사항이다.","a":"O","e":"피보전채권이 없으면 대위권 자체가 성립하지 않으므로 법원이 직권으로 조사한다."},{"p":24,"q":"채권자의 피보전채권이 소멸한 경우에도 이미 대위소송을 제기하였다면 대위소송은 계속 적법하다.","a":"X","e":"피보전채권이 소멸하면 보전 필요성이 사라져 대위권 행사의 기초가 없어진다."},{"p":24,"q":"채권자대위권의 행사를 위해서는 원칙적으로 채권자의 채권을 보전할 필요성이 있어야 한다.","a":"O","e":"대위권은 채권보전을 위한 제도이므로 보전 필요성이 핵심 요건이다."},{"p":24,"q":"금전채권을 보전하기 위한 채권자대위권은 원칙적으로 채무자의 무자력이 요구된다.","a":"O","e":"금전채권은 일반책임재산으로 만족을 얻으므로, 채무자가 무자력이어야 보전 필요성이 인정된다."},{"p":24,"q":"부동산 소유권이전등기청구권 같은 특정채권을 보전하기 위한 대위권 행사에도 채무자의 무자력이 항상 필요하다.","a":"X","e":"특정채권 보전을 위한 대위권은 그 특정권리 실현을 위한 것이므로 채무자의 무자력을 요건으로 하지 않는 경우가 있다."},{"p":24,"q":"채권자가 자기의 소유권이전등기청구권을 보전하기 위하여 채무자가 방치한 등기청구권을 대위행사하는 경우, 채무자의 무자력은 원칙적으로 필요하지 않다.","a":"O","e":"특정채권 보전을 위한 대위권의 대표 예시다."},{"p":24,"q":"채권자대위권은 채무자가 스스로 권리를 행사하고 있는 경우에도 언제나 행사할 수 있다.","a":"X","e":"대위권은 채무자가 권리를 행사하지 않는 경우에 인정된다. 채무자가 이미 적절히 권리를 행사 중이면 대위 필요성이 없다."},{"p":24,"q":"채무자가 제3채무자에 대한 권리를 행사하지 않아야 채권자대위권 행사가 문제된다.","a":"O","e":"채무자의 권리 불행사가 대위권 행사의 전제가 된다."},{"p":24,"q":"채권자대위권의 피대위권리는 채무자의 일신전속권이어도 무방하다.","a":"X","e":"일신에 전속한 권리는 대위행사할 수 없다."},{"p":24,"q":"부양청구권이나 행사상 일신전속권은 원칙적으로 채권자대위권의 대상이 될 수 없다.","a":"O","e":"권리자의 인격·신분과 밀접한 권리는 타인이 대신 행사할 수 없다."},{"p":24,"q":"채권자는 자기 채권의 기한이 도래하기 전에는 원칙적으로 법원의 허가 없이 채권자대위권을 행사하지 못한다.","a":"O","e":"피보전채권의 변제기가 도래하지 않은 때에는 원칙적으로 법원의 허가가 필요하다."},{"p":24,"q":"채권자는 피보전채권의 변제기가 도래하기 전이라도 보전행위는 법원의 허가 없이 할 수 있다.","a":"O","e":"보전행위는 긴급성과 보전 필요 때문에 법원 허가 없이도 가능하다."},{"p":24,"q":"채권자대위권은 반드시 재판상으로만 행사하여야 하므로 재판 외 행사는 불가능하다.","a":"X","e":"채권자대위권은 재판상뿐 아니라 재판 외에서도 행사할 수 있다. 채권자취소권과 구별된다."},{"p":24,"q":"채권자대위권은 채권자취소권과 달리 재판 외 행사도 가능하다.","a":"O","e":"채권자취소권은 소로써 행사해야 하지만, 채권자대위권은 재판 외 행사도 가능하다."},{"p":24,"q":"채권자대위권은 채무자의 책임재산을 보전하기 위한 제도이므로, 행사효과는 원칙적으로 채무자에게 귀속된다.","a":"O","e":"대위행사는 채권자가 하지만 권리의 귀속주체는 채무자다."},{"p":24,"q":"채권자가 대위권을 행사하면 제3채무자는 채무자에게 항변할 수 있었던 사유를 채권자에게도 주장할 수 있다.","a":"O","e":"대위채권자는 채무자의 권리를 행사하는 지위이므로 제3채무자는 채무자에게 대항할 수 있는 항변을 주장할 수 있다."},{"p":24,"q":"채권자대위권 행사에서 제3채무자는 채권자 개인에 대한 항변만 주장할 수 있고, 채무자에 대한 항변은 주장할 수 없다.","a":"X","e":"대위행사는 채무자의 권리 행사이므로 제3채무자는 채무자에 대한 항변을 대위채권자에게 주장할 수 있다."},{"p":24,"q":"채권자가 채권자대위권을 행사하였다는 통지를 받은 후에는 채무자는 그 권리를 처분하여 채권자에게 대항하지 못한다.","a":"O","e":"대위권 행사 통지를 받은 후 채무자의 처분은 대위채권자에게 대항할 수 없다."},{"p":24,"q":"채무자는 채권자대위권 행사 통지를 받은 후에도 그 피대위권리를 자유롭게 처분하여 대위채권자에게 대항할 수 있다.","a":"X","e":"통지 후 처분을 대위채권자에게 대항하게 하면 대위제도의 실효성이 사라진다."},{"p":24,"q":"채권자대위권은 채무자의 권리를 보전하기 위한 것이므로, 채권자의 채권액을 초과하는 범위에서도 무제한 행사할 수 있다.","a":"X","e":"대위권 행사는 보전 필요 범위와 관련된다. 무제한 행사가 허용되는 것은 아니다."},{"p":24,"q":"채권자대위권은 채권자의 채권을 보전하기 위하여 필요한 범위에서 행사되어야 한다.","a":"O","e":"대위권은 책임재산 보전수단이지 채권자에게 일반관리권을 주는 제도가 아니다."},{"p":24,"q":"금전채권자가 채무자의 금전채권을 대위행사하는 경우, 채권자는 제3채무자에게 직접 자기에게 이행할 것을 청구할 수 있다.","a":"O","e":"실무상 금전 지급 등은 직접 청구가 가능하다. 다만 수령한 이익은 채무자의 책임재산 보전이라는 구조에서 이해해야 한다."},{"p":24,"q":"채권자대위권 행사로 채권자가 수령한 금전은 당연히 그 채권자에게만 귀속되고 다른 채권자와 관계없이 독점한다.","a":"X","e":"대위권은 공동담보 보전을 위한 제도다. 수령 자체와 별개로 우선변제권을 당연히 취득하는 것은 아니다."},{"p":24,"q":"채권자대위권은 채권자의 채권이 금전채권인 경우에만 행사할 수 있고 특정채권 보전을 위해서는 행사할 수 없다.","a":"X","e":"특정채권 보전을 위한 대위권 행사도 가능하다. 대표적으로 소유권이전등기청구권 보전을 위한 대위가 있다."},{"p":24,"q":"채권자대위권에서 채권자의 피보전채권은 원칙적으로 대위행사 당시 존재하여야 한다.","a":"O","e":"피보전채권이 있어야 보전할 권리가 있기 때문이다."},{"p":24,"q":"피대위권리가 압류금지채권이거나 양도금지 성격의 권리라면 대위행사 가능성이 제한될 수 있다.","a":"O","e":"대위행사 대상은 채무자가 행사할 수 있는 재산권이어야 하며, 성질상 행사 제한이 있는 권리는 대위도 제한된다."},{"p":24,"q":"채권자대위권에서 피대위권리는 반드시 채권이어야 하고 물권적 청구권은 대위행사할 수 없다.","a":"X","e":"채무자의 권리라면 요건을 갖추어 물권적 청구권 등도 대위행사 대상이 될 수 있다."},{"p":24,"q":"채권자는 채무자를 대위하여 등기청구권을 행사할 수 있다.","a":"O","e":"등기청구권은 특정채권 보전이나 책임재산 보전을 위해 대위행사되는 대표적 권리다."},{"p":24,"q":"채권자취소권은 채무자가 채권자를 해하는 재산처분행위를 한 경우 이를 취소하고 원상회복하여 공동담보를 보전하는 권리이다.","a":"O","e":"채권자취소권의 목적은 채무자의 책임재산 보전이다."},{"p":24,"q":"채권자취소권은 채무자의 모든 행위를 취소할 수 있는 일반적 감독권이다.","a":"X","e":"재산권을 목적으로 하는 사해행위가 대상이다. 채무자의 모든 행위를 취소할 수 있는 것은 아니다."},{"p":24,"q":"채권자취소권은 채권자대위권과 달리 원칙적으로 재판상 행사하여야 한다.","a":"O","e":"채권자취소권은 소로써 행사해야 하는 형성권이다."},{"p":24,"q":"채권자취소권은 단순한 항변으로도 행사할 수 있고 소송을 제기할 필요가 없다.","a":"X","e":"채권자취소권은 재판상 행사, 즉 소로써 행사하는 것이 원칙이다."},{"p":24,"q":"채권자취소권은 형성권의 성질을 가진다.","a":"O","e":"사해행위를 취소하는 법률효과를 발생시키는 권리이므로 형성권으로 본다."},{"p":24,"q":"채권자취소권의 피보전채권은 원칙적으로 금전채권이어야 한다.","a":"O","e":"채권자취소권은 공동담보 보전을 위한 제도이므로 원칙적으로 금전채권 보전에 적합하다."},{"p":24,"q":"매수인의 소유권이전등기청구권 같은 특정채권 보전을 위해서도 채권자취소권을 행사할 수 있다.","a":"X","e":"채권자취소권은 원칙적으로 특정채권의 보전이나 실현을 위해 행사할 수 없다."},{"p":24,"q":"제1매수인은 자신의 소유권이전등기청구권을 보전하기 위하여 제2매매에 대해 채권자취소권을 행사할 수 없다.","a":"O","e":"소유권이전등기청구권은 특정채권이므로 채권자취소권의 피보전채권으로 삼을 수 없다."},{"p":24,"q":"채권자취소권의 피보전채권은 원칙적으로 사해행위 전에 발생하여야 한다.","a":"O","e":"사해행위 당시 이미 보호할 채권이 있는 것이 원칙이다."},{"p":24,"q":"사해행위 후에 발생한 채권은 어떠한 경우에도 채권자취소권의 피보전채권이 될 수 없다.","a":"X","e":"원칙은 사해행위 전 발생이지만, 사해행위 당시 채권성립의 기초가 되는 법률관계가 있고 가까운 장래 성립할 고도의 개연성이 있으며 실제 성립한 경우 예외가 인정될 수 있다."},{"p":24,"q":"사해행위 당시 채권 성립의 기초가 되는 법률관계가 이미 존재하고 가까운 장래 채권이 성립할 고도의 개연성이 있으며 실제로 성립한 경우, 그 채권도 피보전채권이 될 수 있다.","a":"O","e":"장래채권의 예외적 보호 요건이다."},{"p":24,"q":"채권자취소권은 채권자의 채권 변제기가 도래한 경우에만 행사할 수 있다.","a":"X","e":"채권을 보전할 필요가 있으면 변제기 도래 여부와 무관하게 행사할 수 있다."},{"p":24,"q":"채권자취소권은 채권자의 채권을 보전할 필요성이 있으면 그 채권의 변제기 도래 여부를 불문하고 행사할 수 있다.","a":"O","e":"대위권의 기한 전 행사 제한과 구별된다."},{"p":24,"q":"채권자취소권이 성립하려면 채무자의 사해행위로 공동담보가 부족하게 되거나 이미 부족한 상태가 심화되어야 한다.","a":"O","e":"책임재산 감소와 공동담보 부족이 사해성 판단의 핵심이다."},{"p":24,"q":"채무자가 재산을 처분하였더라도 채권자취소권 행사 당시 채무자가 자력을 회복하여 채권자를 해하지 않게 되면 취소권은 문제되지 않는다.","a":"O","e":"행사 당시 보전 필요성이 없으면 채권자취소권은 소멸한다."},{"p":24,"q":"사해행위 후 채무자가 자력을 회복하였더라도 사해행위 당시 무자력이었으면 채권자취소권은 언제나 행사할 수 있다.","a":"X","e":"행사 당시 채권자를 해하지 않게 되면 책임재산 보전 필요성이 없어져 취소권 행사가 제한된다."},{"p":24,"q":"채권자취소권에서 채무자의 악의란 채권자를 해함을 아는 것을 의미하고, 적극적으로 채권자를 해할 목적까지 요구되는 것은 아니다.","a":"O","e":"사해의사는 공동담보 부족을 인식하는 정도로 충분하다."},{"p":24,"q":"채권자취소권 성립에는 채무자가 채권자를 해할 적극적 의욕이나 목적을 가져야 한다.","a":"X","e":"채권자를 해함을 알면 충분하고 해할 목적까지 필요하지 않다."},{"p":24,"q":"수익자 또는 전득자가 선의이면 그 사람을 상대로 채권자취소권을 행사할 수 없다.","a":"O","e":"취소와 원상회복은 악의의 수익자 또는 전득자를 상대로 문제된다."},{"p":24,"q":"채권자취소권은 수익자나 전득자의 선의·악의를 불문하고 언제나 행사할 수 있다.","a":"X","e":"수익자 또는 전득자가 선의이면 그를 상대로 취소권 행사가 제한된다."},{"p":24,"q":"채권자취소권의 상대방은 원칙적으로 수익자 또는 전득자이고, 채무자를 반드시 피고로 삼아야 하는 것은 아니다.","a":"O","e":"사해행위취소소송의 피고는 수익자 또는 전득자다. 채무자는 필수 피고가 아니다."},{"p":24,"q":"사해행위취소소송에서는 채무자를 반드시 피고로 삼아야 한다.","a":"X","e":"채무자는 사해행위의 당사자이나 취소소송의 피고는 수익자 또는 전득자다."},{"p":24,"q":"채권자취소권은 채무자의 재산권을 목적으로 한 법률행위에 대하여 행사한다.","a":"O","e":"신분행위나 비재산적 행위는 대상이 아니다."},{"p":24,"q":"혼인, 이혼, 입양 등 신분행위도 채권자를 해하면 채권자취소권의 대상이 된다.","a":"X","e":"채권자취소권의 대상은 재산권을 목적으로 한 법률행위다. 신분행위는 대상이 아니다."},{"p":24,"q":"사실행위는 원칙적으로 채권자취소권의 대상이 아니다.","a":"O","e":"취소권은 법률행위를 대상으로 한다."},{"p":24,"q":"채권자취소권의 대상은 법률행위뿐 아니라 채무자의 모든 사실행위까지 포함한다.","a":"X","e":"법률행위 취소제도이므로 사실행위 일반을 대상으로 하지 않는다."},{"p":24,"q":"채무초과 상태의 채무자가 유일한 부동산을 타인에게 증여하면 특별한 사정이 없는 한 사해행위가 될 수 있다.","a":"O","e":"무상처분은 공동담보 감소가 명백하여 사해성이 강하다."},{"p":24,"q":"채무초과 상태의 채무자가 유일한 재산을 매각하여 소비하기 쉬운 금전으로 바꾸는 행위는 상당한 가격이라도 사해행위가 될 수 있다.","a":"O","e":"부동산을 금전화하면 은닉·소비가 쉬워 공동담보가 위험해질 수 있다."},{"p":24,"q":"채무자가 유일한 부동산을 상당한 가격으로 매도하면 언제나 사해행위가 아니다.","a":"X","e":"상당가격 매매라도 금전 은닉·소비 가능성, 변제 사용 여부 등 사정에 따라 사해행위가 될 수 있다."},{"p":24,"q":"채무자가 기존채무를 변제하는 행위는 원칙적으로 채무의 본지에 따른 이행이므로 사해행위가 되지 않는 것이 원칙이다.","a":"O","e":"정당한 기존채무 변제는 원칙적으로 사해행위가 아니다. 다만 통모 등 특별사정이 있으면 달라질 수 있다."},{"p":24,"q":"채무자가 일부 채권자와 통모하여 다른 채권자를 해할 의사로 변제한 경우에도 기존채무 변제이므로 사해행위가 될 수 없다.","a":"X","e":"통모하여 다른 채권자를 해하는 경우에는 사해행위가 문제될 수 있다."},{"p":24,"q":"채무자가 채무초과 상태에서 특정 채권자에게 담보를 제공하면 다른 채권자의 공동담보를 감소시키므로 사해행위가 될 수 있다.","a":"O","e":"담보제공은 특정 채권자에게 우선권을 주어 일반채권자의 공동담보를 해할 수 있다."},{"p":24,"q":"채무초과 상태에서 특정 채권자에게 근저당권을 설정하여 준 행위는 어떤 경우에도 사해행위가 될 수 없다.","a":"X","e":"특정 채권자에게 담보를 제공하면 공동담보가 감소할 수 있어 사해행위가 문제된다."},{"p":24,"q":"수급인의 저당권설정청구권 행사에 따라 도급인이 저당권을 설정하는 행위는 그 입법취지상 사해행위에 해당하지 않는다고 본다.","a":"O","e":"민법 제666조의 수급인 보호 취지를 고려한 판례 포인트다."},{"p":24,"q":"수급인의 저당권설정청구권 행사에 따른 도급인의 저당권 설정은 언제나 채권자를 해하는 담보제공이므로 사해행위이다.","a":"X","e":"수급인의 저당권설정청구권은 법이 인정한 보호수단이므로 사해행위로 보지 않는다."},{"p":24,"q":"채권양도행위 자체가 사해행위가 아닌 경우, 그 대항요건을 갖추기 위한 양도통지만을 따로 채권자취소권의 대상으로 삼을 수 없다.","a":"O","e":"양도통지는 채무자 보호를 위한 대항요건일 뿐, 원인행위가 사해가 아니면 독립된 취소 대상이 아니다."},{"p":24,"q":"채권양도행위가 사해행위가 아니더라도 채권양도 통지는 언제나 채권자취소권의 대상이 된다.","a":"X","e":"원인행위가 사해가 아니면 대항요건인 통지만 별도로 취소할 수 없다."},{"p":24,"q":"통정허위표시로 무효인 법률행위도 사해행위에 해당하면 채권자취소권의 대상이 될 수 있다.","a":"O","e":"허위표시로 무효인 행위라도 외형상 책임재산을 감소시키면 사해행위취소 대상이 될 수 있다."},{"p":24,"q":"통정허위표시로 무효인 행위는 이미 무효이므로 사해행위취소권의 대상이 될 수 없다.","a":"X","e":"무효행위라도 외형상 재산이 이전된 상태를 회복할 필요가 있으면 취소권 대상이 될 수 있다."},{"p":24,"q":"채무자의 재산분할이 상당한 정도를 벗어나 과대하면 그 초과 부분은 사해행위가 될 수 있다.","a":"O","e":"이혼에 따른 재산분할은 원칙적으로 사해행위가 아니지만 상당성을 벗어난 과대분은 취소 대상이 될 수 있다."},{"p":24,"q":"이혼에 따른 재산분할은 신분행위와 관련되므로 아무리 과대하여도 채권자취소권의 대상이 될 수 없다.","a":"X","e":"상당한 범위의 재산분할은 보호되지만, 과대하여 채권자를 해하는 부분은 사해행위가 될 수 있다."},{"p":24,"q":"상속포기는 재산권을 목적으로 한 법률행위가 아니라 신분행위적 성질이 강하므로 채권자취소권의 대상이 되지 않는다고 본다.","a":"O","e":"상속포기는 채권자취소권의 대상이 되지 않는 대표 포인트로 정리한다."},{"p":24,"q":"채무자가 상속을 포기하여 책임재산이 줄어들면 채권자는 당연히 채권자취소권으로 상속포기를 취소할 수 있다.","a":"X","e":"상속포기는 채권자취소권의 대상이 되지 않는다."},{"p":24,"q":"상속재산분할협의는 재산권을 목적으로 하는 법률행위로서 사해행위취소의 대상이 될 수 있다.","a":"O","e":"상속포기와 구별된다. 상속재산분할협의는 구체적 재산귀속을 정하는 행위라 취소 대상이 될 수 있다."},{"p":24,"q":"상속포기와 상속재산분할협의는 모두 채권자취소권의 대상이 되지 않는다.","a":"X","e":"상속포기는 대상이 아니지만, 상속재산분할협의는 사해행위취소 대상이 될 수 있다."},{"p":24,"q":"채무자가 무자력 상태에서 자기 재산을 명의신탁하는 행위는 채권자를 해하는 행위가 될 수 있다.","a":"O","e":"명의신탁으로 책임재산의 외형이 줄어들면 사해행위가 문제된다."},{"p":24,"q":"채무자가 재산을 은닉할 목적으로 명의신탁을 하더라도 명의수탁자가 소유자가 아니므로 채권자취소권은 문제되지 않는다.","a":"X","e":"외형상 책임재산 보전에 장애가 생기면 사해행위취소가 문제된다."},{"p":24,"q":"채권자취소권은 취소원인을 안 날부터 1년, 법률행위가 있은 날부터 5년 내에 행사하여야 한다.","a":"O","e":"민법 제406조 제2항의 제척기간이다."},{"p":24,"q":"채권자취소권의 행사기간은 소멸시효기간이므로 당사자가 원용하여야만 법원이 고려한다.","a":"X","e":"채권자취소권 기간은 제척기간으로 본다."},{"p":24,"q":"채권자취소권의 1년 기간은 채권자가 사해행위의 객관적 사실뿐 아니라 사해의사까지 안 때부터 진행한다.","a":"O","e":"취소원인을 안 날은 단순한 처분사실을 안 때가 아니라 사해행위임을 안 때다."},{"p":24,"q":"채권자가 채무자의 재산처분 사실만 알면 곧바로 채권자취소권의 1년 기간이 진행한다.","a":"X","e":"그 처분이 채권자를 해하는 사해행위라는 점까지 알아야 한다."},{"p":24,"q":"채권자취소권은 소로써 행사하여야 하므로 1년 또는 5년 내에 소를 제기하여야 한다.","a":"O","e":"기간 내 재판상 행사해야 한다."},{"p":24,"q":"채권자취소권 행사로 사해행위가 취소되면 취소채권자는 그 재산에 대하여 당연히 우선변제권을 취득한다.","a":"X","e":"채권자취소권은 공동담보 보전제도일 뿐, 취소채권자에게 당연한 우선변제권을 주지 않는다."},{"p":24,"q":"채권자취소권의 효과는 모든 채권자를 위한 공동담보 보전에 있다.","a":"O","e":"취소채권자 개인만을 위한 담보권 설정이 아니다."},{"p":24,"q":"사해행위 취소의 효력은 채무자와 수익자 사이의 법률관계를 전면적으로 무효로 만들어 모든 사람에게 절대적으로 미친다.","a":"X","e":"채권자취소권의 효과는 상대적이다. 취소채권자와 수익자·전득자 사이에서 공동담보 회복의 범위로 이해한다."},{"p":24,"q":"채권자취소권의 행사로 수익자가 취득한 권리가 외형상 채무자에게 반환되는 형식이 되더라도, 채무자와 수익자 사이의 법률관계에는 직접 영향을 미치지 않는다.","a":"O","e":"취소효과의 상대성을 보여주는 판례 포인트다."},{"p":24,"q":"사해행위로 이전된 부동산의 등기가 말소되어 채무자 명의가 회복되면, 채무자는 실체법상 완전한 소유권자로 확정된다.","a":"X","e":"그 부동산은 취소채권자 등과 수익자 사이에서 책임재산으로 취급될 뿐, 채무자가 직접 권리자가 되는 것은 아니라고 정리한다."},{"p":24,"q":"사해행위취소에 따른 원상회복으로 채무자 명의 등기가 회복되어도, 그 부동산은 취소채권자나 기타 채권자와 수익자 사이에서 채무자의 책임재산으로 취급될 뿐이다.","a":"O","e":"상대적 효력의 중요한 응용이다."},{"p":24,"q":"채무자가 사해행위 취소로 회복된 등기명의를 기초로 제3자에게 다시 처분한 경우, 그 처분은 무권리자의 처분으로 볼 수 있다.","a":"O","e":"채무자가 실체적으로 권리를 취득한 것이 아니므로 그 후 처분은 효력이 문제된다."},{"p":24,"q":"사해행위취소 후 채무자 명의가 회복되면 채무자가 완전한 권리자이므로 그 후 제3자 처분은 언제나 유효하다.","a":"X","e":"채무자가 실체적 권리자가 된 것이 아니므로 무권리자 처분 문제가 생긴다."},{"p":24,"q":"원상회복은 원물반환이 원칙이나, 원물반환이 불가능하거나 현저히 곤란하면 가액배상이 인정될 수 있다.","a":"O","e":"사해행위취소의 원상회복 방법이다."},{"p":24,"q":"사해행위취소의 원상회복은 언제나 가액배상으로만 이루어진다.","a":"X","e":"원물반환이 원칙이고 가액배상은 예외적이다."},{"p":24,"q":"수익자가 선의이면 그 수익자를 상대로 사해행위 취소와 원상회복을 청구할 수 없다.","a":"O","e":"수익자의 악의가 필요하다."},{"p":24,"q":"전득자를 상대로 채권자취소권을 행사하려면 전득자가 악의여야 한다.","a":"O","e":"전득자가 선의이면 보호된다."},{"p":24,"q":"수익자가 악의이면 전득자가 선의라도 전득자를 상대로 언제나 원상회복을 청구할 수 있다.","a":"X","e":"전득자를 상대로 하려면 전득자도 악의여야 한다."},{"p":24,"q":"채권자취소권은 수익자 또는 전득자를 상대로 행사할 수 있지만, 누구를 상대로 하느냐에 따라 원상회복 상대방이 달라진다.","a":"O","e":"현재 이익을 보유하거나 이전받은 자를 상대로 취소와 원상회복을 구한다."},{"p":24,"q":"사해행위취소권은 채무자의 일반재산 보전을 위한 것이므로, 취소채권자는 회복된 재산에서 다른 채권자보다 항상 우선한다.","a":"X","e":"원칙적으로 우선변제권이 없다. 다만 금전 가액배상 수령 등에서 사실상 만족을 얻는 상황과 구별한다."},{"p":24,"q":"채권자대위권과 채권자취소권은 모두 책임재산 보전을 위한 제도이다.","a":"O","e":"둘 다 채무자의 책임재산을 보전하여 채권 만족 가능성을 확보하려는 제도다."},{"p":24,"q":"채권자대위권은 채무자의 권리를 행사하는 제도이고, 채권자취소권은 채무자의 사해행위를 취소하는 제도이다.","a":"O","e":"두 제도의 작용방식 구별이 핵심이다."},{"p":24,"q":"채권자대위권과 채권자취소권은 모두 반드시 소로써만 행사하여야 한다.","a":"X","e":"채권자취소권은 소로써 행사해야 하나, 채권자대위권은 재판 외 행사도 가능하다."},{"p":24,"q":"채권자대위권은 원칙적으로 피보전채권의 변제기 도래가 필요하나, 채권자취소권은 보전 필요가 있으면 변제기 도래 여부를 불문한다.","a":"O","e":"두 제도의 시험 단골 비교다."},{"p":24,"q":"채권자대위권과 채권자취소권 모두 특정채권 보전을 위해서는 절대 행사할 수 없다.","a":"X","e":"대위권은 특정채권 보전을 위해 행사될 수 있으나, 취소권은 원칙적으로 특정채권 보전을 위해 행사할 수 없다."},{"p":24,"q":"금전채권 보전을 위한 채권자대위권은 채무자 무자력이 필요하고, 채권자취소권도 책임재산 부족이라는 사해성이 문제된다.","a":"O","e":"둘 다 일반책임재산과 연결될 때 채무자의 자력 상태가 중요하다."},{"p":24,"q":"채권자대위권은 채무자의 소극적 불행사에 대응하고, 채권자취소권은 채무자의 적극적 재산처분행위에 대응한다.","a":"O","e":"대위권은 방치된 권리 행사, 취소권은 책임재산 감소행위 취소가 중심이다."},{"p":24,"q":"채무자가 자신의 제3자에 대한 권리를 행사하지 않는 경우에는 채권자취소권이, 채무자가 재산을 빼돌린 경우에는 채권자대위권이 주로 문제된다.","a":"X","e":"거꾸로다. 권리 불행사는 대위권, 사해적 처분은 취소권이다."},{"p":24,"q":"채권자대위권의 행사효과는 채무자에게 귀속되고, 채권자취소권의 효과는 공동담보 보전이라는 상대적 효력으로 나타난다.","a":"O","e":"두 제도의 효과를 구별해야 한다."},{"p":24,"q":"채권자대위권은 피대위권리가 일신전속권이면 행사할 수 없고, 채권자취소권도 재산권을 목적으로 하지 않는 신분행위는 대상으로 삼을 수 없다.","a":"O","e":"두 제도 모두 권리·행위의 성질상 제한이 있다."},{"p":24,"q":"사해행위취소권은 채권자가 채무자의 책임재산을 보전하기 위한 것이므로, 채권자가 이미 충분한 담보를 가지고 있다면 보전 필요성이 부정될 수 있다.","a":"O","e":"보전 필요성이 없으면 취소권 행사는 제한된다."},{"p":24,"q":"채무자의 재산처분 후 채무가 감소하여 취소권 행사 당시 채권자를 해하지 않게 된 경우에도 취소권은 그대로 존속한다.","a":"X","e":"행사 당시 채권자를 해하지 않으면 책임재산 보전 필요성이 없어진다."},{"p":24,"q":"사해행위의 취소는 채권자와 수익자 또는 전득자 사이에서 상대적으로 효력이 생긴다.","a":"O","e":"절대적 무효와 구별한다."},{"p":24,"q":"채권자취소권에 의한 취소는 제103조 반사회질서 무효와 같아서 선의의 제3자에게도 언제나 대항할 수 있다.","a":"X","e":"사해행위취소는 상대적 효력 구조이며, 선의 전득자 보호도 문제된다."},{"p":24,"q":"채무자가 채권자를 해함을 알고 재산을 처분한 경우에도 수익자가 선의이면 그 수익자에 대한 취소는 제한된다.","a":"O","e":"수익자의 악의가 필요하다."},{"p":24,"q":"채무자의 사해의사는 추정될 수 있지만, 수익자 또는 전득자의 선의가 인정되면 그 자를 상대로 한 취소는 어렵다.","a":"O","e":"수익자·전득자의 주관 상태는 중요하다."},{"p":24,"q":"유일한 부동산을 매도한 경우라도 그 매매대금이 실제로 채무 변제에 사용되어 공동담보 감소가 없다면 사해성이 부정될 수 있다.","a":"O","e":"책임재산 감소 여부를 실질적으로 본다."},{"p":24,"q":"유일한 부동산 매매는 언제나 사해행위이므로 대금 사용처는 고려할 필요가 없다.","a":"X","e":"대금이 채무변제 등 공동담보 보전에 사용되었는지 등 사정을 고려할 수 있다."},{"p":24,"q":"사해행위취소에서 채무자의 무자력 여부는 사해행위 당시뿐 아니라 사실심 변론종결 당시에도 문제될 수 있다.","a":"O","e":"취소권 행사 당시 보전 필요성도 고려된다."},{"p":24,"q":"채권자취소권 행사의 결과 원상회복된 재산은 모든 채권자의 공동담보가 되는 것이 원칙이다.","a":"O","e":"취소채권자만의 독점적 담보가 아니다."},{"p":24,"q":"채권자취소권의 원상회복으로 가액배상을 받은 채권자는 언제나 다른 채권자에게 그 금액을 전부 나누어 주어야 하므로 자기 채권에 충당할 수 없다.","a":"X","e":"채권자취소권은 우선변제권을 주지 않는다는 원칙과 가액배상 수령 후 상계·충당 등 사실상 만족 문제는 구별된다. 단순화해 \"언제나 전부 나눠준다\"는 틀림."},{"p":24,"q":"사해행위취소소송에서 원상회복은 채무자에게 직접 반환시키는 방식뿐 아니라 취소채권자에게 지급하게 하는 방식도 문제될 수 있다.","a":"O","e":"금전·가액배상에서는 취소채권자에게 직접 지급을 명하는 형태도 가능하다."},{"p":24,"q":"채권자취소권은 모든 채권자를 위한 제도이므로 취소채권자에게 직접 지급을 명하는 판결은 절대 허용되지 않는다.","a":"X","e":"가액배상 등에서는 취소채권자에게 직접 지급을 명할 수 있다. 우선변제권과 구별한다."},{"p":24,"q":"피보전채권이 사해행위 후 양도된 경우, 양수인도 요건을 갖추면 채권자취소권을 행사할 수 있다.","a":"O","e":"피보전채권과 함께 보전수단도 이전될 수 있다."},{"p":24,"q":"채권을 양수한 자는 사해행위 당시 채권자가 아니었으므로 언제나 채권자취소권을 행사할 수 없다.","a":"X","e":"피보전채권을 승계한 양수인은 요건을 갖추면 행사 가능하다."},{"p":24,"q":"채권자취소권은 사해행위 당시 채권자가 존재하여야 하므로, 양수인이 행사하더라도 기준은 양도 전 원채권의 발생시기 등을 본다.","a":"O","e":"양수인의 행사 가능성과 피보전채권의 발생시기 요건을 구별한다."},{"p":24,"q":"채권자취소권에서 원상회복의 범위는 피보전채권액과 사해행위 목적물의 가액 등을 고려하여 제한될 수 있다.","a":"O","e":"필요한 범위를 넘어서는 회복은 허용되지 않는다."},{"p":24,"q":"사해행위 목적물의 가액이 피보전채권액을 초과하여도 언제나 목적물 전체의 취소만 가능하고 일부취소는 불가능하다.","a":"X","e":"사안에 따라 필요한 범위에서 일부취소·가액배상 범위 제한이 문제될 수 있다."},{"p":24,"q":"사해행위 후 목적물에 저당권 등이 설정되어 원물반환이 곤란하면 가액배상이 문제될 수 있다.","a":"O","e":"원상회복 방법은 원물반환이 원칙이나 원물반환 곤란 시 가액배상이 가능하다."},{"p":24,"q":"사해행위 목적물이 멸실되거나 전득되어 원물반환이 불가능한 경우에도 채권자취소권은 항상 행사할 수 없다.","a":"X","e":"원물반환이 불가능하면 가액배상으로 원상회복할 수 있다."},{"p":24,"q":"채권자대위권은 채무자의 책임재산을 적극적으로 늘리는 방향이고, 채권자취소권은 빠져나간 책임재산을 회복하는 방향이다.","a":"O","e":"두 제도의 이미지를 잡는 데 유용하다."},{"p":24,"q":"채권자대위권에서 금전채권 보전의 경우 \"무자력\"이 핵심이고, 채권자취소권에서는 \"사해행위와 공동담보 부족\"이 핵심이다.","a":"O","e":"주택관리사식 비교형 지문으로 자주 변형될 수 있다."},{"p":24,"q":"채권자대위권은 채무자의 권리를 대신 행사하는 것이므로, 채무자가 행사할 수 없는 권리를 채권자가 더 강하게 행사할 수 있다.","a":"X","e":"대위채권자는 채무자의 지위를 넘을 수 없다. 채무자가 행사할 수 없는 권리는 대위행사할 수 없다."},{"p":24,"q":"채권자대위권 행사의 제3채무자는 채무자에게 가지는 동시이행항변권 등을 대위채권자에게도 주장할 수 있다.","a":"O","e":"대위채권자는 채무자의 권리를 행사하는 자이므로 제3채무자의 항변이 유지된다."},{"p":24,"q":"채권자취소권은 채무자의 행위를 취소하는 것이므로, 채무자의 상대방인 수익자의 선의는 아무 의미가 없다.","a":"X","e":"수익자 선의이면 그 수익자에 대한 취소권 행사가 제한된다."},{"p":24,"q":"채권자취소권은 채무자의 사해행위가 통정허위표시인 경우에도 외형상 이전된 재산을 회복하기 위해 문제될 수 있다.","a":"O","e":"통정허위표시와 채권자취소권의 병존 가능성 포인트다."},{"p":24,"q":"통정허위표시인 가장매매는 무효이므로 채권자는 언제나 채권자취소권이 아니라 무효만 주장해야 한다.","a":"X","e":"무효 주장과 별개로 사해행위취소를 통해 책임재산 회복을 구할 수 있다."},{"p":24,"q":"채권자취소권은 특정채권 보전에는 원칙적으로 사용할 수 없으므로, 이중매매의 제1매수인은 제2매매에 대해 채권자취소권을 행사할 수 없다.","a":"O","e":"소유권이전등기청구권은 특정채권이다."},{"p":24,"q":"이중매매에서 제2매수인이 적극 가담하여 제2매매가 무효인 경우, 제1매수인은 소유권이전등기청구권 보전을 위해 채권자취소권을 행사하면 된다.","a":"X","e":"채권자취소권은 특정채권 보전수단이 아니다. 이 경우 제103조 무효, 대위, 말소청구 등 다른 법리가 문제된다."},{"p":24,"q":"채권자대위권은 특정채권 보전에도 가능하므로, 제1매수인이 매도인의 권리를 대위행사하는 구조가 문제될 수 있다.","a":"O","e":"특정채권 보전의 대위권 가능성과 취소권 불가능을 비교해야 한다."},{"p":24,"q":"채권자취소권의 제척기간 1년은 \"사해행위가 있은 날\"부터, 5년은 \"취소원인을 안 날\"부터 진행한다.","a":"X","e":"반대다. 취소원인을 안 날부터 1년, 법률행위가 있은 날부터 5년이다."},{"p":24,"q":"채권자취소권은 취소원인을 안 날부터 1년 내, 법률행위가 있은 날부터 5년 내에 행사한다.","a":"O","e":"숫자 함정이 매우 잦다."},{"p":24,"q":"채권자취소권에서 \"취소원인을 안 날\"이란 단순히 등기부상 소유권이전 사실을 안 날과 항상 같다.","a":"X","e":"처분사실뿐 아니라 그것이 채권자를 해하는 사해행위라는 점까지 알아야 한다."},{"p":24,"q":"사해행위취소의 효과는 채무자와 수익자 사이의 법률관계까지 소급적으로 완전히 소멸시키는 절대효이다.","a":"X","e":"상대적 효력이다. 채무자와 수익자 사이의 법률관계를 전면 소멸시키는 방식이 아니다."},{"p":24,"q":"사해행위취소의 상대효 때문에, 회복된 등기명의는 책임재산 보전을 위한 외형일 뿐 채무자의 완전한 실체권리 취득과 구별된다.","a":"O","e":"자료의 후반 판례 포인트와 연결된다."},{"p":24,"q":"채권자대위권에서 채권자가 대위행사 사실을 채무자에게 통지하면, 채무자는 그 후 권리처분으로 채권자에게 대항하지 못한다.","a":"O","e":"통지 후 처분 제한은 대위권 실효성 확보장치다."},{"p":24,"q":"채권자대위권에서 채무자가 통지를 받은 후에도 피대위권리를 처분하면 그 처분은 대위채권자에게 당연히 대항된다.","a":"X","e":"통지 후 처분은 대위채권자에게 대항하지 못한다."},{"p":24,"q":"채권자대위권은 채무자를 대신하여 권리를 행사하는 것이므로, 대위채권자는 원칙적으로 자신의 이름으로 소송을 수행한다.","a":"O","e":"채무자의 권리를 대위하지만 소송상 원고는 대위채권자가 된다."},{"p":24,"q":"채권자대위소송의 판결효는 일정 요건 아래 채무자에게도 미칠 수 있다.","a":"O","e":"채무자에게 소송고지 등이 이루어진 경우 판결효 확장이 문제된다. 시험에서는 \"대위권 효과가 채무자와 무관하다\"는 지문을 조심한다."},{"p":24,"q":"채권자대위권은 채권자가 채무자의 권리를 행사하는 것이므로, 채무자의 권리가 시효로 소멸한 후에도 채권자의 채권이 남아 있으면 대위행사할 수 있다.","a":"X","e":"피대위권리가 존재해야 한다. 채무자의 권리가 소멸했다면 대위행사할 권리가 없다."},{"p":24,"q":"채권자대위권을 행사하려면 피보전채권뿐 아니라 피대위권리도 존재하여야 한다.","a":"O","e":"보전할 채권과 대신 행사할 권리 모두 필요하다."},{"p":24,"q":"채권자취소권에서 피보전채권이 존재하지 않으면 사해행위가 있더라도 취소권은 성립하지 않는다.","a":"O","e":"보전할 채권이 없으면 취소권의 기초가 없다."},{"p":24,"q":"채권자취소권은 채무자에게 채무초과가 발생하지 않아도 채권자 마음에 들지 않는 처분이면 행사할 수 있다.","a":"X","e":"공동담보 부족 등 사해성이 있어야 한다."},{"p":24,"q":"채권자대위권과 채권자취소권 모두 민법상 책임재산 보전제도이므로, 시험에서는 \"대위는 방치된 권리 행사, 취소는 빠져나간 재산 회복\"으로 비교하면 된다.","a":"O","e":"핵심 이미지 정리다."},{"p":24,"q":"채권자취소권 행사로 사해행위가 취소되어도, 채무자는 그 취소를 이유로 수익자에게 당연히 부당이득반환을 청구할 수 있는 지위가 되는 것은 아니다.","a":"O","e":"취소효과는 상대적이므로 채무자와 수익자의 내부관계에는 직접 영향이 없다."},{"p":24,"q":"채권자취소소송에서 수익자가 원상회복을 하면 수익자와 채무자 사이의 원래 계약도 당연히 소급적으로 무효가 된다.","a":"X","e":"채권자취소권의 효과는 상대효다. 내부 법률관계가 당연히 무효가 되는 것은 아니다."},{"p":24,"q":"사해행위취소권은 채권자평등을 전제로 한 제도이므로, 취소채권자에게 담보물권과 같은 우선권을 창설하지 않는다.","a":"O","e":"물권적 담보권과 구별한다."},{"p":24,"q":"채무자가 특정 채권자에게 대물변제를 한 경우에도 채무초과 상태에서 다른 채권자를 해하면 사해행위가 될 수 있다.","a":"O","e":"대물변제는 특정 채권자 만족으로 공동담보를 감소시킬 수 있어 사해행위가 문제될 수 있다."},{"p":24,"q":"대물변제는 채무의 이행방법 중 하나이므로 어떠한 경우에도 사해행위가 될 수 없다.","a":"X","e":"채무초과 상태에서 일부 채권자만 만족시키고 공동담보를 해하면 사해행위가 될 수 있다."},{"p":24,"q":"채무초과 상태의 채무자가 상당한 가격으로 재산을 매각한 후 그 대금을 은닉하거나 낭비할 의도로 처분한 경우, 사해성이 인정될 수 있다.","a":"O","e":"책임재산을 추적 곤란한 금전으로 바꾸어 은닉·낭비하면 공동담보를 해할 수 있다."},{"p":24,"q":"사해행위 여부는 행위의 외형만으로 결정되고 채무자의 자력, 대금 사용처, 수익자의 인식 등은 고려하지 않는다.","a":"X","e":"사해성은 종합 판단한다. 자력, 대금 사용, 주관적 인식 등이 모두 중요하다."},{"p":24,"q":"채권자대위권은 채무자의 무자력 여부가 언제나 필요하지는 않다.","a":"O","e":"금전채권 보전에는 무자력이 필요하지만 특정채권 보전에는 불필요한 경우가 있다."},{"p":24,"q":"채권자취소권은 특정채권 보전에 부적합하므로, 주택관리사 시험에서는 소유권이전등기청구권 보전 지문을 특히 조심해야 한다.","a":"O","e":"이중매매와 연결되는 빈출 함정이다."},{"p":24,"q":"채권자대위권과 채권자취소권은 모두 채권자의 채권을 보전하기 위한 권리이지만, 직접 행사 대상과 행사방법이 다르다.","a":"O","e":"대위권은 채무자의 권리 행사, 취소권은 사해행위 취소이며 행사방법도 다르다."},{"p":25,"q":"수인의 채권자 또는 채무자가 있는 경우, 특별한 의사표시가 없으면 각 채권자나 각 채무자는 균등한 비율로 권리를 가지거나 의무를 부담한다.","a":"O","e":"다수당사자 채권관계의 원칙은 분할채권·분할채무이다. 특약이나 법률규정이 없으면 각자 균등비율로 나뉜다."},{"p":25,"q":"분할채권관계에서는 각 채권자가 채권 전부의 이행을 청구할 수 있다.","a":"X","e":"분할채권자는 자기 지분에 해당하는 부분만 청구할 수 있다. 전부 청구는 불가분채권이나 연대채권 쪽의 특징이다."},{"p":25,"q":"분할채무관계에서 각 채무자는 자기 부담부분만 이행하면 되고, 다른 채무자의 부담부분까지 이행할 의무는 없다.","a":"O","e":"분할채무는 채무가 지분별로 쪼개지는 구조이다. 각 채무자는 자기 부분만 부담한다."},{"p":25,"q":"분할채무자 중 1인이 자기 부담부분을 변제하면 그 부분에서만 채무가 소멸하고, 다른 채무자의 채무에는 영향을 미치지 않는다.","a":"O","e":"분할채무는 각 채무가 독립하여 존재하므로 변제의 효과도 자기 부담부분에 한정된다."},{"p":25,"q":"분할채무자 중 1인에 대한 이행청구는 다른 분할채무자에게도 시효중단의 효력이 있다.","a":"X","e":"분할채무는 독립성이 강하므로 1인에게 생긴 사유는 원칙적으로 다른 채무자에게 효력이 없다."},{"p":25,"q":"분할채권자 중 1인이 자기 지분을 면제하더라도 다른 분할채권자의 권리에는 영향을 미치지 않는다.","a":"O","e":"분할채권은 각 채권자의 지분별 권리가 독립되어 있으므로 1인의 면제는 그 사람 몫에 한정된다."},{"p":25,"q":"분할채권의 목적이 금전채권인 경우에도 특별한 사정이 없으면 각 채권자는 자기 부분만 청구한다.","a":"O","e":"금전채권은 가분급부의 대표적인 예이므로 특별한 약정이 없으면 분할채권관계가 된다."},{"p":25,"q":"가분채권도 당사자 약정으로 불가분채권으로 만들 수 있다.","a":"O","e":"급부 자체가 가분이라도 당사자가 불가분으로 이행하도록 약정할 수 있다."},{"p":25,"q":"다수의 임차인이 임대인에게 월세를 지급할 때, 특별한 약정이 없으면 각 임차인은 원칙적으로 자기 부담부분만 지급하면 된다.","a":"O","e":"금전채무는 원칙적으로 가분채무이므로 특별한 연대약정이나 불가분약정이 없으면 분할채무가 된다."},{"p":25,"q":"분할채무에서 채권자는 임의의 1인에게 채무 전부의 이행을 청구할 수 있다.","a":"X","e":"전부 청구가 가능한 것은 연대채무·불가분채무의 구조이다. 분할채무는 자기 부분만 청구 가능하다."},{"p":25,"q":"불가분채권은 급부의 성질 또는 당사자의 의사표시에 의하여 여러 채권자가 공동으로 하나의 불가분급부를 청구하는 관계이다.","a":"O","e":"자동차 1대 인도처럼 급부가 성질상 나눌 수 없거나, 당사자가 불가분으로 정하면 불가분채권이 된다."},{"p":25,"q":"불가분채권에서 각 채권자는 모든 채권자를 위하여 이행을 청구할 수 있다.","a":"O","e":"불가분채권자는 자기 지분만이 아니라 모든 채권자를 위하여 전부 이행청구를 할 수 있다."},{"p":25,"q":"불가분채권에서 채무자는 모든 채권자에게 공동으로 또는 채권자 1인에게 전부를 이행할 수 있다.","a":"O","e":"불가분채권은 목적이 나눌 수 없으므로 채무자는 공동으로 또는 1인에게 전부 이행할 수 있다."},{"p":25,"q":"불가분채권자 중 1인의 이행청구는 다른 채권자에게도 효력이 있다.","a":"O","e":"불가분채권에서는 이행청구와 채무자의 이행은 모든 채권자에게 효력이 있는 대표적 절대효 사유이다."},{"p":25,"q":"불가분채권자 중 1인에게 생긴 면제는 당연히 다른 채권자의 권리도 전부 소멸시킨다.","a":"X","e":"불가분채권자 1인의 면제·경개 등은 원칙적으로 다른 채권자에게 효력이 없다. 다만 전부 이행을 받은 다른 채권자는 일정한 상환 문제가 생긴다."},{"p":25,"q":"불가분채권의 목적이 손해배상채권처럼 가분급부로 바뀌면 분할채권관계가 된다.","a":"O","e":"자동차 1대 인도채권이 채무불이행으로 금전손해배상채권이 되면 가분급부가 되어 분할채권관계가 된다."},{"p":25,"q":"불가분채무에서는 채권자가 채무자 중 1인에게 채무 전부의 이행을 청구할 수 있다.","a":"O","e":"불가분채무는 급부가 나뉠 수 없으므로 채권자는 각 채무자에게 전부 이행을 청구할 수 있다."},{"p":25,"q":"불가분채무는 목적의 성질상 나눌 수 없는 경우뿐 아니라 당사자의 약정으로도 성립할 수 있다.","a":"O","e":"성질상 불가분뿐 아니라 이행청구나 급부의 편의를 위해 약정상 불가분으로 정할 수 있다."},{"p":25,"q":"공유자 전원이 임대차보증금을 수령한 경우, 임대차 종료 시 보증금반환채무는 불가분채무가 될 수 있다.","a":"O","e":"자료상 공유자 전원의 합의로 공유물을 인도하고 보증금을 수령한 경우 보증금반환의무는 불가분채무로 정리된다."},{"p":25,"q":"불가분채무자가 여럿인 경우에도 각 채무자는 자기 부담부분만 이행하면 된다.","a":"X","e":"불가분채무에서는 각 채무자가 채무 전부를 이행할 의무를 부담한다. 내부적으로 부담부분 문제는 별도이다."},{"p":25,"q":"불가분채무가 금전손해배상채무로 바뀌면 원칙적으로 분할채무관계가 된다.","a":"O","e":"불가분급부가 가분급부로 변하면 각 채무자는 자기 부담부분만 이행하는 분할채무관계가 된다."},{"p":25,"q":"불가분채권자 중 1인과 채무자 사이의 경개는 항상 모든 채권자에게 절대효가 있다.","a":"X","e":"불가분채권에서 절대효는 이행청구와 이행이 핵심이고, 1인의 경개·면제 등은 원칙적으로 다른 채권자에게 효력이 없다."},{"p":25,"q":"불가분채무에는 그 성질에 반하지 않는 한 연대채무에 관한 규정이 준용된다.","a":"O","e":"불가분채무는 전부 이행의무라는 점에서 연대채무 규정이 일부 준용된다."},{"p":25,"q":"불가분채권은 채권자가 여러 명이고 급부가 나뉠 수 없는 경우의 문제이고, 불가분채무는 채무자가 여러 명이고 급부가 나뉠 수 없는 경우의 문제이다.","a":"O","e":"채권자 측 다수이면 불가분채권, 채무자 측 다수이면 불가분채무로 구별한다."},{"p":25,"q":"불가분채무에서 채무자 1인이 전부 이행하면 다른 채무자도 채권자에 대한 관계에서 의무를 면한다.","a":"O","e":"불가분채무는 하나의 불가분급부를 전부 이행하면 채권자가 만족을 얻으므로 다른 채무자도 면책된다."},{"p":25,"q":"연대채무는 수인의 채무자가 각자 동일한 내용의 급부 전부를 독립적으로 이행할 의무를 부담하는 채무관계이다.","a":"O","e":"연대채무자는 각자 채무 전부를 부담하고, 1인의 이행으로 다른 채무자도 그 범위에서 의무를 면한다."},{"p":25,"q":"연대채무에는 주채무자와 종된 채무자의 구별이 있다.","a":"X","e":"연대채무는 각 채무자의 채무가 독립하여 존재하므로 주종의 구별이 없다. 주종관계는 보증채무에서 중요하다."},{"p":25,"q":"채권자는 연대채무자 중 1인에게 채무 전부 또는 일부의 이행을 청구할 수 있다.","a":"O","e":"연대채무에서 채권자는 어느 1인에게든, 동시 또는 순차로 전부나 일부의 이행을 청구할 수 있다."},{"p":25,"q":"채권자가 연대채무자 중 1인에게 전부 이행을 청구하면 다른 연대채무자에게는 다시 청구할 수 없다.","a":"X","e":"1인에게 청구했다는 사정만으로 다른 연대채무자에 대한 청구가 배제되지 않는다. 만족을 얻을 때까지 청구 가능하다."},{"p":25,"q":"연대채무자 중 1인이 전부 변제하면 다른 연대채무자의 채무도 채권자에 대한 관계에서 소멸한다.","a":"O","e":"연대채무는 1인의 변제로 채권자가 만족을 얻으면 다른 채무자도 외부관계에서 면책된다."},{"p":25,"q":"연대채무자 중 1인이 자기 부담부분을 초과하여 변제하면 다른 연대채무자에게 구상권을 행사할 수 있다.","a":"O","e":"내부관계에서는 부담부분이 있고, 초과 변제자는 다른 채무자에게 부담부분에 따라 구상할 수 있다."},{"p":25,"q":"연대채무자 상호 간에는 언제나 부담부분이 균등하다.","a":"X","e":"부담부분은 특약이나 법률관계에 따라 달라질 수 있다. 정함이 없을 때 균등이 문제된다."},{"p":25,"q":"연대채무자 중 1인에게 생긴 사유는 언제나 다른 연대채무자에게도 효력이 있다.","a":"X","e":"연대채무에서는 절대효 사유와 상대효 사유를 구별한다. 전부 절대효가 아니다."},{"p":25,"q":"연대채무에서 1인의 변제, 대물변제, 공탁, 상계 등 채권을 만족시키는 사유는 다른 연대채무자에게도 효력이 있다.","a":"O","e":"채권자를 만족시키는 사유는 공동면책 효과가 있어 다른 연대채무자에게도 효력이 있다."},{"p":25,"q":"연대채무자 중 1인에 대한 청구는 다른 연대채무자에게도 효력이 있다.","a":"O","e":"민법상 연대채무에서 청구는 절대효 사유로 정리된다. 시험에서는 보증채무와 시효중단 문제와 비교된다."},{"p":25,"q":"연대채무자 중 1인에게 발생한 면제는 언제나 모든 연대채무자에게 전부 효력이 있다.","a":"X","e":"면제는 그 채무자의 부담부분에 관하여 다른 채무자에게 효력이 미치는 방식으로 제한적으로 이해해야 한다. 전부 면책은 아니다."},{"p":25,"q":"연대채무자 1인에 대한 시효완성은 그 채무자의 부담부분에 한하여 다른 연대채무자에게도 효력이 문제될 수 있다.","a":"O","e":"연대채무자의 1인에 대한 시효완성은 절대효의 범위가 부담부분과 연결되어 출제된다."},{"p":25,"q":"연대채무자 중 1인에게 무효나 취소의 원인이 있더라도 다른 연대채무자의 채무에는 원칙적으로 영향을 미치지 않는다.","a":"O","e":"연대채무는 각 채무가 독립하므로 1인의 무효·취소 사유는 원칙적으로 상대효에 그친다."},{"p":25,"q":"연대채무자 중 1인의 채무가 혼동으로 소멸하면 그 채무자의 부담부분에 한하여 다른 연대채무자도 의무를 면한다.","a":"O","e":"혼동은 연대채무에서 일정한 절대효가 인정되는 사유로, 부담부분 범위에서 다른 채무자에게도 효력이 미친다."},{"p":25,"q":"연대채무에서 1인에게 생긴 이행지체는 당연히 다른 연대채무자도 지체에 빠뜨린다.","a":"X","e":"이행지체 같은 채무자 개인에 관한 사유는 원칙적으로 상대효이다."},{"p":25,"q":"연대채무자 1인의 과실은 다른 연대채무자에게 당연히 효력이 미치지 않는다.","a":"O","e":"채무자 개인의 귀책사유나 과실은 원칙적으로 상대효이다."},{"p":25,"q":"연대채무자는 채권자에 대하여 자기 부담부분만 변제하겠다고 항변할 수 없다.","a":"O","e":"외부관계에서 각 연대채무자는 전부 이행의무를 부담하므로 내부 부담부분을 이유로 전부청구를 거절할 수 없다."},{"p":25,"q":"채권자가 연대채무자 1인에 대하여 연대를 면제하면, 그 채무자는 분할채무자처럼 자기 부담부분만 부담하게 될 수 있다.","a":"O","e":"연대의 면제는 외부관계에서 그 채무자를 연대책임에서 벗어나게 하는 효과로 정리된다."},{"p":25,"q":"연대채무자 중 무자력자가 있는 경우, 그의 부담부분은 원칙적으로 구상권자와 다른 자력 있는 채무자가 부담부분에 비례하여 분담한다.","a":"O","e":"상환무자력자의 부담부분은 구상권자와 다른 자력 있는 채무자가 분담한다. 다만 구상권자에게 과실이 있으면 분담청구가 제한된다."},{"p":25,"q":"상환무자력자가 있는 경우에도 구상권자에게 과실이 있으면 다른 연대채무자에게 무자력자 부담부분의 분담을 청구하지 못한다.","a":"O","e":"민법 제427조 취지. 구상권자에게 과실이 있으면 다른 채무자에게 분담청구할 수 없다."},{"p":25,"q":"상환무자력자의 부담부분을 분담할 채무자가 채권자로부터 연대의 면제를 받은 경우, 그 채무자의 분담할 부분은 채권자가 부담한다.","a":"O","e":"연대면제와 무자력자 부담부분이 결합되는 지점이다. 자료에서도 채권자 부담으로 정리된다."},{"p":25,"q":"연대채무는 채무자 수만큼의 다수 독립채무가 있으므로, 한 사람의 채무가 무효이면 항상 연대채무 전체가 무효가 된다.","a":"X","e":"연대채무는 독립채무가 병존하므로 1인의 무효는 원칙적으로 그 사람에게만 미친다."},{"p":25,"q":"연대채무자 1인이 채권자에게 상계할 수 있는 반대채권을 가지고 있는 경우, 그 채무자는 상계로 공동면책을 가져올 수 있다.","a":"O","e":"상계는 채권 만족과 유사한 효과를 가지므로 상계한 범위에서 다른 연대채무자도 면책된다."},{"p":25,"q":"연대채무자 중 1인이 가진 항변권은 다른 연대채무자가 당연히 행사할 수 없다.","a":"O","e":"개인적 항변은 원칙적으로 해당 채무자만 행사할 수 있다. 다만 채권 자체에 붙은 항변은 별도이다."},{"p":25,"q":"부진정연대채무는 여러 채무자가 동일한 급부에 관하여 전부 이행의무를 지지만, 연대채무와 달리 당사자 사이의 주관적 공동관계가 약한 경우를 말한다.","a":"O","e":"공동불법행위자 책임, 사용자책임과 피용자 책임 등에서 부진정연대채무가 문제된다."},{"p":25,"q":"공동불법행위자의 손해배상채무는 판례상 부진정연대채무로 다루어진다.","a":"O","e":"자료도 공동불법행위자의 책임을 부진정연대채무 관계로 정리하고 있다."},{"p":25,"q":"사용자의 사용자책임과 피용자의 불법행위책임은 부진정연대채무 관계가 될 수 있다.","a":"O","e":"피용자의 불법행위책임과 사용자의 책임은 같은 손해에 대한 전부배상책임으로 부진정연대채무가 문제된다."},{"p":25,"q":"부진정연대채무자 중 1인의 변제는 채권자를 만족시킨 범위에서 다른 채무자의 채무도 소멸시킨다.","a":"O","e":"동일한 손해나 급부에 대한 책임이므로 1인이 변제하여 채권자가 만족하면 그 범위에서 다른 채무자도 면책된다."},{"p":25,"q":"부진정연대채무에서도 모든 절대효 사유가 민법상 연대채무와 동일하게 적용된다.","a":"X","e":"부진정연대채무는 연대채무 규정이 당연히 전부 적용되는 것이 아니다. 특히 청구 등은 상대효 중심으로 보아야 한다."},{"p":25,"q":"부진정연대채무에서는 채권자가 채무자 중 1인에게 전부 또는 일부의 이행을 청구할 수 있다.","a":"O","e":"외부관계에서는 각 채무자가 전부책임을 부담하므로 채권자는 1인 또는 전원에게 청구할 수 있다."},{"p":25,"q":"부진정연대채무자 중 1인이 자기 부담부분 이상을 변제하여 공동면책을 얻게 하면 다른 채무자에게 구상할 수 있다.","a":"O","e":"공동불법행위자 상호간에도 형평의 원칙상 부담비율에 따라 구상권이 인정된다."},{"p":25,"q":"부진정연대채무의 내부 부담부분은 항상 균등하다.","a":"X","e":"공동불법행위자 사이에서는 가담 정도, 과실 정도 등 형평에 따라 부담비율이 정해진다."},{"p":25,"q":"부진정연대채무자 1인에 대한 이행청구는 다른 부진정연대채무자에게도 당연히 시효중단 효력이 있다.","a":"X","e":"부진정연대채무에서는 청구의 절대효를 쉽게 인정하지 않는다. 각 채무자별로 시효중단을 검토해야 한다."},{"p":25,"q":"부진정연대채무에서도 채권자가 1인에게서 전액을 받으면 다른 채무자에 대한 청구는 그 범위에서 소멸한다.","a":"O","e":"채권자가 전액 만족을 얻으면 이중배상은 허용되지 않으므로 다른 채무자의 책임도 소멸한다."},{"p":25,"q":"법인의 불법행위책임과 대표기관 개인의 불법행위책임은 부진정연대채무로 문제될 수 있다.","a":"O","e":"같은 손해에 대한 법인책임과 개인책임이 병존하는 경우 부진정연대채무 구조로 이해한다."},{"p":25,"q":"부진정연대채무는 연대채무와 완전히 동일하므로 명칭만 다를 뿐 효과 차이가 없다.","a":"X","e":"외부적으로 전부청구와 변제에 의한 공동면책은 유사하나, 절대효 사유의 범위 등에서 차이가 있다."},{"p":25,"q":"보증채무는 주채무자가 채무를 이행하지 않을 경우 보증인이 이를 이행할 의무를 부담하는 종된 채무이다.","a":"O","e":"보증채무는 주채무와 동일한 내용을 가지며 주채무에 대한 종된 채무이다."},{"p":25,"q":"보증채무는 채권자와 보증인 사이의 보증계약으로 성립한다.","a":"O","e":"보증채무는 주채무자와 보증인 사이의 내부관계가 아니라 채권자와 보증인 사이의 계약으로 성립한다."},{"p":25,"q":"보증계약은 반드시 서면으로 그 의사가 표시되어야 한다.","a":"O","e":"보증계약은 요식성이 강조된다. 구체적 내용을 서면에 기재해야 한다."},{"p":25,"q":"보증인의 보증의사가 전자문서로 표시되어도 일정한 요건 아래 서면요건을 충족할 수 있다.","a":"O","e":"전자문서도 법령상 요건을 갖추면 서면성과 관련하여 인정될 수 있다. 시험에서는 “구두보증 유효” 함정을 조심한다."},{"p":25,"q":"보증계약은 구두로도 유효하게 성립한다.","a":"X","e":"보증계약은 그 내용을 서면에 기재해야 하는 요식행위이다. 구두보증은 원칙적으로 효력이 없다."},{"p":25,"q":"보증채무는 주채무와는 별개의 독립한 채무이므로, 보증채무와 주채무의 소멸시효기간은 각각 별도로 정해질 수 있다.","a":"O","e":"자료도 보증채무의 독립성으로 주채무와 보증채무의 소멸시효기간이 성질에 따라 별개로 정해진다고 정리한다."},{"p":25,"q":"주채무가 판결로 10년 시효가 되면 보증채무도 언제나 당연히 10년 시효로 연장된다.","a":"X","e":"주채무 판결확정으로 시효가 연장되어도 보증채무는 그 성질에 따라 별도로 시효기간이 정해질 수 있다."},{"p":25,"q":"주채무가 무효이면 보증채무도 원칙적으로 성립할 수 없다.","a":"O","e":"보증채무는 주채무에 부종하므로 주채무가 무효이면 보증채무도 무효가 된다."},{"p":25,"q":"주채무가 취소되면 보증채무도 그에 따라 영향을 받는다.","a":"O","e":"성립상·존속상 부종성에 따라 주채무가 취소되면 보증채무도 존립할 수 없다."},{"p":25,"q":"보증채무는 주채무보다 더 무거운 내용이 될 수 없다.","a":"O","e":"부종성상 보증채무는 주채무보다 불리하거나 무겁게 할 수 없다. 더 무거운 부분은 주채무 한도로 감축된다."},{"p":25,"q":"보증채무가 주채무보다 무거운 경우에는 그 전부가 무효가 된다.","a":"X","e":"보증채무가 주채무보다 무거우면 주채무의 한도로 감축될 뿐 전부무효가 아니다."},{"p":25,"q":"주채무가 장래의 채무이거나 증감하는 채무라도 보증의 대상이 될 수 있다.","a":"O","e":"주채무가 반드시 현실적으로 이미 발생해 있어야 하는 것은 아니며 장래채무·근보증도 가능하다."},{"p":25,"q":"불확정한 다수의 채무에 대한 보증은 절대 허용되지 않는다.","a":"X","e":"근보증처럼 장래에 증감하는 불확정 채무에 대한 보증도 가능하다. 다만 책임범위와 신의칙상 제한이 문제될 수 있다."},{"p":25,"q":"보증채무는 주채무와 동일한 내용을 가지므로, 주채무자가 항변할 수 있는 사유는 원칙적으로 보증인도 주장할 수 있다.","a":"O","e":"보증인은 주채무자의 항변권을 원용할 수 있다. 이는 부종성과 보증인 보호의 핵심이다."},{"p":25,"q":"주채무자가 시효이익을 포기하면 보증인도 언제나 그 포기의 효력에 구속된다.","a":"X","e":"주채무자의 시효이익 포기는 보증인에게 불이익하게 작용할 수 없다는 식으로 출제된다."},{"p":25,"q":"보증채무는 주채무에 대한 종된 채무이지만, 채권자와 보증인 사이에서 독립한 계약으로 성립한다.","a":"O","e":"보증채무는 독립성과 부종성을 모두 가진다. “독립성 때문에 부종성 없음”이라는 지문은 틀린다."},{"p":25,"q":"보증인은 주채무자의 채무가 이행기에 있지 않은 경우, 보증채무의 이행을 거절할 수 있다.","a":"O","e":"주채무가 아직 이행기에 도달하지 않았다면 부종성상 보증인에게도 이행청구를 할 수 없다."},{"p":25,"q":"보증채무는 주채무가 소멸해도 별도로 계속 존속한다.","a":"X","e":"주채무가 변제·상계·면제 등으로 소멸하면 보증채무도 부종성에 의해 소멸한다."},{"p":25,"q":"보증채무에는 보충성이 인정되므로, 일반보증인은 원칙적으로 최고·검색의 항변권을 가진다.","a":"O","e":"보증인은 먼저 주채무자에게 청구하라거나 주채무자의 재산에 집행하라고 항변할 수 있다."},{"p":25,"q":"보증인은 채권자가 보증인에게 청구하면 아무 조건 없이 즉시 이행해야 하고 최고·검색의 항변권은 없다.","a":"X","e":"일반보증인은 최고·검색의 항변권을 가진다. 다만 연대보증인은 보충성이 없어 항변권이 제한된다."},{"p":25,"q":"보증인의 최고항변권은 채권자가 먼저 주채무자에게 청구하라고 주장하는 항변권이다.","a":"O","e":"최고항변권은 주채무자에게 먼저 이행청구를 하라는 항변이다."},{"p":25,"q":"보증인의 검색항변권은 주채무자에게 변제자력이 있고 집행이 용이하니 먼저 그 재산에 집행하라고 주장하는 항변권이다.","a":"O","e":"검색항변권은 주채무자의 집행 가능한 재산에 먼저 집행하라는 항변이다."},{"p":25,"q":"연대보증인은 특별한 사정이 없는 한 최고·검색의 항변권을 행사할 수 없다.","a":"O","e":"연대보증은 보충성이 배제되므로 일반보증과 달리 최고·검색항변권이 없다."},{"p":25,"q":"연대보증도 보증채무이므로 부종성은 인정된다.","a":"O","e":"연대보증은 보충성이 없을 뿐, 주채무에 종속하는 부종성은 인정된다."},{"p":25,"q":"연대보증인은 주채무자와 연대채무자가 되는 것이므로 보증채무의 부종성이 전혀 없다.","a":"X","e":"연대보증은 보증채무의 한 형태이다. 보충성은 없지만 부종성은 인정된다."},{"p":25,"q":"보증인이 주채무를 변제하면 주채무자에 대하여 구상권을 취득할 수 있다.","a":"O","e":"보증인이 대신 변제하면 주채무자에게 구상권을 행사할 수 있다. 변제자대위도 함께 문제된다."},{"p":25,"q":"보증인은 주채무자의 의사에 반하여 보증한 경우에도 일정한 범위에서 구상할 수 있다.","a":"O","e":"위임 없는 보증의 구상범위는 제한될 수 있으나 전혀 구상할 수 없는 것은 아니다."},{"p":25,"q":"보증채무의 범위에는 원칙적으로 주채무의 원본뿐 아니라 이자, 위약금, 손해배상 등 종된 채무가 포함될 수 있다.","a":"O","e":"보증채무는 주채무의 종된 채무까지 포함하는 것이 원칙이다. 다만 보증계약의 범위 해석이 중요하다."},{"p":25,"q":"보증인은 주채무자가 취득한 채권으로 상계할 수 있는 경우에도 그 상계권을 원용할 수 없다.","a":"X","e":"보증인은 주채무자의 항변권·상계권 등을 일정 범위에서 원용할 수 있다."},{"p":25,"q":"보증채무는 주채무보다 가벼운 내용으로 정할 수 있다.","a":"O","e":"보증채무는 주채무보다 무거울 수 없지만, 더 가벼운 범위로 제한하는 것은 가능하다."},{"p":25,"q":"보증인의 부담이 주채무보다 가벼운 경우에는 주채무도 그 범위로 줄어든다.","a":"X","e":"보증채무를 가볍게 정해도 주채무 자체가 감축되는 것은 아니다."},{"p":25,"q":"주채무가 조건부이면 보증채무도 그 조건의 영향을 받는다.","a":"O","e":"주채무에 붙은 조건·기한 등은 부종성상 보증채무에도 영향을 미친다."},{"p":25,"q":"주채무자가 제한능력자라는 이유로 채무를 취소할 수 있는 경우, 보증인이 그 사정을 알면서 보증한 때에는 독립채무로서 책임질 수 있다.","a":"O","e":"주채무가 제한능력을 이유로 취소될 수 있음을 알고 보증한 경우 보증인 보호 필요성이 낮아 별도 책임이 문제될 수 있다."},{"p":25,"q":"보증인이 채권자에게 변제한 경우, 보증인은 채권자가 가진 담보권을 대위하여 행사할 수 있는 경우가 있다.","a":"O","e":"보증인이 변제하면 변제자대위에 의해 채권자의 권리와 담보를 행사할 수 있다."},{"p":25,"q":"보증계약에서 보증인의 책임범위가 불명확하면 일반적으로 보증인에게 불리하게 넓게 해석한다.","a":"X","e":"보증은 무상·호의적 성격이 강하므로 불명확할 때 보증인에게 불리하게 함부로 확대해석하지 않는다."},{"p":25,"q":"계속적 보증계약에서 사정변경이 있으면 제한적으로 해지가 인정될 수 있다.","a":"O","e":"불확정 채무에 대한 계속적 보증계약은 이사의 퇴직 등 사정변경으로 해지가 인정될 수 있다."},{"p":25,"q":"확정채무에 대한 보증은 사정변경을 이유로 임의로 해지할 수 있다.","a":"X","e":"확정채무 보증은 불확정 계속보증과 달리 사정변경을 이유로 해지가 쉽게 인정되지 않는다."},{"p":25,"q":"보증채무는 주채무자의 채무불이행이 있는 경우에 문제되는 것이므로, 보증인은 원칙적으로 주채무자의 채무보다 먼저 이행할 의무가 없다.","a":"O","e":"보증채무의 보충성상 일반보증인은 주채무자에게 먼저 청구·집행하라고 항변할 수 있다."},{"p":25,"q":"보증인은 채권자가 주채무자에게 청구하지 않았다는 이유만으로 언제나 책임을 면한다.","a":"X","e":"일반보증인은 최고항변을 할 수 있지만, 항변권을 행사해야 하고 요건이 문제된다. 연대보증에는 보충성이 없다."},{"p":25,"q":"보증채무에 관한 법리는 물상보증인에게도 그대로 동일하게 적용되어 물상보증인은 항상 최고·검색의 항변권을 가진다.","a":"X","e":"물상보증은 자기 재산으로 타인의 채무를 담보하는 물권담보 제공자이다. 인적 보증채무와 구별해야 한다."},{"p":25,"q":"보증인이 수인인 경우 특별한 의사표시가 없으면 각 보증인은 균등한 비율로 부담하는 것이 원칙이다.","a":"O","e":"공동보증에서는 특별한 약정이 없으면 분별의 이익이 문제된다. 각 보증인은 원칙적으로 지분 부담 구조가 된다."},{"p":25,"q":"공동보증인 중 1인이 전액을 변제하면 다른 공동보증인에게 구상할 수 있는 경우가 있다.","a":"O","e":"공동보증인 상호간에는 부담부분에 따라 구상관계가 문제된다."},{"p":25,"q":"공동보증인이 연대보증한 경우에는 채권자에 대한 관계에서 분별의 이익이 없다.","a":"O","e":"연대보증 형태의 공동보증은 각 보증인이 전부책임을 부담하므로 분별의 이익이 없다."},{"p":25,"q":"일반 공동보증에서는 각 보증인이 채권자에게 전액을 부담하는 것이 원칙이다.","a":"X","e":"특별한 연대약정 등이 없으면 공동보증인은 분별의 이익이 있어 각자 부담부분만 책임진다."},{"p":25,"q":"연대채무는 주종관계가 없고, 보증채무는 주채무와 보증채무 사이에 주종관계가 있다.","a":"O","e":"연대채무는 독립채무가 병존하지만 보증채무는 주채무에 종속하는 종된 채무이다."},{"p":25,"q":"연대보증은 연대채무와 완전히 같아서 주채무가 무효가 되어도 연대보증채무는 계속 존속한다.","a":"X","e":"연대보증은 보충성이 없을 뿐 보증채무의 부종성은 있다. 주채무가 무효이면 연대보증도 원칙적으로 존속하지 않는다."},{"p":25,"q":"연대채무자는 자기 부담부분을 이유로 채권자의 전부청구를 거절할 수 없고, 일반보증인은 최고·검색의 항변권을 행사할 수 있다.","a":"O","e":"연대채무는 외부관계에서 전부책임, 일반보증은 보충성이 핵심이다."},{"p":25,"q":"불가분채무와 연대채무는 모두 채권자가 1인에게 전부 이행을 청구할 수 있다는 점에서 비슷하다.","a":"O","e":"외부관계에서 전부청구가 가능하다는 점은 유사하다. 다만 발생 원인과 내부관계, 절대효 범위는 구별한다."},{"p":25,"q":"분할채무와 연대채무는 모두 각 채무자가 채무 전부를 부담한다는 점에서 같다.","a":"X","e":"분할채무자는 자기 부담부분만 부담하고, 연대채무자는 외부관계에서 전부 부담한다."},{"p":25,"q":"불가분채권에서 1인의 이행청구는 절대효가 있지만, 1인의 면제는 원칙적으로 절대효가 아니다.","a":"O","e":"불가분채권의 대표 절대효는 이행청구와 이행이다. 면제·경개는 함정 포인트다."},{"p":25,"q":"부진정연대채무는 외부적으로 전부청구가 가능하지만, 연대채무의 절대효 규정이 당연히 모두 적용되지는 않는다.","a":"O","e":"부진정연대채무는 변제 등 채권만족 사유 외에는 상대효 중심으로 이해한다."},{"p":25,"q":"보증채무에서 독립성이란 보증채무가 주채무와 아무 관련 없이 존재한다는 뜻이다.","a":"X","e":"독립성은 보증계약이 채권자와 보증인 사이의 독립계약이라는 뜻이고, 부종성이 배제된다는 뜻이 아니다."},{"p":25,"q":"보증채무에서 부종성이란 주채무의 성립·존속·소멸에 보증채무가 종속된다는 뜻이다.","a":"O","e":"주채무가 없으면 보증채무도 없고, 주채무가 소멸하면 보증채무도 원칙적으로 소멸한다."},{"p":25,"q":"보증채무에서 보충성이란 채권자가 원칙적으로 주채무자에게 먼저 청구·집행해야 한다는 보증인 보호 원리이다.","a":"O","e":"보충성은 최고·검색의 항변권으로 구체화된다."},{"p":25,"q":"연대보증은 부종성도 없고 보충성도 없다.","a":"X","e":"연대보증은 보충성은 없지만 부종성은 인정된다."},{"p":25,"q":"분할채권, 불가분채권, 연대채무, 보증채무를 구별할 때 핵심은 전부청구 가능 여부와 주종관계 유무이다.","a":"O","e":"시험에서는 “전부청구 가능”과 “주종관계/부종성”을 기준으로 빠르게 구별하면 된다."},{"p":25,"q":"주채무자에 대한 확정판결로 주채무의 소멸시효기간이 10년으로 연장되면, 그 후 보증한 보증채무도 그 성질에 관계없이 항상 10년이다.","a":"X","e":"주채무 판결확정과 보증채무의 시효기간은 별도로 정해질 수 있다. 보증채무가 민사채권이면 10년, 상사채권이면 5년 등 성질에 따른다."},{"p":25,"q":"주채무가 단기소멸시효 채권이라도 보증채무 자체가 민사채권이면 보증채무의 시효기간은 10년이 될 수 있다.","a":"O","e":"보증채무는 별개의 독립채무이므로 그 성질에 따라 시효기간을 정한다."},{"p":25,"q":"보증계약의 구체적 내용이 서면에 기재되어 있지 않으면 보증책임을 인정하기 어렵다.","a":"O","e":"보증계약의 요식성을 반영한 지문이다."},{"p":25,"q":"보증인이 보증계약 당시 채권자에게 구두로만 보증하겠다고 말한 경우 원칙적으로 보증계약은 유효하다.","a":"X","e":"보증계약은 서면이 필요하다. 구두보증 유효 지문은 대표 함정이다."},{"p":25,"q":"보증채무가 성립하려면 주채무가 반드시 현재 확정적으로 존재해야 하므로 장래채무 보증은 무효이다.","a":"X","e":"장래채무나 계속적 거래에서 발생하는 채무에 대한 보증도 가능하다."},{"p":25,"q":"보증채무가 주채무보다 중한 경우 주채무의 한도로 감축된다.","a":"O","e":"보증인을 주채무자보다 불리하게 할 수 없으므로 초과부분은 주채무 한도로 줄어든다."},{"p":25,"q":"보증인은 주채무자의 항변을 원용할 수 있으므로, 주채무자가 동시이행항변권을 가지는 경우 보증인도 이를 주장할 수 있는 경우가 있다.","a":"O","e":"보증인은 주채무에 부착된 항변을 원용할 수 있다. 항변의 성질에 따라 검토한다."},{"p":25,"q":"보증인은 주채무자의 취소권을 당연히 자기 이름으로 행사하여 주채무를 취소할 수 있다.","a":"X","e":"보증인이 주채무자의 항변을 원용할 수 있다는 것과 주채무자의 형성권을 당연히 행사할 수 있다는 것은 구별한다."},{"p":25,"q":"보증인이 채권자에게 변제하면 주채무자는 보증인에게 아무 책임도 지지 않는다.","a":"X","e":"보증인이 변제하면 주채무자에 대한 구상권 또는 대위가 문제된다."},{"p":25,"q":"일반보증인은 주채무자에게 변제자력이 있고 집행이 용이함을 증명하여 검색의 항변권을 행사할 수 있다.","a":"O","e":"검색항변권은 단순히 재산이 있다는 주장만으로 부족하고 집행이 용이한 재산이 있어야 한다는 식으로 출제된다."},{"p":25,"q":"최고항변권과 검색항변권은 연대보증인에게도 원칙적으로 인정된다.","a":"X","e":"연대보증인은 보충성이 없으므로 최고·검색항변권을 행사할 수 없다."},{"p":25,"q":"채권자가 주채무자에게 먼저 청구했지만 변제받지 못한 경우, 일반보증인에게 청구할 수 있다.","a":"O","e":"일반보증의 보충성이 충족되면 보증인에게 책임을 물을 수 있다."},{"p":25,"q":"주채무자가 파산한 경우에도 일반보증인은 언제나 최고·검색의 항변권을 행사할 수 있다.","a":"X","e":"주채무자가 파산하거나 행방불명인 경우 등에는 보충성 항변이 제한될 수 있다."},{"p":25,"q":"보증인이 수인인 경우에도 각 보증인이 연대보증을 한 때에는 채권자는 각 보증인에게 전액을 청구할 수 있다.","a":"O","e":"연대보증 형태라면 분별의 이익이 배제되어 각 보증인에게 전액청구가 가능하다."},{"p":25,"q":"공동보증에서 분별의 이익이 인정되면 각 보증인은 자신의 부담부분만 책임진다.","a":"O","e":"일반 공동보증은 특별한 약정이 없으면 각 보증인이 분할된 책임을 부담한다."},{"p":25,"q":"공동보증에서 1인이 자기 부담부분을 넘게 변제한 경우 다른 보증인에게 구상할 수 없다.","a":"X","e":"초과 변제한 공동보증인은 다른 보증인에게 부담부분에 따른 구상을 할 수 있다."},{"p":25,"q":"보증채무는 주채무와 동일한 내용을 가지므로 보증채무의 목적은 주채무와 전혀 다르게 정할 수 없다.","a":"O","e":"보증채무는 주채무의 이행을 담보하는 채무이므로 기본적으로 주채무와 동일한 내용이어야 한다."},{"p":25,"q":"보증인이 채권자에게 변제한 뒤 채권자의 담보권을 대위행사하는 경우, 이는 보증인의 구상권 확보와 관련된다.","a":"O","e":"변제자대위는 보증인의 구상권을 실효적으로 확보하기 위한 기능이 있다."},{"p":25,"q":"보증채무의 부종성 때문에 주채무자가 채권자에게 가지는 모든 개인적 사유가 항상 보증인에게 그대로 이전된다.","a":"X","e":"보증인이 원용할 수 있는 항변과 개인적 사유의 범위를 구별해야 한다. 모든 형성권·개인사유가 자동 이전되는 것은 아니다."},{"p":25,"q":"채권자가 보증인의 책임을 지나치게 확대하여 주장하는 경우 신의칙상 보증책임 제한이 문제될 수 있다.","a":"O","e":"채권자의 권리행사가 신의칙에 비추어 용납될 수 없는 경우 보증인의 책임 제한이 극히 예외적으로 가능하다."},{"p":25,"q":"분할채무에서는 채권자가 모든 채무자에게 동시에 청구하더라도 각 채무자에게는 자기 부담부분만 청구할 수 있다.","a":"O","e":"동시 청구 자체는 가능하더라도 각자에게 전부를 청구할 수는 없다."},{"p":25,"q":"연대채무에서는 채권자가 한 채무자에게 일부만 청구한 뒤 나머지를 다른 채무자에게 청구할 수 있다.","a":"O","e":"채권자는 동시 또는 순차로 전부나 일부를 청구할 수 있다."},{"p":25,"q":"불가분채무에서 채권자가 1인에게 전부 이행을 받은 뒤 다시 다른 채무자에게 전부 이행을 청구할 수 있다.","a":"X","e":"전부 이행으로 채권자가 만족하면 다른 채무자는 면책된다. 이중이행 청구는 안 된다."},{"p":25,"q":"보증인은 채권자에 대하여 주채무가 소멸했다는 항변을 할 수 있다.","a":"O","e":"주채무 소멸은 보증채무 소멸로 이어지므로 보증인이 주장할 수 있다."},{"p":25,"q":"연대채무자 1인이 채권자와 무효인 법률행위를 했다는 사정은 항상 모든 연대채무자에게 유리하게 작용한다.","a":"X","e":"1인에게 생긴 무효·취소 등 개인적 사유는 원칙적으로 상대효이다."},{"p":25,"q":"불가분채권자 중 1인에게 한 변제는 모든 채권자에게 효력이 있을 수 있다.","a":"O","e":"채무자의 이행은 불가분채권에서 모든 채권자에게 효력이 있는 대표적 사유이다."},{"p":25,"q":"불가분채권자 중 1인이 채무자에게 한 면제는 다른 채권자의 몫까지 당연히 소멸시키지 않는다.","a":"O","e":"1인의 면제는 원칙적으로 다른 불가분채권자에게 효력이 없다."},{"p":25,"q":"보증채무에서 채권자는 주채무와 전혀 무관한 독립채권을 보증인에게 청구할 수 있다.","a":"X","e":"보증채무는 주채무를 담보하는 종된 채무이다. 주채무와 무관한 청구는 보증채무가 아니다."},{"p":25,"q":"연대채무와 부진정연대채무는 모두 채무자 중 1인의 변제로 채권자가 만족하면 다른 채무자도 그 범위에서 면책된다는 공통점이 있다.","a":"O","e":"동일 급부 또는 동일 손해에 대한 책임이라는 점에서 채권자 만족 후 이중청구는 허용되지 않는다."},{"p":25,"q":"부진정연대채무에서는 연대채무와 마찬가지로 1인에 대한 면제가 언제나 다른 채무자에게도 절대효를 가진다.","a":"X","e":"부진정연대채무는 절대효를 넓게 인정하지 않는다. 면제의 효력은 특히 조심한다."},{"p":26,"q":"계약은 서로 대립하는 2개 이상의 의사표시가 내용상 합치함으로써 성립하는 법률행위이다.","a":"O","e":"계약은 청약과 승낙처럼 서로 대립하는 의사표시가 주관적ㆍ객관적으로 합치하면 성립한다."},{"p":26,"q":"계약이 성립하려면 반드시 계약서가 작성되어야 한다.","a":"X","e":"계약은 원칙적으로 낙성ㆍ불요식이다. 특별한 요식이 요구되는 경우가 아니면 계약서 작성은 성립요건이 아니다."},{"p":26,"q":"쌍무계약은 양 당사자가 서로 대가적 의미의 채무를 부담하는 계약이다.","a":"O","e":"매매ㆍ임대차처럼 서로 대가관계에 있는 채무를 부담하면 쌍무계약이다."},{"p":26,"q":"유상계약이면 언제나 쌍무계약이고, 쌍무계약이면 언제나 유상계약이다.","a":"X","e":"쌍무계약은 대가적 채무가 있으므로 유상계약이지만, 유상계약 중에는 편무계약도 있을 수 있다."},{"p":26,"q":"동시이행의 항변권과 위험부담은 쌍무계약의 특유한 효력이다.","a":"O","e":"쌍무계약의 성립ㆍ이행ㆍ존속상 견련성에서 동시이행항변권과 위험부담 문제가 생긴다."},{"p":26,"q":"제3자를 위한 계약은 쌍무계약에만 인정된다.","a":"X","e":"제3자를 위한 계약은 계약효과 귀속의 문제이고 반드시 쌍무계약이어야 하는 것은 아니다."},{"p":26,"q":"청약과 청약의 유인 모두 상대방의 승낙만 있으면 곧바로 계약을 성립시키는 의사표시이다.","a":"X","e":"청약은 승낙만 있으면 계약이 성립할 정도로 확정적ㆍ구체적이어야 한다. 청약의 유인은 상대방의 청약을 끌어내는 것에 불과하다."},{"p":26,"q":"청약은 상대방이 특정인인 경우뿐 아니라 불특정 다수인을 상대로도 할 수 있다.","a":"O","e":"자료는 정찰제 상품 진열, 버스정류장 정차, 자동판매기 설치 등을 청약의 사례로 정리한다."},{"p":26,"q":"청약의 내용은 상대방의 승낙이 있으면 계약이 바로 성립할 수 있을 정도로 확정되었거나 확정 가능하여야 한다.","a":"O","e":"내용이 확정적ㆍ구체적이어야 청약이고, 불명확하면 청약의 유인에 그칠 수 있다."},{"p":26,"q":"청약자가 누구인지 청약의 의사표시에 반드시 명시적으로 표시되어야 한다.","a":"X","e":"청약자는 계약당사자가 될 특정인이면 되고, 표시 전체로 청약자를 알 수 있으면 충분하다."},{"p":26,"q":"승낙기간을 정하지 않은 청약은 언제나 즉시 효력을 잃는다.","a":"X","e":"승낙기간을 정하지 않아도 상당한 기간 동안 효력이 유지될 수 있다."},{
