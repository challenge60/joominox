"p":26,"q":"청약에 승낙기간을 정한 경우, 청약자는 원칙적으로 그 기간 내에 청약을 철회하지 못한다.","a":"O","e":"승낙기간을 정한 청약은 그 기간 동안 상대방의 승낙 가능성을 보장하는 취지다."},{"p":26,"q":"승낙은 청약의 내용과 실질적으로 일치하여야 하며, 변경을 가한 승낙은 원칙적으로 새로운 청약이다.","a":"O","e":"승낙이 청약의 내용을 변경하면 청약에 대한 거절과 동시에 새 청약으로 본다."},{"p":26,"q":"청약과 승낙의 상대방이 서로 일치하지 않아도 객관적 내용만 같으면 계약은 성립한다.","a":"X","e":"계약 성립에는 객관적 내용 일치뿐 아니라 주관적 상대방 일치도 필요하다."},{"p":26,"q":"정찰제 상품 진열처럼 가격과 물건이 명확한 경우에는 자료상 청약의 사례로 정리된다.","a":"O","e":"자료는 정찰제 상품 진열, 자동판매기 설치 등을 청약 사례로 든다."},{"p":26,"q":"버스정류장에 버스가 정차하는 것은 자료상 청약의 사례로 볼 수 없다.","a":"X","e":"자료는 버스정류장 정차도 청약 사례로 정리한다."},{"p":26,"q":"승낙기간 내에 승낙이 도달하지 못하면 원칙적으로 계약은 성립하지 않는다.","a":"O","e":"승낙은 기간 내 도달해야 한다. 기간 후 도달한 승낙은 원칙적으로 연착 승낙이다."},{"p":26,"q":"승낙자가 늦게 발송하여 승낙이 연착한 경우, 계약은 당연히 성립한다.","a":"X","e":"늦게 발송하여 연착한 경우 청약 효력은 소멸하고 계약은 성립하지 않는다. 다만 청약자가 새 청약으로 볼 수 있다."},{"p":26,"q":"승낙기간 내 도달할 수 있도록 발송했으나 통상 도착할 때보다 늦게 도달한 사고연착의 경우, 청약자가 지체 없이 연착통지를 하지 않으면 승낙은 연착하지 않은 것으로 본다.","a":"O","e":"사고연착은 청약자의 연착통지의무가 핵심이다. 통지하지 않으면 계약이 성립한다."},{"p":26,"q":"사고연착의 경우 청약자가 지연통지 또는 연착통지를 하면 계약은 성립하지 않는다.","a":"O","e":"청약자가 연착 사실을 통지하면 승낙은 효력을 얻지 못한다."},{"p":26,"q":"연착한 승낙은 청약자가 이를 새로운 청약으로 볼 수 있다.","a":"O","e":"연착 승낙 자체로는 계약이 성립하지 않지만, 청약자가 새 청약으로 취급하여 승낙하면 계약이 성립할 수 있다."},{"p":26,"q":"승낙기간을 정한 청약에 대한 승낙이 기간 내 발송되기만 하면 도달 여부와 관계없이 계약은 언제나 성립한다.","a":"X","e":"승낙은 원칙적으로 도달주의가 적용된다. 발송만으로 언제나 성립하는 것은 아니다."},{"p":26,"q":"교차청약은 서로 내용이 같은 청약이 상대방에게 도달한 때, 즉 나중의 청약이 도달한 때 계약이 성립한다.","a":"O","e":"내용이 같은 쌍방의 청약이 모두 도달하면 계약이 성립한다."},{"p":26,"q":"교차청약에서 두 청약의 내용이 다르더라도 두 청약이 모두 도달하면 계약은 성립한다.","a":"X","e":"교차청약은 내용이 동일해야 한다. 내용이 다르면 의사표시의 합치가 없다."},{"p":26,"q":"의사실현에 의한 계약은 승낙의 의사표시로 인정되는 사실이 있는 때 성립한다.","a":"O","e":"예컨대 주문과 다른 물건이 배달된 경우 반송하지 않고 소비하는 등 승낙으로 볼 사실이 있으면 계약이 성립할 수 있다."},{"p":26,"q":"의사실현에 의한 계약성립은 명시적 승낙의 의사표시가 있어야만 인정된다.","a":"X","e":"명시적 승낙이 없어도 승낙으로 볼 만한 사실이 있으면 성립할 수 있다."},{"p":26,"q":"계약의 성립에는 원칙적으로 청약과 승낙 외에도 교차청약, 의사실현에 의한 성립이 인정될 수 있다.","a":"O","e":"계약성립 방식은 청약ㆍ승낙이 기본이지만 교차청약과 의사실현도 가능하다."},{"p":26,"q":"승낙자가 청약의 내용에 조건을 붙여 승낙한 경우에는 원칙적으로 계약이 성립하고 그 조건만 무효가 된다.","a":"X","e":"조건부 승낙은 청약내용을 변경한 승낙이므로 원칙적으로 새 청약이다."},{"p":26,"q":"계약체결 당시 이미 목적이 불능인 원시적 불능의 계약은 원칙적으로 무효이다.","a":"O","e":"원시적 불능은 법률행위 목적의 가능성이 없어 무효가 된다."},{"p":26,"q":"계약체결 후에 목적이 불능으로 된 후발적 불능의 경우, 계약은 처음부터 무효이다.","a":"X","e":"후발적 불능은 일단 유효하게 성립한 계약의 이행불능 문제이다. 귀책사유가 있으면 채무불이행이 문제된다."},{"p":26,"q":"원시적 불능의 계약에서 불능을 알았거나 알 수 있었던 자는 상대방이 선의ㆍ무과실이면 계약체결상의 과실책임을 질 수 있다.","a":"O","e":"상대방이 계약 유효를 믿고 입은 손해를 배상하는 제535조 책임이다."},{"p":26,"q":"계약체결상의 과실책임에서 배상범위는 원칙적으로 이행이익이다.","a":"X","e":"계약이 유효하다고 믿은 데 따른 신뢰이익 배상이 원칙이다."},{"p":26,"q":"계약체결상의 과실책임에서 신뢰이익은 이행이익을 초과할 수 없다.","a":"O","e":"무효계약인데도 이행되었을 때보다 더 큰 배상을 인정하지 않는다."},{"p":26,"q":"원시적 불능을 이유로 한 계약체결상의 과실책임은 상대방이 불능에 대해 악의라도 언제나 인정된다.","a":"X","e":"상대방이 선의ㆍ무과실이어야 한다."},{"p":26,"q":"계약교섭단계에서 상당한 이유 없이 교섭을 부당하게 파기한 경우, 판례는 계약책임이 아니라 불법행위책임을 인정할 수 있다.","a":"O","e":"계약이 성립하지 않았으므로 계약책임이 아니라 신의칙상 보호의무 위반에 기초한 불법행위책임이 문제된다."},{"p":26,"q":"계약교섭의 부당파기로 인한 손해배상은 원칙적으로 계약이 유효하게 체결되었다면 얻었을 이행이익 전부이다.","a":"X","e":"원칙적으로 계약 체결을 신뢰하여 입은 상당인과관계 있는 신뢰손해에 한정된다."},{"p":26,"q":"계약교섭의 부당파기가 인격적 법익을 침해하여 정신적 고통을 초래하면 위자료가 인정될 수 있다.","a":"O","e":"판례는 별도의 정신적 손해배상을 인정할 수 있다고 본다."},{"p":26,"q":"계약교섭이 상당히 진행되었더라도 당사자는 언제나 아무 책임 없이 자유롭게 교섭을 중단할 수 있다.","a":"X","e":"원칙적으로 계약자유가 있으나 신뢰를 부여한 뒤 상당한 이유 없이 파기하면 불법행위책임이 문제될 수 있다."},{"p":26,"q":"동시이행의 항변권은 쌍무계약에서 대가관계에 있는 채무 사이에 인정되는 항변권이다.","a":"O","e":"이행상의 견련성에서 인정된다."},{"p":26,"q":"동시이행의 항변권이 인정되려면 원칙적으로 상대방 채무가 변제기에 있어야 한다.","a":"O","e":"상대방 채무의 이행기가 도래하지 않았다면 동시이행을 주장하기 어렵다."},{"p":26,"q":"자기 채무의 이행기가 도래하지 않은 경우에도 상대방은 언제나 동시이행의 항변권을 주장할 수 없다.","a":"X","e":"동시이행항변은 대가관계와 이행기 도래가 핵심이다. 구체적으로 자기 채무와 상대방 채무의 변제기 상황을 따져야 한다."},{"p":26,"q":"상대방이 자기 채무를 이행하거나 적법하게 이행제공하면 동시이행의 항변권은 소멸한다.","a":"O","e":"상대방이 이행 또는 이행제공을 하면 더 이상 동시이행을 거절할 수 없다."},{"p":26,"q":"동시이행의 항변권을 가진 채무자는 상대방의 이행제공이 있을 때까지 이행지체책임을 지지 않는다.","a":"O","e":"항변권 존재 중에는 이행을 거절할 정당한 권능이 있으므로 지체가 성립하지 않는다."},{"p":26,"q":"동시이행의 항변권은 법원이 직권으로 고려하여야 하므로 당사자가 주장하지 않아도 당연히 인정된다.","a":"X","e":"동시이행항변권은 항변권이므로 원칙적으로 당사자가 주장해야 한다."},{"p":26,"q":"동시이행의 항변권은 권리남용이 될 수 없다.","a":"X","e":"이행회피 수단으로 악용되면 권리남용으로 배척될 수 있다."},{"p":26,"q":"매매에서 매도인의 소유권이전등기의무와 매수인의 대금지급의무는 원칙적으로 동시이행관계에 있다.","a":"O","e":"서로 대가적 의미의 채무이므로 동시이행관계가 기본이다."},{"p":26,"q":"매매계약이 취소된 경우 당사자의 원상회복의무는 원칙적으로 동시이행관계에 있다.","a":"O","e":"쌍방의 반환의무는 공평상 동시이행관계로 본다."},{"p":26,"q":"계약해제로 인한 원상회복의무 상호 간에는 원칙적으로 동시이행관계가 인정된다.","a":"O","e":"해제로 쌍방이 받은 것을 반환해야 하므로 동시이행관계가 인정된다."},{"p":26,"q":"임대차 종료 후 임차인의 목적물 반환의무와 임대인의 보증금 반환의무는 원칙적으로 동시이행관계에 있다.","a":"O","e":"임대차 실무상 빈출 포인트다. 보증금 반환과 목적물 인도는 견련관계가 인정된다."},{"p":26,"q":"임차보증금 반환채무와 임차인의 차임지급채무는 언제나 동시이행관계에 있다.","a":"X","e":"차임지급채무와 보증금반환채무는 성질상 당연한 동시이행관계로 보기는 어렵다. 구체적 관계를 따져야 한다."},{"p":26,"q":"동시이행의 항변권은 이행거절권능일 뿐 채무 자체를 소멸시키는 권리는 아니다.","a":"O","e":"상대방이 이행제공하면 이행해야 하므로 채무소멸 사유가 아니다."},{"p":26,"q":"동시이행의 항변권은 원칙적으로 쌍무계약에서 발생하지만, 공평의 원칙상 쌍방 반환의무에도 유추 적용될 수 있다.","a":"O","e":"취소ㆍ해제 후 쌍방의 원상회복의무 등에서 인정된다."},{"p":26,"q":"상대방이 채무의 일부만 이행제공한 경우에도 언제나 동시이행항변권은 전부 소멸한다.","a":"X","e":"일부 이행제공으로 충분한지는 채무의 성질ㆍ비율ㆍ신의칙에 따라 판단한다. 언제나 전부 소멸은 아니다."},{"p":26,"q":"동시이행항변권이 붙은 채권도 상계의 자동채권으로 행사하는 데에는 제한이 문제될 수 있다.","a":"O","e":"상계와 동시이행항변의 관계는 공평상 제한될 수 있다. 특히 상대방 항변권을 일방적으로 빼앗는 상계는 문제된다."},{"p":26,"q":"쌍무계약에서 상대방의 재산상태 악화 등으로 반대급부 이행이 곤란할 현저한 사유가 있으면 먼저 이행할 의무 있는 자도 이행을 거절할 수 있다.","a":"O","e":"이른바 불안의 항변권이다. 선이행의무자가 신의칙상 보호받는 구조다."},{"p":26,"q":"불안의 항변권은 계약 체결 당시 이미 알고 있었던 사유에 대해서만 인정된다.","a":"X","e":"계약 후 상대방의 이행이 곤란할 현저한 사유가 생긴 경우가 핵심이다."},{"p":26,"q":"불안의 항변권은 상대방의 이행곤란이 현저해야 하므로 단순한 막연한 불안감만으로는 부족하다.","a":"O","e":"객관적으로 이행이 곤란할 현저한 사유가 있어야 한다."},{"p":26,"q":"위험부담은 쌍무계약에서 일방 채무가 당사자 쌍방의 책임 없는 사유로 후발적으로 불능이 된 경우 반대급부 채무의 존속을 정하는 문제이다.","a":"O","e":"후발적 불능 중 귀책사유 없는 경우 누가 위험을 부담하는지가 문제된다."},{"p":26,"q":"쌍무계약에서 채무자에게 책임 없는 사유로 채무가 이행불능이 된 경우, 원칙적으로 채무자는 상대방의 이행을 청구할 수 없다.","a":"O","e":"민법은 원칙적으로 채무자위험부담주의를 취한다."},{"p":26,"q":"채무자위험부담주의란 채무자가 자신의 채무를 이행하지 못해도 상대방에게 반대급부를 청구할 수 있다는 뜻이다.","a":"X","e":"채무자의 채무가 무책으로 불능이면 채무자가 반대급부를 청구하지 못한다."},{"p":26,"q":"채권자의 책임 있는 사유로 채무자의 이행이 불능이 된 경우, 채무자는 반대급부를 청구할 수 있다.","a":"O","e":"채권자위험부담의 예외다. 다만 채무자는 자기 채무를 면함으로써 얻은 이익을 상환해야 한다."},{"p":26,"q":"채권자가 수령지체 중인 경우에는 일정한 경우 채권자위험부담이 문제될 수 있다.","a":"O","e":"수령지체 상태에서 불능이 발생하면 채권자에게 위험을 부담시키는 구조가 문제된다."},{"p":26,"q":"위험부담은 원시적 불능의 계약에서도 적용된다.","a":"X","e":"원시적 불능은 계약 무효 및 계약체결상 과실 문제이고, 위험부담은 후발적 불능에서 문제된다."},{"p":26,"q":"채무자의 귀책사유로 이행불능이 된 경우에는 위험부담이 아니라 채무불이행책임이 문제된다.","a":"O","e":"귀책사유가 있으면 손해배상ㆍ해제 등 채무불이행 문제가 된다."},{"p":26,"q":"위험부담에서 채무자가 반대급부를 청구할 수 없게 되는 경우에도 이미 받은 반대급부가 있으면 부당이득반환 문제가 생길 수 있다.","a":"O","e":"반대급부 청구권이 없는데 이미 받은 것이 있다면 반환해야 한다."},{"p":26,"q":"쌍무계약의 위험부담은 계약의 성립상 견련성에서 직접 나온다.","a":"X","e":"위험부담은 존속상 견련성의 문제로 설명된다. 동시이행은 이행상 견련성이다."},{"p":26,"q":"쌍무계약에서 일방의 채무가 무효이면 상대방의 대가채무도 성립하지 않는다는 것은 성립상의 견련성이다.","a":"O","e":"쌍무계약의 양 채무는 성립부터 서로 견련된다."},{"p":26,"q":"쌍무계약에서 상대방이 이행할 때까지 자기 이행을 거절할 수 있다는 것은 존속상의 견련성이다.","a":"X","e":"이는 이행상의 견련성이고, 동시이행항변권의 근거다."},{"p":26,"q":"제3자를 위한 계약은 요약자와 낙약자가 계약을 체결하여 낙약자가 제3자에게 급부할 것을 약정하는 계약이다.","a":"O","e":"요약자-낙약자 사이의 계약으로 수익자가 이익을 받는 구조다."},{"p":26,"q":"제3자를 위한 계약에서 제3자는 계약당사자이다.","a":"X","e":"계약당사자는 요약자와 낙약자이고, 제3자는 수익자다."},{"p":26,"q":"제3자를 위한 계약에서 수익자는 수익의 의사표시를 해야 비로소 낙약자에 대한 권리를 취득한다.","a":"O","e":"수익의 의사표시가 권리취득 시점이다."},{"p":26,"q":"제3자를 위한 계약에서 수익의 의사표시는 요약자에게 하여야 한다.","a":"X","e":"수익의 의사표시는 낙약자에게 한다."},{"p":26,"q":"수익자는 수익의 의사표시를 하기 전에는 낙약자에게 직접 급부를 청구할 수 없다.","a":"O","e":"수익의 의사표시 전에는 아직 권리를 취득하지 않았다."},{"p":26,"q":"수익자가 수익의 의사표시를 한 후에는 요약자와 낙약자가 수익자의 권리를 임의로 변경하거나 소멸시키지 못한다.","a":"O","e":"수익자의 권리 확정 후에는 수익자 보호가 필요하다."},{"p":26,"q":"제3자를 위한 계약에서 낙약자는 계약에서 생긴 항변으로 수익자에게 대항할 수 있다.","a":"O","e":"수익자는 계약상 지위를 기초로 권리를 취득하므로 낙약자의 항변도 받는다."},{"p":26,"q":"제3자를 위한 계약에서 요약자의 채무불이행이 있더라도 낙약자는 수익자에게 아무 항변도 할 수 없다.","a":"X","e":"계약관계에서 생긴 항변은 수익자에게도 주장할 수 있다."},{"p":26,"q":"수익자는 제3자를 위한 계약의 이익을 거절할 수 있다.","a":"O","e":"수익자는 일방적으로 이익을 강요받지 않는다. 수익을 거절할 수 있다."},{"p":26,"q":"수익자가 수익을 거절하면 처음부터 권리를 취득하지 않은 것으로 된다.","a":"O","e":"수익의 의사표시와 반대로 수익을 거절하면 권리취득이 문제되지 않는다."},{"p":26,"q":"제3자를 위한 계약은 수익자가 계약체결 당시 반드시 현존하고 특정되어 있어야만 한다.","a":"X","e":"장래 또는 불특정의 제3자도 일정한 기준으로 특정 가능하면 가능하다."},{"p":26,"q":"제3자를 위한 계약에서 수익자는 계약의 해제권을 당연히 행사할 수 있다.","a":"X","e":"해제권은 원칙적으로 계약당사자에게 있다. 수익자는 급부청구권을 취득하는 것이 기본이다."},{"p":26,"q":"낙약자가 수익자에게 급부하지 않는 경우, 요약자도 계약당사자로서 낙약자에게 이행을 청구할 수 있다.","a":"O","e":"요약자는 계약당사자로서 낙약자에게 제3자에게 급부할 것을 청구할 수 있다."},{"p":26,"q":"수익의 의사표시 후에는 수익자의 권리가 확정되므로 요약자는 언제나 계약해제를 할 수 없다.","a":"X","e":"수익자 권리를 침해하지 않는 범위, 또는 요건에 따라 해제 문제는 별도로 검토된다. 언제나 불가능이라고 단정할 수 없다."},{"p":26,"q":"해제는 유효하게 성립한 계약의 효력을 소급적으로 소멸시키는 일방적 의사표시이다.","a":"O","e":"해제는 형성권 행사로 계약관계를 처음부터 없었던 것처럼 돌리는 효과가 원칙이다."},{"p":26,"q":"해지는 계속적 계약관계를 장래를 향하여 소멸시키는 것이 원칙이다.","a":"O","e":"해지는 장래효가 원칙이다. 임대차ㆍ고용 등 계속적 계약에서 중요하다."},{"p":26,"q":"해제권은 형성권이므로 상대방의 승낙이 있어야 효력이 발생한다.","a":"X","e":"형성권은 일방적 의사표시로 효력이 발생한다. 상대방 승낙은 필요 없다."},{"p":26,"q":"이행지체를 이유로 계약을 해제하려면 원칙적으로 상당한 기간을 정하여 이행을 최고하고 그 기간 내 이행이 없어야 한다.","a":"O","e":"민법 제544조 구조다. 최고 없는 해제가 가능한 예외와 구별해야 한다."},{"p":26,"q":"이행지체가 있으면 채권자는 언제나 최고 없이 즉시 계약을 해제할 수 있다.","a":"X","e":"원칙적으로 상당한 기간을 정한 최고가 필요하다."},{"p":26,"q":"정기행위에서 그 시기에 이행하지 않으면 계약목적을 달성할 수 없는 경우에는 최고 없이 해제할 수 있다.","a":"O","e":"정기행위는 이행시기가 본질적이므로 최고가 무의미할 수 있다."},{"p":26,"q":"채무자가 미리 이행하지 아니할 의사를 명백히 표시한 경우에도 최고 없이 해제할 수 있다.","a":"O","e":"이행거절이 명백하면 최고가 무의미하므로 최고 없이 해제 가능하다."},{"p":26,"q":"이행불능이 채무자의 책임 있는 사유로 발생한 경우 채권자는 최고 없이 계약을 해제할 수 있다.","a":"O","e":"이행 자체가 불가능하므로 최고가 필요 없다."},{"p":26,"q":"채무자의 귀책사유 없는 이행불능에도 채무불이행을 이유로 한 해제권이 당연히 발생한다.","a":"X","e":"채무불이행 해제는 귀책사유가 문제된다. 귀책 없는 후발불능은 위험부담 문제로 간다."},{"p":26,"q":"계약해제의 의사표시는 철회하지 못한다.","a":"O","e":"해제권 행사로 법률관계가 형성되므로 원칙적으로 철회할 수 없다."},{"p":26,"q":"계약해제의 효과로 각 당사자는 상대방을 원상회복시킬 의무를 부담한다.","a":"O","e":"계약이 소급적으로 소멸하므로 받은 것을 반환해야 한다."},{"p":26,"q":"해제로 인한 원상회복의무에는 받은 금전에 이자를 붙여 반환할 의무가 포함될 수 있다.","a":"O","e":"금전을 받은 경우 그 받은 날부터 이자를 붙여 반환하는 것이 원칙이다."},{"p":26,"q":"계약해제는 손해배상청구에 영향을 미치지 않는다.","a":"O","e":"해제와 손해배상은 병존 가능하다."},{"p":26,"q":"계약해제가 있으면 채권자는 손해배상을 청구할 수 없다.","a":"X","e":"해제는 손해배상청구를 배척하지 않는다."},{"p":26,"q":"계약해제는 제3자의 권리를 해하지 못한다.","a":"O","e":"민법은 해제의 소급효로부터 제3자를 보호한다."},{"p":26,"q":"해제 전에 목적물을 양수하고 등기까지 마친 제3자는 원칙적으로 해제의 소급효로부터 보호될 수 있다.","a":"O","e":"해제의 제3자 보호는 등기 등 권리취득 요건을 갖춘 자가 중심이다."},{"p":26,"q":"해제 후에 해제 사실을 모르고 목적물을 취득한 제3자도 언제나 민법상 해제의 제3자로 보호된다.","a":"X","e":"해제 후 제3자는 해제의 소급효 제한 규정의 제3자와 구별된다. 등기 공신력 문제 등 별도 검토가 필요하다."},{"p":26,"q":"해제권자가 수인인 경우 그 중 1인만의 의사표시로 전원을 위하여 해제할 수 있는 것이 원칙이다.","a":"X","e":"해제권의 불가분성에 따라 당사자 일방 또는 쌍방이 수인인 경우 해제는 전원으로부터 또는 전원에 대하여 해야 한다."},{"p":26,"q":"해제권의 불가분성 때문에 해제권자 중 1인에게 해제권이 소멸하면 다른 해제권자에게도 소멸하는 경우가 있다.","a":"O","e":"해제권의 통일적 행사를 위한 불가분성의 내용이다."},{"p":26,"q":"계약의 일부만 이행불능이 된 경우에도 언제나 계약 전부를 해제하여야 한다.","a":"X","e":"일부불능만으로는 전부해제가 항상 되는 것은 아니다. 계약목적 달성 여부 등을 따진다."},{"p":26,"q":"부수적 채무의 불이행만으로는 원칙적으로 계약 전부의 해제가 제한될 수 있다.","a":"O","e":"주된 계약목적 달성에 중대한 영향을 미치는지 판단한다."},{"p":26,"q":"해제권이 행사되면 계약은 장래에 대해서만 효력을 잃는 것이 원칙이다.","a":"X","e":"해제는 소급효, 해지는 장래효가 원칙이다."},{"p":26,"q":"합의해제는 법정해제와 달리 당사자의 새로운 계약으로 기존 계약을 소멸시키는 것이다.","a":"O","e":"합의해제는 해제권 행사와 달리 당사자 합의에 의한 계약관계 소멸이다."},{"p":26,"q":"합의해제의 경우에도 언제나 법정해제의 원상회복ㆍ손해배상 규정이 그대로 적용된다.","a":"X","e":"합의 내용에 따라 정해지는 것이 원칙이고, 법정해제 규정이 당연히 그대로 적용되는 것은 아니다."},{"p":26,"q":"해지는 계속적 계약관계를 장래에 향하여 소멸시키는 의사표시이다.","a":"O","e":"해지는 임대차ㆍ고용ㆍ위임 같은 계속적 계약에서 주로 문제된다."},{"p":26,"q":"해지가 있으면 이미 발생한 과거의 법률관계도 원칙적으로 소급하여 소멸한다.","a":"X","e":"해지는 장래효가 원칙이므로 과거의 이행관계는 유지된다."},{"p":26,"q":"계속적 계약에서 중대한 채무불이행이 있으면 해지권이 문제될 수 있다.","a":"O","e":"계약관계의 지속을 기대하기 어려운 경우 해지가 문제된다."},{"p":26,"q":"임대차계약에서 차임연체 등 법정요건이 충족되면 임대인은 계약을 해지할 수 있다.","a":"O","e":"임대차는 계속적 계약이므로 요건 충족 시 장래효로 종료시킨다."},{"p":26,"q":"해지의 의사표시는 해제와 달리 상대방의 승낙이 있어야 효력이 생긴다.","a":"X","e":"해지도 형성권 행사로 일방적 의사표시에 의해 효력이 생긴다."},{"p":26,"q":"해지와 해제는 모두 형성권 행사라는 점에서 공통된다.","a":"O","e":"둘 다 일방적 의사표시로 법률관계를 변동시키는 형성권이다."},{"p":26,"q":"해지 후에도 해지 전 이미 발생한 차임채권 등은 원칙적으로 소멸하지 않는다.","a":"O","e":"해지는 장래효이므로 과거에 발생한 권리ㆍ의무는 유지된다."},{"p":26,"q":"기간의 약정이 없는 계속적 계약에서는 일정한 요건 아래 해지통고로 종료시킬 수 있다.","a":"O","e":"계속적 계약을 영구히 구속할 수 없으므로 해지통고 제도가 문제된다."},{"p":26,"q":"계약금은 특별한 약정이 없는 한 해약금으로 추정된다.","a":"O","e":"매매에서 계약금은 별도 약정이 없으면 해약금 성질로 추정된다."},{"p":26,"q":"계약금이 해약금으로 인정되면 매수인은 계약금을 포기하고, 매도인은 그 배액을 상환하여 계약을 해제할 수 있다.","a":"O","e":"다만 상대방이 이행에 착수하기 전까지 가능하다."},{"p":26,"q":"해약금에 의한 해제는 상대방이 이행에 착수한 후에도 언제나 가능하다.","a":"X","e":"상대방이 이행에 착수하면 해약금 해제는 제한된다."},{"p":26,"q":"계약금 일부만 지급된 경우에도 매도인이 해약금 해제를 하려면 약정 계약금 전액의 배액을 제공해야 한다는 판례가 있다.","a":"O","e":"실전에서는 “실제 받은 일부의 배액” 함정을 조심한다. 판례는 약정 계약금 기준으로 본다."},{"p":26,"q":"계약금계약은 주된 계약과 별개의 종된 계약으로서 요물계약적 성질을 가진다.","a":"O","e":"계약금이 실제 교부되어야 계약금계약이 성립한다는 점이 중요하다."},{"p":26,"q":"계약금 약정만 있고 실제 교부가 없더라도 계약금계약은 완전히 성립한다.","a":"X","e":"계약금계약은 교부가 있어야 한다. 약정만으로는 부족하다."},{"p":26,"q":"예약은 장래 본계약을 체결할 것을 약정하는 계약이다.","a":"O","e":"예약상 권리행사로 본계약 성립 여부가 문제된다."},{"p":26,"q":"매매예약완결권은 형성권으로 볼 수 있다.","a":"O","e":"예약완결권 행사로 본계약이 성립하는 구조다."},{"p":26,"q":"예약완결권은 특별한 약정이 없으면 언제까지나 행사할 수 있다.","a":"X","e":"형성권은 제척기간 등이 문제된다. 영구히 행사 가능하다고 볼 수 없다."},{"p":26,"q":"계약자유의 원칙상 당사자는 강행규정과 사회질서에 반하지 않는 범위에서 계약 내용을 자유롭게 정할 수 있다.","a":"O","e":"계약자유는 민법 기본원리지만 공공복리ㆍ강행규정ㆍ사회질서의 제한을 받는다."},{"p":26,"q":"계약자유의 원칙에는 계약체결의 자유, 상대방 선택의 자유, 내용결정의 자유, 방식의 자유가 포함된다.","a":"O","e":"계약총론 기본 구조다."},{"p":26,"q":"계약은 원칙적으로 당사자 사이에서만 효력이 있으므로 제3자에게 권리를 취득시키는 계약은 민법상 인정되지 않는다.","a":"X","e":"제3자를 위한 계약이 인정된다."},{"p":26,"q":"계약은 당사자의 합의로 성립하므로 계약의 해제나 해지도 언제나 합의로만 가능하다.","a":"X","e":"법정해제ㆍ약정해제ㆍ해지권 행사처럼 일방적 의사표시로 가능한 경우가 있다."},{"p":26,"q":"쌍무계약에서 양 채무의 견련성은 성립상ㆍ이행상ㆍ존속상 견련성으로 나누어 설명할 수 있다.","a":"O","e":"성립상 견련성, 동시이행의 근거인 이행상 견련성, 위험부담의 근거인 존속상 견련성을 구별한다."},{"p":26,"q":"성립상 견련성은 일방 채무가 불성립ㆍ무효ㆍ취소되면 상대방의 대가채무도 성립하지 않는다는 의미이다.","a":"O","e":"쌍무계약에서 양 채무는 성립 단계부터 서로 연결된다."},{"p":26,"q":"존속상 견련성은 상대방이 이행할 때까지 자기 채무 이행을 거절할 수 있다는 의미이다.","a":"X","e":"그것은 이행상 견련성이다. 존속상 견련성은 위험부담으로 연결된다."},{"p":26,"q":"계약의 해석에서도 표시된 문언뿐 아니라 당사자의 목적, 거래관행, 신의칙 등이 고려될 수 있다.","a":"O","e":"계약 해석은 자연적ㆍ규범적ㆍ보충적 해석과 신의칙이 함께 문제된다."},{"p":26,"q":"계약 내용이 불명확한 경우에도 사후에 확정할 기준이나 방법이 있으면 계약은 유효하게 성립할 수 있다.","a":"O","e":"목적의 확정 가능성이 있으면 충분하다."},{"p":26,"q":"계약의 중요부분에 합의가 없더라도 사소한 부수사항만 합의되면 언제나 계약은 성립한다.","a":"X","e":"본질적 사항에 대한 의사합치가 있어야 한다. 부수사항만으로는 부족하다."},{"p":26,"q":"매매계약은 특별한 사정이 없으면 재산권 이전과 대금 지급에 관한 의사합치가 있으면 성립하고, 모든 세부사항까지 합의되어야 하는 것은 아니다.","a":"O","e":"매매의 본질적 요소에 합치가 있으면 성립할 수 있다. 세부사항은 보충될 수 있다."},{"p":26,"q":"계약의 성립 여부가 다투어지는 경우 청약ㆍ승낙의 내용, 상대방, 도달 여부를 함께 검토해야 한다.","a":"O","e":"실전 지문은 청약인지 유인인지, 승낙인지 새 청약인지, 도달했는지를 섞어 낸다."},{"p":26,"q":"계약체결상의 과실책임과 계약교섭 부당파기 책임은 모두 항상 민법 제535조 책임으로만 처리된다.","a":"X","e":"제535조는 원시적 불능 중심이고, 교섭 부당파기는 판례상 불법행위책임으로 처리된다."},{"p":26,"q":"계약총론에서 “언제나”, “반드시”, “당연히”라는 표현은 청약ㆍ해제ㆍ동시이행ㆍ위험부담에서 함정이 되기 쉽다.","a":"O","e":"예외가 많은 파트이므로 절대어를 우선 의심해야 한다."},{"p":26,"q":"쌍무계약에서 동시이행항변권, 위험부담, 해제는 모두 양 채무의 견련성을 배경으로 이해하면 된다.","a":"O","e":"계약총론의 핵심 체계는 견련성이다."},{"p":26,"q":"해제와 취소는 모두 처음부터 무효로 만드는 제도이므로 제3자 보호 규정도 완전히 동일하다.","a":"X","e":"해제와 취소는 효과 구조가 유사한 면이 있으나 요건과 제3자 보호, 반환관계 등은 각각 구별해야 한다."},{"p":26,"q":"계약해제 후 원상회복청구권은 부당이득반환청구권과 유사한 성질을 가지지만 민법상 해제의 특별규율을 받는다.","a":"O","e":"원상회복은 해제 효과로 발생하는 반환관계다."},{"p":26,"q":"해제권은 당사자 약정으로 발생할 수도 있고 법률규정에 의해 발생할 수도 있다.","a":"O","e":"약정해제권과 법정해제권을 구별한다."},{"p":26,"q":"해지권은 계속적 계약관계에서만 문제되고, 일시적 계약에서는 어떠한 경우에도 논의될 수 없다.","a":"X","e":"해지는 계속적 계약에서 주로 문제되지만, “어떠한 경우에도”라는 단정은 피해야 한다."},{"p":26,"q":"계약총론 공부에서는 청약ㆍ승낙, 동시이행, 위험부담, 제3자계약, 해제ㆍ해지를 우선순위로 잡는 것이 효율적이다.","a":"O","e":"주택관리사 채권법 압축 대비에서는 출제 가능한 핵심축이다."},{"p":27,"q":"매매는 당사자 일방이 재산권을 상대방에게 이전할 것을 약정하고 상대방이 그 대금을 지급할 것을 약정함으로써 성립한다.","a":"O","e":"매매는 재산권 이전 약정과 대금지급 약정의 합치로 성립하는 낙성계약이다."},{"p":27,"q":"매매계약은 요물계약이므로 목적물의 인도나 대금의 현실적 지급이 있어야 성립한다.","a":"X","e":"매매는 낙성계약이다. 인도나 대금 지급은 성립요건이 아니라 이행 문제다."},{"p":27,"q":"매매는 유상계약·쌍무계약의 대표적인 예이다.","a":"O","e":"매도인의 재산권 이전의무와 매수인의 대금지급의무가 대가관계에 있으므로 유상·쌍무계약이다."},{"p":27,"q":"매매계약은 원칙적으로 불요식계약이므로 특별한 방식이 없더라도 의사의 합치가 있으면 성립할 수 있다.","a":"O","e":"민법상 매매는 원칙적으로 불요식계약이다. 다만 부동산등기 등 물권변동에는 별도 요건이 필요하다."},{"p":27,"q":"매매의 목적물은 반드시 물건이어야 하므로 채권이나 지식재산권은 매매의 목적이 될 수 없다.","a":"X","e":"매매의 목적은 재산권이다. 물건뿐 아니라 채권 등 재산권도 매매의 목적이 될 수 있다."},{"p":27,"q":"매매계약 체결 시 목적물과 대금이 구체적으로 확정되어 있지 않더라도 사후에 확정할 기준과 방법이 있으면 매매계약은 성립할 수 있다.","a":"O","e":"법률행위 목적은 확정되어 있거나 적어도 확정 가능하면 충분하다."},{"p":27,"q":"매매계약이 성립하려면 목적물의 소유권이 매도인에게 현실적으로 귀속되어 있어야 한다.","a":"X","e":"타인 권리 매매도 유효하게 성립할 수 있다. 다만 매도인은 그 권리를 취득하여 이전할 의무를 부담한다."},{"p":27,"q":"타인의 권리를 매매의 목적으로 한 경우에도 매도인은 그 권리를 취득하여 매수인에게 이전할 의무가 있다.","a":"O","e":"타인 권리 매매에서 매도인은 목적권리를 취득하여 매수인에게 이전해야 한다."},{"p":27,"q":"매매 목적물이 계약체결 전에 이미 전부 멸실되어 존재하지 않았다면 담보책임이 아니라 원시적 불능 문제가 된다.","a":"O","e":"목적물 자체가 계약체결 전에 이미 전부 존재하지 않으면 원시적 불능으로 무효 및 계약체결상 과실책임이 문제된다."},{"p":27,"q":"매매계약은 항상 대금의 액수가 명시되어야 하며, 시가나 감정평가액에 따르기로 한 약정은 무효이다.","a":"X","e":"대금이 현재 구체적으로 확정되지 않아도 장래 확정할 기준이 있으면 충분하다."},{"p":27,"q":"매매의 일방예약에서 예약완결권은 상대방의 승낙 없이 일방적 의사표시로 매매의 효력을 발생시키는 형성권이다.","a":"O","e":"예약완결권 행사로 본계약인 매매가 성립하므로 형성권이다."},{"p":27,"q":"매매예약완결권은 청구권이므로 소멸시효 중단사유가 있으면 기간 진행이 중단된다.","a":"X","e":"예약완결권은 형성권이고, 통상 제척기간에 걸린다. 소멸시효 중단 법리가 그대로 적용되지 않는다."},{"p":27,"q":"매매예약완결권의 행사기간을 정하지 않은 경우, 예약이 성립한 때부터 10년 내에 행사하여야 한다.","a":"O","e":"예약완결권은 약정기간이 없으면 성립일부터 10년의 제척기간 내에 행사해야 한다."},{"p":27,"q":"매매예약완결권은 행사기간을 정하지 않으면 권리자가 언제든지 제한 없이 행사할 수 있다.","a":"X","e":"약정기간이 없더라도 10년 제척기간의 제한을 받는다."},{"p":27,"q":"매매예약완결권이 행사되면 별도의 승낙 없이 본계약인 매매계약이 성립한다.","a":"O","e":"예약완결권은 일방적 의사표시로 본계약을 성립시키는 권리다."},{"p":27,"q":"매매예약에 기한 가등기는 예약완결권 자체의 존속을 보장하므로 제척기간 경과 후에도 완결권은 소멸하지 않는다.","a":"X","e":"가등기가 있어도 예약완결권의 제척기간 경과로 권리는 소멸할 수 있다."},{"p":27,"q":"매매예약완결권 행사로 성립한 매매의 효력은 특별한 사정이 없는 한 완결권 행사 시부터 발생한다.","a":"O","e":"예약완결권을 행사해야 본계약이 성립하므로 그 효력은 원칙적으로 행사 시부터 발생한다."},{"p":27,"q":"매매예약완결권은 예약권리자의 일방적 의사표시만으로 법률효과가 생기므로 의사표시가 상대방에게 도달하여야 한다.","a":"O","e":"형성권 행사도 상대방 있는 의사표시로서 원칙적으로 도달해야 효력이 생긴다."},{"p":27,"q":"계약금계약은 매매계약과 별개의 계약이지만 주된 계약에 종속되는 종된 계약이다.","a":"O","e":"계약금계약은 독립된 계약이면서 주된 계약이 무효·취소·해제되면 함께 실효되는 종된 계약이다."},{"p":27,"q":"계약금계약은 금전 기타 유가물의 현실적 교부를 요하는 요물계약이다.","a":"O","e":"계약금계약은 계약금의 현실적 교부를 성립요건으로 한다."},{"p":27,"q":"계약금을 지급하기로 약정만 하고 현실적으로 교부하지 않아도 민법상 해약금 해제권은 당연히 발생한다.","a":"X","e":"계약금계약은 요물계약이므로 현실적 교부가 없으면 계약금에 의한 해제권이 발생하지 않는다."},{"p":27,"q":"계약금의 일부만 지급하고 잔액은 나중에 지급하기로 한 경우, 잔액이 지급되지 않으면 계약금계약 성립과 해약금 해제가 문제될 수 있다.","a":"O","e":"잔금 또는 전부가 지급되지 않는 한 계약금계약이 성립하지 않아 임의해제가 제한된다는 판례가 있다."},{"p":27,"q":"모든 계약금은 언제나 증약금으로서의 성질을 가진다.","a":"O","e":"계약금은 계약체결의 증거라는 증약금 성질을 항상 가진다."},{"p":27,"q":"계약금은 반대약정이 없는 한 해약금으로 추정된다.","a":"O","e":"민법 제565조에 따라 계약금은 반대약정이 없으면 해약금으로 추정된다."},{"p":27,"q":"계약금은 위약금으로 추정되므로 별도 특약이 없어도 채무불이행 시 당연히 손해배상예정액이 된다.","a":"X","e":"계약금이 위약금 성질을 가지려면 특약이 필요하다. 위약금 약정은 손해배상액의 예정으로 추정된다."},{"p":27,"q":"계약금을 위약금으로 한다는 특약이 있으면 그 위약금은 원칙적으로 손해배상액의 예정으로 추정된다.","a":"O","e":"민법상 위약금은 손해배상액의 예정으로 추정된다."},{"p":27,"q":"해약금에 의한 해제는 당사자 일방이 이행에 착수할 때까지 가능하다.","a":"O","e":"계약금 해제권은 당사자 중 일방이 이행에 착수하기 전까지만 행사할 수 있다."},{"p":27,"q":"계약금 교부자는 이행착수 전 계약금을 포기하고 계약을 해제할 수 있다.","a":"O","e":"교부자는 계약금을 포기함으로써 해제할 수 있다."},{"p":27,"q":"계약금 수령자는 이행착수 전 계약금의 배액을 상환하고 계약을 해제할 수 있다.","a":"O","e":"수령자는 배액을 현실적으로 제공하여 해제할 수 있다."},{"p":27,"q":"계약금 수령자는 배액상환의 의사표시만 하면 현실적 제공 없이도 계약금 해제가 완성된다.","a":"X","e":"수령자는 배액을 현실적으로 이행제공해야 해제할 수 있다."},{"p":27,"q":"계약금 수령자가 배액을 현실 제공했으나 상대방이 수령을 거절한 경우, 반드시 공탁까지 해야 계약금 해제가 가능하다.","a":"X","e":"상대방이 수령을 거절하면 공탁까지 할 필요는 없다."},{"p":27,"q":"계약금을 해약금으로 해제한 경우에는 계약해제로 인한 원상회복의무나 손해배상의무가 발생하지 않는다.","a":"O","e":"계약금 해제는 약정된 해약금으로 관계를 종료시키는 것이므로 일반 해제의 원상회복·손해배상과 구별된다."},{"p":27,"q":"이행착수 후에도 계약금의 배액을 상환하면 언제나 계약금 해제가 가능하다.","a":"X","e":"이행착수 후에는 원칙적으로 계약금 해제권을 행사할 수 없다."},{"p":27,"q":"당사자 일방의 이행착수가 있으면 상대방뿐 아니라 이행착수한 당사자도 계약금 해제권을 행사할 수 없다.","a":"O","e":"민법 제565조는 당사자 일방이 이행에 착수할 때까지로 제한한다."},{"p":27,"q":"매수인이 중도금을 지급한 경우 특별한 사정이 없으면 이행에 착수한 것으로 볼 수 있다.","a":"O","e":"중도금 지급은 통상 매매계약의 이행착수에 해당한다."},{"p":27,"q":"잔금 지급기일 전에 중도금을 지급한 경우에는 기한 전 지급이므로 이행착수로 볼 수 없다.","a":"X","e":"기한 전이라도 이행의 준비를 넘어 채무이행행위 자체라면 이행착수로 볼 수 있다."},{"p":27,"q":"매도인이 소유권이전등기에 필요한 서류를 준비하고 매수인에게 이행을 최고한 것만으로 언제나 이행착수에 해당한다.","a":"X","e":"단순한 이행준비나 최고만으로는 부족할 수 있다. 구체적으로 이행행위에 나아갔는지가 문제다."},{"p":27,"q":"매도인은 매수인에게 매매 목적 재산권을 이전할 의무를 부담한다.","a":"O","e":"매매의 본질상 매도인은 재산권 이전의무를 부담한다."},{"p":27,"q":"매수인은 매도인에게 약정 대금을 지급할 의무를 부담한다.","a":"O","e":"매수인의 주된 의무는 대금지급의무다."},{"p":27,"q":"매매 목적물의 인도와 동시에 대금을 지급하여야 하는 경우, 매수인은 목적물 인도를 받을 때까지 대금지급을 거절할 수 있다.","a":"O","e":"쌍무계약상 동시이행관계가 문제될 수 있다."},{"p":27,"q":"매매에서 매도인의 소유권이전의무와 매수인의 대금지급의무는 원칙적으로 대가관계에 있다.","a":"O","e":"쌍무계약의 견련관계가 인정된다."},{"p":27,"q":"매매 목적물의 과실은 별도 약정이 없으면 언제나 계약체결 시부터 매수인에게 귀속한다.","a":"X","e":"과실 귀속은 인도 여부, 대금 지급 등 구체적 규정과 약정에 따라 문제된다. 계약체결만으로 언제나 매수인 귀속은 아니다."},{"p":27,"q":"매매의 목적이 된 권리가 전부 타인에게 속한 경우에도 매매계약은 당연무효가 아니다.","a":"O","e":"타인 권리 매매도 유효하고 매도인의 취득·이전의무 및 담보책임이 문제된다."},{"p":27,"q":"전부 타인 권리 매매에서 매도인이 그 권리를 취득하여 이전할 수 없으면 매수인은 계약을 해제할 수 있다.","a":"O","e":"매도인이 목적권리를 이전할 수 없으면 매수인은 해제할 수 있다."},{"p":27,"q":"전부 타인 권리 매매에서 매수인이 계약 당시 타인의 권리임을 알았더라도 계약해제는 할 수 있다.","a":"O","e":"악의의 매수인도 권리 이전이 불가능하면 계약해제는 가능하다. 다만 담보책임상 손해배상청구는 제한된다."},{"p":27,"q":"전부 타인 권리 매매에서 악의의 매수인은 담보책임으로 손해배상을 청구할 수 없다.","a":"O","e":"매수인이 권리가 매도인에게 속하지 않음을 알았다면 담보책임상 손해배상은 청구하지 못한다."},{"p":27,"q":"전부 타인 권리 매매에서 선의의 매수인은 해제와 함께 손해배상을 청구할 수 있다.","a":"O","e":"선의의 매수인은 이전불능 시 해제와 손해배상을 청구할 수 있다."},{"p":27,"q":"전부 타인 권리 매매에서 매수인이 악의이면 채무불이행에 기한 손해배상도 언제나 청구할 수 없다.","a":"X","e":"담보책임상 손해배상은 제한되지만, 매도인에게 귀책사유가 있으면 채무불이행 손해배상은 별도로 문제될 수 있다."},{"p":27,"q":"전부 타인 권리 매매에서 선의의 매도인이 권리를 취득하여 이전할 수 없으면 일정한 경우 매도인도 계약을 해제할 수 있다.","a":"O","e":"매도인이 계약 당시 자기 권리 아님을 알지 못하고 이전할 수 없으면 매도인에게도 해제권이 인정될 수 있다."},{"p":27,"q":"선의의 매도인이 전부 타인 권리 매매를 해제하려는 경우, 매수인이 선의이면 손해를 배상하고 해제할 수 있다.","a":"O","e":"매수인이 선의이면 매도인은 손해를 배상하고 해제할 수 있다."},{"p":27,"q":"선의의 매도인이 전부 타인 권리 매매를 해제하려는 경우, 매수인이 악의이면 손해배상 없이 해제할 수 있다.","a":"O","e":"매수인이 타인 권리임을 알았다면 매도인은 손해배상 없이 해제할 수 있다."},{"p":27,"q":"매매 목적 권리의 일부가 타인에게 속하여 이전할 수 없는 경우, 매수인은 그 부분의 비율로 대금감액을 청구할 수 있다.","a":"O","e":"일부 타인 권리 매매에서는 대금감액청구가 인정된다."},{"p":27,"q":"일부 타인 권리 매매에서 대금감액청구는 매수인의 선의·악의를 불문하고 인정된다.","a":"O","e":"대금감액청구는 선의·악의를 불문한다."},{"p":27,"q":"일부 타인 권리 매매에서 나머지 부분만이면 매수하지 않았을 경우, 선의의 매수인은 계약 전부를 해제할 수 있다.","a":"O","e":"잔존부분만으로 계약목적 달성이 어려우면 선의의 매수인은 전부 해제할 수 있다."},{"p":27,"q":"일부 타인 권리 매매에서 악의의 매수인도 나머지 부분만이면 매수하지 않았을 경우 계약 전부를 해제할 수 있다.","a":"X","e":"계약 전부해제는 선의의 매수인에게 인정된다."},{"p":27,"q":"일부 타인 권리 매매에서 선의의 매수인은 대금감액 또는 계약해제와 함께 손해배상을 청구할 수 있다.","a":"O","e":"선의의 매수인은 손해배상청구도 가능하다."},{"p":27,"q":"일부 타인 권리 매매에서 악의의 매수인은 손해배상을 청구할 수 없다.","a":"O","e":"악의의 매수인은 담보책임상 손해배상을 청구하지 못한다."},{"p":27,"q":"일부 타인 권리 매매에서 선의의 매수인의 권리행사기간은 매도인이 이전할 수 없게 된 사실을 안 날부터 1년이다.","a":"O","e":"선의자는 이전불능 사실을 안 날부터 1년 내 행사해야 한다."},{"p":27,"q":"일부 타인 권리 매매에서 악의의 매수인의 권리행사기간은 계약한 날부터 1년이다.","a":"O","e":"악의자는 계약한 날부터 1년 내 행사해야 한다."},{"p":27,"q":"일부 타인 권리 매매에서 선의의 매수인의 “안 날”은 단순히 일부가 타인 소유라는 사실을 안 날을 의미한다.","a":"X","e":"매도인이 그 권리를 취득하여 이전할 수 없게 된 사실을 안 날을 의미한다. 단순 타인 소유 인식과는 다르다."},{"p":27,"q":"수량을 지정한 매매에서 목적물이 수량부족인 경우, 선의의 매수인은 대금감액을 청구할 수 있다.","a":"O","e":"수량지정매매의 수량부족은 담보책임 문제로 대금감액이 가능하다."},{"p":27,"q":"수량부족의 경우 선의의 매수인은 잔존부분만이면 매수하지 않았을 때 계약을 해제할 수 있다.","a":"O","e":"수량부족이 계약목적 달성을 불가능하게 하면 선의의 매수인은 해제 가능하다."},{"p":27,"q":"수량부족의 경우 매수인이 악의라도 담보책임상 손해배상을 청구할 수 있다.","a":"X","e":"수량부족 담보책임에서 손해배상은 선의의 매수인을 전제로 한다."},{"p":27,"q":"수량부족 또는 일부멸실의 담보책임상 권리는 선의의 매수인이 그 사실을 안 날부터 1년 내 행사해야 한다.","a":"O","e":"수량부족·일부멸실의 권리는 안 날부터 1년 내 행사한다."},{"p":27,"q":"매매 목적물이 지상권·지역권·전세권·질권·유치권의 목적이 된 경우, 이를 알지 못한 매수인은 담보책임을 물을 수 있다.","a":"O","e":"제한물권이 설정된 경우 선의의 매수인은 담보책임을 물을 수 있다."},{"p":27,"q":"제한물권 있는 목적물을 매수한 선의의 매수인은 계약목적을 달성할 수 없는 경우에 한하여 계약을 해제할 수 있다.","a":"O","e":"목적달성이 불가능한 경우에만 해제가 가능하고, 그 밖에는 손해배상만 가능하다."},{"p":27,"q":"제한물권 있는 목적물을 매수한 선의의 매수인은 계약목적 달성이 가능해도 언제나 계약을 해제할 수 있다.","a":"X","e":"계약목적 달성이 가능하면 해제는 안 되고 손해배상만 청구할 수 있다."},{"p":27,"q":"매매 목적 부동산을 위하여 존재할 지역권이 없는 경우에도 제한물권 있는 경우와 같은 담보책임이 문제될 수 있다.","a":"O","e":"부동산을 위하여 존재할 지역권이 없는 경우도 같은 규율을 받는다."},{"p":27,"q":"매매 목적 부동산에 등기된 임대차가 있는 경우에도 제한물권 있는 경우와 같은 담보책임이 문제될 수 있다.","a":"O","e":"등기된 임대차가 있는 경우도 같은 취지의 담보책임이 문제된다."},{"p":27,"q":"제한물권 있는 경우의 담보책임상 매수인의 권리는 그 사실을 안 날부터 1년 내 행사해야 한다.","a":"O","e":"권리행사기간은 안 날부터 1년이다."},{"p":27,"q":"매수인이 제한물권의 존재를 알고 매수한 경우에도 담보책임상 해제와 손해배상을 청구할 수 있다.","a":"X","e":"제한물권의 담보책임은 매수인이 이를 알지 못한 때를 전제로 한다."},{"p":27,"q":"저당권이 설정된 부동산을 매수한 뒤 저당권 실행으로 소유권을 잃은 매수인은 일정한 담보책임을 물을 수 있다.","a":"O","e":"저당권 등 담보권 실행으로 권리를 잃은 경우 매도인의 담보책임이 문제된다."},{"p":27,"q":"저당권이 설정된 부동산 매매에서 매수인이 출재하여 소유권을 보존한 경우, 매수인은 그 비용의 상환을 청구할 수 있다.","a":"O","e":"담보권 실행을 막기 위해 출재하여 소유권을 보존한 경우 비용상환이 문제된다."},{"p":27,"q":"저당권이 설정된 사실을 알고 부동산을 매수한 매수인은 저당권 실행으로 소유권을 잃더라도 언제나 아무런 권리를 행사할 수 없다.","a":"X","e":"담보권 실행으로 소유권을 잃은 경우에는 악의 여부와 관계없이 일정한 규율이 문제될 수 있다."},{"p":27,"q":"물건의 하자에 대한 매도인의 담보책임은 특정물매매뿐 아니라 종류물매매에도 적용될 수 있다.","a":"O","e":"특정물뿐 아니라 종류물에도 하자담보책임이 적용된다."},{"p":27,"q":"하자담보책임이 성립하려면 매매목적물 자체에 하자가 있어야 한다.","a":"O","e":"하자는 목적물 자체의 하자이어야 한다."},{"p":27,"q":"하자담보책임에서 매수인은 하자에 대하여 선의·무과실이어야 한다.","a":"O","e":"매수인이 하자를 알았거나 과실로 알지 못했다면 하자담보책임을 묻기 어렵다."},{"p":27,"q":"매수인이 하자를 알았거나 과실로 알지 못한 경우에도 매도인은 언제나 하자담보책임을 진다.","a":"X","e":"하자담보책임은 매수인의 선의·무과실을 요한다."},{"p":27,"q":"특정물매매에서 하자의 존재 여부는 원칙적으로 계약체결 당시를 기준으로 판단한다.","a":"O","e":"특정물매매의 하자 판단 시점은 계약체결 당시이다."},{"p":27,"q":"하자담보책임에서 매수인의 악의 또는 과실은 담보책임을 면하려는 매도인이 주장·입증하여야 한다.","a":"O","e":"매수인의 악의·과실은 매도인이 주장·입증한다."},{"p":27,"q":"매매목적물에 법률상 장애가 있어 목적대로 이용할 수 없는 경우에도 물건의 하자로 볼 수 있다.","a":"O","e":"벌채 목적 산림의 벌채 제한, 공장부지의 공장 건축 제한 등 법률상 장애도 하자로 볼 수 있다."},{"p":27,"q":"공장부지로 매수한 토지가 관계법규상 공장을 세울 수 없는 경우, 이는 물건의 하자가 될 수 없다.","a":"X","e":"관계법규상 목적대로 사용할 수 없는 법률상 장애는 하자로 볼 수 있다."},{"p":27,"q":"하자담보책임에서 매수인은 하자로 계약목적을 달성할 수 없는 경우 계약을 해제할 수 있다.","a":"O","e":"하자가 중대하여 계약목적 달성이 불가능하면 해제가 가능하다."},{"p":27,"q":"하자담보책임에서 계약목적 달성이 가능한 경우 매수인은 손해배상만 청구할 수 있다.","a":"O","e":"목적달성이 가능하면 해제는 제한되고 손해배상청구가 가능하다."},{"p":27,"q":"하자담보책임상 매수인의 권리는 하자를 안 날부터 6개월 내 행사해야 한다.","a":"O","e":"하자담보책임의 권리행사기간은 안 날부터 6개월이다."},{"p":27,"q":"하자담보책임의 권리행사기간은 계약한 날부터 1년이다.","a":"X","e":"하자담보책임은 안 날부터 6개월이다. 일부 타인 권리 등과 구별한다."},{"p":27,"q":"매도인이 하자를 알고 고지하지 않은 경우에도 매수인이 하자를 안 날부터 6개월의 행사기간 제한은 전혀 문제되지 않는다.","a":"X","e":"하자담보책임의 기간 제한과 매도인의 고지의무 위반 등은 구체적으로 구별해야 한다."},{"p":27,"q":"경매의 경우 담보책임은 원칙적으로 권리의 하자에 관하여 인정되고, 경락받은 특정물의 물건 하자에는 적용되지 않는다.","a":"O","e":"경매의 담보책임은 권리 하자에 적용되고 특정물 하자에는 적용되지 않는다."},{"p":27,"q":"경매로 취득한 특정물에 물건 자체의 하자가 있으면 매수인은 민법상 하자담보책임을 언제나 물을 수 있다.","a":"X","e":"경매에서 물건 하자에 대한 담보책임은 원칙적으로 인정되지 않는다."},{"p":27,"q":"하자담보책임은 매수인이 착오취소를 주장하는 것을 언제나 배척한다.","a":"X","e":"착오취소와 하자담보책임은 제도 취지가 달라, 중요부분 착오가 있으면 착오취소가 문제될 수 있다."},{"p":27,"q":"매매계약 중요부분에 착오가 있으면 하자담보책임 성립 여부와 관계없이 착오취소가 문제될 수 있다.","a":"O","e":"착오취소와 담보책임은 병존·경합 가능성을 구별해 이해해야 한다."},{"p":27,"q":"매도인의 담보책임은 매매계약이 유효하게 성립한 경우를 전제로 한다.","a":"O","e":"목적물이 원시적으로 전부 불능이면 담보책임이 아니라 계약체결상 과실책임 문제가 된다."},{"p":27,"q":"매도인의 담보책임은 언제나 매도인의 고의·과실을 요한다.","a":"X","e":"담보책임은 법정책임으로서 채무불이행책임과 구별된다."},{"p":27,"q":"매도인의 담보책임과 채무불이행책임은 사안에 따라 경합할 수 있다.","a":"O","e":"담보책임상 손해배상이 제한되는 경우에도 귀책사유가 있으면 채무불이행 손해배상이 문제될 수 있다."},{"p":27,"q":"매도인의 담보책임상 권리행사기간은 모든 유형에서 안 날부터 6개월로 동일하다.","a":"X","e":"권리 하자 유형은 1년, 물건 하자는 6개월 등 유형별로 다르다."},{"p":27,"q":"일부 타인 권리 매매의 대금감액청구권은 선의·악의를 불문하지만 손해배상청구권은 선의의 매수인에게 인정된다.","a":"O","e":"대금감액은 선악 불문, 손해배상은 선의가 요건이다."},{"p":27,"q":"제한물권이 있는 경우 매수인은 선의이면 계약목적 달성 가능 여부와 관계없이 대금감액을 청구할 수 있다.","a":"X","e":"제한물권 있는 경우에는 목적달성 불가능 시 해제, 그 밖에는 손해배상이 문제된다."},{"p":27,"q":"권리의 일부가 타인에게 속한 경우와 수량부족의 경우는 대금감액청구가 중요한 효과이다.","a":"O","e":"일부권리 이전불능과 수량부족은 대금감액청구가 핵심 효과다."},{"p":27,"q":"전부 타인 권리 매매에서 매수인의 악의는 계약해제권까지 배제한다.","a":"X","e":"악의 매수인도 이전불능 시 계약해제는 할 수 있다. 담보책임상 손해배상이 제한된다."},{"p":27,"q":"일부 타인 권리 매매에서 매수인의 악의는 대금감액청구권까지 배제한다.","a":"X","e":"일부 타인 권리의 대금감액청구는 선의·악의를 불문한다."},{"p":27,"q":"하자담보책임에서 매수인의 과실은 매도인의 책임을 제한하는 요소가 될 수 있다.","a":"O","e":"하자담보책임은 매수인의 선의·무과실을 요하므로 매수인의 과실은 중요하다."},{"p":27,"q":"환매는 매도인이 매매계약과 동시에 한 특약에 의하여 매수인이 지급한 대금과 매매비용을 반환하고 목적물을 다시 매수하는 제도이다.","a":"O","e":"환매는 매매와 동시에 특약으로 유보하는 재매수 제도다."},{"p":27,"q":"환매특약은 매매계약과 동시에 하여야 하며, 매매 후 별도로 한 약정은 민법상 환매특약으로 볼 수 없다.","a":"O","e":"민법상 환매는 매매계약과 동시에 하는 특약이 핵심이다."},{"p":27,"q":"부동산 환매기간은 5년을 넘지 못한다.","a":"O","e":"부동산 환매기간은 최장 5년이다."},{"p":27,"q":"동산 환매기간은 3년을 넘지 못한다.","a":"O","e":"동산 환매기간은 최장 3년이다."},{"p":27,"q":"부동산 환매기간을 7년으로 정하면 그 환매약정은 전부 무효이다.","a":"X","e":"기간이 한도를 넘는 경우 법정 한도로 단축되는 취지로 이해한다."},{"p":27,"q":"환매기간을 정한 때에는 다시 이를 연장하지 못한다.","a":"O","e":"환매기간의 확정성과 거래안전을 위해 연장이 제한된다."},{"p":27,"q":"환매기간을 정하지 않은 때에는 부동산은 5년, 동산은 3년 내에 환매권을 행사하여야 한다.","a":"O","e":"약정기간이 없으면 법정 최장기간 내 행사해야 한다."},{"p":27,"q":"부동산 환매특약은 등기하여야 제3자에게 대항할 수 있다.","a":"O","e":"부동산 환매특약은 등기로 제3자 대항력을 갖는다."},{"p":27,"q":"환매권 행사에는 매매대금만 반환하면 충분하고 매매비용은 반환할 필요가 없다.","a":"X","e":"환매는 대금과 매매비용을 반환하는 것이 원칙이다."},{"p":27,"q":"환매권은 형성권으로 볼 수 있다.","a":"O","e":"환매권 행사로 법률관계가 일방적으로 변동하므로 형성권 성격을 가진다."},{"p":27,"q":"매매계약, 계약금계약, 매매예약완결권은 모두 낙성계약으로서 의사표시 합치만으로 성립한다.","a":"X","e":"매매는 낙성계약이지만 계약금계약은 요물계약이고, 예약완결권은 계약이 아니라 형성권이다."},{"p":27,"q":"계약금은 증약금 성질은 항상 가지지만, 위약금 성질은 특약이 있어야 한다.","a":"O","e":"계약금의 증약금성은 항상, 위약금성은 특약, 해약금성은 반대약정 없으면 추정이다."},{"p":27,"q":"계약금 해제와 채무불이행 해제는 모두 원상회복과 손해배상이 당연히 발생한다.","a":"X","e":"계약금 해제는 원상회복·손해배상이 발생하지 않는다는 점에서 일반 채무불이행 해제와 다르다."},{"p":27,"q":"계약금 수령자의 해약금 해제는 배액상환의 현실제공이 필요하지만, 교부자의 해약금 해제는 계약금 포기로 가능하다.","a":"O","e":"교부자와 수령자의 해제 방식이 다르다."},{"p":27,"q":"타인권리매매는 무효, 일부타인권리매매는 취소, 하자담보는 해제만 문제된다.","a":"X","e":"타인권리매매도 유효하고 담보책임 문제다. 유형별로 해제·감액·손해배상이 달라진다."},{"p":27,"q":"권리 하자와 물건 하자는 행사기간이 다를 수 있으므로 1년과 6개월을 구별해야 한다.","a":"O","e":"권리 하자는 1년 유형이 많고, 하자담보는 안 날부터 6개월이다."},{"p":27,"q":"하자담보책임에서 법률상 제한은 언제나 하자가 아니고 권리 하자에만 해당한다.","a":"X","e":"목적물의 사용을 제한하는 법률상 장애는 물건의 하자로 평가될 수 있다."},{"p":27,"q":"경매에서는 물건의 하자가 아니라 권리의 하자에 관한 담보책임이 중심이다.","a":"O","e":"경매의 담보책임은 권리 하자 중심으로 출제된다."},{"p":27,"q":"매수인이 목적물의 하자를 알고도 매수한 경우에는 원칙적으로 하자담보책임을 물을 수 없다.","a":"O","e":"하자담보책임은 매수인의 선의·무과실을 요구한다."},{"p":27,"q":"착오취소와 매도인의 담보책임은 제도 목적이 달라 사안에 따라 별도로 검토될 수 있다.","a":"O","e":"하자담보책임이 있다고 해서 착오취소가 당연히 배척되는 것은 아니다."},{"p":27,"q":"환매특약은 매매계약 후 언제든지 별도로 체결해도 민법상 환매로서 제3자에게 대항할 수 있다.","a":"X","e":"민법상 환매는 매매계약과 동시에 하는 특약이어야 하며, 부동산은 등기해야 제3자에게 대항한다."},{"p":27,"q":"매매 파트에서 주택관리사 시험상 특히 계약금계약, 매도인의 담보책임, 매매의 일방예약이 중요하다.","a":"O","e":"매매에서 계약금계약, 매도인의 담보책임, 매매의 일방예약을 시험 포인트로 정리한다."},{"p":28,"q":"임대차는 임차인이 목적물을 사용·수익하게 하고 임차인이 그 대가로 차임을 지급할 것을 약정함으로써 성립한다.","a":"O","e":"임대차는 사용·수익과 차임 지급 약정으로 성립하는 계약이다. 차임은 임대차의 요소다."},{"p":28,"q":"임대차는 요물계약이므로 차임을 현실적으로 지급하여야 성립한다.","a":"X","e":"임대차는 낙성계약이다. 차임 지급을 약정하면 성립하고 사전에 차임을 지급할 필요는 없다."},{"p":28,"q":"임대차는 유상·쌍무·낙성·불요식계약이며 계속적 채권계약이다.","a":"O","e":"임대차는 차임이라는 대가가 있으므로 유상계약이고, 임대인·임차인이 서로 의무를 부담하므로 쌍무계약이다."},{"p":28,"q":"차임은 반드시 금전이어야 하며, 금전 이외의 물건이나 노무를 차임으로 정할 수 없다.","a":"X","e":"차임은 금전에 한하지 않는다. 금전 외의 물건 기타 급부도 차임이 될 수 있다."},{"p":28,"q":"임대차는 채권계약이므로 임대인이 목적물의 소유자일 필요는 없다.","a":"O","e":"임대차는 물권계약이 아니라 채권계약이다. 임대인이 목적물에 대한 소유권·처분권을 반드시 가져야 하는 것은 아니다."},{"p":28,"q":"타인 소유 부동산을 임대한 경우 그 사정만으로 임차인은 언제나 임대차계약을 해지할 수 있다.","a":"X","e":"타인 소유라는 사정만으로 곧바로 해지 사유가 되는 것은 아니다."},{"p":28,"q":"임대차 목적물은 물건에 한정되지 않고 권리도 임대차의 목적이 될 수 있다.","a":"X","e":"민법상 임대차는 물건의 사용·수익을 목적으로 하는 계약이다. 권리의 이용은 임대차가 아니라 다른 법률관계로 구성된다."},{"p":28,"q":"사용과 수익 중 어느 하나만을 목적으로 하는 것도 임대차가 될 수 있다.","a":"O","e":"임대차는 목적물의 사용·수익을 내용으로 하지만, 사용 또는 수익 중 하나만 목적으로 하는 것도 가능하다."},{"p":28,"q":"기간을 약정한 임대차도 민법상 언제나 최장기간 제한이 있다.","a":"X","e":"민법상 일반 임대차에서 기간을 약정한 경우 존속기간의 제한은 없다."},{"p":28,"q":"기간의 정함이 없는 임대차에서는 당사자가 언제든지 해지통고를 할 수 있다.","a":"O","e":"기간을 정하지 않은 임대차에서는 임대인·임차인 모두 언제든지 해지를 통고할 수 있다."},{"p":28,"q":"기간의 정함이 없는 토지·건물 기타 공작물 임대차는 해지통고가 도달하면 즉시 종료한다.","a":"X","e":"토지·건물 기타 공작물은 임대인이 해지통고를 한 경우 6개월, 임차인이 해지통고를 한 경우 1개월이 지나야 효력이 생긴다."},{"p":28,"q":"기간의 정함이 없는 동산임대차는 해지통고가 도달한 날부터 5일이 지나면 종료한다.","a":"O","e":"민법상 동산임대차는 해지통고 후 5일이 지나면 해지의 효력이 생긴다."},{"p":28,"q":"임대차기간을 정하였더라도 당사자 일방 또는 쌍방이 기간 내 해지권을 보류한 때에는 기간의 정함이 없는 임대차의 해지통고 규정이 적용될 수 있다.","a":"O","e":"기간 약정이 있어도 중도해지권을 보류한 경우에는 민법 제635조의 해지통고 구조가 적용된다."},{"p":28,"q":"임대인은 임차인이 목적물을 사용·수익할 수 있도록 할 의무를 부담한다.","a":"O","e":"임대인의 기본의무는 목적물을 임차인에게 인도하고 계약 존속 중 사용·수익에 필요한 상태를 유지하게 하는 것이다."},{"p":28,"q":"임대인은 임대차 목적물을 인도하기만 하면 되고, 임대차 존속 중 수선의무는 원칙적으로 부담하지 않는다.","a":"X","e":"임대인은 목적물을 사용·수익에 필요한 상태로 유지할 의무가 있으므로 원칙적으로 수선의무를 부담한다."},{"p":28,"q":"목적물의 파손 정도가 사소하여 임차인이 별 비용 없이 고칠 수 있는 정도라면 임대인의 수선의무가 부정될 수 있다.","a":"O","e":"수선의무는 사용·수익에 필요한 상태 유지에 필요한 범위에서 인정된다. 사소한 수선은 임차인 부담으로 처리될 수 있다."},{"p":28,"q":"임대인의 수선의무와 임차인의 차임지급의무는 언제나 동시이행관계에 있다.","a":"X","e":"사용·수익을 현저히 방해하는 수선의무 불이행이면 차임 지급 거절 등이 문제될 수 있지만, 언제나 전면적 동시이행관계라고 단정할 수는 없다."},{"p":28,"q":"임차인은 목적물을 계약 또는 그 성질에 따라 정해진 용법으로 사용·수익하여야 한다.","a":"O","e":"임차인은 용법준수의무를 부담한다. 용법 위반은 손해배상이나 해지 사유가 될 수 있다."},{"p":28,"q":"임차인은 선량한 관리자의 주의로 임차물을 보존하여야 한다.","a":"O","e":"임차인은 임차물 반환의무를 부담하므로 임차물을 선관주의로 보존하여야 한다."},{"p":28,"q":"임차인이 임차물 보존에 필요한 필요비를 지출한 때에는 지출 즉시 임대인에게 상환을 청구할 수 있다.","a":"O","e":"임차인이 임차물 보존에 필요한 필요비를 지출한 때에는 임대인에게 곧 상환청구할 수 있다."},{"p":28,"q":"임차인의 유익비상환청구권은 임대차 종료시에 가액 증가가 현존하는 경우에 인정된다.","a":"O","e":"유익비는 가치 증가가 현존해야 하며, 임대차 종료 시 임대인의 선택에 따라 지출액 또는 증가액 상환이 문제된다."},{"p":28,"q":"임차인의 필요비상환청구권과 유익비상환청구권은 모두 강행규정이므로 특약으로 배제할 수 없다.","a":"X","e":"임차인의 비용상환청구권 규정은 임의규정으로 보아 특약으로 배제할 수 있다. 부속물매수청구권과 구별해야 한다."},{"p":28,"q":"임차인의 비용상환청구권은 임대인이 목적물을 반환받은 날부터 6개월 내에 행사하여야 한다.","a":"O","e":"임차인의 비용상환청구권에는 반환받은 날부터 6개월 내 행사라는 단기 제척기간이 문제된다."},{"p":28,"q":"임차인의 필요비·유익비상환청구권은 목적물에 관하여 생긴 채권이므로 요건을 갖추면 유치권의 피담보채권이 될 수 있다.","a":"O","e":"필요비·유익비는 목적물에 관하여 생긴 채권이므로 유치권 성립이 가능하다."},{"p":28,"q":"임차인이 유익비를 지출한 경우 법원은 임대인의 청구에 의하여 상당한 상환기간을 허여할 수 있다.","a":"O","e":"유익비상환의 경우 임대인의 청구에 의하여 법원이 상당한 기간을 허여할 수 있다."},{"p":28,"q":"임차인이 차임 지급을 연체하면 연체액이 1기 차임액에 이른 때에도 임대인은 항상 즉시 해지할 수 있다.","a":"X","e":"민법상 임대인은 임차인의 차임연체액이 2기의 차임액에 달하는 때 계약을 해지할 수 있다."},{"p":28,"q":"임차인의 차임연체액이 2기의 차임액에 달하면 임대인은 계약을 해지할 수 있다.","a":"O","e":"2기 차임액 연체는 임대인의 해지 사유다."},{"p":28,"q":"임대차에서 차임증감청구권은 형성권이다.","a":"O","e":"차임증감청구권은 명칭은 청구권이지만 실질은 형성권으로 보는 대표적 유형이다."},{"p":28,"q":"차임증감청구권은 장래에 향하여 차임을 증감시키는 것이 원칙이다.","a":"O","e":"차임증감청구권은 사정변경에 따른 장래효가 원칙이다."},{"p":28,"q":"임대차 목적물의 일부가 임차인의 과실 없이 멸실되어 사용·수익할 수 없게 된 경우 임차인은 그 부분 비율에 따른 차임감액을 청구할 수 있다.","a":"O","e":"일부멸실이 임차인의 과실 없이 발생하면 사용·수익 불가능 부분에 비례하여 차임감액이 문제된다."},{"p":28,"q":"임차인의 과실로 목적물 일부가 멸실되어도 임차인은 언제나 차임감액을 청구할 수 있다.","a":"X","e":"임차인의 책임 없는 사유로 사용·수익이 불가능해야 차임감액·해지 문제가 된다."},{"p":28,"q":"임차인의 과실 없이 목적물 일부가 멸실되고 남은 부분만으로 임대차 목적을 달성할 수 없는 때에는 임차인은 계약을 해지할 수 있다.","a":"O","e":"일부멸실로 목적달성이 불가능하면 임차인은 해지할 수 있다."},{"p":28,"q":"임대인이 임차인의 의사에 반하여 보존행위를 하는 경우에도 임차인은 이를 언제나 거절할 수 없다.","a":"X","e":"임대인은 보존행위를 할 수 있으나, 그 보존행위로 임차인이 임차 목적을 달성할 수 없게 되면 임차인은 해지할 수 있다."},{"p":28,"q":"임대인이 보존행위를 하여 임차인이 임차 목적을 달성할 수 없게 된 때에는 임차인은 계약을 해지할 수 있다.","a":"O","e":"임대인의 보존행위 자체는 가능하지만, 그 결과 임차 목적 달성이 불가능하면 임차인의 해지권이 인정된다."},{"p":28,"q":"임차인은 임대인의 동의 없이 임차권을 양도하거나 임차물을 전대하지 못한다.","a":"O","e":"민법상 임차권 양도·전대에는 임대인의 동의가 필요하다."},{"p":28,"q":"임차인이 임대인의 동의 없이 임차권을 양도하거나 전대한 경우 임대인은 계약을 해지할 수 있다.","a":"O","e":"무단양도·전대는 임차인의 의무위반으로 임대인의 해지 사유가 된다."},{"p":28,"q":"임차인이 임대인의 동의 없이 전대한 경우 전대차계약은 임차인과 전차인 사이에서도 당연히 무효이다.","a":"X","e":"무단전대라도 임차인과 전차인 사이의 전대차계약이 당연무효가 되는 것은 아니다. 다만 임대인에게 대항하지 못하고 임대인은 임대차를 해지할 수 있다."},{"p":28,"q":"임대인의 동의를 얻은 전대차에서 전차인은 임대인에게 직접 의무를 부담할 수 있다.","a":"O","e":"적법한 전대차에서는 전차인이 임대인에게 직접 의무를 부담하는 구조가 인정된다."},{"p":28,"q":"임대인의 동의를 얻은 전대차에서 임대인과 임차인의 합의로 임대차를 종료시킨 경우, 원칙적으로 전차인의 권리가 무조건 소멸한다.","a":"X","e":"임대인과 임차인이 합의해지하더라도 적법한 전차인의 이익을 해할 수 없다는 판례형 포인트가 있다."},{"p":28,"q":"임대차가 임차인의 차임연체 등 채무불이행으로 해지된 경우 적법한 전차인은 임대인에게 전대차를 주장할 수 없다.","a":"O","e":"임차인의 채무불이행으로 기본 임대차가 해지되면 전대차도 기초를 잃는다."},{"p":28,"q":"건물 기타 공작물의 임차인이 임대인의 동의를 얻어 부속한 물건은 임대차 종료 시 부속물매수청구의 대상이 될 수 있다.","a":"O","e":"부속물매수청구권은 임대인의 동의를 얻어 부속하거나 임대인으로부터 매수한 부속물에 대해 인정된다."},{"p":28,"q":"임차인이 임대인으로부터 매수한 부속물도 임대차 종료 시 부속물매수청구의 대상이 될 수 있다.","a":"O","e":"민법은 임대인으로부터 매수한 부속물에도 부속물매수청구권을 인정한다."},{"p":28,"q":"부속물매수청구권의 대상인 부속물은 건물의 구성부분이 된 물건이어야 한다.","a":"X","e":"부속물은 임차인 소유의 독립한 물건이어야 하고 건물의 구성부분이 되지 않아야 한다."},{"p":28,"q":"임차인의 특수목적만을 위하여 부속된 물건은 원칙적으로 부속물매수청구권의 대상이 되지 않는다.","a":"O","e":"부속물은 건물 사용에 객관적 편익을 가져와야 한다. 임차인의 특수목적만을 위한 시설은 제외될 수 있다."},{"p":28,"q":"건물 임차인의 부속물매수청구권은 형성권이다.","a":"O","e":"부속물매수청구권은 임차인의 일방적 의사표시에 의해 매매 효과가 발생하는 형성권이다."},{"p":28,"q":"건물 임차인의 부속물매수청구권은 강행규정이므로 임차인에게 불리한 배제특약은 원칙적으로 무효이다.","a":"O","e":"부속물매수청구권은 임차인을 보호하는 강행규정으로 본다."},{"p":28,"q":"부속물매수청구권이 인정되는 경우 그 매수대금청구권을 담보하기 위해 임차인에게 유치권이 인정된다.","a":"X","e":"부속물매수청구권에는 유치권이 성립하지 않는다고 정리한다."},{"p":28,"q":"임차인의 필요비·유익비상환청구권에는 유치권이 성립할 수 있으나, 부속물매수청구권에는 유치권이 성립하지 않는다고 구별한다.","a":"O","e":"비용상환은 목적물에 관하여 생긴 채권이라 유치권 가능, 부속물매수청구권은 유치권 부정 포인트다."},{"p":28,"q":"토지임대차에서 임차인이 지상물을 설치한 경우 일정한 요건 아래 지상물매수청구권이 문제될 수 있다.","a":"O","e":"토지임대차 종료 시 건물·수목 등 지상물매수청구권이 지상권 규정 준용으로 문제된다."},{"p":28,"q":"토지임대차에서 지상물매수청구권은 임차인에게 불리한 약정으로도 배제할 수 있는 순수 임의규정이다.","a":"X","e":"지상물매수청구권도 임차인 보호를 위한 강행적 성격으로 다루어지는 중요 포인트다."},{"p":28,"q":"임대차가 종료하면 임차인은 목적물을 반환하고 임대인은 보증금을 반환하여야 한다.","a":"O","e":"임대차 종료 후 임차인의 목적물 반환의무와 임대인의 보증금 반환의무가 문제된다."},{"p":28,"q":"임대차보증금 반환의무와 임차목적물 반환의무는 원칙적으로 동시이행관계에 있다.","a":"O","e":"임대인의 보증금 반환과 임차인의 목적물 반환은 동시이행관계로 정리한다."},{"p":28,"q":"임대차보증금 반환청구권은 임대차계약 성립과 동시에 발생하여 곧바로 행사할 수 있다.","a":"X","e":"보증금 반환청구권은 임대차 종료 시 발생한다."},{"p":28,"q":"임대차보증금은 임대차 존속 중 발생한 차임채무나 손해배상채무 등을 담보하는 기능을 한다.","a":"O","e":"보증금은 임차인의 차임채무·목적물 훼손 손해배상 등 임대차상 채무를 담보한다."},{"p":28,"q":"임대차가 종료되면 임대인은 보증금 전액을 먼저 반환하여야 하고, 연체차임 등은 별도로 소송으로 청구하여야 한다.","a":"X","e":"보증금은 임대차상 채무를 담보하므로 연체차임 등 공제 후 반환이 문제된다."},{"p":28,"q":"임대차 종료 후 임차인이 목적물을 계속 점유하더라도 사용·수익하지 않았다면 차임 상당 부당이득이 항상 성립하는 것은 아니다.","a":"O","e":"점유만으로 언제나 사용이익이 발생한다고 단정할 수 없다."},{"p":28,"q":"임차인은 임대차 종료 후 목적물을 원상회복하여 반환할 의무를 부담할 수 있다.","a":"O","e":"임차인은 반환의무의 내용으로 원상회복의무를 부담한다."},{"p":28,"q":"임차인의 통상적인 사용으로 생긴 자연적 마모까지 언제나 임차인이 원상회복하여야 한다.","a":"X","e":"통상손모·자연마모는 원칙적으로 임대인이 감수해야 할 부분이고, 임차인의 특별한 훼손과 구별한다."},{"p":28,"q":"임대인은 임차인이 임차물에 대하여 비용을 지출한 경우라면 그 비용이 유익비인지 여부와 관계없이 전액 상환하여야 한다.","a":"X","e":"유익비는 가액증가가 현존해야 하고, 임대인은 지출액 또는 증가액 중 선택할 수 있다."},{"p":28,"q":"임대차의 존속 중 목적물의 소유권이 제3자에게 이전된 경우에도 임대차가 대항력을 갖추었는지 여부에 따라 새 소유자에게 임대차를 주장할 수 있는지가 달라진다.","a":"O","e":"임대차는 채권이므로 원칙적으로 새 소유자에게 대항할 수 없지만, 등기된 임차권이나 특별법상 대항요건을 갖추면 대항 가능성이 생긴다."},{"p":28,"q":"민법상 임차권은 등기할 수 없으므로 등기된 임차권이라는 것은 인정되지 않는다.","a":"X","e":"부동산임차권은 등기할 수 있고, 등기된 임차권은 물권에 준하여 제3자에게 대항할 수 있다."},{"p":28,"q":"부동산임대차를 등기한 때에는 그때부터 제3자에 대하여 효력이 생긴다.","a":"O","e":"민법상 부동산임차권 등기는 대항력을 발생시키는 공시수단이다."},{"p":28,"q":"임차권이 등기된 후 부동산에 물권을 취득한 자는 임차권을 무시하고 목적물 인도를 청구할 수 있다.","a":"X","e":"등기된 임차권은 제3자에게 대항할 수 있으므로 후순위 취득자는 임차권의 부담을 받는다."},{"p":28,"q":"건물 소유를 목적으로 하는 토지임대차에서 임차인의 건물등기가 있으면 토지임대차는 제3자에 대하여 효력이 생길 수 있다.","a":"O","e":"건물 소유 목적 토지임대차에서 지상건물 등기를 통한 대항력 구조가 문제된다."},{"p":28,"q":"건물 소유 목적 토지임대차에서 건물등기 명의가 임차인과 다른 경우에도 언제나 토지임대차의 대항력이 인정된다.","a":"X","e":"건물등기를 통한 토지임대차 대항력은 등기명의와 법률관계가 중요하다. 언제나 인정된다고 할 수 없다."},{"p":28,"q":"임대차는 계속적 계약이므로 해지는 장래를 향하여 효력이 생긴다.","a":"O","e":"임대차 해지는 장래효가 원칙이다. 해제의 소급효와 구별한다."},{"p":28,"q":"임대차계약이 해지되면 원칙적으로 처음부터 계약이 없었던 것으로 되어 이미 발생한 차임채권도 모두 소멸한다.","a":"X","e":"해지는 장래효이므로 이미 발생한 차임 등은 소멸하지 않는다."},{"p":28,"q":"임대인의 해지권은 재산권적 성격의 형성권으로서 일신전속권이 아니다.","a":"O","e":"임대차계약 해지권은 형성권이지만 일신전속권은 아니다."},{"p":28,"q":"임대차에서 임대인이 목적물 사용·수익을 방해하면 임차인은 손해배상을 청구할 수 있다.","a":"O","e":"임대인의 사용·수익 보장 의무 불이행은 채무불이행책임을 발생시킬 수 있다."},{"p":28,"q":"임차인이 임대차 목적물을 훼손한 경우 임대인은 손해배상을 청구할 수 있다.","a":"O","e":"임차인은 선관주의와 반환의무를 부담하므로 책임 있는 훼손에 대해 손해배상책임을 질 수 있다."},{"p":28,"q":"임차인이 임차물에 대하여 유익비를 지출한 경우 임대인은 반드시 임차인이 지출한 금액 전부를 상환하여야 한다.","a":"X","e":"유익비는 임대인이 지출액 또는 증가액 중 선택하여 상환한다. 반드시 지출액 전부가 아니다."},{"p":28,"q":"임차인이 임대인의 동의 없이 부속한 물건은 원칙적으로 부속물매수청구권의 대상이 되지 않는다.","a":"O","e":"부속물매수청구권은 임대인의 동의 또는 임대인으로부터의 매수가 필요하다."},{"p":28,"q":"부속물매수청구권은 임대차 종료 전에 미리 행사하여 장래 종료 시 매매효과를 발생시키는 권리이다.","a":"X","e":"부속물매수청구권은 임대차 종료 시에 행사하는 권리로 정리한다."},{"p":28,"q":"임대차가 임차인의 채무불이행으로 해지된 경우에도 임차인은 언제나 부속물매수청구권을 행사할 수 있다.","a":"X","e":"임차인의 채무불이행으로 해지된 경우에는 부속물매수청구권이 제한되는 판례형 포인트가 있다."},{"p":28,"q":"임대차 기간 만료로 종료한 경우 임차인은 요건을 갖추면 부속물매수청구권을 행사할 수 있다.","a":"O","e":"기간만료 종료 시 요건을 갖춘 부속물에 대해 부속물매수청구권이 인정된다."},{"p":28,"q":"임차인이 부속물매수청구권을 행사하면 임대인의 승낙이 있어야만 매매계약이 성립한다.","a":"X","e":"부속물매수청구권은 형성권이므로 임차인의 일방적 의사표시로 매매효과가 발생한다."},{"p":28,"q":"임대인의 동의 없는 무단전대가 있더라도 배신행위라고 인정할 수 없는 특별한 사정이 있으면 임대인의 해지권 행사가 제한될 수 있다.","a":"O","e":"무단전대는 해지 사유이나, 판례상 배신행위론에 따라 신뢰관계 파괴가 없으면 해지가 제한될 수 있다."},{"p":28,"q":"무단양도·전대가 있으면 임대인은 신뢰관계 파괴 여부와 무관하게 언제나 해지할 수 있다.","a":"X","e":"무단양도·전대는 원칙적 해지 사유이나, 배신행위라고 볼 수 없는 특별한 사정이 있으면 해지 제한이 문제된다."},{"p":28,"q":"임대차 종료 후 임차인이 목적물을 반환하지 않으면 임대인은 목적물 반환청구를 할 수 있다.","a":"O","e":"임대차 종료 시 임차인은 목적물 반환의무를 부담한다."},{"p":28,"q":"임대차 종료 후 임차인이 보증금 반환을 받을 때까지 목적물을 점유하는 경우, 항상 불법점유가 되어 손해배상책임을 진다.","a":"X","e":"보증금반환과 목적물반환은 동시이행관계이므로 보증금 반환 전 점유가 당연히 불법점유라고 단정할 수 없다."},{"p":28,"q":"임대차보증금 반환 전 임차인이 동시이행항변권에 기해 목적물을 계속 점유하더라도 실제 사용·수익을 하면 차임 상당 부당이득이 문제될 수 있다.","a":"O","e":"점유 자체는 항변권으로 정당화될 수 있어도, 사용·수익 이익은 별도로 부당이득이 문제될 수 있다."},{"p":28,"q":"임차권 양도에 임대인이 동의한 경우 양수인은 임차인의 지위를 승계할 수 있다.","a":"O","e":"임대인의 동의가 있으면 임차권 양도는 임대인에게도 효력을 주장할 수 있다."},{"p":28,"q":"임대인의 동의 없는 임차권 양도는 임대인에게 대항할 수 없지만, 양도인과 양수인 사이의 채권계약이 언제나 무효가 되는 것은 아니다.","a":"O","e":"무단양도는 임대인에 대한 대항 문제와 해지 문제를 발생시킬 뿐, 당사자 사이 계약이 언제나 무효가 되는 것은 아니다."},{"p":28,"q":"전차인은 임차인에 대한 차임지급으로 임대인에게 대항할 수 있는 경우가 언제나 인정된다.","a":"X","e":"적법 전대에서 전차인의 임대인에 대한 직접의무가 문제되므로, 임차인에게 지급했다는 사정만으로 언제나 임대인에게 대항할 수는 없다."},{"p":28,"q":"임대차 목적물의 수선이 임차인의 사용·수익을 위해 필요한 경우 임차인은 임대인에게 수선을 요구할 수 있다.","a":"O","e":"임대인의 목적물 유지의무에 따라 필요한 수선청구가 문제된다."},{"p":28,"q":"임차인이 임대인의 수선의무 불이행으로 목적물을 사용·수익하지 못하면 차임 지급을 거절하거나 손해배상을 청구하는 문제가 생길 수 있다.","a":"O","e":"임대인의 채무불이행으로 사용수익이 제한되면 차임감액·지급거절·손해배상 등이 문제된다."},{"p":28,"q":"임차인은 임대차 종료 시 임차물을 원상회복하여 반환하여야 하므로, 부속물매수청구권이 인정되는 부속물도 반드시 철거하여야 한다.","a":"X","e":"부속물매수청구권을 행사하면 임대인이 매수해야 하므로 철거 반환과 달라진다."},{"p":28,"q":"부속물매수청구권은 건물 기타 공작물의 임대차에서 문제되는 권리이다.","a":"O","e":"부속물매수청구권은 건물 기타 공작물 임차인의 권리다."},{"p":28,"q":"토지임차인의 지상물매수청구권과 건물임차인의 부속물매수청구권은 모두 임차인의 투하자본 회수 보호와 관련된다.","a":"O","e":"두 권리는 대상과 요건은 다르지만 임차인의 투하자본 회수 보호라는 기능이 있다."},{"p":28,"q":"부속물매수청구권의 매수대금은 임차인이 지출한 설치비용으로 정해진다.","a":"X","e":"부속물매수청구권 행사 시 매수대금은 원칙적으로 행사 당시 부속물의 객관적 가치가 문제된다."},{"p":28,"q":"차임 지급시기에 관하여 약정이 없으면 민법 규정에 따라 후급이 원칙인 경우가 많다.","a":"O","e":"차임 지급시기는 계약과 목적물 성질에 따라 정해지며, 약정이 없으면 민법의 보충규정이 적용된다."},{"p":28,"q":"임대차는 유상계약이므로 매매의 담보책임 규정이 그 성질상 준용될 수 있다.","a":"O","e":"임대차에도 유상계약 일반원리상 매매 담보책임 규정의 준용이 문제될 수 있다."},{"p":28,"q":"임대차 목적물이 계약 당시부터 사용·수익할 수 없는 상태라면 임대인의 채무불이행이나 담보책임이 문제될 수 있다.","a":"O","e":"임대인은 목적물을 사용수익하게 할 의무가 있으므로 목적물 하자나 사용불능은 책임 문제로 이어질 수 있다."},{"p":28,"q":"임대차에서 임차인이 목적물을 수익하여 얻은 이익은 모두 임대인에게 반환하여야 한다.","a":"X","e":"임차인은 차임을 지급하고 목적물을 사용·수익할 권리를 가지므로, 정당한 사용수익으로 얻은 이익을 모두 임대인에게 반환할 필요는 없다."},{"p":28,"q":"임차인은 임대인의 승낙이 있는 경우 목적물을 전대할 수 있다.","a":"O","e":"임대인의 동의가 있으면 전대는 적법하다."},{"p":28,"q":"전대차는 임대인과 전차인 사이에 직접 임대차계약을 성립시키는 계약이다.","a":"X","e":"전대차는 임차인이 자신의 임차권에 기초하여 전차인에게 다시 임대하는 계약이다. 임대인과 전차인 사이에 직접 임대차가 성립하는 것은 아니다."},{"p":28,"q":"임대차의 합의해지는 해지와 달리 언제나 소급효가 있다.","a":"X","e":"임대차는 계속적 계약이므로 합의해지도 통상 장래효로 처리된다."},{"p":28,"q":"임차인이 목적물의 보존에 필요한 행위를 하려는 임대인을 거절한 경우 임대인은 손해배상 등을 주장할 수 있다.","a":"O","e":"임대인의 보존행위는 허용되므로 임차인이 부당하게 거절하면 의무위반이 문제될 수 있다."},{"p":28,"q":"임대인이 임차인의 의사에 반하여 보존행위를 한 때 임차인은 목적달성 여부와 관계없이 언제나 즉시 해지할 수 있다.","a":"X","e":"보존행위로 인해 임차 목적을 달성할 수 없게 된 경우 해지가 문제된다. 단순 보존행위만으로 언제나 해지는 아니다."},{"p":28,"q":"임차인이 임대차계약상 의무를 중대하게 위반하여 신뢰관계가 파괴되면 임대인의 해지가 문제될 수 있다.","a":"O","e":"임대차는 계속적 계약이라 신뢰관계 파괴가 해지 판단의 중요한 기준이 된다."},{"p":28,"q":"차임연체로 인한 해지에서 2기란 반드시 연속된 2개월분을 의미한다.","a":"X","e":"2기는 연체액이 2기의 차임액에 달하는 것을 말한다. 반드시 연속 2개월이라는 의미로만 한정하지 않는다."},{"p":28,"q":"임대차 목적물이 일부 멸실되어 차임이 감액된 경우, 그 이후의 차임은 감액된 범위에서 문제된다.","a":"O","e":"일부멸실로 차임감액 사유가 인정되면 장래 차임에 영향을 미친다."},{"p":28,"q":"임차인의 부속물매수청구권은 임대인이 매수를 거절하면 효력이 발생하지 않는다.","a":"X","e":"부속물매수청구권은 형성권이므로 임대인의 승낙 여부와 관계없이 요건을 갖추면 매매효과가 발생한다."},{"p":28,"q":"임차인이 부속물매수청구권을 행사하면 임대차 목적물 자체에 대한 유치권을 당연히 행사할 수 있다.","a":"X","e":"부속물매수청구권에는 유치권이 부정된다고 정리한다."},{"p":28,"q":"임차인이 지출한 필요비는 목적물 보존을 위한 비용이고, 유익비는 목적물 가치 증가를 위한 비용이다.","a":"O","e":"필요비와 유익비의 구별은 임대차·점유자 비용상환에서 공통으로 중요하다."},{"p":28,"q":"임대차에서 필요비상환청구권은 임차인이 과실을 취득했는지 여부와 관계없이 항상 배척된다.","a":"X","e":"임대차 비용상환과 점유자의 과실취득 예외를 혼동하면 안 된다."},{"p":28,"q":"임대차가 종료되면 임차인은 특별한 사정이 없는 한 목적물을 임대인에게 반환하여야 한다.","a":"O","e":"임대차 종료의 기본 효과는 목적물 반환이다."},{"p":28,"q":"임대차 종료 후 보증금 반환청구권과 목적물 반환의무가 동시이행관계이면 임차인은 보증금 반환 전까지 반환을 거절할 수 있다.","a":"O","e":"동시이행항변권에 따라 보증금 반환 전 목적물 반환 거절이 가능하다."},{"p":28,"q":"임대차보증금 반환 전 임차인의 점유가 동시이행항변권에 의해 정당화되면 사용이익 상당 부당이득도 절대 성립하지 않는다.","a":"X","e":"점유 거절이 정당해도 실제 사용·수익으로 인한 이익은 별도로 부당이득이 될 수 있다."},{"p":28,"q":"임대차의 해지통고는 상대방에게 도달하여야 효력이 문제된다.","a":"O","e":"해지통고는 상대방 있는 의사표시이므로 도달주의가 기본이다."},{"p":28,"q":"기간 정함이 없는 임대차에서 해지통고 후 법정기간이 지나기 전에도 임대차는 즉시 소멸한다.","a":"X","e":"해지통고가 도달한 후 민법상 기간이 지나야 종료한다."},{"p":28,"q":"임대차계약의 해지는 형성권 행사이므로 상대방의 승낙이 필요하지 않다.","a":"O","e":"해지는 일방적 의사표시로 효과를 발생시키는 형성권 행사다."},{"p":28,"q":"임대차에서 차임증감청구권은 상대방과 합의가 있어야만 효과가 생기는 청구권이므로 형성권이 아니다.","a":"X","e":"차임증감청구권은 실질상 형성권으로 정리되는 대표 지문이다."},{"p":28,"q":"임대차 목적물 반환청구권은 임대차 종료 후 행사할 수 있다.","a":"O","e":"임대차가 존속하는 동안 임차인은 사용수익권을 가지므로, 반환청구는 종료 후 문제된다."},{"p":28,"q":"임대차의 목적물이 임대인의 책임 없는 사유로 전부 멸실한 경우 임대차는 목적 달성 불능으로 종료될 수 있다.","a":"O","e":"목적물 전부 멸실은 사용·수익 목적을 불가능하게 하므로 임대차 종료 문제가 된다."},{"p":28,"q":"임차인이 임대인의 동의 없이 목적물을 제3자에게 사용하게 한 모든 경우에 전대가 성립한다.","a":"X","e":"구체적 법률관계가 사용대차인지 단순 점유보조인지 등 따져야 한다. 모든 제3자 사용이 전대라고 단정할 수 없다."},{"p":28,"q":"임차인의 가족이나 종업원이 임차인을 위하여 목적물을 사용하는 경우 곧바로 무단전대가 되는 것은 아니다.","a":"O","e":"점유보조 또는 임차인의 사용 범위 내 이용일 수 있다. 임차권 이전·전대와 구별한다."},{"p":28,"q":"건물임차인의 부속물매수청구권은 임차인의 채무불이행으로 임대차가 해지된 경우에도 항상 인정된다.","a":"X","e":"채무불이행 해지에서는 임차인 보호 필요성이 약해져 부속물매수청구권이 제한될 수 있다."},{"p":28,"q":"토지임차인의 지상물매수청구권과 건물임차인의 부속물매수청구권은 모두 형성권으로 이해할 수 있다.","a":"O","e":"두 권리는 매수를 청구하는 일방적 의사표시로 매매관계를 발생시키는 형성권적 성질을 가진다."},{"p":28,"q":"임대차계약에서 임차인이 부담하는 차임지급의무는 임대차 종료 후 이미 발생한 차임에 대해서도 소급하여 소멸한다.","a":"X","e":"해지는 장래효이므로 이미 발생한 차임채무는 소멸하지 않는다."},{"p":28,"q":"임대인의 수선의무 불이행으로 임차인이 목적물을 전혀 사용하지 못한 경우에도 차임 전액을 지급해야 한다.","a":"X","e":"사용수익이 불가능하면 차임 지급의무의 전부 또는 일부가 제한될 수 있다."},{"p":28,"q":"임차인이 임대인의 동의를 얻어 설치한 부속물이 객관적 편익을 주지 않고 오로지 개인 취미를 위한 것이라면 부속물매수청구권이 부정될 수 있다.","a":"O","e":"부속물은 건물 사용에 객관적 편익을 가져와야 한다."},{"p":28,"q":"임대차에서 차임 지급 약정이 없으면 원칙적으로 무상 사용관계가 되어 사용대차가 될 수 있다.","a":"O","e":"임대차는 차임이 요소다. 차임이 없으면 임대차가 아니라 사용대차 등으로 구성될 수 있다."},{"p":28,"q":"임대차 목적물에 대한 임차인의 권리는 원칙적으로 채권이므로, 특별한 대항요건이 없으면 제3자에게 당연히 대항하지 못한다.","a":"O","e":"임차권은 원칙적으로 채권이다. 등기나 특별법상 대항요건이 중요하다."},{"p":28,"q":"임대차 목적물에 대한 임차권이 등기된 경우에도 채권이라는 이유로 제3자에 대한 대항력은 전혀 인정되지 않는다.","a":"X","e":"등기된 부동산임차권은 제3자에 대하여 효력을 가진다."},{"p":28,"q":"임대차 종료 시 임차인의 부속물매수청구권 행사로 성립하는 매매에서 매수인은 임대인이다.","a":"O","e":"임차인이 매수를 청구하면 임대인이 부속물을 매수하는 구조다."},{"p":28,"q":"부속물매수청구권의 대상이 되는 부속물은 임차인의 소유에 속해야 한다.","a":"O","e":"타인의 물건이나 이미 임대인 소유가 된 구성부분은 부속물매수청구권 대상이 아니다."},{"p":28,"q":"임차인이 설치한 물건이 건물에 부합하여 임대인 소유가 된 경우에는 부속물매수청구권이 아니라 비용상환 문제가 될 수 있다.","a":"O","e":"독립성이 없어 부합하면 부속물이 아니므로 필요비·유익비 등 비용상환 문제로 간다."},{"p":28,"q":"임대차계약에서 임차인의 비용상환청구권 배제특약은 언제나 무효이다.","a":"X","e":"비용상환청구권은 임의규정으로 배제특약이 가능하다. 부속물매수청구권과 구별한다."},{"p":28,"q":"임차인의 부속물매수청구권 배제특약은 임차인에게 불리하면 원칙적으로 효력이 없다.","a":"O","e":"부속물매수청구권은 강행규정으로 보아 임차인에게 불리한 포기·배제특약을 제한한다."},{"p":28,"q":"임대차의 존속기간 만료 후 임차인이 계속 사용·수익하고 임대인이 상당 기간 이의를 하지 않으면 묵시의 갱신이 문제될 수 있다.","a":"O","e":"기간만료 후 계속 사용수익과 임대인의 이의 없음은 묵시갱신의 중요 요건이다."},{"p":28,"q":"묵시의 갱신이 있으면 전 임대차와 동일한 조건으로 다시 임대차한 것으로 보되, 기간은 정하지 않은 것으로 본다.","a":"O","e":"민법상 묵시갱신은 전 임대차와 동일한 조건이나 기간은 정함이 없는 것으로 보는 구조다."},{"p":28,"q":"묵시의 갱신 후에는 당사자가 언제든지 해지통고할 수 없고 반드시 종전 기간을 지켜야 한다.","a":"X","e":"묵시갱신은 기간 정함이 없는 임대차로 보므로 당사자는 해지통고할 수 있다."},{"p":28,"q":"임대인이 기간만료 후 상당한 기간 내 이의를 제기하면 묵시의 갱신은 인정되지 않는다.","a":"O","e":"묵시갱신에는 임대인의 이의 없음이 필요하다."},{"p":28,"q":"임대차에서 임대인이 목적물 보존에 필요한 행위를 하는 경우 임차인은 원칙적으로 이를 거절하지 못한다.","a":"O","e":"임대인의 보존행위는 목적물 유지와 관련된다."},{"p":28,"q":"임차인은 임대차 목적물을 반환할 때 원칙적으로 부속시킨 물건을 철거할 수 있다.","a":"O","e":"부속물매수청구권 행사 등 특별한 사정이 없으면 임차인은 자신의 물건을 수거·철거하고 반환한다."},{"p":28,"q":"임차인이 임대인의 동의를 얻어 부속한 물건이라도 임대차 종료 시 임차인은 부속물매수청구권 대신 철거를 선택할 수 있다.","a":"O","e":"매수청구권은 임차인의 권리다. 행사하지 않고 철거할 수 있는 경우가 있다."},{"p":28,"q":"임대차 보증금 반환채권은 양도될 수 없는 일신전속권이다.","a":"X","e":"보증금 반환채권은 재산권적 채권으로 원칙적으로 양도 가능하다. 일신전속권이 아니다."},{"p":28,"q":"임차인이 임차물 반환을 지체하면 반환 지체로 인한 손해배상책임이 문제될 수 있다.","a":"O","e":"종료 후 반환의무를 이행하지 않으면 채무불이행책임이 발생할 수 있다."},{"p":28,"q":"임대차 목적물의 전부가 임차인의 책임 있는 사유로 멸실한 경우 임차인은 손해배상책임을 질 수 있다.","a":"O","e":"임차인은 선관주의와 반환의무를 부담하므로 책임 있는 멸실에 대해 배상책임이 문제된다."},{"p":28,"q":"임대차에서 임대인이 목적물의 소유자가 아니면 임대차계약은 원시적 불능으로 언제나 무효이다.","a":"X","e":"임대차는 채권계약이므로 타인 물건 임대도 유효할 수 있다."},{"p":28,"q":"임차권은 채권이지만 임차권의 양도·전대 제한 규정 때문에 임차인의 지위 이전에는 임대인의 동의가 중요하다.","a":"O","e":"임차권 양도·전대에는 임대인 동의가 핵심 요건이다."},{"p":28,"q":"임대차계약상 목적물 사용·수익을 하게 할 의무는 임대인의 주된 의무이다.","a":"O","e":"사용·수익하게 할 의무는 임대차의 본질적 의무다."},{"p":28,"q":"임대차계약상 차임 지급의무는 임차인의 주된 의무이다.","a":"O","e":"차임 지급은 임차인의 주된 의무다."},{"p":28,"q":"임차인이 임대인의 동의를 얻어 전대한 경우에도 임차인은 임대인에 대한 차임지급의무 등 임대차상 의무에서 당연히 완전히 면제된다.","a":"X","e":"전대가 있어도 원임차인은 임대인에 대한 의무를 계속 부담한다."},{"p":28,"q":"임차권 양도와 전대는 모두 임대인의 동의가 필요하지만, 양도는 임차인 지위 이전이고 전대는 임차인이 임차인 지위를 유지한다는 점에서 다르다.","a":"O","e":"양도는 임차인 지위 이전이고 전대는 임차인이 지위를 유지한다는 점에서 다르다."},{"p":28,"q":"임대차 종료 후 임차인의 부속물매수청구권 행사로 성립한 매매대금채권과 목적물 반환의무는 당연히 동시이행관계라고 할 수 없다.","a":"O","e":"부속물매수청구권에는 유치권도 부정되므로, 목적물 반환 거절 근거로 당연 연결하면 위험하다."},{"p":28,"q":"임차인의 필요비상환청구권은 임차물이 반환된 후에도 제척기간 내라면 행사할 수 있다.","a":"O","e":"비용상환청구권은 반환받은 날부터 6개월 내 행사 포인트가 있다."},{"p":28,"q":"임차인의 유익비상환청구권은 가액 증가가 임대차 종료 시 현존하지 않아도 지출 사실만 있으면 인정된다.","a":"X","e":"유익비는 가액 증가 현존이 필요하다."},{"p":28,"q":"임대인의 동의를 얻어 설치한 부속물이라도 건물의 사용에 객관적 편익을 주지 않으면 매수청구 대상이 아니다.","a":"O","e":"동의만으로 충분하지 않고 객관적 편익과 독립성 등 요건이 필요하다."},{"p":28,"q":"임대차에서 임차인이 연체한 차임은 보증금에서 당연히 공제될 수 있으므로 보증금 반환액 산정에 영향을 준다.","a":"O","e":"보증금의 담보적 기능 때문에 연체차임 등이 공제된다."},{"p":28,"q":"임대차계약이 종료하면 임차인이 목적물을 반환하지 않아도 보증금 반환청구권은 발생하지 않는다.","a":"X","e":"보증금 반환청구권은 임대차 종료 시 발생한다. 다만 목적물 반환의무와 동시이행관계가 문제된다."},{"p":28,"q":"임대차계약에서 임차인이 보증금을 지급한 경우 임대인은 임대차 종료 전에도 임차인의 요구만 있으면 즉시 전액 반환해야 한다.","a":"X","e":"보증금은 임대차 종료 시 반환이 문제되는 것이 원칙이다."},{"p":28,"q":"임대차에서 목적물 사용·수익 장애가 임대인의 귀책사유 없이 발생한 경우에도 임차인의 차임감액이나 계약종료 문제가 생길 수 있다.","a":"O","e":"임차인의 과실 없는 일부멸실 등은 귀책사유와 별개로 차임감액·해지가 문제될 수 있다."},{"p":28,"q":"임대차는 매매와 달리 계속적 법률관계이므로 종료 사유와 종료 효과에서 해지 중심으로 이해해야 한다.","a":"O","e":"임대차는 계속적 계약이므로 해지·장래효·목적물 반환 관계가 핵심이다."},{"p":28,"q":"임차인의 차임연체가 2기 차임액에 달하기 전에는 어떠한 경우에도 임대인은 계약을 해지할 수 없다.","a":"X","e":"차임연체 2기는 특정 해지 사유일 뿐, 다른 중대한 의무위반·신뢰관계 파괴가 있으면 별도 해지 문제가 가능하다."},{"p":28,"q":"임차인의 무단전대가 있더라도 임대인이 이를 승낙하면 적법한 전대차 관계로 정리될 수 있다.","a":"O","e":"사전 동의뿐 아니라 사후 승낙도 문제될 수 있다."},{"p":28,"q":"임대차에서 임차인이 임대인의 동의 없이 전대한 경우 임대인은 전차인에게 소유권에 기한 반환청구 등을 할 수 있는 경우가 있다.","a":"O","e":"무단전대는 임대인에게 대항할 수 없으므로 임대인은 소유권·임대차 종료 등을 근거로 반환을 구할 수 있다."},{"p":28,"q":"임차인의 부속물매수청구권은 건물 기타 공작물 임대차뿐 아니라 모든 동산임대차에도 일반적으로 인정된다.","a":"X","e":"민법 제646조는 건물 기타 공작물 임차인의 부속물매수청구권이다. 모든 동산임대차에 일반화하면 틀린다."},{"p":28,"q":"임대차에서 임차인이 목적물에 관한 필요비를 지출한 때에는 임대인이 목적물을 반환받기 전이라도 상환청구할 수 있다.","a":"O","e":"필요비는 지출 즉시 상환청구 가능하다는 점이 유익비와 구별된다."},{"p":28,"q":"임대차에서 유익비는 임대차 종료 전이라도 임차인이 원하면 즉시 전액 상환청구할 수 있다.","a":"X","e":"유익비는 임대차 종료 시 가액증가 현존을 기준으로 상환이 문제된다."},{"p":28,"q":"임차인이 임차목적물에 부속한 물건이 독립성을 잃고 건물의 구성부분이 되면 임차인 소유 부속물이라고 보기 어렵다.","a":"O","e":"독립성을 잃고 부합하면 건물 소유자에게 귀속되어 부속물매수청구 대상이 아니다."},{"p":28,"q":"임대차의 묵시갱신은 임차인이 계속 사용·수익하기만 하면 임대인의 이의 여부와 무관하게 언제나 성립한다.","a":"X","e":"임대인의 상당기간 이의 없음이 필요하다."},{"p":28,"q":"임대차의 종료 원인에는 기간만료, 해지통고, 차임연체나 무단양도·전대에 따른 해지 등이 있다.","a":"O","e":"종료 사유를 한 번에 묶는 기본 구조다."},{"p":28,"q":"임대차 종료의 효과로 보증금반환, 목적물반환, 부속물매수청구, 지상물매수청구, 비용상환청구가 문제될 수 있다.","a":"O","e":"임대차 종료 효과의 전체 구조다."},{"p":28,"q":"임대차에서 부속물매수청구권은 비용상환청구권과 동일한 권리이므로 요건과 효과도 같다.","a":"X","e":"부속물매수청구권과 비용상환청구권은 대상, 강행성, 유치권 인정 여부가 다르다."},{"p":28,"q":"임대차에서 목적물의 사용·수익 대가로서 차임 지급이 약정되지 않았다면 임대차라고 보기 어렵다.","a":"O","e":"차임은 임대차의 요소다."},{"p":29,"q":"증여는 당사자 일방이 무상으로 재산을 수여하는 의사를 표시하고 상대방이 이를 승낙함으로써 성립한다.","a":"O","e":"증여는 재산수여 의사표시와 상대방의 승낙으로 성립하는 낙성계약이다."},{"p":29,"q":"증여는 원칙적으로 무상·편무·낙성·불요식 계약이다.","a":"O","e":"증여자는 급부의무를 부담하지만 수증자는 원칙적으로 반대급부를 부담하지 않는다."},{"p":29,"q":"증여계약은 목적물의 인도가 있어야 성립하는 요물계약이다.","a":"X","e":"증여는 인도 없이도 의사표시의 합치로 성립한다. 다만 서면 여부는 해제 가능성과 관련된다."},{"p":29,"q":"서면으로 하지 않은 증여는 각 당사자가 해제할 수 있다.","a":"O","e":"민법상 서면에 의하지 않은 증여는 각 당사자가 해제할 수 있다."},{"p":29,"q":"서면에 의하지 않은 증여라도 이미 이행한 부분에 대하여는 해제의 영향을 받지 않는다.","a":"O","e":"비서면 증여의 해제는 이미 이행한 부분에 영향을 미치지 않는다."},{"p":29,"q":"서면에 의하지 않은 증여는 언제나 무효이므로 이미 이행한 부분도 반환하여야 한다.","a":"X","e":"비서면 증여는 무효가 아니라 해제할 수 있는 계약이다. 이미 이행된 부분은 해제 영향을 받지 않는다."},{"p":29,"q":"증여자가 수증자에게 증여의 의사를 서면으로 표시한 경우에는 원칙적으로 임의해제가 제한된다.","a":"O","e":"서면 증여는 비서면 증여의 임의해제 규정이 적용되지 않는다."},{"p":29,"q":"부담부 증여는 부담의 한도에서 쌍무계약에 관한 규정이 준용된다.","a":"O","e":"수증자가 일정한 부담을 지는 경우 그 부담 범위에서는 쌍무계약 규정이 준용된다."},{"p":29,"q":"부담부 증여는 언제나 매매와 동일하게 유상계약이므로 증여 규정은 전혀 적용되지 않는다.","a":"X","e":"부담부 증여는 증여의 성질을 가지며 부담의 한도에서 쌍무계약 규정이 준용될 뿐이다."},{"p":29,"q":"수증자가 증여자 또는 그 배우자·직계혈족에 대하여 범죄행위를 한 경우 증여자는 증여를 해제할 수 있다.","a":"O","e":"망은행위에 해당하면 증여자는 증여를 해제할 수 있다."},{"p":29,"q":"수증자가 증여자에 대한 부양의무를 이행하지 아니한 경우에도 증여자는 증여를 해제할 수 있다.","a":"O","e":"수증자의 부양의무 불이행은 망은행위에 해당한다."},{"p":29,"q":"수증자의 망은행위를 이유로 한 증여해제는 이미 이행한 부분에도 당연히 소급하여 효력이 미친다.","a":"X","e":"망은행위 해제도 이미 이행한 부분에는 영향을 미치지 않는다."},{"p":29,"q":"증여자의 재산상태가 현저히 변경되어 증여 이행으로 생계에 중대한 영향을 받을 때에는 증여자는 증여를 해제할 수 있다.","a":"O","e":"재산상태 변경으로 생계 또는 부양의무 이행에 중대한 영향을 받으면 해제가 가능하다."},{"p":29,"q":"증여자가 사망하면 증여자의 재산상태 변경을 이유로 한 해제권은 상속인에게 당연히 승계된다.","a":"X","e":"재산상태 변경을 이유로 한 해제권은 증여자의 일신적 판단이 강하여 원칙적으로 상속되지 않는다."},{"p":29,"q":"증여자는 증여목적물의 하자나 권리의 흠결에 대하여 원칙적으로 책임을 지지 않는다.","a":"O","e":"무상계약인 증여에서는 증여자의 담보책임이 제한된다. 다만 악의로 고지하지 않은 경우 등은 문제된다."},{"p":29,"q":"증여자가 하자나 흠결을 알고도 수증자에게 고지하지 않은 경우에는 책임을 질 수 있다.","a":"O","e":"증여자가 알고 고지하지 않은 하자·흠결에 대해서는 책임을 질 수 있다."},{"p":29,"q":"정기증여는 증여자 또는 수증자의 사망으로 효력을 잃는다.","a":"O","e":"정기적 급부를 목적으로 하는 증여는 당사자 사망으로 종료되는 것이 원칙이다."},{"p":29,"q":"교환은 당사자 쌍방이 금전 이외의 재산권을 서로 이전할 것을 약정함으로써 성립한다.","a":"O","e":"교환은 금전 아닌 재산권의 상호이전을 목적으로 하는 낙성계약이다."},{"p":29,"q":"교환계약에서도 당사자 일방이 보충금을 지급하기로 한 경우 그 보충금에 관하여 매매대금 규정이 준용된다.","a":"O","e":"보충금은 매매의 대금과 유사하므로 매매대금에 관한 규정이 준용된다."},{"p":29,"q":"교환은 금전과 물건을 서로 이전하는 계약이므로 매매와 완전히 동일하다.","a":"X","e":"금전 대 물건은 매매이고, 교환은 금전 이외의 재산권 상호이전이 핵심이다."},{"p":29,"q":"소비대차는 금전 기타 대체물의 소유권을 이전하고 동종·동질·동량의 물건을 반환할 것을 내용으로 한다.","a":"O","e":"소비대차는 목적물을 소비하고 같은 종류·품질·수량을 반환하는 계약이다."},{"p":29,"q":"소비대차의 목적물은 사용 후 동일한 물건 자체를 반환하여야 하는 물건이어야 한다.","a":"X","e":"동일물 반환은 사용대차·임대차 구조이고, 소비대차는 동종·동질·동량 반환이다."},{"p":29,"q":"금전소비대차에서 차주는 원칙적으로 빌린 금전 그 자체가 아니라 같은 액수의 금전을 반환하면 된다.","a":"O","e":"금전은 대체성이 강하므로 동일 지폐 반환이 아니라 같은 금액 반환이 문제된다."},{"p":29,"q":"이자 약정이 없는 금전소비대차에서도 차주는 당연히 법정이자를 지급하여야 한다.","a":"X","e":"이자는 약정이 있어야 지급의무가 발생하는 것이 원칙이다."},{"p":29,"q":"이자 약정은 원본채권과 구별되는 종된 급부에 관한 약정이다.","a":"O","e":"이자채권은 원본채권에 종속되는 성질을 가진다."},{"p":29,"q":"소비대차는 차주가 목적물을 소비할 수 있으므로 목적물의 소유권이 차주에게 이전되는 구조이다.","a":"O","e":"소비대차는 목적물의 소유권 이전을 전제로 같은 종류의 물건을 반환한다."},{"p":29,"q":"사용대차와 소비대차는 모두 같은 물건 자체를 반환하는 계약이다.","a":"X","e":"사용대차는 같은 물건 자체 반환, 소비대차는 동종·동질·동량 반환이다."},{"p":29,"q":"준소비대차는 기존 채무를 소비대차의 목적으로 하기로 약정하는 경우에 성립할 수 있다.","a":"O","e":"기존 채무를 소비대차 목적물로 삼아 새 소비대차 관계로 구성하는 것을 준소비대차라 한다."},{"p":29,"q":"준소비대차가 성립하면 기존 채무는 항상 무효가 되어야 한다.","a":"X","e":"준소비대차는 기존 채무를 전제로 새로운 소비대차로 구성하는 것이며, 기존 채무의 무효가 필수요건은 아니다."},{"p":29,"q":"대물반환의 예약은 차주가 차용물에 갈음하여 다른 재산권을 이전하기로 하는 약정이다.","a":"O","e":"소비대차와 관련하여 차용물 반환에 갈음한 재산권 이전 약정이 문제될 수 있다."},{"p":29,"q":"소비대차에서 반환시기를 정하지 않은 경우 대주는 상당한 기간을 정하여 반환을 최고하여야 한다.","a":"O","e":"반환시기 약정이 없으면 상당한 기간을 두고 반환을 최고하는 구조로 정리한다."},{"p":29,"q":"소비대차는 언제나 무상계약이므로 이자 있는 소비대차는 인정되지 않는다.","a":"X","e":"이자 약정이 있으면 유상소비대차가 된다."},{"p":29,"q":"이자제한법상 제한을 초과하는 이자약정은 초과부분이 무효가 될 수 있다.","a":"O","e":"이자 약정은 강행규정에 의해 제한될 수 있으며, 제한 초과 부분의 효력이 문제된다."},{"p":29,"q":"소비대차의 목적물은 금전에 한정된다.","a":"X","e":"금전뿐 아니라 쌀, 유류 등 대체물도 소비대차의 목적물이 될 수 있다."},{"p":29,"q":"소비대차에서 차주는 반환시기에 동종·동질·동량의 물건을 반환할 의무를 부담한다.","a":"O","e":"소비대차의 반환의무는 동종·동질·동량 반환이다."},{"p":29,"q":"사용대차는 당사자 일방이 상대방에게 무상으로 사용·수익하게 하고 상대방이 그 물건 자체를 반환할 것을 약정하는 계약이다.","a":"O","e":"사용대차는 무상 사용·수익과 동일물 반환을 내용으로 한다."},{"p":29,"q":"사용대차는 차임을 지급하는 유상계약이다.","a":"X","e":"차임을 지급하면 임대차이고, 사용대차는 무상계약이다."},{"p":29,"q":"사용대차의 목적물은 소비로 없어지는 대체물이어야 한다.","a":"X","e":"소비되는 대체물은 소비대차이고, 사용대차는 사용 후 그 물건 자체를 반환할 수 있어야 한다."},{"p":29,"q":"사용차주는 계약 또는 목적물의 성질에 의하여 정하여진 용법에 따라 사용·수익하여야 한다.","a":"O","e":"차주는 약정 용법 또는 목적물 성질에 따른 용법을 준수해야 한다."},{"p":29,"q":"사용차주는 대주의 승낙 없이 제3자에게 차용물을 사용·수익하게 하지 못한다.","a":"O","e":"무상·신뢰관계가 강하므로 대주의 승낙 없는 제3자 사용수익 제공은 제한된다."},{"p":29,"q":"사용차주가 대주의 승낙 없이 제3자에게 사용·수익하게 한 경우 대주는 계약을 해지할 수 있다.","a":"O","e":"무단 사용수익 제공은 해지사유가 될 수 있다."},{"p":29,"q":"사용대차에서 사용차주는 통상의 필요비를 대주에게 상환청구할 수 있다.","a":"X","e":"무상사용의 이익을 얻는 차주가 통상의 필요비를 부담하는 것이 원칙이다."},{"p":29,"q":"사용차주가 목적물에 관하여 특별필요비를 지출한 경우에는 일정한 요건하에 상환청구가 가능하다.","a":"O","e":"통상필요비와 달리 특별필요비는 상환 문제가 생길 수 있다."},{"p":29,"q":"사용대차에서 반환시기를 정한 경우 차주는 그 시기에 목적물을 반환하여야 한다.","a":"O","e":"반환시기 약정이 있으면 그 약정에 따른다."},{"p":29,"q":"반환시기를 정하지 않았으나 사용·수익의 목적을 정한 경우 차주는 그 목적에 따른 사용·수익을 마친 때 반환하여야 한다.","a":"O","e":"기한이 없어도 목적이 정해진 경우 목적 달성 시 반환의무가 생긴다."},{"p":29,"q":"반환시기와 사용목적을 모두 정하지 않은 사용대차에서 대주는 언제든지 계약을 해지할 수 있다.","a":"O","e":"기한·목적이 없으면 대주는 해지로 반환을 구할 수 있다."},{"p":29,"q":"사용대차는 무상계약이므로 차주는 목적물을 멸실·훼손시켜도 책임을 지지 않는다.","a":"X","e":"무상계약이라도 차주의 보관·반환의무 위반에 따른 책임은 문제된다."},{"p":29,"q":"사용대차는 차주의 사망으로 종료될 수 있다.","a":"O","e":"사용대차는 차주 개인에 대한 신뢰가 강하므로 차주 사망과 종료가 연결된다."},{"p":29,"q":"도급은 당사자 일방이 어느 일을 완성할 것을 약정하고 상대방이 그 일의 결과에 대하여 보수를 지급할 것을 약정하는 계약이다.","a":"O","e":"도급의 핵심은 일의 완성과 보수 지급이다."},{"p":29,"q":"도급은 노무제공 자체가 아니라 일의 완성이라는 결과를 목적으로 한다.","a":"O","e":"고용은 노무 제공, 도급은 일의 완성 결과에 초점이 있다."},{"p":29,"q":"도급인은 수급인이 일을 완성하지 않았더라도 언제나 보수를 전액 지급하여야 한다.","a":"X","e":"보수는 원칙적으로 일의 완성에 대한 대가이다. 완성 전 전액 보수청구는 원칙이 아니다."},{"p":29,"q":"도급계약은 원칙적으로 유상·쌍무·낙성·불요식 계약이다.","a":"O","e":"도급은 일 완성과 보수 지급이 대가관계에 있다."},{"p":29,"q":"수급인은 원칙적으로 자기 책임 아래 일을 완성하면 되고 반드시 직접 노무를 제공하여야 하는 것은 아니다.","a":"O","e":"특별한 약정이나 일의 성질상 직접 이행이 필요한 경우를 제외하면 결과 완성이 핵심이다."},{"p":29,"q":"도급에서 완성된 목적물의 소유권 귀속은 주요 재료를 누가 공급했는지와 당사자 합의 등을 고려한다.","a":"O","e":"건물도급 등에서는 재료공급자와 소유권 귀속 합의가 중요하다."},{"p":29,"q":"수급인이 자기 재료와 노력으로 건물을 완성한 경우에도 도급인에게 원시취득시키기로 합의하면 도급인이 원시취득할 수 있다.","a":"O","e":"건물도급에서 소유권 귀속 합의가 있으면 도급인 원시취득이 인정될 수 있다."},{"p":29,"q":"도급인은 완성된 목적물에 하자가 있는 경우 수급인에게 하자보수를 청구할 수 있다.","a":"O","e":"도급인의 하자보수청구권은 도급 담보책임의 핵심이다."},{"p":29,"q":"도급목적물의 하자가 중요하지 않고 보수에 과다한 비용이 필요한 경우에도 도급인은 언제나 하자보수를 청구할 수 있다.","a":"X","e":"하자가 중요하지 않은데 보수에 과다한 비용이 드는 경우에는 하자보수청구가 제한될 수 있다."},{"p":29,"q":"도급인은 하자보수에 갈음하거나 하자보수와 함께 손해배상을 청구할 수 있다.","a":"O","e":"하자보수청구와 손해배상청구의 관계가 시험 포인트다."},{"p":29,"q":"도급인은 완성된 목적물의 하자로 계약의 목적을 달성할 수 없는 때에는 계약을 해제할 수 있다.","a":"O","e":"목적 달성이 불가능할 정도의 하자면 해제 가능성이 있다."},{"p":29,"q":"건물 기타 토지의 공작물 도급에서는 중대한 하자가 있어도 계약해제가 언제나 자유롭게 인정된다.","a":"X","e":"건물 등 토지공작물은 사회경제적 손실 때문에 해제가 제한되는 특별 규율이 있다."},{"p":29,"q":"도급인의 하자담보책임 추궁은 일정한 기간 제한을 받는다.","a":"O","e":"하자담보책임은 영구히 행사되는 것이 아니라 기간 제한이 있다."},{"p":29,"q":"수급인이 하자를 알고 고지하지 않은 경우에도 담보책임 기간 제한은 언제나 그대로 적용된다.","a":"X","e":"수급인이 하자를 알고 고지하지 않은 경우에는 기간 제한 치물을 보관하면 된다.","a":"O","e":"무상수치인의 주의의무는 선관주의보다 완화된다."},{"p":29,"q":"유상수치인은 선량한 관리자의 주의로 임치물을 보관하여야 한다.","a":"O","e":"보수를 받는 유상수치인은 선관주의의무를 부담한다."},{"p":29,"q":"임치물의 반환시기를 정한 경우에도 임치인은 원칙적으로 언제든지 반환을 청구할 수 있다.","a":"O","e":"임치는 임치인의 이익을 위한 보관관계이므로 임치인의 반환청구가 넓게 인정된다."},{"p":29,"q":"반환시기를 정한 임치에서 수치인은 특별한 사정 없이 그 기한 전에 임치물 반환을 강제할 수 없다.","a":"O","e":"수치인의 조기반환은 제한될 수 있다."},{"p":29,"q":"임치물은 원칙적으로 임치한 바로 그 물건을 반환하여야 한다.","a":"O","e":"임치는 보관계약이므로 동일물 반환이 원칙이다."},{"p":29,"q":"소비임치는 수치인이 임치물을 소비하고 동종·동질·동량으로 반환하는 특수한 임치이다.","a":"O","e":"소비임치는 소비대차와 유사한 구조가 생긴다."},{"p":29,"q":"은행예금은 일반적으로 소비임치적 성격이 문제될 수 있다.","a":"O","e":"금전 보관 후 같은 금액 반환 구조라 소비임치적 설명이 가능하다."},{"p":29,"q":"수치인은 임치인의 승낙 없이 임치물을 사용하지 못한다.","a":"O","e":"보관자는 보관 목적을 넘어 임치물을 임의 사용하면 안 된다."},{"p":29,"q":"수치인이 임치물을 임의로 사용해도 보관만 잘하면 아무 책임이 없다.","a":"X","e":"임의 사용은 계약상 의무 위반이 될 수 있다."},{"p":29,"q":"수치인이 임치물 보관에 필요한 비용을 지출한 경우 임치인에게 상환청구가 가능하다.","a":"O","e":"보관 필요비용의 상환이 문제된다."},{"p":29,"q":"임치계약도 당사자 사이의 신뢰관계가 중요하므로 위임 규정이 준용되는 부분이 있다.","a":"O","e":"임치에는 위임 규정이 준용되는 영역이 있다."},{"p":29,"q":"임치는 사용·수익을 목적으로 하므로 임대차와 동일하다.","a":"X","e":"임치는 보관, 임대차는 사용·수익이 목적이다."},{"p":29,"q":"조합은 2인 이상이 상호 출자하여 공동사업을 경영할 것을 약정함으로써 성립한다.","a":"O","e":"조합은 공동사업 목적의 인적 결합계약이다."},{"p":29,"q":"조합은 법인격이 당연히 인정되므로 조합재산은 조합의 단독소유이다.","a":"X","e":"민법상 조합은 법인이 아니며 조합재산은 합유로 귀속된다."},{"p":29,"q":"조합원의 출자는 금전 기타 재산뿐 아니라 노무도 가능하다.","a":"O","e":"조합 출자는 재산출자와 노무출자가 가능하다."},{"p":29,"q":"조합재산은 조합원들의 합유에 속한다.","a":"O","e":"조합재산 귀속은 합유가 핵심이다."},{"p":29,"q":"조합원은 조합관계가 존속하는 동안 조합재산의 분할을 청구할 수 있다.","a":"X","e":"합유관계인 조합재산은 조합 존속 중 분할청구가 제한된다."},{"p":29,"q":"조합원은 전원의 동의 없이 조합재산에 대한 지분을 임의로 처분하지 못한다.","a":"O","e":"합유지분 처분은 전원 동의가 필요하다."},{"p":29,"q":"조합 업무집행은 조합계약이나 조합원 결의에 따라 정해질 수 있다.","a":"O","e":"업무집행자 선정 및 업무집행 방식은 조합관계의 중요 포인트다."},{"p":29,"q":"업무집행자가 여럿인 경우 통상업무는 각자가 할 수 있는 경우가 있지만 이의가 있으면 중지해야 할 수 있다.","a":"O","e":"업무집행자 사이의 업무처리와 이의권이 문제된다."},{"p":29,"q":"조합의 통상사무가 아닌 중요한 업무는 원칙적으로 조합원 또는 업무집행자의 결의가 필요하다.","a":"O","e":"중요 업무는 단독 처리보다 결의가 요구되는 구조로 정리한 :29,"q":"고용은 노무 제공 자체가 목적이고 도급은 일의 완성이 목적이라는 점에서 구별된다.","a":"O","e":"고용과 도급의 구별은 목적이 노무 제공인지 결과 완성인지에 있다."},{"p":29,"q":"고용계약은 근로 자체의 제공이 중심이므로 도급과 달리 결과 완성이 반드시 핵심은 아니다.","a":"O","e":"고용은 노무 제공에 초점을 두는 계약이다."},{"p":29,"q":"종신정기금계약은 당사자 일방 또는 제3자의 종신까지 정기로 금전 기타 물건을 지급하는 계약이다.","a":"O","e":"종신정기금은 출제빈도는 낮지만 전형계약 종류에서 구별된다."},{"p":29,"q":"전형계약은 민법에 이름과 규정이 있는 계약이고, 비전형계약은 민법의 전형계약에 속하지 않는 계약이다.","a":"O","e":"계약의 종류에서 전형·비전형 구별은 기본이다."},{"p":29,"q":"주택관리사 시험에서는 기타계약을 전부 깊게 파기보다 증여·도급·위임·임치·조합·화해의 핵심 지문을 압축 반복하는 것이 효율적이다.","a":"O","e":"기타계약은 출제 가능 지점이 제한적이므로 핵심 지문 위주 반복이 효율적이다."},{"p":30,"q":"부당이득은 법률상 원인 없이 타인의 재산 또는 노무로 이익을 얻고 그로 인하여 타인에게 손해를 가한 경우 성립한다.","a":"O","e":"부당이득의 기본요건은 법률상 원인 없음, 이득, 손실, 인과관계이다."},{"p":30,"q":"법률상 원인 없이 이익을 얻었더라도 상대방에게 손해가 발생하지 않았다면 부당이득반환청구는 인정되지 않는다.","a":"O","e":"부당이득은 이득만으로 부족하고 상대방의 손실이 필요하다."},{"p":30,"q":"수익자에게 실질적인 이득이 남아 있지 않더라도 법률상 원인이 없으면 언제나 전부 반환하여야 한다.","a":"X","e":"실질적 이득이 없으면 반환의무도 없다. 선의 수익자는 특히 현존이익 범위에서 반환한다."},{"p":30,"q":"선의의 수익자는 그 받은 이익 전부와 이자를 붙여 반환하여야 한다.","a":"X","e":"선의의 수익자는 현존이익만 반환한다. 이자와 손해배상은 악의 수익자 범위이다."},{"p":30,"q":"악의의 수익자는 받은 이익에 이자를 붙여 반환하고 손해가 있으면 배상하여야 한다.","a":"O","e":"민법 제748조의 기본 내용이다."},{"p":30,"q":"수익자가 이익을 받은 후 법률상 원인 없음을 알게 된 때에는 처음부터 악의의 수익자로 본다.","a":"X","e":"나중에 알게 된 경우에는 그때부터 악의 수익자로서 책임을 진다."},{"p":30,"q":"선의의 수익자가 패소한 때에는 그 소를 제기한 때부터 악의의 수익자로 본다.","a":"O","e":"소 제기 시부터 악의 간주가 핵심 함정이다."},{"p":30,"q":"이득자의 이득이 상대방의 손실보다 큰 경우에는 이득 전부를 반환하여야 한다.","a":"X","e":"상대방의 손실 범위 내에서 반환한다."},{"p":30,"q":"이득자의 이득이 상대방의 손실보다 작은 경우에는 부당이득 범위 내에서 반환한다.","a":"O","e":"이득과 손실 중 작은 범위가 반환 한계가 된다."},{"p":30,"q":"부당이득반환의 범위는 언제나 상대방의 손실액과 무관하게 수익자가 얻은 이익 전부이다.","a":"X","e":"손실보다 이득이 크면 손실범위 내에서 반환한다."},{"p":30,"q":"타인의 토지를 점유함으로 인한 부당이득반환채무는 이행의 기한이 없는 채무로서 이행청구를 받은 때부터 지체책임이 있다.","a":"O","e":"기한 없는 채무이므로 청구를 받은 때부터 지체책임이 문제된다."},{"p":30,"q":"계약상의 급부가 계약상대방뿐 아니라 제3자의 이익으로 된 경우, 급부자는 원칙적으로 그 제3자에게 직접 부당이득반환을 청구할 수 있다.","a":"X","e":"계약당사자는 계약 상대방에게 반대급부를 청구할 수 있을 뿐, 제3자에게 직접 부당이득을 청구하지 못한다."},{"p":30,"q":"수익자가 받은 목적물을 반환할 수 없게 된 경우에는 가액반환이 문제된다.","a":"O","e":"원물반환 불능시 가액반환으로 전환된다."},{"p":30,"q":"수익자가 이익을 반환할 수 없는 경우, 그 이익의 목적물을 무상양수한 악의의 제3자는 원물 또는 가액 반환책임을 질 수 있다.","a":"O","e":"악의의 무상 전득자 책임이 문제된다."},{"p":30,"q":"수익자로부터 유상으로 취득한 선의의 제3자는 부당이득 전득자 책임을 당연히 부담한다.","a":"X","e":"자료의 핵심은 무상으로 양수한 악의의 제3자 책임이다. 유상 선의 전득자에게 당연 책임이라고 단정하면 틀린다."},{"p":30,"q":"채무가 없음에도 이를 변제한 경우에는 원칙적으로 부당이득반환을 청구할 수 있다.","a":"O","e":"비채변제는 원칙적으로 반환청구가 가능하다."},{"p":30,"q":"채무가 없음을 알면서 변제한 경우에는 비채변제라도 반환청구를 할 수 없다.","a":"O","e":"악의의 비채변제는 반환청구 불가가 핵심이다."},{"p":30,"q":"채무 없는 자가 착오로 변제하였더라도 그 변제가 도의관념에 부합하면 반환을 청구할 수 없다.","a":"O","e":"도의관념에 맞는 변제는 반환청구가 제한된다."},{"p":30,"q":"타인의 채무를 착오로 변제한 경우, 채권자가 선의로 증서를 훼멸하거나 담보를 포기하여 채권을 잃은 때에도 변제자는 채권자에게 반환을 청구할 수 있다.","a":"X","e":"그 경우 채권자에 대한 반환청구는 못하고 채무자에게 구상권을 행사할 수 있다."},{"p":30,"q":"타인의 채무를 착오로 변제한 자가 채권자에게 반환청구를 못하는 경우에도 채무자에 대하여 구상권을 행사할 수 있다.","a":"O","e":"채권자 보호 대신 실제 채무자에게 구상하게 한다."},{"p":30,"q":"변제기에 있지 않은 채무를 변제한 경우에는 원칙적으로 반환을 청구하지 못한다.","a":"O","e":"기한 전 변제는 원칙적으로 반환청구가 제한된다."},{"p":30,"q":"기한 전 변제를 착오로 한 경우에도 채권자는 이로 인하여 얻은 이익을 반환할 필요가 없다.","a":"X","e":"착오로 기한 전에 변제한 경우 채권자는 기간 이자상당액 등 얻은 이익을 반환해야 한다."},{"p":30,"q":"불법의 원인으로 재산을 급여하거나 노무를 제공한 때에는 원칙적으로 반환청구를 하지 못한다.","a":"O","e":"불법원인급여의 원칙이다."},{"p":30,"q":"불법원인급여에서 불법의 원인이 수익자에게만 있는 때에는 급여자는 반환을 청구할 수 있다.","a":"O","e":"제746조 단서의 핵심이다."},{"p":30,"q":"불법원인급여에서 반환청구가 부정되는 것은 부당이득반환청구에 한정되고 소유권에 기한 반환청구는 가능하다.","a":"X","e":"불법원인급여는 부당이득반환청구뿐 아니라 소유권에 기한 반환청구 등 일체의 반환청구를 부정한다."},{"p":30,"q":"불법원인급여의 불법은 단순한 법규위반이 아니라 사회질서에 반하는 불법을 의미한다.","a":"O","e":"자료도 반사회적 행위로 인한 급부로 설명한다."},{"p":30,"q":"부첩관계 유지를 목적으로 부동산을 증여한 경우, 이미 이행되었더라도 원칙적으로 증여자는 반환을 청구할 수 없다.","a":"O","e":"제103조 무효와 제746조 불법원인급여가 결합되는 전형적 지문이다."},{"p":30,"q":"불공정한 법률행위가 무효인 경우에도 피해자는 언제나 불법원인급여 때문에 반환청구를 할 수 없다.","a":"X","e":"불공정행위는 불법 원인이 수익자에게만 있는 구조로 보아 피해자는 반환청구 가능, 수익자는 반환청구 불가로 정리한다."},{"p":30,"q":"도박채무 변제를 위하여 금전을 지급한 경우, 급여자는 원칙적으로 반환을 청구할 수 없다.","a":"O","e":"도박채무는 반사회질서 행위와 연결되어 불법원인급여가 문제된다."},{"p":30,"q":"불법원인급여에서 노무 제공은 반환 대상이 아니므로 제746조가 적용되지 않는다.","a":"X","e":"조문은 재산 급여뿐 아니라 노무 제공도 포함한다."},{"p":30,"q":"무효인 법률행위가 이미 이행된 경우에는 원칙적으로 부당이득반환의 문제가 발생한다.","a":"O","e":"무효의 일반효과이다. 단, 반사회질서 행위는 제746조로 반환이 부정될 수 있다."},{"p":30,"q":"부당이득반환의무가 발생하려면 수익자의 고의 또는 과실이 반드시 필요하다.","a":"X","e":"부당이득은 이득 반환제도이고, 불법행위와 달리 고의·과실을 성립요건으로 하지 않는다."},{"p":30,"q":"부당이득에서 반환청구권자는 자연인뿐 아니라 법인도 될 수 있다.","a":"O","e":"부당이득은 재산법상 청구권이므로 법인도 주체가 될 수 있다."},{"p":30,"q":"선의 수익자가 받은 금전을 생활비로 소비한 경우, 현존이익 범위가 문제될 수 있다.","a":"O","e":"선의 수익자의 반환범위는 현존이익이다."},{"p":30,"q":"악의 수익자는 현존이익이 없어도 받은 이익에 이자를 붙여 반환하고 손해가 있으면 배상하여야 한다.","a":"O","e":"악의 수익자의 반환범위는 선의보다 넓다."},{"p":30,"q":"법률상 원인 없는 이득이 있지만 그 이득과 상대방 손실 사이에 인과관계가 없다면 부당이득반환청구는 인정되기 어렵다.","a":"O","e":"이득과 손실 사이의 관련성이 필요하다."},{"p":30,"q":"계약이 취소되면 이미 이행된 급부는 원칙적으로 부당이득반환 또는 원상회복의 문제가 된다.","a":"O","e":"취소의 소급효로 인해 원상회복/부당이득이 문제된다."},{"p":30,"q":"의사무능력자가 한 법률행위가 이행된 경우 의사무능력자 측의 반환범위는 현존이익으로 제한될 수 있다.","a":"O","e":"이미 앞 파트와 연결되는 부당이득 함정이다."},{"p":30,"q":"미성년자의 법률행위가 취소된 경우 미성년자 측은 선악을 불문하고 받은 이익이 현존하는 한도에서 반환한다.","a":"O","e":"제한능력자 보호 원리와 연결된다."},{"p":30,"q":"부당이득반환채무는 모든 경우에 그 이득을 얻은 때부터 당연히 지체책임이 발생한다.","a":"X","e":"기한 없는 채무 유형은 이행청구를 받은 때부터 지체책임이 문제된다."},{"p":30,"q":"부당이득반환에서 선의와 악의의 구별은 반환범위에 영향을 미친다.","a":"O","e":"선의는 현존이익, 악의는 받은 이익+이자+손해배상이다."},{"p":30,"q":"비채변제에서 변제자가 채무 없음을 알았는지는 반환청구 가능 여부와 무관하다.","a":"X","e":"알고 변제한 경우 반환청구가 제한된다."},{"p":30,"q":"착오로 타인의 채무를 변제한 경우 채권자가 선의로 담보를 포기하였다면, 변제자 보호보다 채권자 보호가 우선될 수 있다.","a":"O","e":"채권자가 선의로 증서를 훼멸하거나 담보를 포기한 때에는 변제자는 반환청구를 못한다."},{"p":30,"q":"기한 전 변제는 변제기가 오지 않았다는 이유만으로 언제나 전액 반환청구가 가능하다.","a":"X","e":"원칙적으로 반환청구 불가이다."},{"p":30,"q":"기한 전 변제에서 착오가 있으면 채권자가 얻은 기간 이자 상당 이익은 반환 대상이 될 수 있다.","a":"O","e":"기한 전 착오변제의 예외이다."},{"p":30,"q":"부당이득반환청구권은 법률행위가 아니라 법률규정에 의하여 발생하는 권리이다.","a":"O","e":"부당이득은 법률규정에 의한 권리변동 원인이다."},{"p":30,"q":"불법원인급여는 급여자의 반환청구를 제한하는 제도이므로 수익자의 불법성이 더 큰 경우에도 항상 반환청구가 부정된다.","a":"X","e":"불법 원인이 수익자에게만 있으면 반환청구 가능하다."},{"p":30,"q":"불법원인급여에서 반환청구가 부정되면 물권적 반환청구권도 행사할 수 없다는 점이 핵심 함정이다.","a":"O","e":"부당이득반환청구뿐 아니라 소유권에 기한 반환청구 등 일체가 부정된다."},{"p":30,"q":"부당이득은 손해배상과 달리 가해행위의 위법성을 요건으로 한다.","a":"X","e":"위법성은 불법행위 요건이고 부당이득은 법률상 원인 없음이 핵심이다."},{"p":30,"q":"부당이득반환청구와 불법행위 손해배상청구는 사안에 따라 선택적으로 경합할 수 있다.","a":"O","e":"같은 사실관계에서 두 청구권이 경합할 수 있다."},{"p":30,"q":"일반불법행위가 성립하려면 가해자의 고의 또는 과실, 책임능력, 위법성, 손해, 상당인과관계가 필요하다.","a":"O","e":"제750조 기본 구조이다."},{"p":30,"q":"불법행위책임은 손해가 없어도 위법행위만 있으면 성립한다.","a":"X","e":"손해 발생이 필요하다."},{"p":30,"q":"가해행위와 손해 사이에는 상당인과관계가 있어야 한다.","a":"O","e":"인과관계 범위는 상당인과관계 내로 제한된다."},{"p":30,"q":"불법행위가 성립하면 손해배상은 원칙적으로 금전배상이다.","a":"O","e":"민법 제763조에 의해 금전배상이 원칙이다."},{"p":30,"q":"불법행위로 건물이 훼손된 경우 피해자는 특별한 사정이 없어도 원상회복을 청구할 수 있다.","a":"X","e":"건물 훼손 손해도 원칙적으로 금전배상이고, 특별한 사정 없이는 원상회복을 청구할 수 없다."},{"p":30,"q":"명예훼손의 경우 법원은 피해자의 청구에 따라 손해배상을 대신하거나 손해배상과 함께 명예회복에 적당한 처분을 명할 수 있다.","a":"O","e":"다만 사죄광고 강제는 헌법위반으로 정리한다."},{"p":30,"q":"민법 제764조의 명예회복에 적당한 처분에는 사죄광고를 강제로 명하는 것도 당연히 포함된다.","a":"X","e":"사죄광고 강제는 헌법에 위반된다."},{"p":30,"q":"타인의 신체·자유·명예를 해하거나 기타 정신상 고통을 가한 경우 위자료가 인정될 수 있다.","a":"O","e":"재산 이외의 손해배상이다."},{"p":30,"q":"타인의 생명을 침해한 경우 직계존속·직계비속 및 배우자는 재산상 손해가 없는 경우에도 손해배상을 청구할 수 있다.","a":"O","e":"생명침해 위자료 청구권자 포인트이다."},{"p":30,"q":"태아는 불법행위로 인한 손해배상청구권에 관하여 이미 출생한 것으로 본다.","a":"O","e":"민법 제762조의 핵심이다."},{"p":30,"q":"태아는 모든 법률관계에서 이미 출생한 것으로 본다.","a":"X","e":"태아의 권리능력 의제는 개별규정에서 인정되는 범위에 한정된다."},{"p":30,"q":"법인이나 비법인사단도 불법행위 손해배상청구권자가 될 수 있다.","a":"O","e":"자료는 자연인·법인·비법인사단/재단·태아를 손해배상청구권자로 정리한다."},{"p":30,"q":"불법행위 손해배상의무자는 손해가 고의 또는 중대한 과실에 의한 경우에도 생계에 중대한 영향이 있으면 배상액 경감을 청구할 수 있다.","a":"X","e":"경감청구는 고의 또는 중대한 과실이 아닌 경우에 문제된다."},{"p":30,"q":"불법행위 손해배상의무자는 손해가 경과실에 의한 것이고 배상으로 생계에 중대한 영향을 받는 경우 법원에 배상액 경감을 청구할 수 있다.","a":"O","e":"법원은 경제상태와 손해 원인 등을 참작할 수 있다."},{"p":30,"q":"불법행위 손해배상청구권은 피해자나 법정대리인이 손해 및 가해자를 안 날부터 3년간 행사하지 않으면 소멸한다.","a":"O","e":"주관적 기산점 3년이다."},{"p":30,"q":"불법행위 손해배상청구권은 불법행위를 한 날부터 20년간 행사하지 않으면 소멸한다.","a":"X","e":"자료 기준은 불법행위를 한 날부터 10년이다."},{"p":30,"q":"불법행위 손해배상청구권은 손해 및 가해자를 안 날부터 3년 또는 불법행위를 한 날부터 10년이 핵심 기간이다.","a":"O","e":"주택관리사 대비는 3년/1 const PARTS = RAW.parts;

/* ---------------- storage helpers (persistent, personal) ---------------- */
const STORE_KEY = 'civil-ox-state-v1';
let ustate = { bookmarks: [], wrong: {}, studied: {}, sessions: {} }; // studied: {partIndex: [ids studied]}; sessions: {key: {set, idx, order, quiz}}
let storageReady = false;

async function loadState(){
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value){ ustate = JSON.parse(r.value); }
  }catch(e){ /* first run, no data yet */ }
  if(!ustate.sessions) ustate.sessions = {};
  storageReady = true;
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORE_KEY, JSON.stringify(ustate)); }catch(e){ console.error('save failed', e); }
  }, 250);
}
