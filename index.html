,"e":"점유침탈·반환거부가 아닌 형태의 방해를 제거하는 권리다. 무효등기 말소청구가 대표다."},{"p":15,"q":"방해제거청구권은 무효등기의 말소청구권 형태로 구체화될 수 있다.","a":"O","e":"시험 단골 표현이다."},{"p":15,"q":"방해예방청구권은 현재 방해가 없더라도 장래 방해의 염려가 있으면 인정될 수 있다.","a":"O","e":"예방 또는 담보제공을 청구할 수 있다."},{"p":15,"q":"방해예방청구권은 현실의 방해가 이미 발생한 후에만 행사할 수 있다.","a":"X","e":"장래 방해 염려만 있어도 예방을 청구할 수 있다."},{"p":15,"q":"물권적 청구권은 현재 물권자만 행사할 수 있는 것이 원칙이다.","a":"O","e":"물권에 기한 청구권이므로 현재 물권자에게 귀속된다."},{"p":15,"q":"이미 소유권을 상실한 전 소유자는 원칙적으로 소유권에 기한 물권적 청구권을 행사할 수 없다.","a":"O","e":"현재 물권자 요건과 연결된다."},{"p":15,"q":"물권적 청구권은 물권의 효력에서 발생하지만 그 성질은 채권적 청구권으로 설명될 수 있다.","a":"O","e":"물권적 효력에 기초하나 구체적으로는 특정인에게 일정 행위를 요구하는 청구권이다."},{"p":15,"q":"물권적 청구권은 소멸시효에 걸리는 것이 원칙이다.","a":"X","e":"소유권에 기한 물권적 청구권은 소유권과 분리하여 소멸시효에 걸리지 않는다고 본다."},{"p":15,"q":"소유권에 기한 물권적 청구권은 소유권과 독립하여 양도할 수 있다.","a":"X","e":"물권적 청구권은 그 기초인 물권과 분리하여 독립적으로 양도할 수 없다."},{"p":15,"q":"소유권에 기한 반환청구권의 상대방은 현재 목적물을 점유하고 있는 자이다.","a":"O","e":"반환청구는 현재 점유자를 상대로 한다."},{"p":15,"q":"소유권에 기한 방해제거청구의 상대방은 현재 방해상태를 지배하거나 제거할 수 있는 자가 될 수 있다.","a":"O","e":"방해상태의 제거 가능성이 핵심이다."},{"p":15,"q":"물권적 청구권은 불법행위에 기한 손해배상청구권과 구별된다.","a":"O","e":"물권적 청구권은 반환·제거·예방이고, 손해배상은 고의·과실 및 손해를 요한다."},{"p":15,"q":"물권적 청구권이 인정되면 손해배상청구권은 언제나 배제된다.","a":"X","e":"요건을 갖추면 물권적 청구권과 불법행위 손해배상청구권이 병존할 수 있다."},{"p":15,"q":"소유권자는 제213조·제214조에 따라 반환청구권, 방해제거청구권, 방해예방청구권을 행사할 수 있다.","a":"O","e":"소유권에 기한 물권적 청구권의 기본이다."},{"p":15,"q":"점유권에는 점유보호청구권으로 점유물반환청구권·방해제거청구권·방해예방청구권이 인정된다.","a":"O","e":"민법 제204조~206조 구조다."},{"p":15,"q":"저당권자는 목적물을 배타적으로 점유하지 않으므로 저당권에 기한 목적물 반환청구권은 인정되지 않는다.","a":"O","e":"저당권은 비점유담보물권이다."},{"p":15,"q":"지역권자는 승역지를 배타적으로 점유하므로 지역권에 기한 반환청구권이 인정된다.","a":"X","e":"지역권은 배타적 점유를 내용으로 하지 않아 반환청구권이 인정되지 않는다."},{"p":15,"q":"저당권과 지역권에도 방해제거청구권·방해예방청구권은 인정될 수 있다.","a":"O","e":"반환청구권은 부정되지만 방해제거·예방은 가능하다."},{"p":15,"q":"유치권자는 유치권 자체에 기하여 목적물 반환청구권을 행사할 수 있다.","a":"X","e":"유치권 자체에 기한 반환청구권은 인정되지 않는다. 다만 점유권에 기한 반환청구권은 가능하다."},{"p":15,"q":"유치권자가 점유를 침탈당한 경우 점유권에 기한 반환청구권을 행사할 수 있다.","a":"O","e":"유치권 자체가 아니라 점유권에 기한 반환청구다."},{"p":15,"q":"전세권자는 전세권 내용 실현이 방해될 때 전세권에 기한 물권적 청구권을 행사할 수 있다.","a":"O","e":"전세권자는 점유보호청구뿐 아니라 전세권에 기한 물권적 청구권도 행사 가능하다."},{"p":15,"q":"지상권자는 지상권 침해에 대하여 물권적 청구권을 행사할 수 없다.","a":"X","e":"지상권은 물권이므로 방해에 대하여 물권적 청구권 행사가 가능하다."},{"p":15,"q":"질권자는 목적물 점유를 전제로 하므로 침탈 시 점유보호청구권이 문제될 수 있다.","a":"O","e":"질권은 점유담보물권이므로 점유 침해에 대한 보호가 중요하다."},{"p":15,"q":"부동산 물권변동의 공시방법은 등기이고, 동산 물권변동의 공시방법은 점유가 원칙이다.","a":"O","e":"물권은 대세효가 있으므로 공시가 필요하다."},{"p":15,"q":"우리 민법은 부동산등기에 대하여 일반적으로 공신력을 인정한다.","a":"X","e":"우리 민법은 부동산등기의 공신력을 인정하지 않는 것이 원칙이다."},{"p":15,"q":"동산 점유에는 일정한 경우 공신력이 인정되어 선의취득 제도가 가능하다.","a":"O","e":"동산 거래안전 보호를 위해 선의취득이 인정된다."},{"p":15,"q":"물권의 배타성과 대세효 때문에 공시제도가 요구된다.","a":"O","e":"제3자에게 권리를 주장하려면 외부에서 알 수 있는 표지가 필요하다."},{"p":15,"q":"부동산 물권은 등기하지 않아도 언제나 제3자에게 대항할 수 있다.","a":"X","e":"부동산 물권변동은 원칙적으로 등기를 해야 효력이 생기거나 대항할 수 있다."},{"p":15,"q":"동산 물권의 공시방법은 원칙적으로 인도 또는 점유 이전이다.","a":"O","e":"동산은 점유가 외부적 표지다."},{"p":15,"q":"공시방법은 물권법정주의와도 연결되어 물권의 종류와 내용 및 귀속을 외부적으로 명확하게 한다.","a":"O","e":"물권의 대세효 때문에 공시와 법정주의가 함께 중요하다."},{"p":15,"q":"권리의 충돌은 하나의 물건이나 법률관계 위에 여러 권리가 존재하여 모두를 만족시킬 수 없는 경우를 말한다.","a":"O","e":"우선순위 판단의 출발점이다."},{"p":15,"q":"권리의 경합은 하나의 생활사실에서 여러 권리가 발생하여 권리자가 선택적·순차적·동시에 행사할 수 있는 경우를 말한다.","a":"O","e":"권리의 경합은 여러 권리가 실제로 발생하는 경우다."},{"p":15,"q":"법규의 경합은 여러 법규가 적용될 수 있으나 하나의 법규가 다른 법규 적용을 배제하여 하나의 권리만 발생하는 경우를 말한다.","a":"O","e":"특별법 우선 등이 대표 구조다."},{"p":15,"q":"권리의 경합에서는 언제나 하나의 권리만 발생한다.","a":"X","e":"권리의 경합은 여러 권리가 발생하고 선택적·순차적 행사 가능하다."},{"p":15,"q":"법규의 경합에서는 처음부터 복수의 권리가 모두 발생하고 권리자가 자유롭게 모두 행사한다.","a":"X","e":"법규의 경합은 하나의 법규가 다른 법규 적용을 배제하여 하나의 권리만 발생하는 구조다."},{"p":15,"q":"물권과 채권이 충돌하는 경우에도 특별법이 채권에 우선권을 부여하면 채권이 물권보다 우선할 수 있다.","a":"O","e":"소액보증금, 임금채권 등 예외를 기억한다."},{"p":15,"q":"물권은 배타적 권리이므로 하나의 물건 위에 하나의 소유권만 성립하고 공유는 허용되지 않는다.","a":"X","e":"공유는 하나의 소유권이 지분적으로 여러 사람에게 귀속하는 것이므로 허용된다."},{"p":15,"q":"물권법정주의는 물권의 종류만 제한하고 내용은 당사자 자유에 맡긴다.","a":"X","e":"내용강제도 포함한다."},{"p":15,"q":"물권적 청구권은 물권을 보호하기 위한 청구권이므로 손해 발생을 요건으로 하지 않는다.","a":"O","e":"손해배상청구권과 구별한다."},{"p":15,"q":"방해예방청구권은 장래 방해 염려가 있는 경우 그 예방 또는 담보제공을 청구할 수 있는 권리이다.","a":"O","e":"제206조·제214조 구조다."},{"p":15,"q":"저당권자는 저당목적물을 점유하지 않으므로 저당권에 기한 반환청구권은 부정된다.","a":"O","e":"저당권은 목적물 지배를 직접 점유로 실현하지 않는다."},{"p":15,"q":"지역권자는 승역지를 배타적으로 점유하지 않으므로 지역권에 기한 반환청구권은 부정된다.","a":"O","e":"지역권도 반환청구권이 부정되는 대표 제한물권이다."},{"p":15,"q":"유치권은 점유를 성립요건으로 하므로 점유 상실 시 유치권도 원칙적으로 소멸한다.","a":"O","e":"유치권은 점유가 생명이다."},{"p":15,"q":"물권의 객체는 원칙적으로 독립한 물건이어야 하므로 물건의 구성부분에는 독립한 물권이 성립하지 않는다.","a":"O","e":"구성부분은 독립성이 없다."},{"p":15,"q":"일물일권주의상 하나의 물건 위에는 저당권이 하나만 성립할 수 있다.","a":"X","e":"같은 물건 위에 여러 저당권이 순위에 따라 병존할 수 있다."},{"p":15,"q":"같은 부동산 위에 여러 저당권이 설정되면 후순위 저당권은 무효이다.","a":"X","e":"후순위 저당권도 유효하되 순위에서 뒤질 뿐이다."},{"p":15,"q":"제한물권은 소유권의 일부 권능을 제한하지만 소유권 자체를 소멸시키는 것은 아니다.","a":"O","e":"소유권의 탄력성과 연결된다."},{"p":15,"q":"물권적 청구권의 상대방은 언제나 불법행위자이어야 한다.","a":"X","e":"현재 침해상태를 만들거나 지배하고 있는 자이면 고의·과실 없는 경우에도 상대방이 될 수 있다."},{"p":15,"q":"부동산등기에 공신력이 없다는 말은 등기를 믿고 거래한 자가 언제나 보호받지 못한다는 뜻이다.","a":"X","e":"일반적 공신력은 없지만 선의취득 유사 보호나 등기부취득시효 등 별도 제도가 있을 수 있다."},{"p":15,"q":"물권의 우선적 효력은 물권 상호간에서는 항상 소유권이 우선한다는 의미이다.","a":"X","e":"소유권과 제한물권 사이에서는 제한물권이 소유권에 우선한다."},{"p":15,"q":"물권법정주의 위반으로 물권적 효력이 부정되더라도, 그 약정이 당사자 사이 채권적 효력까지 항상 부정되는 것은 아니다.","a":"O","e":"사안에 따라 채권적 약정으로 평가될 수 있다."},{"p":16,"q":"물권변동이란 물권의 발생·변경·소멸을 말하며, 그 원인은 법률행위와 법률규정으로 나눌 수 있다.","a":"O","e":"물권변동은 권리의 득실변경이다. 법률행위에 의한 물권변동은 제186조, 법률규정에 의한 취득은 제187조 구조로 구별한다."},{"p":16,"q":"부동산에 관한 법률행위로 인한 물권의 득실변경은 원칙적으로 등기 없이도 당사자 사이에서는 효력이 발생한다.","a":"X","e":"민법 제186조는 부동산에 관한 법률행위로 인한 물권변동은 등기하여야 효력이 생긴다고 한다. 당사자 사이에서도 등기가 효력발생요건이다."},{"p":16,"q":"부동산 매매계약이 체결되면 매수인은 등기 전이라도 곧바로 소유권을 취득한다.","a":"X","e":"매매계약만으로는 채권적 효과가 발생할 뿐이고, 소유권은 소유권이전등기 시 이전된다."},{"p":16,"q":"저당권설정계약을 체결하였더라도 저당권 설정등기가 없으면 저당권은 성립하지 않는다.","a":"O","e":"저당권은 부동산물권이고 법률행위에 의한 설정이므로 제186조에 따라 설정등기가 있어야 성립한다."},{"p":16,"q":"재단법인 설립 시 출연부동산은 법인과 제3자 사이에서도 법인 성립만으로 당연히 대항할 수 있다.","a":"X","e":"설립자와 법인 사이에서는 법인 성립 등으로 귀속되지만, 법인과 제3자 사이에서는 법인 명의의 이전등기가 있어야 대항할 수 있다."},{"p":16,"q":"상속, 공용징수, 판결, 경매 기타 법률규정에 의한 부동산 물권취득은 등기를 요하지 않는다.","a":"O","e":"제187조는 법률규정에 의한 취득은 등기 없이 취득한다고 정한다."},{"p":16,"q":"제187조에 의해 등기 없이 부동산물권을 취득한 자도 그 부동산을 처분하려면 등기를 하여야 한다.","a":"O","e":"제187조 단서에 따라 취득에는 등기가 필요 없지만 등기를 하지 아니하면 처분하지 못한다."},{"p":16,"q":"민법 제187조의 경매에는 사인 간의 임의매매도 포함된다.","a":"X","e":"제187조의 경매는 국가기관이 하는 공경매를 의미한다. 민사집행법상 경매나 국세징수법상 공매가 이에 해당한다."},{"p":16,"q":"민사집행법상 경매와 국세징수법상 공매에서 매수인은 모두 대금완납 시 소유권을 취득한다.","a":"O","e":"경매부동산의 소유권 취득 시기는 경매든 공매든 매각대금 완납 시이다."},{"p":16,"q":"공용징수에서 보상금 지급 또는 공탁이 수용의 조건으로 되어 있으면, 보상금 지급·공탁 시 등기 없이 소유권을 취득할 수 있다.","a":"O","e":"수용은 법률규정에 의한 취득으로 제187조가 적용된다. 보상금 지급·공탁과 수용기일 요건을 갖추면 등기 없이 취득한다."},{"p":16,"q":"사업시행자가 수용개시일까지 재결보상금을 지급 또는 공탁하지 않아도 수용재결은 그대로 효력을 유지한다.","a":"X","e":"수용개시일까지 재결보상금을 지급 또는 공탁하지 않으면 해당 재결은 효력을 상실한다."},{"p":16,"q":"상속인은 피상속인 사망 시 등기 없이 상속부동산의 소유권을 취득한다.","a":"O","e":"상속은 제187조의 법률규정에 의한 취득이다. 상속인은 사망 시 등기 없이 소유권을 취득한다."},{"p":16,"q":"포괄유증을 받은 자는 제187조에 의해 유증부동산의 소유권을 법률상 당연히 취득한다.","a":"O","e":"포괄유증은 상속과 유사하게 포괄승계로 보아 제187조 구조가 적용된다."},{"p":16,"q":"특정유증을 받은 자는 유증받은 부동산의 소유권을 곧바로 취득하므로 진정명의회복을 원인으로 직접 이전등기를 청구할 수 있다.","a":"X","e":"특정유증자는 유증의무자에게 이행을 청구할 채권을 취득할 뿐이고, 곧바로 소유권자가 되는 것은 아니다."},{"p":16,"q":"판결에 의한 물권취득이라고 하여 모든 판결이 제187조의 판결에 해당하는 것은 아니다.","a":"O","e":"제187조의 판결은 형성판결을 의미한다. 이행판결은 단독 등기신청을 가능하게 할 뿐 등기 시 물권변동이 생긴다."},{"p":16,"q":"공유물분할판결은 형성판결로서 확정 시 물권변동이 발생할 수 있다.","a":"O","e":"공유물분할판결은 대표적인 형성판결로, 확정에 의해 물권변동이 발생하는 유형이다."},{"p":16,"q":"매매를 원인으로 소유권이전등기절차 이행을 명하는 판결이 확정되면 그때 곧바로 소유권이 이전된다.","a":"X","e":"이행판결은 승소자가 단독으로 등기신청할 수 있게 할 뿐이고, 소유권이전의 효력은 등기가 된 때 발생한다."},{"p":16,"q":"신축, 첨부, 혼동은 법률행위가 아닌 원인에 의한 물권변동의 예이다.","a":"O","e":"신축, 부합·혼화·가공, 혼동 등은 법률규정에 의한 물권변동으로 정리된다."},{"p":16,"q":"법정지상권이나 관습법상 법정지상권은 요건을 갖추면 등기 없이 성립할 수 있다.","a":"O","e":"법정지상권은 법률규정 또는 관습법에 의하여 성립하는 물권변동이므로 등기 없이 취득한다."},{"p":16,"q":"부동산 점유취득시효는 제187조의 법률규정에 의한 취득이므로 시효완성만으로 소유권을 취득한다.","a":"X","e":"점유취득시효는 제187조의 유일한 예외로, 시효완성만으로는 부족하고 등기하여야 소유권을 취득한다."},{"p":16,"q":"부동산 점유취득시효 완성자는 등기 전에는 소유권자가 아니지만 소유권이전등기청구권을 가진다.","a":"O","e":"시효완성만으로 소유권을 취득하지는 않지만, 시효완성을 원인으로 등기를 청구할 수 있다."},{"p":16,"q":"점유취득시효는 원시취득이지만 실무상 이전등기 방식으로 처리된다.","a":"O","e":"이론상 원시취득이므로 보존등기를 해야 할 듯하지만, 실무상은 이전등기를 한다고 정리한다."},{"p":16,"q":"원인행위인 매매계약이 무효·취소·해제되면 이미 이전된 소유권은 원래 소유자에게 자동 복귀한다는 것이 자료의 기본 정리이다.","a":"O","e":"물권행위의 비독자성·유인성 결과로 원인행위가 무효·취소·해제되면 물권변동의 효력이 소멸하여 소유권이 매도인에게 자동 복귀한다."},{"p":16,"q":"원인행위가 해제되어 소유권이 자동복귀한 경우, 원소유자는 현재 등기명의인에게 무효등기 말소청구 외에 진정명의회복을 원인으로 한 이전등기청구를 할 수 있다.","a":"O","e":"진정한 등기명의 회복을 위해 말소등기청구뿐 아니라 진정명의회복을 원인으로 한 이전등기청구도 허용된다."},{"p":16,"q":"무효등기 말소청구권과 진정명의회복을 원인으로 한 소유권이전등기청구권은 목적과 성질이 달라 소송물이 전혀 다르다.","a":"X","e":"두 청구는 모두 진정한 소유자의 등기명의 회복을 위한 물권적 방해배제청구로서 실질상 소송물이 동일하다고 본다."},{"p":16,"q":"무효등기 말소청구소송에서 패소확정판결을 받은 자는 같은 등기에 관해 진정명의회복 이전등기청구소송을 다시 제기해도 기판력에 저촉될 수 있다.","a":"O","e":"말소청구와 진정명의회복 이전등기청구는 실질상 동일 목적이므로 전소 확정판결의 기판력이 미친다."},{"p":16,"q":"자기 앞으로 소유권등기가 없고 법률상 소유권 취득도 하지 않은 자가 소유자를 대위할 수 있을 뿐인 경우에도 진정명의회복 이전등기를 직접 청구할 수 있다.","a":"X","e":"그런 자는 소유자를 대위하여 말소를 청구할 수 있을 뿐, 진정명의회복을 원인으로 한 소유권이전등기를 직접 구할 수 없다."},{"p":16,"q":"소멸시효 완성으로 용익물권이 소멸하는 경우에는 등기 없이 소멸한다.","a":"O","e":"소멸시효 완성으로 인한 용익물권 소멸은 법률규정에 따른 소멸로 등기 없이 효력이 생긴다."},{"p":16,"q":"지상권 또는 전세권의 소멸청구에 의한 소멸은 등기하여야만 소멸의 효력이 발생한다.","a":"X","e":"지상권·전세권의 소멸청구는 법률규정에 따른 소멸로 등기 없이 소멸한다."},{"p":16,"q":"전세권의 소멸통고가 상대방에게 도달한 후 6개월이 지나면 전세권은 등기 없이 소멸한다.","a":"O","e":"전세권 소멸통고는 도달 후 6개월 경과로 전세권이 소멸하고, 등기는 효력요건이 아니다."},{"p":16,"q":"부동산 물권의 포기는 물권적 단독행위이므로 등기 없이 효력이 발생한다.","a":"X","e":"부동산 물권의 포기는 법률행위에 의한 물권변동이므로 제186조에 따라 등기해야 효력이 발생한다."},{"p":16,"q":"무허가건물 신축은 법률행위에 의하지 않은 물권취득이므로 신축자가 등기 없이 소유권을 원시취득한다.","a":"O","e":"무허가 여부와 별개로 건물 신축은 원시취득이고, 등기 없이 신축자가 소유권을 취득한다."},{"p":16,"q":"미완성 건물이 사회통념상 독립한 건물의 형태와 구조를 갖추면, 이를 매도하고 건축주 명의변경까지 마쳤더라도 원래 건축주가 원시취득할 수 있다.","a":"O","e":"독립한 건물로 볼 수 있는 단계에 이르면 원시취득자가 문제된다. 건축주 명의변경만으로 소유권자가 결정되는 것은 아니다."},{"p":16,"q":"건축허가서는 건물에 관한 실체적 권리변동의 공시방법이며 소유권 추정력도 있다.","a":"X","e":"건축허가서는 권리득실변경의 공시방법이 아니고 추정력도 없다."},{"p":16,"q":"타인의 대지를 매수한 건축업자가 대금을 지급하지 않은 채 자기 노력과 재료로 건물을 지은 경우, 건축허가명의가 대지소유자라도 원칙적으로 건축자가 원시취득한다.","a":"O","e":"건축허가명의는 소유권 추정력이 없으므로, 자기 노력과 재료로 건축한 자가 일단 원시취득한다."},{"p":16,"q":"도급에서 수급인이 자기 노력과 재료로 건물을 완성한 경우라도, 도급인에게 소유권을 귀속시키기로 합의했다면 도급인이 원시취득할 수 있다.","a":"O","e":"도급인 명의 허가·보존등기 등 완성건물 소유권을 도급인에게 귀속시키기로 한 합의가 있으면 도급인이 원시취득한다."},{"p":16,"q":"공시의 원칙이란 배타적·절대적 지배권인 물권변동의 내용을 외부에서 알 수 있는 표상으로 나타내야 한다는 원칙이다.","a":"O","e":"물권은 대세효가 있으므로 거래안전을 위해 등기·점유 등 공시방법을 요구한다."},{"p":16,"q":"부동산 물권변동의 공시방법은 점유이고, 동산 물권변동의 공시방법은 등기이다.","a":"X","e":"부동산은 등기, 동산은 인도·점유가 공시방법이다."},{"p":16,"q":"부동산 등기에는 공신의 원칙이 인정되므로 무효등기를 신뢰하고 거래한 선의자는 부동산소유권을 선의취득할 수 있다.","a":"X","e":"우리 민법상 부동산 등기에는 공신력이 인정되지 않는다. 따라서 부동산 선의취득은 불가능하다."},{"p":16,"q":"동산은 점유에 공신력이 인정되어 일정 요건하에 선의취득이 가능하다.","a":"O","e":"동산은 점유를 공시방법으로 하고 공신의 원칙이 적용되어 선의취득제도가 인정된다."},{"p":16,"q":"등기서류 위조로 무권리자 앞으로 등기가 된 뒤 그 무권리자로부터 등기를 넘겨받은 선의의 제3자는 부동산 소유권을 취득한다.","a":"X","e":"부동산 등기의 공신력이 부정되므로 무효등기를 믿은 선의자도 권리를 취득하지 못한다."},{"p":16,"q":"자료는 물권행위를 원인행위와 분리하지 않고, 원인행위가 무효·취소·해제되면 물권변동 효력도 소멸한다고 정리한다.","a":"O","e":"자료는 물권행위의 비독자성과 유인성을 전제로 설명한다."},{"p":16,"q":"물권행위의 무인성을 전제로 하면 원인행위가 무효라도 물권변동은 언제나 유효하게 남는다.","a":"X","e":"자료 기준은 유인성이다. 원인행위가 무효·취소·해제되면 물권변동도 영향을 받는다."},{"p":16,"q":"등기의 유효성은 실체권리관계와 등기내용의 일치가 핵심 기준이 된다.","a":"O","e":"등기와 실체관계가 일치하면 강하게 보호되지만, 불일치하면 공신력이 없으므로 무효등기를 신뢰한 자는 보호되지 않는다."},{"p":16,"q":"적법하게 이루어진 물권등기가 원인 없이 말소되면 그 물권은 말소와 동시에 소멸한다.","a":"X","e":"등기는 효력발생요건이지 효력존속요건이 아니므로 원인 없는 말소만으로 물권은 소멸하지 않는다."},{"p":16,"q":"저당권등기가 원인 없이 말소되어도 저당권은 소멸하지 않을 수 있다.","a":"O","e":"불법말소가 있어도 등기는 존속요건이 아니므로 실체권리는 그대로 남는다."},{"p":16,"q":"원인 없이 말소된 등기의 회복등기청구 상대방은 말소 당시의 소유명의인이고, 말소 후 등기명의 취득자는 이해관계 있는 제3자로 승낙의무를 부담할 수 있다.","a":"O","e":"말소회복등기청구 상대방과 말소 후 취득자의 승낙의무를 구별한다."},{"p":16,"q":"원인 없이 말소된 저당권등기 후 후순위저당권 실행경매로 제3자가 경락받은 경우, 선순위 저당권자는 언제나 말소회복등기를 청구할 수 있다.","a":"X","e":"후순위 저당권 실행경매로 경락이 된 경우에는 말소회복등기를 청구할 수 없고 배당받을 수 있었던 금액에 관한 부당이득반환청구만 문제된다."},{"p":16,"q":"등기된 권리의 양이 합의된 권리보다 큰 경우에도 등기 전부가 언제나 무효가 되는 것은 아니다.","a":"O","e":"합의 2억, 등기 3억이라면 실체권리인 2억 범위에서는 공시되어 있으므로 그 범위 내 유효로 정리한다."},{"p":16,"q":"합의된 저당권이 2억인데 등기가 3억으로 된 경우, 3억 전부가 유효하다.","a":"X","e":"실체권리관계는 2억이므로 2억 범위에서만 유효하다."},{"p":16,"q":"합의된 권리가 4억인데 등기가 3억으로 된 경우, 공시된 3억 범위에서 유효로 볼 수 있다.","a":"O","e":"권리가 모두 공시되지는 않았지만 일부무효 법리에 따라 등기 범위 내에서 유효로 할 수 있다."},{"p":16,"q":"표시의 불일치에서는 등기순서보다 실체 내용과 일치하는 등기가 유효한지가 중요하다.","a":"O","e":"실제 부동산 표시와 일치하는 등기가 유효하다. 단순히 먼저 된 등기라는 이유만으로 항상 유효한 것은 아니다."},{"p":16,"q":"동일 부동산에 동일인 명의로 이중의 소유권보존등기가 된 경우, 먼저 된 보존등기가 유효하고 뒤의 보존등기는 무효이다.","a":"O","e":"동일인 명의 이중보존등기는 선등기 유효, 후등기 무효로 정리한다."},{"p":16,"q":"동일인 명의의 뒤 보존등기에 터 잡아 이루어진 제3자 명의의 등기는 유효하다.","a":"X","e":"뒤 보존등기가 무효이면 그에 터 잡은 제3자 명의 등기도 무효가 된다."},{"p":16,"q":"등기명의인이 다른 이중소유권보존등기의 경우, 먼저 이루어진 보존등기가 원인무효가 아닌 한 뒤 보존등기는 무효이다.","a":"O","e":"1부동산 1등기기록주의상 선보존등기가 원인무효가 아닌 한 후보존등기는 실체관계 부합 여부와 무관하게 무효이다."},{"p":16,"q":"뒤에 된 보존등기가 실체권리관계에 부합하면, 먼저 된 보존등기가 원인무효가 아니더라도 뒤 보존등기는 유효하다.","a":"X","e":"먼저 된 보존등기가 원인무효가 아닌 한 뒤 보존등기는 실체관계 부합 여부를 따질 필요 없이 무효이다."},{"p":16,"q":"이중으로 경료되어 무효인 소유권보존등기나 이에 터 잡은 이전등기는 등기부취득시효의 기초가 될 수 없다.","a":"O","e":"1부동산 1등기기록 원칙에 위배되는 무효등기는 등기부취득시효의 기초가 될 수 없다."},{"p":16,"q":"중간생략등기는 최초양도인에서 중간자를 거쳐 최종양수인에게 전매되었는데 중간자 명의 등기를 생략하고 최초양도인에서 최종양수인으로 바로 하는 등기이다.","a":"O","e":"중간자의 등기를 생략하는 등기를 말한다."},{"p":16,"q":"중간생략등기가 이미 경료된 경우 3자 합의가 있으면 그 등기는 유효할 수 있다.","a":"O","e":"이미 경료된 중간생략등기는 3자 합의가 있으면 유효하다."},{"p":16,"q":"중간생략등기가 이미 경료되었더라도 3자 합의가 없으면 실체권리관계에 부합하더라도 항상 무효이다.","a":"X","e":"이미 경료된 중간생략등기는 3자 합의가 없더라도 실체권리관계와 부합하면 유효하다."},{"p":16,"q":"토지거래허가구역에서 허가규정을 잠탈할 목적으로 이루어진 중간생략등기는 3자 합의가 있어도 무효이다.","a":"O","e":"일반 중간생략등기와 달리 토지거래허가규정 잠탈 목적이면 3자 합의가 있어도 무효이다."},{"p":16,"q":"중간생략등기가 아직 경료되지 않은 경우 최종양수인이 최초양도인에게 직접 이전등기를 청구하려면 원칙적으로 3자 간 합의가 필요하다.","a":"O","e":"최종양수인의 직접청구에는 최초양도인·중간자·최종양수인 사이의 합의가 필요하다."},{"p":16,"q":"중간생략등기에 관한 3자 합의가 없으면 최종양수인은 최초양도인에게 직접 소유권이전등기를 청구할 수 없다.","a":"O","e":"3자 합의가 없으면 최종양수인은 중간자를 대위하여 순차등기를 구할 수 있을 뿐 직접 청구는 불가능하다."},{"p":16,"q":"중간생략등기에 관한 3자 합의가 있으면 최종양수인은 직접 이전등기를 청구할 수도 있고 순차 이전등기를 청구할 수도 있다.","a":"O","e":"3자 합의가 법률행위 자체를 소멸시키는 것은 아니므로 직접청구와 순차청구 구조가 모두 가능하다."},{"p":16,"q":"중간생략등기 합의가 있으면 중간매수인의 소유권이전등기청구권과 매도인의 이전등기의무는 당연히 소멸한다.","a":"X","e":"3자 합의는 매매계약 자체에 영향을 미치지 않으므로 중간매수인의 권리와 매도인의 의무가 당연히 소멸하지 않는다."},{"p":16,"q":"중간생략등기 합의가 있어도 최초매도인은 중간매수인에 대한 매매대금청구권을 행사할 수 있다.","a":"O","e":"3자 합의가 최초매도인의 중간자에 대한 대금청구권 행사를 제한하지 않는다."},{"p":16,"q":"3자 합의 후 최초매도인과 중간매수인이 매매대금을 증액한 경우, 최초매도인은 증액대금 미지급을 이유로 최종매수인 명의 이전등기를 거절할 수 있다.","a":"O","e":"3자 합의 후 갑·을 간 대금증액합의가 있으면 증액대금 미지급을 이유로 병의 이전등기청구를 거절할 수 있다."},{"p":16,"q":"중간생략등기 합의는 반드시 3자가 한자리에서 동시에 해야 하고 순차적으로는 할 수 없다.","a":"X","e":"3자 합의는 동시에 할 수도 있고 순차적으로 할 수도 있다."},{"p":16,"q":"매매로 인한 소유권이전등기청구권은 통상의 채권처럼 양도인의 통지만으로 항상 채무자에게 대항할 수 있다.","a":"X","e":"소유권이전등기청구권은 성질상 양도가 제한되어 채무자의 승낙이나 동의가 있어야 대항할 수 있다."},{"p":16,"q":"최종매수인이 최초매도인에게 직접 등기청구를 하려면 중간매수인과 최종매수인 사이의 합의만으로는 부족하다.","a":"O","e":"갑·병 사이를 포함한 3자 합의가 필요하다."},{"p":16,"q":"무효등기의 유용이란 무효인 등기 후 그 등기에 부합하는 실체관계가 생겼을 때 기존 등기를 이용하는 것을 말한다.","a":"O","e":"실체관계에 맞지 않아 무효였던 등기를 나중에 생긴 실체관계에 맞추어 이용하는 것이 무효등기 유용이다."},{"p":16,"q":"유용합의 이전에 등기부상 이해관계를 가진 제3자가 있으면 무효등기의 유용은 제한된다.","a":"O","e":"무효등기의 유용은 유용합의 이전에 등기부상 이해관계를 가진 제3자가 없는 경우 가능하다."},{"p":16,"q":"무효등기의 유용 합의가 있으면 그 등기는 처음부터 소급하여 유효한 등기가 된다.","a":"X","e":"유용합의가 있어도 그 등기가 소급하여 유효로 되는 것은 아니다."},{"p":16,"q":"멸실된 건물의 등기부를 이용하여 신축건물의 물권변동 등기를 하는 것은 두 건물이 위치 등에서 유사하면 항상 유효하다.","a":"X","e":"멸실건물과 신축건물은 동일 건물이 아니므로 신축건물 물권변동을 멸실건물 등기부에 등재해도 무효이다."},{"p":16,"q":"무효등기의 유용에 관한 합의나 추인은 명시적으로만 가능하고 묵시적으로는 불가능하다.","a":"X","e":"무효등기 유용에 관한 합의 또는 추인은 묵시적으로도 가능하다."},{"p":16,"q":"가등기는 장래 본등기를 하기 위한 순위보전 수단이다.","a":"O","e":"가등기는 소유권이전등기청구권 등 본등기청구권의 순위를 보전하기 위한 등기이다."},{"p":16,"q":"본등기 전의 가등기 자체에는 원칙적으로 실체법상 권리변동 효력이 없다.","a":"O","e":"가등기 자체만으로 물권변동이 생기거나 실체법상 권리를 취득하는 것은 아니다."},{"p":16,"q":"소유권이전청구권 보전을 위한 가등기가 있으면 그 청구권의 원인이 되는 법률관계가 존재한다고 추정된다.","a":"X","e":"가등기가 되어 있어도 당사자 사이에 어떤 법률관계가 존재한다고 추정되지는 않는다."},{"p":16,"q":"가등기권리자는 가등기만으로 가등기 후 본등기를 취득한 제3자에게 대항할 수 있다.","a":"X","e":"본등기 전에는 가등기 자체만으로 실체법상 효력이 없어 제3자에게 대항할 수 없다."},{"p":16,"q":"가등기에 기한 본등기를 명하는 판결이 확정되어도 본등기를 마치기 전까지는 가등기 자체만으로 중간처분등기의 말소를 청구할 수 없다.","a":"O","e":"본등기를 경료하기 전에는 가등기 자체의 실체법상 효력이 없으므로 중간처분등기 말소청구권이 없다."},{"p":16,"q":"가등기에 기한 본등기가 없는 한 가등기의무자는 여전히 자기 권리를 처분할 수 있고 그 처분에 따른 등기도 유효할 수 있다.","a":"O","e":"가등기 자체가 처분금지 효력을 갖는 것은 아니다."},{"p":16,"q":"가등기가 원인 없이 말소된 경우 가등기권리자도 그 말소회복을 청구할 수 있다.","a":"O","e":"가등기 자체에 실체법상 효력은 없지만 원인 없는 말소에 대해서는 회복청구권이 인정된다."},{"p":16,"q":"가등기에 기한 본등기가 경료되면 권리변동의 효력은 가등기 시에 소급하여 발생한다.","a":"X","e":"권리변동의 효력은 본등기 시 발생한다. 다만 순위는 가등기 순위에 따른다."},{"p":16,"q":"가등기에 기한 본등기가 경료된 경우 그 본등기의 순위는 가등기의 순위에 의한다.","a":"O","e":"가등기의 핵심효과는 본등기 시 순위보전효이다."},{"p":16,"q":"가등기 후 제3자 명의의 중간처분등기가 경료된 경우, 그 제3자는 중간처분등기 내용에 따라 일단 유효하게 권리를 취득할 수 있다.","a":"O","e":"가등기만으로 처분이 금지되는 것은 아니므로 중간처분등기는 일단 유효하다."},{"p":16,"q":"가등기권리자가 본등기를 청구하려면 가등기 후 소유권을 취득한 제3자를 상대로 본등기를 청구하여야 한다.","a":"X","e":"소유권이전등기청구권 가등기의 경우 청구 당시 소유자인 제3자가 아니라 가등기의무자인 전소유자를 상대로 본등기를 청구한다."},{"p":16,"q":"소유권이전청구권 가등기에 기한 본등기가 되면, 가등기 이후의 보존가치 없는 중간처분등기는 등기관이 직권말소한다.","a":"O","e":"가등기 순위보전효에 의해 본등기 후 보존가치 없는 중간처분등기는 직권말소된다."},{"p":16,"q":"가등기권리자는 본등기 후 중간처분등기 명의자에게 반드시 무효등기말소청구소송을 제기해야 한다.","a":"X","e":"보존가치 없는 중간처분등기는 직권말소되므로 가등기권리자가 말소청구를 할 필요가 없다."},{"p":16,"q":"가등기에 기한 본등기로 소유권을 잃은 중간매수인은 양도인을 상대로 담보책임을 물을 수 있다.","a":"O","e":"가등기의 본등기로 권리를 상실한 제3자는 양도인에게 담보책임을 물을 수 있다."},{"p":16,"q":"저당권설정등기청구권 가등기 후 제3자 저당권설정등기가 된 경우, 가등기권자의 저당권 본등기가 이루어지면 제3자 저당권등기는 반드시 말소된다.","a":"X","e":"저당권설정등기청구권 가등기 후 제3자 저당권등기는 본등기가 되어도 말소할 필요가 없다."},{"p":16,"q":"가등기에 기한 본등기청구권은 재산권으로서 양도 가능하고, 그 처분은 가등기에 대한 부기등기 형식으로 공시한다.","a":"O","e":"가등기권자는 본등기청구권을 처분할 수 있고 부기등기로 공시한다."},{"p":16,"q":"본등기에는 대항력, 권리변동 효력, 순위확정력, 추정력, 후등기 저지력, 점유적 효력 등이 문제된다.","a":"O","e":"본등기의 효력으로 여러 효력을 정리한다."},{"p":16,"q":"부동산등기의 추정력은 등기명의인이 적법한 권리자로 추정되어 상대방에게 반대사실 입증책임을 지우는 효과가 있다.","a":"O","e":"등기명의인이 등기부를 제출하면 적법한 권리자로 추정되고 상대방이 무권리 등을 입증해야 한다."},{"p":16,"q":"등기의 추정력은 권리에만 미치고 절차, 대리권, 등기원인에는 전혀 미치지 않는다.","a":"X","e":"절차, 대리권, 권리, 원인 등에도 추정력이 문제된다."},{"p":16,"q":"사망한 등기의무자로부터 경료된 등기라도 사망 전에 등기원인이 이미 존재하는 사정이 있으면 적법하게 경료된 것으로 추정될 수 있다.","a":"O","e":"등기의무자 사망 전에 등기원인이 존재했다면 사망 후 경료 형식만으로 추정력이 부정되지는 않는다."},{"p":16,"q":"등기명의자가 등기부 기재 원인과 다른 적법한 취득원인을 주장한다는 사정만으로 등기의 추정력이 곧바로 깨진다.","a":"X","e":"등기원인행위의 태양이나 과정을 다소 다르게 주장한다고 해서 추정력이 곧바로 깨지지는 않는다."},{"p":16,"q":"멸실회복등기가 일단 경료되면 특별한 사정이 없는 한 등기관이 적법하게 처리한 것으로 추정된다.","a":"O","e":"멸실회복등기의 적법처리 추정을 인정한다."},{"p":16,"q":"임의경매절차에서 등기부 기재를 믿고 경락받아 점유한 경우, 경락인의 점유는 무과실 점유로 볼 수 있다.","a":"O","e":"등기 추정력의 부수효로 등기 신뢰 거래자의 무과실 추정이 문제된다."},{"p":16,"q":"허무인으로부터 이어받은 소유권이전등기도 등기의 추정력에 의해 권리추정이 유지된다.","a":"X","e":"허무인으로부터 등기를 이어받은 등기는 원인무효로서 소유권추정이 깨진다."},{"p":16,"q":"소유권이전등기의 원인계약서가 진정하지 않은 것으로 증명되면 등기의 적법추정은 복멸될 수 있다.","a":"O","e":"등기원인 서류가 진정하지 않음이 증명되면 추정력이 깨진다."},{"p":16,"q":"사망자 명의의 등기신청에 의해 경료된 등기는 원칙적으로 원인무효로서 등기의 추정력을 인정할 여지가 없다.","a":"O","e":"사망자 명의 신청등기는 원인무효 등기로 보아 추정력이 인정되지 않는다."},{"p":16,"q":"공유지분등기에서 분자의 합계가 분모를 초과해도 각 등기명의자는 분모 기준 지분비율로 적법한 공유자로 추정된다.","a":"X","e":"분자 합계가 분모를 초과하면 등기부 기재 자체로 부실이 명백하여 그 비율대로 공유한다고 추정할 수 없다."},{"p":16,"q":"근저당권의 경우 근저당권 설정등기만 있으면 피담보채권의 성립도 항상 추정된다.","a":"X","e":"근저당권은 별도로 피담보채권을 성립시키는 법률행위가 있어야 하며, 그 존재는 주장하는 측이 입증해야 한다."},{"p":16,"q":"등기를 신뢰하고 거래한 제3자는 등기의 추정력 때문에 과실이 없는 것으로 추정될 수 있다.","a":"O","e":"등기 추정력의 부수효로 무과실 추정이 인정될 수 있다."},{"p":16,"q":"부동산물권 취득자는 등기의 추정력에 의해 등기내용을 알고 있었던 것으로 추정될 수 있다.","a":"O","e":"부동산물권 취득자가 등기내용에 관해 악의로 추정된다."},{"p":16,"q":"신축건물의 소유권보존등기를 건물 완성 전에 했더라도 그 후 건물이 완성되면 그 등기를 당연무효로 볼 수 없다.","a":"O","e":"건물 완성 전 보존등기라도 이후 완성되면 무효로 볼 수 없다."},{"p":16,"q":"미등기건물은 원시취득자 앞으로 보존등기를 한 뒤 양수인 앞으로 이전등기하는 것이 원칙이다.","a":"O","e":"미등기건물 등기는 원시취득자 보존등기 후 승계취득자 이전등기가 원칙이다."},{"p":16,"q":"원시취득자와 승계취득자의 합치된 의사에 따라 승계취득자 앞으로 직접 소유권보존등기를 한 경우, 실체관계에 부합하면 유효할 수 있다.","a":"O","e":"합치된 의사와 실체관계 부합이 있으면 승계취득자 직접 보존등기도 적법한 등기로 본다."},{"p":16,"q":"당해 토지를 사정받은 사람이 따로 있음이 밝혀져도 보존등기의 추정력은 절대적으로 유지된다.","a":"X","e":"사정받은 사람이 따로 있음이 밝혀지면 보존등기의 추정력은 번복된다."},{"p":16,"q":"건물보존등기명의자 이외의 자가 건물을 신축한 사실이 드러나면 보존등기의 권리추정력은 깨어질 수 있다.","a":"O","e":"건물 소유권은 신축자가 원시취득하므로 등기명의자가 신축자가 아니면 추정력이 번복된다."},{"p":16,"q":"건물보존등기명의자가 신축자가 아님이 드러나면 등기명의자가 적법하게 소유권을 취득한 사실을 입증해야 한다.","a":"O","e":"보존등기의 추정력이 깨지면 등기명의자가 권리취득 사실을 입증해야 한다."},{"p":16,"q":"보존등기명의자가 전소유자로부터 양도받았다고 주장하는데 전소유자가 양도사실을 부인하면 보존등기의 추정력이 깨어질 수 있다.","a":"O","e":"전소유자가 양도사실을 부인하는 경우 보존등기명의자가 양수사실을 입증해야 한다."},{"p":16,"q":"등기청구권은 등기권리자가 등기의무자에게 등기신청절차에 협력할 것을 청구하는 실체법상 권리이다.","a":"O","e":"등기청구권은 단순 절차상 권리가 아니라 실체법상의 청구권으로 이해된다."},{"p":16,"q":"법률행위에 기한 등기권리자의 등기의무자에 대한 등기청구권은 원칙적으로 채권적 청구권이다.","a":"O","e":"매매, 제한물권 설정계약 등 법률행위에 기한 등기청구권은 채권적 청구권이다."},{"p":16,"q":"부동산 매수인의 소유권이전등기청구권은 원칙적으로 물권적 청구권이므로 소멸시효에 걸리지 않는다.","a":"X","e":"부동산 매수인의 이전등기청구권은 채권적 청구권으로 원칙적으로 10년의 소멸시효에 걸린다."},{"p":16,"q":"지상권·전세권·저당권 등 제한물권 설정계약 후 행사하는 설정등기청구권은 채권적 청구권이다.","a":"O","e":"설정계약만으로 제한물권이 성립하지 않고 등기청구권은 채권적 성질이다."},{"p":16,"q":"취득시효 완성으로 인한 소유권이전등기청구권도 채권적 청구권으로 정리된다.","a":"O","e":"시효완성만으로는 등기를 해야 하므로 등기청구권이 발생하며, 채권적 청구권 목록에 둔다."},{"p":16,"q":"부동산임차권 등기청구권, 환매권 등기청구권, 가등기에 대한 본등기청구권도 채권적 청구권의 예로 정리된다.","a":"O","e":"이들을 채권적 등기청구권 예시로 든다."},{"p":16,"q":"부동산 매수인이 목적물을 인도받아 점유하고 있는 경우, 그 소유권이전등기청구권은 소멸시효가 진행하지 않는다고 본다.","a":"O","e":"인도받아 점유하는 것은 권리행사 상태로 보아 이전등기청구권의 소멸시효가 진행하지 않는다."},{"p":16,"q":"매수인이 점유하던 부동산을 제3자에게 양도하여 더 이상 점유하지 않게 되면, 매도인에 대한 등기청구권은 즉시 소멸시효가 진행한다.","a":"X","e":"매수인이 제3자에게 양도한 경우에도 더 적극적 권리행사로 보아 등기청구권이 소멸시효에 걸리지 않는다."},{"p":16,"q":"무효등기 말소청구권은 소유권에 기한 물권적 청구권으로서 그 자체는 소멸시효에 걸리지 않는다.","a":"O","e":"실체권리와 등기내용을 일치시키기 위한 방해제거청구권 성질이다."},{"p":16,"q":"진정명의회복을 원인으로 한 소유권이전등기청구권은 실질적으로 무효등기 말소청구와 같은 물권적 청구권 성질을 가진다.","a":"O","e":"형식은 이전등기청구지만 실질은 진정소유자의 등기명의 회복을 위한 방해배제청구이다."},{"p":16,"q":"저당권의 피담보채권 소멸을 이유로 현재 소유자인 양수인이 말소등기를 청구하는 것은 물권적 청구권이다.","a":"O","e":"현재 소유자는 자기 소유권 방해 제거로서 말소를 구하는 것이므로 물권적 청구권이다."},{"p":16,"q":"저당권 설정자인 전 소유자가 피담보채권 소멸을 이유로 말소등기를 청구하는 경우도 언제나 물권적 청구권이다.","a":"X","e":"담보권 설정자인 전 소유자가 청구하는 경우에는 채권적 청구권으로 정리한다."},{"p":16,"q":"제186조는 법률행위로 인한 부동산물권변동, 제187조는 법률규정에 의한 부동산물권취득을 규율한다.","a":"O","e":"두 조문 구별이 부동산 물권변동의 핵심이다."},{"p":16,"q":"상속으로 취득한 부동산을 제3자에게 매도하여 이전등기하려면 상속등기 없이도 바로 제3자에게 처분등기를 할 수 있다.","a":"X","e":"제187조 단서상 등기 없이 취득하더라도 처분하려면 먼저 취득자의 등기가 필요하다."},{"p":16,"q":"공유물분할판결은 형성판결이지만 매매를 원인으로 한 이전등기 이행판결은 형성판결이 아니다.","a":"O","e":"공유물분할판결과 이행판결을 구별해야 한다."},{"p":16,"q":"부동산 등기에는 공신력은 없지만 추정력은 인정될 수 있다.","a":"O","e":"공신력 부정과 추정력 인정은 별개의 문제다."},{"p":16,"q":"등기 추정력은 부동산 선의취득을 인정하는 근거가 된다.","a":"X","e":"등기 추정력은 입증책임 전환 등 효과일 뿐 공신력을 의미하지 않는다. 부동산 선의취득은 인정되지 않는다."},{"p":16,"q":"가등기와 본등기의 차이는 본등기 전에는 실체권리변동이 없고, 본등기 후에는 순위가 가등기로 올라간다는 데 있다.","a":"O","e":"가등기의 핵심은 순위보전이지 본등기 전 권리취득이 아니다."},{"p":16,"q":"중간생략등기와 가등기 모두 실체권리관계와 등기내용의 일치 여부가 중요하지만, 토지거래허가 잠탈 목적은 별도 무효 사유가 된다.","a":"O","e":"일반적인 실체관계 부합 원칙과 달리 토지거래허가 잠탈 목적은 강행규정 회피로 무효가 된다."},{"p":16,"q":"물권변동 파트에서는 '등기가 있으면 항상 권리취득'이 아니라 '등기와 실체관계가 일치하는지'를 보아야 한다.","a":"O","e":"등기에는 공신력이 없으므로 등기만으로 권리취득을 단정하면 안 된다."},{"p":16,"q":"등기청구권은 언제나 물권적 청구권이므로 10년 소멸시효가 문제되지 않는다.","a":"X","e":"법률행위에 기한 등기청구권은 원칙적으로 채권적 청구권으로 10년 시효가 문제된다."},{"p":16,"q":"부동산 물권변동에서는 '취득에는 등기 불요, 처분에는 등기 필요'라는 제187조 단서가 반복 출제 포인트다.","a":"O","e":"상속·경매 등은 취득 등기 불요, 처분 등기 필요라는 단서가 자주 나온다."},{"p":17,"q":"법률행위로 인한 동산 물권변동은 원칙적으로 물권적 합의만 있으면 되고 인도는 필요하지 않다.","a":"X","e":"동산 물권의 양도는 인도하여야 효력이 생긴다. 물권적 합의만으로는 부족하다."},{"p":17,"q":"동산 물권변동의 공시방법은 원칙적으로 점유이고, 부동산 물권변동의 공시방법은 등기이다.","a":"O","e":"동산은 점유, 부동산은 등기가 공시방법이다."},{"p":17,"q":"동산 물권변동은 권리자로부터의 취득과 무권리자로부터의 취득으로 나눌 수 있다.","a":"O","e":"권리자로부터의 양도는 일반 양도이고, 무권리자로부터의 취득은 선의취득 문제가 된다."},{"p":17,"q":"동산의 선의취득은 법률행위를 매개로 하지만, 물권취득 효과는 법률규정에 의하여 발생한다.","a":"O","e":"매매 등 거래행위는 매개일 뿐이고, 취득 효과는 제249조의 법률규정에서 생긴다."},{"p":17,"q":"동산의 취득시효, 선점, 습득, 발견, 첨부는 법률규정에 의한 물권변동의 예이다.","a":"O","e":"법률행위가 아니라 법률규정에 의해 물권변동이 발생한다."},{"p":17,"q":"동산에 관한 물권의 양도에서 현실인도만 민법상 인도이고, 간이인도는 인도로 인정되지 않는다.","a":"X","e":"민법은 현실인도 외에 간이인도, 점유개정, 목적물반환청구권 양도를 인도방법으로 인정한다."},{"p":17,"q":"양수인이 이미 그 동산을 점유하고 있는 때에는 당사자의 의사표시만으로 동산 물권양도의 효력이 생긴다.","a":"O","e":"간이인도이다. 이미 양수인이 점유하므로 따로 현실인도가 필요 없다."},{"p":17,"q":"간이인도는 양도인이 계속 점유하고 양수인은 간접점유를 취득하는 방식이다.","a":"X","e":"그 설명은 점유개정이다. 간이인도는 양수인이 이미 점유 중인 경우이다."},{"p":17,"q":"점유개정은 동산 양도인이 양도 후에도 당사자 계약으로 그 동산의 점유를 계속하는 경우를 말한다.","a":"O","e":"양도인이 직접점유를 계속하고 양수인이 간접점유를 취득하는 관념적 인도방법이다."},{"p":17,"q":"점유개정이 있으면 양수인이 인도받은 것으로 본다.","a":"O","e":"제189조상 인도받은 것으로 본다. 다만 선의취득에서는 별도 함정이 있다."},{"p":17,"q":"제3자가 점유하는 동산을 양도할 때 양도인이 제3자에 대한 반환청구권을 양수인에게 양도하면 인도한 것으로 본다.","a":"O","e":"목적물반환청구권의 양도이다."},{"p":17,"q":"목적물반환청구권의 양도는 제3자가 점유하고 있는 동산에 관한 물권양도에서 인정되는 인도방법이다.","a":"O","e":"양도인이 제3자에게 가진 반환청구권을 넘기는 방식이다."},{"p":17,"q":"동산 물권양도에서 인도는 단순한 대항요건에 불과하다.","a":"X","e":"제188조상 인도는 동산 물권양도의 효력발생요건이다."},{"p":17,"q":"동산 물권양도에서 인도가 없으면 당사자 사이에서도 물권변동의 효력이 발생하지 않는다.","a":"O","e":"인도는 제3자 대항요건이 아니라 물권변동의 성립요건이다."},{"p":17,"q":"동산의 물권양도에서 점유개정은 언제나 현실인도보다 강한 공시방법이다.","a":"X","e":"점유개정은 관념적 인도라 외부 공시력이 약하다. 특히 선의취득에서 제한된다."},{"p":17,"q":"선의취득은 양도인이 정당한 소유자가 아니더라도 일정한 요건 아래 양수인이 소유권을 취득하는 제도이다.","a":"O","e":"동산거래의 안전을 보호하기 위한 제도이다."},{"p":17,"q":"선의취득으로 취득하는 권리는 동산에 대한 소유권 또는 질권이다.","a":"O","e":"제249조는 동산 소유권 취득을 규정하고, 질권에도 적용된다."},{"p":17,"q":"부동산도 점유를 이전받으면 선의취득의 대상이 될 수 있다.","a":"X","e":"부동산은 등기에 공신력이 없으므로 선의취득이 인정되지 않는다."},{"p":17,"q":"등기부상 소유자로 믿고 부동산을 매수한 자는 선의·무과실이면 부동산 소유권을 선의취득한다.","a":"X","e":"부동산 등기에는 공신력이 없으므로 무효등기를 믿은 자는 보호되지 않는다."},{"p":17,"q":"동산 선의취득은 원시취득이다.","a":"O","e":"양도인의 권리를 승계하는 것이 아니라 법률규정에 따라 새로 취득한다."},{"p":17,"q":"선의취득자는 양도인의 권리를 승계취득하므로 양도인에게 붙어 있던 항변도 당연히 승계한다.","a":"X","e":"선의취득은 원시취득이다. 승계취득이라는 설명이 틀렸다."},{"p":17,"q":"선의취득이 성립하면 양수인은 즉시 소유권을 취득한다.","a":"O","e":"제249조는 요건을 갖추면 즉시 소유권을 취득한다고 규정한다."},{"p":17,"q":"선의취득은 거래행위 없이 단순히 동산을 주운 경우에도 인정된다.","a":"X","e":"선의취득은 평온·공연하게 동산을 양수하는 거래행위를 전제로 한다. 주운 물건은 습득·유실물법 문제가 된다."},{"p":17,"q":"상속으로 동산을 취득한 경우에도 상속인이 선의·무과실이면 선의취득이 성립한다.","a":"X","e":"상속은 포괄승계이고 거래행위에 의한 양수가 아니므로 선의취득의 전형적 대상이 아니다."},{"p":17,"q":"경매나 공매와 같이 거래에 의한 취득도 일정 요건 아래 선의취득의 기초가 될 수 있다.","a":"O","e":"양수의 외형과 거래안전 보호 필요성이 있으면 선의취득 문제가 될 수 있다."},{"p":17,"q":"선의취득이 성립하려면 양도인이 정당한 소유자여야 한다.","a":"X","e":"오히려 양도인이 무권리자인 경우를 전제로 한다. 양도인이 소유자이면 일반 승계취득이다."},{"p":17,"q":"양도인이 정당한 소유자인 경우에는 선의취득이 아니라 일반적인 동산 물권양도에 의해 취득한다.","a":"O","e":"선의취득은 무권리자로부터의 취득을 보완하는 제도이다."},{"p":17,"q":"선의취득의 양도인은 반드시 절도범이어야 한다.","a":"X","e":"양도인이 무권리자이면 족하고, 절도범으로 한정되지 않는다."},{"p":17,"q":"선의취득의 객체는 원칙적으로 동산이어야 한다.","a":"O","e":"부동산, 채권 등은 원칙적으로 제249조 선의취득의 대상이 아니다."},{"p":17,"q":"채권도 재산적 가치가 있으므로 제249조의 선의취득 대상이 된다.","a":"X","e":"제249조의 대상은 동산 물권이다. 채권은 선의취득 대상이 아니다."},{"p":17,"q":"동산 중에서도 금전은 점유와 소유가 강하게 결합되어 일반 동산과 달리 취급되는 경우가 있다.","a":"O","e":"금전은 고도의 유통성이 있어 점유자에게 소유가 인정되는 특수성이 있다."},{"p":17,"q":"양도인이 제한능력자라서 법률행위가 취소된 경우에도 언제나 선의취득이 성립한다.","a":"X","e":"선의취득은 무권리자 처분을 보호하는 제도이지, 제한능력자 취소와 같은 거래행위 자체의 하자를 일반적으로 치유하는 제도가 아니다."},{"p":17,"q":"선의취득에는 유효한 거래행위가 필요하다.","a":"O","e":"매매 등 원인행위가 무효이면 선의취득의 기초가 부족하다."},{"p":17,"q":"강행법규 위반으로 매매계약이 무효인 경우에도 인도와 선의·무과실만 있으면 선의취득이 된다.","a":"X","e":"선의취득은 유효한 거래행위를 전제로 한다. 거래행위 자체가 무효이면 성립하기 어렵다."},{"p":17,"q":"선의취득이 성립하려면 양수인이 평온·공연하게 동산을 양수해야 한다.","a":"O","e":"제249조의 명문 요건이다."},{"p":17,"q":"폭력이나 은비에 의한 점유취득은 선의취득의 평온·공연 요건을 충족하지 못한다.","a":"O","e":"폭력은 평온을, 은비는 공연을 깨뜨린다."},{"p":17,"q":"양수인이 선의이면 과실이 있어도 선의취득이 성립한다.","a":"X","e":"선의취득은 선의뿐 아니라 무과실도 필요하다."},{"p":17,"q":"선의취득에서 선의란 양도인이 무권리자임을 알지 못하는 것을 말한다.","a":"O","e":"양도인이 소유자 또는 처분권자라고 믿는 상태이다."},{"p":17,"q":"선의취득에서 악의란 양도인이 무권리자임을 아는 경우이다.","a":"O","e":"악의이면 거래안전 보호 필요성이 없으므로 선의취득이 성립하지 않는다."},{"p":17,"q":"선의취득에서 무과실은 양도인의 무권리 사실을 알지 못한 데 과실이 없는 것을 말한다.","a":"O","e":"통상 요구되는 주의의무를 다했는데도 몰랐어야 한다."},{"p":17,"q":"선의취득에서 양수인의 선의·평온·공연은 점유의 추정규정과 연결되어 추정될 수 있다.","a":"O","e":"점유자는 선의·평온·공연으로 추정된다."},{"p":17,"q":"선의취득에서 양수인의 무과실도 항상 법률상 추정된다.","a":"X","e":"무과실은 당연히 추정되지 않는다. 선의취득을 주장하는 자가 무과실을 입증해야 한다."},{"p":17,"q":"선의취득을 주장하는 자는 원칙적으로 자기의 무과실을 증명해야 한다.","a":"O","e":"선의취득 요건 중 무과실은 추정되지 않는다는 점이 함정이다."},{"p":17,"q":"양수인이 조금만 확인했어도 양도인이 무권리자임을 알 수 있었다면 선의취득은 부정될 수 있다.","a":"O","e":"무과실이 없으면 선의취득은 성립하지 않는다."},{"p":17,"q":"양수인의 선의·무과실은 원칙적으로 점유취득 시를 기준으로 판단한다.","a":"O","e":"선의취득은 동산을 점유할 때 요건을 갖추어야 한다."},{"p":17,"q":"계약 체결 당시 선의·무과실이면, 인도받을 때 악의가 되었더라도 선의취득이 성립한다.","a":"X","e":"선의·무과실은 원칙적으로 점유취득 시 필요하다."},{"p":17,"q":"인도받을 때 선의·무과실이면, 계약 체결 후 인도 전까지 의심할 사정이 없었던 경우 선의취득 요건을 충족할 수 있다.","a":"O","e":"핵심은 점유취득 시의 선의·무과실이다."},{"p":17,"q":"선의취득에서 점유취득은 현실인도에 한정된다.","a":"X","e":"현실인도뿐 아니라 간이인도, 목적물반환청구권 양도도 가능하다. 다만 점유개정은 제한된다."},{"p":17,"q":"점유개정만으로는 선의취득이 인정되지 않는다는 것이 판례의 태도이다.","a":"O","e":"점유개정은 외형상 점유상태가 변하지 않아 공시력이 약하므로 선의취득의 점유취득으로 부족하다."},{"p":17,"q":"무권리자로부터 동산을 매수하고 점유개정만 받은 양수인은 선의·무과실이면 곧바로 선의취득한다.","a":"X","e":"점유개정만으로는 선의취득이 인정되지 않는다."},{"p":17,"q":"점유개정은 일반 동산 물권양도의 인도방법으로는 인정되지만, 선의취득의 점유취득 방법으로는 원칙적으로 인정되지 않는다.","a":"O","e":"일반 양도와 선의취득을 구별해야 한다."},{"p":17,"q":"간이인도는 선의취득의 점유취득 방법이 될 수 있다.","a":"O","e":"양수인이 이미 점유하고 있어 점유취득의 외형이 인정될 수 있다."},{"p":17,"q":"목적물반환청구권의 양도는 선의취득의 점유취득 방법이 될 수 있다.","a":"O","e":"제3자에 대한 반환청구권 양도로 양수인이 간접점유를 취득하므로 가능하다고 본다."},{"p":17,"q":"양도인이 계속 직접점유를 유지하고 양수인은 관념상 점유만 취득하는 점유개정은 거래안전 보호의 공시가 약하다.","a":"O","e":"그래서 선의취득에서는 점유개정만으로 부족하다고 본다."},{"p":17,"q":"선의취득은 동산 거래안전을 보호하기 위한 제도이므로 무권리자와 거래한 양수인의 모든 과실은 묻지 않는다.","a":"X","e":"거래안전 보호에도 한계가 있어 양수인은 무과실이어야 한다."},{"p":17,"q":"선의취득이 성립하면 원소유자는 원칙적으로 그 동산의 반환을 청구할 수 없다.","a":"O","e":"선의취득자가 원시적으로 소유권을 취득하므로 원소유자의 소유권은 상실된다."},{"p":17,"q":"선의취득이 성립하더라도 원소유자의 소유권은 그대로 존속하고 선의취득자는 단순히 대항력만 취득한다.","a":"X","e":"선의취득자는 소유권을 원시취득하고 원소유자의 권리는 소멸한다."},{"p":17,"q":"선의취득은 원시취득이므로 원칙적으로 전주의 권리 하자를 승계하지 않는다.","a":"O","e":"무권리자로부터라도 법률규정에 의해 새 권리를 취득한다."},{"p":17,"q":"선의취득자는 무권리자로부터 취득하므로 소유권이 아니라 단순한 점유권만 취득한다.","a":"X","e":"제249조 요건을 갖추면 소유권을 취득한다."},{"p":17,"q":"도품 또는 유실물에 대해서도 제249조의 선의취득 요건은 문제될 수 있으나, 원소유자의 회복청구 특칙이 있다.","a":"O","e":"도품·유실물은 2년 내 회복청구와 대가변상 예외가 중요하다."},{"p":17,"q":"도품 또는 유실물의 피해자나 유실자는 도난 또는 유실한 날로부터 2년 내에 그 물건의 반환을 청구할 수 있다.","a":"O","e":"민법 제250조의 핵심이다."},{"p":17,"q":"도품·유실물의 반환청구기간은 선의취득자가 그 물건을 취득한 날부터 10년이다.","a":"X","e":"도난 또는 유실한 날부터 2년이다."},{"p":17,"q":"도품·유실물 회복청구에서 2년의 기산점은 원소유자가 현재 점유자를 안 날이다.","a":"X","e":"도난 또는 유실한 날이 기준이다."},{"p":17,"q":"도품·유실물이 경매, 공개시장 또는 동종류 물건을 판매하는 상인으로부터 선의로 매수된 경우, 피해자나 유실자는 대가를 변상해야 반환을 청구할 수 있다.","a":"O","e":"민법 제251조의 대가변상 규정이다."},{"p":17,"q":"도품을 공개시장에서 선의로 매수한 자에게 원소유자가 반환을 청구할 때에는 언제나 무상반환을 청구할 수 있다.","a":"X","e":"경매·공개시장·동종류 판매상인에게서 선의매수한 경우에는 대가변상이 필요하다."},{"p":17,"q":"도품·유실물이 아닌 일반 동산에 선의취득이 성립하면 원소유자는 2년 내라도 반환청구할 수 없다.","a":"O","e":"2년 회복청구 특칙은 도품·유실물에 관한 것이다."},{"p":17,"q":"점유자가 횡령한 물건은 도품 또는 유실물에 당연히 포함된다.","a":"X","e":"도품은 도난물, 유실물은 잃어버린 물건이다. 횡령물은 당연히 도품·유실물은 아니다."},{"p":17,"q":"도품·유실물 특칙은 원소유자 보호와 거래안전 보호를 조정하는 규정이다.","a":"O","e":"2년 회복청구와 대가변상 예외가 조정 장치이다."},{"p":17,"q":"선의취득은 선의의 양수인을 보호하므로 도품·유실물에 대해서도 원소유자의 회복청구는 전혀 인정되지 않는다.","a":"X","e":"도품·유실물은 2년 내 회복청구 특칙이 있다."},{"p":17,"q":"선의취득의 요건 중 평온·공연은 점유취득의 태양에 관한 요건이다.","a":"O","e":"폭력·은비가 배제된다."},{"p":17,"q":"양수인이 악의이면 아무리 대가를 지급하고 인도받았더라도 선의취득은 성립하지 않는다.","a":"O","e":"선의가 핵심 요건이다."},{"p":17,"q":"양수인이 양도인의 처분권을 의심할 특별한 사정이 있는데도 확인하지 않았다면 무과실이 부정될 수 있다.","a":"O","e":"정상 거래라면 요구되는 주의의무를 다해야 한다."},{"p":17,"q":"동산 선의취득에서 대가 지급은 언제나 독립된 필수요건이다.","a":"X","e":"제249조의 명문은 평온·공연·선의·무과실·점유이다. '언제나 대가 필수'라고 단정하면 틀린다."},{"p":17,"q":"선의취득의 효과는 양수인이 양도인의 무권리라는 하자를 알지 못하고 과실 없이 점유를 취득한 때 발생한다.","a":"O","e":"선의·무과실과 점유취득이 결합되어야 한다."},{"p":17,"q":"양수인이 무권리자로부터 동산을 매수했으나 아직 인도받지 않았다면 선의취득은 성립하지 않는다.","a":"O","e":"점유취득이 필요하다."},{"p":17,"q":"무권리자로부터 동산을 매수하고 목적물반환청구권을 양도받은 경우에는 점유취득 요건이 항상 부정된다.","a":"X","e":"목적물반환청구권 양도도 인도방법이고 선의취득의 기초가 될 수 있다."},{"p":17,"q":"선의취득은 동산의 소유권뿐 아니라 동산질권 취득에도 적용될 수 있다.","a":"O","e":"동산 질권도 점유를 공시방법으로 하는 물권이므로 선의취득이 문제된다."},{"p":17,"q":"저당권도 점유를 공시방법으로 하므로 동산 선의취득의 대상이 된다.","a":"X","e":"저당권은 점유를 수반하지 않는 담보물권이고 부동산저당권은 선의취득 대상이 아니다."},{"p":17,"q":"질권 설정자가 무권리자라도 채권자가 선의·무과실로 질물을 인도받으면 질권 선의취득이 문제될 수 있다.","a":"O","e":"소유권뿐 아니라 질권의 선의취득도 인정된다."},{"p":17,"q":"부동산 임차권은 동산이 아니므로 제249조 선의취득의 대상이 아니다.","a":"O","e":"권리 자체는 제249조의 동산 물권이 아니다."},{"p":17,"q":"선의취득은 거래안전을 위한 제도이므로 도난품이라도 선의취득자가 언제나 확정적으로 보호된다.","a":"X","e":"도품은 2년 내 회복청구와 대가변상 특칙이 있다."},{"p":17,"q":"공개시장에서 도품을 산 선의취득자에게 원소유자가 반환을 청구하려면 지급한 대가를 변상해야 한다.","a":"O","e":"제251조의 대표 사례이다."},{"p":17,"q":"전당포에서 선의로 도품을 취득한 경우에도 원소유자의 회복청구에는 대가변상 문제가 생길 수 있다.","a":"O","e":"전당포 등 동종류 물건을 판매·취급하는 상인 관련 거래는 대가변상 특칙과 연결된다."},{"p":17,"q":"도품·유실물 반환청구에서 원소유자가 대가를 변상해야 하는 경우는 모든 선의취득자에게 적용된다.","a":"X","e":"경매, 공개시장, 동종류 물건 판매상인에게서 선의로 매수한 경우에 한정된다."},{"p":17,"q":"선의취득자는 원시취득자이므로 특별한 사정이 없는 한 전 소유자에게 매매대금을 지급할 의무를 부담하지 않는다.","a":"O","e":"원소유자와 선의취득자 사이에는 계약관계가 없다."},{"p":17,"q":"동산물권 양도의 인도방법 중 현실인도는 양도인이 양수인에게 직접 점유를 이전하는 것이다.","a":"O","e":"가장 전형적인 인도방법이다."},{"p":17,"q":"간이인도는 양수인이 이미 목적물을 점유하고 있으므로 별도 인도 없이 의사표시만으로 충분하다.","a":"O","e":"예: 임차인이 보관 중인 물건을 매수하는 경우."},{"p":17,"q":"점유개정은 양도인이 양수인을 위하여 점유한다는 의사로 점유를 계속하는 구조이다.","a":"O","e":"양도인은 직접점유자, 양수인은 간접점유자가 된다."},{"p":17,"q":"목적물반환청구권 양도는 양수인이 이미 직접점유하는 경우에만 가능하다.","a":"X","e":"제3자가 점유하는 경우에 양도인이 제3자에 대한 반환청구권을 양도하는 방식이다."},{"p":17,"q":"동산 물권변동에서 인도는 물권행위와 동시에 이루어져야만 하고, 사후 인도는 효력이 없다.","a":"X","e":"물권적 합의와 인도가 결합되면 되고, 반드시 동시에만 해야 하는 것은 아니다."},{"p":17,"q":"양도 당시 인도가 없더라도 나중에 인도가 이루어지면 그때 동산 물권변동의 효력이 생길 수 있다.","a":"O","e":"인도 시점에 물권변동 요건이 완성된다."},{"p":17,"q":"선의취득에서도 점유취득 전에는 소유권취득 효과가 발생하지 않는다.","a":"O","e":"점유취득은 선의취득의 핵심 요건이다."},{"p":17,"q":"양도인이 소유자가 아니더라도 점유를 하고 있으면, 양수인은 언제나 선의취득한다.","a":"X","e":"양수인의 선의·무과실, 평온·공연한 양수, 유효 거래행위, 점유취득 등이 필요하다."},{"p":17,"q":"선의취득은 무권리자 처분에 의한 거래안전 보호제도이므로 양도인의 점유 외형이 중요한 의미를 가진다.","a":"O","e":"동산의 점유에는 공신적 기능이 인정되기 때문이다."},{"p":17,"q":"동산의 점유에는 공신력이 인정되므로 부동산보다 선의취득이 넓게 인정된다.","a":"O","e":"부동산 등기에는 공신력이 없지만, 동산 점유에는 공신적 기능이 있다."},{"p":17,"q":"부동산 등기에도 공신력이 있으므로 무권리자로부터 등기 이전을 받은 선의 매수인은 소유권을 취득한다.","a":"X","e":"우리 민법상 부동산 등기의 공신력은 부정된다."},{"p":17,"q":"동산 선의취득에서 양수인이 목적물을 점유한다는 것은 반드시 소유의 의사로 자주점유해야 한다는 뜻이다.","a":"X","e":"취득하는 권리에 따라 소유권 또는 질권 등 권리취득 구조가 달라진다. '반드시 소유의 의사'라고 단정하면 위험하다."},{"p":17,"q":"무권리자로부터 질권을 취득하는 경우에는 채권자가 질물을 점유해야 한다.","a":"O","e":"질권은 목적물 점유가 성립·존속의 핵심이다."},{"p":17,"q":"점유개정에 의한 동산 양도는 일반적으로 유효할 수 있으나, 이를 통해 선의취득을 주장하는 것은 제한된다.","a":"O","e":"일반 물권변동과 선의취득을 분리해서 판단한다."},{"p":17,"q":"선의취득을 주장하는 양수인이 악의라는 점은 원소유자가 주장할 수 있고, 무과실은 양수인이 입증해야 한다.","a":"O","e":"선의는 추정될 수 있으나 무과실은 추정되지 않는다는 구별이 핵심이다."},{"p":17,"q":"양수인이 무권리자로부터 싸게 매수했다는 사정만으로 언제나 무과실이 부정된다.","a":"X","e":"현저히 저렴한 가격은 의심 사정이 될 수 있지만, 언제나 단정할 수는 없다."},{"p":17,"q":"양수인이 거래 당시 등기나 등록 등 쉽게 확인 가능한 공시를 확인하지 않은 경우 무과실이 문제될 수 있다.","a":"O","e":"동산 종류와 거래관행에 따라 주의의무 위반이 될 수 있다."},{"p":17,"q":"일반 동산거래에서 매도인이 점유하고 있다는 사정은 권리외관의 중요한 요소가 된다.","a":"O","e":"동산은 점유가 공시방법이기 때문이다."},{"p":17,"q":"선의취득은 모든 동산에 예외 없이 적용되므로 등록으로 공시되는 자동차 등에도 아무 제한 없이 적용된다.","a":"X","e":"등록·등기 등 별도 공시제도가 있는 동산은 선의취득 적용이 제한될 수 있다."},{"p":17,"q":"선의취득이 성립하면 양수인은 양도인의 무권리라는 하자를 이유로 원소유자에게 소유권 취득을 부정당하지 않는다.","a":"O","e":"선의취득의 핵심 효과이다."},{"p":17,"q":"도품·유실물의 원소유자가 2년 내 반환청구를 하지 않으면 선의취득자는 더 이상 제250조에 의한 회복청구를 당하지 않는다.","a":"O","e":"2년은 도품·유실물 회복청구의 제한기간이다."},{"p":17,"q":"도품·유실물의 원소유자는 2년 내라면 경매에서 산 선의취득자에게도 아무 대가 없이 반환을 청구할 수 있다.","a":"X","e":"경매·공개시장·동종류 판매상인으로부터 선의 매수한 경우 대가변상이 필요하다."},{"p":17,"q":"무권리자로부터 동산을 매수한 자가 선의취득하지 못한 경우, 원소유자는 원칙적으로 소유권에 기한 반환청구를 할 수 있다.","a":"O","e":"선의취득 요건이 없으면 원소유자의 소유권이 그대로 남는다."},{"p":17,"q":"동산 물권변동에서 제188조의 인도에는 현실인도뿐 아니라 간이인도도 포함된다.","a":"O","e":"제188조 제2항이 간이인도를 규정한다."},{"p":17,"q":"동산 물권변동에서 제189조 점유개정은 양도인이 계속 점유하지만 양수인이 인도받은 것으로 보는 제도이다.","a":"O","e":"인도의제 제도이다."},{"p":17,"q":"동산 물권변동에서 제190조는 목적물반환청구권의 양도에 관한 규정이다.","a":"O","e":"제3자 점유의 경우 반환청구권 양도로 인도한 것으로 본다."},{"p":17,"q":"제188조부터 제190조까지는 모두 부동산 물권변동의 등기에 관한 규정이다.","a":"X","e":"동산 물권변동의 인도방법에 관한 규정이다."},{"p":17,"q":"동산 물권변동에서 법률행위로 인한 취득과 법률규정에 의한 취득은 구별된다.","a":"O","e":"매매에 의한 취득과 취득시효·첨부 등은 발생근거가 다르다."},{"p":17,"q":"동산의 선의취득은 법률행위로 인한 취득이므로 법률규정과는 아무 관계가 없다.","a":"X","e":"거래행위를 매개로 하지만 취득 효과는 법률규정에 따른다."},{"p":17,"q":"동산 소유자가 아닌 자가 처분한 경우라도 양수인이 제249조 요건을 모두 갖추면 소유권을 취득한다.","a":"O","e":"선의취득의 직접 효과이다."},{"p":17,"q":"선의취득 제도는 진정한 권리자 보호만을 목적으로 하고 거래안전과는 무관하다.","a":"X","e":"선의취득은 동산거래의 안전을 보호하는 제도이다."},{"p":17,"q":"선의취득의 요건을 갖춘 양수인은 원소유자에게 소유권이전등기를 청구해야 비로소 소유권을 취득한다.","a":"X","e":"동산 선의취득은 등기를 요하지 않고 요건 충족 시 즉시 취득한다."},{"p":17,"q":"동산 선의취득은 등기 없이도 성립한다.","a":"O","e":"동산의 공시방법은 등기가 아니라 점유이다."},{"p":17,"q":"동산 선의취득에서는 인도 방식과 양수인의 선의·무과실 판단시점이 실전 핵심이다.","a":"O","e":"점유개정 여부, 인도 당시 선의·무과실 여부가 자주 함정이 된다."},{"p":17,"q":"동산 물권변동의 인도방법 네 가지는 현실인도, 간이인도, 점유개정, 목적물반환청구권 양도이다.","a":"O","e":"시험상 표준 암기 포인트이다."},{"p":17,"q":"선의취득의 기본 요건은 유효한 거래행위, 동산, 양도인의 무권리, 평온·공연한 점유취득, 양수인의 선의·무과실이다.","a":"O","e":"요건을 하나라도 빠뜨리면 함정 지문에 걸린다."},{"p":17,"q":"선의취득이 인정되면 원소유자의 권리와 선의취득자의 권리가 병존한다.","a":"X","e":"선의취득자가 소유권을 취득하고 원소유자의 소유권은 소멸한다."},{"p":17,"q":"선의취득에서 점유개정만으로 부족하다는 법리는 진정한 권리자의 이익을 보호하는 기능도 한다.","a":"O","e":"외부에서 점유이전이 드러나지 않으므로 원소유자 희생을 제한한다."},{"p":18,"q":"점유권은 물건에 대한 사실상의 지배 상태를 물권화한 것으로, 본권의 존재를 전제로 한다.","a":"X","e":"점유권은 권리의 유무와 관계없이 사실상 지배 상태를 보호한다. 본권은 지배할 권리이고, 점유권은 사실상 지배 자체의 보호이다."},{"p":18,"q":"점유권은 점유설정의사와 사실상의 지배를 필수 요소로 한다.","a":"O","e":"점유권은 물건을 지배하겠다는 의사와 사실상 지배가 있어야 성립한다."},{"p":18,"q":"점유권은 물건에 대한 사실상의 지배를 보호하므로 채권의 점유도 인정된다.","a":"X","e":"점유권의 객체는 물건이다. 채권 자체를 사실상 지배한다는 점유권은 인정되지 않는다."},{"p":18,"q":"점유권은 물권이므로 침탈 시 점유보호청구권을 행사할 수 있다.","a":"O","e":"점유자는 본권 유무와 관계없이 점유 침탈·방해에 대하여 점유보호청구권을 행사할 수 있다."},{"p":18,"q":"점유권은 사실상 지배 상태를 보호하므로 소유권이 없는 도인에게도 성립할 수 있다.","a":"O","e":"도인의 점유도 본권은 없지만 사실상 지배 상태가 있으므로 점유권은 성립한다."},{"p":18,"q":"점유보조자는 가사상·영업상 기타 유사한 관계로 타인의 지시를 받아 물건을 사실상 지배하는 자이다.","a":"O","e":"민법 제195조의 점유보조자 개념이다."},{"p":18,"q":"점유보조자는 독자적인 점유자이므로 점유권과 점유보호청구권이 인정된다.","a":"X","e":"점유보조자는 점유자가 아니다. 점유권과 점유보호청구권은 인정되지 않고, 점유주를 위한 자력구제만 가능하다."},{"p":18,"q":"점유보조자는 점유자가 아니므로 원칙적으로 소유물반환청구의 상대방이 될 수 없다.","a":"O","e":"소유물반환청구의 상대방은 현재 점유자이고, 단순한 점유보조자에 대한 인도청구는 허용되지 않는다."},{"p":18,"q":"편의점 점원은 사장의 지시를 받아 물건을 사실상 지배하므로 독립한 점유권을 취득한다.","a":"X","e":"영업상 지시·종속관계에 있으면 점유보조자일 뿐 독립한 점유권은 없다."},{"p":18,"q":"점유보조자의 점유 취득과 상실은 점유주의 점유 취득과 상실에 영향을 미칠 수 있다.","a":"O","e":"점유의 득실은 현실적으로 물건을 지배하는 점유보조자를 기준으로 판단한다."},{"p":18,"q":"부부 사이에서는 혼인생활 주거와 가사상 물건에 관하여 처를 부의 점유보조자로 보는 것이 원칙이다.","a":"X","e":"남녀평등 원칙상 부부 사이에 사회적 종속관계를 인정할 수 없으므로 부부 공동점유가 인정된다."},{"p":18,"q":"간접점유자는 점유매개관계에 의하여 타인으로 하여금 물건을 점유하게 한 자이다.","a":"O","e":"지상권·전세권·임대차·임치 등 관계로 타인이 직접점유하면 그 배후자는 간접점유자이다."},{"p":18,"q":"임대인이 임차인에게 가옥을 점유하게 한 경우 임대인은 간접점유자, 임차인은 직접점유자이다.","a":"O","e":"임대차는 대표적인 점유매개관계이다."},{"p":18,"q":"간접점유자는 점유권과 점유보호청구권이 인정되지 않는다.","a":"X","e":"간접점유자는 점유권과 점유보호청구권이 인정된다. 다만 자력구제권은 인정되지 않는다."},{"p":18,"q":"간접점유자에게는 자력구제권이 인정되지 않는다.","a":"O","e":"자력구제는 현실 현장 지배를 전제로 하므로 간접점유자에게는 인정되지 않는다."},{"p":18,"q":"점유매개관계는 반드시 유효한 사법상 계약이어야 한다.","a":"X","e":"점유매개관계는 사법관계뿐 아니라 공법관계일 수도 있고, 반드시 유효할 필요도 없다."},{"p":18,"q":"점유매개관계는 중첩적으로 성립할 수 없다.","a":"X","e":"점유매개관계는 중첩적으로도 성립할 수 있다."},{"p":18,"q":"간접점유자는 직접점유자에 대하여 반환청구권을 가져야 한다.","a":"O","e":"점유매개관계의 핵심은 직접점유자에 대한 목적물 반환청구권이다."},{"p":18,"q":"간접점유자는 직접점유자에 대하여 점유보호청구권을 행사할 수 있다.","a":"X","e":"간접점유자와 직접점유자의 대내관계에서는 점유매개관계나 본권에 기한 청구를 행사하고, 점유보호청구권·자력구제권은 행사할 수 없다."},{"p":18,"q":"직접점유자는 간접점유자에 대하여 점유보호청구권을 행사할 수 있다.","a":"O","e":"직접점유자는 현실 지배자이므로 간접점유자에 대한 점유보호청구권과 자력구제권도 행사 가능하다."},{"p":18,"q":"직접점유자가 제3자에게 침탈당한 경우 간접점유자도 원칙적으로 직접점유자에게 반환할 것을 청구할 수 있다.","a":"O","e":"간접점유자는 제207조에 따라 직접점유자에게 반환할 것을 청구할 수 있다."},{"p":18,"q":"직접점유자가 반환을 받을 수 없거나 원하지 않는 경우에는 간접점유자가 자기에게 반환할 것을 청구할 수 있다.","a":"O","e":"직접점유자가 반환을 받을 수 없거나 원하지 않으면 간접점유자는 직접 자기에게 반환 청구가 가능하다."},{"p":18,"q":"직접점유자가 임의로 제3자에게 점유를 이전한 경우, 간접점유자의 의사에 반하면 언제나 간접점유자의 점유가 침탈된 것이다.","a":"X","e":"점유 침탈 여부는 직접점유자를 기준으로 한다. 직접점유자가 임의로 이전한 경우 간접점유자의 의사에 반해도 침탈은 아니다."},{"p":18,"q":"점유권은 상속인에게 이전한다.","a":"O","e":"민법 제193조. 점유권도 상속된다."},{"p":18,"q":"상속인이 상속개시사실을 몰랐다면 피상속인의 점유권은 상속인에게 이전하지 않는다.","a":"X","e":"상속인은 사실상 지배를 하지 않거나 상속개시사실을 몰라도 점유권을 승계한다."},{"p":18,"q":"상속인은 새로운 권원 없이도 피상속인의 점유 성질과 하자를 벗어나 자기 고유의 점유를 주장할 수 있다.","a":"X","e":"상속인은 새로운 권원이 없는 한 피상속인의 점유 성질과 하자를 그대로 승계한다."},{"p":18,"q":"자주점유 여부는 점유자의 내심 의사만으로 결정된다.","a":"X","e":"자주점유인지 여부는 권원의 성질과 모든 사정을 기준으로 외형적·객관적으로 판단한다."},{"p":18,"q":"매매가 무효라 하더라도 그 매수인의 점유는 원칙적으로 자주점유가 될 수 있다.","a":"O","e":"매수인은 소유자로서 지배하려는 외형을 가지므로 매매가 무효여도 자주점유가 될 수 있다."},{"p":18,"q":"타인의 물건을 절취하여 가지고 있는 도인의 점유는 타주점유이다.","a":"X","e":"도인의 점유는 소유자처럼 지배하려는 점유이므로 자주점유가 될 수 있다."},{"p":18,"q":"자주점유란 법률상 소유권이 있거나 소유권이 있다고 믿고 하는 점유만을 의미한다.","a":"X","e":"자주점유는 소유자와 동일하게 지배하려는 의사로 하는 점유이지, 법률상 권한이나 믿음이 반드시 필요한 것은 아니다."},{"p":18,"q":"지상권자·전세권자·질권자·임차인의 점유는 목적물 소유 의욕이 있어도 타주점유이다.","a":"O","e":"권원의 성질상 타인의 물건을 이용·담보로 점유하는 것이므로 타주점유이다."},{"p":18,"q":"처분권한 없는 자로부터 그 사실을 알면서 부동산을 취득한 자의 점유는 타주점유가 된다.","a":"O","e":"무권리자임을 알면서 취득하여 점유한 경우 권원의 성질상 타주점유로 본다."},{"p":18,"q":"법률행위가 무효임을 알면서 그 법률행위로 부동산을 취득하여 점유한 경우에도 자주점유 추정은 절대 깨지지 않는다.","a":"X","e":"무효임을 알면서 취득한 경우 그 점유는 타주점유로 본다."},{"p":18,"q":"명의신탁에 의하여 부동산 소유자로 등기된 명의수탁자의 점유는 등기명의신탁의 경우 권원의 성질상 자주점유가 아니다.","a":"O","e":"등기명의신탁형 명의수탁자의 점유는 타주점유로 정리된다."},{"p":18,"q":"계약명의신탁에서 명의수탁자가 계약당사자로 등장한 경우 그 명의수탁자의 점유는 자주점유가 될 수 있다.","a":"O","e":"계약명의신탁에서는 명의수탁자가 계약명의자이므로 명의수탁자의 점유는 자주점유로 볼 수 있다."},{"p":18,"q":"분묘기지권자의 점유는 분묘 보존·관리에 필요한 범위에서 하는 것이므로 소유의 의사가 추정되지 않는다.","a":"O","e":"분묘기지권자는 권원의 성질상 타인의 토지를 소유의 의사로 점유하는 것이 아니다."},{"p":18,"q":"등기부상 면적을 상당히 초과하는 토지를 매수인이 점유하는 경우, 특별한 사정이 없으면 초과 부분의 점유는 타주점유이다.","a":"O","e":"상당 초과 부분은 특별한 사정 없으면 단순한 점용권 매매로 보아 타주점유이다."},{"p":18,"q":"매수인으로부터 대금을 완납받고 목적물 인도의무를 지는 매도인의 점유는 특별한 사정이 없는 한 타주점유로 변경된다.","a":"O","e":"대금 완납 후 매도인은 더 이상 소유자로 지배하는 지위가 아니라 인도의무자로 점유한다."},{"p":18,"q":"경락허가결정이 있더라도 종전소유자의 점유는 계속 자주점유로 남는다.","a":"X","e":"경락허가결정이 있으면 종전소유자는 타주점유로 전환된다."},{"p":18,"q":"매매계약이 매수인의 채무불이행으로 해제되면 매수인의 점유는 계약 해제일부터 타주점유가 된다.","a":"O","e":"해제 후에는 소유 의사로 점유할 권원 구조가 깨지므로 타주점유로 본다."},{"p":18,"q":"권원의 성질상 자주점유인지 타주점유인지 불분명한 경우 점유자는 소유의 의사로 점유한 것으로 추정된다.","a":"O","e":"민법 제197조 제1항의 자주점유 추정이다."},{"p":18,"q":"점유자가 매매 권원을 주장했다가 인정되지 않으면 언제나 자주점유 추정이 번복된다.","a":"X","e":"주장한 권원이 인정되지 않았다는 사정만으로 자주점유 추정이 당연히 깨지지는 않는다."},{"p":18,"q":"취득시효기간 경과 후 상대방에게 토지 매수를 제의한 사실만으로 타주점유가 된다.","a":"X","e":"시효기간 경과 후 매수 제의만으로 자주점유가 타주점유로 바뀌지는 않는다."},{"p":18,"q":"악의의 무단점유가 입증되면 특별한 사정이 없는 한 자주점유 추정은 깨어진다.","a":"O","e":"소유권 취득 원인도 없고 그 사실을 알면서 무단점유한 경우 자주점유 추정은 깨진다."},{"p":18,"q":"타주점유자가 자기 명의로 소유권이전등기를 마치면 그것만으로 당연히 자주점유로 전환된다.","a":"X","e":"단순히 자기 명의 등기를 경료했다는 것만으로 소유의 의사 표시가 되어 자주점유로 전환되는 것은 아니다."},{"p":18,"q":"타주점유가 자주점유로 전환되려면 새로운 권원에 의하거나 점유시킨 자에게 소유의 의사를 표시해야 한다.","a":"O","e":"타주점유의 자주 전환에는 명백한 새로운 권원 또는 소유 의사 표시가 필요하다."},{"p":18,"q":"진정소유자가 점유자를 상대로 말소등기청구소송을 제기하여 점유자 패소가 확정되면 그 후부터 타주점유로 전환될 수 있다.","a":"O","e":"소유자가 제기한 소에서 점유자 패소가 확정되면 그때부터 타주점유로 전환된다."},{"p":18,"q":"점유자가 소유자를 상대로 이전등기청구소송을 제기했다가 패소한 경우 그 사정만으로 자주점유가 타주점유로 전환 를 배상한다.","a":"O","e":"민법 제202조. 악의점유자는 전부배상이다."},{"p":18,"q":"선의의 자주점유자는 점유물 멸실·훼손에 책임 있는 사유가 있어도 현존이익 한도에서 배상한다.","a":"O","e":"선의+자주점유자만 현존이익 한도 배상이다."},{"p":18,"q":"선의의 타주점유자도 점유물 멸실·훼손 시 현존이익 한도에서만 배상한다.","a":"X","e":"소유의 의사가 없는 점유자는 선의라도 손해 전부를 배상한다."},{"p":18,"q":"제202조에서 손해 전부 배상은 악의점유자에게만 적용된다.","a":"X","e":"악의점유자뿐 아니라 선의의 타주점유자도 손해 전부를 배상한다."},{"p":18,"q":"점유자의 비용상환청구권은 본권에 의해 타인의 물건을 점유한 자와 본권자 사이에도 항상 제203조가 적용된다.","a":"X","e":"임차권 등 본권에 의해 점유한 경우 그 법률관계에 따라 청산되고 제203조 적용 여지는 제한된다."},{"p":18,"q":"점유자가 점유물을 반환할 때에는 필요비 상환을 청구할 수 있다.","a":"O","e":"제203조 제1항. 점유물 보존을 위한 필요비 상환청구가 가능하다."},{"p":18,"q":"점유자가 과실을 취득한 경우에는 통상의 필요비를 청구할 수 없다.","a":"O","e":"과실을 취득한 점유자는 일상 유지관리비 성격의 통상필요비를 청구하지 못한다."},{"p":18,"q":"점유자가 과실을 취득한 경우 특별필요비도 청구할 수 없다.","a":"X","e":"과실취득자는 통상의 필요비만 청구하지 못하고 특별필요비는 청구 가능하다."},{"p":18,"q":"유익비는 가액 증가가 현존하는 경우에 한하여 상환청구할 수 있다.","a":"O","e":"제203조 제2항. 유익비는 증가가 현존해야 한다."},{"p":18,"q":"유익비 상환에서 지출금액과 증가액 중 어느 것을 상환할지는 점유자가 선택한다.","a":"X","e":"회복자의 선택에 따라 지출금액 또는 증가액을 상환한다."},{"p":18,"q":"법원은 회복자의 청구로 유익비 상환에 상당한 기간을 허여할 수 있다.","a":"O","e":"제203조 제3항은 유익비에 관한 기간 허여 규정이다."},{"p":18,"q":"법원은 필요비 상환에 대해서도 회복자의 청구로 상당한 기간을 허여할 수 있다.","a":"X","e":"상당한 상환기간 허여는 유익비에 관한 규정이다."},{"p":18,"q":"필요비·유익비 상환청구권은 선의·악의, 자주·타주를 불문하고 인정될 수 있다.","a":"O","e":"비용상환청구권은 점유자의 선악·자타를 불문하고 인정된다."},{"p":18,"q":"필요비·유익비 상환청구권은 물건에 관하여 생긴 채권이므로 유치권의 피담보채권이 될 수 있다.","a":"O","e":"제320조의 유치권 피담보채권이 될 수 있다."},{"p":18,"q":"유익비에 대하여 법원이 상환기간을 허여한 경우에도 유예기간 중 유치권은 성립한다.","a":"X","e":"유예기간 중에는 변제기가 도래하지 않았으므로 유치권은 성립하지 않는다."},{"p":18,"q":"필요비·유익비 상환청구권은 점유물을 개량하거나 보존한 즉시 발생·행사할 수 있다.","a":"X","e":"점유자가 회복자로부터 반환청구를 받거나 반환할 때 비로소 회복자에 대하여 행사할 수 있다."},{"p":18,"q":"소유권이전등기 말소만을 구하는 소송에서 점유자는 유익비상환청구권으로 동시이행 또는 유치권 항변을 할 수 없다.","a":"O","e":"유익비상환청구권은 반환 때 발생하므로 말소등기청구만 있는 경우에는 항변할 수 없다."},{"p":18,"q":"점유보호청구권은 현재 점유자가 현재 침탈·방해하거나 그 염려가 있는 자에게 행사한다.","a":"O","e":"점유보호청구권은 현재의 점유 보호 수단이다."},{"p":18,"q":"점유물반환청구권은 점유의 침탈이 없는 단순 방해에도 행사된다.","a":"X","e":"점유물반환청구권은 침탈이 있는 경우에 행사된다. 단순 방해는 방해제거청구권이다."},{"p":18,"q":"점유의 침탈이란 점유자의 의사에 기하지 않고 사실상 지배를 빼앗기는 것을 말한다.","a":"O","e":"의사에 반한 사실상 지배 상실이 침탈이다."},{"p":18,"q":"사기의 의사표시에 의해 스스로 건물을 명도한 경우에는 원칙적으로 점유 침탈이 아니다.","a":"O","e":"사기에 속아 명도한 경우라도 점유자의 의사에 의한 이전이므로 점유회수의 소가 인정되지 않는다."},{"p":18,"q":"위법한 강제집행에 의하여 점유를 인도한 경우에는 점유 침탈이 될 수 있다.","a":"O","e":"위법한 강제집행에 의한 인도는 침탈로 본다."},{"p":18,"q":"점유물반환청구권은 침탈 후 1년 이내에 행사해야 하고, 이는 단순한 권리행사 기간이다.","a":"X","e":"침탈 후 1년은 제척기간이며 반드시 소를 제기해야 하는 출소기간으로 본다."},{"p":18,"q":"점유물반환청구권은 선의의 특별승계인에게 대항하지 못한다.","a":"O","e":"점유회수청구는 선의의 특별승계인에게 행사할 수 없다."},{"p":18,"q":"점유침탈로 인한 손해배상청구의 상대방은 손해를 발생시킨 자이고, 그 특별승계인이 당연히 상대방이 되는 것은 아니다.","a":"O","e":"손해배상은 침탈자의 고의·과실 및 손해 발생에 따른 책임이다."},{"p":18,"q":"점유방해제거청구권은 방해가 종료된 날로부터 1년 내 행사해야 한다.","a":"O","e":"점유보유의 소는 방해 종료 후 1년 내에 제기해야 한다."},{"p":18,"q":"공사로 인한 점유방해의 경우 착공 후 1년이 경과하거나 공사가 완성되어도 방해제거청구권을 행사할 수 있다.","a":"X","e":"공사로 인한 경우 착공 후 1년 경과 또는 공사 완성 시 청구할 수 없다."},{"p":18,"q":"점유방해예방청구권은 현실 방해가 이미 발생해야만 행사할 수 있다.","a":"X","e":"방해 발생 염려가 있으면 방해예방청구 또는 담보제공청구가 가능하다."},{"p":18,"q":"공사로 인한 점유방해예방청구도 착공 후 1년이 경과하거나 공사가 완성되면 행사할 수 없다.","a":"O","e":"방해제거와 마찬가지로 공사 관련 제한이 적용된다."},{"p":18,"q":"점유권에 기한 소와 본권에 기한 소는 서로 영향을 미치지 아니한다.","a":"O","e":"제208조. 점유의 소와 본권의 소는 별개이다."},{"p":18,"q":"점유권에 기한 소에서는 본권에 관한 이유로 재판할 수 있다.","a":"X","e":"점유의 소는 본권에 관한 이유로 재판하지 못한다."},{"p":18,"q":"점유물반환청구의 상대방이 소유권 기타 본권을 가진 경우에도 그 이유만으로 점유자의 반환청구를 부인할 수 없다.","a":"O","e":"점유의 소에서는 본권을 이유로 점유보호를 배척하지 못한다."},{"p":18,"q":"점유의 소에서 패소한 소유자는 다시 본권에 기한 소유물반환청구를 할 수 없다.","a":"X","e":"점유의 소와 본권의 소는 별개이므로 점유의 소 패소 후에도 본권의 소를 제기할 수 있다."},{"p":18,"q":"직접점유자는 자력구제권을 행사할 수 있다.","a":"O","e":"민법 제209조. 직접점유자는 자력방위·자력탈환이 가능하다."},{"p":18,"q":"점유보조자는 점유자가 아니므로 자력구제권도 전혀 인정되지 않는다.","a":"X","e":"점유보조자는 점유권·점유보호청구권은 없지만 점유주를 위한 자력구제는 가능하다."},{"p":18,"q":"간접점유자는 점유권이 있으므로 자력구제권도 인정된다.","a":"X","e":"간접점유자는 점유권과 점유보호청구권은 있으나 자력구제권은 없다."},{"p":18,"q":"부동산 점유물이 침탈된 경우 점유자는 침탈 후 직시 가해자를 배제하여 탈환할 수 있다.","a":"O","e":"부동산 자력탈환은 침탈 후 직시 가능하다."},{"p":18,"q":"동산 점유물이 침탈된 경우 점유자는 현장에서 또는 추적하여 가해자로부터 탈환할 수 있다.","a":"O","e":"동산 자력탈환은 현장 또는 추적 중 가능하다."},{"p":18,"q":"자력탈환에서 직시란 점유자가 침탈사실을 안 때부터 상당한 기간 내를 의미한다.","a":"X","e":"직시는 객관적으로 가능한 한 신속히라는 뜻이고, 점유자가 침탈사실을 알았는지와 관계없이 상당한 시간이 지나면 행사할 수 없다."},{"p":18,"q":"점유자가 침탈사실을 몰랐다면 상당한 시간이 지난 뒤에도 자력탈환권을 행사할 수 있다.","a":"X","e":"침탈사실을 알고 몰랐는지와 관계없이 침탈 후 상당한 시간이 지나면 자력탈환권은 행사할 수 없다."},{"p":19,"q":"소유권은 물건에 대한 전면적 지배권으로서 법률의 범위 내에서 사용·수익·처분할 권능을 가진다.","a":"O","e":"민법 제211조. 소유자는 법률의 범위 내에서 소유물을 사용·수익·처분할 수 있다."},{"p":19,"q":"소유권은 채권과 달리 물건을 전면적·배타적으로 지배하는 본권이다.","a":"O","e":"소유권은 물권 중 가장 전면적인 지배권이다. 배타성이 있으므로 동일 물건에 동일 내용의 소유권이 병존하지 않는다."},{"p":19,"q":"소유권은 반사회적 행위를 원인으로 취득한 경우에도 언제나 자유롭게 양도할 수 있다.","a":"X","e":"소유권은 원칙적으로 양도 가능하지만, 반사회질서 행위가 원인이면 법률행위 자체가 무효가 될 수 있다."},{"p":19,"q":"소유권의 객체는 물건에 한하고, 아파트분양권과 같은 채권 자체에는 소유권이 성립하지 않는다.","a":"O","e":"소유권의 객체는 민법상 물건이다. 채권은 재산권이지만 소유권의 객체가 아니다."},{"p":19,"q":"전기 기타 관리할 수 있는 자연력도 민법상 물건에 포함되어 소유권의 객체가 될 수 있다.","a":"O","e":"민법상 물건에는 유체물뿐 아니라 전기 기타 관리할 수 있는 자연력도 포함된다."},{"p":19,"q":"토지소유권은 지표면에만 미치고 지하나 공중에는 미치지 않는다.","a":"X","e":"토지소유권은 정당한 이익이 있는 범위 내에서 토지의 상하에 미친다."},{"p":19,"q":"토지소유권은 정당한 이익이 있는 범위 내에서 토지의 상하에 미친다.","a":"O","e":"민법 제212조의 핵심이다. 지하수·지하공간·공중공간도 정당한 이익 범위에서 문제된다."},{"p":19,"q":"미채굴 광물은 토지의 구성부분이므로 토지소유자가 언제나 소유한다.","a":"X","e":"미채굴 광물은 광업권 제도와 연결되며 토지소유권의 일반적 구성부분처럼 처리하지 않는다."},{"p":19,"q":"토지 지하의 암석·토사·지하수·온천수는 원칙적으로 토지의 구성부분이다.","a":"O","e":"토지의 자연적 구성부분으로 보아 토지소유권의 범위와 연결된다."},{"p":19,"q":"건물은 토지의 정착물이므로 독립성이 있더라도 언제나 토지의 일부이다.","a":"X","e":"건물은 독립성을 갖추면 토지와 별개의 부동산이다. 토지의 부합물이나 종물이 될 수 없다는 판례형 포인트가 자주 출제된다."},{"p":19,"q":"지붕·주벽·기둥 등을 갖추어 사회통념상 독립성이 인정되는 건물은 토지와 별개의 소유권 객체가 된다.","a":"O","e":"건물의 독립성 판단 기준이다."},{"p":19,"q":"수목은 입목등기를 하면 토지와 별개의 소유권 및 저당권의 객체가 될 수 있다.","a":"O","e":"입목등기는 수목을 독립 부동산처럼 공시하는 제도다."},{"p":19,"q":"수목에 명인방법을 갖춘 경우에는 관습법상 토지와 별개의 소유권을 공시할 수 있다.","a":"O","e":"명인방법은 수목·미분리과실 등의 소유권 공시방법으로 인정된다."},{"p":19,"q":"미분리 과실은 명인방법으로 소유권을 공시할 수 없다.","a":"X","e":"미분리 과실도 명인방법으로 독립한 거래 객체로 공시될 수 있다."},{"p":19,"q":"농작물은 언제나 토지소유자의 소유가 된다.","a":"X","e":"적법한 권원 없이 경작한 경우 등 구체적 법리가 있지만, 일반적으로 농작물은 경작자 소유로 보는 판례 포인트가 있다."},{"p":19,"q":"토지가 포락한 경우에도 과다한 비용 없이 원상복구가 가능하고 경제적 가치가 있으면 원소유자의 소유권이 인정될 수 있다.","a":"O","e":"포락되었다고 곧바로 소유권이 소멸하는 것은 아니다. 원상복구 가능성과 경제적 가치가 기준이다."},{"p":19,"q":"취득시효는 권리자가 권리를 행사하지 않는 동안 무권리자가 권리를 취득하는 제도이다.","a":"O","e":"소멸시효가 권리소멸이면, 취득시효는 일정한 점유·공시 상태를 근거로 권리를 취득시키는 제도다."},{"p":19,"q":"취득시효의 대상은 부동산 소유권에 한정된다.","a":"X","e":"취득시효의 객체는 동산·부동산을 묻지 않는다. 일정한 권리도 시효취득 대상이 될 수 있다."},{"p":19,"q":"소유권은 취득시효의 대상이 된다.","a":"O","e":"가장 기본적인 시효취득 대상이다."},{"p":19,"q":"지상권은 시효취득의 대상이 될 수 있다.","a":"O","e":"지상권은 소유권 외의 물권 중 시효취득 가능권리로 정리된다."},{"p":19,"q":"지역권은 계속되고 표현된 것에 한하여 시효취득될 수 있다.","a":"O","e":"지역권은 계속되고 표현된 지역권이어야 시효취득 대상이 된다."},{"p":19,"q":"분묘기지권은 시효취득의 대상이 될 수 없다.","a":"X","e":"분묘기지권은 시효취득 가능한 권리로 정리된다."},{"p":19,"q":"질권은 시효취득의 대상이 될 수 있다.","a":"O","e":"질권은 취득시효 대상 권리로 정리된다."},{"p":19,"q":"점유권은 시효취득의 대상이 된다.","a":"X","e":"점유권은 시효취득의 대상이 아니다."},{"p":19,"q":"유치권과 저당권은 시효취득의 대상이 되지 않는다.","a":"O","e":"점유권·유치권·저당권·가족법상 권리·형성권 등은 시효취득 대상이 아니다."},{"p":19,"q":"가족법상의 권리와 형성권은 시효취득의 대상이 되지 않는다.","a":"O","e":"신분적 성격 또는 일방적 형성권의 성질상 시효취득 대상이 아니다."},{"p":19,"q":"광업권·어업권·지식재산권도 시효취득 대상으로 정리된다.","a":"O","e":"자료는 광업권·어업권·지식재산권을 취득시효 대상권리로 정리한다."},{"p":19,"q":"국가나 지방자치단체는 취득시효의 주체가 될 수 없다.","a":"X","e":"자연인, 법인, 국가, 지방자치단체, 비법인 사단·재단도 시효취득 주체가 될 수 있다."},{"p":19,"q":"비법인사단·재단도 취득시효의 주체가 될 수 있다.","a":"O","e":"권리능력 없는 사단·재단도 일정 범위에서 시효취득 주체가 될 수 있다."},{"p":19,"q":"자기 소유의 물건은 취득시효의 객체가 될 수 없다.","a":"X","e":"자기 소유의 물건도 취득시효 객체가 될 수 있다고 본다."},{"p":19,"q":"성명불상자의 물건도 취득시효의 객체가 될 수 있다.","a":"O","e":"소유자가 명확하지 않아도 시효취득 객체가 될 수 있다."},{"p":19,"q":"국유재산 중 일반재산은 시효취득의 대상이 될 수 있다.","a":"O","e":"국유재산 중 일반재산은 시효취득 가능하다. 다만 일반재산이라는 입증책임은 시효이익을 주장하는 자에게 있다."},{"p":19,"q":"국유재산 중 행정재산도 일반재산과 마찬가지로 자유롭게 취득시효의 대상이 된다.","a":"X","e":"행정재산은 공용·공공용 성격 때문에 원칙적으로 시효취득 대상이 아니다. 일반재산과 구별한다."},{"p":19,"q":"국유 일반재산임을 주장하는 자가 그 일반재산성에 대한 입증책임을 진다.","a":"O","e":"일반재산에 대한 취득시효를 주장하는 자가 이를 입증해야 한다."},{"p":19,"q":"부동산 점유취득시효가 완성되려면 20년간 소유의 의사로 평온·공연하게 점유하여야 한다.","a":"O","e":"민법 제245조 제1항의 기본요건이다."},{"p":19,"q":"부동산 점유취득시효에서 점유는 직접점유만을 의미하고 간접점유는 포함되지 않는다.","a":"X","e":"점유취득시효의 점유에는 직접점유뿐 아니라 간접점유도 포함된다."},{"p":19,"q":"부동산 점유취득시효가 완성되면 등기 없이 곧바로 소유권을 취득한다.","a":"X","e":"부동산 점유취득시효는 20년 경과로 등기청구권이 발생하고, 등기해야 소유권을 취득한다."},{"p":19,"q":"미등기 부동산이라도 취득시효기간이 완성되면 등기 없이 점유자가 소유권을 취득한다.","a":"X","e":"미등기 부동산이라도 취득시효 완성만으로 등기 없이 소유권을 취득하는 것은 아니다."},{"p":19,"q":"취득시효 완성으로 인한 소유권이전등기청구권은 채권적 청구권이다.","a":"O","e":"시효완성자에게 발생하는 것은 등기청구권이고, 그 성질은 채권적 청구권이다."},{"p":19,"q":"취득시효 완성으로 인한 등기청구권은 소멸시효의 대상이 되는 것이 원칙이다.","a":"O","e":"채권적 청구권이므로 소멸시효의 대상이다. 다만 점유를 계속하는 동안에는 진행되지 않는다."},{"p":19,"q":"취득시효 완성자가 점유를 계속하는 동안에는 취득시효 완성으로 인한 등기청구권의 소멸시효가 진행하지 않는다.","a":"O","e":"점유 계속 중에는 등기청구권 소멸시효가 진행하지 않는다고 본다."},{"p":19,"q":"취득시효 완성자가 점유를 상실하면 언제나 즉시 등기청구권도 소멸한다.","a":"X","e":"점유상실이 곧바로 등기청구권 소멸은 아니다. 시효이익 포기로 볼 사정이 없으면 남고, 상실 후 10년간 행사하지 않으면 소멸시효가 완성된다."},{"p":19,"q":"점유취득시효 완성 후 점유자가 점유를 상실한 때로부터 10년간 등기청구권을 행사하지 않으면 소멸시효가 완성될 수 있다.","a":"O","e":"점유상실 후에는 등기청구권의 소멸시효 진행 문제가 생긴다."},{"p":19,"q":"취득시효 완성 당시의 점유자만이 취득시효 완성 당시의 소유자를 상대로 등기청구를 할 수 있다는 구조가 기본이다.","a":"O","e":"취득시효 완성 당시 점유자와 당시 소유자의 대응관계가 중요하다."},{"p":19,"q":"취득시효 완성 전에 등기부상 소유자가 변경되면 그 변경 자체로 취득시효가 중단된다.","a":"X","e":"취득시효 완성 전 소유자 변동은 시효중단사유가 아니다. 완성 당시 소유자에게 청구한다."},{"p":19,"q":"취득시효 완성 전에 소유자가 변경된 경우, 시효완성자는 취득시효 완성 당시의 소유자에게 등기청구할 수 있다.","a":"O","e":"소유자 변동이 시효완성 전에 있으면 완성 당시 소유자를 상대로 청구한다."},{"p":19,"q":"취득시효 대상 부동산의 소유명의자 변동이 있는 경우에도 점유자는 언제나 기산점을 임의로 선택할 수 있다.","a":"X","e":"소유명의자 변동이 있는 경우에는 점유개시시가 기산점이 되고 임의선택할 수 없다."},{"p":19,"q":"시효기간 및 등기청구 시점까지 등기부상 소유자가 변경되지 않은 경우에는 취득시효 기산점을 임의로 선택할 수 있다.","a":"O","e":"등기명의자가 계속 동일하고 취득자 변동이 없으면 역산하여 20년 점유를 입증하는 방식이 가능하다."},{"p":19,"q":"등기부상 소유자가 계속 동일한 경우에는 취득시효를 주장하는 날로부터 역산하여 20년 이상의 점유사실만 입증하고 등기청구할 수 있다.","a":"O","e":"전합 판례 포인트. 명의자 변동이 없으면 기산점 선택의 폭이 있다."},{"p":19,"q":"취득시효 완성 후 제3자에게 소유권이 이전된 경우, 시효완성자는 그 제3자에게 당연히 취득시효 완성을 주장할 수 있다.","a":"X","e":"시효완성 후 등기 전 제3자에게 소유권이 이전되면 원칙적으로 그 제3자에게 대항하지 못한다. 다만 2차 취득시효 등 별도 문제가 있다."},{"p":19,"q":"취득시효 완성 후 소유자가 제3자에게 부동산을 처분하더라도, 시효완성자의 완성 당시 소유자에 대한 등기청구권이 곧바로 소멸하는 것은 아니다.","a":"O","e":"완성 당시 소유자에 대한 채권적 등기청구권 자체는 상실되지 않는다. 그 소유자에게 소유권이 회복되면 다시 주장할 수 있다."},{"p":19,"q":"취득시효 완성 후 제3자 명의 등기가 원인무효라면, 시효완성자는 완성 당시 소유자를 대위하여 제3자 등기의 말소를 구할 수 있다.","a":"O","e":"원인무효 등기라면 대위 말소 및 완성 당시 소유자에 대한 이전등기청구가 가능하다."},{"p":19,"q":"취득시효 완성 후 제3자 앞으로 유효한 소유권이전등기가 마쳐진 경우라도, 그 시점을 새 기산점으로 다시 20년 점유가 완성되면 2차 취득시효를 주장할 수 있다.","a":"O","e":"소유권 변동 시를 새로운 기산점으로 삼아 2차 취득시효를 주장할 수 있다."},{"p":19,"q":"2차 취득시효는 취득시효 완성 후 소유권 변동이 있더라도 언제나 인정되지 않는다.","a":"X","e":"일정한 경우 소유권 변동 시를 새 기산점으로 삼아 다시 시효기간이 완성되면 인정된다."},{"p":19,"q":"점유취득시효에서 소유의 의사는 점유권원의 성질에 의하여 객관적으로 결정된다.","a":"O","e":"자주점유인지 타주점유인지는 내심 의사보다 권원의 객관적 성질이 중요하다."},{"p":19,"q":"임차인은 임차권에 기해 점유하므로 특별한 사정이 없는 한 자주점유자이다.","a":"X","e":"임차인은 타인의 소유를 전제로 점유하므로 원칙적으로 타주점유자이다."},{"p":19,"q":"매수인은 등기를 마치지 않았더라도 매매계약에 기하여 소유의 의사로 점유할 수 있다.","a":"O","e":"매수인의 점유는 일반적으로 자주점유로 볼 수 있다. 다만 무효 등 사정에 따라 달라질 수 있다."},{"p":19,"q":"점유자는 소유의 의사로 선의·평온·공연하게 점유한 것으로 추정된다.","a":"O","e":"점유의 추정규정과 연결된다. 상대방이 타주점유 등 반대사실을 입증해야 한다."},{"p":19,"q":"타주점유자가 아무 이유 없이 마음속으로 소유의 의사를 가지기만 하면 그때부터 자주점유로 전환된다.","a":"X","e":"타주점유가 자주점유로 전환되려면 새로운 권원이나 소유자에 대한 소유의사 표시 등 객관적 사정이 필요하다."},{"p":19,"q":"점유의 승계가 있는 경우 전 점유자의 점유기간을 자기의 점유기간에 합산할 수 있다.","a":"O","e":"점유승계인은 전 점유자의 점유를 아울러 주장할 수 있다."},{"p":19,"q":"전 점유자의 점유를 승계하여 시효취득을 주장하는 경우, 전 점유자의 하자는 원칙적으로 함께 승계된다.","a":"O","e":"점유의 승계를 주장하면 그 하자도 승계되는 구조다."},{"p":19,"q":"취득시효 완성의 효과는 점유를 개시한 때로 소급하여 소유권을 취득한 것으로 확정된다.","a":"O","e":"등기를 갖추어 소유권을 취득하면 그 효과는 점유개시시로 소급한다고 정리된다."},{"p":19,"q":"등기부취득시효는 부동산의 소유자로 등기한 자가 10년간 소유의 의사로 평온·공연하게 선의·무과실로 점유한 때 성립한다.","a":"O","e":"민법 제245조 제2항. 등기 + 점유 + 10년 + 자주·평온·공연 + 선의·무과실이 핵심이다."},{"p":19,"q":"등기부취득시효는 점유만 있으면 되고 등기명의는 필요하지 않다.","a":"X","e":"등기부취득시효는 등기부상 소유자로 등기한 자에게 인정되는 10년 취득시효다."},{"p":19,"q":"등기부취득시효에서 등기는 반드시 적법·유효한 등기여야 하고 원인무효의 등기는 절대 기초가 될 수 없다.","a":"X","e":"원인무효의 등기라도 등기부취득시효의 기초가 될 수 있다. 다만 무효인 이중보존등기 등 예외가 있다."},{"p":19,"q":"무효인 이중소유권보존등기나 이에 터잡은 이전등기를 근거로 등기부취득시효 완성을 주장할 수 없다.","a":"O","e":"먼저 이루어진 등기가 유효하여 뒤의 보존등기가 무효인 경우, 그 뒤 등기를 근거로 등기부취득시효를 주장할 수 없다."},{"p":19,"q":"상속등기를 하지 않은 상태에서 등기부취득시효 요건이 완성된 경우에도 상속인은 일정한 경우 제245조 제2항의 등기한 자에 해당할 수 있다.","a":"O","e":"피상속인 명의 등기를 기초로 상속인에게 등기부취득시효를 인정한 판례 포인트다."},{"p":19,"q":"등기부취득시효에서 선의·무과실은 점유 개시시에 있으면 충분하다.","a":"O","e":"선의·무과실은 점유 개시시를 기준으로 판단한다."},{"p":19,"q":"등기부취득시효에서는 등기와 점유가 반드시 같은 날 시작되어 각각 10년을 채워야 한다.","a":"X","e":"등기와 점유가 때를 같이하여 각각 10년일 필요는 없다. 전체적으로 요건을 충족하는지를 본다."},{"p":19,"q":"등기부취득시효에서는 점유와 등기 모두 승계가 가능하다.","a":"O","e":"자료도 점유·등기 모두 승계 가능하다고 정리한다."},{"p":19,"q":"등기부취득시효가 완성되면 그 소유권 취득의 효과는 점유를 개시한 때로 소급한다.","a":"O","e":"점유취득시효와 마찬가지로 취득 효과의 소급이 문제된다."},{"p":19,"q":"등기부취득시효는 부동산만을 대상으로 한다.","a":"O","e":"등기부취득시효는 부동산 등기를 전제로 하는 제도다."},{"p":19,"q":"동산의 소유권은 10년간 소유의 의사로 평온·공연하게 점유하면 취득시효로 취득할 수 있다.","a":"O","e":"동산 취득시효의 기본 기간은 10년이다."},{"p":19,"q":"동산을 선의·무과실로 소유의 의사로 평온·공연하게 점유한 경우에는 5년으로 취득시효가 완성될 수 있다.","a":"O","e":"동산은 선의·무과실 요건을 갖추면 5년의 단기취득시효가 인정된다."},{"p":19,"q":"동산 취득시효도 부동산 점유취득시효처럼 반드시 등기를 하여야 소유권을 취득한다.","a":"X","e":"동산에는 등기요건이 없다. 점유기간 완성으로 소유권 취득 효과가 생긴다."},{"p":19,"q":"첨부는 부합·혼화·가공을 포함하는 소유권의 원시취득 원인이다.","a":"O","e":"첨부는 물건 사이 결합이나 노력이 더해져 소유권 귀속을 정하는 제도다."},{"p":19,"q":"부합은 부동산에만 인정되고 동산 사이에는 인정되지 않는다.","a":"X","e":"부합은 부동산에의 부합뿐 아니라 동산 간 부합도 문제된다. 혼화는 동산에 한한다."},{"p":19,"q":"부동산의 소유자는 원칙적으로 그 부동산에 부합한 물건의 소유권을 취득한다.","a":"O","e":"부동산 부합의 기본 원칙이다. 다만 권원에 의해 부속시킨 물건 등 예외가 문제된다."},{"p":19,"q":"타인의 권원에 의하여 부속시킨 물건은 언제나 부동산 소유자에게 부합한다.","a":"X","e":"권원에 의하여 부속시킨 물건은 부속시킨 자의 소유로 남는 경우가 있다."},{"p":19,"q":"동산과 동산이 부합하여 훼손하지 않으면 분리할 수 없거나 분리에 과다한 비용이 드는 경우, 주된 동산의 소유자가 합성물의 소유권을 취득하는 것이 원칙이다.","a":"O","e":"동산부합은 주종을 구별할 수 있으면 주된 동산 소유자가 취득한다."},{"p":19,"q":"동산 간 부합에서 주종을 구별할 수 없는 경우에는 각 동산의 소유자가 그 가액 비율로 합성물을 공유한다.","a":"O","e":"주종 구별이 안 되면 가액 비율에 따른 공유로 간다."},{"p":19,"q":"혼화는 부동산과 동산이 섞여 식별할 수 없게 되는 경우에만 적용된다.","a":"X","e":"혼화는 동산과 동산이 섞여 각각 식별할 수 없게 된 경우 문제된다."},{"p":19,"q":"혼화에는 동산 간 부합의 규정이 준용된다.","a":"O","e":"혼화는 동산만 문제되며 동산 간 부합 규정이 준용된다."},{"p":19,"q":"가공의 경우 원칙적으로 가공자가 가공물의 소유권을 취득한다.","a":"X","e":"가공은 원칙적으로 원재료 소유자가 소유권을 취득한다. 다만 가공으로 인한 가액 증가가 현저히 다액이면 가공자가 취득한다."},{"p":19,"q":"가공으로 인한 가액 증가가 원재료의 가액보다 현저히 다액이면 가공자가 가공물의 소유권을 취득할 수 있다.","a":"O","e":"가공의 예외다. 노력의 가치가 현저히 크면 가공자 귀속."},{"p":19,"q":"부합·혼화·가공으로 소유권을 상실한 자는 원칙적으로 부당이득반환 또는 보상관계가 문제될 수 있다.","a":"O","e":"첨부는 소유권 귀속을 정하지만, 가치 손실에 대해서는 부당이득·보상 문제가 별도로 생길 수 있다."},{"p":19,"q":"소유자는 그 소유에 속한 물건을 점유한 자에 대하여 반환을 청구할 수 있다.","a":"O","e":"민법 제213조 소유물반환청구권이다."},{"p":19,"q":"점유자가 그 물건을 점유할 권리가 있는 때에도 소유자는 언제나 반환을 청구할 수 있다.","a":"X","e":"점유자가 점유할 권리가 있으면 반환을 거부할 수 있다."},{"p":19,"q":"매매대금을 완납하고 점유하였으나 아직 소유권이전등기를 갖추지 못한 매수인은 일정한 경우 소유자의 반환청구를 거부할 수 있다.","a":"O","e":"자료도 점유자의 반환거부 예시로 든다. 점유할 권리가 있으면 제213조 단서가 작동한다."},{"p":19,"q":"소유물반환청구권의 상대방은 현재 목적물을 점유하고 있는 자가 원칙이다.","a":"O","e":"반환청구는 점유 침탈 상태의 회복이므로 현재 점유자가 상대방이 된다."},{"p":19,"q":"소유권에 기한 반환청구권은 채무불이행책임과 동일하므로 상대방의 귀책사유가 있어야 행사할 수 있다.","a":"X","e":"물권적 청구권은 물권의 원만한 지배상태 회복을 위한 권리로, 원칙적으로 귀책사유를 요하지 않는다."},{"p":19,"q":"소유자는 소유권을 방해하는 자에 대하여 방해제거를 청구할 수 있다.","a":"O","e":"민법 제214조 소유물방해제거청구권이다."},{"p":19,"q":"소유권을 방해할 염려 있는 행위를 하는 자에 대하여 소유자는 방해예방이나 손해배상의 담보를 청구할 수 있다.","a":"O","e":"제214조의 방해예방청구권이다. 아직 현실 방해가 발생하지 않아도 염려가 있으면 예방이 문제된다."},{"p":19,"q":"소유물방해예방청구권은 이미 발생한 방해를 제거하기 위한 권리이고, 장래의 방해위험에는 행사할 수 없다.","a":"X","e":"방해제거는 현재 방해 제거, 방해예방은 장래 방해 염려에 대한 권리다."},{"p":19,"q":"소유권에 기한 방해제거청구권은 방해자의 고의·과실을 요건으로 한다.","a":"X","e":"물권적 청구권은 원칙적으로 고의·과실을 요하지 않는다. 손해배상청구와 구별한다."},{"p":19,"q":"소유자가 방해자에게 손해배상을 청구하려면 별도로 불법행위 등 손해배상 요건이 필요하다.","a":"O","e":"물권적 청구권과 손해배상청구권은 별개다. 손해배상은 고의·과실 등 요건이 필요하다."},{"p":19,"q":"소유권에 기한 물권적 청구권에는 반환청구권, 방해제거청구권, 방해예방청구권이 포함된다.","a":"O","e":"소유권의 원만한 지배상태 회복을 위한 3종 세트다."},{"p":19,"q":"소유권에 기한 물권적 청구권은 소유권이 침해된 경우라도 언제나 권리남용이 될 수 없다.","a":"X","e":"소유권 행사도 권리남용이 될 수 있다. 건물철거청구 등에서 판례형 함정이 많다."},{"p":19,"q":"건물철거청구가 권리남용으로 제한되더라도 토지소유자의 임료 상당 부당이득반환청구까지 당연히 부정되는 것은 아니다.","a":"O","e":"철거청구 제한과 사용료 청구는 구별한다. 권리남용 파트와 연결되는 판례형 포인트다."},{"p":19,"q":"소유권은 장기간 행사하지 않았다는 사정만으로 쉽게 실효되지 않는다.","a":"O","e":"소유권은 실효의 원칙이 쉽게 적용되지 않는 권리다."},{"p":19,"q":"취득시효 완성 사실을 모르고 토지에 대해 아무 권리도 주장하지 않기로 한 후, 나중에 취득시효를 주장하는 것은 언제나 허용된다.","a":"X","e":"금반언 위반이 될 수 있다. 신의칙과 취득시효가 결합된 판례형 포인트다."},{"p":19,"q":"부동산 점유취득시효와 등기부취득시효는 모두 소유의 의사, 평온·공연 점유를 요구한다.","a":"O","e":"두 제도 모두 자주·평온·공연 점유가 공통요건이다."},{"p":19,"q":"부동산 점유취득시효는 20년, 등기부취득시효는 10년이 원칙이다.","a":"O","e":"기간 구별은 실전 빈출이다."},{"p":19,"q":"부동산 점유취득시효와 등기부취득시효는 모두 선의·무과실을 요구한다.","a":"X","e":"선의·무과실은 등기부취득시효의 요건이다. 20년 점유취득시효에는 요구되지 않는다."},{"p":19,"q":"등기부취득시효는 등기라는 공시가 있으므로 선의·무과실이 필요 없다.","a":"X","e":"오히려 등기부취득시효는 10년 단기인 대신 선의·무과실이 필요하다."},{"p":19,"q":"취득시효 완성으로 인한 등기청구권은 물권적 청구권이 아니라 채권적 청구권이다.","a":"O","e":"소멸시효 대상 여부와 연결되는 중요 포인트다."},{"p":19,"q":"소유권에 기한 반환청구권은 소유권 자체에서 나오는 물권적 청구권이다.","a":"O","e":"취득시효 완성으로 인한 등기청구권과 구별한다."},{"p":19,"q":"취득시효 완성으로 인한 등기청구권은 점유자가 점유를 계속하는 한 소멸시효가 진행하지 않는 것이 판례의 태도다.","a":"O","e":"점유 계속 중에는 권리 위에 잠자는 자로 보기 어렵다는 취지다."},{"p":19,"q":"취득시효 완성 전 소유자 변경은 중단사유가 아니나, 완성 후 제3자 이전등기는 시효완성자가 제3자에게 대항하지 못하는 문제가 될 수 있다.","a":"O","e":"완성 전 변동과 완성 후 변동을 구별하는 것이 핵심이다."},{"p":19,"q":"부합·혼화·가공은 모두 승계취득의 방식이다.","a":"X","e":"첨부는 원시취득의 한 유형이다."},{"p":19,"q":"소유물방해제거청구권은 현재의 방해 제거, 소유물방해예방청구권은 장래의 방해위험 예방을 목적으로 한다.","a":"O","e":"제거와 예방의 시점 구별."},{"p":20,"q":"공동소유란 하나의 물건을 2인 이상의 다수인이 소유하는 것을 말한다.","a":"O","e":"공동소유는 하나의 물건에 복수의 소유자가 존재하는 상태이다. 민법상 유형은 공유, 합유, 총유이다."},{"p":20,"q":"민법상 공동소유의 유형은 공유, 합유, 총유로 구분된다.","a":"O","e":"공동소유는 인적 결합의 정도에 따라 공유, 합유, 총유로 나뉜다."},{"p":20,"q":"공유에서 총유로 갈수록 인적 결합관계는 약해진다.","a":"X","e":"반대이다. 공유에서 합유, 총유로 갈수록 인적 결합관계가 강해진다."},{"p":20,"q":"공유는 개인주의적 소유형태이고, 총유는 집단주의적 소유형태에 가깝다.","a":"O","e":"공유는 지분의 독립성이 강하고, 총유는 단체성이 강하다."},{"p":20,"q":"공유는 하나의 소유권이 양적으로 분할된 것으로 이해된다.","a":"O","e":"공유자는 공유물 전부에 대한 지분권을 가진다. 특정 부분을 소유하는 것이 아니다."},{"p":20,"q":"공유자는 자기 지분에 해당하는 특정 부분만을 소유한다.","a":"X","e":"공유지분은 특정 부분 소유가 아니라 공유물 전체에 대한 비율적 권리이다."},{"p":20,"q":"합유는 조합과 같이 공동목적 달성을 위한 결합관계에서 인정되는 소유형태이다.","a":"O","e":"합유는 조합재산의 귀속형태로 설명된다."},{"p":20,"q":"총유는 권리능력 없는 사단의 사원이 집합체로서 물건을 소유하는 형태이다.","a":"O","e":"종중·교회 등 권리능력 없는 사단의 재산소유형태가 총유이다."},{"p":20,"q":"공유, 합유, 총유는 모두 지분이 인정되므로 각 구성원은 자기 지분을 자유롭게 처분할 수 있다.","a":"X","e":"공유지분은 자유 처분 가능하지만 합유지분은 전원 동의가 필요하고, 총유에는 지분이 인정되지 않는다."},{"p":20,"q":"총유에서는 총유물에 대한 구성원의 지분이 인정되지 않는다.","a":"O","e":"총유에는 지분 개념이 없으므로 지분처분과 분할청구가 인정되지 않는다."},{"p":20,"q":"공유와 합유는 지분이 인정되지만, 총유는 지분이 인정되지 않는다.","a":"O","e":"공유지분과 합유지분은 인정되지만 총유물에는 사원별 지분이 없다."},{"p":20,"q":"공유자는 지분처분권이 자유롭지만, 합유자는 전원의 동의가 있어야 합유지분을 처분할 수 있다.","a":"O","e":"공유는 지분 독립성이 강하고 합유는 조합관계에 묶여 있다."},{"p":20,"q":"총유자는 총유물에 대한 지분을 양도하거나 담보로 제공할 수 있다.","a":"X","e":"총유에는 지분이 없으므로 지분양도·담보제공이 불가능하다."},{"p":20,"q":"공유물분할청구는 원칙적으로 자유롭지만, 합유물분할청구는 조합이 존속하는 동안에는 할 수 없다.","a":"O","e":"공유는 분할 자유, 합유는 조합관계 존속 중 분할청구 불가이다."},{"p":20,"q":"총유물은 각 사원이 언제든지 분할을 청구할 수 있다.","a":"X","e":"총유에는 지분이 없으므로 총유물분할청구가 인정되지 않는다."},{"p":20,"q":"공유와 합유의 보존행위는 각 공유자 또는 합유자가 단독으로 할 수 있다.","a":"O","e":"공유물·합유물의 보존행위는 각자가 단독으로 전부에 대하여 할 수 있다."},{"p":20,"q":"총유물의 보존행위도 공유와 마찬가지로 각 사원이 단독으로 할 수 있다.","a":"X","e":"총유물 보존행위는 정관이나 사원총회 결의에 따라야 한다."},{"p":20,"q":"공유물의 관리행위는 공유자의 지분의 과반수로 결정한다.","a":"O","e":"공유물의 이용·개량 등 관리사항은 지분의 과반수로 결정한다."},{"p":20,"q":"합유물의 관리행위는 조합계약에 따르고, 특별한 약정이 없으면 조합원의 과반수로 결정한다.","a":"O","e":"합유는 조합관계가 전제이므로 관리도 조합계약 및 조합원 과반수 구조를 따른다."},{"p":20,"q":"총유물의 관리 및 처분은 사원총회의 결의에 의한다.","a":"O","e":"총유는 단체소유이므로 관리·처분은 총회결의가 원칙이다."},{"p":20,"q":"공유자의 지분은 법률 또는 계약에 의하여 정해지지 않으면 균등한 것으로 추정된다.","a":"O","e":"공유지분 비율이 불명확하면 균등한 것으로 추정한다."},{"p":20,"q":"공유자는 다른 공유자의 동의 없이 자기 지분을 양도할 수 있다.","a":"O","e":"공유지분 처분은 자유이다. 다만 공유물 전부 처분은 전원 동의가 필요하다."},{"p":20,"q":"공유자는 다른 공유자의 동의 없이 자기 지분 위에 저당권을 설정할 수 있다.","a":"O","e":"공유지분은 독립한 재산권으로 담보제공도 가능하다."},{"p":20,"q":"공유자가 자기 지분을 처분하려면 다른 공유자 전원의 동의가 필요하다.","a":"X","e":"공유지분은 자유롭게 처분할 수 있다. 전원동의는 공유물 전체 처분·변경의 요건이다."},{"p":20,"q":"공유물 전체를 처분하거나 변경하려면 공유자 전원의 동의가 필요하다.","a":"O","e":"공유물 전체의 처분·변경행위는 각 공유자의 권리에 중대한 영향을 주므로 전원동의가 필요하다."},{"p":20,"q":"공유물 전체의 매도는 관리행위이므로 지분 과반수로 결정할 수 있다.","a":"X","e":"공유물 전체 매도는 처분행위이므로 전원동의가 필요하다."},{"p":20,"q":"공유물의 사용·수익 방법을 정하는 것은 공유물의 관리에 관한 사항이다.","a":"O","e":"공유물의 구체적 사용·수익 방법 결정은 관리행위로서 지분 과반수에 따른다."},{"p":20,"q":"과반수 지분권자는 다른 공유자와 미리 협의하지 않아도 공유물의 관리방법을 단독으로 정할 수 있다.","a":"O","e":"지분 과반수를 가진 공유자는 관리사항을 단독 결정할 수 있다. 다만 처분·변경은 전원동의가 필요하다."},{"p":20,"q":"과반수 지분권자는 공유물의 처분·변경도 단독으로 결정할 수 있다.","a":"X","e":"과반수 지분권자라도 관리행위만 단독 결정 가능하고 처분·변경은 전원동의가 필요하다."},{"p":20,"q":"공유자는 지분의 비율로 공유물 전부를 사용·수익할 수 있다.","a":"O","e":"지분에 해당하는 특정 부분만이 아니라 공유물 전부를 지분 비율에 따라 사용·수익한다."},{"p":20,"q":"공유자는 자기 지분 비율에 해당하는 특정 부분을 당연히 배타적으로 사용할 수 있다.","a":"X","e":"특정 부분의 배타적 사용은 사용방법 협의나 관리결정이 있어야 가능하다."},{"p":20,"q":"공유자 사이에 사용·수익 방법에 관한 특약이 있으면 특정 부분을 사용하게 정할 수 있다.","a":"O","e":"공유물 사용방법은 공유자 사이의 협의나 관리결정으로 정할 수 있다."},{"p":20,"q":"소수지분권자는 공유물의 사용·수익 방법을 단독으로 정할 수 없다.","a":"O","e":"관리사항은 지분 과반수로 결정한다. 소수지분권자가 일방적으로 정할 수 없다."},{"p":20,"q":"공유자 1인이 공유물 전부를 매매계약의 목적물로 삼은 경우, 그 계약은 언제나 전부 무효이다.","a":"X","e":"계약 자체가 당연히 전부 무효는 아니다. 다른 공유자 지분에 관하여는 타인권리매매 문제가 된다."},{"p":20,"q":"공유자 1인이 다른 공유자의 동의 없이 공유물 전체를 처분하더라도 자기 지분 범위에서는 유효할 수 있다.","a":"O","e":"공유자의 처분권은 자기 지분에 미치므로 자기 지분 범위에서는 유효할 수 있다."},{"p":20,"q":"공유물의 임대는 원칙적으로 관리행위에 속한다.","a":"O","e":"임대는 공유물을 이용하게 하는 관리행위로 보는 것이 원칙이다."},{"p":20,"q":"공유물을 장기간 임대하여 사실상 처분과 같은 결과가 되는 경우에도 언제나 단순 관리행위이다.","a":"X","e":"임대라도 기간·내용에 따라 처분 또는 변경에 준하는 경우가 문제될 수 있다. \"언제나\"가 틀렸다."},{"p":20,"q":"공유물의 보존행위는 공유자 각자가 단독으로 공유물 전부에 대하여 할 수 있다.","a":"O","e":"보존행위는 공유물의 현상 유지와 권리 보전을 위한 행위이므로 각자 단독 가능하다."},{"p":20,"q":"공유물의 보존행위도 지분 과반수로 결정하여야 한다.","a":"X","e":"보존행위는 각 공유자가 단독으로 할 수 있다. 지분 과반수는 관리행위 기준이다."},{"p":20,"q":"공유물의 처분·변경, 관리, 보존은 각각 전원동의, 지분과반수, 각자 단독으로 구별한다.","a":"O","e":"공동소유에서 가장 중요한 비교 공식이다."},{"p":20,"q":"공유물에 관하여 제3자 명의의 원인무효 등기가 있는 경우, 각 공유자는 보존행위로서 등기 전부의 말소를 청구할 수 있다.","a":"O","e":"원인무효 등기 말소청구는 공유물 보존행위이므로 각 공유자가 등기 전부의 말소를 청구할 수 있다."},{"p":20,"q":"공유물에 관하여 제3자 명의의 원인무효 등기가 있더라도 각 공유자는 자기 지분에 관한 말소만 청구할 수 있다.","a":"X","e":"보존행위로서 등기 전부의 말소를 청구할 수 있다."},{"p":20,"q":"공유자 1인은 공유물에 관한 원인무효의 등기에 대하여 각 공유자에게 지분별로 진정명의회복을 원인으로 한 소유권이전등기를 청구할 수 있다.","a":"O","e":"원인무효 등기에 대한 보존행위의 변형으로 지분별 진정명의회복등기청구가 가능하다."},{"p":20,"q":"소수지분권자가 다른 공유자와 협의 없이 공유물 전부를 독점 점유하는 경우, 다른 소수지분권자는 보존행위로서 공유물 전부의 인도를 청구할 수 있다.","a":"X","e":"전합 판례상 전부 인도청구는 허용되지 않고, 방해상태 제거·공동점유 방해금지 등이 가능하다."},{"p":20,"q":"공유자 1인이 공유물 전부를 독점 점유하더라도 다른 공유자는 항상 공유물 전부의 반환을 청구할 수 없다.","a":"O","e":"공유자도 지분권에 기초한 점유권원이 있으므로 무권원자와 동일하게 전부 반환청구를 할 수 없다."},{"p":20,"q":"공유자 1인이 공유물 전부를 배타적으로 사용하면 다른 공유자에게 지분 상당 부당이득반환의무를 질 수 있다.","a":"O","e":"다른 공유자가 사용·수익하지 못하면 배타적 사용자에게 지분 상당 부당이득반환의무가 인정된다."},{"p":20,"q":"공유물 전부를 배타적으로 점유한 공유자는 다른 공유자에게 부당이득반환의무를 지지 않는다.","a":"X","e":"배타적 사용으로 다른 공유자의 사용·수익을 배제하면 지분 상당 부당이득반환의무가 있다."},{"p":20,"q":"공유물 침해행위가 불법행위를 구성하는 경우, 손해배상청구는 각 공유자가 자신의 지분 범위에서 행사한다.","a":"O","e":"손해배상 또는 부당이득반환청구는 각 공유자의 지분 범위 내에서 행사하는 것이 원칙이다."},{"p":20,"q":"공유물 침해에 대한 손해배상청구는 보존행위이므로 각 공유자가 손해 전부를 청구할 수 있다.","a":"X","e":"손해배상·부당이득반환청구는 금전채권으로 지분 범위에서 행사한다. 원인무효 등기 말소청구와 구별해야 한다."},{"p":20,"q":"과반수 지분권자로부터 공유물 사용·수익을 허락받은 제3자는 소수지분권자에 대하여도 적법하게 점유할 수 있다.","a":"O","e":"과반수 지분권자의 관리결정에 따른 사용허락은 소수지분권자에게도 효력이 미친다."},{"p":20,"q":"과반수 지분권자로부터 사용허락을 받은 제3자에 대하여 소수지분권자는 원칙적으로 목적물 반환청구를 할 수 없다.","a":"O","e":"제3자의 점유는 관리결정에 기초한 적법점유이므로 소수지분권자의 반환청구가 제한된다."},{"p":20,"q":"과반수 지분권자로부터 사용허락을 받은 제3자라도 소수지분권자에 대해서는 무권원 점유자이다.","a":"X","e":"과반수 지분권자의 관리결정은 공유물 사용·수익 방법에 관한 적법한 결정이다."},{"p":20,"q":"소수지분권자는 과반수 지분권자의 관리결정이 있더라도 그 결정이 현저히 부당한 경우 다툴 여지가 있다.","a":"O","e":"관리결정도 신의칙·권리남용 등 일반원칙에 반하면 제한될 수 있다."},{"p":20,"q":"공유자 1인이 제3자에게 자기 지분만을 임대한 경우, 제3자는 당연히 공유물 전부를 배타적으로 사용할 수 있다.","a":"X","e":"지분 임대만으로 공유물 전부의 배타적 사용권이 당연히 생기는 것은 아니다. 사용방법 결정이 필요하다."},{"p":20,"q":"공유자 사이의 공유물 사용·수익에 관한 결정은 원칙적으로 특별승계인에게도 승계될 수 있다.","a":"O","e":"공유물 관리방법에 관한 결정은 공유지분의 특별승계인에게도 일정 범위에서 효력이 문제된다."},{"p":20,"q":"공유지분의 특별승계인은 종전 공유자 사이의 모든 채권적 약정에 언제나 구속된다.","a":"X","e":"특별승계인에게 당연히 모든 채권적 약정이 승계되는 것은 아니다."},{"p":20,"q":"공유자 사이의 내부적 사용약정이 있더라도 공유물 전체의 소유형태가 구분소유로 바뀌는 것은 아니다.","a":"O","e":"사용구분과 소유구분은 다르다. 공유자들이 특정 부분을 사용해도 지분공유의 법률관계는 유지된다."},{"p":20,"q":"공유자가 공유물의 보존을 위하여 지출한 비용은 다른 공유자에게 지분비율에 따라 상환을 청구할 수 있다.","a":"O","e":"공유물의 보존·관리 비용은 내부적으로 지분비율에 따라 부담하는 것이 원칙이다."},{"p":20,"q":"공유물의 관리비용은 공유자 중 실제 사용한 자만 부담하고, 지분비율과는 무관하다.","a":"X","e":"공유물에 관한 비용과 부담은 원칙적으로 지분비율에 따른다."},{"p":20,"q":"공유자는 다른 공유자가 지분비율에 따른 비용 부담의무를 1년 이상 이행하지 않으면 상당한 가액으로 그 지분을 매수할 수 있는 경우가 있다.","a":"O","e":"민법상 공유자의 비용 부담 불이행에 대한 지분매수청구가 문제될 수 있다."},{"p":20,"q":"공유자는 언제든지 공유물의 분할을 청구할 수 있다.","a":"O","e":"공유물분할청구권은 공유관계 해소를 위한 권리이며 원칙적으로 언제든지 행사할 수 있다."},{"p":20,"q":"공유물분할청구권은 일종의 형성권이다.","a":"O","e":"분할청구에 의하여 공유관계를 해소하는 법률관계 형성을 목적으로 하므로 형성권으로 본다."},{"p":20,"q":"공유자는 5년을 넘지 않는 기간 내에서 분할하지 아니할 것을 약정할 수 있다.","a":"O","e":"분할금지특약은 가능하지만 기간은 5년을 넘지 못한다."},{"p":20,"q":"공유물분할금지특약은 10년까지 가능하다.","a":"X","e":"분할금지특약은 5년을 넘지 못한다."},{"p":20,"q":"공유물분할금지특약은 갱신할 수 있으나, 갱신기간도 5년을 넘지 못한다.","a":"O","e":"분할금지특약은 갱신 가능하지만 갱신기간 역시 5년 이하이다."},{"p":20,"q":"공유물분할청구권은 공유자 사이의 약정으로 영구히 배제할 수 있다.","a":"X","e":"영구적 분할금지는 허용되지 않는다. 5년 이하 약정만 가능하다."},{"p":20,"q":"공유물분할의 방법은 우선 공유자 사이의 협의에 의한다.","a":"O","e":"협의분할이 원칙이고 협의가 성립하지 않으면 법원에 재판상 분할을 청구한다."},{"p":20,"q":"공유물분할에 관한 협의가 성립하지 않으면 법원에 분할을 청구할 수 있다.","a":"O","e":"협의불성립 시 재판상 분할로 넘어간다."},{"p":20,"q":"재판상 공유물분할은 원칙적으로 현물분할을 우선한다.","a":"O","e":"가능하면 현물분할이 원칙이고, 현물분할이 곤란하거나 현저한 가치감소가 있으면 경매분할 등이 가능하다."},{"p":20,"q":"공유물분할소송에서 법원은 언제나 경매분할만 명하여야 한다.","a":"X","e":"경매분할은 현물분할 곤란 등 예외적 방법이다."},{"p":20,"q":"현물분할로 공유물의 가액이 현저히 감소할 염려가 있으면 법원은 경매를 명할 수 있다.","a":"O","e":"현물분할 곤란 또는 가치 현저 감소 시 대금분할을 위한 경매가 가능하다."},{"p":20,"q":"공유물분할에서 일부 공유자에게 현물을 취득하게 하고 다른 공유자에게 가격배상을 하게 하는 방식도 가능하다.","a":"O","e":"전면적 가격배상 방식도 공평한 분할방법으로 허용될 수 있다."},{"p":20,"q":"공유물분할의 효과는 공유관계의 소멸이지, 새로운 매매계약의 체결이 아니다.","a":"O","e":"분할은 공유관계를 해소하여 단독소유 등으로 전환시키는 법률관계이다."},{"p":20,"q":"공유물분할로 각 공유자가 취득하는 부분은 원칙적으로 공유지분의 교환 또는 매매로만 본다.","a":"X","e":"분할은 공유관계 해소의 특수한 법률관계이고 단순 매매·교환과 동일시하지 않는다."},{"p":20,"q":"공유물분할청구는 공유자 전원이 당사자가 되어야 하는 고유필수적 공동소송이다.","a":"O","e":"분할판결의 효력이 공유자 전원에게 미치므로 전원이 당사자가 되어야 한다."},{"p":20,"q":"공유물분할소송은 일부 공유자만을 상대로도 충분하고, 나머지 공유자는 판결의 영향을 받지 않는다.","a":"X","e":"공유물분할은 공유자 전원을 대상으로 하는 필수적 공동소송이다."},{"p":20,"q":"공유물분할청구권은 소멸시효에 걸리지 않는다고 보는 것이 원칙이다.","a":"O","e":"소유권에 기초한 공유관계 해소권으로서 일반 채권적 청구권과 다르게 이해한다."},{"p":20,"q":"공유물분할금지특약이 있으면 보존행위도 금지된다.","a":"X","e":"분할금지특약은 공유관계 해소를 제한할 뿐, 보존행위 자체를 금지하는 것은 아니다."},{"p":20,"q":"분할금지특약이 있더라도 공유지분의 처분은 원칙적으로 가능하다.","a":"O","e":"분할금지특약은 분할청구 제한이지 지분처분 자체의 당연한 금지가 아니다."},{"p":20,"q":"공유물분할금지특약은 부동산인 경우 등기하여야 제3자에게 대항할 수 있는 문제가 생긴다.","a":"O","e":"분할금지특약은 특별승계인에게 대항하려면 공시가 문제된다."},{"p":20,"q":"공유물분할 후 각 공유자는 담보책임을 부담할 수 있다.","a":"O","e":"분할은 각자가 지분에 따라 재산을 나누는 것이므로 상호 담보책임이 문제될 수 있다."},{"p":20,"q":"공유물분할은 공유자의 채권자가 대위하여 청구할 수 있는 경우가 있다.","a":"O","e":"공유물분할청구권은 재산권적 성격이 있어 채권자대위가 문제될 수 있다."},{"p":20,"q":"공유자의 지분에 저당권이 설정된 경우, 공유물분할은 그 저당권자에게 영향을 줄 수 있으므로 배당·대가관계를 주의해야 한다.","a":"O","e":"지분 위의 담보권은 분할 후 취득물이나 대가에 미치는 문제가 생긴다."},{"p":20,"q":"공유물분할은 반드시 등기를 해야만 공유관계가 해소되는 것은 아니다.","a":"X","e":"부동산 물권변동으로서 분할에 따른 소유권 귀속은 등기와 연결된다."},{"p":20,"q":"공유물분할판결이 확정되면 등기 없이도 부동산 물권변동의 효력이 발생한다는 식의 지문은 주의해야 한다.","a":"O","e":"판결 확정과 등기절차를 구별해야 한다."},{"p":20,"q":"합유자는 전원의 동의 없이 합유물에 대한 지분을 처분하지 못한다.","a":"O","e":"합유지분 처분은 조합관계의 인적 결합 때문에 전원의 동의가 필요하다."},{"p":20,"q":"합유자는 조합체가 존속하는 동안 합유물분할청구를 할 수 없다.","a":"O","e":"합유물은 조합의 공동목적 달성을 위한 재산이므로 조합 존속 중 분할청구가 제한된다."},{"p":20,"q":"합유물의 보존행위는 합유자 각자가 단독으로 할 수 있다.","a":"O","e":"합유물 보존행위는 각 합유자가 단독으로 전부에 대해 할 수 있다."},{"p":20,"q":"합유물의 처분·변경은 합유자 전원의 동의가 필요하다.","a":"O","e":"합유물 자체의 처분·변경은 전원 동의가 필요하다."},{"p":20,"q":"합유물의 관리행위는 언제나 합유자 전원의 동의가 있어야 한다.","a":"X","e":"관리는 조합계약에 따르고, 특별한 정함이 없으면 조합원의 과반수로 결정한다."},{"p":20,"q":"합유자는 자기 합유지분을 자유롭게 양도할 수 있다.","a":"X","e":"합유지분은 전원의 동의가 있어야 처분 가능하다."},{"p":20,"q":"합유지분은 인정되지만, 공유지분처럼 독립성이 강하지 않다.","a":"O","e":"합유지분은 조합관계에 묶여 있어 자유처분·자유분할이 제한된다."},{"p":20,"q":"합유자의 채권자는 합유자의 지분에 대하여 당연히 강제집행할 수 있다.","a":"X","e":"합유지분은 독립처분성이 약하므로 강제집행도 공유지분과 동일하게 보기는 어렵다."},{"p":20,"q":"합유물에 관한 원인무효의 소유권이전등기 말소청구는 보존행위로서 합유자 각자가 할 수 있다.","a":"O","e":"합유물 보존행위는 각 합유자가 할 수 있으므로 원인무효 등기 말소소송도 각자가 가능하다."},{"p":20,"q":"합유자 중 일부가 사망하면 특별한 약정이 없는 한 그 상속인이 당연히 합유자로서의 지위를 승계한다.","a":"X","e":"특별한 약정이 없으면 사망자의 상속인이 당연히 합유자 지위를 승계하지 않는다. 잔존 합유자에게 귀속된다."},{"p":20,"q":"합유자 중 일부가 사망하고 잔존 합유자가 2인 이상이면 해당 부동산은 잔존 합유자의 합유로 귀속된다.","a":"O","e":"특약이 없으면 상속인이 합유자가 되는 것이 아니라 잔존 합유자들의 합유로 귀속된다."},{"p":20,"q":"합유자 중 일부가 사망하고 잔존 합유자가 1인뿐이면 해당 부동산은 잔존 합유자의 단독소유로 귀속될 수 있다.","a":"O","e":"잔존 합유자가 1인이면 더 이상 합유관계가 성립하지 않아 단독소유로 귀속된다."},{"p":20,"q":"합유는 조합체의 해산 또는 합유물의 양도로 종료한다.","a":"O","e":"민법은 합유의 종료사유로 조합체 해산 또는 합유물 양도를 규정한다."},{"p":20,"q":"조합체 해산에 따른 합유물 분할에는 공유물분할에 관한 규정이 준용된다.","a":"O","e":"합유관계가 종료된 뒤의 분할에는 공유물분할 규정이 준용된다."},{"p":20,"q":"합유는 언제나 등기능력 없는 단체의 재산소유형태이다.","a":"X","e":"합유는 조합재산 소유형태이고, 등기능력 없는 사단의 재산소유형태는 총유이다."},{"p":20,"q":"동업자들이 공동사업을 위하여 취득한 재산은 사안에 따라 합유로 볼 수 있다.","a":"O","e":"조합관계에서 공동사업 목적의 재산은 합유로 귀속될 수 있다."},{"p":20,"q":"합유자는 조합계약에서 정한 사용·수익 방법에 따라 합유물을 사용·수익한다.","a":"O","e":"합유물 사용·수익은 지분비율 및 조합계약에 따른다."},{"p":20,"q":"합유자의 보존행위는 합유물 전체에 대하여 할 수 없고 자기 지분에 한해서만 할 수 있다.","a":"X","e":"합유물 보존행위는 합유자 각자가 합유물 전부에 관하여 할 수 있다."},{"p":20,"q":"합유지분 처분에 전원 동의가 필요한 것은 합유의 인적 결합관계 때문이다.","a":"O","e":"합유는 조합관계에 기초하므로 구성원 변경에 전원의 이해관계가 크다."},{"p":20,"q":"합유는 공유보다 인적 결합관계가 약하다.","a":"X","e":"인적 결합은 공유 < 합유 < 총유 순으로 강해진다."},{"p":20,"q":"법인이 아닌 사단의 사원이 집합체로서 물건을 소유할 때에는 총유로 한다.","a":"O","e":"민법 제275조의 기본 내용이다."},{"p":20,"q":"권리능력 없는 사단의 재산은 사원 전원의 공유에 속한다.","a":"X","e":"권리능력 없는 사단의 재산은 총유이다. 공유가 아니다."},{"p":20,"q":"종중재산은 원칙적으로 종중원들의 총유에 속한다.","a":"O","e":"종중은 권리능력 없는 사단으로 보아 그 재산은 총유에 속한다."},{"p":20,"q":"비법인재단의 재산도 구성원 총유에 속한다.","a":"X","e":"비법인사단은 총유, 비법인재단은 재단 자체의 소유처럼 취급된다. 구성원 총유가 아니다."},{"p":20,"q":"총유물의 관리 및 처분은 사원총회의 결의에 의한다.","a":"O","e":"총유물 관리·처분은 정관 기타 규약 또는 사원총회 결의에 따른다."},{"p":20,"q":"총유물의 보존행위는 각 사원이 단독으로 할 수 있다.","a":"X","e":"총유물 보존행위는 원칙적으로 사원총회 결의 또는 정관 규정에 따른다."},{"p":20,"q":"총유물에 관한 소송은 비법인사단 명의 또는 사원 전원의 공동소송으로 제기하는 것이 원칙이다.","a":"O","e":"총유물 소송은 사원 각자가 단독으로 할 수 있는 공유·합유 보존행위와 구별된다."},{"p":20,"q":"각 사원은 정관 기타 규약에 따라 총유물을 사용·수익할 수 있다.","a":"O","e":"총유물의 사용·수익은 정관·규약에 따른다."},{"p":20,"q":"총유물에 대한 각 사원의 사용·수익권은 지분권에 기초한다.","a":"X","e":"총유에는 지분이 없고, 사용·수익은 정관 기타 규약에 근거한다."},{"p":20,"q":"총유자는 자기 지분에 기하여 총유물의 분할을 청구할 수 없다.","a":"O","e":"총유에는 지분이 없으므로 지분에 기한 분할청구가 불가능하다."},{"p":20,"q":"총유물의 처분에 관한 사원총회 결의 없이 대표자가 한 처분행위는 원칙적으로 무효이다.","a":"O","e":"총유물 관리·처분에는 총회결의가 필요하다."},{"p":20,"q":"권리능력 없는 사단의 대표자는 총회결의 없이 총유물을 자유롭게 처분할 수 있다.","a":"X","e":"총유물 처분은 사원총회 결의가 필요하다. 대표자 단독 처분은 원칙적으로 무효이다."},{"p":20,"q":"총유물 관리·처분 결의는 사원총회에서 하되, 정관이나 규약에 다른 정함이 있으면 그에 따른다.","a":"O","e":"총유는 정관 기타 규약을 우선하고, 없으면 민법 규정에 따른다."},{"p":20,"q":"총유물에 대한 각 사원의 권리·의무는 사원의 지위와 분리하여 양도할 수 없다.","a":"O","e":"총유관계에서 사원의 사용·수익권은 사원 지위에 결합한다."},{"p":20,"q":"권리능력 없는 사단은 그 명의로 등기할 수 없다.","a":"X","e":"비법인사단도 일정한 요건을 갖추면 그 명의로 부동산등기가 가능하다."},{"p":20,"q":"권리능력 없는 사단은 소송상 당사자능력이 인정될 수 있다.","a":"O","e":"대표자 또는 관리인이 있는 비법인사단은 소송상 당사자능력이 인정된다."},{"p":20,"q":"권리능력 없는 사단의 채무는 원칙적으로 사단의 총유재산으로 책임지고, 구성원 개인이 당연히 분할책임을 지는 것은 아니다.","a":"O","e":"비법인사단 채무는 원칙적으로 사단재산으로 책임진다."},{"p":20,"q":"비법인사단의 구성원은 사단 채무에 대하여 언제나 균등한 분할책임을 진다.","a":"X","e":"구성원 개인이 당연히 분할책임을 지는 것은 아니다."},{"p":20,"q":"법인 아닌 사단이 타인 채무를 보증하는 행위는 언제나 총유물의 관리·처분행위이다.","a":"X","e":"단순 채무부담행위와 총유물 관리·처분행위는 구별된다."},{"p":20,"q":"종중은 공동선조의 후손들로 구성되는 자연발생적 집단으로서 특별한 조직행위가 없어도 성립할 수 있다.","a":"O","e":"종중은 공동선조와 분묘수호·제사·친목 등을 목적으로 하는 자연발생적 종족단체이다."},{"p":20,"q":"종중원은 종중에서 자유롭게 탈퇴할 수 있고, 종중총회는 일부 종중원을 축출할 수 있다.","a":"X","e":"종중원 지위는 혈연관계에 기초하므로 임의탈퇴·임의축출이 인정되지 않는다."},{"p":20,"q":"종중 구성원의 자격을 성년 남자로만 제한한 종래 관습법은 더 이상 효력이 없다.","a":"O","e":"여성도 종중원 자격이 인정된다. 성년 남자 제한 관습은 효력을 잃었다."},{"p":20,"q":"종중총회는 특별한 사정이 없는 한 국내에 거주하고 소재가 분명한 모든 종중원에게 소집통지를 해야 한다.","a":"O","e":"종중총회의 적법성을 판단할 때 소집통지 절차가 중요하다."},{"p":20,"q":"종중총회 소집통지는 반드시 서면으로 하여야 하며 구두나 전화통지는 언제나 무효이다.","a":"X","e":"규약에 특별한 제한이 없으면 구두·전화통지도 가능할 수 있다."},{"p":20,"q":"종중재산 처분 결의에서 소집통지를 받지 못한 종중원이 있어도 결의 내용이 타당하면 언제나 유효하다.","a":"X","e":"소집통지 절차에 하자가 있으면 결의 효력이 문제된다."},{"p":20,"q":"공유·합유·총유를 구별할 때 가장 먼저 볼 것은 지분 인정 여부와 인적 결합관계의 강도이다.","a":"O","e":"공유는 지분 자유, 합유는 조합관계, 총유는 지분 없음이 핵심이다."},{"p":20,"q":"공유는 지분 처분 자유, 합유는 전원동의, 총유는 지분 자체가 없다는 공식이 핵심이다.","a":"O","e":"공동소유 비교표에서 가장 자주 나오는 시험 공식이다."},{"p":20,"q":"보존행위는 공유·합유·총유 모두 각 구성원이 단독으로 할 수 있다는 공식이 맞다.","a":"X","e":"공유와 합유는 각자 가능하지만 총유는 총회결의 또는 정관 규정이 필요하다."},{"p":20,"q":"관리행위는 공유는 지분 과반수, 합유는 조합계약·조합원 과반수, 총유는 사원총회 결의로 정리한다.","a":"O","e":"공동소유의 관리행위 비교 공식이다."},{"p":20,"q":"처분·변경행위는 공유와 합유는 전원동의, 총유는 사원총회 결의로 정리한다.","a":"O","e":"처분·변경은 권리관계에 중대한 영향을 주므로 공유·합유에서는 전원동의, 총유에서는 총회결의가 필요하다."},{"p":20,"q":"분할청구는 공유는 가능, 합유는 조합 존속 중 불가, 총유는 불가로 정리한다.","a":"O","e":"공동소유 분할청구 비교의 핵심이다."},{"p":20,"q":"공동소유 파트에서 “언제나”, “각자 단독”, “전원동의 없이”, “지분이 있으므로”라는 표현은 함정으로 자주 쓰인다.","a":"O","e":"공유·합유·총유 중 어느 유형인지에 따라 결론이 완전히 달라진다."},{"p":20,"q":"공동소유는 물권법에서 시험에 나올 때 단순 정의보다 공유·합유·총유 비교형 판례지문으로 출제되는 경우가 많다.","a":"O","e":"특히 공유물 독점점유, 과반수 지분권자의 사용허락, 총유물 소송·총회결의가 핵심이다."},{"p":21,"q":"지상권자는 타인의 토지에 건물 기타 공작물이나 수목을 소유하기 위하여 그 토지를 사용할 수 있다.","a":"O","e":"지상권의 기본 내용이다. 지상권은 토지의 소유권을 취득하는 권리가 아니라 타인의 토지를 사용하여 지상물을 소유하는 용익물권이다."},{"p":21,"q":"지상권은 반드시 지상물이 현실적으로 존재하여야만 성립한다.","a":"X","e":"지상권은 지상물 소유를 목적으로 설정되는 권리이나, 설정 당시 지상물이 현실적으로 존재할 필요는 없다. 장래 건물 등의 소유를 위해 설정할 수 있다."},{"p":21,"q":"지상권은 설정계약과 등기에 의하여 성립할 수 있다.","a":"O","e":"법률행위에 의한 지상권 설정은 물권변동이므로 원칙적으로 설정계약과 등기가 필요하다."},{"p":21,"q":"지상권의 지료 지급은 지상권의 성립요건이다.","a":"X","e":"지료는 지상권의 성립요건이 아니다. 유상으로도, 무상으로도 설정할 수 있다."},{"p":21,"q":"지상권은 무상으로 설정할 수 있다.","a":"O","e":"지료 약정은 필수요소가 아니므로 무상의 지상권도 가능하다."},{"p":21,"q":"지상권의 존속기간에 관하여 민법은 최장기간을 제한하고 있으므로 영구무한의 지상권 설정은 허용되지 않는다.","a":"X","e":"지상권은 최단기간 제한은 있으나 최장기간 제한은 없다. 판례상 영구무한의 지상권 설정도 가능하다."},{"p":21,"q":"견고한 건물 또는 수목의 소유를 목적으로 하는 지상권의 최단존속기간은 30년이다.","a":"O","e":"민법상 수목과 견고한 건물 소유 목적의 지상권은 최소 30년 이상이어야 한다."},{"p":21,"q":"견고하지 않은 기타 건물의 소유를 목적으로 하는 지상권의 최단존속기간은 15년이다.","a":"O","e":"기타 건물의 소유 목적 지상권은 15년 이상으로 한다."},{"p":21,"q":"공작물의 소유를 목적으로 하는 지상권의 최단존속기간은 5년이다.","a":"O","e":"공작물 소유 목적 지상권은 최단 5년이다."},{"p":21,"q":"지상권 설정행위로 최단존속기간보다 짧은 기간을 정하면 그 약정은 무효이고 지상권 자체도 성립하지 않는다.","a":"X","e":"최단기간보다 짧게 정한 경우 지상권 자체가 무효가 되는 것이 아니라 민법상 최단기간까지 연장된다."},{"p":21,"q":"존속기간을 정하지 않은 지상권은 지상물의 종류와 구조에 따른 최단존속기간을 존속기간으로 한다.","a":"O","e":"설정행위로 기간을 정하지 않으면 민법상 최단존속기간이 적용된다."},{"p":21,"q":"기존 건물의 사용만을 목적으로 지상권을 설정한 경우에는 지상권 최단존속기간 규정이 당연히 적용된다.","a":"X","e":"최단존속기간 규정은 건물·수목 등의 소유를 목적으로 하는 경우를 대상으로 하므로, 기존 건물의 사용 목적 지상권에는 적용되지 않는다고 본다."},{"p":21,"q":"지상권자는 지상권설정자의 동의 없이 지상권을 양도할 수 있다.","a":"O","e":"지상권자는 그 권리를 양도하거나 존속기간 내에서 토지를 임대할 수 있다. 설정자의 동의는 필요 없다."},{"p":21,"q":"지상권자는 지상권설정자의 동의 없이 지상권 존속기간 내에서 토지를 임대할 수 있다.","a":"O","e":"제282조에 따라 지상권자는 권리 존속기간 내에서 토지를 임대할 수 있다."},{"p":21,"q":"지상권의 양도·임대·담보제공을 금지하는 특약은 유효하다.","a":"X","e":"지상권자의 처분 자유를 보장하는 규정은 편면적 강행규정으로 이해되어 양도·임대·담보제공 금지특약은 무효이다."},{"p":21,"q":"지상권은 저당권의 목적이 될 수 있다.","a":"O","e":"지상권은 재산권으로서 담보제공이 가능하고, 담보제공 방법은 저당권 설정이다."},{"p":21,"q":"지료에 관한 약정이 등기되지 않았더라도 지상권의 전득자에게 당연히 대항할 수 있다.","a":"X","e":"지료 약정은 등기하여야 제3자에게 대항할 수 있다. 등기하지 않으면 전득자에게 지료 지급을 청구하기 어렵다."},{"p":21,"q":"법정지상권의 경우에는 지료 지급의무가 있음이 원칙이다.","a":"O","e":"법정지상권은 무상이라고 보지 않고 지료 지급의무가 있는 것이 원칙이다."},{"p":21,"q":"지상권자가 2년 이상의 지료를 지급하지 아니하면 지상권설정자는 지상권의 소멸을 청구할 수 있다.","a":"O","e":"민법 제287조의 지상권소멸청구권이다."},{"p":21,"q":"지상권자의 지료 연체액 합계가 2년분에 달하면 지상권설정자의 소멸청구로 지상권은 말소등기 없이도 소멸할 수 있다.","a":"O","e":"소멸청구권 행사로 지상권 소멸의 효과가 발생한다. 말소등기는 소멸의 성립요건이 아니다."},{"p":21,"q":"지상권에 저당권이 설정되어 있는 경우에도 지상권설정자의 지상권소멸청구는 저당권자에게 통지 없이 즉시 효력이 생긴다.","a":"X","e":"지상권이 저당권의 목적이 된 경우 소멸청구는 저당권자에게 통지한 후 상당한 기간이 경과해야 효력이 생긴다."},{"p":21,"q":"지료연체가 토지소유권 양도 전후에 걸쳐 합계 2년분이 된 경우, 새 소유자에 대한 연체가 2년분이 되지 않더라도 새 소유자는 지상권소멸청구를 할 수 있다.","a":"X","e":"토지소유권 양도 전후의 연체를 단순 합산하여 새 소유자가 소멸청구할 수는 없다. 새 소유자에 대한 연체가 2년분에 달해야 한다."},{"p":21,"q":"지상권자가 지상권을 포기하려면 원칙적으로 말소등기를 하여야 지상권 소멸의 효과가 생긴다.","a":"O","e":"지상권 포기는 물권의 처분에 해당하므로 등기가 필요하다. 지료 2년 연체에 따른 소멸청구와 구별한다."},{"p":21,"q":"지상권이 기간만료로 소멸한 경우에도 건물 기타 공작물이나 수목이 현존하면 지상권자는 계약갱신을 청구할 수 있다.","a":"O","e":"민법 제283조 제1항의 갱신청구권이다. 지상물이 현존해야 한다."},{"p":21,"q":"지상권설정자가 갱신을 원하지 않으면 지상권자는 상당한 가액으로 지상물의 매수를 청구할 수 있다.","a":"O","e":"민법 제283조 제2항의 지상물매수청구권이다. 형성권으로 보며 강행규정성이 있다."},{"p":21,"q":"지상물매수청구권은 지상권설정자의 승낙이 있어야 효력이 발생한다.","a":"X","e":"지상물매수청구권은 형성권이므로 지상권자의 일방적 의사표시로 매매 유사의 효과가 발생한다."},{"p":21,"q":"지상권자의 지상물매수청구권을 미리 포기하는 특약은 유효하다.","a":"X","e":"지상물매수청구권은 지상권자를 보호하기 위한 강행규정으로 보아 포기특약은 무효이다."},{"p":21,"q":"지상권자는 지상권이 존속하는 동안 지상권에 기한 물권적 청구권을 행사할 수 있다.","a":"O","e":"지상권 침해 시 반환청구, 방해제거청구, 방해예방청구가 인정된다."},{"p":21,"q":"저당권과 함께 설정된 담보목적의 무상 지상권은 언제나 토지 사용·수익 자체를 목적으로 하므로 무단점유자에게 임료 상당 손해배상을 청구할 수 있다.","a":"X","e":"대출담보 목적의 무상 지상권이 채무자 등의 사용·수익을 배제하지 않은 경우, 담보가치 확보 목적이므로 지상권 자체 침해를 이유로 임료 상당 손해배상을 구할 수 없다고 본 사례가 있다."},{"p":21,"q":"관습법상 법정지상권은 법률행위가 아니라 법률규정 또는 관습법에 의하여 성립하는 지상권이다.","a":"O","e":"토지와 건물이 동일인 소유였다가 일정한 사유로 소유자가 달라지는 경우 건물 존속 보호를 위해 인정되는 지상권이다."},{"p":21,"q":"관습법상 법정지상권이 있는 건물을 양수한 자는 지상권 이전등기를 마치지 않았더라도 토지소유자에게 언제나 지상권 취득을 주장할 수 있다.","a":"X","e":"건물양수인은 법정지상권 양도의 묵시적 합의가 있다고 볼 수 있으나, 지상권 자체 취득에는 등기가 필요하다. 다만 토지소유자는 건물철거를 곧바로 청구할 수 없는 경우가 있다."},{"p":21,"q":"관습법상 법정지상권이 있는 건물의 양수인은 토지사용권을 취득할 지위가 인정되므로, 토지소유자가 곧바로 건물철거를 청구하는 것은 제한될 수 있다.","a":"O","e":"판례는 법정지상권 양도의 묵시적 합의를 인정하여 양수인이 등기를 청구할 수 있는 지위에 있다고 보아 철거청구를 제한한다."},{"p":21,"q":"관습법상 법정지상권이 있는 건물의 양수인이 지상권등기를 마치지 않았더라도 토지를 사용하면 사용료 상당 부당이득반환의무는 문제될 수 있다.","a":"O","e":"건물철거청구가 제한되더라도 토지 사용료 상당의 부당이득은 별개의 문제이다."},{"p":21,"q":"구분지상권은 토지의 지하 또는 지상의 공간에 상하의 범위를 정하여 설정할 수 있다.","a":"O","e":"구분지상권은 지하·지상의 일정 공간을 목적으로 하며 상하 범위가 특정되어야 한다."},{"p":21,"q":"구분지상권은 수목의 소유를 위하여도 설정할 수 있다.","a":"X","e":"구분지상권은 지하 또는 지상의 공간에 건물 기타 공작물을 소유하기 위한 것이므로 수목 소유 목적은 인정되지 않는다."},{"p":21,"q":"구분지상권 설정행위로 토지 사용을 제한할 수 있다.","a":"O","e":"민법은 구분지상권 행사에 필요한 범위에서 설정행위로 토지 사용을 제한할 수 있음을 인정한다."},{"p":21,"q":"이미 제3자가 토지를 사용·수익할 권리를 가지고 있는 경우에는 어떤 경우에도 구분지상권을 설정할 수 없다.","a":"X","e":"그 권리자 및 그 권리를 목적으로 하는 권리를 가진 자 전원의 승낙이 있으면 구분지상권을 설정할 수 있다."},{"p":21,"q":"분묘기지권은 관습법상 인정되는 특수한 지상권 유사의 권리이다.","a":"O","e":"분묘의 기지 사용을 위하여 관습법상 인정되는 물권적 권리이다."},{"p":21,"q":"토지소유자가 자기 토지에 분묘를 설치한 뒤 분묘 철거 특약 없이 토지를 양도하면 분묘기지권이 성립할 수 있다.","a":"O","e":"양도형 분묘기지권이다. 토지 양도와 동시에 분묘기지권을 취득한다고 본다."},{"p":21,"q":"토지소유자의 승낙을 얻어 분묘를 설치한 경우 지료 약정이 없으면 원칙적으로 무상이다.","a":"O","e":"승낙형 분묘기지권은 지료 약정이 있으면 약정에 따르고, 없으면 무상이 원칙이다."},{"p":21,"q":"자기 토지에 분묘를 설치하고
